<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar System</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;}
  canvas{display:block;}
  #ui{position:fixed;top:12px;left:12px;z-index:10;color:#cfe;font:12px/1.6 monospace;
       background:rgba(8,10,20,.45);padding:10px 13px;border-radius:8px;
       border:1px solid rgba(120,160,220,.2);backdrop-filter:blur(3px);}
  #ui h1{margin:0 0 3px;font-size:12px;letter-spacing:2px;color:#fff;font-weight:600;}
  #ui .hint{opacity:.65;}
  #ui a{color:#8bf;text-decoration:none;}
  #ui a:hover{text-decoration:underline;}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div id="ui">
  <h1>SOLAR SYSTEM</h1>
  <div class="hint">drag &middot; orbit &nbsp; scroll &middot; zoom</div>
  <a href="index.html">&larr; gallery</a>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 3000);
camera.position.set(0,55,120);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = .35;
controls.minDistance = 25;
controls.maxDistance = 600;

// ---- starfield ----
const sGeo = new THREE.BufferGeometry(), SN = 3500, sPos = new Float32Array(SN*3);
for(let i=0;i<SN;i++){
  const r = 500+Math.random()*900, t = Math.random()*6.283, p = Math.acos(2*Math.random()-1);
  sPos[i*3]=r*Math.sin(p)*Math.cos(t); sPos[i*3+1]=r*Math.sin(p)*Math.sin(t); sPos[i*3+2]=r*Math.cos(p);
}
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos,3));
const stars = new THREE.Points(sGeo, new THREE.PointsMaterial({color:0xffffff,size:1.3,sizeAttenuation:true,transparent:true,opacity:.9}));
scene.add(stars);

// ---- sun ----
const sun = new THREE.Mesh(new THREE.SphereGeometry(11,64,64), new THREE.MeshBasicMaterial({color:0xffdd55}));
scene.add(sun);
sun.add(new THREE.Mesh(new THREE.SphereGeometry(14,32,32), new THREE.MeshBasicMaterial({color:0xff9922,transparent:true,opacity:.22})));
const light = new THREE.PointLight(0xffeecc, 3, 0, 0);
scene.add(light);
scene.add(new THREE.AmbientLight(0x223347, .8));

// ---- planets ----
const data = [
  {r:20, s:1.3, c:0xb7b7b7, sp:1.55, tilt:.02},
  {r:28, s:2.3, c:0xe0a877, sp:1.10, tilt:.05},
  {r:38, s:2.5, c:0x4f97e8, sp:.85, tilt:.10, moon:.35},
  {r:48, s:1.9, c:0xd85a35, sp:.66, tilt:.08, moon:.28},
  {r:66, s:5.2, c:0xdcae6a, sp:.40, tilt:.06, ring:true},
  {r:86, s:4.4, c:0xcdbd93, sp:.29, tilt:.22},
  {r:102, s:3.1, c:0x76dbe4, sp:.19, tilt:.13, moon:.3},
];
const planets = [];
for(const d of data){
  const pivot = new THREE.Object3D(); pivot.rotation.x = d.tilt; pivot.rotation.y = Math.random()*6.28; scene.add(pivot);
  const group = new THREE.Object3D(); group.position.x = d.r; pivot.add(group);
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(d.s,32,32), new THREE.MeshStandardMaterial({color:d.c,roughness:.85,metalness:.1}));
  group.add(mesh);
  const path = new THREE.Mesh(new THREE.RingGeometry(d.r-.06,d.r+.06,160), new THREE.MeshBasicMaterial({color:0x3a5f88,side:THREE.DoubleSide,transparent:true,opacity:.3}));
  path.rotation.x = Math.PI/2; pivot.add(path);
  if(d.moon){
    const mp = new THREE.Object3D(); group.add(mp);
    const moon = new THREE.Mesh(new THREE.SphereGeometry(d.s*d.moon,16,16), new THREE.MeshStandardMaterial({color:0xcfcfcf,roughness:1}));
    moon.position.x = d.s+2.2; mp.add(moon); d.mp = mp;
  }
  if(d.ring){
    const rg = new THREE.Mesh(new THREE.RingGeometry(d.s+2.2,d.s+6.5,72), new THREE.MeshBasicMaterial({color:0xd9c79c,side:THREE.DoubleSide,transparent:true,opacity:.55}));
    rg.rotation.x = Math.PI/2 - .35; group.add(rg);
  }
  d.pivot = pivot; d.mesh = mesh; planets.push(d);
}

// ---- bloom ----
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 1.3, .6, .15));

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});

const clock = new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt = clock.getDelta();
  sun.rotation.y += dt*.08;
  for(const d of planets){
    d.pivot.rotation.y += dt*d.sp*.35;
    d.mesh.rotation.y += dt*.6;
    if(d.mp) d.mp.rotation.y += dt*2.2;
  }
  stars.rotation.y += dt*.004;
  controls.update();
  composer.render();
})();
</script>
</body>
</html>
