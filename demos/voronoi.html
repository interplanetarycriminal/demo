<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;cursor:crosshair}
  canvas{position:fixed;top:0;left:0;display:block}
  #ui{position:fixed;top:10px;left:12px;z-index:10;font:12px/1.55 monospace;
      color:#cfe9ff;background:rgba(4,8,16,.38);padding:8px 11px;
      border:1px solid rgba(120,200,255,.28);border-radius:5px;pointer-events:none}
  #ui .t{color:#7fffd4;font-weight:bold;letter-spacing:1.5px}
  #ui .h{opacity:.72}
  #ui a{color:#7fd3ff;pointer-events:auto;text-decoration:none}
  #ui a:hover{color:#bfe9ff}
</style>
<div id="ui">
  <div class="t">VORONOI FIELD</div>
  <div class="h">mouse warps cells &middot; click reseeds motion</div>
  <div><a href="index.html">&larr; gallery</a></div>
</div>
<canvas id="c"></canvas>
<script>
var canvas=document.getElementById('c');
var gl=canvas.getContext('webgl')||canvas.getContext('experimental-webgl');
if(!gl)throw new Error('WebGL not available');

function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function prog(vs,fs){var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;}

var VS='attribute vec2 a_pos;void main(){gl_Position=vec4(a_pos,0.0,1.0);}';
var FS=[
'precision highp float;',
'uniform vec2 u_res;uniform float u_time;uniform vec2 u_mouse;uniform vec2 u_pts[16];',
'vec3 pal(float t){return 0.5+0.5*cos(6.28318*(t+vec3(0.0,0.33,0.67)));}',
'void main(){',
'  float aspect=u_res.x/u_res.y;',
'  vec2 p=gl_FragCoord.xy/u_res; p.x*=aspect;',
'  float f1=1e9,f2=1e9; int idx=0;',
'  for(int i=0;i<16;i++){',
'    vec2 c=u_pts[i]; c.x*=aspect;',
'    float d=distance(p,c);',
'    if(d<f1){f2=f1;f1=d;idx=i;} else if(d<f2){f2=d;}',
'  }',
'  vec2 m=u_mouse; m.x*=aspect;',
'  float dm=distance(p,m)*0.85;',           // mouse point pulls a slightly larger cell
'  if(dm<f1){f2=f1;f1=dm;idx=100;} else if(dm<f2){f2=dm;}',
'  float id=(idx==100)?0.5:float(idx)*0.0625;',
'  float edge=f2-f1;',
'  float border=1.0-smoothstep(0.0,0.028,edge);',
'  float pulse=0.5+0.5*sin(u_time*1.4+float(idx)*1.37);',
'  vec3 cell=pal(id+0.04*u_time*0.15);',
'  vec3 col=cell*(0.10+0.13*pulse);',
'  col*=0.55+0.75*clamp(f1*2.4,0.0,1.0);',   // interior gradient toward the site
'  vec3 neon=pal(id+0.32);',
'  col+=neon*border*1.7;',                   // glowing cell walls
'  float core=1.0-smoothstep(0.0,0.02,f1);',
'  col+=neon*core*1.4;',                      // bright feature-point dots
'  float mg=1.0-smoothstep(0.0,0.05,distance(p,m));',
'  col+=vec3(0.4,0.9,1.0)*mg*0.8;',           // mouse attractor halo
'  col=pow(clamp(col,0.0,1.0),vec3(0.85));',
'  gl_FragColor=vec4(col,1.0);',
'}'].join('\n');

var program=prog(VS,FS);
var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
var aPos=gl.getAttribLocation(program,'a_pos');
var uRes=gl.getUniformLocation(program,'u_res');
var uTime=gl.getUniformLocation(program,'u_time');
var uMouse=gl.getUniformLocation(program,'u_mouse');
var uPts=gl.getUniformLocation(program,'u_pts');

var pts=[],flat=new Float32Array(32);
function seed(){pts=[];for(var i=0;i<16;i++){pts.push({
  bx:Math.random(),by:Math.random(),r:0.05+Math.random()*0.19,
  sp:(0.18+Math.random()*0.6)*(Math.random()<0.5?-1:1),ph:Math.random()*6.283});}}
seed();

var mouse=[0.5,0.5];
window.addEventListener('mousemove',function(e){
  mouse[0]=e.clientX/innerWidth;mouse[1]=1.0-e.clientY/innerHeight;});
window.addEventListener('click',seed);
window.addEventListener('touchmove',function(e){var t=e.touches[0];
  mouse[0]=t.clientX/innerWidth;mouse[1]=1.0-t.clientY/innerHeight;},{passive:true});

function resize(){var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=Math.floor(innerWidth*dpr),h=Math.floor(innerHeight*dpr);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  gl.viewport(0,0,w,h);}

function frame(now){
  var t=now*0.001;resize();
  for(var i=0;i<16;i++){var o=pts[i];
    flat[i*2]=o.bx+o.r*Math.cos(t*o.sp+o.ph);
    flat[i*2+1]=o.by+o.r*Math.sin(t*o.sp+o.ph);}
  gl.useProgram(program);
  gl.enableVertexAttribArray(aPos);
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
  gl.uniform2f(uRes,canvas.width,canvas.height);
  gl.uniform1f(uTime,t);
  gl.uniform2f(uMouse,mouse[0],mouse[1]);
  gl.uniform2fv(uPts,flat);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
