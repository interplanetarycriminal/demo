<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravity Sandbox</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}
  canvas{display:block;position:fixed;inset:0;cursor:crosshair;touch-action:none}
  #ui{position:fixed;top:12px;left:12px;z-index:10;font:12px/1.6 ui-monospace,Menlo,monospace;
      color:#fc9;background:rgba(20,8,0,.45);padding:10px 14px;border:1px solid rgba(255,180,90,.25);
      border-radius:10px;backdrop-filter:blur(6px);max-height:52vh;overflow:auto}
  #ui b{color:#fff;letter-spacing:.12em}
  #ui a{color:#fb7;text-decoration:none}
  #ui a:hover{text-decoration:underline}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div id="ui"><b>GRAVITY SANDBOX</b><br>drag = slingshot a planet · c = clear · bodies: <span id="n">0</span><br><a href="index.html">← gallery</a></div>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),nEl=document.getElementById('n');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);}
addEventListener('resize',resize);resize();

const G=1600, bodies=[];
function sun(){return{x:W/2,y:H/2,vx:0,vy:0,m:900,r:26,hue:45,sun:true,trail:[]}}
function reset(){bodies.length=0;bodies.push(sun());
  for(let i=0;i<5;i++){                       // a few starter planets in orbit
    const a=Math.random()*Math.PI*2,d=120+Math.random()*Math.min(W,H)*.28,
          v=Math.sqrt(G*900/d)*(.95+Math.random()*.1);
    bodies.push({x:W/2+Math.cos(a)*d,y:H/2+Math.sin(a)*d,
      vx:-Math.sin(a)*v,vy:Math.cos(a)*v,m:2+Math.random()*6,
      r:3+Math.random()*4,hue:170+Math.random()*160,trail:[]});
  }}
reset();

let drag=null,mouse={x:0,y:0};
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};});
addEventListener('pointermove',e=>{mouse={x:e.clientX,y:e.clientY};});
addEventListener('pointerup',e=>{
  if(!drag)return;
  const dx=(drag.x-e.clientX)*.06,dy=(drag.y-e.clientY)*.06; // slingshot: pull back to aim
  bodies.push({x:drag.x,y:drag.y,vx:dx,vy:dy,m:2+Math.random()*8,
    r:3+Math.random()*5,hue:Math.random()*360,trail:[]});
  drag=null;});
addEventListener('keydown',e=>{if(e.key==='c'||e.key==='C')reset();});

function step(dt){
  for(const b of bodies){
    if(b.sun)continue;
    let ax=0,ay=0;
    for(const o of bodies){
      if(o===b)continue;
      const dx=o.x-b.x,dy=o.y-b.y,d2=dx*dx+dy*dy+120,d=Math.sqrt(d2);
      const f=G*o.m/(d2*d);ax+=dx*f;ay+=dy*f;
    }
    b.vx+=ax*dt;b.vy+=ay*dt;
  }
  for(const b of bodies){
    if(b.sun)continue;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    b.trail.push(b.x,b.y);
    if(b.trail.length>160)b.trail.splice(0,2);
  }
  // merge on collision with sun, cull far-flung bodies
  for(let i=bodies.length-1;i>0;i--){
    const b=bodies[i],s=bodies[0],dx=b.x-s.x,dy=b.y-s.y;
    if(dx*dx+dy*dy<s.r*s.r*1.2){bodies.splice(i,1);s.r=Math.min(40,s.r+.6);continue;}
    if(Math.abs(dx)>W*2||Math.abs(dy)>H*2)bodies.splice(i,1);
  }
}

let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,.033);last=now;
  for(let i=0;i<3;i++)step(dt/3*2.2);

  ctx.fillStyle='rgba(0,0,4,.28)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(const b of bodies){
    // trail
    if(b.trail.length>3){
      ctx.strokeStyle=`hsla(${b.hue},95%,60%,.35)`;ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(b.trail[0],b.trail[1]);
      for(let i=2;i<b.trail.length;i+=2)ctx.lineTo(b.trail[i],b.trail[i+1]);
      ctx.stroke();
    }
    // glow
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*(b.sun?5:4));
    g.addColorStop(0,`hsla(${b.hue},100%,${b.sun?70:65}%,.9)`);
    g.addColorStop(.35,`hsla(${b.hue},100%,55%,.35)`);
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r*(b.sun?5:4),0,7);ctx.fill();
    ctx.fillStyle=`hsla(${b.hue},60%,92%,1)`;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
  }
  // slingshot aim line
  if(drag){
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.setLineDash([4,6]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(drag.x,drag.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.beginPath();ctx.arc(drag.x,drag.y,5,0,7);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  nEl.textContent=bodies.length;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
