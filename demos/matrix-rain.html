<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matrix Rain</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#c{position:fixed;inset:0;display:block;touch-action:none}
#ui{position:fixed;top:10px;left:10px;z-index:10;font:11px/1.6 ui-monospace,Menlo,Consolas,monospace;color:rgba(170,255,190,.85);background:rgba(0,12,5,.5);padding:8px 12px;border:1px solid rgba(0,255,140,.18);border-radius:6px;pointer-events:none;text-shadow:0 0 8px rgba(0,255,120,.35);max-height:52vh;overflow:auto}
#ui h1{font-size:13px;margin:0 0 2px;font-weight:700;letter-spacing:.14em}
#ui a{color:#8fffc0;pointer-events:auto;text-decoration:none}
#ui a:hover{text-decoration:underline}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div id="ui"><h1>MATRIX RAIN</h1>mouse repels streams &middot; click = glyph shockwave<br><a href="index.html">&larr; gallery</a></div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var W=0,H=0;
var GLYPHS=[];
for(var g=0x30a1;g<=0x30f6;g++)GLYPHS.push(String.fromCharCode(g));
var extra='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*+=';
for(var e=0;e<extra.length;e++)GLYPHS.push(extra[e]);
function rg(){return GLYPHS[(Math.random()*GLYPHS.length)|0];}
var COLW=18,cols=[],bursts=[],rings=[];
var mouse={x:-9999,y:-9999};

function makeCol(i,fromTop){
  var depth=0.35+Math.random()*0.65; // 1 = nearest / fastest / biggest
  return{
    x:i*COLW+COLW*0.5,
    off:0,offV:0,
    y:fromTop?(-Math.random()*H*0.8):(Math.random()*H*2-H),
    acc:0,
    speed:(90+Math.random()*260)*depth,
    depth:depth,
    fs:Math.round(9+depth*13),
    len:10+((Math.random()*20)|0)
  };
}
function resize(){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  var n=Math.ceil(W/COLW)+1;
  cols.length=0;
  for(var i=0;i<n;i++)cols.push(makeCol(i,false));
}
window.addEventListener('resize',resize);
resize();

canvas.addEventListener('pointermove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;});
canvas.addEventListener('pointerleave',function(){mouse.x=-9999;mouse.y=-9999;});
canvas.addEventListener('pointerdown',function(e){
  var bx=e.clientX,by=e.clientY;
  rings.push({x:bx,y:by,r:0,life:1});
  for(var i=0;i<70;i++){
    var a=Math.random()*Math.PI*2,sp=120+Math.random()*520;
    bursts.push({x:bx,y:by,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:0.7+Math.random()*0.9,max:1.6,ch:rg(),fs:10+Math.random()*14});
  }
  // shove nearby streams outward
  for(var c=0;c<cols.length;c++){
    var col=cols[c],dx=col.x+col.off-bx,dy=col.y-by;
    var d=Math.sqrt(dx*dx+dy*dy)||1;
    if(d<420)col.offV+=(dx/d)*(1-d/420)*900;
  }
  if(bursts.length>800)bursts.splice(0,bursts.length-800);
});

var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000)||0.016;
  last=now;
  // alpha-fade trick: translucent black wash leaves fading trails
  ctx.fillStyle='rgba(0,0,0,0.085)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  for(var i=0;i<cols.length;i++){
    var col=cols[i];
    var x=col.x+col.off;
    // mouse repel (sideways), weighted by vertical closeness of the head
    var dx=x-mouse.x,ady=col.y-mouse.y;
    if(Math.abs(dx)<140){
      var gk=Math.exp(-(ady*ady)/28800);
      var dir=dx===0?(Math.random()<0.5?-1:1):(dx>0?1:-1);
      col.offV+=dir*(1-Math.abs(dx)/140)*1400*gk*dt;
    }
    col.offV+=(-col.off*4-col.offV*2.2)*dt; // spring back
    col.off+=col.offV*dt;
    col.acc+=col.speed*dt;
    if(col.acc>=col.fs){
      ctx.font=col.fs+'px monospace';
      var trail='rgba(0,255,'+((70+col.depth*110)|0)+','+(0.3+0.6*col.depth).toFixed(2)+')';
      var head='rgba(210,255,225,'+(0.55+0.45*col.depth).toFixed(2)+')';
      while(col.acc>=col.fs){
        col.acc-=col.fs;
        col.y+=col.fs;
        if(col.y>-col.fs&&col.y<H+col.fs){
          ctx.fillStyle=trail;
          ctx.fillText(rg(),x,col.y-col.fs); // repaint previous head in green
          ctx.fillStyle=head;
          ctx.fillText(rg(),x,col.y);        // bright new head
        }
      }
    }
    if(col.y-col.len*col.fs>H)cols[i]=makeCol(i,true);
  }
  // burst glyphs
  for(var b=bursts.length-1;b>=0;b--){
    var p=bursts[b];
    p.life-=dt;
    if(p.life<=0){bursts.splice(b,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    var k=Math.pow(0.4,dt);
    p.vx*=k;p.vy*=k;
    if(Math.random()<0.15)p.ch=rg();
    ctx.font=(p.fs|0)+'px monospace';
    ctx.fillStyle='rgba(160,255,190,'+Math.min(1,p.life/p.max*1.6).toFixed(2)+')';
    ctx.fillText(p.ch,p.x,p.y);
  }
  // shockwave rings
  for(var r=rings.length-1;r>=0;r--){
    var q=rings[r];
    q.r+=900*dt;q.life-=dt*1.4;
    if(q.life<=0){rings.splice(r,1);continue;}
    ctx.strokeStyle='rgba(120,255,170,'+(q.life*0.5).toFixed(2)+')';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.stroke();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
