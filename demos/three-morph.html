<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>morph // 30k particles</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#030309}
  canvas{display:block}
  #hud{position:fixed;top:12px;left:12px;z-index:10;font:11px/1.7 ui-monospace,Menlo,Consolas,monospace;
       color:rgba(200,220,255,.75);background:rgba(5,8,18,.5);border:1px solid rgba(110,160,255,.22);
       border-radius:6px;padding:8px 12px;letter-spacing:.4px;pointer-events:none}
  #hud b{color:#9df;font-size:12px}
  #hud a{color:#f8b;pointer-events:auto;text-decoration:none}
  #hud a:hover{text-decoration:underline}
  #hud em{color:#fd8;font-style:normal}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div id="hud"><b>MORPH // 30k particles</b> <em id="shape">sphere</em><br>click to morph &middot; drag orbit &middot; auto-cycles 5s<br><a href="index.html">&larr; gallery</a></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030309);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 0.4, 5.6);

const N = 30000;
const targets = [];

// target 0: sphere shell
{
  const a = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const th = Math.random()*Math.PI*2;
    const ph = Math.acos(2*Math.random()-1);
    const r = 1.75*(0.97 + Math.random()*0.06);
    a[i*3]   = r*Math.sin(ph)*Math.cos(th);
    a[i*3+1] = r*Math.cos(ph);
    a[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  targets.push(a);
}
// target 1: parametric (2,3) torus knot with tube jitter
{
  const a = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const t = (i/N)*Math.PI*2;
    const s = 0.62;
    const w = 2 + Math.cos(3*t);
    a[i*3]   = s*w*Math.cos(2*t)      + (Math.random()-0.5)*0.24;
    a[i*3+1] = s*w*Math.sin(2*t)      + (Math.random()-0.5)*0.24;
    a[i*3+2] = s*Math.sin(3*t)*1.4    + (Math.random()-0.5)*0.24;
  }
  targets.push(a);
}
// target 2: double helix
{
  const a = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const u = i/N;
    const ang = u*Math.PI*10 + (i%2)*Math.PI;
    const r = 1.15 + (Math.random()-0.5)*0.18;
    a[i*3]   = Math.cos(ang)*r;
    a[i*3+1] = (u-0.5)*3.8 + (Math.random()-0.5)*0.1;
    a[i*3+2] = Math.sin(ang)*r;
  }
  targets.push(a);
}

// live buffer (starts as the sphere) + vertex-color gradient
const pos = new Float32Array(targets[0]);
const col = new Float32Array(N*3);
const c = new THREE.Color();
for(let i=0;i<N;i++){
  const u = i/N;
  c.setHSL(0.5 + 0.42*u, 1.0, 0.55);
  col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

// soft round sprite
const cv = document.createElement('canvas'); cv.width = cv.height = 64;
const g2 = cv.getContext('2d');
const grd = g2.createRadialGradient(32,32,0,32,32,32);
grd.addColorStop(0,'rgba(255,255,255,1)');
grd.addColorStop(0.35,'rgba(255,255,255,0.45)');
grd.addColorStop(1,'rgba(255,255,255,0)');
g2.fillStyle = grd; g2.fillRect(0,0,64,64);
const sprite = new THREE.CanvasTexture(cv);

const points = new THREE.Points(geo, new THREE.PointsMaterial({
  size:0.05, map:sprite, vertexColors:true, transparent:true, opacity:0.7,
  blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
}));
points.frustumCulled = false;
scene.add(points);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 2;
controls.maxDistance = 25;

const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.95, 0.8, 0.35));
composer.addPass(new OutputPass());

// morph state machine: snapshot -> eased lerp to target
const SHAPES = ['sphere','torus knot','helix'];
const from = new Float32Array(N*3);
const DUR = 1700, HOLD = 5000;
let shape = 0, morphing = false, t0 = 0, lastSwitch = performance.now();

function advance(){
  from.set(pos);
  shape = (shape+1)%3;
  t0 = performance.now();
  lastSwitch = t0;
  morphing = true;
  document.getElementById('shape').textContent = SHAPES[shape];
}
function ease(k){ return k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k+2, 3)/2; }

// click advances immediately (ignore drags)
let px = 0, py = 0;
renderer.domElement.addEventListener('pointerdown', e => { px = e.clientX; py = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if(Math.hypot(e.clientX-px, e.clientY-py) < 6) advance();
});

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  if(now - lastSwitch > HOLD) advance();
  if(morphing){
    const k = Math.min(1, (now - t0)/DUR);
    const e = ease(k);
    const to = targets[shape];
    for(let i=0;i<N*3;i++) pos[i] = from[i] + (to[i]-from[i])*e;
    geo.attributes.position.needsUpdate = true;
    if(k >= 1) morphing = false;
  }
  points.rotation.y = now*0.00006;
  controls.update();
  composer.render();
}
animate();

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  composer.setSize(w, h);
});
</script>
</body>
</html>
