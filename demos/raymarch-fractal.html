<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>raymarch fractal</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000}
  canvas{position:fixed;top:0;left:0;display:block;touch-action:none}
  #ui{position:fixed;top:10px;left:12px;z-index:10;font:11px/1.7 ui-monospace,Menlo,Consolas,monospace;
      color:rgba(150,210,255,.8);pointer-events:none;text-shadow:0 1px 4px #000,0 0 12px rgba(0,60,120,.7);user-select:none;max-height:52vh;overflow:auto}
  #ui .t{font-size:13px;font-weight:bold;color:#7df9ff;letter-spacing:.12em}
  #ui a{color:rgba(255,120,220,.9);pointer-events:auto;text-decoration:none}
  #ui a:hover{color:#ff7ade;text-shadow:0 0 8px #ff7ade}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div id="ui">
  <div class="t">MENGER RAYMARCH</div>
  <div>drag orbit &middot; wheel zoom &middot; auto-rotates</div>
  <div><span id="fps">-- fps</span> &middot; <a href="index.html">&larr; gallery</a></div>
</div>
<script>
'use strict';
var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if(!gl) throw new Error('WebGL unavailable');

var VS = [
  'attribute vec2 aPos;',
  'void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }'
].join('\n');

var FS = [
'precision highp float;',
'uniform vec2 uRes;',
'uniform float uTime;',
'uniform float uYaw;',
'uniform float uPitch;',
'uniform float uDist;',
'',
'float sdBox(vec3 p, vec3 b){',
'  vec3 q = abs(p) - b;',
'  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);',
'}',
'',
'vec2 map(vec3 p){',
'  float d = sdBox(p, vec3(1.0));',
'  float s = 1.0;',
'  float trap = 1e9;',
'  for(int i = 0; i < 4; i++){',
'    vec3 a = mod(p*s, 2.0) - 1.0;',
'    s *= 3.0;',
'    trap = min(trap, dot(a, a));',
'    vec3 r = abs(1.0 - 3.0*abs(a));',
'    float da = max(r.x, r.y);',
'    float db = max(r.y, r.z);',
'    float dc = max(r.z, r.x);',
'    float c = (min(da, min(db, dc)) - 1.0)/s;',
'    d = max(d, c);',
'  }',
'  return vec2(d, trap);',
'}',
'',
'vec3 calcNormal(vec3 p){',
'  vec2 e = vec2(0.0008, 0.0);',
'  return normalize(vec3(',
'    map(p + e.xyy).x - map(p - e.xyy).x,',
'    map(p + e.yxy).x - map(p - e.yxy).x,',
'    map(p + e.yyx).x - map(p - e.yyx).x));',
'}',
'',
'vec3 pal(float t){',
'  return 0.5 + 0.5*cos(6.28318*(t + vec3(0.0, 0.33, 0.67)));',
'}',
'',
'void main(){',
'  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;',
'  float cy = cos(uYaw), sy = sin(uYaw);',
'  float cp = cos(uPitch), sp = sin(uPitch);',
'  vec3 ro = uDist*vec3(cp*sy, sp, cp*cy);',
'  vec3 ww = normalize(-ro);',
'  vec3 uu = normalize(cross(vec3(0.0, 1.0, 0.0), ww));',
'  vec3 vv = cross(ww, uu);',
'  vec3 rd = normalize(uv.x*uu + uv.y*vv + 1.7*ww);',
'',
'  float t = 0.0;',
'  float glow = 0.0;',
'  float trap = 0.0;',
'  float nsteps = 0.0;',
'  bool hit = false;',
'  vec3 pos = ro;',
'  for(int i = 0; i < 100; i++){',
'    pos = ro + rd*t;',
'    vec2 h = map(pos);',
'    glow += exp(-h.x*16.0);',
'    if(h.x < max(0.0006, 0.0012*t)){ hit = true; trap = h.y; break; }',
'    t += h.x;',
'    nsteps += 1.0;',
'    if(t > 24.0) break;',
'  }',
'',
'  vec3 bg = vec3(0.006, 0.009, 0.026) + vec3(0.05, 0.02, 0.10)*pow(max(0.0, 1.0 - length(uv)*0.8), 2.0);',
'  vec3 col = bg;',
'  if(hit){',
'    vec3 n = calcNormal(pos);',
'    vec3 lig = normalize(vec3(0.7, 0.9, 0.4));',
'    float dif = clamp(dot(n, lig), 0.0, 1.0);',
'    float ao = clamp(1.0 - nsteps/100.0, 0.0, 1.0);',
'    ao = ao*ao;',
'    float rim = pow(clamp(1.0 + dot(n, rd), 0.0, 1.0), 2.0);',
'    vec3 base = pal(trap*0.5 + uTime*0.02 + 0.08*n.y);',
'    col = base*(0.10 + 0.90*dif)*ao;',
'    col += rim*vec3(0.25, 0.7, 1.0)*0.8;',
'    float fog = 1.0 - exp(-0.020*t*t);',
'    col = mix(col, bg, fog);',
'  }',
'  col += vec3(0.20, 0.45, 1.0)*glow*0.010;',
'  col = pow(clamp(col, 0.0, 4.0), vec3(0.4545));',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

function compile(type, src){
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}
function link(vsSrc, fsSrc){
  var p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  return p;
}

var prog = link(VS, FS);
gl.useProgram(prog);
var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
var aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

var U = {};
['uRes','uTime','uYaw','uPitch','uDist'].forEach(function(n){ U[n] = gl.getUniformLocation(prog, n); });

function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.floor(innerWidth*dpr));
  canvas.height = Math.max(1, Math.floor(innerHeight*dpr));
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

var yaw0 = 0.6, pitch = 0.42, dist = 3.4;
var dragging = false, lx = 0, ly = 0;
canvas.addEventListener('pointerdown', function(e){
  dragging = true; lx = e.clientX; ly = e.clientY;
  if(canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', function(e){
  if(!dragging) return;
  yaw0 += (e.clientX - lx)*0.006;
  pitch += (e.clientY - ly)*0.005;
  pitch = Math.max(-1.45, Math.min(1.45, pitch));
  lx = e.clientX; ly = e.clientY;
});
window.addEventListener('pointerup', function(){ dragging = false; });
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  dist = Math.max(1.15, Math.min(9.0, dist*Math.exp(e.deltaY*0.0013)));
}, {passive:false});

var fpsEl = document.getElementById('fps');
var frames = 0, lastF = performance.now();

function frame(now){
  var t = now*0.001;
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uYaw, yaw0 + t*0.1);
  gl.uniform1f(U.uPitch, pitch);
  gl.uniform1f(U.uDist, dist);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  frames++;
  if(now - lastF > 500){
    fpsEl.textContent = Math.round(frames*1000/(now - lastF)) + ' fps';
    frames = 0; lastF = now;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
