<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Towers of Hanoi — Recursion Made Visible</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#04060c}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.panel{position:fixed;z-index:10;font:12px/1.55 ui-monospace,Consolas,Menlo,monospace;
 background:rgba(7,12,24,.74);border:1px solid rgba(80,170,255,.25);border-radius:10px;
 padding:10px 14px;backdrop-filter:blur(3px);max-height:52vh;overflow:auto}
#ui{top:12px;left:12px;color:#9fd0f5;max-width:330px}
#ui h1{margin:0 0 4px;font-size:14px;letter-spacing:.5px;color:#fff;text-shadow:0 0 10px #38f}
#ui .dim{color:#647d9e;font-size:11px}
#ui a{color:#69e6b8;text-decoration:none}
#stats{margin-top:6px;color:#ffd76e;white-space:pre}
#stack{top:12px;right:12px;white-space:pre;color:#33507a;font-size:11px;min-width:250px;max-width:40vw;overflow:hidden}
#stack b{color:#7fb7ff;font-weight:normal}
.hot{color:#fff;background:rgba(255,70,160,.22);text-shadow:0 0 8px #f6a}
.anc{color:#9fd8ff}
.done{color:#22344e}
@media (max-width:640px){.panel{font-size:11px;max-height:40vh}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="cv"></canvas>
<div class="panel" id="ui">
<h1>TOWERS OF HANOI</h1>
<div>To move n disks the solver recursively moves n−1 aside, moves the biggest, then recursively stacks the n−1 back on top — exactly 2ⁿ−1 moves, provably optimal.</div>
<div class="dim">keys 5–9 = disk count &middot; ←/→ = speed &middot; watch the call stack →</div>
<div id="stats"></div>
<div class="dim"><a href="index.html">← gallery</a></div>
</div>
<div class="panel" id="stack"></div>
<script>
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);}
addEventListener('resize',resize);resize();
var NAMES=['A','B','C'];
var n=6,lines=[],moves=[],pegs=[[],[],[]],mi=0,speed=1,flying=null,moveT=0,state='play',stateT=0,parts=[];
function build(k,a,c,b,depth,parent){
 var id=lines.length;
 lines.push({depth:depth,parent:parent,text:'hanoi('+k+', '+NAMES[a]+'→'+NAMES[c]+')'});
 if(k===1){moves.push({from:a,to:c,line:id});return;}
 build(k-1,a,b,c,depth+1,id);
 moves.push({from:a,to:c,line:id});
 build(k-1,b,c,a,depth+1,id);
}
function init(k){
 n=k;lines=[];moves=[];build(n,0,2,1,0,-1);
 pegs=[[],[],[]];for(var d=n;d>=1;d--)pegs[0].push(d);
 mi=0;flying=null;moveT=0;state='play';stateT=0;parts=[];renderStack();
}
function playW(){return Math.max(320,W-300);}
function pegX(i){return playW()*(i+0.5)/3+10;}
function baseY(){return H*0.86;}
function diskH(){return Math.min(26,Math.max(10,(H*0.5)/n));}
function diskW(d){var maxw=playW()/3*0.82,minw=Math.max(34,maxw*0.28);return minw+(maxw-minw)*(d-1)/Math.max(1,n-1);}
function diskPos(peg,idx){return {x:pegX(peg),y:baseY()-diskH()*(idx+0.5)};}
function renderStack(){
 var el=document.getElementById('stack');
 var cur=mi<moves.length?moves[mi].line:lines.length-1;
 var anc={},p=cur;
 while(p!==-1){anc[p]=1;p=lines[p].parent;}
 var R=10,lo=Math.max(0,cur-R),hi=Math.min(lines.length,cur+R+1);
 var out='<b>RECURSION TRACE   depth '+lines[cur].depth+'</b>\n';
 if(lo>0)out+='  …\n';
 for(var i=lo;i<hi;i++){
  var L=lines[i],pad=new Array(L.depth+1).join('· ');
  var cls=i===cur?'hot':anc[i]?'anc':(i<cur?'done':'');
  out+='<span class="'+cls+'">'+pad+L.text+'</span>\n';
 }
 if(hi<lines.length)out+='  …';
 el.innerHTML=out;
}
function burst(){for(var i=0;i<160;i++)burstOne();}
function burstOne(){
 var x=pegX(2)+(Math.random()-0.5)*diskW(n),y=baseY()-n*diskH()-20;
 var a=Math.random()*Math.PI*2,v=60+Math.random()*260;
 parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-140,life:0.8+Math.random()*1.4,hue:180+Math.random()*160});
}
function stats(){
 var total=moves.length;
 var depth=mi<total?lines[moves[mi].line].depth:0;
 document.getElementById('stats').textContent=
  'disks n='+n+'   moves '+Math.min(mi,total)+' / '+total+'  (2^'+n+'−1 optimal)\n'+
  'recursion depth '+depth+'   speed '+speed.toFixed(2)+'x'+
  (state==='won'?'\n★ SOLVED in the optimal '+total+' — new n incoming…':'');
}
function update(dt){
 if(state==='play'){
  if(!flying&&mi<moves.length){
   var mv=moves[mi];
   flying={d:pegs[mv.from].pop(),from:mv.from,to:mv.to};moveT=0;renderStack();
  }
  if(flying){
   moveT+=dt*speed*2.2;
   if(moveT>=1){
    pegs[flying.to].push(flying.d);flying=null;mi++;
    if(mi>=moves.length){state='won';stateT=0;burst();renderStack();}
   }
  }
 }else{
  stateT+=dt;
  if(Math.random()<0.12)burstOne();
  if(stateT>2.8)init(5+Math.floor(Math.random()*5));
 }
 for(var i=parts.length-1;i>=0;i--){
  var q=parts[i];q.vy+=dt*300;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
  if(q.life<=0)parts.splice(i,1);
 }
 stats();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawDisk(d,x,y){
 var w=diskW(d),h=diskH()*0.86,hue=200+(d-1)/Math.max(1,n-1)*150;
 var g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
 g.addColorStop(0,'hsl('+hue+',95%,45%)');g.addColorStop(0.5,'hsl('+hue+',100%,68%)');g.addColorStop(1,'hsl('+hue+',95%,45%)');
 ctx.fillStyle=g;ctx.shadowColor='hsl('+hue+',100%,60%)';ctx.shadowBlur=16;
 roundRect(x-w/2,y-h/2,w,h,h/2);ctx.fill();ctx.shadowBlur=0;
}
function draw(){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 var g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#050810');g.addColorStop(1,'#0a0e1c');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 var topY=baseY()-(n+2.6)*diskH();
 ctx.strokeStyle='rgba(120,180,255,.5)';ctx.lineWidth=4;ctx.shadowColor='#48f';ctx.shadowBlur=14;
 ctx.beginPath();ctx.moveTo(20,baseY()+2);ctx.lineTo(playW(),baseY()+2);ctx.stroke();
 ctx.font='13px monospace';ctx.textAlign='center';
 for(var i=0;i<3;i++){
  ctx.strokeStyle='rgba(140,200,255,.35)';ctx.lineWidth=6;ctx.shadowBlur=10;
  ctx.beginPath();ctx.moveTo(pegX(i),baseY());ctx.lineTo(pegX(i),topY);ctx.stroke();
  ctx.shadowBlur=0;ctx.fillStyle='rgba(140,200,255,.7)';
  ctx.fillText(NAMES[i],pegX(i),baseY()+22);
 }
 for(i=0;i<3;i++)for(var j=0;j<pegs[i].length;j++)drawDisk(pegs[i][j],pegX(i),baseY()-diskH()*(j+0.5));
 if(flying){
  var s=diskPos(flying.from,pegs[flying.from].length);
  var e=diskPos(flying.to,pegs[flying.to].length);
  var t=moveT<0?0:moveT>1?1:moveT;t=t*t*(3-2*t);
  var cx=(s.x+e.x)/2,cy=Math.min(topY-diskH()*1.6,Math.min(s.y,e.y)-H*0.18);
  var u=1-t;
  var x=u*u*s.x+2*u*t*cx+t*t*e.x,y=u*u*s.y+2*u*t*cy+t*t*e.y;
  drawDisk(flying.d,x,y);
 }
 ctx.globalCompositeOperation='lighter';
 for(i=0;i<parts.length;i++){
  var q=parts[i];
  ctx.fillStyle='hsla('+q.hue+',100%,65%,'+Math.max(0,Math.min(1,q.life))+')';
  ctx.beginPath();ctx.arc(q.x,q.y,2.4,0,6.283);ctx.fill();
 }
 ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
}
addEventListener('keydown',function(e){
 if(e.key>='5'&&e.key<='9')init(+e.key);
 else if(e.key==='ArrowRight'){speed=Math.min(16,speed*1.5);e.preventDefault();}
 else if(e.key==='ArrowLeft'){speed=Math.max(0.2,speed/1.5);e.preventDefault();}
});
var last=performance.now();
function frame(now){
 var dt=Math.min(0.05,(now-last)/1000);last=now;
 update(dt);draw();requestAnimationFrame(frame);
}
init(6);
requestAnimationFrame(frame);
</script>
</body>
</html>
