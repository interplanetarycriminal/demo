<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ecosystem — predator &amp; prey</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#04070c;user-select:none}
  canvas{position:fixed;inset:0;display:block;touch-action:none}
  #ui{position:fixed;top:10px;left:12px;z-index:10;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;
      color:#9ef7ea;background:rgba(4,8,16,.6);padding:8px 12px;border:1px solid rgba(0,255,213,.28);
      border-radius:8px;pointer-events:none;max-height:52vh;overflow:auto}
  #ui b{color:#fff;letter-spacing:.08em}
  #ui a{color:#5df;pointer-events:auto}
  #ui .dim{color:#6d8f9c}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div id="ui">
  <b>ECOSYSTEM</b> <span class="dim">grass · rabbits · foxes</span><br>
  <span class="dim">click: drop food &nbsp;&middot;&nbsp; R: reset</span><br>
  <a href="index.html">&larr; gallery</a><br>
  <span id="cg" style="color:#4ce08a"></span> <span id="cr" style="color:#ffd966"></span> <span id="cf" style="color:#ff6b4a"></span>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var cgEl=document.getElementById('cg'),crEl=document.getElementById('cr'),cfEl=document.getElementById('cf');
var W,H,dpr,GC=20,gw,gh,grass;
var rabbits=[],foxes=[],frame=0;
var hg=[],hr=[],hf=[];
var TAU=Math.PI*2;
var P={
  grassRegrow:0.0032,
  rabbitSpeed:1.15,rabbitDrain:0.105,biteMax:0.05,biteGain:26,
  rabbitRep:115,rabbitRepCost:62,rabbitMax:430,rabbitEMax:160,
  foxSpeed:2.0,foxDrain:0.085,foxGain:44,foxEMax:150,
  foxRep:122,foxRepCost:66,foxMax:90,huntR:130,catchR:7,fleeR:75
};
var GLEV=[''];
for(var gl=1;gl<=7;gl++)GLEV.push('rgba(52,210,120,'+(gl/7*0.30).toFixed(3)+')');

function mkA(e){return{x:Math.random()*W,y:Math.random()*H,a:Math.random()*TAU,e:e,tr:[]};}
function reset(){
  gw=Math.ceil(W/GC);gh=Math.ceil(H/GC);
  grass=new Float32Array(gw*gh);
  for(var i=0;i<grass.length;i++)grass[i]=0.4+Math.random()*0.6;
  rabbits=[];foxes=[];
  for(i=0;i<120;i++)rabbits.push(mkA(40+Math.random()*70));
  for(i=0;i<25;i++)foxes.push(mkA(55+Math.random()*50));
  hg=[];hr=[];hf=[];frame=0;
}
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  reset();
}
function turnTo(a,t,k){
  var d=t-a;
  while(d>Math.PI)d-=TAU;
  while(d<-Math.PI)d+=TAU;
  return a+d*k;
}
function wrap(v,m){return v<0?v+m:(v>=m?v-m:v);}

function tick(){
  var i,j,r,f;
  for(i=0;i<grass.length;i++){var g=grass[i];if(g<1)grass[i]=Math.min(1,g+P.grassRegrow);}
  for(i=rabbits.length-1;i>=0;i--){
    r=rabbits[i];
    r.a+=(Math.random()-0.5)*0.55;
    var fd=P.fleeR*P.fleeR,fx=0,fy=0,found=false;
    for(j=0;j<foxes.length;j++){
      f=foxes[j];
      var dx=r.x-f.x,dy=r.y-f.y,d2=dx*dx+dy*dy;
      if(d2<fd){fd=d2;fx=dx;fy=dy;found=true;}
    }
    var sp=P.rabbitSpeed;
    if(found){r.a=turnTo(r.a,Math.atan2(fy,fx),0.35);sp*=1.55;}
    r.x=wrap(r.x+Math.cos(r.a)*sp,W);
    r.y=wrap(r.y+Math.sin(r.a)*sp,H);
    var gi=((r.y/GC)|0)*gw+((r.x/GC)|0);
    var g2=grass[gi];
    if(g2>0.12){
      var bite=Math.min(g2,P.biteMax);
      grass[gi]=g2-bite;
      r.e=Math.min(P.rabbitEMax,r.e+bite*P.biteGain);
    }
    r.e-=P.rabbitDrain;
    if(found)r.e-=0.03;
    if(r.e<=0){rabbits.splice(i,1);continue;}
    if(r.e>P.rabbitRep&&rabbits.length<P.rabbitMax){
      r.e-=P.rabbitRepCost;
      var c=mkA(48);c.x=r.x;c.y=r.y;rabbits.push(c);
    }
    r.tr.push(r.x,r.y);if(r.tr.length>16)r.tr.splice(0,2);
  }
  for(i=foxes.length-1;i>=0;i--){
    f=foxes[i];
    f.a+=(Math.random()-0.5)*0.35;
    var best=P.huntR*P.huntR,bj=-1;
    for(j=0;j<rabbits.length;j++){
      r=rabbits[j];
      var dx2=r.x-f.x,dy2=r.y-f.y,dd=dx2*dx2+dy2*dy2;
      if(dd<best){best=dd;bj=j;}
    }
    var sp2=P.foxSpeed*0.8;
    if(bj>=0){
      r=rabbits[bj];
      f.a=turnTo(f.a,Math.atan2(r.y-f.y,r.x-f.x),0.3);
      sp2=P.foxSpeed;
      if(best<P.catchR*P.catchR){
        rabbits.splice(bj,1);
        f.e=Math.min(P.foxEMax,f.e+P.foxGain);
      }
    }
    f.x=wrap(f.x+Math.cos(f.a)*sp2,W);
    f.y=wrap(f.y+Math.sin(f.a)*sp2,H);
    f.e-=P.foxDrain;
    if(f.e<=0){foxes.splice(i,1);continue;}
    if(f.e>P.foxRep&&foxes.length<P.foxMax){
      f.e-=P.foxRepCost;
      var c2=mkA(52);c2.x=f.x;c2.y=f.y;foxes.push(c2);
    }
    f.tr.push(f.x,f.y);if(f.tr.length>16)f.tr.splice(0,2);
  }
  if(frame%240===120&&rabbits.length<8)for(i=0;i<10;i++)rabbits.push(mkA(70));
  if(frame%240===0&&foxes.length<3)for(i=0;i<3;i++)foxes.push(mkA(80));
  if(frame%6===0){
    var gs=0;
    for(i=0;i<grass.length;i++)gs+=grass[i];
    hg.push(gs/grass.length);hr.push(rabbits.length);hf.push(foxes.length);
    if(hg.length>700){hg.shift();hr.shift();hf.shift();}
  }
}
function drawAgents(list,rgb,rad,glow){
  ctx.lineWidth=1.5;ctx.strokeStyle='rgba('+rgb+',0.16)';
  ctx.beginPath();
  for(var i=0;i<list.length;i++){
    var t=list[i].tr;
    if(t.length<4)continue;
    ctx.moveTo(t[0],t[1]);
    for(var k=2;k<t.length;k+=2){
      if(Math.abs(t[k]-t[k-2])>50||Math.abs(t[k+1]-t[k-1])>50)ctx.moveTo(t[k],t[k+1]);
      else ctx.lineTo(t[k],t[k+1]);
    }
  }
  ctx.stroke();
  ctx.fillStyle='rgba('+rgb+',0.12)';
  ctx.beginPath();
  for(i=0;i<list.length;i++){var a=list[i];ctx.moveTo(a.x+glow,a.y);ctx.arc(a.x,a.y,glow,0,TAU);}
  ctx.fill();
  ctx.fillStyle='rgba('+rgb+',0.95)';
  ctx.beginPath();
  for(i=0;i<list.length;i++){var a2=list[i];ctx.moveTo(a2.x+rad,a2.y);ctx.arc(a2.x,a2.y,rad,0,TAU);}
  ctx.fill();
}
function plot(arr,start,n,py,ph,max,col){
  ctx.strokeStyle=col;ctx.lineWidth=1.6;ctx.beginPath();
  for(var i=0;i<n;i++){
    var vx=i/(n-1)*W;
    var vy=py+ph-6-(arr[start+i]/max)*(ph-14);
    if(i)ctx.lineTo(vx,vy);else ctx.moveTo(vx,vy);
  }
  ctx.stroke();
}
function sparkline(){
  var ph=86,py=H-ph;
  ctx.fillStyle='rgba(2,6,10,0.62)';ctx.fillRect(0,py,W,ph);
  ctx.strokeStyle='rgba(120,200,220,0.25)';
  ctx.beginPath();ctx.moveTo(0,py+0.5);ctx.lineTo(W,py+0.5);ctx.stroke();
  var n=Math.min(hg.length,Math.floor(W/3));
  if(n>1){
    var start=hg.length-n,rmax=10,fmax=5;
    for(var i=0;i<n;i++){
      if(hr[start+i]>rmax)rmax=hr[start+i];
      if(hf[start+i]>fmax)fmax=hf[start+i];
    }
    plot(hg,start,n,py,ph,1,'rgba(76,224,138,0.85)');
    plot(hr,start,n,py,ph,rmax*1.12,'rgba(255,217,102,0.95)');
    plot(hf,start,n,py,ph,fmax*1.12,'rgba(255,107,74,0.95)');
  }
  ctx.font='10px ui-monospace,Menlo,Consolas,monospace';
  ctx.fillStyle='rgba(76,224,138,0.9)';ctx.fillText('grass',W-235,py+14);
  ctx.fillStyle='rgba(255,217,102,0.9)';ctx.fillText('rabbits '+rabbits.length,W-180,py+14);
  ctx.fillStyle='rgba(255,107,74,0.9)';ctx.fillText('foxes '+foxes.length,W-85,py+14);
}
function draw(){
  ctx.fillStyle='#04070c';ctx.fillRect(0,0,W,H);
  for(var y=0;y<gh;y++){
    var off=y*gw;
    for(var x=0;x<gw;x++){
      var l=(grass[off+x]*7)|0;
      if(l>0){ctx.fillStyle=GLEV[l];ctx.fillRect(x*GC,y*GC,GC-1,GC-1);}
    }
  }
  drawAgents(rabbits,'255,224,120',2.3,5);
  drawAgents(foxes,'255,110,70',3.2,7);
  sparkline();
}
function loop(){
  frame++;
  tick();
  draw();
  if(frame%10===0){
    var gp=hg.length?Math.round(hg[hg.length-1]*100):0;
    cgEl.textContent='grass '+gp+'%';
    crEl.textContent='rabbits '+rabbits.length;
    cfEl.textContent='foxes '+foxes.length;
  }
  requestAnimationFrame(loop);
}
cv.addEventListener('pointerdown',function(e){
  var mx=e.clientX,my=e.clientY,R=75;
  var x0=Math.max(0,((mx-R)/GC)|0),x1=Math.min(gw-1,((mx+R)/GC)|0);
  var y0=Math.max(0,((my-R)/GC)|0),y1=Math.min(gh-1,((my+R)/GC)|0);
  for(var yy=y0;yy<=y1;yy++)for(var xx=x0;xx<=x1;xx++){
    var cx=xx*GC+GC/2-mx,cy=yy*GC+GC/2-my;
    if(cx*cx+cy*cy<R*R)grass[yy*gw+xx]=1;
  }
});
window.addEventListener('keydown',function(e){if(e.key==='r'||e.key==='R')reset();});
window.addEventListener('resize',resize);
resize();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
