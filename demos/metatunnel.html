<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;cursor:crosshair}
  canvas{position:fixed;top:0;left:0;display:block}
  #ui{position:fixed;top:10px;left:12px;z-index:10;font:12px/1.55 monospace;
      color:#e6d8ff;background:rgba(8,4,16,.4);padding:8px 11px;
      border:1px solid rgba(190,140,255,.3);border-radius:5px;pointer-events:none}
  #ui .t{color:#ff9ae0;font-weight:bold;letter-spacing:1.5px}
  #ui .h{opacity:.72}
  #ui a{color:#c79dff;pointer-events:auto;text-decoration:none}
  #ui a:hover{color:#e6ccff}
</style>
<div id="ui">
  <div class="t">METATUNNEL</div>
  <div class="h">mouse steers &middot; click scatters the blobs</div>
  <div><a href="index.html">&larr; gallery</a></div>
</div>
<canvas id="c"></canvas>
<script>
var canvas=document.getElementById('c');
var gl=canvas.getContext('webgl')||canvas.getContext('experimental-webgl');
if(!gl)throw new Error('WebGL not available');

function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function prog(vs,fs){var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;}

var VS='attribute vec2 a_pos;void main(){gl_Position=vec4(a_pos,0.0,1.0);}';
var FS=[
'precision highp float;',
'uniform vec2 u_res;uniform float u_time;uniform vec2 u_mouse;uniform float u_seed;',
'vec3 pal(float t){return 0.5+0.5*cos(6.28318*(t+vec3(0.0,0.33,0.67)));}',
'vec2 center(float z){return vec2(sin(z*0.28+u_time*0.7)*0.6,cos(z*0.23+u_time*0.55)*0.6);}',
'float smin(float a,float b,float k){float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);',
'  return mix(b,a,h)-k*h*(1.0-h);}',
'float camZ(){return u_time*2.3;}',
'float map(vec3 p){',
'  float cz=camZ();',
'  float d=1.25-length(p.xy-center(p.z));',           // inside-facing tube wall
'  for(int i=0;i<5;i++){',
'    float fi=float(i);',
'    float bz=cz+3.0+fi*2.3;',
'    vec2 orb=vec2(cos(u_time*(0.6+0.12*fi)+fi*2.1+u_seed*6.283),',
'                  sin(u_time*(0.7+0.09*fi)+fi*1.7+u_seed*6.283))*0.55;',
'    vec3 bp=vec3(center(bz)+orb,bz);',
'    float db=length(p-bp)-0.5;',
'    d=smin(d,db,0.7);',                                // gooey merge
'  }',
'  return d;',
'}',
'vec3 calcN(vec3 p){vec2 e=vec2(0.0015,0.0);',
'  return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),',
'    map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}',
'void main(){',
'  vec2 uv=(gl_FragCoord.xy-0.5*u_res)/u_res.y;',
'  vec2 steer=(u_mouse-0.5)*2.0;',
'  float cz=camZ();',
'  vec3 ro=vec3(center(cz)+steer*0.4,cz);',
'  vec3 rd=normalize(vec3(uv+steer*0.16,1.45));',
'  float t=0.0,d=0.0,glow=0.0; bool hit=false; vec3 p=ro;',
'  for(int i=0;i<88;i++){',
'    p=ro+rd*t; d=map(p);',
'    glow+=exp(-abs(d)*7.0);',
'    if(d<0.0025){hit=true;break;}',
'    t+=d*0.85; if(t>34.0) break;',
'  }',
'  vec3 col;',
'  if(hit){',
'    vec3 n=calcN(p);',
'    vec3 L=normalize(vec3(0.4,0.55,-0.35));',
'    float diff=max(dot(n,L),0.0);',
'    float spec=pow(max(dot(reflect(-L,n),-rd),0.0),34.0);',
'    float fres=pow(1.0-max(dot(n,-rd),0.0),2.5);',
'    vec3 irid=pal(fres*0.9+0.08*p.z+u_time*0.04);',    // iridescent by fresnel + depth
'    col=irid*(0.22+0.85*diff);',
'    col+=vec3(1.0,0.95,0.9)*spec*1.3;',                // specular hits
'    col+=pal(0.3+0.12*p.z)*fres*0.7;',                 // rim iridescence
'    col*=exp(-t*0.055);',                              // depth fog
'  } else {',
'    col=vec3(0.02,0.01,0.05);',
'  }',
'  col+=pal(0.55+0.03*t+u_time*0.05)*glow*0.016;',      // volumetric glow
'  col=col/(1.0+col);',                                  // tonemap
'  col=pow(clamp(col,0.0,1.0),vec3(0.4545));',
'  gl_FragColor=vec4(col,1.0);',
'}'].join('\n');

var program=prog(VS,FS);
var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
var aPos=gl.getAttribLocation(program,'a_pos');
var uRes=gl.getUniformLocation(program,'u_res');
var uTime=gl.getUniformLocation(program,'u_time');
var uMouse=gl.getUniformLocation(program,'u_mouse');
var uSeed=gl.getUniformLocation(program,'u_seed');

var mouse=[0.5,0.5],seed=0.0;
window.addEventListener('mousemove',function(e){
  mouse[0]=e.clientX/innerWidth;mouse[1]=1.0-e.clientY/innerHeight;});
window.addEventListener('click',function(){seed=Math.random();});
window.addEventListener('touchmove',function(e){var t=e.touches[0];
  mouse[0]=t.clientX/innerWidth;mouse[1]=1.0-t.clientY/innerHeight;},{passive:true});

function resize(){var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=Math.floor(innerWidth*dpr),h=Math.floor(innerHeight*dpr);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  gl.viewport(0,0,w,h);}

function frame(now){
  resize();gl.useProgram(program);
  gl.enableVertexAttribArray(aPos);
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
  gl.uniform2f(uRes,canvas.width,canvas.height);
  gl.uniform1f(uTime,now*0.001);
  gl.uniform2f(uMouse,mouse[0],mouse[1]);
  gl.uniform1f(uSeed,seed);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
