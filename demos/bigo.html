<title>Big-O Growth Theater</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05060a;overflow:hidden}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;top:12px;left:12px;z-index:10;background:rgba(8,10,18,.62);
      border:1px solid rgba(120,200,255,.22);border-radius:8px;padding:10px 12px;
      font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#bfe6ff;max-width:380px;
      backdrop-filter:blur(6px);text-shadow:0 0 8px rgba(90,180,255,.35)}
  #ui h1{margin:0 0 4px;font-size:14px;letter-spacing:.08em;color:#7fefff}
  #ui .ex{color:#8fa8c0;margin-bottom:6px}
  #ui .hint{color:#6f8399;margin-top:6px;font-size:11px}
  #ui a{color:#7fefff;text-decoration:none;border-bottom:1px dotted #7fefff}
  #ui .row{display:flex;justify-content:space-between;gap:10px}
  #ui b{color:#fff;font-weight:600}
</style>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div id="ui">
  <h1>BIG-O GROWTH THEATER</h1>
  <div class="ex">Six complexity classes race upward as n sweeps 1&rarr;50 — watch 2&#8319; leave the universe.</div>
  <div class="row"><span>n</span><b id="sn">1</b></div>
  <div class="row"><span>scale</span><b id="ss">log</b></div>
  <div class="row"><span>focus</span><b id="sf">none</b></div>
  <div class="hint">L log/linear &middot; R restart sweep &middot; hover a curve to isolate</div>
  <div class="hint"><a href="index.html">&larr; gallery</a></div>
</div>
<script>
(function(){
"use strict";
var c=document.getElementById('c'),x=c.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  c.width=Math.floor(W*DPR);c.height=Math.floor(H*DPR);
  c.style.width=W+'px';c.style.height=H+'px';
  x.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);resize();

var NMAX=50;
var FUNCS=[
  {name:'O(1)',       col:'#5cf3a0', f:function(n){return 1;}},
  {name:'O(log n)',   col:'#57d2ff', f:function(n){return Math.log(n)/Math.LN2+1;}},
  {name:'O(n)',       col:'#ffe066', f:function(n){return n;}},
  {name:'O(n log n)', col:'#ff9f43', f:function(n){return n*(Math.log(n)/Math.LN2+1);}},
  {name:'O(n²)', col:'#ff5f8d', f:function(n){return n*n;}},
  {name:'O(2ⁿ)', col:'#c07bff', f:function(n){return Math.pow(2,n);}}
];

var nCur=1, speed=0.28, logScale=true, focus=-1, mx=-1e9, my=-1e9, t0=performance.now();

function commas(v){
  if(!isFinite(v))return '∞';
  if(v>=1e15){
    var e=Math.floor(Math.log(v)/Math.LN10);
    return (v/Math.pow(10,e)).toFixed(2)+'e'+e;
  }
  var s=Math.round(v).toString(),o='',k=0;
  for(var i=s.length-1;i>=0;i--){o=s[i]+o;if(++k%3===0&&i>0)o=','+o;}
  return o;
}
function nsToHuman(ops){
  var ns=ops; // 1 ns per op
  var u=[['ns',1],['µs',1e3],['ms',1e6],['s',1e9],['min',6e10],['hours',3.6e12],
         ['days',8.64e13],['years',3.1536e16],['millennia',3.1536e19]];
  var pick=u[0];
  for(var i=0;i<u.length;i++) if(ns>=u[i][1]) pick=u[i];
  var v=ns/pick[1];
  if(pick[0]==='millennia'&&v>1e6){
    var e=Math.floor(Math.log(v)/Math.LN10);
    return '~'+(v/Math.pow(10,e)).toFixed(1)+'e'+e+' millennia';
  }
  return '~'+(v<10?v.toFixed(2):v<1000?v.toFixed(1):commas(v))+' '+pick[0];
}

// plot geometry
function plot(){
  var L=Math.max(90,W*0.11), R=W-Math.max(190,W*0.16), T=Math.max(70,H*0.12), B=H-Math.max(120,H*0.20);
  return {L:L,R:R,T:T,B:B,w:R-L,h:B-T};
}
function yMax(){
  if(logScale) return Math.pow(2,NMAX);
  // linear: scale to the largest curve that is not 2^n, plus soft growth
  var m=Math.max(10, NMAX*NMAX*1.05);
  return m;
}
function px(n,p){ return p.L + (n-1)/(NMAX-1)*p.w; }
function py(v,p){
  var ymax=yMax();
  if(logScale){
    var lv=Math.log(Math.max(v,1))/Math.LN2, lm=Math.log(ymax)/Math.LN2;
    return p.B - Math.min(lv/lm,1.06)*p.h;
  }
  return p.B - Math.min(v/ymax,1.06)*p.h;
}

function drawGrid(p){
  x.save();
  x.strokeStyle='rgba(90,140,190,.13)';x.lineWidth=1;
  x.font='10px ui-monospace,monospace';x.fillStyle='rgba(150,190,225,.5)';
  // vertical n gridlines
  for(var n=5;n<=NMAX;n+=5){
    var X=px(n,p);
    x.beginPath();x.moveTo(X,p.T);x.lineTo(X,p.B);x.stroke();
    x.textAlign='center';x.fillText('n='+n,X,p.B+16);
  }
  // horizontal
  if(logScale){
    for(var e=0;e<=50;e+=5){
      var Y=py(Math.pow(2,e),p);
      if(Y<p.T-4)continue;
      x.beginPath();x.moveTo(p.L,Y);x.lineTo(p.R,Y);x.stroke();
      x.textAlign='right';x.fillText('2^'+e,p.L-8,Y+3);
    }
  }else{
    var ym=yMax();
    for(var i=0;i<=5;i++){
      var v=ym*i/5, Y=py(v,p);
      x.beginPath();x.moveTo(p.L,Y);x.lineTo(p.R,Y);x.stroke();
      x.textAlign='right';x.fillText(commas(v),p.L-8,Y+3);
    }
  }
  x.strokeStyle='rgba(120,190,255,.35)';x.lineWidth=1.5;
  x.beginPath();x.moveTo(p.L,p.T-10);x.lineTo(p.L,p.B);x.lineTo(p.R,p.B);x.stroke();
  x.textAlign='left';x.fillStyle='rgba(150,190,225,.65)';
  x.fillText(logScale?'operations (log₂ scale)':'operations (linear)',p.L,p.T-20);
  x.restore();
}

function hitTest(){
  var p=plot();
  if(mx<p.L-30||mx>p.R+180||my<p.T-40||my>p.B+40){focus=-1;return;}
  var n=1+(mx-p.L)/p.w*(NMAX-1);
  n=Math.max(1,Math.min(nCur,n));
  var best=-1,bd=26;
  for(var i=0;i<FUNCS.length;i++){
    var Y=py(FUNCS[i].f(n),p);
    var d=Math.abs(Y-my);
    if(d<bd){bd=d;best=i;}
  }
  // also allow hovering the legend area
  if(best<0){
    for(var j=0;j<FUNCS.length;j++){
      var ly=p.T+22+j*26;
      if(mx>p.R+8&&Math.abs(my-ly)<12){best=j;break;}
    }
  }
  focus=best;
}

function drawCurves(p,time){
  for(var i=0;i<FUNCS.length;i++){
    var F=FUNCS[i];
    var dim = focus>=0 && focus!==i;
    var alpha = dim?0.13:1;
    x.save();
    x.globalAlpha=alpha;
    x.strokeStyle=F.col;
    x.lineWidth=dim?1.4:(focus===i?3.4:2.4);
    x.shadowColor=F.col;x.shadowBlur=dim?0:(focus===i?22:12);
    x.beginPath();
    var steps=240, started=false;
    for(var s=0;s<=steps;s++){
      var n=1+(nCur-1)*s/steps;
      if(n<1)n=1;
      var X=px(n,p),Y=py(F.f(n),p);
      if(Y<p.T-16){ // clipped off the top
        if(started){x.lineTo(X,p.T-16);}
        break;
      }
      if(!started){x.moveTo(X,Y);started=true;}else x.lineTo(X,Y);
    }
    x.stroke();
    // runner dot
    var rv=F.f(nCur), RX=px(nCur,p), RY=py(rv,p);
    var clipped = RY<p.T-16;
    if(clipped) RY=p.T-16;
    var pulse=1+0.28*Math.sin(time*0.005+i);
    x.shadowBlur=dim?0:24;
    x.fillStyle=F.col;
    x.beginPath();x.arc(RX,RY,(focus===i?7:5)*pulse,0,6.2832);x.fill();
    if(!dim){
      x.globalAlpha=alpha*0.35;
      x.beginPath();x.arc(RX,RY,14*pulse,0,6.2832);x.stroke();
    }
    // inline label at runner
    x.globalAlpha=alpha;
    x.shadowBlur=0;
    x.font=(focus===i?'bold ':'')+'11px ui-monospace,monospace';
    x.textAlign='left';
    var lx=RX+12, ly=RY-6;
    if(lx>p.R+150)lx=p.R+150;
    x.fillStyle=F.col;
    x.fillText(F.name+(clipped?' ↑':''),lx,ly);
    x.fillStyle='rgba(230,245,255,'+(dim?0.3:0.85)+')';
    x.fillText(commas(rv),lx,ly+13);
    x.restore();
  }
}

function drawLegend(p,time){
  x.save();
  x.font='11px ui-monospace,monospace';x.textAlign='left';
  for(var i=0;i<FUNCS.length;i++){
    var F=FUNCS[i], ly=p.T+22+i*26, dim=focus>=0&&focus!==i;
    x.globalAlpha=dim?0.25:1;
    x.fillStyle=F.col;x.shadowColor=F.col;x.shadowBlur=dim?0:10;
    x.fillRect(p.R+14,ly-8,10,10);
    x.shadowBlur=0;
    x.fillStyle=dim?'rgba(190,215,235,.6)':'#eaf6ff';
    x.fillText(F.name,p.R+32,ly);
  }
  x.restore();
}

function drawStrip(time){
  var h=Math.max(96,H*0.17), y0=H-h;
  x.save();
  var g=x.createLinearGradient(0,y0,0,H);
  g.addColorStop(0,'rgba(10,14,24,0)');g.addColorStop(0.25,'rgba(8,11,20,.88)');g.addColorStop(1,'rgba(6,8,14,.97)');
  x.fillStyle=g;x.fillRect(0,y0,W,h);
  x.strokeStyle='rgba(120,190,255,.18)';x.beginPath();x.moveTo(0,y0+18);x.lineTo(W,y0+18);x.stroke();
  x.font='11px ui-monospace,monospace';x.textAlign='left';
  x.fillStyle='rgba(150,190,225,.62)';
  x.fillText('WALL-CLOCK AT 1 NANOSECOND PER OPERATION  —  n = '+Math.round(nCur),18,y0+12);
  var cols=FUNCS.length;
  var pad=18, cw=(W-pad*2)/cols;
  for(var i=0;i<cols;i++){
    var F=FUNCS[i],ops=F.f(nCur),dim=focus>=0&&focus!==i;
    var cx0=pad+i*cw;
    x.globalAlpha=dim?0.28:1;
    x.fillStyle=F.col;x.shadowColor=F.col;x.shadowBlur=dim?0:10;
    x.font='bold 12px ui-monospace,monospace';
    x.fillText(F.name,cx0,y0+44);
    x.shadowBlur=0;
    x.font='11px ui-monospace,monospace';
    x.fillStyle='rgba(225,240,255,.82)';
    x.fillText(commas(ops)+' ops',cx0,y0+62);
    x.fillStyle=(ops>3.1536e16)?'#ff7b9c':'rgba(160,200,230,.78)';
    x.fillText(nsToHuman(ops),cx0,y0+79);
    x.globalAlpha=1;
  }
  x.restore();
}

function bg(time){
  x.fillStyle='#05060a';x.fillRect(0,0,W,H);
  // soft nebula
  var g=x.createRadialGradient(W*0.5,H*0.42,10,W*0.5,H*0.42,Math.max(W,H)*0.7);
  g.addColorStop(0,'rgba(30,60,110,.30)');g.addColorStop(1,'rgba(5,6,10,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // faint scan drift
  x.save();x.globalAlpha=.05;x.strokeStyle='#6bd0ff';x.lineWidth=1;
  for(var i=0;i<H;i+=6){x.beginPath();x.moveTo(0,i+((time*0.02)%6));x.lineTo(W,i+((time*0.02)%6));x.stroke();}
  x.restore();
}

var last=performance.now();
function frame(now){
  var dt=Math.min(60,now-last);last=now;
  nCur+=speed*dt/16.7;
  if(nCur>NMAX){nCur=NMAX;}
  hitTest();
  var p=plot();
  bg(now);
  drawGrid(p);
  drawCurves(p,now);
  drawLegend(p,now);
  drawStrip(now);
  document.getElementById('sn').textContent=Math.round(nCur)+' / '+NMAX;
  document.getElementById('ss').textContent=logScale?'log₂':'linear';
  document.getElementById('sf').textContent=focus>=0?FUNCS[focus].name:'none';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;});
window.addEventListener('mouseleave',function(){mx=my=-1e9;});
window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(k==='l'){logScale=!logScale;}
  else if(k==='r'){nCur=1;speed=0.12;}
  else if(k===' '){speed=(speed>0?0:0.28);e.preventDefault();}
});
})();
</script>
