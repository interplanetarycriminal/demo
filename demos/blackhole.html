<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;}
  canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;touch-action:none;}
  #ui{position:fixed;top:10px;left:12px;z-index:10;font:12px/1.5 monospace;
      color:#fc9;background:rgba(0,0,0,.35);padding:8px 10px;
      border:1px solid rgba(255,180,120,.22);border-radius:4px;pointer-events:none;max-height:52vh;overflow:auto}
  #ui .t{color:#fff;font-weight:bold;letter-spacing:1px;}
  #ui a{color:#f96;pointer-events:auto;text-decoration:none;}
  #ui a:hover{color:#fda;}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
<canvas id="c"></canvas>
<div id="ui">
  <div class="t">BLACK HOLE</div>
  <div>move mouse: reposition &nbsp;·&nbsp; drag: fling stars</div>
  <div><a href="index.html">&larr; gallery</a></div>
</div>
<script>
var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if(!gl){ throw new Error('WebGL not available'); }

var VS = [
'attribute vec2 p;',
'void main(){ gl_Position = vec4(p,0.0,1.0); }'
].join('\n');

var FS = [
'precision highp float;',
'uniform vec2 res;',
'uniform float time;',
'uniform vec2 bh;',
'uniform vec2 flow;',
'float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }',
'vec3 starfield(vec2 dir){',
'  vec3 c=vec3(0.0);',
'  for(int i=0;i<3;i++){',
'    float sc=45.0+float(i)*55.0;',
'    vec2 g=dir*sc + flow*(1.0+float(i)*0.6);',
'    vec2 id=floor(g);',
'    vec2 f=fract(g)-0.5;',
'    float h=hash21(id+float(i)*17.3);',
'    float bright=step(0.965,h);',
'    float d=length(f);',
'    float tw=0.5+0.5*sin(time*3.0*h+h*40.0);',
'    float star=bright*smoothstep(0.35,0.0,d)*tw;',
'    vec3 tint=0.7+0.3*cos(vec3(1.0,2.0,3.0)*h*9.0);',
'    c+=star*tint;',
'  }',
'  return c;',
'}',
'void main(){',
'  vec2 uv=(gl_FragCoord.xy*2.0-res)/res.y;',
'  vec2 p=uv-bh;',
'  float r=length(p);',
'  vec2 rd=p/(r+1e-4);',
'  float horizon=0.11;',
'  float bend=0.16/(r*r+0.02);',
'  vec2 warped=uv - rd*bend;',
'  vec3 col=starfield(warped);',
'  float ang=atan(p.y,p.x);',
'  float diskR=0.30;',
'  float disk=smoothstep(0.135,diskR,r)*smoothstep(diskR+0.16,diskR,r);',
'  float swirl=sin(ang*3.0 - time*2.0 + 1.0/(r+0.05)*3.0)*0.5+0.5;',
'  float doppler=0.35+0.65*smoothstep(-1.0,1.0,sin(ang - 0.5));',
'  vec3 diskCol=mix(vec3(1.0,0.35,0.04), vec3(0.45,0.65,1.0), doppler);',
'  col+=disk*diskCol*(0.55+swirl)*doppler*2.3;',
'  col+=diskCol*0.16/(r*r*7.0+0.32);',
'  col*=smoothstep(horizon*0.75,horizon,r);',
'  col=pow(max(col,0.0), vec3(0.9));',
'  gl_FragColor=vec4(col,1.0);',
'}'
].join('\n');

function compile(type, src){
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}
function link(vs, fs){
  var p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    throw new Error(gl.getProgramInfoLog(p));
  }
  return p;
}

var prog = link(VS, FS);
gl.useProgram(prog);

var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
var loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

var uRes = gl.getUniformLocation(prog, 'res');
var uTime = gl.getUniformLocation(prog, 'time');
var uBh = gl.getUniformLocation(prog, 'bh');
var uFlow = gl.getUniformLocation(prog, 'flow');

var bh = [0,0], bhTarget = [0,0];
var flow = [0,0], vel = [0,0];
var dragging = false, lastX = 0, lastY = 0;

function toSpace(x,y){
  return [ (x*2-innerWidth)/innerHeight, (innerHeight-y*2)/innerHeight ];
}

function resize(){
  var dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = Math.floor(innerWidth*dpr);
  canvas.height = Math.floor(innerHeight*dpr);
  gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener('resize', resize);
resize();

window.addEventListener('mousemove', function(e){
  var s = toSpace(e.clientX, e.clientY);
  bhTarget[0] = s[0]; bhTarget[1] = s[1];
  if(dragging){
    vel[0] += (e.clientX-lastX)*0.35;
    vel[1] -= (e.clientY-lastY)*0.35;
    lastX = e.clientX; lastY = e.clientY;
  }
});
window.addEventListener('mousedown', function(e){ dragging=true; lastX=e.clientX; lastY=e.clientY; });
window.addEventListener('mouseup', function(){ dragging=false; });

var t0 = performance.now();
function frame(){
  var t = (performance.now()-t0)/1000;
  bh[0] += (bhTarget[0]-bh[0])*0.08;
  bh[1] += (bhTarget[1]-bh[1])*0.08;
  flow[0] += vel[0]*0.016;
  flow[1] += vel[1]*0.016;
  vel[0] *= 0.93; vel[1] *= 0.93;
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t);
  gl.uniform2f(uBh, bh[0], bh[1]);
  gl.uniform2f(uFlow, flow[0], flow[1]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
frame();
</script>
