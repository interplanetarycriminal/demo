<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>generative audio viz</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#03040a;overflow:hidden}
canvas{position:fixed;inset:0;display:block;z-index:0}
#ui{position:fixed;top:12px;left:12px;z-index:10;font:12px/1.7 ui-monospace,Menlo,Consolas,monospace;
color:rgba(200,220,255,.75);background:rgba(5,8,18,.55);padding:10px 14px;
border:1px solid rgba(120,160,255,.18);border-radius:8px;backdrop-filter:blur(4px);pointer-events:none}
#ui a{color:#7fd4ff;pointer-events:auto;text-decoration:none}
#ui a:hover{text-decoration:underline}
#ui .t{color:#fff;font-weight:700;letter-spacing:.1em}
#mst{color:#ff6b9d}
#splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:14px;cursor:pointer;background:rgba(3,4,10,.6);font:16px ui-monospace,Menlo,Consolas,monospace;color:#9fd8ff;
letter-spacing:.2em;text-transform:uppercase}
#splash .b{font-size:84px;color:#fff;text-shadow:0 0 30px #0ff,0 0 80px #08f;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div id="ui">
  <div class="t">GENERATIVE SYNTH VIZ</div>
  <div>space: new scale/tempo &middot; m: mute<span id="mst"></span></div>
  <a href="index.html">&larr; gallery</a>
</div>
<div id="splash"><div class="b">&#9654;</div><div>click to start</div></div>
<canvas id="c"></canvas>
<script>
var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
var DPR=Math.min(window.devicePixelRatio||1,2), W=0, H=0;
function resize(){
  W=innerWidth; H=innerHeight;
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
}
addEventListener('resize',resize); resize();

/* ---------- audio ---------- */
var ac=null, analyser=null, muteGain=null, filter=null, delay=null, mix=null, droneOsc=null;
var freqData=null, timeData=null;
var started=false, muted=false;
var SCALES=[[0,2,4,7,9],[0,3,5,7,10],[0,2,5,7,9],[0,3,5,8,10],[0,2,4,7,11]];
var scale=SCALES[1], root=57, tempo=0.27, nextT=0, walkIdx=5;

function midiHz(m){ return 440*Math.pow(2,(m-69)/12); }

function start(){
  if(started) return;
  started=true;
  document.getElementById('splash').style.display='none';
  ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended') ac.resume();

  mix=ac.createGain(); mix.gain.value=0.8;
  var comp=ac.createDynamicsCompressor();
  analyser=ac.createAnalyser(); analyser.fftSize=2048; analyser.smoothingTimeConstant=0.82;
  muteGain=ac.createGain(); muteGain.gain.value=1;
  mix.connect(comp); comp.connect(analyser); analyser.connect(muteGain); muteGain.connect(ac.destination);

  // shared lowpass -> dry + feedback delay
  filter=ac.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=1400; filter.Q.value=0.8;
  delay=ac.createDelay(2); delay.delayTime.value=tempo*1.5;
  var fb=ac.createGain(); fb.gain.value=0.38;
  var wet=ac.createGain(); wet.gain.value=0.5;
  filter.connect(mix);
  filter.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(mix);

  // slow filter wobble
  var flfo=ac.createOscillator(); flfo.frequency.value=0.05;
  var flfoG=ac.createGain(); flfoG.gain.value=450;
  flfo.connect(flfoG); flfoG.connect(filter.frequency); flfo.start();

  // quiet bass drone with breathing LFO
  droneOsc=ac.createOscillator(); droneOsc.type='sine';
  droneOsc.frequency.value=midiHz(root-24);
  var droneGain=ac.createGain(); droneGain.gain.value=0.055;
  var lfo=ac.createOscillator(); lfo.frequency.value=0.13;
  var lfoG=ac.createGain(); lfoG.gain.value=0.02;
  lfo.connect(lfoG); lfoG.connect(droneGain.gain);
  droneOsc.connect(droneGain); droneGain.connect(mix);
  droneOsc.start(); lfo.start();

  freqData=new Uint8Array(analyser.frequencyBinCount);
  timeData=new Uint8Array(analyser.fftSize);
  nextT=ac.currentTime+0.12;
  setInterval(scheduler,60);
}

function scheduler(){
  while(nextT<ac.currentTime+0.25){
    playNote(nextT);
    nextT+=tempo*(Math.random()<0.12?2:1);
  }
}

function playNote(t){
  if(Math.random()<0.14) return; // rest
  walkIdx+=[-2,-1,-1,1,1,2][Math.floor(Math.random()*6)];
  walkIdx=Math.max(0,Math.min(scale.length*3-1,walkIdx));
  var oct=Math.floor(walkIdx/scale.length), deg=walkIdx%scale.length;
  var o=ac.createOscillator();
  o.type=Math.random()<0.5?'triangle':'sine';
  o.frequency.value=midiHz(root+oct*12+scale[deg]);
  var g=ac.createGain();
  var peak=0.14+Math.random()*0.08, dur=tempo*(1.6+Math.random()*1.5);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(peak,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(filter);
  o.start(t); o.stop(t+dur+0.05);
}

function newScale(){
  scale=SCALES[Math.floor(Math.random()*SCALES.length)];
  root=45+Math.floor(Math.random()*14);
  tempo=0.2+Math.random()*0.22;
  walkIdx=scale.length;
  droneOsc.frequency.setTargetAtTime(midiHz(root-24),ac.currentTime,0.5);
  delay.delayTime.setTargetAtTime(tempo*1.5,ac.currentTime,0.3);
}

addEventListener('pointerdown',start);
addEventListener('keydown',function(e){
  if(e.code==='Space'){
    e.preventDefault();
    if(!started){ start(); return; }
    newScale();
  }
  if((e.key==='m'||e.key==='M') && started){
    muted=!muted;
    muteGain.gain.setTargetAtTime(muted?0:1,ac.currentTime,0.02);
    document.getElementById('mst').textContent=muted?' · MUTED':'';
  }
});

/* ---------- visuals ---------- */
var shake=0;
function draw(ts){
  requestAnimationFrame(draw);
  var t=ts*0.001, baseHue=(t*14)%360;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(3,4,10,0.22)';
  ctx.fillRect(0,0,W,H);

  var bass=0;
  if(analyser){
    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);
    for(var i=1;i<12;i++) bass+=freqData[i];
    bass/=11*255;
  }
  shake+=(Math.max(0,bass-0.52)*11-shake)*0.3;
  var cx=W/2+(Math.random()-0.5)*2*shake, cy=H/2+(Math.random()-0.5)*2*shake;
  ctx.translate(cx,cy);
  var m=Math.min(W,H), R=m*0.21;
  ctx.globalCompositeOperation='lighter';

  if(analyser){
    // radial FFT bars
    var BARS=110;
    ctx.lineWidth=3;
    for(i=0;i<BARS;i++){
      var bin=Math.floor(Math.pow(i/BARS,1.6)*freqData.length*0.62)+2;
      var v=freqData[bin]/255;
      var ang=i/BARS*Math.PI*2-Math.PI/2;
      var r0=R+6, r1=r0+2+v*v*m*0.24;
      var col='hsla('+((baseHue+i/BARS*140)%360)+',100%,'+(45+v*30)+'%,0.85)';
      ctx.strokeStyle=col; ctx.shadowBlur=14; ctx.shadowColor=col;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang)*r0,Math.sin(ang)*r0);
      ctx.lineTo(Math.cos(ang)*r1,Math.sin(ang)*r1);
      ctx.stroke();
    }
    // oscilloscope waveform ring
    var R2=m*0.36;
    ctx.beginPath();
    for(i=0;i<=256;i++){
      var w=(timeData[Math.floor(i/256*(timeData.length-1))]-128)/128;
      var a2=i/256*Math.PI*2;
      var rr=R2+w*m*0.06;
      var x=Math.cos(a2)*rr, y=Math.sin(a2)*rr;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    var wcol='hsla('+((baseHue+200)%360)+',100%,70%,0.55)';
    ctx.strokeStyle=wcol; ctx.lineWidth=1.5; ctx.shadowBlur=10; ctx.shadowColor=wcol;
    ctx.stroke();
  }

  // pulsing core
  var pr=R*(0.45+bass*0.55)+Math.sin(t*2.1)*3+6;
  ctx.shadowBlur=0;
  var grad=ctx.createRadialGradient(0,0,0,0,0,pr*2.2);
  grad.addColorStop(0,'hsla('+baseHue+',100%,78%,0.9)');
  grad.addColorStop(0.4,'hsla('+((baseHue+40)%360)+',100%,55%,0.35)');
  grad.addColorStop(1,'hsla('+((baseHue+80)%360)+',100%,50%,0)');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(0,0,pr*2.2,0,Math.PI*2); ctx.fill();
}
requestAnimationFrame(draw);
</script>
</body>
</html>
