<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<title>Bayes' Theorem — The Base-Rate Fallacy</title>
<style>
  html,body{margin:0;padding:0;background:#04050a;overflow:hidden;height:100%}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;top:0;left:0;margin:12px;padding:10px 12px;background:rgba(8,10,18,.66);
      border:1px solid rgba(120,200,255,.22);border-radius:8px;color:#bfe6ff;
      font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;width:308px;
      backdrop-filter:blur(6px);z-index:10}
  #ui h1{margin:0 0 4px;font-size:14px;letter-spacing:.08em;color:#7df9ff;text-transform:uppercase}
  #ui .exp{color:#8fa8bd;margin-bottom:8px}
  #ui .hint{color:#657c8f;margin-top:8px;line-height:1.5}

         border:1px solid rgba(120,200,255,.28);border-radius:5px;padding:4px 7px;cursor:pointer}
  button:hover{background:rgba(50,86,124,.9);color:#fff}
  button.hi{border-color:#ffd166;color:#ffd166}
</style>

<canvas id="c"></canvas>
<div id="ui">
  <h1>Bayes' Theorem</h1>
  <div class="exp">A 1% disease and a 99% accurate test: a positive result still leaves you only ~50% likely to be sick, because there are so many more healthy people for the test to get wrong.</div>
  <label class="row"><span class="k">prevalence P(D)</span><span class="v" id="v-p">1.0%</span></label>
  <input class="sick" type="range" id="s-p" min="0" max="1000" value="10">
  <label class="row"><span class="k">sensitivity P(+|D)</span><span class="v" id="v-se">99.0%</span></label>
  <input class="warm" type="range" id="s-se" min="0" max="1000" value="990">
  <label class="row"><span class="k">specificity P(&minus;|H)</span><span class="v" id="v-sp">99.0%</span></label>
  <input class="cool" type="range" id="s-sp" min="0" max="1000" value="990">
  <div class="btns">
    <button id="b-classic" class="hi">[c] classic paradox</button>
    <button id="b-replay">[r] replay</button>
    <button id="b-pos">[+] test +</button>
    <button id="b-neg">[&minus;] test &minus;</button>
    <button id="b-reset">[0] reset</button>
  </div>
  <div class="hint">[space] or click the canvas &middot; step the story &nbsp;&nbsp;<a href="index.html">&larr; gallery</a></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d'), W=0,H=0,DPR=1;
var TAU=Math.PI*2, N=10000, COLS=100;
var GC=[[255,96,110],[255,152,120],[80,178,255],[54,110,175]];   // TP, FN, FP, TN

/* ================= model ================= */
var P={p:0.01,se:0.99,sp:0.99};              // slider targets
var AN={p:0.01,se:0.99,sp:0.99};             // eased copies (area view)
var CT={sick:100,healthy:9900,tp:99,fn:1,fp:99,tn:9801};
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function posterior(p,se,sp){var n=p*se,d=n+(1-p)*(1-sp);return d>0?n/d:NaN;}
function recount(){
  var sick=Math.round(P.p*N), healthy=N-sick;
  var tp=Math.round(sick*P.se), fn=sick-tp;
  var fp=Math.round(healthy*(1-P.sp)), tn=healthy-fp;
  CT={sick:sick,healthy:healthy,tp:tp,fn:fn,fp:fp,tn:tn};
}
var EV=[];                                    // chain of evidence: true=+, false=-
function chain(){
  var cp=clamp(P.p,1e-9,1-1e-9), cse=clamp(P.se,1e-6,1-1e-6), csp=clamp(P.sp,1e-6,1-1e-6);
  var LRp=cse/(1-csp), LRn=(1-cse)/csp, o=cp/(1-cp), out=[cp];
  for(var i=0;i<EV.length;i++){
    o*=EV[i]?LRp:LRn;
    if(!isFinite(o)) o=1e12; if(!(o>0)) o=1e-12;
    out.push(o/(1+o));
  }
  return {vals:out,LRp:LRp,LRn:LRn};
}
function step(p,lr){var d=(1-p)+p*lr; return d>0?clamp(p*lr/d,0,1):p;}
var ZMAX=9.2;
function zx(p){
  if(!isFinite(p)) return 0.5;
  var cp=clamp(p,1e-9,1-1e-9);
  return clamp((clamp(Math.log(cp/(1-cp)),-ZMAX,ZMAX)+ZMAX)/(2*ZMAX),0,1);
}
function pct(v,d){return isFinite(v)?(v*100).toFixed(d===undefined?1:d)+'%':'—';}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t);}

/* ================= dot field ================= */
var X=new Float32Array(N),Y=new Float32Array(N),G=new Uint8Array(N),SG=new Float32Array(N);
var GXa=new Float32Array(N),GYa=new Float32Array(N),CXa=new Float32Array(N),CYa=new Float32Array(N);
for(var i0=0;i0<N;i0++) SG[i0]=((i0*7919)%997)/997;
var GS=[0,0,0,0], GN=[0,0,0,0];
var gridPitch=6, clusPitch=14, bandY=[0,0,0,0], bandY1=[0,0,0,0];
var tpY=0,fpY=0,clusX=0,clusW=0,seeded=false;

var R={};
function layout(){
  var pad=16, uiEl=document.getElementById('ui');
  var uiW=uiEl.offsetWidth+24, uiH=uiEl.offsetHeight+24;
  var wide=W>=1060&&H>=580;
  if(wide){
    var lx=pad+uiW-10, split=lx+(W-pad-lx)*0.615;
    R.main={x:lx,y:pad,w:split-lx-14,h:H-2*pad};
    var rx=split+2, rw=W-pad-rx, ry=pad, rh=H-2*pad;
    R.area={x:rx,y:ry,w:rw,h:rh*0.44};
    R.form={x:rx,y:ry+rh*0.455,w:rw,h:rh*0.195};
    R.seq ={x:rx,y:ry+rh*0.665,w:rw,h:rh*0.335};
  }else{
    var top=pad+uiH-10, av=Math.max(300,H-top-pad), cw=W-2*pad;
    var seqH=clamp(av*0.24,100,180), rowH=clamp(av*0.30,118,220);
    var mainH=Math.max(150,av-seqH-rowH-16);
    R.main={x:pad,y:top,w:cw,h:mainH};
    R.area={x:pad,y:top+mainH+8,w:cw*0.45,h:rowH};
    R.form={x:pad+cw*0.47,y:top+mainH+8,w:cw*0.53,h:rowH};
    R.seq ={x:pad,y:top+mainH+rowH+16,w:cw,h:seqH};
  }
  var m=R.main, lw=Math.min(180,m.w*0.29), foot=clamp(m.h*0.19,84,112);
  R.grid={x:m.x+10,y:m.y+42,w:Math.max(50,m.w-20-lw),h:Math.max(50,m.h-42-foot-8)};
  R.lab ={x:R.grid.x+R.grid.w+10,y:R.grid.y,w:lw,h:R.grid.h};
  R.foot={x:m.x+12,y:m.y+m.h-foot,w:m.w-24,h:foot-10};
  build();
}
function build(){
  buildGrid(); buildCluster();
  if(!seeded){for(var i=0;i<N;i++){X[i]=GXa[i];Y[i]=GYa[i];} seeded=true;}
}
function buildGrid(){
  var gr=R.grid, cnt=[CT.tp,CT.fn,CT.fp,CT.tn], rows=[],tot=0,nz=0,i;
  for(i=0;i<4;i++){rows[i]=Math.ceil(cnt[i]/COLS); tot+=rows[i]; if(cnt[i]>0)nz++;}
  var total=tot+0.85*Math.max(0,nz-1);
  var pitch=Math.min(gr.w/COLS,gr.h/Math.max(1,total));
  gridPitch=pitch;
  var bw=pitch*COLS, bh=pitch*total;
  var ox=gr.x+(gr.w-bw)/2, oy=gr.y+(gr.h-bh)/2, idx=0, rc=0;
  for(var g=0;g<4;g++){
    GS[g]=idx; GN[g]=cnt[g];
    bandY[g]=oy+rc*pitch; bandY1[g]=oy+(rc+rows[g])*pitch;
    for(var k=0;k<cnt[g];k++){
      var r=(k/COLS)|0, c=k-r*COLS;
      GXa[idx]=ox+(c+0.5)*pitch; GYa[idx]=oy+(rc+r+0.5)*pitch; G[idx]=g; idx++;
    }
    rc+=rows[g]; if(cnt[g]>0) rc+=0.85;
  }
  while(idx<N){GXa[idx]=ox+bw*0.5;GYa[idx]=oy+bh*0.5;G[idx]=3;GN[3]++;idx++;}
}
function buildCluster(){
  var gr=R.grid, pos=CT.tp+CT.fp, i;
  if(pos<1){
    for(i=0;i<N;i++){CXa[i]=GXa[i];CYa[i]=GYa[i];}
    clusPitch=gridPitch; tpY=fpY=gr.y+gr.h/2; clusX=gr.x+gr.w/2; clusW=0; return;
  }
  var aw=gr.w*0.62, ah=gr.h*0.80;
  var cols=Math.max(1,Math.round(Math.sqrt(pos*aw/ah))), rows=Math.ceil(pos/cols);
  var pitch=Math.min(aw/cols,ah/rows,30);
  clusPitch=pitch;
  var ox=gr.x+gr.w*0.5-cols*pitch*0.5, oy=gr.y+gr.h*0.52-rows*pitch*0.5;
  clusX=ox; clusW=cols*pitch;
  var k=0,ts=0,tn2=0,fs=0,fn2=0;
  for(i=0;i<N;i++){
    var g=G[i];
    if(g===0||g===2){
      var r=(k/cols)|0, c=k-r*cols;
      CXa[i]=ox+(c+0.5)*pitch; CYa[i]=oy+(r+0.5)*pitch; k++;
      if(g===0){ts+=CYa[i];tn2++;}else{fs+=CYa[i];fn2++;}
    }else{CXa[i]=GXa[i];CYa[i]=GYa[i]+24;}
  }
  tpY=tn2?ts/tn2:oy; fpY=fn2?fs/fn2:oy+rows*pitch;
}

/* ================= stage machine ================= */
var stage=0, sv=0, stageT=0, playing=true, flash=0, flashMsg='';
var DWELL=[1.4,2.2,2.8,1e9];
var CAP=['10,000 people walk in — nobody knows yet who is sick',
         'the base rate splits them: sick (red) vs healthy (blue)',
         'the test runs — a ring marks everyone who tested POSITIVE',
         'discard the negatives. THIS is everyone holding a positive result.'];
function setStage(s){stage=clamp(s,0,3);stageT=0;}
function advance(){setStage(stage>=3?0:stage+1);playing=true;}

/* ================= input ================= */
function slid(id,key){
  var el=document.getElementById(id);
  el.addEventListener('input',function(){P[key]=(+el.value)/1000;onParams();});
  return el;
}
var elP=slid('s-p','p'), elSe=slid('s-se','se'), elSp=slid('s-sp','sp');
function onParams(){
  document.getElementById('v-p').textContent=(P.p*100).toFixed(1)+'%';
  document.getElementById('v-se').textContent=(P.se*100).toFixed(1)+'%';
  document.getElementById('v-sp').textContent=(P.sp*100).toFixed(1)+'%';
  recount(); build();
  if(stage<2){setStage(2);playing=true;}
}
function classic(){
  P.p=0.01;P.se=0.99;P.sp=0.99;
  elP.value=10;elSe.value=990;elSp.value=990;
  onParams(); EV=[]; setStage(0); playing=true;
  flash=1; flashMsg='YOU TESTED POSITIVE.  YOU ARE ~50% LIKELY TO BE SICK.';
}
document.getElementById('b-classic').onclick=classic;
document.getElementById('b-replay').onclick=function(){setStage(0);playing=true;};
document.getElementById('b-pos').onclick=function(){if(EV.length<24)EV.push(true);};
document.getElementById('b-neg').onclick=function(){if(EV.length<24)EV.push(false);};
document.getElementById('b-reset').onclick=function(){EV=[];};
cv.addEventListener('pointerdown',advance);
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k===' '){advance();e.preventDefault();}
  else if(k==='r'||k==='R'){setStage(0);playing=true;}
  else if(k==='c'||k==='C') classic();
  else if(k==='+'||k==='='){if(EV.length<24)EV.push(true);}
  else if(k==='-'||k==='_'){if(EV.length<24)EV.push(false);}
  else if(k==='0'||k==='Backspace') EV=[];
});

/* ================= draw helpers ================= */
function rr(x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function mono(px,w){return (w?w+' ':'')+px.toFixed(1)+'px ui-monospace,Menlo,Consolas,monospace';}
function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function txt(s,x,y,font,col,align,base){
  ctx.font=font; ctx.fillStyle=col; ctx.textAlign=align||'left'; ctx.textBaseline=base||'alphabetic';
  ctx.fillText(s,x,y);
}
function panel(r,title){
  ctx.fillStyle='rgba(9,13,22,.55)'; rr(r.x,r.y,r.w,r.h,10); ctx.fill();
  ctx.strokeStyle='rgba(120,200,255,.14)'; ctx.lineWidth=1; ctx.stroke();
  if(title) txt(title,r.x+12,r.y+16,mono(10),'#4e7f9e');
}

/* ================= view 1: natural frequencies ================= */
function drawDots(f){
  var i,g,x,y,s,e;
  var col=clamp(sv,0,1), ring=clamp(sv-1,0,1);
  var pitch=gridPitch+(clusPitch-gridPitch)*smooth(f);
  var rad=Math.max(0.75,pitch*0.34);
  var alpha=[1,1-0.93*f,1,1-0.93*f];
  var cols=[];
  for(g=0;g<4;g++)
    cols[g]=[Math.round(110+(GC[g][0]-110)*col),Math.round(126+(GC[g][1]-126)*col),Math.round(146+(GC[g][2]-146)*col)];
  // glow pass for the two positive groups
  ctx.globalCompositeOperation='lighter';
  for(g=0;g<4;g+=2){
    if(GN[g]===0||GN[g]>3000) continue;
    s=GS[g]; e=s+GN[g]; ctx.beginPath();
    for(i=s;i<e;i++){x=X[i];y=Y[i];ctx.moveTo(x+rad*2.4,y);ctx.arc(x,y,rad*2.4,0,TAU);}
    ctx.fillStyle=rgba(cols[g],0.05+0.11*ring+0.10*f); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  // cores
  for(g=0;g<4;g++){
    if(GN[g]===0||alpha[g]<=0.02) continue;
    s=GS[g]; e=s+GN[g]; ctx.beginPath();
    for(i=s;i<e;i++){x=X[i];y=Y[i];ctx.moveTo(x+rad,y);ctx.arc(x,y,rad,0,TAU);}
    ctx.fillStyle=rgba(cols[g],alpha[g]); ctx.fill();
  }
  // rings for the positives
  if(ring>0.01){
    var rr2=rad*(1.55+0.55*(1-ring));
    for(g=0;g<4;g+=2){
      if(GN[g]===0) continue;
      s=GS[g]; e=s+GN[g]; ctx.beginPath();
      for(i=s;i<e;i++){x=X[i];y=Y[i];ctx.moveTo(x+rr2,y);ctx.arc(x,y,rr2,0,TAU);}
      ctx.lineWidth=Math.max(0.7,rad*0.42);
      ctx.strokeStyle=(g===0)?'rgba(255,214,102,'+(0.9*ring)+')':'rgba(150,235,255,'+(0.8*ring)+')';
      ctx.stroke();
    }
  }
}
var NAMES=['TRUE POSITIVE','FALSE NEGATIVE','FALSE POSITIVE','TRUE NEGATIVE'];
var SUBS=['sick · test says +','sick · test says −','healthy · test says +','healthy · test says −'];
function drawMain(){
  var m=R.main, f=smooth(clamp(sv-2,0,1)), i, g;
  panel(m,null);
  txt('1 · NATURAL FREQUENCIES',m.x+12,m.y+18,mono(10),'#4e7f9e');
  txt(CAP[stage],m.x+12,m.y+34,mono(11.5),stage===3?'#ffd166':'#9fc4dc');
  drawDots(f);

  var cnts=[CT.tp,CT.fn,CT.fp,CT.tn], la=(1-f)*clamp((sv-0.6)*1.6,0,1), L=R.lab;
  if(la>0.03){
    var vis=[];
    for(g=0;g<4;g++) if(cnts[g]>0) vis.push({g:g,by:(bandY[g]+bandY1[g])/2,ly:(bandY[g]+bandY1[g])/2});
    for(i=1;i<vis.length;i++) if(vis[i].ly<vis[i-1].ly+38) vis[i].ly=vis[i-1].ly+38;
    if(vis.length){
      var over=vis[vis.length-1].ly-(L.y+L.h-14);
      if(over>0) for(i=0;i<vis.length;i++) vis[i].ly-=over;
      if(vis[0].ly<L.y+16){var up=L.y+16-vis[0].ly; for(i=0;i<vis.length;i++) vis[i].ly+=up;}
    }
    for(i=0;i<vis.length;i++){
      g=vis[i].g;
      ctx.strokeStyle=rgba(GC[g],0.55*la); ctx.lineWidth=1.3;
      ctx.beginPath();
      ctx.moveTo(L.x-5,bandY[g]+0.5); ctx.lineTo(L.x,bandY[g]+0.5);
      ctx.lineTo(L.x,bandY1[g]-0.5); ctx.lineTo(L.x-5,bandY1[g]-0.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(L.x,vis[i].by); ctx.lineTo(L.x+7,vis[i].ly-4); ctx.stroke();
      txt(cnts[g].toLocaleString(),L.x+11,vis[i].ly,mono(13,'bold'),rgba(GC[g],0.98*la));
      txt(NAMES[g],L.x+11,vis[i].ly+11,mono(9),rgba(GC[g],0.68*la));
      txt(SUBS[g],L.x+11,vis[i].ly+21,'9.0px ui-monospace,Menlo,Consolas,monospace','rgba(150,175,196,'+(0.6*la)+')');
    }
  }
  if(f>0.05){
    var lx=clusX+clusW+16, right=(lx+160<m.x+m.w), al=right?'left':'right';
    if(!right) lx=clusX-16;
    var y0=tpY, y1=Math.max(fpY,y0+36);
    if(CT.tp>0){
      txt(CT.tp.toLocaleString()+'  truly sick',lx,y0-3,mono(13.5,'bold'),'rgba(255,124,136,'+f+')',al);
      txt('true positives',lx,y0+11,mono(9.5),'rgba(255,150,160,'+(0.75*f)+')',al);
    }
    if(CT.fp>0){
      txt(CT.fp.toLocaleString()+'  perfectly healthy',lx,y1-3,mono(13.5,'bold'),'rgba(110,195,255,'+f+')',al);
      txt('false positives',lx,y1+11,mono(9.5),'rgba(140,205,255,'+(0.75*f)+')',al);
    }
  }
  drawFoot(f);
}
function drawFoot(f){
  var r=R.foot, post=posterior(P.p,P.se,P.sp);
  var chipW=clamp(r.w*0.24,72,116), chipH=clamp((r.h-6)/2,22,34);
  var lbl=['TP','FN','FP','TN'], vals=[CT.tp,CT.fn,CT.fp,CT.tn];
  for(var i=0;i<4;i++){
    var cx=r.x+(i%2)*(chipW+8), cy=r.y+((i/2)|0)*(chipH+6);
    ctx.fillStyle=rgba(GC[i],0.11); rr(cx,cy,chipW,chipH,5); ctx.fill();
    ctx.strokeStyle=rgba(GC[i],0.38); ctx.lineWidth=1; ctx.stroke();
    txt(lbl[i],cx+7,cy+12,mono(9),rgba(GC[i],0.85));
    txt(vals[i].toLocaleString(),cx+7,cy+chipH-7,mono(13,'bold'),rgba(GC[i],1));
  }
  var bx=r.x+2*chipW+28, avail=r.x+r.w-bx;
  txt('P(sick | positive)',bx,r.y+13,mono(10),'#6f8598');
  var big=clamp(Math.min(r.h*0.66,avail*0.30),22,58);
  ctx.save();
  ctx.shadowColor='rgba(255,209,102,'+(0.35+0.45*f)+')'; ctx.shadowBlur=16+24*f;
  txt(pct(post),bx,r.y+r.h-4,mono(big,'bold'),isFinite(post)?'#ffd166':'#7a8a9a');
  ctx.restore();
  var w2=ctx.measureText(pct(post)).width;
  var note=isFinite(post)?(CT.tp+CT.fp>0?'= '+CT.tp.toLocaleString()+' of '+(CT.tp+CT.fp).toLocaleString()+' positives':'')
                         :'nobody tests positive — undefined';
  if(note&&bx+w2+14+ctx.measureText(note).width<r.x+r.w+30)
    txt(note,bx+w2+14,r.y+r.h-10,mono(10.5),'#8fa8bd');
}

/* ================= view 2: the area proof ================= */
function drawArea(){
  var r=R.area; panel(r,'2 · THE AREA PROOF  ·  area = probability');
  var p=AN.p,se=AN.se,sp=AN.sp, barH=24, gap=14;
  var x=r.x+16, y=r.y+30, w=r.w-32, h=r.h-30-barH-gap-34;
  if(h<34||w<60) return;
  var wS=w*p, wH=w-wS, hTP=h*se, hFP=h*(1-sp);
  var q=[[x,y,wS,hTP,0,'TP',p*se],[x,y+hTP,wS,h-hTP,1,'FN',p*(1-se)],
         [x+wS,y,wH,hFP,2,'FP',(1-p)*(1-sp)],[x+wS,y+hFP,wH,h-hFP,3,'TN',(1-p)*sp]];
  for(var i=0;i<4;i++){
    var a=q[i];
    if(a[2]<=0.3||a[3]<=0.3) continue;
    ctx.fillStyle=rgba(GC[a[4]],(a[4]===0||a[4]===2)?0.60:0.19);
    ctx.fillRect(a[0],a[1],a[2],a[3]);
    ctx.strokeStyle=rgba(GC[a[4]],0.5); ctx.lineWidth=1;
    ctx.strokeRect(a[0]+0.5,a[1]+0.5,Math.max(0,a[2]-1),Math.max(0,a[3]-1));
    if(a[2]>46&&a[3]>28){
      txt(a[5],a[0]+6,a[1]+14,mono(10,'bold'),rgba(GC[a[4]],0.95));
      txt(a[6].toFixed(4),a[0]+6,a[1]+26,mono(9.5),'rgba(200,220,240,.72)');
    }
  }
  ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(x+wS,y-7); ctx.lineTo(x+wS,y+h+7); ctx.stroke(); ctx.setLineDash([]);
  txt('width = base rate P(D) = '+pct(p,2),x,y+h+16,mono(9.5),'#8fa8bd');
  txt('height = test accuracy',x+w,y+h+16,mono(9.5),'#8fa8bd','right');

  var tp=p*se, fp=(1-p)*(1-sp), tot=tp+fp, by=y+h+gap+16, bw=w;
  txt('the positive strip, rescaled →',x,by-2,mono(9.5),'#6f8598');
  ctx.fillStyle='rgba(255,255,255,.05)'; rr(x,by+4,bw,barH,5); ctx.fill();
  if(tot>0){
    var wt=bw*(tp/tot);
    ctx.save(); rr(x,by+4,bw,barH,5); ctx.clip();
    ctx.fillStyle=rgba(GC[0],0.85); ctx.fillRect(x,by+4,wt,barH);
    ctx.fillStyle=rgba(GC[2],0.72); ctx.fillRect(x+wt,by+4,bw-wt,barH);
    ctx.restore();
    if(wt>54) txt(pct(tp/tot),x+7,by+4+barH*0.7,mono(13,'bold'),'#fff');
    if(bw-wt>54) txt(pct(fp/tot),x+bw-7,by+4+barH*0.7,mono(13,'bold'),'#eaf6ff','right');
    ctx.strokeStyle='#ffd166'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(x+wt,by); ctx.lineTo(x+wt,by+barH+8); ctx.stroke();
  }else{
    txt('no positive results at these settings',x+bw/2,by+4+barH*0.7,mono(10),'#7a8a9a','center');
  }
}

/* ================= formula, live ================= */
function drawForm(){
  var r=R.form; panel(r,'BAYES, WITH YOUR NUMBERS');
  var p=P.p,se=P.se,sp=P.sp, post=posterior(p,se,sp), num=se*p, den=num+(1-sp)*(1-p);
  var x=r.x+14, y=r.y+36, fs=clamp(r.w/34,7.5,12.5);
  txt('P(D|+) = ',x,y,mono(fs),'#cfe8ff');
  var lx=x+ctx.measureText('P(D|+) = ').width;
  txt('P(+|D)·P(D)',lx,y-7,mono(fs),'#ff8a97');
  var wn=ctx.measureText('P(+|D)·P(D)').width;
  txt('P(+|D)·P(D) + P(+|H)·P(H)',lx,y+15,mono(fs),'#9fc4dc');
  var wd=ctx.measureText('P(+|D)·P(D) + P(+|H)·P(H)').width;
  ctx.strokeStyle='rgba(180,215,240,.45)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(lx,y+3.5); ctx.lineTo(lx+Math.max(wn,wd),y+3.5); ctx.stroke();

  var y2=y+46, f=clamp(r.w/38,7,12);
  var s1=se.toFixed(3)+'×'+p.toFixed(3), s2=(1-sp).toFixed(3)+'×'+(1-p).toFixed(3);
  txt('= ',x,y2+4,mono(f),'#cfe8ff');
  var ox=x+ctx.measureText('= ').width;
  txt(s1,ox,y2-4,mono(f),'#ff8a97');
  var w1=ctx.measureText(s1).width;
  txt(s1+' + '+s2,ox,y2+16,mono(f),'#9fc4dc');
  var w2=ctx.measureText(s1+' + '+s2).width;
  ctx.beginPath(); ctx.moveTo(ox,y2+4.5); ctx.lineTo(ox+Math.max(w1,w2),y2+4.5); ctx.stroke();
  var ex=ox+Math.max(w1,w2)+12;
  txt('=',ex,y2+4,mono(f),'#cfe8ff');
  txt(pct(post),ex+f*1.3,y2+7,mono(clamp(f*1.8,12,22),'bold'),isFinite(post)?'#ffd166':'#7a8a9a');
  txt(num.toFixed(5)+' / '+den.toFixed(5),x,r.y+r.h-10,mono(9.5),'#5d7286');
}

/* ================= view 3: sequential updating ================= */
var seqPos=null;
function drawSeq(){
  var r=R.seq; panel(r,'3 · SEQUENTIAL UPDATING  ·  on a log-odds ruler every test is the same size jump');
  var ch=chain(), vals=ch.vals, cur=vals[vals.length-1];
  var x=r.x+20, w=r.w-40, y=r.y+clamp(r.h*0.42,44,74), i;
  if(w<80) return;
  var ticks=[0.001,0.01,0.1,0.5,0.9,0.99,0.999], tl=['0.1%','1%','10%','50%','90%','99%','99.9%'];
  ctx.strokeStyle='rgba(120,200,255,.20)'; ctx.lineWidth=1;
  for(i=0;i<ticks.length;i++){
    var tx=x+w*zx(ticks[i]);
    ctx.beginPath(); ctx.moveTo(tx,y-5); ctx.lineTo(tx,y+5); ctx.stroke();
    txt(tl[i],tx,y+18,mono(9),'#5d7286','center');
  }
  var gg=ctx.createLinearGradient(x,0,x+w,0);
  gg.addColorStop(0,'rgba(70,170,255,.35)'); gg.addColorStop(0.5,'rgba(255,209,102,.4)');
  gg.addColorStop(1,'rgba(255,96,110,.45)');
  ctx.fillStyle=gg; ctx.fillRect(x,y-1.5,w,3);
  // ghosts: where one more + / − would land
  var gp=x+w*zx(step(cur,ch.LRp)), gn=x+w*zx(step(cur,ch.LRn));
  ghost(gp,y,'rgba(255,120,132,.55)'); ghost(gn,y,'rgba(90,190,255,.55)');
  // trail
  for(i=0;i<vals.length;i++){
    var vx=x+w*zx(vals[i]), a=0.2+0.6*(i/Math.max(1,vals.length-1));
    if(i>0){
      var px=x+w*zx(vals[i-1]);
      ctx.strokeStyle=EV[i-1]?'rgba(255,120,132,'+(0.3+0.4*a)+')':'rgba(90,190,255,'+(0.3+0.4*a)+')';
      ctx.lineWidth=1.2; ctx.beginPath();
      ctx.moveTo(px,y-12); ctx.quadraticCurveTo((px+vx)/2,y-26,vx,y-12); ctx.stroke();
    }
    ctx.fillStyle='rgba(205,228,248,'+a+')';
    ctx.beginPath(); ctx.arc(vx,y-12,2.2,0,TAU); ctx.fill();
  }
  txt('prior '+pct(vals[0],2),x+w*zx(vals[0]),y-32,mono(9),'#8fa8bd','center');
  var cx=x+w*zx(cur);
  if(seqPos===null) seqPos=cx;
  seqPos+=(cx-seqPos)*0.18;
  ctx.save(); ctx.shadowColor='rgba(255,209,102,.9)'; ctx.shadowBlur=14;
  ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.arc(seqPos,y,5.5,0,TAU); ctx.fill(); ctx.restore();
  txt(pct(cur,(cur>0.99||cur<0.02)?2:1),seqPos,y+40,mono(16,'bold'),'#ffd166','center');
  txt('after '+EV.length+' test'+(EV.length===1?'':'s'),seqPos,y+53,mono(9),'#8fa8bd','center');
  // history + legend
  var hy=r.y+r.h-14;
  txt('evidence:',r.x+20,hy,mono(9.5),'#6f8598');
  var hx=r.x+20+ctx.measureText('evidence: ').width;
  if(EV.length===0) txt('none yet — press [+] or [−]',hx,hy,mono(9.5),'#5d7286');
  for(i=0;i<EV.length;i++){
    var bx=hx+i*12;
    if(bx>r.x+r.w-150) break;
    ctx.fillStyle=EV[i]?'rgba(255,96,110,.9)':'rgba(70,170,255,.85)';
    rr(bx,hy-8,9,9,2); ctx.fill();
    txt(EV[i]?'+':'−',bx+4.5,hy-0.5,mono(8,'bold'),'#04050a','center');
  }
  txt('LR+ '+ch.LRp.toFixed(1)+'   LR− '+ch.LRn.toFixed(3),r.x+r.w-20,hy,mono(9.5),'#5d7286','right');
}
function ghost(gx,y,col){
  ctx.strokeStyle=col; ctx.lineWidth=1; ctx.setLineDash([2,3]);
  ctx.beginPath(); ctx.moveTo(gx,y-7); ctx.lineTo(gx,y+7); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(gx-3.5,y-11); ctx.lineTo(gx+3.5,y-11); ctx.lineTo(gx,y-6.5); ctx.closePath(); ctx.fill();
}

/* ================= loop ================= */
function bg(){
  var g=ctx.createRadialGradient(W*0.45,H*0.4,20,W*0.5,H*0.5,Math.max(W,H)*0.8);
  g.addColorStop(0,'#0a1020'); g.addColorStop(1,'#04050a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
var last=0;
function frame(t){
  var dt=clamp((t-last)/1000||0.016,0.001,0.05); last=t;
  AN.p+=(P.p-AN.p)*Math.min(1,dt*7);
  AN.se+=(P.se-AN.se)*Math.min(1,dt*7);
  AN.sp+=(P.sp-AN.sp)*Math.min(1,dt*7);
  stageT+=dt;
  sv+=(stage-sv)*Math.min(1,dt*3.2);
  if(playing&&stage<3&&stageT>DWELL[stage]) setStage(stage+1);
  var f=smooth(clamp(sv-2,0,1));
  for(var i=0;i<N;i++){
    var fi=smooth(clamp(f*1.5-SG[i]*0.5,0,1));
    var tx=GXa[i]+(CXa[i]-GXa[i])*fi, ty=GYa[i]+(CYa[i]-GYa[i])*fi;
    var k=Math.min(1,dt*(7+SG[i]*5));
    X[i]+=(tx-X[i])*k; Y[i]+=(ty-Y[i])*k;
  }
  bg(); drawMain(); drawArea(); drawForm(); drawSeq();
  if(flash>0){
    flash-=dt*0.28;
    var a=clamp(flash*1.7,0,1)*(0.75+0.25*Math.sin(t*0.006));
    var fz=clamp(W/46,12,30);
    ctx.save(); ctx.font=mono(fz,'bold');
    var mw=ctx.measureText(flashMsg).width;
    ctx.fillStyle='rgba(4,5,10,'+(0.72*a)+')';
    rr(W/2-mw/2-26,H*0.5-fz*1.5,mw+52,fz*3,12); ctx.fill();
    ctx.strokeStyle='rgba(255,209,102,'+(0.65*a)+')'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.shadowColor='rgba(255,209,102,.85)'; ctx.shadowBlur=24;
    txt(flashMsg,W/2,H*0.5+fz*0.35,mono(fz,'bold'),'rgba(255,228,155,'+a+')','center');
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
window.addEventListener('resize',resize);
recount(); resize(); onParams(); setStage(0); EV=[];
requestAnimationFrame(frame);
})();
</script>
