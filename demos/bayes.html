<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<title>Bayes' Theorem — The Base-Rate Fallacy</title>
<style>
  html,body{margin:0;padding:0;background:#04050a;overflow:hidden;height:100%}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;top:0;left:0;margin:12px;padding:10px 12px;background:rgba(8,10,18,.66);
      border:1px solid rgba(120,200,255,.22);border-radius:8px;color:#bfe6ff;

         border:1px solid rgba(120,200,255,.28);border-radius:5px;padding:4px 7px;cursor:pointer}
  button:hover{background:rgba(50,86,124,.9);color:#fff}
  button.hi{border-color:#ffd166;color:#ffd166}
</style>

<canvas id="c"></canvas>
<div id="ui">
  <h1>Bayes' Theorem</h1>
  <div class="exp">A 1% disease and a 99% accurate test: your positive result still means only a coin-flip chance you are sick — because there are so many more healthy people to get wrong.</div>
  <label class="row"><span class="k">prevalence P(D)</span><span class="v" id="v-p">1.0%</span></label>
  <input class="sick" type="range" id="s-p" min="0" max="1000" value="10">
  <label class="row"><span class="k">sensitivity P(+|D)</span><span class="v" id="v-se">99.0%</span></label>
  <input class="warm" type="range" id="s-se" min="0" max="1000" value="990">
  <label class="row"><span class="k">specificity P(-|H)</span><span class="v" id="v-sp">99.0%</span></label>
  <input class="cool" type="range" id="s-sp" min="0" max="1000" value="990">
  <div class="btns">
    <button id="b-classic" class="hi">[c] classic paradox</button>
    <button id="b-replay">[r] replay</button>
    <button id="b-pos">[+] test +</button>
    <button id="b-neg">[&minus;] test &minus;</button>
    <button id="b-reset">[0] reset chain</button>
  </div>
  <div class="hint">[space] / click canvas &middot; step the story &nbsp;<a href="index.html">&larr; gallery</a></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d'), W=0,H=0,DPR=1;
var TAU=Math.PI*2, N=10000, COLS=100;

/* ---------- colours ---------- */
var C_SICK='#ff5a6e', C_HEAL='#3fa9f5', C_DIM='#5d6b7d';
var GC=[[255,96,110],[255,150,120],[80,178,255],[60,120,190]];  // tp,fn,fp,tn
var RING=['#ffd166','#ff8a5b','#8be9ff','#2d5b82'];

/* ---------- model ---------- */
var P={p:0.01,se:0.99,sp:0.99};        // targets from sliders
var AN={p:0.01,se:0.99,sp:0.99};       // eased, for the area view
var CT={sick:100,healthy:9900,tp:99,fn:1,fp:99,tn:9801};
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function posterior(p,se,sp){var n=p*se,d=n+(1-p)*(1-sp); return d>0? n/d : NaN;}
function recount(){
  var sick=Math.round(P.p*N), healthy=N-sick;
  var tp=Math.round(sick*P.se), fn=sick-tp;
  var fp=Math.round(healthy*(1-P.sp)), tn=healthy-fp;
  CT={sick:sick,healthy:healthy,tp:tp,fn:fn,fp:fp,tn:tn};
}
/* sequential chain in odds form */
var EV=[];                              // true = positive test, false = negative
function chain(){
  var cp=clamp(P.p,1e-9,1-1e-9), cse=clamp(P.se,1e-6,1-1e-6), csp=clamp(P.sp,1e-6,1-1e-6);
  var LRp=cse/(1-csp), LRn=(1-cse)/csp;
  var o=cp/(1-cp), out=[cp];
  for(var i=0;i<EV.length;i++){ o*=EV[i]?LRp:LRn; if(!isFinite(o))o=1e12; if(!(o>0))o=1e-12; out.push(o/(1+o)); }
  return {vals:out,LRp:LRp,LRn:LRn};
}
var ZMAX=9.2;
function zx(p){var cp=clamp(p,1e-9,1-1e-9); return clamp((clamp(Math.log(cp/(1-cp)),-ZMAX,ZMAX)+ZMAX)/(2*ZMAX),0,1);}
function pct(v,d){return isFinite(v)? (v*100).toFixed(d===undefined?1:d)+'%' : '—';}

/* ---------- dot field ---------- */
var X=new Float32Array(N),Y=new Float32Array(N),G=new Uint8Array(N),SG=new Float32Array(N);
var GXa=new Float32Array(N),GYa=new Float32Array(N),CXa=new Float32Array(N),CYa=new Float32Array(N);
for(var i=0;i<N;i++) SG[i]=((i*2654435761)%1000)/1000;
var gridPitch=6, clusPitch=14, bandY=[0,0,0,0], bandY1=[0,0,0,0], tpY=0,fpY=0,clusX=0,clusW=0;
var seeded=false;

var R={};                                 // layout regions
function layout(){
  var pad=16, uiEl=document.getElementById('ui');
  var uiW=uiEl.offsetWidth+24, uiH=uiEl.offsetHeight+24;
  var wide = W>=1080 && H>=600;
  R.wide=wide;
  if(wide){
    var lx=pad+uiW-8, rw0=W-pad-lx;
    var split=lx+rw0*0.615;
    R.main={x:lx,y:pad,w:split-lx-14,h:H-2*pad};
    var rx=split+2, rw=W-pad-rx, ry=pad, rh=H-2*pad;
    R.area={x:rx,y:ry,w:rw,h:rh*0.46};
    R.form={x:rx,y:ry+rh*0.475,w:rw,h:rh*0.175};
    R.seq ={x:rx,y:ry+rh*0.665,w:rw,h:rh*0.335};
  } else {
    var top=pad+uiH-8, av=Math.max(340,H-top-pad);
    R.main={x:pad,y:top,w:W-2*pad,h:av*0.50};
    R.area={x:pad,y:top+av*0.515,w:(W-2*pad)*0.45,h:av*0.29};
    R.form={x:pad+(W-2*pad)*0.47,y:top+av*0.515,w:(W-2*pad)*0.53,h:av*0.29};
    R.seq ={x:pad,y:top+av*0.825,w:W-2*pad,h:av*0.175};
  }
  var m=R.main, lw=Math.min(178,m.w*0.28), foot=Math.max(86,Math.min(112,m.h*0.19));
  R.grid={x:m.x+10,y:m.y+40,w:Math.max(60,m.w-20-lw),h:Math.max(60,m.h-40-foot-10)};
  R.lab ={x:R.grid.x+R.grid.w+10,y:R.grid.y,w:lw,h:R.grid.h};
  R.foot={x:m.x+12,y:m.y+m.h-foot,w:m.w-24,h:foot-8};
  build();
}
function build(){ buildGrid(); buildCluster(); if(!seeded){for(var i=0;i<N;i++){X[i]=GXa[i];Y[i]=GYa[i];} seeded=true;} }

function buildGrid(){
  var gr=R.grid, cnt=[CT.tp,CT.fn,CT.fp,CT.tn], rows=[],tot=0,nz=0,i;
  for(i=0;i<4;i++){ rows[i]=Math.ceil(cnt[i]/COLS); tot+=rows[i]; if(cnt[i]>0)nz++; }
  var total=tot+0.85*Math.max(0,nz-1);
  var pitch=Math.min(gr.w/COLS, gr.h/Math.max(1,total));
  gridPitch=pitch;
  var bw=pitch*COLS, bh=pitch*total;
  var ox=gr.x+(gr.w-bw)/2, oy=gr.y+(gr.h-bh)/2;
  var idx=0, rc=0;
  for(var g=0;g<4;g++){
    bandY[g]=oy+rc*pitch; bandY1[g]=oy+(rc+rows[g])*pitch;
    for(var k=0;k<cnt[g];k++){
      var r=(k/COLS)|0, c=k-r*COLS;
      GXa[idx]=ox+(c+0.5)*pitch; GYa[idx]=oy+(rc+r+0.5)*pitch; G[idx]=g; idx++;
    }
    rc+=rows[g]; if(cnt[g]>0) rc+=0.85;
  }
  while(idx<N){ GXa[idx]=ox+bw*0.5; GYa[idx]=oy+bh*0.5; G[idx]=3; idx++; }
}
function buildCluster(){
  var gr=R.grid, pos=CT.tp+CT.fp, i;
  if(pos<1){ for(i=0;i<N;i++){CXa[i]=GXa[i];CYa[i]=GYa[i];} clusPitch=gridPitch; tpY=fpY=gr.y+gr.h/2; return; }
  var aw=gr.w*0.66, ah=gr.h*0.80;
  var cols=Math.max(1,Math.round(Math.sqrt(pos*aw/ah)));
  var rows=Math.ceil(pos/cols);
  var pitch=Math.min(aw/cols, ah/rows, 30);
  clusPitch=pitch;
  var ox=gr.x+gr.w*0.5-cols*pitch*0.5, oy=gr.y+gr.h*0.53-rows*pitch*0.5;
  clusX=ox; clusW=cols*pitch;
  var k=0, tps=0,tpn=0, fps=0,fpn=0;
  for(i=0;i<N;i++){
    var g=G[i];
    if(g===0||g===2){
      var r=(k/cols)|0, c=k-r*cols;
      CXa[i]=ox+(c+0.5)*pitch; CYa[i]=oy+(r+0.5)*pitch; k++;
      if(g===0){tps+=CYa[i];tpn++;} else {fps+=CYa[i];fpn++;}
    } else { CXa[i]=GXa[i]; CYa[i]=GYa[i]+26; }
  }
  tpY=tpn?tps/tpn:oy; fpY=fpn?fps/fpn:oy+rows*pitch;
}

/* ---------- stage machine ---------- */
var stage=0, sv=0, stageT=0, playing=true;
var DWELL=[1.3,2.2,2.6,999];
var CAP=['10,000 people walk in — nobody knows who is sick',
         'prevalence splits them: sick (red) vs healthy (blue)',
         'the test runs — a ring marks everyone who tests POSITIVE',
         'throw away the negatives. This is everyone who tested positive.'];
function setStage(s){ stage=clamp(s,0,3); stageT=0; }
function advance(){ if(stage>=3) setStage(0); else setStage(stage+1); playing=true; }
var flash=0, flashMsg='';

/* ---------- input ---------- */
function slid(id,key,scale){
  var el=document.getElementById(id);
  el.addEventListener('input',function(){ P[key]=(+el.value)/1000; onParams(); });
  return el;
}
var elP=slid('s-p','p'), elSe=slid('s-se','se'), elSp=slid('s-sp','sp');
function onParams(){
  document.getElementById('v-p').textContent=(P.p*100).toFixed(1)+'%';
  document.getElementById('v-se').textContent=(P.se*100).toFixed(1)+'%';
  document.getElementById('v-sp').textContent=(P.sp*100).toFixed(1)+'%';
  recount(); build();
  if(stage<2){ setStage(2); playing=true; }
}
function classic(){
  P.p=0.01;P.se=0.99;P.sp=0.99;
  elP.value=10; elSe.value=990; elSp.value=990;
  onParams(); EV=[]; setStage(0); playing=true;
  flash=1; flashMsg='YOU TESTED POSITIVE.  YOU ARE ~50% LIKELY TO BE SICK.';
}
document.getElementById('b-classic').onclick=classic;
document.getElementById('b-replay').onclick=function(){setStage(0);playing=true;};
document.getElementById('b-pos').onclick=function(){if(EV.length<24)EV.push(true);};
document.getElementById('b-neg').onclick=function(){if(EV.length<24)EV.push(false);};
document.getElementById('b-reset').onclick=function(){EV=[];};
cv.addEventListener('pointerdown',advance);
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k===' '){advance();e.preventDefault();}
  else if(k==='r'||k==='R') {setStage(0);playing=true;}
  else if(k==='c'||k==='C') classic();
  else if(k==='+'||k==='='){ if(EV.length<24)EV.push(true); }
  else if(k==='-'||k==='_'){ if(EV.length<24)EV.push(false); }
  else if(k==='0'||k==='Backspace') EV=[];
});

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function panel(r,title){
  ctx.fillStyle='rgba(9,13,22,.55)'; rr(r.x,r.y,r.w,r.h,10); ctx.fill();
  ctx.strokeStyle='rgba(120,200,255,.14)'; ctx.lineWidth=1; ctx.stroke();
  if(title){ ctx.fillStyle='#4e7f9e'; ctx.font='10px ui-monospace,Menlo,Consolas,monospace';
    ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.fillText(title,r.x+12,r.y+16); }
}
function txt(s,x,y,font,col,align,base){
  ctx.font=font; ctx.fillStyle=col; ctx.textAlign=align||'left'; ctx.textBaseline=base||'alphabetic';
  ctx.fillText(s,x,y);
}
function mono(px,w){return (w?w+' ':'')+px+'px ui-monospace,Menlo,Consolas,monospace';}
function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t);}

/* ---------- view 1: natural frequencies ---------- */
function drawDots(f){
  var i,g,a,x,y,r,alpha=[1,1,1,1];
  var col=clamp(sv,0,1), ring=clamp(sv-1,0,1);
  var pitch=gridPitch+(clusPitch-gridPitch)*smooth(f);
  var rad=Math.max(0.75,pitch*0.34);
  // group alphas
  alpha[1]=1-0.93*f; alpha[3]=1-0.93*f;
  var cols=[],j;
  for(g=0;g<4;g++){
    var base=(g===0||g===1)?[255,96,110]:[70,170,255];
    var neutral=[110,126,146];
    var cc=[Math.round(neutral[0]+(GC[g][0]-neutral[0])*col),
            Math.round(neutral[1]+(GC[g][1]-neutral[1])*col),
            Math.round(neutral[2]+(GC[g][2]-neutral[2])*col)];
    cols[g]=cc;
  }
  // halo pass for the positive groups (cheap when they are small)
  ctx.globalCompositeOperation='lighter';
  for(g=0;g<4;g+=2){
    var cnt=(g===0)?CT.tp:CT.fp;
    if(cnt===0||cnt>3000) continue;
    ctx.beginPath();
    for(i=0;i<N;i++){ if(G[i]!==g) continue; x=X[i];y=Y[i];
      ctx.moveTo(x+rad*2.4,y); ctx.arc(x,y,rad*2.4,0,TAU); }
    ctx.fillStyle=rgba(cols[g],0.055+0.12*ring+0.1*f); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  // core dots
  for(g=0;g<4;g++){
    if(alpha[g]<=0.02) continue;
    ctx.beginPath();
    var any=false;
    for(i=0;i<N;i++){ if(G[i]!==g) continue; any=true; x=X[i];y=Y[i];
      ctx.moveTo(x+rad,y); ctx.arc(x,y,rad,0,TAU); }
    if(!any) continue;
    ctx.fillStyle=rgba(cols[g],alpha[g]); ctx.fill();
  }
  // rings on the positives
  if(ring>0.01){
    var rw=Math.max(0.7,rad*0.42);
    for(g=0;g<4;g+=2){
      ctx.beginPath(); var any2=false;
      for(i=0;i<N;i++){ if(G[i]!==g) continue; any2=true; x=X[i];y=Y[i];
        var rr2=rad*(1.55+0.5*(1-ring));
        ctx.moveTo(x+rr2,y); ctx.arc(x,y,rr2,0,TAU); }
      if(!any2) continue;
      ctx.lineWidth=rw; ctx.strokeStyle=(g===0)?'rgba(255,214,102,'+(0.85*ring)+')':'rgba(150,235,255,'+(0.8*ring)+')';
      ctx.stroke();
    }
  }
}
function drawMain(){
  var m=R.main, gr=R.grid, f=smooth(clamp(sv-2,0,1));
  panel(m,null);
  txt('1 · NATURAL FREQUENCIES',m.x+12,m.y+18,mono(10),'#4e7f9e');
  txt(CAP[stage],m.x+12,m.y+32,mono(11.5),stage===3?'#ffd166':'#9fc4dc');

  drawDots(f);

  // group labels beside the bands (grid mode)
  var names=['TRUE POSITIVE','FALSE NEGATIVE','FALSE POSITIVE','TRUE NEGATIVE'];
  var sub=['sick · test +','sick · test −','healthy · test +','healthy · test −'];
  var cnts=[CT.tp,CT.fn,CT.fp,CT.tn];
  var la=1-f, L=R.lab;
  if(la>0.03 && sv>0.6){
    for(var g=0;g<4;g++){
      if(cnts[g]===0) continue;
      var y0=bandY[g], y1=bandY1[g], yc=(y0+y1)/2;
      ctx.strokeStyle=rgba(GC[g],0.5*la); ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(L.x-4,y0+1); ctx.lineTo(L.x+1,y0+1);
      ctx.lineTo(L.x+1,y1-1); ctx.lineTo(L.x-4,y1-1); ctx.stroke();
      txt(cnts[g].toLocaleString(),L.x+8,yc-1,mono(13,'bold'),rgba(GC[g],0.95*la));
      txt(names[g],L.x+8,yc+11,mono(9),rgba(GC[g],0.62*la));
      txt(sub[g],L.x+8,yc+21,mono(9),'rgba(150,175,196,'+(0.55*la)+')');
    }
  }
  // focus-mode labels
  if(f>0.05){
    var lx=clusX+clusW+14, ok=lx+150<m.x+m.w;
    if(!ok) lx=clusX-14;
    ctx.textAlign=ok?'left':'right';
    if(CT.tp>0){
      txt(CT.tp.toLocaleString()+'  truly sick',lx,tpY-3,mono(13,'bold'),'rgba(255,120,132,'+f+')',ctx.textAlign);
      txt('true positives',lx,tpY+11,mono(9.5),'rgba(255,150,160,'+(0.7*f)+')',ctx.textAlign);
    }
    if(CT.fp>0){
      txt(CT.fp.toLocaleString()+'  perfectly healthy',lx,fpY-3,mono(13,'bold'),'rgba(110,195,255,'+f+')',ctx.textAlign);
      txt('false positives',lx,fpY+11,mono(9.5),'rgba(140,205,255,'+(0.7*f)+')',ctx.textAlign);
    }
    ctx.textAlign='left';
  }
  drawFoot(f);
}
function drawFoot(f){
  var r=R.foot, post=posterior(P.p,P.se,P.sp);
  var chipW=Math.min(112,(r.w*0.52)/2-6), chipH=Math.min(34,(r.h-6)/2);
  var lbl=['TP','FN','FP','TN'], vals=[CT.tp,CT.fn,CT.fp,CT.tn];
  for(var i=0;i<4;i++){
    var cx=r.x+(i%2)*(chipW+8), cy=r.y+((i/2)|0)*(chipH+6);
    ctx.fillStyle=rgba(GC[i],0.10); rr(cx,cy,chipW,chipH,5); ctx.fill();
    ctx.strokeStyle=rgba(GC[i],0.35); ctx.lineWidth=1; ctx.stroke();
    txt(lbl[i],cx+7,cy+13,mono(9),rgba(GC[i],0.8));
    txt(vals[i].toLocaleString(),cx+7,cy+chipH-8,mono(13,'bold'),rgba(GC[i],1));
  }
  var bx=r.x+2*chipW+26;
  txt('P(sick | positive)',bx,r.y+14,mono(10),'#6f8598');
  var big=Math.min(64,Math.max(30,r.h*0.72));
  var glow=isFinite(post)?post:0;
  ctx.save();
  ctx.shadowColor='rgba(255,209,102,'+(0.35+0.4*f)+')'; ctx.shadowBlur=18+22*f;
  txt(pct(post),bx,r.y+r.h-6,mono(big,'bold'),isFinite(post)?'#ffd166':'#7a8a9a');
  ctx.restore();
  var w2=ctx.measureText(pct(post)).width;
  if(isFinite(post)&&CT.tp+CT.fp>0)
    txt('= '+CT.tp.toLocaleString()+' / '+(CT.tp+CT.fp).toLocaleString()+' positives',bx+w2+12,r.y+r.h-12,mono(10.5),'#8fa8bd');
  else if(!isFinite(post))
    txt('nobody tests positive — undefined',bx+w2+12,r.y+r.h-12,mono(10.5),'#8fa8bd');
}

/* ---------- view 2: the area proof ---------- */
function drawArea(){
  var r=R.area; panel(r,'2 · THE AREA PROOF   (area = probability)');
  var p=AN.p, se=AN.se, sp=AN.sp;
  var barH=26, gapB=12;
  var x=r.x+16, y=r.y+30, w=r.w-32, h=r.h-30-barH-gapB-30;
  if(h<40||w<40) return;
  var wS=w*p, wH=w-wS;
  var hTP=h*se, hFP=h*(1-sp);
  var rects=[
    [x,y,wS,hTP,0,'TP'],                       // sick & positive
    [x,y+hTP,wS,h-hTP,1,'FN'],                 // sick & negative
    [x+wS,y,wH,hFP,2,'FP'],                    // healthy & positive
    [x+wS,y+hFP,wH,h-hFP,3,'TN']               // healthy & negative
  ];
  for(var i=0;i<4;i++){
    var q=rects[i];
    if(q[2]<=0.2||q[3]<=0.2) continue;
    ctx.fillStyle=rgba(GC[q[4]],(q[4]===0||q[4]===2)?0.62:0.20);
    ctx.fillRect(q[0],q[1],q[2],q[3]);
    ctx.strokeStyle=rgba(GC[q[4]],0.55); ctx.lineWidth=1; ctx.strokeRect(q[0]+.5,q[1]+.5,Math.max(0,q[2]-1),Math.max(0,q[3]-1));
    if(q[2]>40&&q[3]>26){
      txt(q[5],q[0]+6,q[1]+14,mono(10,'bold'),rgba(GC[q[4]],0.95));
      var pr=[p*se,p*(1-se),(1-p)*(1-sp),(1-p)*sp][q[4]];
      txt(pr.toFixed(4),q[0]+6,q[1]+26,mono(9.5),'rgba(200,220,240,.7)');
    }
  }
  // axes annotations
  ctx.setLineDash([3,3]); ctx.strokeStyle='rgba(255,255,255,.22)';
  ctx.beginPath(); ctx.moveTo(x+wS,y-6); ctx.lineTo(x+wS,y+h+6); ctx.stroke(); ctx.setLineDash([]);
  txt('◄ P(D)='+pct(p,2)+'  width = the base rate',x,y+h+16,mono(9.5),'#8fa8bd');
  txt('height = test accuracy ►',x+w,y+h+16,mono(9.5),'#8fa8bd','right');
  // positives-only comparison bar
  var tp=p*se, fp=(1-p)*(1-sp), tot=tp+fp;
  var by=y+h+gapB+14, bw=w;
  txt('the positive row, rescaled:',x,by-3,mono(9.5),'#6f8598');
  ctx.fillStyle='rgba(255,255,255,.05)'; rr(x,by+3,bw,barH,5); ctx.fill();
  if(tot>0){
    var wt=bw*(tp/tot);
    ctx.save(); rr(x,by+3,bw,barH,5); ctx.clip();
    ctx.fillStyle=rgba(GC[0],0.85); ctx.fillRect(x,by+3,wt,barH);
    ctx.fillStyle=rgba(GC[2],0.75); ctx.fillRect(x+wt,by+3,bw-wt,barH);
    ctx.restore();
    var pp=tp/tot;
    if(wt>52) txt(pct(pp),x+6,by+3+barH*0.68,mono(13,'bold'),'#fff');
    if(bw-wt>52) txt(pct(1-pp),x+bw-6,by+3+barH*0.68,mono(13,'bold'),'#eaf6ff','right');
    ctx.strokeStyle='#ffd166'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(x+wt,by-1); ctx.lineTo(x+wt,by+barH+7); ctx.stroke();
  } else {
    txt('no positive results at these settings',x+bw/2,by+3+barH*0.68,mono(10),'#7a8a9a','center');
  }
}

/* ---------- formula with live numbers ---------- */
function drawForm(){
  var r=R.form; panel(r,'BAYES, WITH YOUR NUMBERS');
  var p=P.p,se=P.se,sp=P.sp, post=posterior(p,se,sp);
  var num=se*p, fpv=(1-sp)*(1-p);
  var x=r.x+14, y=r.y+34, fs=Math.min(12.5,r.w/33);
  txt('P(D|+) =',x,y,mono(fs),'#cfe8ff');
  var w1=ctx.measureText('P(D|+) = ').width;
  var lx=x+w1;
  txt('P(+|D)·P(D)',lx,y-7,mono(fs),'#ff8a97');
  var wn=ctx.measureText('P(+|D)·P(D)').width;
  txt('P(+|D)·P(D) + P(+|H)·P(H)',lx,y+15,mono(fs),'#9fc4dc');
  var wd=ctx.measureText('P(+|D)·P(D) + P(+|H)·P(H)').width;
  ctx.strokeStyle='rgba(180,215,240,.45)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(lx,y+2.5); ctx.lineTo(lx+Math.max(wn,wd),y+2.5); ctx.stroke();

  var y2=y+40, f=Math.min(12,r.w/36);
  var s1=se.toFixed(3)+'×'+p.toFixed(3), s2=(1-sp).toFixed(3)+'×'+(1-p).toFixed(3);
  txt('=',x,y2+4,mono(f),'#cfe8ff');
  var ox=x+ctx.measureText('= ').width;
  txt(s1,ox,y2-4,mono(f),'#ff8a97');
  var wn2=ctx.measureText(s1).width;
  txt(s1+' + '+s2,ox,y2+16,mono(f),'#9fc4dc');
  var wd2=ctx.measureText(s1+' + '+s2).width;
  ctx.beginPath(); ctx.moveTo(ox,y2+4.5); ctx.lineTo(ox+Math.max(wn2,wd2),y2+4.5); ctx.stroke();
  var ex=ox+Math.max(wn2,wd2)+10;
  txt('=',ex,y2+4,mono(f),'#cfe8ff');
  txt(pct(post),ex+ctx.measureText('= ').width,y2+6,mono(Math.min(22,f*1.8),'bold'),isFinite(post)?'#ffd166':'#7a8a9a');
  txt(num.toFixed(5)+'  /  '+(num+fpv).toFixed(5),x,r.y+r.h-9,mono(9.5),'#5d7286');
}

/* ---------- view 3: sequential updating ---------- */
var seqPos=null;
function drawSeq(){
  var r=R.seq; panel(r,'3 · SEQUENTIAL UPDATING   (log-odds ruler — every test is the same size jump)');
  var ch=chain(), vals=ch.vals, cur=vals[vals.length-1];
  var x=r.x+18, w=r.w-36, y=r.y+Math.min(74,r.h*0.5);
  if(w<60) return;
  var ticks=[0.001,0.01,0.1,0.5,0.9,0.99,0.999];
  ctx.strokeStyle='rgba(120,200,255,.18)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w,y); ctx.stroke();
  for(var i=0;i<ticks.length;i++){
    var tx=x+w*zx(ticks[i]);
    ctx.strokeStyle='rgba(120,200,255,.22)';
    ctx.beginPath(); ctx.moveTo(tx,y-5); ctx.lineTo(tx,y+5); ctx.stroke();
    var lab=ticks[i]<0.01?'0.1%':(ticks[i]*100).toFixed(ticks[i]===0.999||ticks[i]===0.99?(ticks[i]===0.999?1:0):0)+'%';
    txt(lab,tx,y+17,mono(9),'#5d7286','center');
  }
  // gradient rail
  var gg=ctx.createLinearGradient(x,0,x+w,0);
  gg.addColorStop(0,'rgba(70,170,255,.25)'); gg.addColorStop(0.5,'rgba(255,209,102,.3)'); gg.addColorStop(1,'rgba(255,96,110,.35)');
  ctx.fillStyle=gg; ctx.fillRect(x,y-2,w,4);
  // prior marker
  var px=x+w*zx(vals[0]);
  ctx.strokeStyle='rgba(160,190,215,.5)'; ctx.setLineDash([2,3]);
  ctx.beginPath(); ctx.moveTo(px,y-24); ctx.lineTo(px,y+8); ctx.stroke(); ctx.setLineDash([]);
  txt('prior',px,y-28,mono(9),'#8fa8bd','center');
  // trail
  for(i=0;i<vals.length;i++){
    var vx=x+w*zx(vals[i]), a=0.18+0.6*(i/Math.max(1,vals.length-1));
    if(i>0){
      var pxx=x+w*zx(vals[i-1]);
      ctx.strokeStyle=EV[i-1]?'rgba(255,120,132,'+(0.25+0.4*a)+')':'rgba(90,190,255,'+(0.25+0.4*a)+')';
      ctx.lineWidth=1.2; ctx.beginPath();
      ctx.moveTo(pxx,y-11); ctx.quadraticCurveTo((pxx+vx)/2,y-24,vx,y-11); ctx.stroke();
    }
    ctx.fillStyle='rgba(200,225,245,'+a+')';
    ctx.beginPath(); ctx.arc(vx,y-11,2.2,0,TAU); ctx.fill();
  }
  // ghost preview of the next jump either way
  var cx=x+w*zx(cur);
  var np=zx(cur*ch.LRp/(1-cur+cur*ch.LRp)), nn=zx(cur*ch.LRn/(1-cur+cur*ch.LRn));
  drawGhost(x+w*np,y,'+', 'rgba(255,120,132,.5)');
  drawGhost(x+w*nn,y,'−', 'rgba(90,190,255,.5)');
  // live marker
  if(seqPos===null) seqPos=cx;
  seqPos+=(cx-seqPos)*0.18;
  ctx.save(); ctx.shadowColor='rgba(255,209,102,.9)'; ctx.shadowBlur=14;
  ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.arc(seqPos,y,5.5,0,TAU); ctx.fill(); ctx.restore();
  txt(pct(cur,cur>0.999||cur<0.01?2:1),seqPos,y+34,mono(15,'bold'),'#ffd166','center');
  // history strip
  var hy=r.y+r.h-16;
  txt('evidence: ',r.x+18,hy,mono(9.5),'#6f8598');
  var hx=r.x+18+ctx.measureText('evidence: ').width;
  if(EV.length===0) txt('none yet — press [+] or [−]',hx,hy,mono(9.5),'#5d7286');
  for(i=0;i<EV.length;i++){
    var bxp=hx+i*12;
    if(bxp>r.x+r.w-24) break;
    ctx.fillStyle=EV[i]?'rgba(255,96,110,.85)':'rgba(70,170,255,.8)';
    rr(bxp,hy-8,9,9,2); ctx.fill();
    txt(EV[i]?'+':'−',bxp+4.5,hy,mono(8,'bold'),'#04050a','center');
  }
  txt('LR+ '+(isFinite(ch.LRp)?ch.LRp.toFixed(1):'∞')+'   LR− '+ch.LRn.toFixed(3),r.x+r.w-18,r.y+r.h-16,mono(9.5),'#5d7286','right');
}
function drawGhost(gx,y,s,col){
  ctx.strokeStyle=col; ctx.lineWidth=1; ctx.setLineDash([2,3]);
  ctx.beginPath(); ctx.moveTo(gx,y-6); ctx.lineTo(gx,y+6); ctx.stroke(); ctx.setLineDash([]);
  txt(s,gx,y+16,mono(10,'bold'),col,'center');
}

/* ---------- background ---------- */
function bg(){
  var g=ctx.createRadialGradient(W*0.42,H*0.42,20,W*0.5,H*0.5,Math.max(W,H)*0.78);
  g.addColorStop(0,'#0b1020'); g.addColorStop(1,'#04050a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

/* ---------- loop ---------- */
var last=0;
function frame(t){
  var dt=Math.min(0.05,(t-last)/1000||0.016); last=t;
  // eased params for the area view
  AN.p+=(P.p-AN.p)*Math.min(1,dt*7);
  AN.se+=(P.se-AN.se)*Math.min(1,dt*7);
  AN.sp+=(P.sp-AN.sp)*Math.min(1,dt*7);
  // stage machine
  stageT+=dt;
  sv+=(stage-sv)*Math.min(1,dt*3.2);
  if(playing && stageT>DWELL[stage] && stage<3) setStage(stage+1);
  // dot motion
  var f=smooth(clamp(sv-2,0,1));
  for(var i=0;i<N;i++){
    var fi=smooth(clamp(f*1.5-SG[i]*0.5,0,1));
    var tx=GXa[i]+(CXa[i]-GXa[i])*fi, ty=GYa[i]+(CYa[i]-GYa[i])*fi;
    var k=Math.min(1,dt*(7+SG[i]*5));
    X[i]+=(tx-X[i])*k; Y[i]+=(ty-Y[i])*k;
  }
  bg();
  drawMain(); drawArea(); drawForm(); drawSeq();
  if(flash>0){
    flash-=dt*0.30;
    var a=clamp(flash*1.6,0,1)*(0.72+0.28*Math.sin(t*0.006));
    var fs=Math.min(30,W/44);
    ctx.save();
    ctx.fillStyle='rgba(4,5,10,'+(0.55*a)+')';
    var mw=0; ctx.font=mono(fs,'bold'); mw=ctx.measureText(flashMsg).width;
    rr(W/2-mw/2-24,H*0.5-fs*1.5,mw+48,fs*3,12); ctx.fill();
    ctx.strokeStyle='rgba(255,209,102,'+(0.6*a)+')'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.shadowColor='rgba(255,209,102,.8)'; ctx.shadowBlur=24;
    txt(flashMsg,W/2,H*0.5+fs*0.35,mono(fs,'bold'),'rgba(255,225,150,'+a+')','center');
    ctx.restore();
  }
  requestAnimationFrame(frame);
}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
window.addEventListener('resize',resize);
recount(); resize(); onParams(); setStage(0);
EV=[];
requestAnimationFrame(frame);
})();
</script>
