<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>terrain // synthwave flyover</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d001a}
  canvas{display:block}
  #hud{position:fixed;top:12px;left:12px;z-index:10;font:11px/1.7 ui-monospace,Menlo,Consolas,monospace;
       color:rgba(220,205,255,.78);background:rgba(10,3,24,.5);border:1px solid rgba(255,80,200,.25);
       border-radius:6px;padding:8px 12px;letter-spacing:.4px;pointer-events:none}
  #hud b{color:#f6c;font-size:12px}
  #hud a{color:#7ef;pointer-events:auto;text-decoration:none}
  #hud a:hover{text-decoration:underline}
  #hud em{color:#fd8;font-style:normal}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div id="hud"><b>TERRAIN // synthwave flyover</b><br>mouse x steers &middot; wheel sets speed (<em id="spd">14</em> u/s)<br><a href="index.html">&larr; gallery</a></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js'; // camera is scripted in this demo
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d001a);
scene.fog = new THREE.Fog(0x0d001a, 25, 125);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 600);
camera.position.set(0, 3, 64);

// ---- inline 2D value-noise / fbm (integer-hash based, no imports) ----
function hash(ix, iz){
  let n = (Math.imul(ix, 374761393) + Math.imul(iz, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function vnoise(x, z){
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx*fx*(3-2*fx), uz = fz*fz*(3-2*fz);
  const a = hash(ix,iz), b = hash(ix+1,iz), cc = hash(ix,iz+1), d = hash(ix+1,iz+1);
  return a + (b-a)*ux + (cc-a)*uz + (a-b-cc+d)*ux*uz;
}
function fbm(x, z){
  let v = 0, amp = 0.55, f = 1;
  for(let o=0;o<3;o++){ v += amp*vnoise(x*f, z*f); amp *= 0.5; f *= 2.03; }
  return v;
}

// ---- terrain: shared displaced plane, dark fill under neon wireframe ----
const W = 90, D = 140;
const geo = new THREE.PlaneGeometry(W, D, 200, 110);
geo.rotateX(-Math.PI/2);
const posA = geo.attributes.position.array;
const count = geo.attributes.position.count;
const xs = new Float32Array(count), zs = new Float32Array(count), vall = new Float32Array(count);
const colA = new Float32Array(count*3);
const cNear = new THREE.Color(0x00eaff), cFar = new THREE.Color(0xff2bd6), cTmp = new THREE.Color();
for(let i=0;i<count;i++){
  const x = posA[i*3], z = posA[i*3+2];
  xs[i] = x; zs[i] = z;
  vall[i] = 0.06 + 0.94*THREE.MathUtils.smoothstep(Math.abs(x), 4, 22); // valley corridor down the middle
  const k = THREE.MathUtils.clamp((D/2 - z)/D, 0, 1); // near = cyan, far = magenta
  cTmp.copy(cNear).lerp(cFar, k);
  colA[i*3] = cTmp.r; colA[i*3+1] = cTmp.g; colA[i*3+2] = cTmp.b;
}
geo.setAttribute('color', new THREE.BufferAttribute(colA, 3));

const wire = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({wireframe:true, vertexColors:true}));
const fill = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
  color:0x05000d, polygonOffset:true, polygonOffsetFactor:2, polygonOffsetUnits:2
}));
wire.frustumCulled = fill.frustumCulled = false;
scene.add(fill, wire);

// ---- banded gradient sun on the horizon ----
const sunUni = { uTime: {value:0} };
const sun = new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.ShaderMaterial({
  uniforms: sunUni, transparent:true, depthWrite:false, fog:false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: [
    'varying vec2 vUv; uniform float uTime;',
    'void main(){',
    '  vec2 p = vUv*2.0 - 1.0;',
    '  float d = length(p);',
    '  float disc = 1.0 - smoothstep(0.9, 0.98, d);',
    '  vec3 col = mix(vec3(1.0,0.18,0.5), vec3(1.0,0.85,0.35), smoothstep(-0.7,0.9,p.y));',
    '  float stripe = fract(p.y*4.5 - uTime*0.18);',
    '  float cut = mix(smoothstep(0.12,0.3,stripe), 1.0, smoothstep(0.05,0.45,p.y));',
    '  gl_FragColor = vec4(col*1.35, disc*cut);',
    '}'
  ].join('\n')
}));
sun.scale.set(56, 56, 1);
sun.position.set(0, 15, -118);
scene.add(sun);

// ---- sparse stars above the horizon ----
const sn = 900, sp = new Float32Array(sn*3);
for(let i=0;i<sn;i++){
  const th = Math.random()*Math.PI*2;
  const ph = Math.acos(Math.random());
  const r = 320;
  sp[i*3]   = r*Math.sin(ph)*Math.cos(th);
  sp[i*3+1] = r*Math.cos(ph)*0.8 + 8;
  sp[i*3+2] = r*Math.sin(ph)*Math.sin(th);
}
const sg = new THREE.BufferGeometry();
sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({
  color:0xaac4ff, size:1.6, sizeAttenuation:false, transparent:true, opacity:0.75, fog:false, depthWrite:false
})));

const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.75, 0.5, 0.4));
composer.addPass(new OutputPass());

// ---- interaction: mouse X steers lateral drift, wheel sets speed ----
let speed = 14, mx = 0, mxs = 0, off = 0, dx = 0;
window.addEventListener('mousemove', e => { mx = (e.clientX/window.innerWidth)*2 - 1; });
window.addEventListener('wheel', e => {
  speed = THREE.MathUtils.clamp(speed - Math.sign(e.deltaY)*2, 4, 60);
  document.getElementById('spd').textContent = speed.toFixed(0);
}, {passive:true});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();
  off += speed*dt;
  mxs += (mx - mxs)*0.04;
  dx += mxs*22*dt;

  const S = 0.052;
  for(let i=0;i<count;i++){
    const n = fbm((xs[i]+dx)*S, (zs[i]-off)*S);
    posA[i*3+1] = Math.pow(n, 1.6)*16*vall[i] + n*0.5;
  }
  geo.attributes.position.needsUpdate = true;

  camera.position.set(0, 3 + Math.sin(t*1.1)*0.25, 64);
  camera.lookAt(mxs*6, 2.2 + Math.sin(t*1.1)*0.1, -40);
  camera.rotation.z += -mxs*0.12 + Math.sin(t*0.6)*0.01;

  sunUni.uTime.value = t;
  composer.render();
}
animate();

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  composer.setSize(w, h);
});
</script>
</body>
</html>
