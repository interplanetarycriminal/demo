<meta name="viewport" content="width=device-width,initial-scale=1">
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<style>
  html,body{margin:0;height:100%;background:#04070a;overflow:hidden;font-family:monospace}
  canvas{touch-action:none;display:block}
  #ui{position:fixed;top:10px;left:10px;color:#8fffce;background:rgba(0,20,14,.35);
    padding:8px 10px;border-radius:6px;font:12px/1.5 monospace;z-index:10;
    text-shadow:0 0 6px #0f8;pointer-events:none;max-height:52vh;overflow:auto}
  #ui a{color:#6f9;pointer-events:auto;text-decoration:none}
  #ui a:hover{text-decoration:underline}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
<div id="ui">
  <div style="font-size:15px;color:#0f8;letter-spacing:2px">◆ NEON SNAKE</div>
  <div>Arrows / WASD move · walls are DEADLY</div>
  <div>R restart · <a href="index.html">← gallery</a></div>
</div>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);resize();

const GRID=24; // cells across/down of play field
let snake,dir,ndir,food,score,best=0,over,parts,trail,stepT,stepInt,grow,foodPulse;

function geo(){
  const size=Math.min(W-60,H-60);
  const cell=Math.floor(size/GRID);
  const fw=cell*GRID;
  return {cell,ox:Math.floor((W-fw)/2),oy:Math.floor((H-fw)/2),fw};
}
function placeFood(){
  let ok=false;
  while(!ok){
    food={x:(Math.random()*GRID)|0,y:(Math.random()*GRID)|0};
    ok=!snake.some(s=>s.x===food.x&&s.y===food.y);
  }
}
function reset(){
  snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];
  dir={x:1,y:0};ndir={x:1,y:0};score=0;over=false;parts=[];trail=[];
  stepT=0;stepInt=130;grow=0;foodPulse=0;placeFood();
}
reset();

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(over){if(k==='r'||k==='enter')reset();return;}
  if((k==='arrowup'||k==='w')&&dir.y===0)ndir={x:0,y:-1};
  else if((k==='arrowdown'||k==='s')&&dir.y===0)ndir={x:0,y:1};
  else if((k==='arrowleft'||k==='a')&&dir.x===0)ndir={x:-1,y:0};
  else if((k==='arrowright'||k==='d')&&dir.x===0)ndir={x:1,y:0};
  else if(k==='r')reset();
  if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
});

function burst(cx,cy,col,n){
  const g=geo();
  for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=1+Math.random()*4;
    parts.push({x:g.ox+cx*g.cell+g.cell/2,y:g.oy+cy*g.cell+g.cell/2,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col});}
}
function step(){
  dir=ndir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  // wall death
  if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID){die();return;}
  // self collision
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){die();return;}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10;grow+=1;burst(food.x,food.y,'#ff2e88',18);
    stepInt=Math.max(55,stepInt-4);placeFood();foodPulse=1;
  }
  if(grow>0)grow--;else snake.pop();
}
function die(){
  over=true;best=Math.max(best,score);
  snake.forEach(s=>burst(s.x,s.y,'#0f8',4));
}

function loop(dt){
  if(!over){stepT+=dt;if(stepT>stepInt){stepT=0;step();}}
  if(foodPulse>0)foodPulse-=.05;
  const g=geo();
  ctx.clearRect(0,0,W,H);
  // field bg
  ctx.fillStyle='rgba(6,16,14,.9)';ctx.fillRect(g.ox,g.oy,g.fw,g.fw);
  // grid
  ctx.strokeStyle='rgba(40,120,90,.13)';ctx.lineWidth=1;
  for(let i=0;i<=GRID;i++){
    ctx.beginPath();ctx.moveTo(g.ox+i*g.cell,g.oy);ctx.lineTo(g.ox+i*g.cell,g.oy+g.fw);ctx.stroke();
    ctx.beginPath();ctx.moveTo(g.ox,g.oy+i*g.cell);ctx.lineTo(g.ox+g.fw,g.oy+i*g.cell);ctx.stroke();
  }
  // border glow (deadly)
  ctx.strokeStyle='#0f8';ctx.shadowColor='#0f8';ctx.shadowBlur=16;ctx.lineWidth=3;
  ctx.strokeRect(g.ox,g.oy,g.fw,g.fw);ctx.shadowBlur=0;
  // fading trail
  trail.push({x:snake[0].x,y:snake[0].y});if(trail.length>18)trail.shift();
  for(let i=0;i<trail.length;i++){const t=trail[i],a=i/trail.length*.25;
    ctx.globalAlpha=a;ctx.fillStyle='#0fa';
    ctx.fillRect(g.ox+t.x*g.cell+g.cell*.3,g.oy+t.y*g.cell+g.cell*.3,g.cell*.4,g.cell*.4);}
  ctx.globalAlpha=1;
  // food
  const fp=1+Math.max(0,foodPulse)*.5;
  ctx.fillStyle='#ff2e88';ctx.shadowColor='#ff2e88';ctx.shadowBlur=22;
  ctx.beginPath();ctx.arc(g.ox+food.x*g.cell+g.cell/2,g.oy+food.y*g.cell+g.cell/2,g.cell*.35*fp,0,6.28);
  ctx.fill();ctx.shadowBlur=0;
  // snake
  for(let i=snake.length-1;i>=0;i--){const s=snake[i];
    const head=i===0;const col=head?'#aaffdd':'#0f8';
    ctx.fillStyle=col;ctx.shadowColor='#0f8';ctx.shadowBlur=head?20:12;
    const pad=head?1:2;
    ctx.fillRect(g.ox+s.x*g.cell+pad,g.oy+s.y*g.cell+pad,g.cell-pad*2,g.cell-pad*2);
  }
  ctx.shadowBlur=0;
  // eyes on head
  if(!over){const h=snake[0];ctx.fillStyle='#022';
    const cx=g.ox+h.x*g.cell+g.cell/2,cy=g.oy+h.y*g.cell+g.cell/2;
    ctx.beginPath();ctx.arc(cx+dir.x*3-dir.y*3,cy+dir.y*3-dir.x*3,g.cell*.09,0,6.28);
    ctx.arc(cx+dir.x*3+dir.y*3,cy+dir.y*3+dir.x*3,g.cell*.09,0,6.28);ctx.fill();}
  // particles
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;p.life-=.025;
    if(p.life<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  // score
  ctx.fillStyle='#0f8';ctx.font='16px monospace';ctx.textAlign='left';
  ctx.shadowColor='#0f8';ctx.shadowBlur=8;
  ctx.fillText('SCORE '+score,g.ox,g.oy-14);
  ctx.textAlign='right';ctx.fillText('BEST '+best,g.ox+g.fw,g.oy-14);
  ctx.shadowBlur=0;ctx.textAlign='left';
  // game over
  if(over){
    ctx.fillStyle='rgba(0,8,6,.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff2e88';ctx.shadowColor='#ff2e88';ctx.shadowBlur=20;
    ctx.font='bold 46px monospace';ctx.fillText('GAME OVER',W/2,H/2-20);ctx.shadowBlur=0;
    ctx.fillStyle='#8fffce';ctx.font='18px monospace';ctx.fillText('You hit a wall or yourself · Score '+score,W/2,H/2+16);
    ctx.fillStyle='#0f8';ctx.fillText('Press R or Enter to restart',W/2,H/2+48);
    ctx.textAlign='left';
  }
}
let last=performance.now();
function frame(t){const dt=t-last;last=t;loop(dt);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
