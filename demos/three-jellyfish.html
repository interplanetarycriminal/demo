<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>three-jellyfish</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
canvas{display:block}
#ui{position:fixed;top:12px;left:12px;z-index:10;font:11px/1.7 monospace;color:#c9d4ff;background:rgba(5,8,20,.55);padding:9px 12px;border:1px solid rgba(140,160,255,.25);border-radius:6px}
#ui b{color:#fff;letter-spacing:.12em}
#ui a{color:#8ab4ff;text-decoration:none}
#ui a:hover{text-decoration:underline}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div id="ui"><b>JELLYFISH</b> &mdash; bioluminescent drift<br>drag orbit &middot; scroll zoom &middot; click new colors<br><a href="index.html">&larr; gallery</a></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020409);
scene.fog = new THREE.FogExp2(0x030714, 0.038);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 1.2, 9.5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, -0.8, 0);
controls.minDistance = 3;
controls.maxDistance = 30;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.25, 0.7, 0.12));
composer.addPass(new OutputPass());

scene.add(new THREE.AmbientLight(0x1a2a4a, 1.2));
const down = new THREE.DirectionalLight(0x5a7aff, 0.5);
down.position.set(2, 10, 3);
scene.add(down);

const jelly = new THREE.Group();
scene.add(jelly);

// ---- pulsing bell (half sphere, vertex displaced) ----
const R = 1.7;
const domeGeo = new THREE.SphereGeometry(R, 56, 28, 0, Math.PI*2, 0, Math.PI*0.58);
const domeBase = domeGeo.attributes.position.array.slice();
const domeMat = new THREE.MeshPhysicalMaterial({
  color: 0x6688ff, emissive: 0x2233aa, emissiveIntensity: 0.55,
  transparent: true, opacity: 0.42, roughness: 0.25, metalness: 0,
  clearcoat: 0.6, side: THREE.DoubleSide, depthWrite: false
});
const dome = new THREE.Mesh(domeGeo, domeMat);
jelly.add(dome);

const glow = new THREE.Mesh(
  new THREE.SphereGeometry(R*0.72, 24, 16),
  new THREE.MeshBasicMaterial({color: 0xff88cc, transparent: true, opacity: 0.28,
    blending: THREE.AdditiveBlending, depthWrite: false})
);
glow.position.y = 0.25;
jelly.add(glow);

const heart = new THREE.PointLight(0xff88cc, 60, 28, 2);
heart.position.set(0, 0.5, 0);
jelly.add(heart);

function updateDome(t){
  const attr = domeGeo.attributes.position;
  const a = attr.array;
  for(let i=0; i<a.length; i+=3){
    const ox = domeBase[i], oy = domeBase[i+1], oz = domeBase[i+2];
    const yn = THREE.MathUtils.clamp(oy/R, 0, 1); // 1 at crown, 0 at rim
    const wave = Math.sin(t*2.1 - (1-yn)*2.4);
    const flare = 1 + 0.22 * wave * Math.pow(1-yn, 1.5);
    a[i]   = ox * flare;
    a[i+2] = oz * flare;
    a[i+1] = oy + 0.14 * Math.sin(t*2.1 + 0.6) * yn;
  }
  attr.needsUpdate = true;
  domeGeo.computeVertexNormals();
}

// ---- 16 tentacles as animated sine-wave lines ----
const TENT = 16, SEG = 34;
const matA = new THREE.LineBasicMaterial({color: 0xff9ad5, transparent: true, opacity: 0.65,
  blending: THREE.AdditiveBlending, depthWrite: false});
const matB = new THREE.LineBasicMaterial({color: 0x7fb4ff, transparent: true, opacity: 0.6,
  blending: THREE.AdditiveBlending, depthWrite: false});
const tentacles = [];
for(let j=0; j<TENT; j++){
  const g = new THREE.BufferGeometry();
  const arr = new Float32Array(SEG*3);
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3).setUsage(THREE.DynamicDrawUsage));
  jelly.add(new THREE.Line(g, j%2 ? matB : matA));
  tentacles.push({g, arr, ang: j/TENT*Math.PI*2, ph: Math.random()*Math.PI*2, len: 4.6+Math.random()*1.8});
}
function updateTentacles(t, pulse){
  for(const tn of tentacles){
    const arr = tn.arr;
    for(let s=0; s<SEG; s++){
      const f = s/(SEG-1);
      const sway = Math.sin(t*1.7 - f*5 + tn.ph)*0.38*f + Math.sin(t*0.6 + tn.ph*2)*0.2*f;
      const rad = 1.25*(1 - 0.3*f) + sway;
      const aa = tn.ang + Math.sin(t*0.8 + tn.ph + f*1.6)*0.3*f;
      const i3 = s*3;
      arr[i3]   = Math.cos(aa)*rad;
      arr[i3+1] = -0.15 - f*tn.len*(1 - 0.07*pulse) + Math.sin(t*2.1 - f*6)*0.1*f;
      arr[i3+2] = Math.sin(aa)*rad;
    }
    tn.g.attributes.position.needsUpdate = true;
  }
}

// ---- plankton particles drifting downward (jelly appears to rise) ----
const PN = 900;
const pgeo = new THREE.BufferGeometry();
const parr = new Float32Array(PN*3);
const spd = new Float32Array(PN);
for(let i=0; i<PN; i++){
  parr[i*3]   = (Math.random()-0.5)*46;
  parr[i*3+1] = (Math.random()-0.5)*32;
  parr[i*3+2] = (Math.random()-0.5)*46;
  spd[i] = 0.25 + Math.random()*0.6;
}
pgeo.setAttribute('position', new THREE.BufferAttribute(parr, 3).setUsage(THREE.DynamicDrawUsage));
const pmat = new THREE.PointsMaterial({size: 0.07, sizeAttenuation: true, color: 0x9fd0ff,
  transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false});
scene.add(new THREE.Points(pgeo, pmat));

// ---- slowly shifting blue-pink palette; click jumps to a new scheme ----
let baseHue = 0.58;
function applyColors(t){
  const h = (baseHue + t*0.008) % 1;
  domeMat.color.setHSL(h, 0.65, 0.5);
  domeMat.emissive.setHSL((h+0.05)%1, 0.9, 0.3);
  glow.material.color.setHSL((h+0.3)%1, 0.85, 0.6);
  matA.color.setHSL((h+0.32)%1, 0.9, 0.68);
  matB.color.setHSL((h+0.02)%1, 0.85, 0.6);
  heart.color.setHSL((h+0.28)%1, 0.9, 0.6);
  pmat.color.setHSL((h+0.12)%1, 0.55, 0.75);
}
let downX=0, downY=0;
renderer.domElement.addEventListener('pointerdown', e => { downX=e.clientX; downY=e.clientY; });
renderer.domElement.addEventListener('click', e => {
  if(Math.hypot(e.clientX-downX, e.clientY-downY) < 6) baseHue = Math.random();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  const pulse = Math.sin(t*2.1);

  updateDome(t);
  updateTentacles(t, pulse);
  applyColors(t);

  jelly.position.y = Math.sin(t*0.55)*0.35;
  jelly.rotation.y = t*0.06;
  glow.scale.setScalar(1 + 0.1*pulse);
  heart.intensity = 55 + 30*pulse;

  for(let i=0; i<PN; i++){
    parr[i*3+1] -= spd[i]*dt;
    if(parr[i*3+1] < -16) parr[i*3+1] += 32;
  }
  pgeo.attributes.position.needsUpdate = true;

  controls.update();
  composer.render();
});
</script>
</body>
</html>
