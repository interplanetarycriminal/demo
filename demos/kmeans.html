<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K-Means — the classic dance</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#04060b}
#c{position:fixed;inset:0;display:block}
#ui{position:fixed;top:12px;left:12px;z-index:10;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#bfe9ff;background:rgba(6,10,18,.74);border:1px solid rgba(0,245,212,.28);border-radius:10px;padding:10px 13px;max-width:360px;pointer-events:none;text-shadow:0 0 6px rgba(0,0,0,.8)}
#ui a{color:#00f5d4;pointer-events:auto;text-decoration:none}
#ui a:hover{text-shadow:0 0 8px #00f5d4}
#ui h1{margin:0 0 3px;font-size:14px;letter-spacing:2px;color:#00f5d4;text-shadow:0 0 10px rgba(0,245,212,.7)}
.ex{color:#8fb4cc;font-size:11px}
.hint{color:#f5c04c;font-size:11px;margin-top:5px}
#stats{margin-top:6px;color:#e6f6ff;white-space:pre}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div id="ui">
<h1>K-MEANS</h1>
<div class="ex">Loops two steps — ASSIGN each point to its nearest centroid, UPDATE each centroid to its points' mean — until the centroids stop moving.</div>
<div class="hint">keys 2&#8211;9 set K &#183; click adds a point &#183; V voronoi shading</div>
<div id="stats"></div>
<div><a href="index.html">&#8592; gallery</a></div>
</div>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),statsEl=document.getElementById('stats');
var TAU=Math.PI*2,W=innerWidth,H=innerHeight,DPR=1,T=0;
var PAL=['#00f5d4','#f15bb5','#ffd23f','#00bbf9','#9b5de5','#ff6b35','#8ac926','#ff2d95','#4cc9f0'];
var RGB=PAL.map(function(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];});
var pts=[],cents=[],K=4,trueK=4,iter=0,runs=0,phase='assign',pt=0,inertia=0,showVoro=true,voroDirty=true,maxMove=0;
var vc=document.createElement('canvas'),vctx=vc.getContext('2d'),VS=8,pw=0,ph=0;
function resize(){
 DPR=Math.min(devicePixelRatio||1,2);var nw=innerWidth,nh=innerHeight;
 if(pw&&pts.length){var rx=nw/pw,ry=nh/ph,i,c;
  for(i=0;i<pts.length;i++){pts[i].x*=rx;pts[i].y*=ry;}
  for(i=0;i<cents.length;i++){c=cents[i];c.x*=rx;c.y*=ry;c.px*=rx;c.py*=ry;c.tx*=rx;c.ty*=ry;c.trail.length=0;}
 }
 W=pw=nw;H=ph=nh;
 cv.width=W*DPR|0;cv.height=H*DPR|0;cv.style.width=W+'px';cv.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);
 vc.width=Math.max(1,Math.ceil(W/VS));vc.height=Math.max(1,Math.ceil(H/VS));voroDirty=true;
}
addEventListener('resize',resize);resize();
function gauss(){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);}
function newData(){
 trueK=3+(Math.random()*4|0);pts=[];
 var m=Math.min(W,H)*0.14,b,i;
 for(b=0;b<trueK;b++){
  var cx=m+Math.random()*(W-2*m),cy=m+Math.random()*(H-2*m),sd=Math.min(W,H)*(0.045+Math.random()*0.05),n=38+(Math.random()*34|0);
  for(i=0;i<n;i++)pts.push({x:Math.max(6,Math.min(W-6,cx+gauss()*sd)),y:Math.max(6,Math.min(H-6,cy+gauss()*sd)),a:-1,na:-1,f:0,rt:0});
 }
 runs++;initCents();
}
function initCents(){
 cents=[];var used={},k,j;
 for(k=0;k<Math.min(K,pts.length);k++){
  do{j=Math.random()*pts.length|0;}while(used[j]);used[j]=1;
  cents.push({x:pts[j].x,y:pts[j].y,px:0,py:0,tx:0,ty:0,trail:[]});
 }
 iter=0;voroDirty=true;startAssign();
}
function startAssign(){
 phase='assign';pt=0;
 for(var i=0;i<pts.length;i++){var p=pts[i],bd=1e18,bk=0;
  for(var k=0;k<cents.length;k++){var dx=p.x-cents[k].x,dy=p.y-cents[k].y,d=dx*dx+dy*dy;if(d<bd){bd=d;bk=k;}}
  p.na=bk;p.rt=Math.random()*0.55;
 }
}
function endAssign(){
 var i,k;
 for(i=0;i<pts.length;i++)pts[i].a=pts[i].na;
 maxMove=0;
 for(k=0;k<cents.length;k++){
  var sx=0,sy=0,n=0,c=cents[k];
  for(i=0;i<pts.length;i++)if(pts[i].a===k){sx+=pts[i].x;sy+=pts[i].y;n++;}
  c.px=c.x;c.py=c.y;
  if(n){c.tx=sx/n;c.ty=sy/n;}else{var j=Math.random()*pts.length|0;c.tx=pts[j].x;c.ty=pts[j].y;}
  maxMove=Math.max(maxMove,Math.hypot(c.tx-c.px,c.ty-c.py));
 }
 if(maxMove<0.5&&iter>0){phase='done';pt=0;}else{phase='update';pt=0;}
}
function step(dt){
 T+=dt;pt+=dt;var i,k;
 if(phase==='assign'){
  for(i=0;i<pts.length;i++){var p=pts[i];if(p.rt>=0&&p.rt<90&&pt>p.rt){p.a=p.na;p.f=1;p.rt=-1;}}
  if(pt>=0.95)endAssign();
 }else if(phase==='update'){
  var u=Math.min(1,pt/0.8),e=u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
  for(k=0;k<cents.length;k++){var c=cents[k];
   c.x=c.px+(c.tx-c.px)*e;c.y=c.py+(c.ty-c.py)*e;
   c.trail.push({x:c.x,y:c.y,a:0.7});if(c.trail.length>70)c.trail.shift();
  }
  voroDirty=true;
  if(u>=1){iter++;startAssign();}
 }else if(phase==='done'){
  if(pt>=2.8)newData();
 }
 for(i=0;i<pts.length;i++)if(pts[i].f>0)pts[i].f-=dt*2.4;
 for(k=0;k<cents.length;k++){var tr=cents[k].trail;
  for(i=0;i<tr.length;i++)tr[i].a-=dt*0.55;
  while(tr.length&&tr[0].a<=0)tr.shift();
 }
 inertia=0;
 for(i=0;i<pts.length;i++){var q=pts[i];
  if(q.a>=0&&q.a<cents.length){var dx=q.x-cents[q.a].x,dy=q.y-cents[q.a].y;inertia+=dx*dx+dy*dy;}
 }
}
function drawVoro(){
 if(voroDirty){
  var w=vc.width,h=vc.height,img=vctx.createImageData(w,h),d=img.data,o=0,x,y,k;
  for(y=0;y<h;y++){var py=(y+0.5)*VS;
   for(x=0;x<w;x++){var px=(x+0.5)*VS,bd=1e18,bk=0;
    for(k=0;k<cents.length;k++){var dx=px-cents[k].x,dy=py-cents[k].y,dd=dx*dx+dy*dy;if(dd<bd){bd=dd;bk=k;}}
    var c=RGB[bk%9];d[o++]=c[0];d[o++]=c[1];d[o++]=c[2];d[o++]=42;
   }}
  vctx.putImageData(img,0,0);voroDirty=false;
 }
 ctx.imageSmoothingEnabled=true;
 ctx.drawImage(vc,0,0,W,H);
}
function star(x,y,R){
 ctx.beginPath();
 for(var i=0;i<10;i++){var r=i%2?R*0.45:R,a=-Math.PI/2+i*Math.PI/5,sx=x+Math.cos(a)*r,sy=y+Math.sin(a)*r;
  if(i)ctx.lineTo(sx,sy);else ctx.moveTo(sx,sy);}
 ctx.closePath();
}
function draw(){
 var i,k;
 ctx.fillStyle='#04060b';ctx.fillRect(0,0,W,H);
 if(showVoro)drawVoro();
 if(phase==='assign'){
  var fade=Math.max(0,1-Math.max(0,(pt-0.65)/0.3));
  ctx.lineWidth=1;
  for(i=0;i<pts.length;i++){var p=pts[i];
   if(p.rt!==-1||p.a<0||p.a>=cents.length)continue;
   var c=cents[p.a];
   ctx.globalAlpha=Math.min(1,0.13*fade+Math.max(0,p.f)*0.3);
   ctx.strokeStyle=PAL[p.a%9];
   ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(c.x,c.y);ctx.stroke();
  }
  ctx.globalAlpha=1;
 }
 for(k=0;k<cents.length;k++){var tr=cents[k].trail;ctx.fillStyle=PAL[k%9];
  for(i=0;i<tr.length;i++){ctx.globalAlpha=Math.max(0,tr[i].a)*0.35;ctx.beginPath();ctx.arc(tr[i].x,tr[i].y,2.2,0,TAU);ctx.fill();}
 }
 ctx.globalAlpha=1;
 for(i=0;i<pts.length;i++){var q=pts[i],col=q.a<0?'#5a6a80':PAL[q.a%9],f=Math.max(0,q.f);
  ctx.fillStyle=col;
  ctx.globalAlpha=0.2;ctx.beginPath();ctx.arc(q.x,q.y,5+f*7,0,TAU);ctx.fill();
  ctx.globalAlpha=1;ctx.beginPath();ctx.arc(q.x,q.y,2.4+f*2,0,TAU);ctx.fill();
  if(f>0){ctx.globalAlpha=f;ctx.strokeStyle='#fff';ctx.lineWidth=1;
   ctx.beginPath();ctx.arc(q.x,q.y,4+(1-f)*9,0,TAU);ctx.stroke();ctx.globalAlpha=1;}
 }
 for(k=0;k<cents.length;k++){var c2=cents[k],R=11+Math.sin(T*3+k*1.7)*1.3;
  ctx.save();
  ctx.shadowColor=PAL[k%9];ctx.shadowBlur=22;
  ctx.fillStyle=PAL[k%9];star(c2.x,c2.y,R);ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.2;star(c2.x,c2.y,R);ctx.stroke();
  ctx.restore();
 }
 if(phase==='done'){
  var ring=(pt%0.9)/0.9;
  ctx.strokeStyle='#ffd700';ctx.lineWidth=2;
  for(k=0;k<cents.length;k++){var c3=cents[k];
   ctx.globalAlpha=(1-ring)*0.8;
   ctx.beginPath();ctx.arc(c3.x,c3.y,14+ring*80,0,TAU);ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.font='700 20px ui-monospace,Menlo,monospace';ctx.textAlign='center';
  ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=18;
  ctx.fillText('CONVERGED  ·  total inertia '+(inertia/1000).toFixed(1)+'k  ·  new data…',W/2,H*0.10);
  ctx.shadowBlur=0;ctx.textAlign='left';
 }
 statsEl.textContent=
  'phase   '+(phase==='done'?'CONVERGED ✦':phase.toUpperCase())+
  '\niter    '+iter+
  '\nK       '+K+'   (true clusters: '+trueK+')'+
  '\npoints  '+pts.length+
  '\ninertia '+(inertia/1000).toFixed(1)+'k'+
  '\nvoronoi '+(showVoro?'on':'off')+'   run #'+runs;
}
addEventListener('keydown',function(e){
 if(e.key>='2'&&e.key<='9'){K=+e.key;initCents();}
 else if(e.key==='v'||e.key==='V')showVoro=!showVoro;
});
cv.addEventListener('pointerdown',function(e){
 pts.push({x:e.clientX,y:e.clientY,a:-1,na:-1,f:1,rt:99});
});
var last=0;
function frame(ts){
 var dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
 step(dt);draw();
 requestAnimationFrame(frame);
}
newData();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
