<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<title>Multi-Armed Bandit</title>
<style>
  html,body{margin:0;height:100%;background:#06050c;overflow:hidden}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;top:0;left:0;margin:12px;padding:10px 12px;background:rgba(10,8,20,.74);
      border:1px solid rgba(200,120,255,.28);border-radius:8px;color:#e5d4ff;
      font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;max-width:340px;z-index:10;
      backdrop-filter:blur(6px);text-shadow:0 0 8px rgba(180,110,255,.3)}
  #ui h1{margin:0 0 4px;font-size:14px;letter-spacing:.11em;color:#f9a;text-transform:uppercase}
  #ui .e{color:#a897c4;margin:0 0 7px}
  #ui .k{color:#7a6b96}
  #ui b{color:#fff;font-weight:600}
  #ui a{color:#6ff;text-decoration:none;display:inline-block;margin-top:7px}
  #ui a:hover{text-decoration:underline}
  #ui hr{border:0;border-top:1px solid rgba(200,120,255,.16);margin:7px 0}
</style>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Multi-Armed Bandit</h1>
  <p class="e">Three strategies race to find the best slot machine — watch ε-greedy's regret climb in a straight line while UCB and Thompson flatten off.</p>
  <div class="k">R reroll odds &middot; 1/2/3 spotlight &middot; 0 all &middot; Space pause &middot; F fast</div>
  <hr>
  <div id="stats"></div>
  <a href="index.html">&larr; gallery</a>
</div>
<script>
'use strict';
var cv = document.getElementById('c'), ctx = cv.getContext('2d');
var statsEl = document.getElementById('stats');

var K = 6;
var truth = [];
var best = 0, bestP = 0;
var paused = false, fast = false, spotlight = -1;
var particles = [];

var EPSILON = 0.1;
var STRATS = [
  { name:'ε-greedy ε=0.1', color:'#ffcc44', short:'EPS' },
  { name:'UCB1-tuned',     color:'#44e0ff', short:'UCB' },
  { name:'Thompson',       color:'#ff5fd0', short:'THM' }
];

function makeAgent(i){
  return {
    def: STRATS[i],
    n: new Float64Array(K),        // pull counts
    sum: new Float64Array(K),      // total reward
    est: new Float64Array(K),      // estimated value
    a: new Float64Array(K),        // beta alpha (thompson)
    b: new Float64Array(K),        // beta beta
    flash: new Float64Array(K),
    t: 0, reward: 0, regret: 0,
    curve: [], last: -1
  };
}
var agents = [];

function reroll(){
  truth = [];
  for (var i=0;i<K;i++) truth.push(0.10 + Math.random()*0.52);
  // guarantee one clearly-best arm so the gap is learnable on screen
  var bi = (Math.random()*K)|0;
  truth[bi] = 0.80 + Math.random()*0.14;
  best = 0; bestP = truth[0];
  for (var j=1;j<K;j++) if (truth[j] > bestP){ bestP = truth[j]; best = j; }
  agents = [makeAgent(0), makeAgent(1), makeAgent(2)];
  for (var s=0;s<3;s++) for (var k=0;k<K;k++){ agents[s].a[k]=1; agents[s].b[k]=1; }
  particles = [];
}

// Gamma/Beta sampling for Thompson (Marsaglia-Tsang)
function randGamma(k){
  if (k < 1){
    var u = Math.random();
    return randGamma(1+k) * Math.pow(u, 1/k);
  }
  var d = k - 1/3, c = 1/Math.sqrt(9*d);
  for(;;){
    var x, v;
    do { x = gauss(); v = 1 + c*x; } while (v <= 0);
    v = v*v*v;
    var u2 = Math.random();
    if (u2 < 1 - 0.0331*x*x*x*x) return d*v;
    if (Math.log(u2) < 0.5*x*x + d*(1 - v + Math.log(v))) return d*v;
  }
}
var spare = null;
function gauss(){
  if (spare !== null){ var s = spare; spare = null; return s; }
  var u, v, s2;
  do { u = Math.random()*2-1; v = Math.random()*2-1; s2 = u*u+v*v; } while (s2 >= 1 || s2 === 0);
  var m = Math.sqrt(-2*Math.log(s2)/s2);
  spare = v*m; return u*m;
}
function randBeta(a,b){
  var x = randGamma(a), y = randGamma(b);
  return x/(x+y);
}

function chooseArm(ag, si){
  var i;
  for (i=0;i<K;i++) if (ag.n[i] === 0) return i;   // one pull each first
  if (si === 0){ // epsilon-greedy with a constant epsilon -> LINEAR regret
    if (Math.random() < EPSILON) return (Math.random()*K)|0;
    var b0 = 0;
    for (i=1;i<K;i++) if (ag.est[i] > ag.est[b0]) b0 = i;
    return b0;
  }
  if (si === 1){ // UCB1-tuned (Auer, Cesa-Bianchi & Fischer 2002) -> LOG regret
    var lt = Math.log(ag.t + 1);
    var bi = 0, bv = -1e9;
    for (i=0;i<K;i++){
      var varEst = ag.est[i]*(1 - ag.est[i]) + Math.sqrt(2*lt/ag.n[i]);
      var v = ag.est[i] + Math.sqrt((lt/ag.n[i]) * Math.min(0.25, varEst));
      if (v > bv){ bv = v; bi = i; }
    }
    return bi;
  }
  // Thompson sampling
  var ti = 0, tv = -1;
  for (i=0;i<K;i++){
    var s = randBeta(ag.a[i], ag.b[i]);
    if (s > tv){ tv = s; ti = i; }
  }
  return ti;
}

function pull(ag, si){
  var arm = chooseArm(ag, si);
  var win = Math.random() < truth[arm] ? 1 : 0;
  ag.n[arm]++; ag.sum[arm] += win;
  ag.est[arm] = ag.sum[arm]/ag.n[arm];
  if (win) ag.a[arm]++; else ag.b[arm]++;
  ag.t++; ag.reward += win;
  ag.regret += bestP - truth[arm];
  ag.flash[arm] = 1;
  ag.last = arm;
  if (ag.t % 4 === 0){
    ag.curve.push(ag.regret);
    if (ag.curve.length > 900) ag.curve.shift();
  }
  if (win) spawnCoins(si, arm);
}

function spawnCoins(si, arm){
  if (particles.length > 260) return;
  var g = geom();
  var cx = g.armX(arm) + g.armW/2;
  var cy = g.laneY(si) + g.laneH*0.42;
  var n = 2 + (Math.random()*2|0);
  for (var i=0;i<n;i++){
    particles.push({
      x: cx + (Math.random()-0.5)*g.armW*0.5, y: cy,
      vx: (Math.random()-0.5)*1.4, vy: -1.6 - Math.random()*1.6,
      life: 1, c: STRATS[si].color
    });
  }
}

// ---------- layout ----------
var dpr=1, cw=0, ch=0;
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cw = window.innerWidth; ch = window.innerHeight;
  cv.width = Math.floor(cw*dpr); cv.height = Math.floor(ch*dpr);
  cv.style.width = cw+'px'; cv.style.height = ch+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize);

function geom(){
  var left = 380, right = 30, top = 40;
  if (cw < 900) left = 24, top = 220;
  var graphH = Math.min(230, ch*0.30);
  var areaW = cw - left - right;
  var lanesTop = top;
  var lanesH = ch - top - graphH - 60;
  var laneH = lanesH/3;
  var armPad = 12;
  var armW = (areaW - armPad*(K+1))/K;
  return {
    left:left, top:top, areaW:areaW, laneH:laneH, graphH:graphH,
    armW:armW, armPad:armPad,
    laneY:function(i){ return lanesTop + i*laneH; },
    armX:function(i){ return left + armPad + i*(armW+armPad); },
    graphY: ch - graphH - 26
  };
}

function draw(now){
  var time = now*0.001;
  ctx.fillStyle = '#06050c';
  ctx.fillRect(0,0,cw,ch);
  var g = geom();

  for (var si=0; si<3; si++){
    var ag = agents[si], def = STRATS[si];
    var dim = (spotlight >= 0 && spotlight !== si) ? 0.22 : 1;
    var ly = g.laneY(si);

    // lane background
    ctx.fillStyle = 'rgba(255,255,255,'+(0.016*dim+0.006)+')';
    ctx.fillRect(g.left, ly+2, g.areaW, g.laneH-8);
    ctx.strokeStyle = hexA(def.color, 0.16*dim);
    ctx.lineWidth = 1;
    ctx.strokeRect(g.left+.5, ly+2.5, g.areaW-1, g.laneH-9);

    // lane label
    ctx.save();
    ctx.globalAlpha = dim;
    ctx.fillStyle = def.color;
    ctx.font = 'bold 13px ui-monospace,monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.shadowColor = def.color; ctx.shadowBlur = 10;
    ctx.fillText((si+1)+'  '+def.name, g.left+6, ly+7);
    ctx.shadowBlur = 0;
    ctx.font = '11px ui-monospace,monospace';
    ctx.fillStyle = 'rgba(220,225,245,'+(0.7*dim)+')';
    ctx.textAlign = 'right';
    ctx.fillText('pulls '+ag.t+'   regret '+ag.regret.toFixed(1)+'   win% '+(ag.t? (100*ag.reward/ag.t).toFixed(1):'0.0'),
                 g.left+g.areaW-8, ly+8);
    ctx.restore();

    // arms
    var barTop = ly + 28, barH = g.laneH - 46;
    for (var k=0;k<K;k++){
      var x = g.armX(k), w = g.armW;
      var isBest = (k === best);
      var fl = ag.flash[k];
      ag.flash[k] = Math.max(0, fl - 0.055);

      // ghost outline = hidden truth
      var th = barH * truth[k];
      ctx.strokeStyle = 'rgba(255,255,255,'+(0.30*dim)+')';
      ctx.setLineDash([4,3]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, barTop + barH - th);
      ctx.lineTo(x+w, barTop + barH - th);
      ctx.stroke();
      ctx.setLineDash([]);

      // frame
      ctx.strokeStyle = 'rgba(160,170,210,'+(0.16*dim)+')';
      ctx.strokeRect(x+.5, barTop+.5, w-1, barH-1);

      // estimate bar
      var eh = barH * Math.max(0, Math.min(1, ag.est[k]));
      var grad = ctx.createLinearGradient(0, barTop+barH, 0, barTop);
      grad.addColorStop(0, hexA(def.color, 0.20*dim));
      grad.addColorStop(1, hexA(def.color, 0.85*dim));
      ctx.fillStyle = grad;
      ctx.fillRect(x+1, barTop+barH-eh, w-2, eh);

      // flash on pull
      if (fl > 0.01){
        ctx.fillStyle = hexA('#ffffff', fl*0.5*dim);
        ctx.fillRect(x+1, barTop+1, w-2, barH-2);
        ctx.save();
        ctx.shadowColor = def.color; ctx.shadowBlur = 24*fl;
        ctx.strokeStyle = hexA(def.color, dim);
        ctx.lineWidth = 2;
        ctx.strokeRect(x+1, barTop+1, w-2, barH-2);
        ctx.restore();
      }
      if (isBest){
        ctx.strokeStyle = 'rgba(120,255,190,'+(0.5*dim)+')';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x-1.5, barTop-1.5, w+3, barH+3);
      }

      // labels
      ctx.save();
      ctx.globalAlpha = dim;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.font = '10px ui-monospace,monospace';
      ctx.fillStyle = 'rgba(230,235,255,.85)';
      ctx.fillText(ag.est[k].toFixed(2), x+w/2, barTop+barH+3);
      ctx.fillStyle = 'rgba(170,180,215,.6)';
      ctx.fillText('n='+ag.n[k], x+w/2, barTop+barH+15);
      if (si === 0){
        ctx.fillStyle = 'rgba(255,255,255,.35)';
        ctx.textBaseline = 'bottom';
        ctx.fillText('p='+truth[k].toFixed(2), x+w/2, barTop-3);
      }
      ctx.restore();
    }
  }

  drawRegret(g);
  drawParticles();
}

function drawRegret(g){
  var gx = g.left, gy = g.graphY, gw = g.areaW, gh = g.graphH;
  ctx.fillStyle = 'rgba(14,10,26,.72)';
  ctx.fillRect(gx, gy, gw, gh);
  ctx.strokeStyle = 'rgba(200,120,255,.22)';
  ctx.lineWidth = 1;
  ctx.strokeRect(gx+.5, gy+.5, gw-1, gh-1);

  var mx = 1;
  for (var s=0;s<3;s++) if (agents[s].regret > mx) mx = agents[s].regret;
  mx *= 1.1;
  var maxLen = 1;
  for (s=0;s<3;s++) if (agents[s].curve.length > maxLen) maxLen = agents[s].curve.length;

  // gridlines
  ctx.strokeStyle = 'rgba(255,255,255,.06)';
  for (var i=1;i<4;i++){
    var yy = gy + gh*(i/4);
    ctx.beginPath(); ctx.moveTo(gx,yy); ctx.lineTo(gx+gw,yy); ctx.stroke();
  }

  for (s=0;s<3;s++){
    var ag = agents[s], c = agents[s].def.color;
    var dim = (spotlight >= 0 && spotlight !== s) ? 0.2 : 1;
    if (ag.curve.length < 2) continue;
    ctx.beginPath();
    for (i=0;i<ag.curve.length;i++){
      var px = gx + (i/(maxLen-1))*(gw-8) + 4;
      var py = gy + gh - 8 - (ag.curve[i]/mx)*(gh-22);
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.strokeStyle = hexA(c, dim);
    ctx.lineWidth = 2;
    ctx.shadowColor = c; ctx.shadowBlur = 9*dim;
    ctx.stroke();
    ctx.shadowBlur = 0;
    // end label
    var lx = gx + ((ag.curve.length-1)/(maxLen-1))*(gw-8) + 6;
    var ly = gy + gh - 8 - (ag.regret/mx)*(gh-22);
    ctx.fillStyle = hexA(c, dim);
    ctx.font = '11px ui-monospace,monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(ag.def.short+' '+ag.regret.toFixed(1), Math.min(lx, gx+gw-70), ly);
  }

  ctx.fillStyle = 'rgba(200,190,225,.7)';
  ctx.font = '11px ui-monospace,monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('cumulative regret (lower = better) — reward given up vs always playing arm '+(best+1)+
               '   |   straight line = linear regret, flattening = logarithmic regret',
               gx+8, gy+6);
}

function drawParticles(){
  for (var i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.13; p.life -= 0.022;
    if (p.life <= 0){ particles.splice(i,1); continue; }
    ctx.fillStyle = hexA(p.c, p.life);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.4*p.life+0.8, 0, 6.2832);
    ctx.fill();
  }
}

function hexA(hex, a){
  var h = hex.replace('#','');
  var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return 'rgba('+r+','+g+','+b+','+Math.max(0,Math.min(1,a))+')';
}

function updateStats(){
  var s = 'true best: arm <b>'+(best+1)+'</b> (p='+bestP.toFixed(2)+')<br>';
  for (var i=0;i<3;i++){
    var ag = agents[i];
    var pick = 0;
    for (var k=1;k<K;k++) if (ag.est[k] > ag.est[pick]) pick = k;
    var share = ag.t ? (100*ag.n[best]/ag.t) : 0;
    s += '<span style="color:'+STRATS[i].color+'">'+STRATS[i].name+'</span> '+
         'regret <b>'+ag.regret.toFixed(1)+'</b> &nbsp; on-best <b>'+share.toFixed(0)+'%</b><br>';
  }
  s += (paused?'<b>PAUSED</b> ':'')+(fast?'<b>FAST</b> ':'')+
       (spotlight>=0?'spotlight '+(spotlight+1):'');
  statsEl.innerHTML = s;
}

var frame = 0;
function loop(now){
  if (!paused){
    var pulls = fast ? 24 : 3;
    for (var i=0;i<pulls;i++)
      for (var s=0;s<3;s++) pull(agents[s], s);
  }
  draw(now);
  if ((frame++ % 5) === 0) updateStats();
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', function(ev){
  var k = ev.key.toLowerCase();
  if (k === 'r') reroll();
  else if (k === '1') spotlight = spotlight===0?-1:0;
  else if (k === '2') spotlight = spotlight===1?-1:1;
  else if (k === '3') spotlight = spotlight===2?-1:2;
  else if (k === '0') spotlight = -1;
  else if (k === 'f') fast = !fast;
  else if (k === ' ' || ev.code === 'Space'){ paused = !paused; ev.preventDefault(); }
});

resize();
reroll();
requestAnimationFrame(loop);
</script>
</body>
