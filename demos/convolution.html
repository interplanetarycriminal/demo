<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convolution — CNN Core Op</title>
<style>
html,body{margin:0;height:100%;background:#04060b;overflow:hidden}
canvas{position:fixed;inset:0;display:block}
#ui{position:fixed;top:12px;left:12px;z-index:10;font:11px/1.55 ui-monospace,Menlo,Consolas,monospace;
color:#cde;background:rgba(4,10,18,.74);border:1px solid rgba(0,255,215,.28);border-radius:8px;padding:10px 12px;max-width:330px}
#ui h1{margin:0 0 3px;font-size:13px;color:#1fe;letter-spacing:1px;text-shadow:0 0 9px rgba(0,255,220,.7)}
#ui .ex{margin:0 0 6px;color:#9fb4c8}
#ui .keys{color:#8f8;opacity:.85}
#ui .stats{margin-top:6px;color:#ffd27f;white-space:pre}
#ui a{color:#ff7ad9;text-decoration:none}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div id="ui">
<h1>CONVOLUTION &middot; CNN CORE OP</h1>
<p class="ex">A 3&times;3 kernel slides over the image and each output pixel is the weighted sum of the 9 pixels beneath it &mdash; edge kernels fire exactly where brightness changes.</p>
<div class="keys">[1-6] kernel preset &middot; [S] stride 1/2 &middot; [D] image &middot; [SPACE] pause</div>
<div class="stats" id="stats"></div>
<a href="index.html">&larr; gallery</a>
</div>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),statsEl=document.getElementById('stats');
let W=0,H=0;
function resize(){const d=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();

const N=28,PAT=['smiley','shapes','checker'];
let patIdx=0;const img=new Float32Array(N*N);
function makeImage(){
 const p=PAT[patIdx];
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  let v=0;const cx=x-13.5,cy=y-13.5,r=Math.hypot(cx,cy);
  if(p==='smiley'){
   if(r<11.6)v=.22;
   if(Math.abs(r-11)<1.3)v=1;
   if(Math.hypot(cx+4.5,cy+3.5)<2||Math.hypot(cx-4.5,cy+3.5)<2)v=1;
   const mr=Math.hypot(cx,cy-2);
   if(mr>5.4&&mr<7.4&&cy>4)v=1;
  }else if(p==='shapes'){
   if(x>=4&&x<=12&&y>=4&&y<=22)v=.85;
   if(Math.abs(x-y)<1.6&&x>9)v=1;
   if(x>=16&&x<=24&&y>=6&&y<=12)v=.55;
   if(Math.hypot(x-20,y-19)<3.6)v=1;
  }else v=(((x>>2)+(y>>2))&1)?1:.06;
  img[y*N+x]=v;
 }
}
const KER=[
 {n:'edge X (Sobel)',k:[-1,0,1,-2,0,2,-1,0,1]},
 {n:'edge Y (Sobel)',k:[-1,-2,-1,0,0,0,1,2,1]},
 {n:'sharpen',k:[0,-1,0,-1,5,-1,0,-1,0]},
 {n:'box blur',k:[.11,.11,.11,.11,.11,.11,.11,.11,.11]},
 {n:'emboss',k:[-2,-1,0,-1,1,1,0,1,2]},
 {n:'random',k:null}];
let kIdx=0,K=KER[0].k.slice();
let stride=1,outN=0,out=null,fill=null,age=null,pos=0,run=true,passes=0;
const cur={sx:0,sy:0,ox:0,oy:0,patch:new Float32Array(9),prod:new Float32Array(9),sum:0};
function restart(){outN=((N-3)/stride|0)+1;out=new Float32Array(outN*outN);
 fill=new Uint8Array(outN*outN);age=new Float32Array(outN*outN);pos=0;passes=0;
 cur.sx=cur.sy=cur.ox=cur.oy=0;cur.sum=0;}
function setKernel(i){kIdx=i;const kk=KER[i];
 K=kk.k?kk.k.slice():Array.from({length:9},()=>Math.round((Math.random()*2-1)*10)/10);restart();}
makeImage();restart();

function step(t){
 if(pos>=outN*outN){pos=0;passes++;}
 const oy=pos/outN|0,ox=pos%outN,sx=ox*stride,sy=oy*stride;let s=0;
 for(let j=0;j<3;j++)for(let i=0;i<3;i++){
  const pv=img[(sy+j)*N+sx+i],pr=pv*K[j*3+i];
  cur.patch[j*3+i]=pv;cur.prod[j*3+i]=pr;s+=pr;}
 out[pos]=s;fill[pos]=1;age[pos]=t;
 cur.sx=sx;cur.sy=sy;cur.ox=ox;cur.oy=oy;cur.sum=s;pos++;
}
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(k>='1'&&k<='6')setKernel(+k-1);
 else if(k==='s'){stride=stride===1?2:1;restart();}
 else if(k==='d'){patIdx=(patIdx+1)%PAT.length;makeImage();restart();}
 else if(k===' '){run=!run;e.preventDefault();}
});
function fmt(v){return(v>=0?'+':'-')+Math.abs(v).toFixed(1);}
function grid3(x,y,c,vals,label){
 if(label){ctx.font='10px monospace';ctx.fillStyle='#7fa0b8';ctx.textAlign='left';ctx.fillText(label,x,y-5);}
 for(let j=0;j<3;j++)for(let i=0;i<3;i++){
  const v=vals[j*3+i],gx=x+i*c,gy=y+j*c;
  ctx.fillStyle=v>=0?'rgba(255,160,60,'+Math.min(.8,.1+Math.abs(v)/4)+')'
                    :'rgba(0,210,255,'+Math.min(.8,.1+Math.abs(v)/4)+')';
  ctx.fillRect(gx,gy,c-2,c-2);
  if(c>=16){ctx.fillStyle='#eaf6ff';ctx.textAlign='center';
   ctx.font=(c>26?11:9)+'px monospace';
   ctx.fillText(fmt(v),gx+(c-2)/2,gy+c/2+3);}
 }
}
function frame(tms){
 const t=tms/1000;
 ctx.clearRect(0,0,W,H);
 const s=Math.max(4,Math.min(W*.30/N,(H-150)/N));
 const gw=N*s,srcX=W*.045,srcY=(H-gw)/2+18;
 const outX=W*.955-gw,oc=gw/outN;
 if(run){const n=stride===1?4:1;for(let i=0;i<n;i++)step(t);}
 // source image
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  ctx.fillStyle='rgba(150,205,255,'+(.05+.8*img[y*N+x])+')';
  ctx.fillRect(srcX+x*s,srcY+y*s,s-1,s-1);
 }
 // feature map
 let mxv=1e-9;for(let i=0;i<outN*outN;i++)if(fill[i])mxv=Math.max(mxv,Math.abs(out[i]));
 for(let y=0;y<outN;y++)for(let x=0;x<outN;x++){
  const i=y*outN+x,gx=outX+x*oc,gy=srcY+y*oc;
  if(!fill[i])ctx.fillStyle='rgba(120,150,180,.05)';
  else{const v=out[i]/mxv;
   ctx.fillStyle=v>=0?'rgba(255,170,60,'+(.06+.9*Math.abs(v))+')'
                     :'rgba(0,220,255,'+(.06+.9*Math.abs(v))+')';}
  ctx.fillRect(gx,gy,oc-1,oc-1);
  if(fill[i]){const a=Math.max(0,1-(t-age[i])/.5);
   if(a>0){ctx.fillStyle='rgba(255,255,255,'+(.5*a)+')';ctx.fillRect(gx,gy,oc-1,oc-1);}}
 }
 // titles
 ctx.font='12px monospace';ctx.textAlign='left';
 ctx.fillStyle='#9fd0ff';ctx.fillText('INPUT 28×28 — "'+PAT[patIdx]+'"',srcX,srcY-10);
 ctx.fillStyle='#ffca7a';ctx.fillText('FEATURE MAP '+outN+'×'+outN+'  (stride '+stride+')',outX,srcY-10);
 ctx.fillStyle='#6f8aa0';ctx.font='10px monospace';
 ctx.fillText('+ orange   - cyan',outX,srcY+gw+14);
 // highlights
 const hx=srcX+cur.sx*s,hy=srcY+cur.sy*s;
 const ocx=outX+cur.ox*oc,ocy=srcY+cur.oy*oc;
 ctx.save();ctx.shadowColor='#0fe';ctx.shadowBlur=10+4*Math.sin(t*5);
 ctx.strokeStyle='rgba(0,255,225,.95)';ctx.lineWidth=2;
 ctx.strokeRect(hx,hy,3*s,3*s);
 ctx.shadowColor='#fc0';ctx.strokeStyle='rgba(255,190,60,.95)';
 ctx.strokeRect(ocx,ocy,oc,oc);
 ctx.restore();
 ctx.strokeStyle='rgba(0,255,210,.25)';ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(hx+1.5*s,hy+1.5*s);ctx.lineTo(ocx+oc/2,ocy+oc/2);ctx.stroke();
 // flash the 9 products on the source patch
 if(s>=15){ctx.font='9px monospace';ctx.textAlign='center';
  for(let j=0;j<3;j++)for(let i=0;i<3;i++){const pr=cur.prod[j*3+i];
   ctx.fillStyle=pr>=0?'#ffd9a0':'#aef4ff';
   ctx.fillText(fmt(pr),hx+i*s+s/2,hy+j*s+s/2+3);}}
 // center math panel
 const px0=srcX+gw,px1=outX;
 const c=Math.max(12,Math.min(34,(px1-px0-60)/3,(H-240)/9.6));
 const pcx=(px0+px1)/2-1.5*c;
 let py=Math.max(srcY+8,(H-(9*c+84))/2);
 grid3(pcx,py,c,cur.patch,'IMAGE PATCH');py+=3*c+22;
 grid3(pcx,py,c,K,'×  KERNEL — '+KER[kIdx].n);py+=3*c+22;
 grid3(pcx,py,c,cur.prod,'=  PRODUCTS');py+=3*c+18;
 ctx.font='13px monospace';ctx.textAlign='center';
 ctx.fillStyle='#ffe08a';ctx.shadowColor='#fc0';ctx.shadowBlur=8;
 ctx.fillText('Σ = '+cur.sum.toFixed(2)+'  →  out['+cur.oy+','+cur.ox+']',pcx+1.5*c,py+6);
 ctx.shadowBlur=0;
 statsEl.textContent=
  'kernel : '+KER[kIdx].n+'\n'+
  'stride : '+stride+'   output: '+outN+'×'+outN+'\n'+
  'pixel  : ('+cur.ox+','+cur.oy+')  '+pos+'/'+(outN*outN)+'\n'+
  'Σ now  : '+cur.sum.toFixed(2)+'   |max|: '+mxv.toFixed(2)+'\n'+
  'image  : '+PAT[patIdx]+'   passes: '+passes+(run?'':'   [PAUSED]');
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
