<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaleido Mandala</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060a;}
  canvas{display:block;position:fixed;inset:0;touch-action:none;}
  #ui{position:fixed;top:12px;left:12px;z-index:10;
      font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#f9d;
      background:rgba(14,8,20,0.42);border:1px solid rgba(255,150,220,0.18);
      border-radius:8px;padding:10px 12px;max-width:270px;max-height:52vh;overflow:auto}
  #ui h1{margin:0 0 4px;font-size:12px;letter-spacing:2px;color:#ff9be6;text-transform:uppercase;}
  #ui p{margin:2px 0;opacity:0.82;}
  #ui a{color:#f9b;text-decoration:none;border-bottom:1px dotted #f9b;}
  #ui .k{color:#ffd27f;}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div id="ui">
  <h1>Kaleido Mandala</h1>
  <p>An auto-pen weaves k-fold symmetric glowing strokes.</p>
  <p><span class="k">move</span> mouse to steer &middot; <span class="k">click</span> clears + new symmetry</p>
  <p>fold: <span id="kfold">8</span></p>
  <p><a href="index.html">&larr; gallery</a></p>
</div>
<canvas id="c"></canvas>
<script>
var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#05060a'; ctx.fillRect(0,0,W,H);
  prev=null;
}
var k=8, baseHue=Math.random()*360, hueRange=90;
var t=0, pen={x:0,y:0}, prev=null;
var mouse={x:null,y:null,last:-1e9};

window.addEventListener('resize',resize);
resize();

canvas.addEventListener('pointermove',function(e){
  mouse.x=e.clientX; mouse.y=e.clientY; mouse.last=performance.now();
});
canvas.addEventListener('click',function(){
  k=6+Math.floor(Math.random()*11);
  baseHue=Math.random()*360;
  hueRange=40+Math.random()*170;
  document.getElementById('kfold').textContent=k;
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#05060a'; ctx.fillRect(0,0,W,H);
  prev=null;
});

function frame(now){
  t+=0.016;
  var cx=W/2, cy=H/2, R=Math.min(W,H)*0.46;
  var tx,ty;
  if(mouse.x!==null && (now-mouse.last)<1500){
    tx=mouse.x; ty=mouse.y;
  } else {
    var A=R*0.92;
    tx=cx+A*(0.6*Math.sin(t*0.7)+0.4*Math.sin(t*0.23+1.3));
    ty=cy+A*(0.6*Math.cos(t*0.53)+0.4*Math.cos(t*0.31+0.7));
  }
  if(prev===null){ pen.x=tx; pen.y=ty; prev={x:tx,y:ty}; }
  pen.x+=(tx-pen.x)*0.12;
  pen.y+=(ty-pen.y)*0.12;

  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(5,6,10,0.015)';
  ctx.fillRect(0,0,W,H);

  var rx1=prev.x-cx, ry1=prev.y-cy, rx2=pen.x-cx, ry2=pen.y-cy;
  var rad=Math.hypot(rx2,ry2);
  var hue=(baseHue+(rad/R)*hueRange+t*12)%360;
  ctx.globalCompositeOperation='lighter';
  ctx.lineWidth=2; ctx.lineCap='round';
  ctx.strokeStyle='hsla('+hue+',90%,62%,0.5)';
  ctx.shadowBlur=10; ctx.shadowColor='hsla('+hue+',90%,60%,0.9)';
  ctx.save();
  ctx.translate(cx,cy);
  for(var i=0;i<k;i++){
    ctx.save(); ctx.rotate(i*2*Math.PI/k);
    ctx.beginPath(); ctx.moveTo(rx1,ry1); ctx.lineTo(rx2,ry2); ctx.stroke();
    ctx.scale(1,-1);
    ctx.beginPath(); ctx.moveTo(rx1,ry1); ctx.lineTo(rx2,ry2); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  ctx.shadowBlur=0;
  ctx.globalCompositeOperation='source-over';

  prev={x:pen.x,y:pen.y};
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
