<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<title>Minimax + Alpha-Beta</title>
<style>
  html,body{margin:0;height:100%;background:#04060a;overflow:hidden}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;top:0;left:0;margin:12px;padding:10px 12px;background:rgba(6,12,18,.75);
      border:1px solid rgba(90,240,200,.26);border-radius:8px;color:#c9f6e8;
      font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;max-width:330px;z-index:10;
      backdrop-filter:blur(6px);text-shadow:0 0 8px rgba(90,240,200,.3)}
  #ui h1{margin:0 0 4px;font-size:14px;letter-spacing:.11em;color:#5fe;text-transform:uppercase}
  #ui .e{color:#8db6ab;margin:0 0 7px}
  #ui .k{color:#5d857a}
  #ui b{color:#fff;font-weight:600}
  #ui a{color:#ff7bd5;text-decoration:none;display:inline-block;margin-top:7px}
  #ui a:hover{text-decoration:underline}
  #ui hr{border:0;border-top:1px solid rgba(90,240,200,.16);margin:7px 0}
</style>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Minimax + Alpha-Beta</h1>
  <p class="e">The AI searches every possible future of the game, and alpha-beta lets it skip whole branches that cannot change the answer.</p>
  <div class="k">click to play X &middot; P toggle pruning &middot; R restart &middot; Space pause search</div>
  <hr>
  <div id="stats"></div>
  <a href="index.html">&larr; gallery</a>
</div>
<script>
'use strict';
var cv = document.getElementById('c'), ctx = cv.getContext('2d');
var statsEl = document.getElementById('stats');

var EMPTY = 0, X = 1, O = 2;
var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
var board = new Uint8Array(9);
var turn = X, gameOver = false, winner = 0, winLine = null;
var pruningOn = true, paused = false, thinking = false;
var aiMove = -1, status = 'your move — you are X';
var nodesPrune = 0, nodesFull = 0, prunedCount = 0;
var lastPruneCmp = 0, lastFullCmp = 0;

// visualisation
var VIS_DEPTH = 4, MAX_VIS = 700;
var nodes = [], events = [], evIdx = 0, evStep = 1;
var revealed = [], revIdx = 0, maxDepthSeen = 0;

// allocating version — only used by the UI / game flow, never inside the search
function checkWin(b){
  for (var i=0;i<8;i++){
    var a=LINES[i][0],c=LINES[i][1],d=LINES[i][2];
    if (b[a] && b[a]===b[c] && b[a]===b[d]) return {p:b[a], line:LINES[i]};
  }
  for (var j=0;j<9;j++) if (!b[j]) return null;
  return {p:0, line:null};
}

// hot path: no allocation. -1 = keep playing, 0 = draw, 1 = X won, 2 = O won
var L0=[0,3,6,0,1,2,0,2], L1=[1,4,7,3,4,5,4,4], L2=[2,5,8,6,7,8,8,6];
function winnerOf(b){
  for (var i=0;i<8;i++){
    var v = b[L0[i]];
    if (v && v === b[L1[i]] && v === b[L2[i]]) return v;
  }
  for (var j=0;j<9;j++) if (!b[j]) return -1;
  return 0;
}

// ---------- pure counting search (for the honest node-count comparison) ----------
function countSearch(depth, alpha, beta, maximizing, prune, box){
  box.n++;
  var w = winnerOf(board);
  if (w >= 0) return (w === X) ? (10-depth) : (w === O ? (depth-10) : 0);
  var bestV = maximizing ? -Infinity : Infinity;
  for (var i=0;i<9;i++){
    if (board[i]) continue;
    board[i] = maximizing ? X : O;
    var v = countSearch(depth+1, alpha, beta, !maximizing, prune, box);
    board[i] = EMPTY;
    if (maximizing){ if (v > bestV) bestV = v; if (bestV > alpha) alpha = bestV; }
    else { if (v < bestV) bestV = v; if (bestV < beta) beta = bestV; }
    if (prune && beta <= alpha) break;
  }
  return bestV;
}

// ---------- recording search (drives the animated tree) ----------
function addNode(parent, depth, move, maximizing){
  var id = nodes.length;
  nodes.push({id:id, parent:parent, depth:depth, move:move, maximizing:maximizing,
              val:null, pruned:false, leaf:false, x:0, y:0});
  if (depth > maxDepthSeen) maxDepthSeen = depth;
  events.push({type:'open', n:id});
  return id;
}

function recSearch(id, depth, alpha, beta, maximizing){
  var w = winnerOf(board);
  if (w >= 0){
    var tv = (w === X) ? (10-depth) : (w === O ? (depth-10) : 0);
    if (id >= 0){ nodes[id].val = tv; nodes[id].leaf = true; events.push({type:'value', n:id}); }
    return {v:tv, m:-1};
  }
  var bestM = -1, bestV = maximizing ? -Infinity : Infinity;
  for (var i=0;i<9;i++){
    if (board[i]) continue;
    board[i] = maximizing ? X : O;
    var canShow = (id >= 0) && (depth+1 <= VIS_DEPTH) && (nodes.length < MAX_VIS);
    var child = canShow ? addNode(id, depth+1, i, !maximizing) : -1;
    var r = recSearch(child, depth+1, alpha, beta, !maximizing);
    board[i] = EMPTY;
    if (maximizing){ if (r.v > bestV){ bestV = r.v; bestM = i; } if (bestV > alpha) alpha = bestV; }
    else { if (r.v < bestV){ bestV = r.v; bestM = i; } if (bestV < beta) beta = bestV; }
    if (id >= 0){ nodes[id].val = bestV; events.push({type:'update', n:id}); }
    if (pruningOn && beta <= alpha){
      if (id >= 0 && nodes.length < MAX_VIS){
        for (var k=i+1;k<9;k++){
          if (board[k]) continue;
          if (nodes.length >= MAX_VIS) break;
          var gid = nodes.length;
          nodes.push({id:gid, parent:id, depth:depth+1, move:k, maximizing:!maximizing,
                      val:null, pruned:true, leaf:true, x:0, y:0});
          if (depth+1 > maxDepthSeen) maxDepthSeen = depth+1;
          events.push({type:'prune', n:gid});
        }
      }
      break;
    }
  }
  if (id >= 0) events.push({type:'value', n:id});
  return {v:bestV, m:bestM};
}

function startThinking(){
  nodes = []; events = []; evIdx = 0; revealed = []; revIdx = 0; maxDepthSeen = 0;

  var boxA = {n:0}, boxB = {n:0};
  countSearch(0, -Infinity, Infinity, false, true, boxA);
  countSearch(0, -Infinity, Infinity, false, false, boxB);
  nodesFull = boxB.n;
  nodesPrune = boxA.n;
  lastPruneCmp = boxA.n; lastFullCmp = boxB.n;
  prunedCount = boxB.n - boxA.n;

  var root = addNode(-1, 0, -1, false);
  var res = recSearch(root, 0, -Infinity, Infinity, false);
  aiMove = res.m;
  evStep = Math.max(1, Math.ceil(events.length / 170));  // reveal in ~3s at 60fps
  thinking = true;
  status = 'AI thinking…';
}

// ---------- game flow ----------
function restart(){
  board = new Uint8Array(9);
  turn = X; gameOver = false; winner = 0; winLine = null; thinking = false;
  nodes = []; events = []; evIdx = 0; revealed = []; revIdx = 0;
  nodesPrune = 0; nodesFull = 0; prunedCount = 0; maxDepthSeen = 0;
  status = 'your move — you are X';
}
function playerMove(i){
  if (gameOver || thinking || turn !== X || board[i]) return;
  board[i] = X;
  var w = checkWin(board);
  if (w){ finish(w); return; }
  turn = O;
  startThinking();
}
function commitAI(){
  thinking = false;
  if (aiMove >= 0 && !board[aiMove]) board[aiMove] = O;
  var w = checkWin(board);
  if (w){ finish(w); return; }
  turn = X;
  status = 'your move — you are X';
}
function finish(w){
  gameOver = true; winner = w.p; winLine = w.line; thinking = false;
  status = w.p === X ? 'you win?! (that should be impossible)'
        : (w.p === O ? 'AI wins — press R to restart' : 'draw — perfect play, press R');
}

// ---------- rendering ----------
var dpr=1, cw=0, ch=0, BS=0, BX=0, BY=0, treeTop=0, hoverCell=-1;
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cw = window.innerWidth; ch = window.innerHeight;
  cv.width = Math.floor(cw*dpr); cv.height = Math.floor(ch*dpr);
  cv.style.width = cw+'px'; cv.style.height = ch+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  BS = Math.max(140, Math.min(ch*0.30, cw*0.24, 280));
  BX = cw/2 - BS/2; BY = 30;
  treeTop = BY + BS + 46;
}
window.addEventListener('resize', resize);

function drawBoard(time){
  var cs = BS/3;
  ctx.save();
  ctx.shadowColor = 'rgba(90,240,200,.7)';
  ctx.shadowBlur = 24 + 8*Math.sin(time*2);
  ctx.strokeStyle = 'rgba(90,240,200,.55)';
  ctx.lineWidth = 2;
  ctx.strokeRect(BX-4, BY-4, BS+8, BS+8);
  ctx.restore();

  ctx.strokeStyle = 'rgba(130,220,255,.28)';
  ctx.lineWidth = 1.5;
  for (var i=1;i<3;i++){
    ctx.beginPath(); ctx.moveTo(BX+i*cs, BY+6); ctx.lineTo(BX+i*cs, BY+BS-6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(BX+6, BY+i*cs); ctx.lineTo(BX+BS-6, BY+i*cs); ctx.stroke();
  }
  for (var k=0;k<9;k++){
    var x = BX + (k%3)*cs, y = BY + ((k/3)|0)*cs, p = cs*0.24;
    if (!board[k]){
      if (!gameOver && !thinking && k === hoverCell){
        ctx.fillStyle = 'rgba(110,255,235,.09)';
        ctx.fillRect(x+3,y+3,cs-6,cs-6);
      }
      continue;
    }
    ctx.save();
    ctx.lineWidth = Math.max(3, cs*0.075); ctx.lineCap = 'round';
    if (board[k] === X){
      ctx.strokeStyle = '#6ff'; ctx.shadowColor = '#6ff'; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(x+p, y+p); ctx.lineTo(x+cs-p, y+cs-p);
      ctx.moveTo(x+cs-p, y+p); ctx.lineTo(x+p, y+cs-p);
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#ff6fd0'; ctx.shadowColor = '#ff6fd0'; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(x+cs/2, y+cs/2, cs/2 - p, 0, 6.2832); ctx.stroke();
    }
    ctx.restore();
  }
  if (winLine){
    var a = winLine[0], b = winLine[2];
    ctx.save();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(BX+(a%3)*cs+cs/2, BY+((a/3)|0)*cs+cs/2);
    ctx.lineTo(BX+(b%3)*cs+cs/2, BY+((b/3)|0)*cs+cs/2);
    ctx.stroke(); ctx.restore();
  }
  ctx.fillStyle = 'rgba(220,245,240,.9)';
  ctx.font = '13px ui-monospace,monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(status, cw/2, BY + BS + 14);
}

function valColor(v){
  if (v === null) return 'rgba(140,165,190,.6)';
  if (v > 0) return '#5ff0c8';
  if (v < 0) return '#ff6fa8';
  return '#9fb6ff';
}

function drawTree(){
  if (!revealed.length) return;
  var h = ch - treeTop - 16;
  if (h < 60) return;
  var rowH = h / Math.max(1, maxDepthSeen + 1);
  var wpad = 34;

  // bucket revealed nodes by depth (cheap: <= MAX_VIS nodes)
  var perDepth = [];
  for (var i=0;i<revealed.length;i++){
    var n = nodes[revealed[i]];
    (perDepth[n.depth] = perDepth[n.depth] || []).push(n);
  }
  for (var d=0; d<perDepth.length; d++){
    var row = perDepth[d]; if (!row) continue;
    var cnt = row.length, span = cw - wpad*2;
    for (var j=0;j<cnt;j++){
      row[j].x = wpad + (cnt === 1 ? span/2 : (j/(cnt-1))*span);
      row[j].y = treeTop + d*rowH + rowH*0.5;
    }
  }

  ctx.lineWidth = 1;
  for (i=0;i<revealed.length;i++){
    var nd = nodes[revealed[i]];
    if (nd.parent < 0) continue;
    var p = nodes[nd.parent];
    ctx.strokeStyle = nd.pruned ? 'rgba(130,130,140,.18)' : 'rgba(120,200,230,.20)';
    ctx.beginPath();
    ctx.moveTo(p.x, p.y + 5);
    ctx.bezierCurveTo(p.x, (p.y+nd.y)/2, nd.x, (p.y+nd.y)/2, nd.x, nd.y - 5);
    ctx.stroke();
  }

  var r = Math.max(3.5, Math.min(10, rowH*0.20));
  for (i=0;i<revealed.length;i++){
    var q = nodes[revealed[i]];
    var isNew = (revealed.length - i) <= 8;
    if (q.pruned){
      ctx.save();
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = '#8b8b96'; ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(q.x-r, q.y-r); ctx.lineTo(q.x+r, q.y+r);
      ctx.moveTo(q.x+r, q.y-r); ctx.lineTo(q.x-r, q.y+r);
      ctx.stroke();
      if (isNew){
        ctx.globalAlpha = 0.95;
        ctx.shadowColor = '#fff'; ctx.shadowBlur = 18;
        ctx.strokeStyle = '#e8e8f0';
        ctx.beginPath(); ctx.arc(q.x, q.y, r*1.7, 0, 6.2832); ctx.stroke();
      }
      ctx.restore();
      continue;
    }
    var col = valColor(q.val);
    ctx.save();
    if (isNew){ ctx.shadowColor = col; ctx.shadowBlur = 16; }
    ctx.fillStyle = (q.val === null) ? 'rgba(38,54,70,.95)' : col;
    ctx.strokeStyle = col; ctx.lineWidth = 1.2;
    ctx.beginPath();
    if (q.maximizing){
      ctx.moveTo(q.x, q.y - r); ctx.lineTo(q.x + r, q.y + r*0.8); ctx.lineTo(q.x - r, q.y + r*0.8);
    } else {
      ctx.moveTo(q.x, q.y + r); ctx.lineTo(q.x + r, q.y - r*0.8); ctx.lineTo(q.x - r, q.y - r*0.8);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    if (q.leaf && q.val !== null && r > 4.5){
      ctx.fillStyle = 'rgba(255,255,255,.72)';
      ctx.font = Math.round(r*1.2)+'px ui-monospace,monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(q.val > 0 ? '+1' : (q.val < 0 ? '-1' : '0'), q.x, q.y + r + 1);
    }
  }

  ctx.fillStyle = 'rgba(150,190,210,.38)';
  ctx.font = '10px ui-monospace,monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (d=0; d<perDepth.length; d++){
    if (!perDepth[d]) continue;
    ctx.fillText('ply '+d+(d%2===0 ? '  MIN' : '  MAX'), 6, treeTop + d*rowH + rowH*0.5);
  }
}

function drawHUD(){
  var lw = 224, lh = 112, lx = cw - lw - 14, ly = 14;
  ctx.fillStyle = 'rgba(6,12,18,.74)';
  ctx.fillRect(lx, ly, lw, lh);
  ctx.strokeStyle = 'rgba(90,240,200,.22)'; ctx.lineWidth = 1;
  ctx.strokeRect(lx+.5, ly+.5, lw-1, lh-1);
  ctx.font = '11px ui-monospace,monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  var y = ly + 9;
  ctx.fillStyle = 'rgba(200,235,228,.9)';
  ctx.fillText('search tree legend', lx+10, y); y += 17;
  ctx.fillStyle = '#5ff0c8';
  ctx.beginPath(); ctx.moveTo(lx+16, y+1); ctx.lineTo(lx+22, y+10); ctx.lineTo(lx+10, y+10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(200,220,220,.78)';
  ctx.fillText('MAX ply (X to move)', lx+30, y); y += 17;
  ctx.fillStyle = '#ff6fa8';
  ctx.beginPath(); ctx.moveTo(lx+16, y+11); ctx.lineTo(lx+22, y+2); ctx.lineTo(lx+10, y+2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(200,220,220,.78)';
  ctx.fillText('MIN ply (AI to move)', lx+30, y); y += 17;
  ctx.strokeStyle = '#8b8b96'; ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(lx+11, y+2); ctx.lineTo(lx+21, y+11);
  ctx.moveTo(lx+21, y+2); ctx.lineTo(lx+11, y+11);
  ctx.stroke();
  ctx.fillStyle = 'rgba(200,220,220,.78)';
  ctx.fillText('pruned — never evaluated', lx+30, y); y += 19;
  ctx.fillStyle = 'rgba(160,200,195,.72)';
  ctx.fillText('green = good for X   pink = for O', lx+10, y);
}

function updateStats(){
  var prog = events.length ? Math.min(100, (evIdx/events.length)*100) : 0;
  var save = lastFullCmp ? (100*(1 - lastPruneCmp/lastFullCmp)) : 0;
  statsEl.innerHTML =
    'alpha-beta: <b>'+(pruningOn?'ON':'OFF')+'</b> &nbsp;(P toggles)<br>'+
    'nodes visited <b>'+(pruningOn?nodesPrune:nodesFull)+'</b><br>'+
    'pruned <b>'+prunedCount+'</b> nodes skipped<br>'+
    (lastFullCmp ? 'full '+lastFullCmp+' vs pruned '+lastPruneCmp+' &rarr; <b>'+save.toFixed(0)+'%</b> saved<br>' : '')+
    'tree shown: <b>'+nodes.length+'</b> nodes / ply &le;'+VIS_DEPTH+'<br>'+
    'reveal <b>'+prog.toFixed(0)+'%</b> &nbsp; '+
    (thinking ? 'state: <b>searching</b>' : (gameOver ? 'state: <b>game over</b>' : 'state: <b>your turn</b>'))+
    (paused?' <b>PAUSED</b>':'');
}

var frame = 0;
function loop(now){
  if (thinking && !paused){
    var target = Math.min(events.length, evIdx + evStep);
    while (evIdx < target){
      var ev = events[evIdx++];
      if (ev.type === 'open' || ev.type === 'prune') revealed.push(ev.n);
    }
    if (evIdx >= events.length) commitAI();
  }
  ctx.fillStyle = '#04060a';
  ctx.fillRect(0,0,cw,ch);
  drawTree();
  drawBoard(now*0.001);
  drawHUD();
  if ((frame++ % 4) === 0) updateStats();
  requestAnimationFrame(loop);
}

cv.addEventListener('mousemove', function(ev){
  var cs = BS/3;
  var x = Math.floor((ev.clientX - BX)/cs), y = Math.floor((ev.clientY - BY)/cs);
  hoverCell = (x>=0&&y>=0&&x<3&&y<3) ? y*3+x : -1;
});
cv.addEventListener('mousedown', function(ev){
  var cs = BS/3;
  var x = Math.floor((ev.clientX - BX)/cs), y = Math.floor((ev.clientY - BY)/cs);
  if (x>=0&&y>=0&&x<3&&y<3) playerMove(y*3+x);
});
window.addEventListener('keydown', function(ev){
  var k = ev.key.toLowerCase();
  if (k === 'r') restart();
  else if (k === 'p'){ pruningOn = !pruningOn; if (thinking) startThinking(); }
  else if (k === ' ' || ev.code === 'Space'){ paused = !paused; ev.preventDefault(); }
});

resize();
restart();
requestAnimationFrame(loop);
</script>
</body>
