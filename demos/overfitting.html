<meta charset="utf-8">
<title>Overfitting — Bias &amp; Variance, Felt</title>
<style>
  html,body{margin:0;height:100%;background:#06060c;overflow:hidden}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;top:14px;left:14px;z-index:10;background:rgba(8,8,18,.64);
      border:1px solid rgba(255,140,80,.28);border-radius:8px;padding:12px 14px;
      font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#ffd7a8;
      max-width:350px;backdrop-filter:blur(6px)}
  #ui h1{margin:0 0 6px;font-size:14px;letter-spacing:.14em;color:#ffae5c;text-transform:uppercase}
  #ui p{margin:0 0 8px;color:#b79a80}
  #ui .k{color:#7dffb0}
  #ui .row{color:#ffe9d2}
  #ui a{color:#7dffb0;text-decoration:none}
  #ui a:hover{text-decoration:underline}
</style>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Overfitting</h1>
  <p>Raise the polynomial degree and watch train error fall forever while test error turns back up.</p>
  <div class="row"><span class="k">← →</span> degree &nbsp; <span class="k">A</span> auto-sweep &nbsp; <span class="k">R</span> data &nbsp; <span class="k">N</span> noise</div>
  <div class="row" id="s1">degree d = 5</div>
  <div class="row" id="s2">train RMSE 0.000</div>
  <div class="row" id="s3">test&nbsp; RMSE 0.000</div>
  <div class="row" id="s4">noise σ 0.12 · sweep on</div>
  <div class="row" id="s5">verdict: —</div>
  <a href="index.html">← gallery</a>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);resize();

var MAXD=15;
var noise=0.13, nTrain=18, nTest=14;
var train=[], test=[], truth=null;

function gauss(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

function makeTruth(){
  var a=0.6+Math.random()*0.9, b=1.2+Math.random()*2.2, c=(Math.random()-0.5)*1.4,
      dd=0.4+Math.random()*0.8, ee=(Math.random()-0.5)*2;
  return function(x){ return a*Math.sin(b*x+c) + dd*Math.cos(x*1.7+ee) + 0.18*x; };
}
function sample(n){
  var out=[];
  for(var i=0;i<n;i++){
    var x=-3+6*(i+0.5+ (Math.random()-0.5)*0.7)/n;
    out.push({x:x, y:truth(x)+gauss()*noise, fy:0});
  }
  return out;
}
function newData(){
  truth=makeTruth();
  train=sample(nTrain);
  test=sample(nTest);
  fitAll();
}
function reNoise(){
  noise=[0.03,0.08,0.13,0.22,0.35][(noiseIdx=(noiseIdx+1)%5)];
  for(var i=0;i<train.length;i++)train[i].y=truth(train[i].x)+gauss()*noise;
  for(i=0;i<test.length;i++)test[i].y=truth(test[i].x)+gauss()*noise;
  fitAll();
}
var noiseIdx=2;

// ---- least squares polyfit via normal equations + gaussian elimination ----
function polyfit(data,d){
  var m=d+1, A=[], i,j,k;
  // scale x into [-1,1] for conditioning
  for(i=0;i<m;i++){A.push(new Float64Array(m+1));}
  var pw=new Float64Array(2*m);
  for(k=0;k<data.length;k++){
    var xs=data[k].x/3, y=data[k].y, p=1;
    for(i=0;i<2*m;i++){pw[i]=p;p*=xs;}
    for(i=0;i<m;i++){
      for(j=0;j<m;j++)A[i][j]+=pw[i+j];
      A[i][m]+=pw[i]*y;
    }
  }
  // tiny ridge for numerical stability at high degree
  for(i=0;i<m;i++)A[i][i]+=1e-9;
  // gaussian elimination with partial pivoting
  for(i=0;i<m;i++){
    var piv=i;
    for(k=i+1;k<m;k++) if(Math.abs(A[k][i])>Math.abs(A[piv][i])) piv=k;
    var t=A[i];A[i]=A[piv];A[piv]=t;
    if(Math.abs(A[i][i])<1e-14) A[i][i]=1e-14;
    for(k=i+1;k<m;k++){
      var f=A[k][i]/A[i][i];
      if(f===0)continue;
      for(j=i;j<=m;j++)A[k][j]-=f*A[i][j];
    }
  }
  var c=new Float64Array(m);
  for(i=m-1;i>=0;i--){
    var s=A[i][m];
    for(j=i+1;j<m;j++)s-=A[i][j]*c[j];
    c[i]=s/A[i][i];
  }
  return c;
}
function evalp(c,x){
  var xs=x/3, r=0;
  for(var i=c.length-1;i>=0;i--) r=r*xs+c[i];
  return r;
}
function rmse(c,data){
  var s=0;
  for(var i=0;i<data.length;i++){var e=evalp(c,data[i].x)-data[i].y;s+=e*e;}
  return Math.sqrt(s/data.length);
}

var coefsByD=[], trErr=[], teErr=[];
function fitAll(){
  coefsByD=[];trErr=[];teErr=[];
  for(var d=1;d<=MAXD;d++){
    var c=polyfit(train,d);
    coefsByD[d]=c;
    trErr[d]=rmse(c,train);
    teErr[d]=rmse(c,test);
  }
}

// ---- animated degree ----
var degree=5, shownD=5, sweep=true, sweepDir=1, sweepAcc=0;
var curC=null, tgtC=null, blend=1;
function setDegree(d){
  d=Math.max(1,Math.min(MAXD,d));
  if(d===degree)return;
  var old=sampleCurve(degree);
  degree=d;
  prevCurve=old; blend=0;
}
var prevCurve=null;
var CURVN=260;
function sampleCurve(d){
  var c=coefsByD[d]||polyfit(train,d), arr=new Float64Array(CURVN);
  for(var i=0;i<CURVN;i++){
    var x=-3.2+6.4*i/(CURVN-1);
    arr[i]=evalp(c,x);
  }
  return arr;
}

window.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){sweep=false;setDegree(degree+1);}
  else if(e.key==='ArrowLeft'){sweep=false;setDegree(degree-1);}
  else if(e.key==='a'||e.key==='A'){sweep=!sweep;}
  else if(e.key==='r'||e.key==='R'){newData();prevCurve=null;blend=1;}
  else if(e.key==='n'||e.key==='N'){reNoise();prevCurve=null;blend=1;}
});

var els={s1:document.getElementById('s1'),s2:document.getElementById('s2'),
  s3:document.getElementById('s3'),s4:document.getElementById('s4'),s5:document.getElementById('s5')};

newData();

// layout
function plotBox(){
  var gw=Math.min(380,W*0.30), pad=26, left=Math.min(200,W*0.20);
  return {px:pad+left, py:70, pw:Math.max(140,W-gw-pad*3-left-10), ph:Math.max(160,H-140),
          gx:W-gw-pad, gy:H-pad-Math.min(300,H*0.42), gw:gw, gh:Math.min(300,H*0.42)};
}
var YR=4.2;
function X2S(x,B){return B.px+(x+3.2)/6.4*B.pw;}
function Y2S(y,B){return B.py+B.ph/2 - y/YR*B.ph/2;}

var last=0, uiAcc=0;
function frame(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
  var B=plotBox();

  if(sweep){
    sweepAcc+=dt;
    if(sweepAcc>0.55){
      sweepAcc=0;
      var nd=degree+sweepDir;
      if(nd>MAXD){nd=MAXD-1;sweepDir=-1;}
      if(nd<1){nd=2;sweepDir=1;}
      var old=sampleCurve(degree);
      degree=nd;prevCurve=old;blend=0;
    }
  }
  blend=Math.min(1,blend+dt*2.6);
  var target=sampleCurve(degree);
  var curve=new Float64Array(CURVN);
  var e=blend<1?(blend*blend*(3-2*blend)):1;
  for(var i=0;i<CURVN;i++){
    var a=prevCurve?prevCurve[i]:target[i];
    curve[i]=a+(target[i]-a)*e;
  }

  ctx.fillStyle='#06060c';ctx.fillRect(0,0,W,H);

  // ---- main plot frame ----
  ctx.save();
  ctx.strokeStyle='rgba(120,140,190,.16)';ctx.lineWidth=1;
  ctx.strokeRect(B.px,B.py,B.pw,B.ph);
  ctx.setLineDash([3,6]);
  ctx.beginPath();ctx.moveTo(B.px,Y2S(0,B));ctx.lineTo(B.px+B.pw,Y2S(0,B));ctx.stroke();
  ctx.restore();

  // ---- true curve (ghost) ----
  ctx.save();
  ctx.strokeStyle='rgba(200,220,255,.20)';ctx.lineWidth=2.6;ctx.setLineDash([7,7]);
  ctx.beginPath();
  for(i=0;i<CURVN;i++){
    var x=-3.2+6.4*i/(CURVN-1);
    var sxp=X2S(x,B), syp=Y2S(truth(x),B);
    i?ctx.lineTo(sxp,syp):ctx.moveTo(sxp,syp);
  }
  ctx.stroke();ctx.restore();

  // ---- residual whiskers ----
  function whisk(arr,col){
    ctx.strokeStyle=col;ctx.lineWidth=1.2;
    for(var k=0;k<arr.length;k++){
      var p=arr[k], fy=evalp(coefsByD[degree],p.x);
      ctx.beginPath();
      ctx.moveTo(X2S(p.x,B),Y2S(p.y,B));
      ctx.lineTo(X2S(p.x,B),Y2S(Math.max(-YR,Math.min(YR,fy)),B));
      ctx.stroke();
    }
  }
  whisk(train,'rgba(125,255,176,.35)');
  whisk(test,'rgba(255,110,150,.35)');

  // ---- fitted polynomial (glowing) ----
  ctx.save();
  ctx.lineWidth=3;ctx.strokeStyle='#ffae5c';ctx.shadowColor='#ff8a2b';ctx.shadowBlur=18;
  ctx.beginPath();
  var pen=false;
  for(i=0;i<CURVN;i++){
    x=-3.2+6.4*i/(CURVN-1);
    var yv=curve[i];
    if(!isFinite(yv)||Math.abs(yv)>YR*1.6){pen=false;continue;}
    var X=X2S(x,B),Y=Y2S(yv,B);
    if(!pen){ctx.moveTo(X,Y);pen=true;}else ctx.lineTo(X,Y);
  }
  ctx.stroke();ctx.restore();

  // ---- points ----
  function dots(arr,col,r){
    for(var k=0;k<arr.length;k++){
      var p=arr[k];
      ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=9;
      ctx.beginPath();ctx.arc(X2S(p.x,B),Y2S(p.y,B),r,0,6.2832);ctx.fill();
    }
    ctx.shadowBlur=0;
  }
  dots(train,'#7dffb0',4.2);
  dots(test,'#ff6e96',4.2);

  // legend
  ctx.save();ctx.font='12px ui-monospace,monospace';
  ctx.fillStyle='#7dffb0';ctx.fillText('● train',B.px+8,B.py+18);
  ctx.fillStyle='#ff6e96';ctx.fillText('● test (held out)',B.px+8,B.py+34);
  ctx.fillStyle='rgba(200,220,255,.45)';ctx.fillText('-- hidden true curve',B.px+8,B.py+50);
  ctx.fillStyle='#ffae5c';ctx.font='bold 30px ui-monospace,monospace';
  ctx.shadowColor='#ff8a2b';ctx.shadowBlur=14;
  ctx.fillText('d = '+degree,B.px+B.pw-140,B.py+40);
  ctx.restore();

  // ---- error curves side graph ----
  var gx=B.gx,gy=B.gy,gw=B.gw,gh=B.gh;
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,.025)';ctx.fillRect(gx,gy,gw,gh);
  ctx.strokeStyle='rgba(120,140,190,.22)';ctx.lineWidth=1;ctx.strokeRect(gx,gy,gw,gh);
  var mx=0;
  for(var d=1;d<=MAXD;d++){mx=Math.max(mx,trErr[d],Math.min(teErr[d],noise*9+1.4));}
  mx=Math.max(mx,0.2)*1.12;
  function GX(d){return gx+ (d-1)/(MAXD-1)*gw;}
  function GY(v){return gy+gh - Math.min(1,v/mx)*gh;}
  function line(arr,col){
    ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.shadowColor=col;ctx.shadowBlur=10;
    ctx.beginPath();
    for(var d=1;d<=MAXD;d++){
      var Y=GY(arr[d]);
      d===1?ctx.moveTo(GX(d),Y):ctx.lineTo(GX(d),Y);
    }
    ctx.stroke();ctx.shadowBlur=0;
    for(d=1;d<=MAXD;d++){ctx.fillStyle=col;ctx.beginPath();ctx.arc(GX(d),GY(arr[d]),2.2,0,6.2832);ctx.fill();}
  }
  line(trErr,'#7dffb0');
  line(teErr,'#ff6e96');
  // best degree marker
  var best=1;for(d=2;d<=MAXD;d++) if(teErr[d]<teErr[best]) best=d;
  ctx.strokeStyle='rgba(255,255,255,.30)';ctx.setLineDash([3,4]);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(GX(best),gy);ctx.lineTo(GX(best),gy+gh);ctx.stroke();
  ctx.setLineDash([]);
  // current degree marker
  ctx.strokeStyle='#ffae5c';ctx.lineWidth=2;ctx.shadowColor='#ff8a2b';ctx.shadowBlur=12;
  ctx.beginPath();ctx.moveTo(GX(degree),gy);ctx.lineTo(GX(degree),gy+gh);ctx.stroke();
  ctx.shadowBlur=0;
  ctx.font='11px ui-monospace,monospace';
  ctx.fillStyle='rgba(220,230,255,.7)';
  ctx.fillText('error vs degree',gx+6,gy-8);
  ctx.fillText('1',gx+2,gy+gh+14);ctx.fillText(''+MAXD,gx+gw-14,gy+gh+14);
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.fillText('sweet spot d='+best,GX(best)-30,gy+gh+28);
  ctx.fillStyle='#7dffb0';ctx.fillText('train',gx+gw-52,gy+16);
  ctx.fillStyle='#ff6e96';ctx.fillText('test',gx+gw-52,gy+30);
  ctx.restore();

  uiAcc+=dt;
  if(uiAcc>0.1){
    uiAcc=0;
    var tr=trErr[degree],te=teErr[degree];
    els.s1.textContent='degree d = '+degree+'  ('+(degree+1)+' coefficients, '+nTrain+' train pts)';
    els.s2.textContent='train RMSE '+tr.toFixed(4);
    els.s3.textContent='test  RMSE '+te.toFixed(4)+'   ratio ×'+(te/Math.max(tr,1e-6)).toFixed(1);
    els.s4.textContent='noise σ '+noise.toFixed(2)+' · sweep '+(sweep?'ON':'off')+' · best d='+best;
    var verdict = degree<best-1 ? 'UNDERFIT — high bias' :
                  (degree>best+1 ? 'OVERFIT — high variance' : 'GOOD FIT — balanced');
    els.s5.textContent='verdict: '+verdict;
    els.s5.style.color = degree<best-1?'#8fb4ff':(degree>best+1?'#ff6e96':'#7dffb0');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
