<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neon plasma</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000}
  canvas{position:fixed;top:0;left:0;display:block;touch-action:none}
  #ui{position:fixed;top:10px;left:12px;z-index:10;font:11px/1.7 ui-monospace,Menlo,Consolas,monospace;
      color:rgba(200,170,255,.8);pointer-events:none;text-shadow:0 1px 4px #000,0 0 12px rgba(80,0,120,.7);user-select:none}
  #ui .t{font-size:13px;font-weight:bold;color:#e07aff;letter-spacing:.12em}
  #ui a{color:rgba(120,230,255,.9);pointer-events:auto;text-decoration:none}
  #ui a:hover{color:#7df9ff;text-shadow:0 0 8px #7df9ff}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div id="ui">
  <div class="t">FBM PLASMA</div>
  <div>move mouse to warp &middot; click cycles palette [<span id="pal">spectrum</span>]</div>
  <div><a href="index.html">&larr; gallery</a></div>
</div>
<script>
'use strict';
var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if(!gl) throw new Error('WebGL unavailable');

var VS = [
  'attribute vec2 aPos;',
  'void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }'
].join('\n');

var FS = [
'precision highp float;',
'uniform vec2 uRes;',
'uniform float uTime;',
'uniform vec2 uMouse;',
'uniform vec3 uA;',
'uniform vec3 uB;',
'uniform vec3 uC;',
'uniform vec3 uD;',
'',
'float hash(vec2 p){',
'  p = fract(p*vec2(123.34, 456.21));',
'  p += dot(p, p + 45.32);',
'  return fract(p.x*p.y);',
'}',
'float noise(vec2 p){',
'  vec2 i = floor(p);',
'  vec2 f = fract(p);',
'  vec2 u = f*f*(3.0 - 2.0*f);',
'  float a = hash(i);',
'  float b = hash(i + vec2(1.0, 0.0));',
'  float c = hash(i + vec2(0.0, 1.0));',
'  float d = hash(i + vec2(1.0, 1.0));',
'  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);',
'}',
'float fbm(vec2 p){',
'  float v = 0.0;',
'  float a = 0.5;',
'  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);',
'  for(int i = 0; i < 5; i++){',
'    v += a*noise(p);',
'    p = m*p + vec2(3.1, 7.7);',
'    a *= 0.5;',
'  }',
'  return v;',
'}',
'vec3 pal(float t){',
'  return uA + uB*cos(6.28318*(uC*t + uD));',
'}',
'void main(){',
'  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;',
'  float tt = uTime*0.12;',
'  vec2 dm = uv - uMouse;',
'  float md = dot(dm, dm);',
'  vec2 push = dm*(0.55/(md*3.5 + 0.18));',
'  vec2 swirl = vec2(-dm.y, dm.x)*(0.45/(md*4.5 + 0.14));',
'  vec2 p = uv*2.4;',
'  vec2 q = vec2(fbm(p + vec2(0.0, tt)), fbm(p + vec2(5.2, 1.3) - 0.6*tt));',
'  vec2 r = vec2(fbm(p + 2.2*q + swirl + vec2(1.7, 9.2) + 0.4*tt),',
'                fbm(p + 2.2*q + 0.7*push + vec2(8.3, 2.8) - 0.3*tt));',
'  float f = fbm(p + 2.5*r);',
'  float v = f + 0.4*q.x;',
'  vec3 col = pal(v*1.4 + 0.25*tt);',
'  col *= 0.45 + 1.15*f;',
'  col += pal(v*1.4 + 0.25*tt + 0.45)*pow(max(f, 0.0), 3.0)*0.5;',
'  col *= 1.0 - 0.45*smoothstep(0.45, 1.5, length(uv));',
'  col = pow(max(col, 0.0), vec3(0.8));',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

function compile(type, src){
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}
function link(vsSrc, fsSrc){
  var p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  return p;
}

var prog = link(VS, FS);
gl.useProgram(prog);
var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
var aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

var U = {};
['uRes','uTime','uMouse','uA','uB','uC','uD'].forEach(function(n){ U[n] = gl.getUniformLocation(prog, n); });

var PALETTES = [
  {name:'spectrum', a:[0.50,0.50,0.50], b:[0.50,0.50,0.50], c:[1.0,1.0,1.0], d:[0.00,0.33,0.67]},
  {name:'ice',      a:[0.50,0.50,0.50], b:[0.50,0.50,0.50], c:[1.0,1.0,1.0], d:[0.00,0.10,0.20]},
  {name:'ember',    a:[0.50,0.50,0.50], b:[0.50,0.50,0.50], c:[2.0,1.0,0.0], d:[0.50,0.20,0.25]},
  {name:'acid',     a:[0.50,0.50,0.50], b:[0.50,0.50,0.50], c:[1.0,1.0,0.5], d:[0.80,0.90,0.30]},
  {name:'orchid',   a:[0.55,0.35,0.60], b:[0.45,0.40,0.50], c:[1.0,1.0,1.0], d:[0.00,0.15,0.40]}
];
var palIndex = 0;
var palEl = document.getElementById('pal');
function applyPalette(){
  var pp = PALETTES[palIndex];
  gl.uniform3fv(U.uA, pp.a);
  gl.uniform3fv(U.uB, pp.b);
  gl.uniform3fv(U.uC, pp.c);
  gl.uniform3fv(U.uD, pp.d);
  palEl.textContent = pp.name;
}
applyPalette();

var dpr = 1;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.floor(innerWidth*dpr));
  canvas.height = Math.max(1, Math.floor(innerHeight*dpr));
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

var tx = 0.0, ty = 0.0, mx = 0.0, my = 0.0;
function setTarget(cx, cy){
  tx = (cx*dpr - canvas.width*0.5)/canvas.height;
  ty = (canvas.height*0.5 - cy*dpr)/canvas.height;
}
var downX = 0, downY = 0;
canvas.addEventListener('pointermove', function(e){ setTarget(e.clientX, e.clientY); });
canvas.addEventListener('pointerdown', function(e){
  downX = e.clientX; downY = e.clientY;
  setTarget(e.clientX, e.clientY);
});
canvas.addEventListener('pointerup', function(e){
  var moved = Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY);
  if(moved < 8){
    palIndex = (palIndex + 1) % PALETTES.length;
    applyPalette();
  }
});

function frame(now){
  mx += (tx - mx)*0.07;
  my += (ty - my)*0.07;
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, now*0.001);
  gl.uniform2f(U.uMouse, mx, my);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
