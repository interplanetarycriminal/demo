<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phyllotaxis — golden-angle bloom</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#04040c}
#c{touch-action:none;display:block;position:fixed;inset:0}
#hud{position:fixed;top:10px;left:12px;z-index:10;font:11px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#ffd9a0;background:rgba(10,6,4,.5);border:1px solid rgba(255,200,120,.22);border-radius:8px;padding:7px 10px;max-height:52vh;overflow:auto}
#hud b{color:#fff;letter-spacing:1px}
#hud a{color:#8fe3ff;text-decoration:none}
#hud a:hover{text-decoration:underline}
#vals{color:#a0ffd0}
@media (max-width:640px){#hud{font-size:11px;max-height:40vh}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div id="hud"><b>PHYLLOTAXIS</b> — golden-angle bloom<br>
mouse Y: divergence angle · click: new palette · <a href="index.html">&larr; gallery</a><br>
<span id="vals"></span></div>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var vals=document.getElementById('vals');
var W=0,H=0,DPR=1;
var N=0,maxN=2000,c=6,rot=0,fade=1,state='grow';
var baseHue=0,hueStep=0.25,my=0.5;
var angCur=137.5,angTarget=137.5;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var maxR=Math.min(W,H)*0.52;
  c=Math.max(3,maxR/Math.sqrt(maxN));
}
function newPalette(){
  baseHue=Math.random()*360;
  hueStep=0.12+Math.random()*0.4;
}
function reset(){
  N=0;fade=1;state='grow';newPalette();
}
var last=0;
function frame(ts){
  requestAnimationFrame(frame);
  var t=ts*0.001;
  var f=Math.min(3,(ts-last)/16.7)||1;last=ts;
  angTarget=137.5+(my-0.5)*1.1;
  angCur+=(angTarget-angCur)*0.07*f;
  rot+=0.0011*f;
  if(state==='grow'){
    N=Math.min(maxN,N+Math.round(7*f));
    if(N>=maxN)state='fade';
  }else{
    fade-=0.016*f;
    if(fade<=0)reset();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#04040c';
  ctx.fillRect(0,0,W,H);
  var cx=W/2,cy=H/2;
  var aRad=angCur*Math.PI/180;
  ctx.globalCompositeOperation='lighter';
  for(var i=0;i<N;i++){
    var a=i*aRad+rot;
    var rr=c*Math.sqrt(i);
    var x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;
    var age=N-i;
    var s=c*0.42*(0.78+0.22*Math.sin(t*2.1+i*0.13));
    var al=0.75;
    if(age<50){var kk=(50-age)/50;s*=1+kk*1.1;al=Math.min(1,al+kk*0.5);}
    var hue=(baseHue+i*hueStep+(a%6.283)*8)%360;
    var li=age<50?68:58;
    ctx.fillStyle='hsla('+hue.toFixed(1)+',90%,'+li+'%,'+(al*fade).toFixed(3)+')';
    ctx.beginPath();ctx.arc(x,y,Math.max(0.4,s),0,6.283);ctx.fill();
    if(age<12){
      ctx.fillStyle='rgba(255,255,255,'+(0.7*fade*(12-age)/12).toFixed(3)+')';
      ctx.beginPath();ctx.arc(x,y,s*0.4,0,6.283);ctx.fill();
    }
  }
  ctx.globalCompositeOperation='source-over';
  vals.textContent='angle='+angCur.toFixed(3)+'°  n='+N+'/'+maxN+(state==='fade'?'  restarting…':'');
}
addEventListener('pointermove',function(e){my=e.clientY/H});
addEventListener('pointerdown',function(){reset()});
addEventListener('resize',resize);
resize();
newPalette();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
