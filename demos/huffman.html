<title>Huffman Coding — Build, Tree, Encode</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#06040c;overflow:hidden;height:100%}
  canvas{display:block;touch-action:none}
  #ui{position:fixed;top:12px;left:12px;z-index:10;background:rgba(10,6,20,.66);
      border:1px solid rgba(200,130,255,.3);border-radius:8px;padding:10px 12px;
      font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#e6d4ff;
      max-width:360px;backdrop-filter:blur(6px);text-shadow:0 0 8px rgba(190,120,255,.25);max-height:52vh;overflow:auto}
  #ui h1{margin:0 0 4px;font-size:13px;letter-spacing:.14em;color:#d79bff;text-transform:uppercase}
  #ui p{margin:0 0 7px;color:#a893bd}
  #ui .k{color:#ffd479}
  #ui .row{color:#c9b3e8}
  #ui b{color:#fff}
  #ui a{color:#7df9ff;text-decoration:none}
  #ui a:hover{text-decoration:underline}
  #inp{width:100%;box-sizing:border-box;margin:2px 0 7px;background:rgba(255,255,255,.06);
       border:1px solid rgba(200,130,255,.35);border-radius:5px;color:#fff;
       font:12px ui-monospace,monospace;padding:5px 7px;outline:none}
  #inp:focus{border-color:#d79bff;box-shadow:0 0 12px rgba(215,155,255,.35)}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Huffman Coding</h1>
  <p>Merge the two rarest symbols over and over, and the tree that falls out gives frequent letters short bit-codes and rare ones long codes.</p>
  <input id="inp" value="HELLO WORLD" maxlength="34" spellcheck="false">
  <div class="row">[<span class="k">type</span>] new phrase &nbsp; [<span class="k">R</span>] random &nbsp; [<span class="k">SPACE</span>] pause</div>
  <div class="row">phase <b id="sPhase">frequencies</b> &nbsp; symbols <b id="sSym">0</b></div>
  <div class="row">huffman <b id="sBits">0</b>b &nbsp; ascii <b id="sAscii">0</b>b &nbsp; saved <b id="sSave">0%</b></div>
  <div class="row" style="margin-top:6px"><a href="index.html">← gallery</a></div>
</div>
<script>
(function(){
"use strict";
var c=document.getElementById('c'),g=c.getContext('2d'),inp=document.getElementById('inp');
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';
  g.setTransform(DPR,0,0,DPR,0,0);
  if(root) layoutTree();
}
window.addEventListener('resize',resize);resize();

var PHRASES=['HELLO WORLD','ABRACADABRA','MISSISSIPPI RIVER','TO BE OR NOT TO BE','BANANA BANDANA','ENTROPY IS INFORMATION','SHANNON AND HUFFMAN','GREEDY ALGORITHMS WIN'];

var phrase='HELLO WORLD';
var freqs=[],nodes=[],pool=[],root=null,codes={};
var phase='freq',phaseT=0,paused=false;
var bits='',encIdx=0,litPath=[],litBit='';
var mergeA=null,mergeB=null,mergeNew=null;
var t=0,totalBits=0;

function Node(sym,f){
  this.sym=sym;this.f=f;this.l=null;this.r=null;
  this.x=W/2;this.y=H/2;this.tx=W/2;this.ty=H/2;this.glow=0;this.alive=1;this.depth=0;
}
function ease(a,b,k){return a+(b-a)*k;}
function symColor(s){
  if(s===null) return 'hsl(280,90%,70%)';
  var h=(s.charCodeAt(0)*37)%360;
  return 'hsl('+h+',92%,64%)';
}
function label(s){return s===' '?'␣':s;}

function build(p){
  phrase=(p||'HELLO WORLD').toUpperCase().slice(0,34)||'A';
  var map={};
  for(var i=0;i<phrase.length;i++){var ch=phrase[i];map[ch]=(map[ch]||0)+1;}
  freqs=[];
  for(var k in map) freqs.push({s:k,f:map[k]});
  freqs.sort(function(a,b){return b.f-a.f||(a.s<b.s?-1:1);});
  pool=[];
  for(var j=0;j<freqs.length;j++){
    var n=new Node(freqs[j].s,freqs[j].f);
    n.x=W/2+(Math.random()-.5)*W*0.3;n.y=H+60;
    pool.push(n);
  }
  if(pool.length===1){ var only=pool[0]; var r=new Node(null,only.f); r.l=only; pool=[r]; }
  nodes=pool.slice();
  root=null;codes={};bits='';encIdx=0;litPath=[];totalBits=0;
  mergeA=mergeB=mergeNew=null;
  phase='freq';phaseT=0;
  layoutBars();
}

// ---------- layouts ---------------------------------------------------------
var barY,barX0,barW;
function layoutBars(){
  var n=Math.max(1,pool.length);
  barW=Math.max(26,Math.min(60,(W-360)/Math.max(n,6)));
  barX0=(W-barW*n)/2+barW/2;
  barY=H*0.78;
  for(var i=0;i<pool.length;i++){
    pool[i].tx=barX0+i*barW;pool[i].ty=barY;
  }
}
function assignDepth(n,d){ if(!n)return 0; n.depth=d; var a=assignDepth(n.l,d+1),b=assignDepth(n.r,d+1); return Math.max(d,a,b); }
var leafOrder=[];
function collectLeaves(n){ if(!n)return; if(!n.l&&!n.r){leafOrder.push(n);return;} collectLeaves(n.l);collectLeaves(n.r); }
function layoutTree(){
  if(!root)return;
  var maxD=assignDepth(root,0);
  leafOrder=[];collectLeaves(root);
  var top=H*0.20,bot=H*0.70;
  var span=Math.min(W-160,Math.max(420,leafOrder.length*110));
  var x0=(W-span)/2;
  for(var i=0;i<leafOrder.length;i++){
    leafOrder[i].tx=x0+span*(i+0.5)/leafOrder.length;
  }
  function place(n){
    if(!n)return 0;
    n.ty=top+(maxD>0?(bot-top)*n.depth/maxD:0);
    if(!n.l&&!n.r) return n.tx;
    var s=0,cnt=0;
    if(n.l){s+=place(n.l);cnt++;}
    if(n.r){s+=place(n.r);cnt++;}
    n.tx=s/Math.max(1,cnt);
    return n.tx;
  }
  place(root);
}
function makeCodes(n,pre){
  if(!n)return;
  if(!n.l&&!n.r){ codes[n.sym]=pre||'0'; return; }
  makeCodes(n.l,pre+'0');makeCodes(n.r,pre+'1');
}
function pathTo(sym){
  var out=[],code='';
  function go(n,pre){
    if(!n)return false;
    if(!n.l&&!n.r){ if(n.sym===sym){out.push(n);code=pre||'0';return true;} return false; }
    out.push(n);
    if(go(n.l,pre+'0'))return true;
    if(go(n.r,pre+'1'))return true;
    out.pop();return false;
  }
  go(root,'');
  return {nodes:out,code:code};
}

// ---------- state machine ---------------------------------------------------
function step(){
  phaseT++;
  if(phase==='freq'){
    if(phaseT>90){ phase='merge';phaseT=0; }
  }
  else if(phase==='merge'){
    if(mergeNew){
      if(phaseT>34){
        // finalize merge
        var idx=pool.indexOf(mergeA); if(idx>=0)pool.splice(idx,1);
        idx=pool.indexOf(mergeB); if(idx>=0)pool.splice(idx,1);
        pool.push(mergeNew);
        pool.sort(function(a,b){return a.f-b.f;});
        mergeA=mergeB=null;mergeNew=null;
        phaseT=0;
        if(pool.length===1){
          root=pool[0];makeCodes(root,'');
          layoutTree();
          phase='tree';phaseT=0;
        } else layoutBars();
      }
    } else if(phaseT>16){
      if(pool.length<=1){ root=pool[0];makeCodes(root,'');layoutTree();phase='tree';phaseT=0;return; }
      pool.sort(function(a,b){return a.f-b.f;});
      mergeA=pool[0];mergeB=pool[1];
      mergeA.glow=1.6;mergeB.glow=1.6;
      mergeNew=new Node(null,mergeA.f+mergeB.f);
      mergeNew.l=mergeA;mergeNew.r=mergeB;
      mergeNew.x=(mergeA.x+mergeB.x)/2;mergeNew.y=(mergeA.y+mergeB.y)/2-46;
      mergeNew.glow=2;
      nodes.push(mergeNew);
      var mx=(mergeA.tx+mergeB.tx)/2;
      mergeA.tx=mx-30;mergeB.tx=mx+30;
      mergeA.ty=barY-70;mergeB.ty=barY-70;
      mergeNew.tx=mx;mergeNew.ty=barY-118;
      phaseT=0;
    }
  }
  else if(phase==='tree'){
    if(phaseT>70){ phase='encode';phaseT=0;encIdx=0;bits='';totalBits=0; }
  }
  else if(phase==='encode'){
    if(phaseT%13===0){
      if(encIdx<phrase.length){
        var ch=phrase[encIdx];
        var pr=pathTo(ch);
        litPath=pr.nodes;litBit=pr.code;
        for(var i=0;i<litPath.length;i++) litPath[i].glow=1.5;
        bits+=pr.code;totalBits=bits.length;
        encIdx++;
      } else { phase='done';phaseT=0; }
    }
  }
  else if(phase==='done'){
    if(phaseT>200){ build(inp.value); }
  }

  // physics
  for(var n=0;n<nodes.length;n++){
    var nd=nodes[n];
    nd.x=ease(nd.x,nd.tx,0.15);
    nd.y=ease(nd.y,nd.ty,0.15);
    nd.glow*=0.94;
  }
}

// ---------- drawing ---------------------------------------------------------
function drawEdges(n){
  if(!n)return;
  var kids=[[n.l,'0'],[n.r,'1']];
  for(var i=0;i<2;i++){
    var ch=kids[i][0];
    if(!ch)continue;
    var hot=Math.min(n.glow,1)*Math.min(ch.glow,1);
    var lit=(litPath.indexOf(n)>=0&&litPath.indexOf(ch)>=0)||(litPath.indexOf(n)>=0&&!ch.l&&!ch.r&&litPath.indexOf(ch)>=0);
    var a=lit?0.95:(0.16+hot*0.6);
    g.strokeStyle='rgba(215,155,255,'+a+')';
    g.lineWidth=lit?2.6:1.4;
    g.shadowBlur=lit?16:0;g.shadowColor='#d79bff';
    g.beginPath();g.moveTo(n.x,n.y);g.lineTo(ch.x,ch.y);g.stroke();
    g.shadowBlur=0;
    var mx=(n.x+ch.x)/2,my=(n.y+ch.y)/2;
    g.fillStyle=lit?'#fff':'rgba(200,170,240,.55)';
    g.font='bold 11px ui-monospace,monospace';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(kids[i][1],mx+(i?9:-9),my);
    drawEdges(ch);
  }
}
function drawNode(n){
  var leaf=!n.l&&!n.r;
  var r=leaf?18:13;
  var col=leaf?symColor(n.sym):'hsl(285,80%,66%)';
  var lit=litPath.indexOf(n)>=0;
  g.save();
  g.shadowBlur=12+n.glow*26+(lit?24:0);g.shadowColor=col;
  g.beginPath();g.arc(n.x,n.y,r,0,6.2832);
  var grd=g.createRadialGradient(n.x-r*.3,n.y-r*.35,r*.1,n.x,n.y,r);
  grd.addColorStop(0,'rgba(255,255,255,'+(lit?0.85:0.32+n.glow*0.4)+')');
  grd.addColorStop(1,col);
  g.fillStyle=grd;g.fill();
  g.shadowBlur=0;
  g.strokeStyle=lit?'#fff':'rgba(255,255,255,.35)';g.lineWidth=lit?2.4:1.1;g.stroke();
  g.fillStyle='#0a0614';g.font='bold '+(leaf?14:10)+'px ui-monospace,monospace';
  g.textAlign='center';g.textBaseline='middle';
  g.fillText(leaf?label(n.sym):String(n.f),n.x,n.y+1);
  if(leaf){
    g.fillStyle='rgba(230,212,255,.75)';g.font='10px ui-monospace,monospace';
    g.fillText(String(n.f),n.x,n.y+r+11);
    if(codes[n.sym]){
      g.fillStyle='rgba(125,249,255,.85)';g.font='10px ui-monospace,monospace';
      g.fillText(codes[n.sym],n.x,n.y+r+23);
    }
  }
  g.restore();
}

function frame(){
  t++;
  if(!paused) step();

  g.fillStyle='#06040c';g.fillRect(0,0,W,H);
  var vg=g.createRadialGradient(W/2,H*0.4,20,W/2,H*0.5,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(90,30,140,.22)');vg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=vg;g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(180,110,255,.05)';g.lineWidth=1;
  for(var x=0;x<W;x+=46){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}
  for(var y=0;y<H;y+=46){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}

  g.textAlign='center';g.textBaseline='middle';

  if(phase==='freq'||phase==='merge'){
    // frequency bars under each pool node
    var maxF=1;
    for(var i=0;i<pool.length;i++) maxF=Math.max(maxF,pool[i].f);
    for(var j=0;j<pool.length;j++){
      var n=pool[j];
      if(n===mergeA||n===mergeB)continue;
      var hgt=14+(n.f/maxF)*150;
      var col=symColor(n.sym);
      g.fillStyle=col;g.globalAlpha=0.32;
      g.shadowBlur=14;g.shadowColor=col;
      g.fillRect(n.x-Math.min(22,barW/2-4),n.y,Math.min(44,barW-8),-hgt);
      g.globalAlpha=1;g.shadowBlur=0;
      g.strokeStyle=col;g.lineWidth=1.2;
      g.strokeRect(n.x-Math.min(22,barW/2-4),n.y-hgt,Math.min(44,barW-8),hgt);
    }
    g.fillStyle='rgba(200,170,240,.6)';g.font='11px ui-monospace,monospace';
    g.fillText(phase==='freq'?'letter frequencies — sorted by count':'greedy merge: take the two smallest, join them',W/2,barY+44);
  }

  // draw tree edges/nodes
  if(root) drawEdges(root);
  else if(mergeNew){
    // partial subtree edges for every constructed internal node
    for(var k=0;k<nodes.length;k++){
      var nn=nodes[k];
      if(nn.l){g.strokeStyle='rgba(215,155,255,.35)';g.lineWidth=1.4;g.beginPath();g.moveTo(nn.x,nn.y);g.lineTo(nn.l.x,nn.l.y);g.stroke();}
      if(nn.r){g.strokeStyle='rgba(215,155,255,.35)';g.lineWidth=1.4;g.beginPath();g.moveTo(nn.x,nn.y);g.lineTo(nn.r.x,nn.r.y);g.stroke();}
    }
  } else {
    for(var k2=0;k2<nodes.length;k2++){
      var n2=nodes[k2];
      if(n2.l){g.strokeStyle='rgba(215,155,255,.28)';g.lineWidth=1.3;g.beginPath();g.moveTo(n2.x,n2.y);g.lineTo(n2.l.x,n2.l.y);g.stroke();}
      if(n2.r){g.strokeStyle='rgba(215,155,255,.28)';g.lineWidth=1.3;g.beginPath();g.moveTo(n2.x,n2.y);g.lineTo(n2.r.x,n2.r.y);g.stroke();}
    }
  }
  for(var m=0;m<nodes.length;m++) drawNode(nodes[m]);

  // phrase strip with cursor
  var py=H-96;
  g.font='bold 16px ui-monospace,monospace';
  var pw=phrase.length*15;
  var px0=(W-pw)/2+7.5;
  for(var p=0;p<phrase.length;p++){
    var on=p<encIdx, cur=(p===encIdx-1&&phase==='encode');
    g.fillStyle=cur?'#fff':(on?'rgba(125,249,255,.85)':'rgba(180,160,210,.35)');
    if(cur){g.shadowBlur=18;g.shadowColor='#7df9ff';}
    g.fillText(label(phrase[p]),px0+p*15,py);
    g.shadowBlur=0;
  }

  // bit ribbon
  var ry=H-58;
  g.font='12px ui-monospace,monospace';
  g.textAlign='left';
  g.fillStyle='rgba(200,170,240,.6)';
  g.fillText('bit stream',24,ry);
  var maxShow=Math.floor((W-90)/9);
  var show=bits.length>maxShow?bits.slice(bits.length-maxShow):bits;
  var bx=24, byy=ry+20;
  g.font='bold 12px ui-monospace,monospace';
  for(var b=0;b<show.length;b++){
    var age=show.length-b;
    var al=age<8?1:0.55;
    var one=show[b]==='1';
    g.fillStyle=one?'rgba(125,249,255,'+al+')':'rgba(255,124,229,'+al+')';
    if(age<4){g.shadowBlur=14;g.shadowColor=one?'#7df9ff':'#ff7ce5';}
    g.fillText(show[b],bx+b*9,byy);
    g.shadowBlur=0;
  }

  // savings meter
  var ascii=phrase.length*8;
  var saved=ascii>0?Math.max(0,(1-bits.length/ascii)*100):0;
  var mw=Math.min(300,W*0.28),mx=W-mw-28,my=H-92;
  g.textAlign='left';g.font='11px ui-monospace,monospace';
  g.fillStyle='rgba(200,170,240,.7)';
  g.fillText('ASCII '+ascii+' bits',mx,my-6);
  g.fillStyle='rgba(255,255,255,.12)';g.fillRect(mx,my,mw,12);
  g.fillStyle='rgba(255,124,229,.75)';g.fillRect(mx,my,mw,12);
  g.fillStyle='rgba(125,249,255,.9)';
  g.shadowBlur=14;g.shadowColor='#7df9ff';
  g.fillRect(mx,my+18,mw*Math.min(1,bits.length/Math.max(1,ascii)),12);
  g.shadowBlur=0;
  g.fillStyle='rgba(200,170,240,.7)';
  g.fillText('Huffman '+bits.length+' bits   ·   '+saved.toFixed(1)+'% saved',mx,my+44);

  if(phase==='encode'&&litBit){
    g.textAlign='center';g.font='bold 14px ui-monospace,monospace';
    g.fillStyle='rgba(125,249,255,.9)';
    g.shadowBlur=16;g.shadowColor='#7df9ff';
    g.fillText('root → leaf  =  '+litBit,W/2,H*0.14);
    g.shadowBlur=0;
  }
  if(phase==='done'){
    g.textAlign='center';g.font='bold 15px ui-monospace,monospace';
    g.fillStyle='rgba(138,255,193,.9)';
    g.shadowBlur=18;g.shadowColor='#8affc1';
    g.fillText('encoded — '+bits.length+' bits vs '+ascii+' ASCII bits',W/2,H*0.14);
    g.shadowBlur=0;
  }

  document.getElementById('sPhase').textContent=
    phase==='freq'?'frequencies':phase==='merge'?'building tree':phase==='tree'?'code tree':phase==='encode'?'encoding':'done';
  document.getElementById('sSym').textContent=freqs.length;
  document.getElementById('sBits').textContent=bits.length;
  document.getElementById('sAscii').textContent=ascii;
  document.getElementById('sSave').textContent=saved.toFixed(1)+'%';

  requestAnimationFrame(frame);
}

var typeTimer=null;
inp.addEventListener('input',function(){
  if(typeTimer)clearTimeout(typeTimer);
  typeTimer=setTimeout(function(){build(inp.value);},450);
});
window.addEventListener('keydown',function(e){
  if(document.activeElement===inp){
    if(e.key==='Enter'){inp.blur();build(inp.value);}
    return;
  }
  var k=e.key.toLowerCase();
  if(k==='r'){ var p=PHRASES[Math.floor(Math.random()*PHRASES.length)];inp.value=p;build(p); }
  else if(e.code==='Space'){paused=!paused;e.preventDefault();}
});

build(phrase);
requestAnimationFrame(frame);
})();
</script>
