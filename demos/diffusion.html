<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diffusion — noise ⇄ data</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#04060c}
canvas{display:block}
#ui{position:fixed;top:12px;left:12px;z-index:10;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;
 color:#cfeaf2;background:rgba(3,8,18,.68);border:1px solid rgba(0,255,213,.28);border-radius:8px;
 padding:10px 12px;max-width:340px;user-select:none}
#ui h1{margin:0 0 4px;font-size:13px;color:#4fffd7;letter-spacing:.6px}
#ui p{margin:0 0 6px;color:#9fb8c8}
#ui .hint{color:#7f93a5}
#ui a{color:#4fffd7;text-decoration:none}
#st{color:#ffd24f;margin-top:5px;white-space:pre}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div id="ui">
 <h1>DIFFUSION MODEL — 2D toy</h1>
 <p>Forward diffusion destroys data with gaussian noise; generation is the exact same walk reversed — step-by-step denoising drifts pure noise back onto the data manifold.</p>
 <div class="hint">[D]/click shape · [space] pause · <a href="index.html">← gallery</a></div>
 <div id="st"></div>
</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),st=document.getElementById('st');
let W,H,S,CX,CY,dpr;
function rs(){
 dpr=Math.min(2,window.devicePixelRatio||1);
 W=innerWidth;H=innerHeight;
 cv.width=W*dpr;cv.height=H*dpr;
 cv.style.width=W+'px';cv.style.height=H+'px';
 x.setTransform(dpr,0,0,dpr,0,0);
 S=Math.min(W,H)*0.33;CX=W/2;CY=H/2+14;
 x.fillStyle='#04060c';x.fillRect(0,0,W,H);
}
addEventListener('resize',rs);rs();

// ---- diffusion schedule (variance preserving, T steps) ----
const T=50,N=900,F=5,HOLD=70;
const beta=[0],abar=[1];
for(let t=1;t<=T;t++){
 const b=0.006+(0.20-0.006)*(t-1)/(T-1);
 beta.push(b);abar.push(abar[t-1]*(1-b));
}
// closed-form reverse posterior q(x_{t-1}|x_t,x0): mean=c0*x0+c1*x_t, sd=sg
const c0=[0],c1=[0],sg=[0];
for(let t=1;t<=T;t++){
 const d=1-abar[t];
 c0.push(Math.sqrt(abar[t-1])*beta[t]/d);
 c1.push(Math.sqrt(1-beta[t])*(1-abar[t-1])/d);
 sg.push(Math.sqrt((1-abar[t-1])/d*beta[t]));
}
function g(){let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.28318*Math.random());}

// ---- target distributions ----
const SHAPES=['spiral','heart','ring'];
let shape=0;
function sample(k){
 if(k===0){const u=Math.sqrt(Math.random()),th=u*6.6,r=0.1+0.88*u;
  return[r*Math.cos(th)+g()*0.02,r*Math.sin(th)+g()*0.02];}
 if(k===1){const s=Math.random()*6.28318;
  const px=Math.pow(Math.sin(s),3)*1.13;
  const py=(-(13*Math.cos(s)-5*Math.cos(2*s)-2*Math.cos(3*s)-Math.cos(4*s))/17-0.35)*1.2;
  return[px+g()*0.02,py+g()*0.02];}
 const a=Math.random()*6.28318,r=0.8+g()*0.045;
 return[r*Math.cos(a),r*Math.sin(a)];
}
const pts=[];
function initPts(){
 pts.length=0;
 for(let i=0;i<N;i++){
  const[a,b]=sample(shape);
  pts.push({x0:a,y0:b,ax:a,ay:b,px:a,py:b,tx:a,ty:b,hj:Math.random()*36-18});
 }
}
initPts();

let mode='holdClean',t=0,f=0,hold=50,paused=false;

function stepFwd(){ // x_t = sqrt(1-b) x_{t-1} + sqrt(b) eps
 t++;const sa=Math.sqrt(1-beta[t]),sb=Math.sqrt(beta[t]);
 for(const p of pts){p.px=p.tx;p.py=p.ty;p.tx=sa*p.tx+sb*g();p.ty=sa*p.ty+sb*g();}
}
function stepRev(){ // annealed drift toward anchor on the manifold + noise
 const A=c0[t],B=c1[t],s=sg[t];
 for(const p of pts){p.px=p.tx;p.py=p.ty;p.tx=A*p.ax+B*p.tx+s*g();p.ty=A*p.ay+B*p.ty+s*g();}
 t--;
}
function assignAnchors(){ // each noise particle follows the score toward a nearby mode
 for(const p of pts){
  let bd=1e9,bi=0;
  for(let k=0;k<7;k++){
   const j=(Math.random()*N)|0,q=pts[j];
   const dx=q.x0-p.tx,dy=q.y0-p.ty,d=dx*dx+dy*dy;
   if(d<bd){bd=d;bi=j;}
  }
  p.ax=pts[bi].x0;p.ay=pts[bi].y0;
 }
}
function update(){
 f++;
 if(mode==='holdClean'){if(--hold<=0){mode='fwd';f=0;stepFwd();}}
 else if(mode==='holdNoise'){if(--hold<=0){assignAnchors();mode='rev';f=0;stepRev();}}
 else if(f>=F){
  f=0;
  if(mode==='fwd'){if(t>=T){mode='holdNoise';hold=HOLD;}else stepFwd();}
  else{
   if(t<=0){for(const p of pts){p.x0=p.ax;p.y0=p.ay;}mode='holdClean';hold=HOLD;}
   else stepRev();
  }
 }
}
function label(){
 if(mode==='holdClean')return['x₀ — clean data sample','#4fffd7'];
 if(mode==='fwd')return['adding noise →','#ff5fd2'];
 if(mode==='holdNoise')return['x_T ≈ pure gaussian','#ff5fd2'];
 return['← denoising (generation)','#4fffd7'];
}
function frame(){
 if(!paused){
  update();
  // trails
  x.globalCompositeOperation='source-over';
  x.fillStyle='rgba(4,6,12,0.16)';x.fillRect(0,0,W,H);
  // points, hue keyed to diffusion step
  x.globalCompositeOperation='lighter';
  const k=Math.min(1,f/F),ke=k*k*(3-2*k),hue=190+150*(t/T);
  for(const p of pts){
   const ix=p.px+(p.tx-p.px)*ke,iy=p.py+(p.ty-p.py)*ke;
   const sx2=CX+ix*S,sy2=CY+iy*S;
   x.fillStyle='hsla('+(hue+p.hj)+',95%,62%,0.30)';
   x.fillRect(sx2-2.4,sy2-2.4,4.8,4.8);
   x.fillStyle='hsla('+(hue+p.hj)+',100%,84%,0.9)';
   x.fillRect(sx2-1,sy2-1,2,2);
  }
  // banner + progress bar
  x.globalCompositeOperation='source-over';
  const[txt,col]=label();
  x.textAlign='center';x.font='700 15px ui-monospace,Menlo,monospace';
  x.fillStyle='rgba(4,6,12,0.55)';x.fillRect(CX-170,26,340,52);
  x.fillStyle=col;x.fillText(txt,CX,46);
  x.fillStyle='rgba(255,255,255,0.12)';x.fillRect(CX-130,58,260,6);
  x.fillStyle=col;x.fillRect(CX-130,58,260*(t/T),6);
  x.font='11px ui-monospace,monospace';x.fillStyle='#9fb8c8';
  x.fillText('t = '+t+' / '+T,CX,74);
 }
 st.textContent='phase  '+label()[0]+'\nstep   t = '+t+' / '+T+'\nshape  '+SHAPES[shape]+'   particles '+N+(paused?'\n[paused]':'');
 requestAnimationFrame(frame);
}
function cycleShape(){
 shape=(shape+1)%SHAPES.length;
 initPts();mode='holdClean';t=0;f=0;hold=60;
 x.setTransform(dpr,0,0,dpr,0,0);
 x.globalCompositeOperation='source-over';
 x.fillStyle='#04060c';x.fillRect(0,0,W,H);
}
addEventListener('keydown',e=>{
 if(e.key==='d'||e.key==='D')cycleShape();
 if(e.key===' '){paused=!paused;e.preventDefault();}
});
cv.addEventListener('click',cycleShape);
requestAnimationFrame(frame);
</script>
</body>
</html>
