<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neural Playground — live decision boundary</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#04040d}
canvas{touch-action:none;display:block;position:fixed;inset:0}
#ui{position:fixed;top:10px;left:10px;z-index:10;font:12px/1.55 Menlo,Consolas,"SF Mono",monospace;color:#9fd8ff;background:rgba(4,10,26,.78);border:1px solid rgba(0,229,255,.28);border-radius:10px;padding:10px 13px;max-width:345px;max-height:52vh;overflow:auto}
#ui h1{margin:0 0 3px;font-size:14px;letter-spacing:.5px;color:#00e5ff;text-shadow:0 0 9px rgba(0,229,255,.8)}
.ex{color:#7fa6c8}
.hint{color:#587a9c;margin-top:5px}
.stats{margin-top:6px;color:#eaf7ff;white-space:pre}
#ui a{color:#ff2fd6;text-decoration:none}
#cls{font-weight:bold}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div id="ui">
<h1>NEURAL PLAYGROUND</h1>
<div class="ex">A 2-16-16-2 tanh network trains live by real minibatch backprop; the heatmap is its decision boundary bending itself around the data.</div>
<div class="hint">[1] blobs · [2] ring · [3] spirals · [4] xor<br>click = add point (<span id="cls">class A</span>) · [X] switch class · [R] reset weights</div>
<div class="stats" id="stats"></div>
<a href="index.html">&larr; gallery</a>
</div>
<canvas id="c"></canvas>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0;
function resize(){const d=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
let seed=987654321;
const rnd=()=> (seed=(seed*1664525+1013904223)>>>0)/4294967296;
const randn=()=>Math.sqrt(-2*Math.log(Math.max(rnd(),1e-12)))*Math.cos(6.2831853*rnd());
/* ---------- network 2-16-16-2, tanh, softmax ---------- */
const N1=16,N2=16,BS=28;
let W1,b1,W2,b2,W3,b3,gW1,gW2,gW3,gb1,gb2,gb3,vW1,vW2,vW3,vb1,vb2,vb3,steps=0,lossHist=[],lossSm=0.7;
function mat(r,c,s){const m=[];for(let i=0;i<r;i++){const w=new Float64Array(c);for(let j=0;j<c;j++)w[j]=randn()*s;m.push(w);}return m;}
function zm(r,c){const m=[];for(let i=0;i<r;i++)m.push(new Float64Array(c));return m;}
function initNet(){
  W1=mat(N1,2,0.9);b1=new Float64Array(N1);
  W2=mat(N2,N1,0.35);b2=new Float64Array(N2);
  W3=mat(2,N2,0.35);b3=new Float64Array(2);
  gW1=zm(N1,2);gW2=zm(N2,N1);gW3=zm(2,N2);gb1=new Float64Array(N1);gb2=new Float64Array(N2);gb3=new Float64Array(2);
  vW1=zm(N1,2);vW2=zm(N2,N1);vW3=zm(2,N2);vb1=new Float64Array(N1);vb2=new Float64Array(N2);vb3=new Float64Array(2);
  steps=0;lossHist=[];lossSm=0.7;
}
const a1=new Float64Array(N1),a2=new Float64Array(N2),oo=new Float64Array(2),pp=new Float64Array(2),d1=new Float64Array(N1),d2=new Float64Array(N2);
function fwd(x,y){
  for(let i=0;i<N1;i++)a1[i]=Math.tanh(W1[i][0]*x+W1[i][1]*y+b1[i]);
  for(let j=0;j<N2;j++){let s=b2[j];const r=W2[j];for(let i=0;i<N1;i++)s+=r[i]*a1[i];a2[j]=Math.tanh(s);}
  for(let k=0;k<2;k++){let s=b3[k];const r=W3[k];for(let j=0;j<N2;j++)s+=r[j]*a2[j];oo[k]=s;}
  const m=Math.max(oo[0],oo[1]),e0=Math.exp(oo[0]-m),e1=Math.exp(oo[1]-m);
  pp[0]=e0/(e0+e1);pp[1]=1-pp[0];return pp[1];
}
function trainStep(){
  const n=pts.length;if(n<4)return lossSm;
  const bs=Math.min(BS,n);let L=0;
  for(let s=0;s<bs;s++){
    const pt=pts[(rnd()*n)|0];
    fwd(pt.x,pt.y);
    L-=Math.log(Math.max(pp[pt.c],1e-9));
    const e0=pp[0]-(pt.c===0?1:0),e1=pp[1]-(pt.c===1?1:0);
    gb3[0]+=e0;gb3[1]+=e1;
    for(let j=0;j<N2;j++){gW3[0][j]+=e0*a2[j];gW3[1][j]+=e1*a2[j];d2[j]=(W3[0][j]*e0+W3[1][j]*e1)*(1-a2[j]*a2[j]);}
    for(let j=0;j<N2;j++){gb2[j]+=d2[j];const g=gW2[j];for(let i=0;i<N1;i++)g[i]+=d2[j]*a1[i];}
    for(let i=0;i<N1;i++){let s2=0;for(let j=0;j<N2;j++)s2+=W2[j][i]*d2[j];d1[i]=s2*(1-a1[i]*a1[i]);}
    for(let i=0;i<N1;i++){gb1[i]+=d1[i];gW1[i][0]+=d1[i]*pt.x;gW1[i][1]+=d1[i]*pt.y;}
  }
  const lr=0.045/bs,mu=0.88;
  updM(W1,gW1,vW1,lr,mu);updM(W2,gW2,vW2,lr,mu);updM(W3,gW3,vW3,lr,mu);
  updV(b1,gb1,vb1,lr,mu);updV(b2,gb2,vb2,lr,mu);updV(b3,gb3,vb3,lr,mu);
  steps++;return L/bs;
}
function updM(Wm,Gm,Vm,lr,mu){for(let i=0;i<Wm.length;i++){const w=Wm[i],g=Gm[i],v=Vm[i];for(let j=0;j<w.length;j++){v[j]=mu*v[j]-lr*g[j];w[j]+=v[j];g[j]=0;}}}
function updV(w,g,v,lr,mu){for(let j=0;j<w.length;j++){v[j]=mu*v[j]-lr*g[j];w[j]+=v[j];g[j]=0;}}
/* ---------- datasets ---------- */
let pts=[],curClass=0,dsName='two blobs';
function makeData(k){
  pts=[];
  const push=(x,y,c)=>pts.push({x:x,y:y,c:c});
  if(k===1){dsName='two blobs';for(let i=0;i<110;i++){push(-0.5+randn()*0.2,-0.45+randn()*0.2,0);push(0.5+randn()*0.2,0.45+randn()*0.2,1);}}
  else if(k===2){dsName='circle in ring';for(let i=0;i<110;i++){let a=rnd()*6.283,r=Math.sqrt(rnd())*0.34;push(Math.cos(a)*r,Math.sin(a)*r,0);a=rnd()*6.283;r=0.72+randn()*0.07;push(Math.cos(a)*r,Math.sin(a)*r,1);}}
  else if(k===3){dsName='two spirals';const n=130;for(let i=0;i<n;i++){const t=i/(n-1),r=0.1+0.85*t,a=t*2.7*Math.PI+0.5;
    push(r*Math.cos(a)+randn()*0.03,r*Math.sin(a)+randn()*0.03,0);
    push(r*Math.cos(a+Math.PI)+randn()*0.03,r*Math.sin(a+Math.PI)+randn()*0.03,1);}}
  else{dsName='xor checker';while(pts.length<220){const x=(rnd()*2-1)*0.95,y=(rnd()*2-1)*0.95;if(Math.abs(x)<0.09||Math.abs(y)<0.09)continue;push(x,y,x*y>0?0:1);}}
  initNet();
}
/* ---------- heatmap (coarse grid -> smooth upscale) ---------- */
const GN=64,hm=document.createElement('canvas');hm.width=GN;hm.height=GN;
const hctx=hm.getContext('2d'),img=hctx.createImageData(GN,GN);
const C0=[0,210,255],C1=[255,45,190];
function drawHeat(px,py,side){
  const d=img.data;let k=0;
  for(let gy=0;gy<GN;gy++){const y=1.15-2.3*(gy+0.5)/GN;
    for(let gx=0;gx<GN;gx++){const x=-1.15+2.3*(gx+0.5)/GN;
      const v=fwd(x,y),cf=Math.abs(v-0.5)*2,b=0.13+0.5*cf;
      d[k++]=(C0[0]*(1-v)+C1[0]*v)*b;d[k++]=(C0[1]*(1-v)+C1[1]*v)*b;d[k++]=(C0[2]*(1-v)+C1[2]*v)*b;d[k++]=255;
    }}
  hctx.putImageData(img,0,0);
  ctx.save();ctx.imageSmoothingEnabled=true;ctx.drawImage(hm,px,py,side,side);ctx.restore();
}
/* ---------- render loop ---------- */
let plot={x:0,y:0,s:100};
function drawLossCurve(){
  const w=210,h=64,x0=W-w-14,y0=14;
  ctx.fillStyle='rgba(4,10,26,.72)';ctx.fillRect(x0,y0,w,h);
  ctx.strokeStyle='rgba(0,229,255,.3)';ctx.lineWidth=1;ctx.strokeRect(x0,y0,w,h);
  if(lossHist.length>1){
    let mx=0.1;for(let i=0;i<lossHist.length;i++)mx=Math.max(mx,lossHist[i]);
    ctx.strokeStyle='#ffe066';ctx.lineWidth=1.4;ctx.beginPath();
    for(let i=0;i<lossHist.length;i++){
      const xx=x0+i/(lossHist.length-1)*w,yy=y0+h-3-(lossHist[i]/mx)*(h-8);
      if(i)ctx.lineTo(xx,yy);else ctx.moveTo(xx,yy);
    }
    ctx.stroke();
  }
  ctx.fillStyle='#8fb8d8';ctx.font='10px monospace';ctx.fillText('loss',x0+6,y0+12);
}
function frame(){
  let L=lossSm;
  for(let s=0;s<10;s++)L=trainStep();
  lossSm=lossSm*0.92+L*0.08;
  lossHist.push(lossSm);if(lossHist.length>260)lossHist.shift();
  ctx.fillStyle='#04040d';ctx.fillRect(0,0,W,H);
  const side=Math.min(W,H)*0.92,px=(W-side)/2,py=(H-side)/2;
  plot={x:px,y:py,s:side};
  drawHeat(px,py,side);
  ctx.strokeStyle='rgba(0,229,255,.35)';ctx.lineWidth=1.5;ctx.strokeRect(px,py,side,side);
  let correct=0;
  for(let n=0;n<pts.length;n++){
    const pt=pts[n],v=fwd(pt.x,pt.y),pc=v>0.5?1:0;if(pc===pt.c)correct++;
    const X=px+(pt.x+1.15)/2.3*side,Y=py+(1.15-pt.y)/2.3*side;
    ctx.shadowBlur=9;ctx.shadowColor=pt.c?'#ff2fd6':'#00e5ff';
    ctx.fillStyle=pt.c?'#ff9dea':'#aef6ff';
    ctx.beginPath();ctx.arc(X,Y,3.2,0,6.283);ctx.fill();
    if(pc!==pt.c){ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,80,80,.85)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(X,Y,5.5,0,6.283);ctx.stroke();}
  }
  ctx.shadowBlur=0;
  const acc=pts.length?correct/pts.length:0;
  drawLossCurve();
  const ep=pts.length?Math.floor(steps*BS/pts.length):0;
  document.getElementById('stats').textContent=
    'dataset : '+dsName+'\nepoch   : '+ep+'   (step '+steps+')\nloss    : '+lossSm.toFixed(4)+'\naccuracy: '+(acc*100).toFixed(1)+'%\npoints  : '+pts.length;
  requestAnimationFrame(frame);
}
/* ---------- interaction ---------- */
cv.addEventListener('click',function(e){
  const x=-1.15+(e.clientX-plot.x)/plot.s*2.3,y=1.15-(e.clientY-plot.y)/plot.s*2.3;
  if(x<-1.15||x>1.15||y<-1.15||y>1.15)return;
  pts.push({x:x,y:y,c:curClass});
});
addEventListener('keydown',function(e){
  const k=e.key.toLowerCase();
  if(k>='1'&&k<='4')makeData(+k);
  else if(k==='x'){curClass=1-curClass;const el=document.getElementById('cls');el.textContent=curClass?'class B':'class A';el.style.color=curClass?'#ff2fd6':'#00e5ff';}
  else if(k==='r')initNet();
});
document.getElementById('cls').style.color='#00e5ff';
makeData(1);
requestAnimationFrame(frame);
</script>
</body>
</html>
