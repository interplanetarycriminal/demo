<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorting Visualizer</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060d}
  #c{touch-action:none;display:block;width:100vw;height:100vh}
  #ui{position:fixed;top:10px;left:10px;z-index:10;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;
      color:#cfe;background:rgba(6,10,20,.55);border:1px solid rgba(150,120,255,.25);
      padding:8px 10px;border-radius:6px;backdrop-filter:blur(3px);pointer-events:none;max-height:52vh;overflow:auto}
  #ui b{color:#b28bff;letter-spacing:1px}
  #ui a{color:#7ef0ff;pointer-events:auto;text-decoration:none}
  #ui a:hover{text-decoration:underline}
  #ui .row{margin-top:4px;opacity:.9}
  #alg{color:#fff}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div id="ui">
  <div><b>SORTING&nbsp;VISUALIZER</b></div>
  <div class="row">SPACE/&rarr; next algo &middot; R reshuffle &middot; &uarr;/&darr; speed</div>
  <div class="row"><span id="alg">Bubble Sort</span> &nbsp; comparisons: <span id="cmp">0</span></div>
  <div class="row"><a href="index.html">&larr; gallery</a></div>
</div>
<script>
(function(){
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let cssW,cssH,dpr;
const n=140;
let arr=new Array(n), comparisons=0, active=[], speedMul=1;
let ai=0, iter=null, done=false, sweep=0, holdTimer=0;

function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  cssW=window.innerWidth; cssH=window.innerHeight;
  cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
  cv.style.width=cssW+'px'; cv.style.height=cssH+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function swap(i,j){ const t=arr[i];arr[i]=arr[j];arr[j]=t; }

// ---- algorithms as generators (real comparisons/swaps) ----
function* bubble(){ for(let i=0;i<n-1;i++){ for(let j=0;j<n-1-i;j++){ active=[j,j+1]; comparisons++; if(arr[j]>arr[j+1]) swap(j,j+1); yield; } } }
function* insertion(){ for(let i=1;i<n;i++){ let j=i; while(j>0){ active=[j,j-1]; comparisons++; if(arr[j-1]>arr[j]){ swap(j,j-1); j--; yield; } else { yield; break; } } } }
function* selection(){ for(let i=0;i<n-1;i++){ let mi=i; for(let j=i+1;j<n;j++){ active=[mi,j]; comparisons++; if(arr[j]<arr[mi]) mi=j; yield; } if(mi!==i){ swap(i,mi); yield; } } }
function* quick(lo,hi){ if(lo>=hi) return; const pivot=arr[hi]; let i=lo; for(let j=lo;j<hi;j++){ active=[j,hi]; comparisons++; if(arr[j]<pivot){ swap(i,j); i++; } yield; } swap(i,hi); active=[i,hi]; yield; yield* quick(lo,i-1); yield* quick(i+1,hi); }
function* merge(lo,hi){ if(hi-lo<1) return; const mid=(lo+hi)>>1; yield* merge(lo,mid); yield* merge(mid+1,hi); const tmp=[]; let i=lo,j=mid+1; while(i<=mid&&j<=hi){ active=[i,j]; comparisons++; if(arr[i]<=arr[j]) tmp.push(arr[i++]); else tmp.push(arr[j++]); yield; } while(i<=mid) tmp.push(arr[i++]); while(j<=hi) tmp.push(arr[j++]); for(let k=0;k<tmp.length;k++){ arr[lo+k]=tmp[k]; active=[lo+k]; yield; } }
function* sift(i,end){ while(true){ let l=2*i+1,r=2*i+2,big=i; if(l<end){ comparisons++; if(arr[l]>arr[big]) big=l; } if(r<end){ comparisons++; if(arr[r]>arr[big]) big=r; } if(big===i) break; swap(i,big); active=[i,big]; yield; i=big; } }
function* heap(){ for(let i=(n>>1)-1;i>=0;i--) yield* sift(i,n); for(let end=n-1;end>0;end--){ swap(0,end); active=[0,end]; yield; yield* sift(0,end); } }

const algos=[
  {name:'Bubble Sort',   make:()=>bubble(),        speed:28},
  {name:'Insertion Sort',make:()=>insertion(),     speed:26},
  {name:'Selection Sort',make:()=>selection(),      speed:30},
  {name:'Quick Sort',    make:()=>quick(0,n-1),     speed:6},
  {name:'Merge Sort',    make:()=>merge(0,n-1),     speed:6},
  {name:'Heap Sort',     make:()=>heap(),           speed:6},
];

function shuffle(){ for(let i=0;i<n;i++) arr[i]=Math.random(); }
function start(reshuffleData){ if(reshuffleData) shuffle(); comparisons=0; active=[]; done=false; sweep=0; holdTimer=0; iter=algos[ai].make(); document.getElementById('alg').textContent=algos[ai].name; }
function nextAlgo(){ ai=(ai+1)%algos.length; start(true); }

function render(){
  ctx.fillStyle='#05060d'; ctx.fillRect(0,0,cssW,cssH);
  const bw=cssW/n, maxH=cssH*0.82, base=cssH*0.94;
  const set=active;
  for(let i=0;i<n;i++){
    const v=arr[i], h=v*maxH;
    let col;
    if(done && i<=sweep) col='hsl(150,90%,60%)';
    else if(set.indexOf(i)>=0) col='#ffffff';
    else col='hsl('+(v*280+10).toFixed(0)+',85%,58%)';
    ctx.fillStyle=col;
    ctx.fillRect(i*bw+0.5, base-h, Math.max(1,bw-1), h);
  }
  document.getElementById('cmp').textContent=comparisons;
}

function frame(){
  if(!done){
    const steps=Math.max(1,Math.round(algos[ai].speed*speedMul));
    for(let s=0;s<steps;s++){ const r=iter.next(); if(r.done){ done=true; active=[]; break; } }
  } else {
    if(sweep<n) sweep+=Math.max(2,Math.round(n/40));
    else { holdTimer++; if(holdTimer>70) nextAlgo(); }
  }
  render();
  requestAnimationFrame(frame);
}

addEventListener('resize',resize);
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k===' '||e.key==='ArrowRight'){ e.preventDefault(); nextAlgo(); }
  else if(k==='r'){ start(true); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); speedMul=Math.min(6,speedMul*1.4); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); speedMul=Math.max(0.15,speedMul/1.4); }
});
resize(); start(true); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
