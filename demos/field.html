<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnetic Field Lines</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#02030a}
canvas{display:block;position:fixed;inset:0;cursor:crosshair}
#ui{position:fixed;top:10px;left:12px;z-index:10;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;
color:rgba(200,225,255,.85);background:rgba(4,6,16,.5);padding:8px 12px;
border:1px solid rgba(120,180,255,.18);border-radius:8px;user-select:none}
#ui b{color:#7fd8ff;letter-spacing:.1em}
#ui a{color:#ffb48a;text-decoration:none}
#ui a:hover{text-decoration:underline}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div id="ui"><b>MAGNETIC FIELD</b><br>drag poles &middot; click: add/remove pole (max 6) &middot; P: flip nearest<br><a href="index.html">&larr; gallery</a></div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var W=2,H=2,DPR=1,poles=[],started=false;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  if(!started){
    started=true;
    poles=[
      {x:W*0.32,y:H*0.34,q:1},{x:W*0.68,y:H*0.66,q:1},
      {x:W*0.68,y:H*0.34,q:-1},{x:W*0.32,y:H*0.66,q:-1}
    ];
  }
  for(var i=0;i<poles.length;i++){
    poles[i].x=Math.min(W-14,Math.max(14,poles[i].x));
    poles[i].y=Math.min(H-14,Math.max(14,poles[i].y));
  }
}
window.addEventListener('resize',resize);
resize();
var TOTAL=340,STEP=6,MAXST=230,lines=[];
function trace(){
  lines.length=0;
  var Ns=[],i,k,s;
  for(i=0;i<poles.length;i++)if(poles[i].q>0)Ns.push(poles[i]);
  if(!Ns.length)return;
  var per=Math.max(8,Math.round(TOTAL/Ns.length));
  for(var pn=0;pn<Ns.length;pn++){
    var P=Ns[pn];
    for(k=0;k<per;k++){
      var a=k/per*6.28318+0.13;
      var x=P.x+Math.cos(a)*9,y=P.y+Math.sin(a)*9;
      var pts=[x,y];
      for(s=0;s<MAXST;s++){
        var fx=0,fy=0;
        for(i=0;i<poles.length;i++){
          var pl=poles[i],dx=x-pl.x,dy=y-pl.y,r2=dx*dx+dy*dy+25;
          var f=pl.q/r2;fx+=dx*f;fy+=dy*f;
        }
        var m=Math.sqrt(fx*fx+fy*fy);
        if(m<1e-6)break;
        x+=fx/m*STEP;y+=fy/m*STEP;
        pts.push(x,y);
        var hit=false;
        for(i=0;i<poles.length;i++){
          if(poles[i].q<0){
            var ax=x-poles[i].x,ay=y-poles[i].y;
            if(ax*ax+ay*ay<196){pts.push(poles[i].x,poles[i].y);hit=true;break;}
          }
        }
        if(hit)break;
        if(x<-60||x>W+60||y<-60||y>H+60)break;
      }
      if(pts.length>=6)lines.push(pts);
    }
  }
}
var mx=0,my=0,drag=null,downX=0,downY=0,moved=false;
canvas.addEventListener('pointerdown',function(e){
  var x=e.clientX,y=e.clientY;
  downX=x;downY=y;moved=false;drag=null;
  var best=26*26,bi=-1;
  for(var i=0;i<poles.length;i++){
    var dx=x-poles[i].x,dy=y-poles[i].y,d2=dx*dx+dy*dy;
    if(d2<best){best=d2;bi=i;}
  }
  if(bi>=0)drag=poles[bi];
  try{canvas.setPointerCapture(e.pointerId)}catch(err){}
});
canvas.addEventListener('pointermove',function(e){
  mx=e.clientX;my=e.clientY;
  if(Math.abs(mx-downX)+Math.abs(my-downY)>6)moved=true;
  if(drag){
    drag.x=Math.min(W-14,Math.max(14,mx));
    drag.y=Math.min(H-14,Math.max(14,my));
  }
});
canvas.addEventListener('pointerup',function(e){
  var x=e.clientX,y=e.clientY;
  if(!moved){
    if(drag){
      if(poles.length>2)poles.splice(poles.indexOf(drag),1);
    }else if(poles.length<6){
      var nN=0,nS=0;
      for(var i=0;i<poles.length;i++)poles[i].q>0?nN++:nS++;
      poles.push({x:x,y:y,q:nN<=nS?1:-1});
    }
  }
  drag=null;
});
window.addEventListener('keydown',function(e){
  if(e.key==='p'||e.key==='P'){
    var bi=-1,best=1e18;
    for(var i=0;i<poles.length;i++){
      var dx=mx-poles[i].x,dy=my-poles[i].y,d2=dx*dx+dy*dy;
      if(d2<best){best=d2;bi=i;}
    }
    if(bi>=0)poles[bi].q*=-1;
  }
});
var t=0;
function frame(){
  t+=1/60;
  trace();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#02030a';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  ctx.lineWidth=1;
  ctx.setLineDash([5,9]);
  ctx.lineDashOffset=-((t*46)%14);
  var L,n,i,k;
  for(k=0;k<lines.length;k++){
    L=lines[k];n=L.length;
    var gr=ctx.createLinearGradient(L[0],L[1],L[n-2],L[n-1]);
    gr.addColorStop(0,'rgba(255,150,70,0.4)');
    gr.addColorStop(1,'rgba(80,200,255,0.4)');
    ctx.strokeStyle=gr;
    ctx.beginPath();
    ctx.moveTo(L[0],L[1]);
    for(i=2;i<n;i+=2)ctx.lineTo(L[i],L[i+1]);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  for(k=0;k<600;k++){
    L=lines[(Math.random()*lines.length)|0];
    if(!L)break;
    var vi=((Math.random()*(L.length/2))|0)*2;
    ctx.globalAlpha=0.04+Math.random()*0.2;
    ctx.fillStyle=Math.random()<0.5?'#9fd8ff':'#ffd2a0';
    ctx.fillRect(L[vi]-0.75,L[vi+1]-0.75,1.5,1.5);
  }
  ctx.globalAlpha=1;
  for(i=0;i<poles.length;i++){
    var pl=poles[i],R=15+Math.sin(t*2.1+i*1.7)*1.5;
    var g2=ctx.createRadialGradient(pl.x,pl.y,0,pl.x,pl.y,R*2.2);
    if(pl.q>0){
      g2.addColorStop(0,'rgba(255,240,220,0.95)');
      g2.addColorStop(0.25,'rgba(255,130,50,0.8)');
      g2.addColorStop(1,'rgba(255,80,20,0)');
    }else{
      g2.addColorStop(0,'rgba(225,250,255,0.95)');
      g2.addColorStop(0.25,'rgba(60,190,255,0.8)');
      g2.addColorStop(1,'rgba(20,120,255,0)');
    }
    ctx.fillStyle=g2;
    ctx.beginPath();ctx.arc(pl.x,pl.y,R*2.2,0,6.283);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.font='bold 13px ui-monospace,Consolas,monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(i=0;i<poles.length;i++){
    ctx.fillStyle='rgba(10,10,25,0.9)';
    ctx.fillText(poles[i].q>0?'N':'S',poles[i].x,poles[i].y+1);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
