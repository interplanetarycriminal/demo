<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;}
  canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;touch-action:none;}
  #ui{position:fixed;top:10px;left:12px;z-index:10;font:12px/1.5 monospace;
      color:#f9f;background:rgba(0,0,0,.35);padding:8px 10px;
      border:1px solid rgba(230,140,255,.22);border-radius:4px;pointer-events:none;max-height:52vh;overflow:auto}
  #ui .t{color:#fff;font-weight:bold;letter-spacing:1px;}
  #ui a{color:#c8f;pointer-events:auto;text-decoration:none;}
  #ui a:hover{color:#eaf;}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
<canvas id="c"></canvas>
<div id="ui">
  <div class="t">APOLLONIAN GASKET</div>
  <div>move mouse: fold &nbsp;·&nbsp; click: new palette</div>
  <div><a href="index.html">&larr; gallery</a></div>
</div>
<script>
var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if(!gl){ throw new Error('WebGL not available'); }

var VS = [
'attribute vec2 p;',
'void main(){ gl_Position = vec4(p,0.0,1.0); }'
].join('\n');

var FS = [
'precision highp float;',
'uniform vec2 res;',
'uniform float time;',
'uniform vec2 mouse;',
'uniform float phase;',
'vec3 pal(float t){',
'  return 0.5+0.5*cos(6.28318*(vec3(1.0,1.0,1.0)*t)+vec3(0.0,2.0,4.0)+phase*6.28318);',
'}',
'void main(){',
'  vec2 uv=(gl_FragCoord.xy*2.0-res)/res.y;',
'  float zoom=1.3+0.55*sin(time*0.22);',
'  uv*=zoom;',
'  float a=time*0.05;',
'  uv=mat2(cos(a),-sin(a),sin(a),cos(a))*uv;',
'  vec2 p=uv;',
'  float scale=1.0;',
'  float c=1.08+0.42*mouse.x;',
'  float extra=0.14*mouse.y;',
'  vec2 trap=vec2(1e10);',
'  for(int i=0;i<9;i++){',
'    p=-1.0+2.0*fract(0.5*p+0.5);',
'    float r2=dot(p,p);',
'    float k=(c+extra)/max(r2,0.02);',
'    p*=k;',
'    scale*=k;',
'    trap=min(trap, abs(p));',
'  }',
'  float d=0.5*abs(p.y)/scale;',
'  float glow=exp(-d*6.0);',
'  float ci=trap.x*2.0+trap.y*3.0;',
'  vec3 col=pal(ci+time*0.05)*(0.28+0.72*glow);',
'  col+=pal(ci*1.7+0.3)*smoothstep(0.03,0.0,d)*1.6;',
'  col*=1.0-0.28*length(uv)/zoom;',
'  col=pow(max(col,0.0), vec3(0.85));',
'  gl_FragColor=vec4(col,1.0);',
'}'
].join('\n');

function compile(type, src){
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}
function link(vs, fs){
  var p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    throw new Error(gl.getProgramInfoLog(p));
  }
  return p;
}

var prog = link(VS, FS);
gl.useProgram(prog);

var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
var loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

var uRes = gl.getUniformLocation(prog, 'res');
var uTime = gl.getUniformLocation(prog, 'time');
var uMouse = gl.getUniformLocation(prog, 'mouse');
var uPhase = gl.getUniformLocation(prog, 'phase');

var mouse = [0,0], mtarget = [0,0];
var phase = 0.2;

function resize(){
  var dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = Math.floor(innerWidth*dpr);
  canvas.height = Math.floor(innerHeight*dpr);
  gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener('resize', resize);
resize();

window.addEventListener('mousemove', function(e){
  mtarget[0] = (e.clientX/innerWidth)*2-1;
  mtarget[1] = -((e.clientY/innerHeight)*2-1);
});
window.addEventListener('click', function(){ phase = Math.random(); });

var t0 = performance.now();
function frame(){
  var t = (performance.now()-t0)/1000;
  mouse[0] += (mtarget[0]-mouse[0])*0.04;
  mouse[1] += (mtarget[1]-mouse[1])*0.04;
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t);
  gl.uniform2f(uMouse, mouse[0], mouse[1]);
  gl.uniform1f(uPhase, phase);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
frame();
</script>
