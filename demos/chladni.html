<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chladni Plate</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#04050a;}
  canvas{display:block;position:fixed;inset:0;touch-action:none;}
  #ui{position:fixed;top:12px;left:12px;z-index:10;
      font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#bfe;
      background:rgba(8,12,20,0.42);border:1px solid rgba(120,220,255,0.18);
      border-radius:8px;padding:10px 12px;max-width:270px;max-height:52vh;overflow:auto}
  #ui h1{margin:0 0 4px;font-size:12px;letter-spacing:2px;color:#7ff5dd;text-transform:uppercase;}
  #ui p{margin:2px 0;opacity:0.82;}
  #ui a{color:#8ff;text-decoration:none;border-bottom:1px dotted #8ff;}
  #ui .k{color:#ffd27f;}
  #nm{color:#8effd0;font-size:13px;}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div id="ui">
  <h1>Chladni Plate</h1>
  <p>8000 grains settle onto vibration nodal lines.</p>
  <p><span class="k">&larr; &rarr;</span> n &nbsp; <span class="k">&uarr; &darr;</span> m &nbsp; <span class="k">[ ]</span> n &nbsp; <span class="k">click</span> random</p>
  <p><span id="nm">n=5&nbsp;&nbsp;m=3</span></p>
  <p><a href="index.html">&larr; gallery</a></p>
</div>
<canvas id="c"></canvas>
<script>
var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();

var n=5, m=3, sign=-1;
function wave(x,y){
  return Math.sin(n*Math.PI*x)*Math.sin(m*Math.PI*y)
       + sign*Math.sin(m*Math.PI*x)*Math.sin(n*Math.PI*y);
}

var COUNT=8000;
var pxA=new Float32Array(COUNT), pyA=new Float32Array(COUNT);
function seed(){ for(var i=0;i<COUNT;i++){ pxA[i]=Math.random(); pyA[i]=Math.random(); } }
seed();

var minWalk=0.0016;
function label(){ document.getElementById('nm').innerHTML='n='+n+'&nbsp;&nbsp;m='+m; }

window.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===']') n=Math.min(16,n+1);
  else if(e.key==='ArrowLeft'||e.key==='[') n=Math.max(1,n-1);
  else if(e.key==='ArrowUp') m=Math.min(16,m+1);
  else if(e.key==='ArrowDown') m=Math.max(1,m-1);
  else return;
  e.preventDefault(); label();
});
canvas.addEventListener('click',function(){
  n=1+Math.floor(Math.random()*9);
  m=1+Math.floor(Math.random()*9);
  sign=Math.random()<0.5?-1:1;
  label(); seed();
});

function frame(){
  ctx.fillStyle='#04050a';
  ctx.fillRect(0,0,W,H);
  var scale=Math.min(W,H)*0.9, ox=(W-scale)/2, oy=(H-scale)/2;

  ctx.strokeStyle='rgba(90,150,190,0.18)';
  ctx.lineWidth=1;
  ctx.strokeRect(ox,oy,scale,scale);

  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(120,235,255,0.55)';
  for(var i=0;i<COUNT;i++){
    var s=wave(pxA[i],pyA[i]), amp=Math.abs(s);
    var stoch=amp*0.045; if(stoch<minWalk) stoch=minWalk;
    pxA[i]+=(Math.random()*2-1)*stoch;
    pyA[i]+=(Math.random()*2-1)*stoch;
    if(pxA[i]<0||pxA[i]>1||pyA[i]<0||pyA[i]>1){ pxA[i]=Math.random(); pyA[i]=Math.random(); }
    ctx.fillRect(ox+pxA[i]*scale, oy+pyA[i]*scale, 1.4, 1.4);
  }
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(frame);
}
label();
frame();
</script>
</body>
</html>
