<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Procedural Fire</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;top:10px;left:10px;z-index:10;color:#ffd9a0;
font:11px/1.6 ui-monospace,Menlo,Consolas,monospace;background:rgba(10,5,0,.55);
padding:8px 12px;border:1px solid rgba(255,150,50,.25);border-radius:6px;user-select:none;max-height:52vh;overflow:auto}
#ui b{color:#ffb347;letter-spacing:1px}
#ui a{color:#7fd4ff;text-decoration:none}
#ui a:hover{text-decoration:underline}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="glc"></canvas>
<div id="ui"><b>PROCEDURAL FIRE</b><br>mouse X: move base &middot; mouse Y: intensity &middot; click: burst<br><a href="index.html">&larr; gallery</a></div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('glc');
var gl=canvas.getContext('webgl')||canvas.getContext('experimental-webgl');
if(!gl)throw new Error('WebGL not supported');

function compile(type,src){
  var s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error('shader: '+gl.getShaderInfoLog(s));
  return s;
}
function link(vsSrc,fsSrc){
  var p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vsSrc));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fsSrc));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error('link: '+gl.getProgramInfoLog(p));
  return p;
}

var VS='attribute vec2 aP;void main(){gl_Position=vec4(aP,0.0,1.0);}';

var FS=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uMouse;
uniform float uBurst;

float hash(vec2 p){
  p=fract(p*vec2(123.34,456.21));
  p+=dot(p,p+45.32);
  return fract(p.x*p.y);
}
float hash1(float n){return fract(sin(n*127.1)*43758.5453);}
float noise(vec2 p){
  vec2 i=floor(p);vec2 f=fract(p);
  vec2 u=f*f*(3.0-2.0*f);
  float a=hash(i);
  float b=hash(i+vec2(1.0,0.0));
  float c=hash(i+vec2(0.0,1.0));
  float d=hash(i+vec2(1.0,1.0));
  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
}
float fbm(vec2 p){
  float v=0.0;float a=0.5;
  mat2 m=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<5;i++){v+=a*noise(p);p=m*p;a*=0.5;}
  return v;
}
vec3 ramp(float x){
  x=clamp(x,0.0,1.0);
  vec3 c=mix(vec3(0.0),vec3(0.55,0.03,0.0),smoothstep(0.0,0.22,x));
  c=mix(c,vec3(0.95,0.28,0.0),smoothstep(0.2,0.5,x));
  c=mix(c,vec3(1.0,0.8,0.1),smoothstep(0.45,0.72,x));
  c=mix(c,vec3(1.0,0.98,0.85),smoothstep(0.68,0.95,x));
  return c;
}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;
  float asp=uRes.x/uRes.y;
  float t=uTime;
  float burst=exp(-max(t-uBurst,0.0)*2.5);
  float inten=mix(0.7,1.35,uMouse.y)+burst*0.9;
  float H=mix(0.5,1.0,uMouse.y)+burst*0.3;

  vec2 q=vec2((uv.x-uMouse.x)*asp,uv.y);

  // heat-haze wobble at the edges
  float haze=noise(vec2(q.x*7.0,q.y*10.0-t*4.5))-0.5;
  q.x+=haze*0.055*smoothstep(0.0,0.6,q.y);

  // rising fbm, advected upward + inner turbulence
  vec2 np=vec2(q.x*3.0,q.y*4.5-t*2.6);
  float n=fbm(np);
  n+=0.55*fbm(np*2.4+vec2(t*0.35,-t*4.2));
  n*=0.7;

  // shaped gradient -> sharp silhouette
  float yy=q.y/H;
  float xx=abs(q.x)/(0.30*inten*(1.0-0.72*clamp(yy,0.0,1.0))+0.02);
  float d=xx*0.55+yy;
  float f=n*1.7*inten-d*1.2+0.30;
  float sil=smoothstep(0.0,0.10,f);
  float body=smoothstep(0.0,0.85,f);
  float heat=sil*(0.35+0.9*body);

  vec3 col=ramp(heat*1.15);

  // ambient glow around the flame
  float glow=exp(-length(vec2(q.x,(q.y-0.05)*0.8))*3.2)*0.4*inten;
  col+=vec3(0.9,0.22,0.03)*glow*(0.5+0.5*n);

  // embers
  for(int i=0;i<20;i++){
    float fi=float(i);
    float r1=hash1(fi*1.37+7.0);
    float r2=hash1(fi*2.11+3.0);
    float spd=0.22+0.4*r2;
    float life=fract(t*spd+r1);
    float ey=life*(H+0.3);
    float ex=(r1-0.5)*0.45*(0.35+life)+0.07*sin(t*(1.5+r2*4.0)+fi*2.4);
    vec2 dq=q-vec2(ex,ey);
    float fade=(1.0-life)*smoothstep(0.0,0.12,life);
    float g=0.00055/(dot(dq,dq)+0.0007);
    col+=vec3(1.0,0.62,0.22)*g*fade*inten;
  }

  // floor glow + vignette
  col+=vec3(0.45,0.07,0.0)*exp(-uv.y*4.5)*0.35*inten;
  vec2 vc=uv-vec2(0.5);
  col*=1.0-dot(vc,vc)*0.75;
  col=pow(max(col,vec3(0.0)),vec3(0.8));
  gl_FragColor=vec4(col,1.0);
}
`;

var prog=link(VS,FS);
gl.useProgram(prog);
var buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
var aP=gl.getAttribLocation(prog,'aP');
gl.enableVertexAttribArray(aP);
gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);

var U={};
['uRes','uTime','uMouse','uBurst'].forEach(function(n){U[n]=gl.getUniformLocation(prog,n)});

var mx=0.5,my=0.5,tx=0.5,ty=0.5,burstT=-10;
var t0=performance.now();
function nowS(){return (performance.now()-t0)/1000}

function resize(){
  var d=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.max(1,Math.floor(innerWidth*d));
  canvas.height=Math.max(1,Math.floor(innerHeight*d));
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize',resize);
resize();

addEventListener('mousemove',function(e){
  tx=e.clientX/innerWidth;
  ty=1-e.clientY/innerHeight;
});
addEventListener('mousedown',function(){burstT=nowS()});

function frame(){
  var t=nowS();
  mx+=(tx-mx)*0.08;
  my+=(ty-my)*0.08;
  gl.uniform2f(U.uRes,canvas.width,canvas.height);
  gl.uniform1f(U.uTime,t);
  gl.uniform2f(U.uMouse,mx,my);
  gl.uniform1f(U.uBurst,burstT);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
