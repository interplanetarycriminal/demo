<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water Ripples</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#02040a}
  canvas{touch-action:none;display:block;position:fixed;inset:0;cursor:crosshair}
  #ui{position:fixed;top:12px;left:12px;z-index:10;font:12px/1.6 ui-monospace,Menlo,monospace;
      color:#9cf;background:rgba(0,10,25,.5);padding:10px 14px;border:1px solid rgba(120,180,255,.25);
      border-radius:10px;backdrop-filter:blur(6px);max-height:52vh;overflow:auto}
  #ui b{color:#fff;letter-spacing:.12em}
  #ui a{color:#8cf;text-decoration:none}#ui a:hover{text-decoration:underline}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div id="ui"><b>WATER RIPPLES</b><br>move / click = disturb the pool · auto-drips fall<br><a href="index.html">← gallery</a></div>
<canvas id="c"></canvas>
<script>
// 2D wave-equation ripple tank rendered as refracted caustic light.
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,GW,GH,cur,prev,img,data,t=0;
const SCALE=4;                                  // sim cell size in px (perf)
function resize(){
  W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;
  GW=Math.ceil(W/SCALE)+2;GH=Math.ceil(H/SCALE)+2;
  cur=new Float32Array(GW*GH);prev=new Float32Array(GW*GH);
  img=ctx.createImageData(W,H);data=img.data;
}
addEventListener('resize',resize);resize();

function drop(px,py,power){
  const gx=(px/SCALE|0)+1, gy=(py/SCALE|0)+1, r=2;
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){
    const ix=gx+x, iy=gy+y;
    if(ix<1||iy<1||ix>=GW-1||iy>=GH-1)continue;
    if(x*x+y*y<=r*r) cur[iy*GW+ix]-=power;
  }
}
let mx=-1,my=-1;
addEventListener('pointermove',e=>{
  if(mx>=0){drop(e.clientX,e.clientY,6);}          // trail of ripples while moving
  mx=e.clientX;my=e.clientY;
});
addEventListener('pointerdown',e=>drop(e.clientX,e.clientY,140));

function step(){
  t++;
  if(t%50===0) drop(Math.random()*W,Math.random()*H,90);  // ambient rain drops
  // wave propagation
  for(let y=1;y<GH-1;y++){
    for(let x=1;x<GW-1;x++){
      const i=y*GW+x;
      let v=((cur[i-1]+cur[i+1]+cur[i-GW]+cur[i+GW])*0.5)-prev[i];
      v*=0.985;                                   // damping
      prev[i]=v;
    }
  }
  const tmp=cur;cur=prev;prev=tmp;

  // render: height field → shaded refracted light
  for(let y=0;y<H;y++){
    const gy=(y/SCALE|0)+1;
    for(let x=0;x<W;x++){
      const gx=(x/SCALE|0)+1, i=gy*GW+gx;
      const dx=cur[i-1]-cur[i+1], dy=cur[i-GW]-cur[i+GW];   // gradient = surface slope
      const h=cur[i];
      const shade=dx*0.8+dy*0.4;                  // directional light on slopes
      const spec=Math.max(0,shade)*shade*6;       // sharp glints
      const o=(y*W+x)*4;
      const base=14 - h*0.5;
      data[o]  =base + spec*0.9 + Math.max(0,-shade)*8;      // r
      data[o+1]=base*2.2 + shade*10 + spec*1.6;              // g
      data[o+2]=48 - h*1.2 + shade*22 + spec*3.2;            // b (deep blue pool)
      data[o+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  requestAnimationFrame(step);
}
step();
</script>
