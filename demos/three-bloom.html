<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bloom // chrome knot</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#020207}
  canvas{touch-action:none;display:block}
  #hud{position:fixed;top:12px;left:12px;z-index:10;font:11px/1.7 ui-monospace,Menlo,Consolas,monospace;
       color:rgba(200,220,255,.75);background:rgba(5,8,18,.5);border:1px solid rgba(110,160,255,.22);
       border-radius:6px;padding:8px 12px;letter-spacing:.4px;pointer-events:none;max-height:52vh;overflow:auto}
  #hud b{color:#9df;font-size:12px}
  #hud a{color:#f8b;pointer-events:auto;text-decoration:none}
  #hud a:hover{text-decoration:underline}
@media (max-width:640px){#hud{font-size:11px;max-height:40vh}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div id="hud"><b>BLOOM // chrome knot</b><br>drag orbit &middot; wheel zoom &middot; auto-rotates<br><a href="index.html">&larr; gallery</a></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020207);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 300);
camera.position.set(0, 2.4, 7.5);

// soft studio environment so the chrome has something to reflect
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

// chrome torus knot
const knot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(1.5, 0.45, 300, 48),
  new THREE.MeshStandardMaterial({color:0xffffff, metalness:1.0, roughness:0.14, envMapIntensity:0.45})
);
scene.add(knot);

// three orbiting colored point lights + emissive marker orbs
const LIGHTS = [
  {color:0xff2f7a, r:3.4, speed:0.90, phase:0.0, tilt:0.60},
  {color:0x2fd8ff, r:4.0, speed:0.70, phase:2.1, tilt:-0.80},
  {color:0x9a4dff, r:4.6, speed:1.15, phase:4.2, tilt:0.30}
];
for(const L of LIGHTS){
  L.light = new THREE.PointLight(L.color, 90, 0, 2);
  L.orb = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 16, 16),
    new THREE.MeshBasicMaterial({color:L.color})
  );
  scene.add(L.light, L.orb);
}

// 2,000-point starfield shell
const starCount = 2000;
const starPos = new Float32Array(starCount*3);
for(let i=0;i<starCount;i++){
  const r = 45 + Math.random()*55;
  const th = Math.random()*Math.PI*2;
  const ph = Math.acos(2*Math.random()-1);
  starPos[i*3]   = r*Math.sin(ph)*Math.cos(th);
  starPos[i*3+1] = r*Math.cos(ph);
  starPos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
  color:0xbdd2ff, size:0.4, sizeAttenuation:true, transparent:true, opacity:0.85, depthWrite:false
}));
scene.add(stars);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 3.2;
controls.maxDistance = 40;

const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.15, 0.55, 0.25);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  for(const L of LIGHTS){
    const a = t*L.speed + L.phase;
    L.light.position.set(
      Math.cos(a)*L.r,
      Math.sin(a*0.9 + L.phase)*L.r*Math.sin(L.tilt),
      Math.sin(a)*L.r
    );
    L.orb.position.copy(L.light.position);
  }
  knot.rotation.x = t*0.12;
  stars.rotation.y = t*0.012;
  controls.update();
  composer.render();
}
animate();

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  composer.setSize(w, h);
});
</script>
</body>
</html>
