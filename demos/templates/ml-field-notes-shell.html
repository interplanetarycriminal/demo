<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEMO TITLE — ML Field Notes</title>
<style>
/* ===== ML Field Notes design system (shared by every ML/AI demo) =====
   Colour means the same thing in every demo:
   --a coral = class A / "positive"     --b teal = class B / "negative"
   --hl amber = the model's current parameters / guess / selection
   --grad violet = gradients, updates, errors flowing back
   --accent = this demo's signature colour (set per demo) */
:root{
  --bg:#0c0e1a; --bg2:#10132a; --panel:#13162c; --panel2:#181c38; --line:rgba(190,200,255,.10); --line2:rgba(190,200,255,.18);
  --ink:#e9ecfa; --dim:#a2a9c8; --faint:#6b7396;
  --a:#ff7a6b; --b:#3fd0c0; --hl:#ffc857; --grad:#a78bfa; --good:#7ee787; --bad:#ff6b8a;
  --accent:#ffc857;
  --r:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
body{overflow:hidden}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:48px minmax(0,1fr);height:100vh;height:100dvh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#11142a,#0d1020)}
.top a.back{color:var(--dim);text-decoration:none;font-size:13px;white-space:nowrap}
.top a.back:hover{color:var(--ink)}
.top .chip{font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:99px;padding:5px 8px}
.top h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.top .keys{font:11px var(--mono);color:var(--faint);white-space:nowrap}
.stage{position:relative;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 40%,#151a3a 0%,var(--bg) 70%)}
.stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(190,200,255,.07) 1px,transparent 1.3px);background-size:24px 24px;pointer-events:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.caption{position:absolute;left:16px;right:16px;top:14px;max-width:640px;padding:10px 14px;border-radius:10px;background:rgba(12,14,30,.78);border:1px solid var(--line2);backdrop-filter:blur(6px);font-size:14px;line-height:1.45;pointer-events:none;transition:opacity .3s}
.caption b{color:var(--accent)}
.caption:empty{opacity:0}
.dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:99px;background:rgba(12,14,30,.82);border:1px solid var(--line2);backdrop-filter:blur(6px)}
.dock button{border:0;background:transparent;border-radius:99px;min-width:36px;height:34px;padding:0 12px;cursor:pointer;color:var(--ink);white-space:nowrap}
.dock button:hover{background:rgba(255,255,255,.08)}
.dock button.on{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.lesson{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0;display:flex;flex-direction:column}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stat{background:var(--panel);padding:10px 12px}
.stat .k{font:600 10px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.stat .v{font:600 18px/1.3 var(--mono);font-variant-numeric:tabular-nums;margin-top:3px}
.tabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{border:0;background:none;padding:9px 12px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;font-weight:600}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:14px 16px 22px;display:none}
.pane.on{display:block}
.pane h3{margin:14px 0 6px;font-size:13px;letter-spacing:.02em}
.pane p{margin:0 0 10px;color:var(--dim)}
.pane p b,.pane li b{color:var(--ink)}
.lede{font-size:15px;color:var(--ink)!important}
.steps{list-style:none;margin:10px 0 0;padding:0;counter-reset:s}
.steps li{counter-increment:s;border:1px solid var(--line);border-radius:10px;margin:0 0 8px;padding:10px 12px 10px 40px;position:relative;cursor:pointer;color:var(--dim);background:var(--panel2)}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:18px;height:18px;border-radius:99px;display:grid;place-items:center;font:600 11px var(--mono);background:rgba(255,255,255,.07);color:var(--dim)}
.steps li.on{border-color:color-mix(in srgb,var(--accent) 60%,transparent);color:var(--ink)}
.steps li.on::before{background:var(--accent);color:#141414}
.steps li.done::before{content:"✓";background:rgba(126,231,135,.2);color:var(--good)}
.steps li .t{font-weight:650;color:var(--ink);display:block}
.steps li .d{display:none;margin-top:4px}
.steps li.on .d{display:block}
.tournav{display:flex;gap:8px;margin-top:6px}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:9px;padding:7px 12px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#15131a;border-color:transparent;font-weight:650}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px;background:var(--panel2)}
.card .q{color:var(--ink);font-weight:600;margin-bottom:8px}
.card .why{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2);color:var(--dim)}
.card.revealed .why{display:block}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.eq{font:14px/1.7 var(--mono);background:#0e1124;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 12px;overflow-x:auto;white-space:nowrap}
.eq .c-a{color:var(--a)} .eq .c-b{color:var(--b)} .eq .c-hl{color:var(--hl)} .eq .c-g{color:var(--grad)} .eq .c-acc{color:var(--accent)}
.live{font-variant-numeric:tabular-nums;color:var(--hl)}
.ctrl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:10px 0}
.ctrl label{color:var(--dim);font-size:13px}
.ctrl output{font:12px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.ctrl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 10px}
.seg button{border:1px solid var(--line2);background:transparent;border-radius:99px;padding:5px 11px;cursor:pointer;color:var(--dim);font-size:13px}
.seg button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--ink);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.note{border-left:3px solid var(--grad);padding:6px 10px;margin:8px 0 12px;color:var(--dim);background:rgba(167,139,250,.06);border-radius:0 8px 8px 0}
.wild li{margin-bottom:6px;color:var(--dim)}
@media (max-width:880px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:48px 58vh auto;height:auto}
  .stage{height:58vh}
  .lesson{border-left:0;border-top:1px solid var(--line)}
  .top .keys{display:none}
  .caption{font-size:13px;top:10px;left:10px;right:10px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat .v{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.caption{transition:none}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace;max-width:100vw;white-space:pre-wrap';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div class="app">
  <header class="top">
    <a class="back" href="index.html">← Gallery</a>
    <span class="chip">ML / AI</span>
    <h1>DEMO TITLE</h1>
    <span class="sp"></span>
    <span class="keys">Space play · ←/→ tour · R reset</span>
  </header>
  <section class="stage" id="stage">
    <canvas id="c" role="img" aria-label="DESCRIBE WHAT THE CANVAS SHOWS"></canvas>
    <div class="caption" id="caption" aria-live="polite"></div>
    <div class="dock" role="group" aria-label="Simulation controls">
      <button id="bPlay" class="on" aria-label="Pause">❚❚</button>
      <button id="bStep" aria-label="Step once">Step</button>
      <button id="bReset" aria-label="Reset">Reset</button>
      <button id="bSpeed" aria-label="Speed">1×</button>
    </div>
  </section>
  <aside class="lesson">
    <div class="stats" id="stats"><!-- 3 stat tiles: .stat > .k + .v#id --></div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="learn">Learn</button>
      <button role="tab" aria-selected="false" data-tab="try">Try this</button>
      <button role="tab" aria-selected="false" data-tab="math">The math</button>
      <button role="tab" aria-selected="false" data-tab="play">Controls</button>
    </div>
    <div class="pane on" id="p-learn">
      <p class="lede">ONE-SENTENCE INTUITION.</p>
      <ol class="steps" id="steps"></ol>
      <div class="tournav"><button class="btn" id="tPrev">← Back</button><button class="btn primary" id="tNext">Next step →</button></div>
      <h3>In the wild</h3>
      <ul class="wild"><li>WHERE THIS SHOWS UP IN REAL SYSTEMS</li></ul>
    </div>
    <div class="pane" id="p-try"><!-- .card experiments: predict → run → why --></div>
    <div class="pane" id="p-math"><!-- .eq blocks with colour-coded terms + .live spans; .note for misconceptions --></div>
    <div class="pane" id="p-play"><!-- .ctrl sliders, .seg segmented choices --></div>
  </aside>
</div>
<script>
'use strict';
/* ===== shell helpers (keep) ===== */
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d'), stage = $('#stage');
let W = 0, H = 0, DPR = 1;
function resize() {
  const r = stage.getBoundingClientRect(); DPR = Math.min(2, devicePixelRatio || 1);
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (typeof onResize === 'function') onResize();
}
new ResizeObserver(resize).observe(stage); resize();
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
// tabs
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + b.dataset.tab));
});
// playback
let playing = !REDUCED, speed = 1;
const SPEEDS = [0.25, 0.5, 1, 2, 4];
function setPlaying(v) { playing = v; $('#bPlay').textContent = v ? '❚❚' : '▶'; $('#bPlay').classList.toggle('on', v); $('#bPlay').setAttribute('aria-label', v ? 'Pause' : 'Play'); }
$('#bPlay').onclick = () => setPlaying(!playing);
$('#bSpeed').onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; $('#bSpeed').textContent = speed + '×'; };
// tour: STEPS = [{t:'title', d:'html', cap:'stage caption html', go(){ /* set demo state */ }}]
let tour = 0;
function renderSteps() {
  const ol = $('#steps'); ol.innerHTML = '';
  STEPS.forEach((s, i) => { const li = document.createElement('li'); li.className = (i === tour ? 'on' : '') + (i < tour ? ' done' : ''); li.innerHTML = `<span class="t">${s.t}</span><span class="d">${s.d}</span>`; li.onclick = () => goStep(i); ol.appendChild(li); });
  $('#tPrev').disabled = tour === 0; $('#tNext').textContent = tour === STEPS.length - 1 ? 'Start over ↺' : 'Next step →';
}
function goStep(i) { tour = (i + STEPS.length) % STEPS.length; const s = STEPS[tour]; if (s.go) s.go(); $('#caption').innerHTML = s.cap || ''; renderSteps(); }
$('#tPrev').onclick = () => goStep(Math.max(0, tour - 1));
$('#tNext').onclick = () => goStep(tour + 1);
// experiments: TRIES = [{q:'Predict…', run(){…}, why:'html'}]
function renderTries() {
  const p = $('#p-try'); p.innerHTML = '<p>Make a prediction first, then run it. Each experiment sets the demo up for you.</p>';
  TRIES.forEach(x => { const c = document.createElement('div'); c.className = 'card'; c.innerHTML = `<div class="q">${x.q}</div><div class="row"><button class="btn primary">Run it</button><button class="btn">Show why</button></div><div class="why">${x.why}</div>`; const [run, why] = c.querySelectorAll('button'); run.onclick = () => { x.run(); setPlaying(true); }; why.onclick = () => c.classList.toggle('revealed'); p.appendChild(c); });
}
// controls helpers
function slider(parent, id, label, min, max, step, value, fmt, onInput) {
  const d = document.createElement('div'); d.className = 'ctrl';
  d.innerHTML = `<label for="${id}">${label}</label><output id="${id}o"></output><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}">`;
  parent.appendChild(d); const inp = d.querySelector('input'), out = d.querySelector('output');
  const upd = () => { out.textContent = fmt(+inp.value); onInput(+inp.value); }; inp.oninput = upd; upd();
  return { set(v) { inp.value = v; upd(); }, get: () => +inp.value };
}
function seg(parent, options, value, onPick) {
  const d = document.createElement('div'); d.className = 'seg'; parent.appendChild(d);
  const bs = options.map(([v, label]) => { const b = document.createElement('button'); b.textContent = label; b.setAttribute('aria-pressed', v === value); b.onclick = () => set(v); d.appendChild(b); return [v, b]; });
  function set(v) { bs.forEach(([k, b]) => b.setAttribute('aria-pressed', k === v)); onPick(v); }
  return { set };
}
function stat(id, label) { const d = document.createElement('div'); d.className = 'stat'; d.innerHTML = `<div class="k">${label}</div><div class="v" id="${id}">–</div>`; $('#stats').appendChild(d); }
const setText = (id, v) => { const e = document.getElementById(id); if (e && e.textContent !== v) e.textContent = v; };
// keyboard
addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.code === 'Space') { setPlaying(!playing); e.preventDefault(); }
  else if (e.key === 'ArrowRight') goStep(tour + 1);
  else if (e.key === 'ArrowLeft') goStep(Math.max(0, tour - 1));
  else if (e.key === 'r' || e.key === 'R') $('#bReset').click();
});
// wall-clock-locked loop (dt clamped to [0, 0.1] — rAF timestamps can precede performance.now())
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  try { frame(playing ? dt * speed : 0, dt); } catch (err) { window.onerror(err.message, '', 0); return; }
  requestAnimationFrame(loop);
}

// ===== DEMO CODE (replace this block) =====
// /*CORE-START*/ pure model code (no DOM) that node can test /*CORE-END*/
// const STEPS = [...], TRIES = [...];
// function frame(dt, realDt) { update(dt); draw(); }
// $('#bStep').onclick = ...; $('#bReset').onclick = ...;
// renderSteps(); renderTries(); goStep(0); requestAnimationFrame(loop);
// window.__demo = { goStep, setPlaying, state: () => ({...}) };  // screenshot QA hook
</script>
</body>
</html>
