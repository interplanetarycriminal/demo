<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Constellations — living night sky</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#02030a}
#c{display:block;position:fixed;inset:0}
#hud{position:fixed;top:10px;left:12px;z-index:10;font:11px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#aac6ff;background:rgba(3,6,18,.5);border:1px solid rgba(140,170,255,.2);border-radius:8px;padding:7px 10px}
#hud b{color:#fff;letter-spacing:1px}
#hud a{color:#8fe3ff;text-decoration:none}
#hud a:hover{text-decoration:underline}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div id="hud"><b>CONSTELLATIONS</b> — living night sky<br>
move: weave constellations · click: shooting-star burst · <a href="index.html">&larr; gallery</a></div>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
var stars=[],shots=[],mw=document.createElement('canvas'),skyGrad=null;
var mx=-9999,my=-9999;
var NS=350,CR=170,LINK=115;

function rnd(a,b){return a+Math.random()*(b-a)}

function makeStars(){
  stars=[];
  for(var i=0;i<NS;i++){
    var warm=Math.random()<0.38;
    var hue=warm?rnd(25,50):rnd(195,235);
    if(Math.random()<0.1)hue=rnd(300,330);
    stars.push({
      x:Math.random()*W,y:Math.random()*H,
      vx:rnd(-0.045,0.045),vy:rnd(-0.03,0.03),
      r:Math.random()<0.85?rnd(0.5,1.3):rnd(1.4,2.3),
      base:rnd(0.3,0.95),ph:rnd(0,6.283),tw:rnd(0.4,1.8),
      col:'hsl('+hue.toFixed(0)+','+rnd(45,85).toFixed(0)+'%,'+rnd(72,92).toFixed(0)+'%)'
    });
  }
}
function makeMilkyWay(){
  mw.width=W*DPR;mw.height=H*DPR;
  var m=mw.getContext('2d');
  m.setTransform(DPR,0,0,DPR,0,0);
  var ang=rnd(-0.65,-0.35),ca=Math.cos(ang),sa=Math.sin(ang);
  var cx=W*0.55,cy=H*0.45,L=Math.hypot(W,H)*0.7,BW=Math.min(W,H)*0.16;
  m.globalCompositeOperation='lighter';
  for(var g=0;g<26;g++){
    var u=rnd(-L,L),v=(Math.random()+Math.random()-1)*BW*0.8;
    var gx=cx+u*ca-v*sa,gy=cy+u*sa+v*ca,gr=rnd(40,130);
    var rg=m.createRadialGradient(gx,gy,0,gx,gy,gr);
    rg.addColorStop(0,'rgba(120,140,200,0.045)');
    rg.addColorStop(1,'rgba(120,140,200,0)');
    m.fillStyle=rg;
    m.beginPath();m.arc(gx,gy,gr,0,6.283);m.fill();
  }
  for(var i=0;i<900;i++){
    var u2=rnd(-L,L);
    var v2=(Math.random()+Math.random()+Math.random()-1.5)*BW;
    var x=cx+u2*ca-v2*sa,y=cy+u2*sa+v2*ca;
    m.fillStyle='rgba(200,215,255,'+rnd(0.04,0.22).toFixed(3)+')';
    m.fillRect(x,y,rnd(0.5,1.3),rnd(0.5,1.3));
  }
}
function makeSky(){
  skyGrad=ctx.createLinearGradient(0,0,0,H);
  skyGrad.addColorStop(0,'#050818');
  skyGrad.addColorStop(0.55,'#060a1c');
  skyGrad.addColorStop(1,'#02030a');
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  makeSky();makeMilkyWay();makeStars();
}
function spawnShot(x,y,vx,vy,life){
  shots.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,hue:rnd(180,220)});
}
function randomShot(){
  var fromLeft=Math.random()<0.5;
  var x=fromLeft?rnd(-40,W*0.4):rnd(W*0.6,W+40);
  var y=rnd(-30,H*0.45);
  var sp=rnd(6,11),a=fromLeft?rnd(0.35,0.9):Math.PI-rnd(0.35,0.9);
  spawnShot(x,y,Math.cos(a)*sp,Math.sin(a)*sp,rnd(40,70));
}
var last=0;
function frame(ts){
  requestAnimationFrame(frame);
  var t=ts*0.001;
  var f=Math.min(3,(ts-last)/16.7)||1;last=ts;
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,W,H);
  ctx.drawImage(mw,0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  var near=[];
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    s.x+=s.vx*f;s.y+=s.vy*f;
    if(s.x<-5)s.x=W+5;else if(s.x>W+5)s.x=-5;
    if(s.y<-5)s.y=H+5;else if(s.y>H+5)s.y=-5;
    var twk=0.62+0.38*Math.sin(t*s.tw*2+s.ph);
    var a=s.base*twk;
    var dx=s.x-mx,dy=s.y-my,dc=Math.sqrt(dx*dx+dy*dy);
    var boost=0;
    if(dc<CR){boost=1-dc/CR;if(near.length<60)near.push({s:s,d:dc});}
    ctx.globalAlpha=Math.min(1,a+boost*0.7);
    ctx.fillStyle=s.col;
    var rr=s.r*(1+boost*0.7);
    ctx.beginPath();ctx.arc(s.x,s.y,rr,0,6.283);ctx.fill();
    if(s.r>1.4){
      ctx.globalAlpha=a*0.35;
      ctx.fillRect(s.x-rr*3,s.y-0.4,rr*6,0.8);
      ctx.fillRect(s.x-0.4,s.y-rr*3,0.8,rr*6);
    }
  }
  ctx.lineWidth=0.8;
  for(var i2=0;i2<near.length;i2++){
    for(var j=i2+1;j<near.length;j++){
      var A=near[i2],B=near[j];
      var ddx=A.s.x-B.s.x,ddy=A.s.y-B.s.y;
      var pd=Math.sqrt(ddx*ddx+ddy*ddy);
      if(pd<LINK){
        var al=(1-pd/LINK)*(1-Math.max(A.d,B.d)/CR)*0.85;
        if(al>0.02){
          ctx.globalAlpha=al;
          ctx.strokeStyle='hsl(200,90%,80%)';
          ctx.beginPath();ctx.moveTo(A.s.x,A.s.y);ctx.lineTo(B.s.x,B.s.y);ctx.stroke();
        }
      }
    }
  }
  if(Math.random()<0.011*f)randomShot();
  for(var k=shots.length-1;k>=0;k--){
    var sh=shots[k];
    sh.x+=sh.vx*f;sh.y+=sh.vy*f;sh.life-=f;
    if(sh.life<=0||sh.x<-120||sh.x>W+120||sh.y>H+120){shots.splice(k,1);continue;}
    var la=Math.max(0,sh.life/sh.max);
    var tl=Math.min(16,sh.max*0.3);
    var tx=sh.x-sh.vx*tl,ty=sh.y-sh.vy*tl;
    var lg=ctx.createLinearGradient(sh.x,sh.y,tx,ty);
    lg.addColorStop(0,'hsla('+sh.hue.toFixed(0)+',100%,88%,'+(0.95*la).toFixed(3)+')');
    lg.addColorStop(1,'hsla('+sh.hue.toFixed(0)+',100%,70%,0)');
    ctx.globalAlpha=1;
    ctx.strokeStyle=lg;
    ctx.lineWidth=2;
    ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.lineTo(tx,ty);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,'+(0.9*la).toFixed(3)+')';
    ctx.beginPath();ctx.arc(sh.x,sh.y,1.8,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}
addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY});
addEventListener('pointerdown',function(e){
  for(var i=0;i<7;i++){
    var a=rnd(0,6.283),sp=rnd(3.5,8);
    spawnShot(e.clientX,e.clientY,Math.cos(a)*sp,Math.sin(a)*sp,rnd(26,46));
  }
});
addEventListener('resize',resize);
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
