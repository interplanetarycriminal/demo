<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerstner Ocean</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#04060c;}
  canvas{display:block;}
  #ui{position:fixed;top:12px;left:12px;z-index:10;color:#cfe;font:12px/1.6 monospace;
       background:rgba(8,10,20,.45);padding:10px 13px;border-radius:8px;
       border:1px solid rgba(120,160,220,.2);backdrop-filter:blur(3px);}
  #ui h1{margin:0 0 3px;font-size:12px;letter-spacing:2px;color:#fff;font-weight:600;}
  #ui .hint{opacity:.65;}
  #ui a{color:#8bf;text-decoration:none;}
  #ui a:hover{text-decoration:underline;}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div id="ui">
  <h1>GERSTNER OCEAN</h1>
  <div class="hint">drag &middot; look &nbsp; scroll &middot; wave height</div>
  <a href="index.html">&larr; gallery</a>
</div>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 4000);

const SUN = new THREE.Vector3(-0.35, 0.16, -1).normalize();

// ---- sky dome ----
const sky = new THREE.Mesh(new THREE.SphereGeometry(1800,32,16), new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false,
  uniforms:{ uSun:{value:SUN} },
  vertexShader:`varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    varying vec3 vDir; uniform vec3 uSun;
    void main(){
      vec3 d = normalize(vDir);
      float h = clamp(d.y*.5+.5, 0.0, 1.0);
      vec3 top = vec3(.02,.05,.13), horizon = vec3(.16,.24,.34);
      vec3 c = mix(horizon, top, pow(h,.8));
      float s = max(dot(d, uSun), 0.0);
      c += vec3(1.0,.78,.5) * pow(s, 90.0) * 1.6;
      c += vec3(.55,.4,.32) * pow(s, 5.0) * .35;
      gl_FragColor = vec4(c,1.0);
    }`
}));
scene.add(sky);

// ---- ocean ----
const geo = new THREE.PlaneGeometry(2400, 2400, 320, 320);
geo.rotateX(-Math.PI/2);
const waterMat = new THREE.ShaderMaterial({
  uniforms:{
    uTime:{value:0}, uWaveHeight:{value:1.0}, uCamPos:{value:new THREE.Vector3()}, uSun:{value:SUN}
  },
  vertexShader:`
    uniform float uTime, uWaveHeight;
    varying vec3 vWorld, vNormal; varying float vH;
    // wave = vec4(dirx, dirz, steepness, wavelength)
    vec3 gerstner(vec4 w, vec3 p, inout vec3 dT, inout vec3 dB){
      float k = 6.2831853/w.w;
      float c = sqrt(9.8/k);
      vec2 d = normalize(w.xy);
      float f = k*(dot(d,p.xz) - c*uTime);
      float a = w.z/k;
      float sf = sin(f), cf = cos(f);
      dT += vec3(-d.x*d.x*(w.z*sf), d.x*(w.z*cf), -d.x*d.y*(w.z*sf));
      dB += vec3(-d.x*d.y*(w.z*sf), d.y*(w.z*cf), -d.y*d.y*(w.z*sf));
      return vec3(d.x*a*cf, a*sf, d.y*a*cf);
    }
    void main(){
      vec3 p = position;
      vec3 dT = vec3(0.0), dB = vec3(0.0), disp = vec3(0.0);
      disp += gerstner(vec4( 1.0, 0.6, .28, 42.0), p, dT, dB);
      disp += gerstner(vec4(-0.7, 1.0, .22, 27.0), p, dT, dB);
      disp += gerstner(vec4( 0.4,-0.9, .20, 16.0), p, dT, dB);
      disp += gerstner(vec4( 1.0,-0.2, .14,  9.0), p, dT, dB);
      p += disp * uWaveHeight;
      vec3 T = vec3(1.0,0.0,0.0) + dT*uWaveHeight;
      vec3 B = vec3(0.0,0.0,1.0) + dB*uWaveHeight;
      vNormal = normalize(cross(B, T));
      vH = p.y;
      vec4 wp = modelMatrix*vec4(p,1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader:`
    uniform vec3 uCamPos, uSun;
    varying vec3 vWorld, vNormal; varying float vH;
    void main(){
      vec3 N = normalize(vNormal);
      vec3 V = normalize(uCamPos - vWorld);
      float fres = pow(1.0 - max(dot(N,V),0.0), 4.0);
      vec3 deep = vec3(.01,.05,.13), shallow = vec3(.0,.35,.5);
      vec3 col = mix(deep, shallow, clamp(vH*.35+.5, 0.0, 1.0));
      vec3 sky = vec3(.22,.34,.46);
      col = mix(col, sky, fres*.7);
      // sun glint
      vec3 Hn = normalize(uSun + V);
      col += vec3(1.0,.92,.72) * pow(max(dot(N,Hn),0.0), 260.0) * 2.4;
      col += vec3(.08,.16,.2) * max(dot(N,uSun),0.0);
      // fog to horizon
      float dist = length(uCamPos - vWorld);
      float fog = clamp(exp(-dist*0.0042), 0.0, 1.0);
      col = mix(vec3(.16,.24,.34), col, fog);
      gl_FragColor = vec4(col, 1.0);
    }`
});
const ocean = new THREE.Mesh(geo, waterMat);
scene.add(ocean);

// ---- look controls ----
let yaw = 0, pitch = -0.06, drag = false, px = 0, py = 0, waveH = 1.0;
renderer.domElement.addEventListener('pointerdown', e=>{drag=true; px=e.clientX; py=e.clientY;});
addEventListener('pointerup', ()=>drag=false);
addEventListener('pointermove', e=>{
  if(!drag) return;
  yaw -= (e.clientX-px)*.003; pitch -= (e.clientY-py)*.003;
  pitch = Math.max(-0.5, Math.min(0.35, pitch));
  px = e.clientX; py = e.clientY;
});
addEventListener('wheel', e=>{
  waveH = Math.max(0.25, Math.min(2.8, waveH + (e.deltaY>0?-0.12:0.12)));
  waterMat.uniforms.uWaveHeight.value = waveH;
}, {passive:true});

// ---- bloom (sun glint glow) ----
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), .7, .5, .55));

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});

const clock = new THREE.Clock(), euler = new THREE.Euler(0,0,0,'YXZ');
(function loop(){
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  waterMat.uniforms.uTime.value = t;
  // camera bob just above the surface
  camera.position.set(Math.sin(t*.23)*1.6, 3.1 + Math.sin(t*.9)*.28, 9 + Math.cos(t*.19)*1.4);
  euler.set(pitch + Math.sin(t*.7)*.012, yaw, Math.sin(t*.5)*.012);
  camera.quaternion.setFromEuler(euler);
  ocean.position.set(camera.position.x, 0, camera.position.z);   // keep sea under viewer
  sky.position.copy(camera.position);
  waterMat.uniforms.uCamPos.value.copy(camera.position);
  composer.render();
})();
</script>
</body>
</html>
