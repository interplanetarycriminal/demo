<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slime Mold</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}
  canvas{touch-action:none;display:block;position:fixed;inset:0;width:100vw;height:100vh;cursor:crosshair}
  #ui{position:fixed;top:12px;left:12px;z-index:10;font:12px/1.6 ui-monospace,Menlo,monospace;
      color:#cfa;background:rgba(8,20,5,.5);padding:10px 14px;border:1px solid rgba(180,255,140,.25);
      border-radius:10px;backdrop-filter:blur(6px);max-height:52vh;overflow:auto}
  #ui b{color:#fff;letter-spacing:.12em}#ui a{color:#af8;text-decoration:none}
  #ui a:hover{text-decoration:underline}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div id="ui"><b>SLIME MOLD</b> <span style="opacity:.7">physarum</span><br>move = lure the swarm · click = new species<br><a href="index.html">← gallery</a></div>
<canvas id="c"></canvas>
<script>
// Physarum polycephalum: agents deposit pheromone, steer toward it, trails diffuse & decay.
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,trail,trail2,img,N=14000,ag;
function resize(){
  const s=Math.min(1,900/innerWidth);                 // internal res cap for perf
  W=Math.max(320,innerWidth*s|0); H=Math.max(240,innerHeight*s|0);
  cv.width=W;cv.height=H;
  trail=new Float32Array(W*H); trail2=new Float32Array(W*H);
  img=ctx.createImageData(W,H);
  seed();
}
let SA,SD,TA,SP,hue;                                   // species params
function species(){
  SA=(0.3+Math.random()*0.8);                          // sensor angle
  SD=6+Math.random()*14;                               // sensor distance
  TA=(0.25+Math.random()*0.5);                         // turn angle
  SP=1.0+Math.random()*1.4;                            // speed
  hue=Math.random()*360;
}
function seed(){
  ag=new Float32Array(N*3);                            // x,y,heading
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2, r=Math.random()*Math.min(W,H)*0.3;
    ag[i*3]=W/2+Math.cos(a)*r; ag[i*3+1]=H/2+Math.sin(a)*r; ag[i*3+2]=Math.random()*Math.PI*2;
  }
}
species();resize();
addEventListener('resize',resize);
let mx=-1,my=-1;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*W;my=e.clientY/innerHeight*H;});
addEventListener('pointerdown',()=>{species();});
addEventListener('pointerleave',()=>{mx=-1;});

function sense(x,y,a){
  const sx=x+Math.cos(a)*SD, sy=y+Math.sin(a)*SD;
  const ix=sx|0, iy=sy|0;
  if(ix<0||iy<0||ix>=W||iy>=H)return 0;
  return trail[iy*W+ix];
}
function frame(){
  // mouse lure: deposit attractant at cursor
  if(mx>=0){
    for(let k=0;k<6;k++){
      const dx=(Math.random()-.5)*10, dy=(Math.random()-.5)*10;
      const ix=(mx+dx)|0, iy=(my+dy)|0;
      if(ix>=0&&iy>=0&&ix<W&&iy<H) trail[iy*W+ix]+=2.5;
    }
  }
  // agents: sense → steer → move → deposit
  for(let i=0;i<N;i++){
    let x=ag[i*3], y=ag[i*3+1], a=ag[i*3+2];
    const F=sense(x,y,a), L=sense(x,y,a-SA), R=sense(x,y,a+SA);
    if(F>L&&F>R){}                                     // keep straight
    else if(L>R) a-=TA*(0.7+Math.random()*0.6);
    else if(R>L) a+=TA*(0.7+Math.random()*0.6);
    else a+=(Math.random()-.5)*TA;
    x+=Math.cos(a)*SP; y+=Math.sin(a)*SP;
    if(x<0)x+=W; if(x>=W)x-=W; if(y<0)y+=H; if(y>=H)y-=H;   // wrap
    ag[i*3]=x; ag[i*3+1]=y; ag[i*3+2]=a;
    trail[(y|0)*W+(x|0)]+=1;
  }
  // diffuse (3x3 mean) + decay
  for(let y=0;y<H;y++){
    const up=((y-1+H)%H)*W, mid=y*W, dn=((y+1)%H)*W;
    for(let x=0;x<W;x++){
      const l=(x-1+W)%W, r=(x+1)%W;
      const v=(trail[up+l]+trail[up+x]+trail[up+r]+
               trail[mid+l]+trail[mid+x]+trail[mid+r]+
               trail[dn+l]+trail[dn+x]+trail[dn+r])/9;
      trail2[mid+x]=v*0.94;                            // decay
    }
  }
  const t=trail; trailBuf(); function trailBuf(){}     // noop keeps minifier honest
  const tmp=trail; trail=trail2; trail2=tmp;

  // render with a two-tone glow palette
  const d=img.data, h1=hue, h2=(hue+70)%360;
  const [r1,g1,b1]=hsl(h1,100,55), [r2,g2,b2]=hsl(h2,100,70);
  for(let i=0;i<W*H;i++){
    const v=Math.min(1,trail[i]*0.22);
    const w=v*v;                                       // hot cores
    d[i*4]  =v*r1+w*(r2-r1)*1.2;
    d[i*4+1]=v*g1+w*(g2-g1)*1.2;
    d[i*4+2]=v*b1+w*(b2-b1)*1.2;
    d[i*4+3]=255;
  }
  ctx.putImageData(img,0,0);
  requestAnimationFrame(frame);
}
function hsl(h,s,l){                                    // hsl → rgb 0-255
  s/=100;l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [f(0)*255,f(8)*255,f(4)*255];
}
frame();
</script>
