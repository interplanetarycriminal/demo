<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fractal Construction — Depth by Depth</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#020308}
canvas{position:fixed;inset:0;display:block;cursor:pointer}
#ui{position:fixed;top:12px;left:12px;z-index:10;font:12px/1.55 ui-monospace,Consolas,Menlo,monospace;
 color:#9fd0f5;background:rgba(7,12,24,.74);border:1px solid rgba(80,170,255,.25);border-radius:10px;
 padding:10px 14px;max-width:340px;backdrop-filter:blur(3px)}
#ui h1{margin:0 0 4px;font-size:14px;letter-spacing:.5px;color:#fff;text-shadow:0 0 10px #83f}
#ui .dim{color:#647d9e;font-size:11px}
#ui a{color:#69e6b8;text-decoration:none}
#stats{margin-top:6px;color:#ffd76e;white-space:pre}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="cv"></canvas>
<div id="ui">
<h1>FRACTALS, DEPTH BY DEPTH</h1>
<div>A fractal is one simple rule fed its own output — watch each recursion depth get built live as every piece splits, and the counts explode geometrically.</div>
<div class="dim">click = next fractal &middot; wheel = zoom &middot; auto-cycles forever</div>
<div id="stats"></div>
<div class="dim"><a href="index.html">← gallery</a></div>
</div>
<script>
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,fit=1,WORLD=1000;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);fit=Math.min(W,H)/WORLD;}
addEventListener('resize',resize);resize();
var view={s:1,ox:0,oy:0};
addEventListener('wheel',function(e){
 e.preventDefault();
 var k=Math.exp(-e.deltaY*0.0012);
 var s2=Math.min(60,Math.max(0.3,view.s*k));k=s2/view.s;
 var qx=e.clientX-W/2,qy=e.clientY-H/2;
 view.ox=qx-(qx-view.ox)*k;view.oy=qy-(qy-view.oy)*k;view.s=s2;
},{passive:false});
addEventListener('click',function(){switchFractal((fi+1)%3);});
function ease(t){return t*t*(3-2*t);}
var fi=0,D=0,t=0,phase='grow',holdT=0,TRANS=1.5,HOLD=2.2;
var segs=[],tris=[],hsegs=[],hLast=[],hfront=[],hLen=0;
var FR=[
 {name:'KOCH SNOWFLAKE  (each segment → 4)',max:6,hue:185,unit:'segments'},
 {name:'SIERPINSKI TRIANGLE  (each △ → 3)',max:7,hue:300,unit:'triangles'},
 {name:'H-TREE  (each tip → 2 branches)',max:8,hue:120,unit:'branches'}
];
function initF(){
 var i,a;
 if(fi===0){
  var R=360,P=[];
  for(i=0;i<3;i++){a=-Math.PI/2+i*2*Math.PI/3;P.push([Math.cos(a)*R,Math.sin(a)*R]);}
  segs=[[P[0][0],P[0][1],P[1][0],P[1][1]],
        [P[1][0],P[1][1],P[2][0],P[2][1]],
        [P[2][0],P[2][1],P[0][0],P[0][1]]];
 }else if(fi===1){
  var R2=430,v=[];
  for(i=0;i<3;i++){a=-Math.PI/2+i*2*Math.PI/3;v.push(Math.cos(a)*R2,Math.sin(a)*R2);}
  tris=[v];
 }else{
  var s0={cx:0,cy:0,hx:255,hy:0,d:0};
  hsegs=[s0];hLast=[s0];hLen=510;hfront=hChildren(hLast);
 }
}
function switchFractal(i){fi=i;D=0;t=0;phase='grow';holdT=0;view={s:1,ox:0,oy:0};initF();}
function kochSub(s,tt,out){
 var ax=s[0],ay=s[1],bx=s[2],by=s[3];
 var dx=bx-ax,dy=by-ay;
 var p1x=ax+dx/3,p1y=ay+dy/3,p2x=ax+dx*2/3,p2y=ay+dy*2/3;
 var f=0.288675*tt;
 var qx=ax+dx/2+dy*f,qy=ay+dy/2-dx*f;
 out.push([ax,ay,p1x,p1y],[p1x,p1y,qx,qy],[qx,qy,p2x,p2y],[p2x,p2y,bx,by]);
}
function sierpChildren(v,tt,out){
 for(var i=0;i<3;i++){
  var ax=v[i*2],ay=v[i*2+1];
  var j=(i+1)%3,k=(i+2)%3;
  var bx0=v[j*2],by0=v[j*2+1],cx0=v[k*2],cy0=v[k*2+1];
  out.push([ax,ay,
   bx0+((ax+bx0)/2-bx0)*tt, by0+((ay+by0)/2-by0)*tt,
   cx0+((ax+cx0)/2-cx0)*tt, cy0+((ay+cy0)/2-cy0)*tt]);
 }
}
function hChildren(gen){
 var out=[];
 for(var i=0;i<gen.length;i++){
  var s=gen[i],hl=Math.hypot(s.hx,s.hy);
  var ux=-s.hy/hl,uy=s.hx/hl,nh=hl/Math.SQRT2;
  out.push({cx:s.cx+s.hx,cy:s.cy+s.hy,hx:ux*nh,hy:uy*nh,d:s.d+1});
  out.push({cx:s.cx-s.hx,cy:s.cy-s.hy,hx:ux*nh,hy:uy*nh,d:s.d+1});
 }
 return out;
}
function commit(){
 var i;
 if(fi===0){
  var ns=[];for(i=0;i<segs.length;i++)kochSub(segs[i],1,ns);segs=ns;
 }else if(fi===1){
  var nt=[];for(i=0;i<tris.length;i++)sierpChildren(tris[i],1,nt);tris=nt;
 }else{
  for(i=0;i<hfront.length;i++)hLen+=Math.hypot(hfront[i].hx,hfront[i].hy)*2;
  hsegs=hsegs.concat(hfront);hLast=hfront;hfront=hChildren(hLast);
 }
}
function tick(dt){
 if(phase==='grow'){
  t+=dt/TRANS;
  if(t>=1){t=0;D++;commit();if(D>=FR[fi].max){phase='hold';holdT=0;}}
 }else{
  holdT+=dt;
  if(holdT>=HOLD)switchFractal((fi+1)%3);
 }
}
var count=0,totLen=0;
function drawKoch(tt,hs,sc){
 var list,i;
 if(tt>0){list=[];for(i=0;i<segs.length;i++)kochSub(segs[i],tt,list);}
 else list=segs;
 var hue=(FR[0].hue+hs*42)%360;
 ctx.strokeStyle='hsl('+hue+',100%,62%)';
 ctx.lineWidth=1.7/sc;
 ctx.shadowColor='hsl('+hue+',100%,55%)';ctx.shadowBlur=12;
 ctx.beginPath();
 for(i=0;i<list.length;i++){
  var s=list[i];
  ctx.moveTo(s[0],s[1]);ctx.lineTo(s[2],s[3]);
  var dx=s[2]-s[0],dy=s[3]-s[1];
  totLen+=Math.sqrt(dx*dx+dy*dy);
 }
 ctx.stroke();ctx.shadowBlur=0;
 count=list.length;
}
function drawSierp(tt,hs,sc){
 var list,i;
 if(tt>0){list=[];for(i=0;i<tris.length;i++)sierpChildren(tris[i],tt,list);}
 else list=tris;
 var hue=(FR[1].hue+hs*30)%360;
 var al=tt>0?(0.10+0.16*tt):0.26;
 ctx.lineWidth=1/sc;
 ctx.fillStyle='hsla('+hue+',95%,55%,'+al.toFixed(3)+')';
 ctx.strokeStyle='hsla('+hue+',100%,72%,.85)';
 for(i=0;i<list.length;i++){
  var v=list[i];
  ctx.beginPath();ctx.moveTo(v[0],v[1]);ctx.lineTo(v[2],v[3]);ctx.lineTo(v[4],v[5]);ctx.closePath();
  ctx.fill();ctx.stroke();
  totLen+=Math.hypot(v[2]-v[0],v[3]-v[1])*3;
 }
 count=list.length;
}
function hDraw(s,k,sc){
 var hue=(FR[2].hue+s.d*33)%360;
 ctx.strokeStyle='hsl('+hue+',100%,'+(70-s.d*3)+'%)';
 ctx.lineWidth=Math.max(0.8,7-s.d*0.75)/sc;
 ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=8;
 ctx.beginPath();
 ctx.moveTo(s.cx-s.hx*k,s.cy-s.hy*k);
 ctx.lineTo(s.cx+s.hx*k,s.cy+s.hy*k);
 ctx.stroke();
}
function drawH(tt,sc){
 var i;
 ctx.lineCap='round';
 for(i=0;i<hsegs.length;i++)hDraw(hsegs[i],1,sc);
 if(tt>0)for(i=0;i<hfront.length;i++)hDraw(hfront[i],tt,sc);
 ctx.lineCap='butt';ctx.shadowBlur=0;
 count=hsegs.length+(tt>0?hfront.length:0);
 totLen=hLen;
 if(tt>0)for(i=0;i<hfront.length;i++)totLen+=Math.hypot(hfront[i].hx,hfront[i].hy)*2*tt;
}
function draw(){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 var g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.75);
 g.addColorStop(0,'#080c18');g.addColorStop(1,'#020308');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 var sc=fit*view.s*0.9;
 ctx.setTransform(DPR*sc,0,0,DPR*sc,DPR*(W/2+view.ox),DPR*(H/2+view.oy));
 count=0;totLen=0;
 var tt=(phase==='grow')?ease(t):0;
 var hs=D+(phase==='grow'?t:0);
 if(fi===0)drawKoch(tt,hs,sc);
 else if(fi===1)drawSierp(tt,hs,sc);
 else drawH(tt,sc);
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
function stats(){
 var F=FR[fi];
 var dshow=(phase==='grow'?D+t:D).toFixed(2);
 document.getElementById('stats').textContent=
  F.name+'\n'+
  'depth '+dshow+' / '+F.max+'\n'+
  F.unit+' '+count.toLocaleString()+'\n'+
  'total length '+Math.round(totLen).toLocaleString()+' u\n'+
  'zoom '+view.s.toFixed(2)+'x'+
  (phase==='hold'?'\nmax depth reached — next fractal…':'');
}
var last=performance.now();
function frame(now){
 var dt=Math.min(0.05,(now-last)/1000);last=now;
 tick(dt);draw();stats();requestAnimationFrame(frame);
}
switchFractal(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
