<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Flappy</title>
<style>
html,body{margin:0;height:100%;background:#030310;overflow:hidden}
canvas{display:block;touch-action:none}
#ui{position:fixed;top:10px;left:10px;z-index:10;font:12px/1.6 monospace;color:rgba(160,255,255,.85);background:rgba(4,8,24,.55);border:1px solid rgba(0,255,255,.25);border-radius:8px;padding:8px 12px;max-height:52vh;overflow:auto}
#ui b{color:#0ff;text-shadow:0 0 8px #0ff}
#ui a{color:#f6f;text-decoration:none}
#ui a:hover{text-shadow:0 0 8px #f6f}
@media (max-width:640px){#ui{font-size:11px;max-height:40vh}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<div id="ui"><b>NEON FLAPPY</b><br>Space / click to flap · R restart<br><a href="index.html">← gallery</a></div>
<canvas id="c"></canvas>
<script>
'use strict';
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  initStars();
}
function rnd(a,b){return a+Math.random()*(b-a)}
var stars1=[],stars2=[];
function initStars(){
  stars1=[];stars2=[];
  for(var i=0;i<70;i++)stars1.push({x:Math.random()*W,y:Math.random()*H,r:rnd(.4,1.1),tw:Math.random()*6.28});
  for(var j=0;j<40;j++)stars2.push({x:Math.random()*W,y:Math.random()*H,r:rnd(.9,1.9),tw:Math.random()*6.28});
}
window.addEventListener('resize',resize);resize();

var PWID=68,HUES=[185,320,265,140];
var bird,pipes,particles,trail,score,speed,state,deathT,t=0,gridX=0,best=0;
function reset(){
  bird={x:Math.max(110,W*.28),y:H/2,vy:0,r:12};
  pipes=[];particles=[];trail=[];score=0;speed=3;state='ready';
}
reset();

function burst(x,y,n,hue,sp){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,v=rnd(.6,sp);
    particles.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(22,60),max:60,hue:hue+rnd(-25,25),r:rnd(1,3.2)});
  }
}
function die(){
  if(state!=='play')return;
  state='dead';deathT=performance.now();
  burst(bird.x,bird.y,45,50,7);
  burst(bird.x,bird.y,25,320,5);
}
function flap(){
  if(state==='ready'){state='play';bird.vy=-8.3}
  else if(state==='play'){
    bird.vy=-8.3;
    for(var i=0;i<3;i++)particles.push({x:bird.x-6,y:bird.y+8,vx:rnd(-1.5,.5),vy:rnd(1,3),life:rnd(10,20),max:20,hue:rnd(35,60),r:rnd(1,2)});
  }
  else if(state==='dead'&&performance.now()-deathT>500)reset();
}
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}
  if((e.code==='KeyR'||e.code==='Enter')&&state==='dead')reset();
});
window.addEventListener('mousedown',flap);
window.addEventListener('touchstart',function(e){e.preventDefault();flap()},{passive:false});

function update(){
  t++;
  var base=state==='play'?speed:(state==='dead'?.5:1.4);
  gridX=(gridX+base*.9)%80;
  for(var i=0;i<stars1.length;i++){var s=stars1[i];s.x-=base*.15;if(s.x<-2){s.x=W+2;s.y=Math.random()*H}}
  for(var j=0;j<stars2.length;j++){var s2=stars2[j];s2.x-=base*.4;if(s2.x<-2){s2.x=W+2;s2.y=Math.random()*H}}

  if(state==='ready'){
    bird.y=H/2+Math.sin(t*.05)*14;bird.vy=0;
    trail.push({x:bird.x,y:bird.y});if(trail.length>16)trail.shift();
  }
  if(state==='play'){
    bird.vy+=.45;
    if(bird.vy>11)bird.vy=11;
    bird.y+=bird.vy;
    if(bird.y<bird.r){bird.y=bird.r;bird.vy=Math.max(bird.vy,0)}
    if(bird.y>H-bird.r)die();
    trail.push({x:bird.x,y:bird.y});if(trail.length>16)trail.shift();

    if(pipes.length===0||pipes[pipes.length-1].x<W-Math.max(230,320-score*4)){
      var gapH=Math.max(148,235-score*3.5),m=60;
      var gc=m+gapH/2+Math.random()*Math.max(10,H-2*m-gapH);
      pipes.push({x:W+40,gc:gc,gh:gapH,passed:false,hue:HUES[Math.floor(Math.random()*4)]});
    }
    var hb=9;
    for(var k=pipes.length-1;k>=0;k--){
      var p=pipes[k];
      p.x-=speed;
      if(p.x<-120){pipes.splice(k,1);continue}
      if(!p.passed&&p.x+PWID<bird.x){
        p.passed=true;score++;
        if(score>best)best=score;
        speed=Math.min(7,3+score*.12);
        burst(bird.x+16,bird.y,10,p.hue,3.5);
      }
      if(bird.x+hb>p.x&&bird.x-hb<p.x+PWID){
        if(bird.y-hb<p.gc-p.gh/2||bird.y+hb>p.gc+p.gh/2)die();
      }
    }
  }
  for(var q=particles.length-1;q>=0;q--){
    var pt=particles[q];
    pt.x+=pt.vx;pt.y+=pt.vy;pt.vx*=.97;pt.vy*=.97;pt.life--;
    if(pt.life<=0)particles.splice(q,1);
  }
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#030310';ctx.fillRect(0,0,W,H);

  for(var i=0;i<stars1.length;i++){
    var s=stars1[i];
    ctx.globalAlpha=.35+.3*Math.sin(s.tw+t*.03);
    ctx.fillStyle='#7ac';
    ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  for(var j=0;j<stars2.length;j++){
    var s2=stars2[j];
    ctx.globalAlpha=.5+.4*Math.sin(s2.tw+t*.05);
    ctx.fillStyle='#cef';
    ctx.fillRect(s2.x,s2.y,s2.r,s2.r);
  }
  ctx.globalAlpha=1;

  var gy=H*.8;
  ctx.strokeStyle='rgba(255,40,255,.16)';ctx.lineWidth=1;
  for(var g=1;g<=6;g++){
    var f=g/6,y=gy+(H-gy)*f*f;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  for(var x=-gridX;x<W;x+=80){
    ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x,H);ctx.stroke();
  }
  ctx.strokeStyle='rgba(255,40,255,.55)';ctx.shadowColor='#f0f';ctx.shadowBlur=10;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();
  ctx.shadowBlur=0;

  for(var k=0;k<pipes.length;k++){
    var p=pipes[k],col='hsl('+p.hue+',100%,60%)';
    var top=p.gc-p.gh/2,bot=p.gc+p.gh/2;
    ctx.fillStyle='hsla('+p.hue+',100%,60%,.10)';
    ctx.strokeStyle=col;ctx.shadowColor=col;ctx.shadowBlur=16;ctx.lineWidth=2.5;
    ctx.fillRect(p.x,0,PWID,top);ctx.strokeRect(p.x,-4,PWID,top+4);
    ctx.fillRect(p.x,bot,PWID,H-bot);ctx.strokeRect(p.x,bot,PWID,H-bot+8);
    ctx.fillStyle='hsla('+p.hue+',100%,60%,.22)';
    ctx.fillRect(p.x-5,top-12,PWID+10,12);
    ctx.fillRect(p.x-5,bot,PWID+10,12);
  }
  ctx.shadowBlur=0;

  ctx.globalCompositeOperation='lighter';
  for(var tr=0;tr<trail.length;tr++){
    var f2=(tr+1)/trail.length;
    ctx.globalAlpha=f2*.35;
    ctx.fillStyle='hsl(48,100%,65%)';
    ctx.shadowColor='#fc0';ctx.shadowBlur=14;
    ctx.beginPath();ctx.arc(trail[tr].x-(trail.length-tr)*2,trail[tr].y,bird.r*f2*.8,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(state!=='dead'){
    ctx.fillStyle='#ffd24a';ctx.shadowColor='#ffb300';ctx.shadowBlur=26;
    ctx.beginPath();ctx.arc(bird.x,bird.y,bird.r,0,6.283);ctx.fill();
    ctx.fillStyle='#fff';ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(bird.x+3,bird.y-3,bird.r*.4,0,6.283);ctx.fill();
  }
  for(var q=0;q<particles.length;q++){
    var pt=particles[q],tt=Math.max(pt.life/pt.max,0);
    ctx.globalAlpha=tt;
    var col2='hsl('+pt.hue+',100%,'+(55+tt*30)+'%)';
    ctx.fillStyle=col2;ctx.shadowColor=col2;ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r*tt+.4,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ctx.shadowBlur=0;

  ctx.textAlign='center';
  ctx.font='bold 54px monospace';
  ctx.fillStyle='rgba(0,255,255,.95)';ctx.shadowColor='#0ff';ctx.shadowBlur=20;
  ctx.fillText(score,W/2,86);
  ctx.font='14px monospace';
  ctx.fillStyle='rgba(160,255,255,.7)';ctx.shadowBlur=0;
  ctx.fillText('BEST '+best,W/2,108);

  if(state==='ready'){
    ctx.globalAlpha=.6+.4*Math.sin(t*.08);
    ctx.font='20px monospace';
    ctx.fillStyle='#0ff';ctx.shadowColor='#0ff';ctx.shadowBlur=14;
    ctx.fillText('press SPACE / click to flap',W/2,H/2-80);
    ctx.globalAlpha=1;ctx.shadowBlur=0;
  }
  if(state==='dead'){
    ctx.fillStyle='#f4f';ctx.shadowColor='#f4f';ctx.shadowBlur=26;
    ctx.font='bold 48px monospace';
    ctx.fillText('WRECKED',W/2,H/2-24);
    ctx.font='18px monospace';
    ctx.fillStyle='#0ff';ctx.shadowColor='#0ff';ctx.shadowBlur=10;
    ctx.fillText('score '+score+' · best '+best,W/2,H/2+12);
    ctx.fillText('press SPACE / R to restart',W/2,H/2+40);
    ctx.shadowBlur=0;
  }
}
function loop(){update();draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
