<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Raycaster</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000}
canvas{touch-action:none;position:fixed;inset:0;display:block}
.hud{position:fixed;top:16px;left:16px;z-index:20;color:rgba(190,230,255,.78);font:12px/1.7 ui-monospace,Menlo,Consolas,monospace;background:rgba(4,8,16,.55);border:1px solid rgba(0,238,255,.22);padding:10px 14px;border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none;max-height:52vh;overflow:auto}
.hud h1{font-size:13px;font-weight:700;letter-spacing:.22em;color:#7df3ff;text-shadow:0 0 10px rgba(0,238,255,.7)}
.hud .hint{opacity:.75}
.hud a{color:#ff6fe0;text-decoration:none;pointer-events:auto}
.hud a:hover{text-shadow:0 0 8px rgba(255,64,208,.9)}
@media (max-width:640px){.hud{font-size:11px;max-height:40vh}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<canvas id="c"></canvas>
<div class="hud">
  <h1>NEON RAYCASTER</h1>
  <div class="hint">W/S move · A/D strafe · ←/→ or Q/E turn</div>
  <a href="index.html">← gallery</a>
</div>
<script>
"use strict";
var can=document.getElementById('c');
var ctx=can.getContext('2d');
var buf=document.createElement('canvas');
var bctx=buf.getContext('2d');
var DPR=1,W=0,H=0,BW=340,BH=0;

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  can.width=Math.floor(W*DPR);can.height=Math.floor(H*DPR);
  can.style.width=W+'px';can.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=false;
  BW=340;BH=Math.max(120,Math.round(BW*H/W));
  buf.width=BW;buf.height=BH;
}
addEventListener('resize',resize);
resize();

// hardcoded 24x24 map: 0 empty, 1-4 wall types (rows built from 4-char chunks)
var MS=[
"111111111111111111111111",
"1..."+"...."+"..2."+"...."+"...."+"...1",
"1.33"+"33.."+"..2."+"..44"+"44.."+"...1",
"1.3."+"...."+"..2."+"...."+".4.."+"...1",
"1.3."+"...."+"...."+"..4."+".4.."+"...1",
"1.33"+"3..."+"..2."+"..44"+"44.."+"...1",
"1..."+"...."+"..2."+"...."+"...."+"...1",
"1..."+"..22"+"2.22"+"22.."+"...."+"...1",
"1..."+"...."+"...."+"...."+"..33"+"3..1",
"1..."+"...."+"...."+"...."+"..3."+"...1",
"1..2"+"2..."+".333"+"3..."+"..3."+"...1",
"1..2"+"...."+".3.."+"...."+"...."+"...1",
"1..2"+"...."+".3.."+"...."+"..3."+"...1",
"1..2"+"2..."+".333"+"3..."+"..3."+"...1",
"1..."+"...."+"...."+"...."+"..33"+"3..1",
"1..."+"...."+"...."+"...."+"...."+"...1",
"1.44"+"44.."+"2222"+"22.."+".44."+"...1",
"1.4."+"...."+"...."+".2.."+".4.."+"...1",
"1.4."+"..1."+".1.."+".2.."+"...."+"...1",
"1.4."+"...."+"...."+".2.."+".4.."+"...1",
"1.44"+"44.."+"2222"+"22.."+".44."+"...1",
"1..."+"...."+"...."+"...."+"...."+"...1",
"1..."+"..4."+"...."+"3..."+"...."+"...1",
"111111111111111111111111"
];
var N=24;
var MAP=MS.map(function(r){
  r=(r+"111111111111111111111111").slice(0,N);
  return r.split('').map(function(ch){return ch==='.'?0:(+ch||1);});
});
function cell(x,y){
  if(x<0||y<0||x>=N||y>=N)return 1;
  return MAP[y][x];
}
var COLS={1:[0,238,255],2:[255,64,208],3:[158,96,255],4:[64,255,170]};

// player
var posX=6.5,posY=21.5,dirX=0,dirY=-1,planeX=0.66,planeY=0;
var bobT=0,bobA=0,bobY=0;
var keys={};
addEventListener('keydown',function(e){
  keys[e.code]=true;
  if(e.code.indexOf('Arrow')===0||e.code==='Space')e.preventDefault();
});
addEventListener('keyup',function(e){keys[e.code]=false;});
addEventListener('blur',function(){keys={};});

function rot(a){
  var c=Math.cos(a),s=Math.sin(a);
  var dx=dirX*c-dirY*s;dirY=dirX*s+dirY*c;dirX=dx;
  var px=planeX*c-planeY*s;planeY=planeX*s+planeY*c;planeX=px;
}
function free(x,y){
  var r=0.2;
  return !cell(Math.floor(x-r),Math.floor(y-r))&&!cell(Math.floor(x+r),Math.floor(y-r))&&
         !cell(Math.floor(x-r),Math.floor(y+r))&&!cell(Math.floor(x+r),Math.floor(y+r));
}
function update(dt){
  var ms=3.4*dt,rs=2.6*dt;
  var f=(keys.KeyW?1:0)+(keys.ArrowUp?1:0)-(keys.KeyS?1:0)-(keys.ArrowDown?1:0);
  var st=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  var tn=(keys.ArrowRight?1:0)+(keys.KeyE?1:0)-(keys.ArrowLeft?1:0)-(keys.KeyQ?1:0);
  if(f>1)f=1;if(f<-1)f=-1;
  if(tn)rot(tn*rs);
  var mvx=dirX*f*ms+(-dirY)*st*ms;
  var mvy=dirY*f*ms+(dirX)*st*ms;
  if(mvx&&free(posX+mvx,posY))posX+=mvx;
  if(mvy&&free(posX,posY+mvy))posY+=mvy;
  var moving=(f!==0||st!==0);
  bobA+=((moving?1:0)-bobA)*Math.min(1,dt*8);
  if(moving)bobT+=dt*10;
  bobY=Math.sin(bobT)*3.4*bobA*(BH/200);
}
function render(){
  var half=BH/2+bobY;
  var g=bctx.createLinearGradient(0,0,0,half);
  g.addColorStop(0,'#1b0a34');g.addColorStop(1,'#020207');
  bctx.fillStyle=g;bctx.fillRect(0,0,BW,half);
  var g2=bctx.createLinearGradient(0,half,0,BH);
  g2.addColorStop(0,'#020207');g2.addColorStop(1,'#04333d');
  bctx.fillStyle=g2;bctx.fillRect(0,half,BW,BH-half);
  for(var x=0;x<BW;x++){
    var cameraX=2*x/BW-1;
    var rdx=dirX+planeX*cameraX,rdy=dirY+planeY*cameraX;
    var mapX=Math.floor(posX),mapY=Math.floor(posY);
    var ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy);
    var stepX,sdx,stepY,sdy;
    if(rdx<0){stepX=-1;sdx=(posX-mapX)*ddx;}else{stepX=1;sdx=(mapX+1-posX)*ddx;}
    if(rdy<0){stepY=-1;sdy=(posY-mapY)*ddy;}else{stepY=1;sdy=(mapY+1-posY)*ddy;}
    var side=0,type=1,i;
    for(i=0;i<64;i++){
      if(sdx<sdy){sdx+=ddx;mapX+=stepX;side=0;}
      else{sdy+=ddy;mapY+=stepY;side=1;}
      if(mapX<0||mapX>=N||mapY<0||mapY>=N){type=1;break;}
      if(MAP[mapY][mapX]){type=MAP[mapY][mapX];break;}
    }
    var perp=side===0?(mapX-posX+(1-stepX)/2)/rdx:(mapY-posY+(1-stepY)/2)/rdy;
    if(!(perp>0.02))perp=0.02;
    var lh=BH/perp;
    var y0=half-lh/2;
    var base=COLS[type]||COLS[1];
    var fog=Math.exp(-perp*0.15);
    if(side===1)fog*=0.62;
    var r=Math.min(255,base[0]*fog)|0;
    var gg=Math.min(255,base[1]*fog)|0;
    var b=Math.min(255,base[2]*fog)|0;
    bctx.fillStyle='rgb('+r+','+gg+','+b+')';
    bctx.fillRect(x,y0,1,lh);
    if(lh>5){
      bctx.fillStyle='rgba(255,255,255,'+(0.55*fog).toFixed(3)+')';
      bctx.fillRect(x,y0,1,1.5);
    }
  }
}
function minimap(){
  var s=6,pad=14,mw=N*s;
  var ox=W-mw-pad,oy=pad;
  ctx.fillStyle='rgba(2,6,12,.72)';
  ctx.fillRect(ox-7,oy-7,mw+14,mw+14);
  ctx.strokeStyle='rgba(0,238,255,.4)';
  ctx.lineWidth=1;
  ctx.strokeRect(ox-6.5,oy-6.5,mw+13,mw+13);
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){
    var t=MAP[y][x];
    if(!t)continue;
    var c=COLS[t];
    ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+',.55)';
    ctx.fillRect(ox+x*s,oy+y*s,s-0.6,s-0.6);
  }
  var px=ox+posX*s,py=oy+posY*s,L=s*7;
  ctx.fillStyle='rgba(0,238,255,.16)';
  ctx.beginPath();
  ctx.moveTo(px,py);
  ctx.lineTo(px+(dirX+planeX)*L,py+(dirY+planeY)*L);
  ctx.lineTo(px+(dirX-planeX)*L,py+(dirY-planeY)*L);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(px,py,2.5,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.8)';
  ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+dirX*s*1.6,py+dirY*s*1.6);ctx.stroke();
}
var last=performance.now();
function frame(t){
  var dt=Math.min(0.05,(t-last)/1000);last=t;
  update(dt);
  render();
  ctx.drawImage(buf,0,0,W,H);
  minimap();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
