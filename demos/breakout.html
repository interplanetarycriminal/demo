<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<style>
  html,body{margin:0;height:100%;background:#07040d;overflow:hidden;font-family:monospace}
  canvas{display:block;cursor:none}
  #ui{position:fixed;top:10px;left:10px;color:#d8b6ff;background:rgba(16,0,26,.35);
    padding:8px 10px;border-radius:6px;font:12px/1.5 monospace;z-index:10;
    text-shadow:0 0 6px #c0f;pointer-events:none}
  #ui a{color:#c9f;pointer-events:auto;text-decoration:none}
  #ui a:hover{text-decoration:underline}
</style>
<div id="ui">
  <div style="font-size:15px;color:#c0f;letter-spacing:2px">◆ NEON BREAKOUT</div>
  <div>← → or mouse move paddle · Space launch</div>
  <div>R restart · <a href="index.html">← gallery</a></div>
</div>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);resize();

// fixed play area, centered
const PW=800,PH=600;
function geo(){
  const s=Math.min(W/PW,H/PH,1.4);
  return {s,ox:(W-PW*s)/2,oy:(H-PH*s)/2};
}
const ROWS=6,COLS=11;
const ROWCOL=['#ff3b6b','#ff8a00','#ffd400','#00ff88','#00e5ff','#c04bff'];
let bricks,paddle,balls,parts,powers,score,lives,state,launch,keys;

function makeBricks(){
  bricks=[];
  const bw=(PW-80)/COLS,bh=26,top=70;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
    bricks.push({x:40+c*bw,y:top+r*(bh+8),w:bw-6,h:bh,col:ROWCOL[r],alive:true,pts:(ROWS-r)*10});
}
function newBall(x,y,stuck){
  return {x,y,r:8,vx:0,vy:0,stuck:stuck,trail:[]};
}
function reset(){
  makeBricks();
  paddle={x:PW/2-60,y:PH-40,w:120,h:14,base:120};
  balls=[newBall(PW/2,PH-54,true)];
  parts=[];powers=[];score=0;lives=3;state='play';launch=false;keys={};
}
reset();

document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '){e.preventDefault();
    if(state==='over'||state==='win'){reset();return;}
    balls.forEach(b=>{if(b.stuck){b.stuck=false;const a=-Math.PI/2+(Math.random()-.5)*.6;b.vx=Math.cos(a)*6;b.vy=Math.sin(a)*6;}});
  }
  if((e.key==='r'||e.key==='R'||e.key==='Enter')&&(state==='over'||state==='win'))reset();
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
cv.addEventListener('mousemove',e=>{
  const g=geo();const mx=(e.clientX-g.ox)/g.s;
  paddle.x=Math.max(0,Math.min(PW-paddle.w,mx-paddle.w/2));
});

function burst(x,y,col,n){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=1+Math.random()*4.5;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col});}
}
function spawnPower(x,y){
  if(Math.random()<0.16){const t=Math.random()<.5?'wide':'multi';
    powers.push({x,y,vy:2.2,t,col:t==='wide'?'#00e5ff':'#ffd400'});}
}
function update(){
  // paddle keyboard
  if(keys['ArrowLeft'])paddle.x-=9;
  if(keys['ArrowRight'])paddle.x+=9;
  paddle.x=Math.max(0,Math.min(PW-paddle.w,paddle.x));
  if(state!=='play')return;
  for(let bi=balls.length-1;bi>=0;bi--){
    const b=balls[bi];
    if(b.stuck){b.x=paddle.x+paddle.w/2;b.y=paddle.y-b.r-2;continue;}
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>12)b.trail.shift();
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<b.r){b.x=b.r;b.vx*=-1;}
    if(b.x>PW-b.r){b.x=PW-b.r;b.vx*=-1;}
    if(b.y<b.r){b.y=b.r;b.vy*=-1;}
    // paddle
    if(b.vy>0&&b.y+b.r>=paddle.y&&b.y-b.r<paddle.y+paddle.h&&b.x>paddle.x-b.r&&b.x<paddle.x+paddle.w+b.r){
      b.y=paddle.y-b.r;const hit=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);
      const ang=hit*1.05;const sp=Math.min(11,Math.hypot(b.vx,b.vy)+.12);
      b.vx=Math.sin(ang)*sp;b.vy=-Math.abs(Math.cos(ang)*sp);
      burst(b.x,paddle.y,'#c0f',6);
    }
    // fell out
    if(b.y-b.r>PH){balls.splice(bi,1);continue;}
    // bricks
    for(const br of bricks){
      if(!br.alive)continue;
      if(b.x+b.r>br.x&&b.x-b.r<br.x+br.w&&b.y+b.r>br.y&&b.y-b.r<br.y+br.h){
        br.alive=false;score+=br.pts;burst(b.x,b.y,br.col,14);spawnPower(br.x+br.w/2,br.y+br.h/2);
        // bounce based on overlap
        const ox=Math.min(b.x+b.r-br.x,br.x+br.w-(b.x-b.r));
        const oy=Math.min(b.y+b.r-br.y,br.y+br.h-(b.y-b.r));
        if(ox<oy)b.vx*=-1;else b.vy*=-1;
        break;
      }
    }
  }
  if(balls.length===0){
    lives--;
    if(lives<=0){state='over';}
    else{balls=[newBall(PW/2,PH-54,true)];paddle.w=paddle.base;}
  }
  if(bricks.every(b=>!b.alive))state='win';
  // powerups
  for(let i=powers.length-1;i>=0;i--){const p=powers[i];p.y+=p.vy;
    if(p.y>PH){powers.splice(i,1);continue;}
    if(p.y>paddle.y&&p.y<paddle.y+paddle.h+10&&p.x>paddle.x&&p.x<paddle.x+paddle.w){
      if(p.t==='wide'){paddle.w=Math.min(240,paddle.w+50);}
      else{const cur=balls.filter(b=>!b.stuck);const src=cur[0]||balls[0];
        if(src){for(let k=0;k<2;k++){const nb=newBall(src.x,src.y,false);
          const a=-Math.PI/2+(Math.random()-.5)*1.4;const sp=Math.hypot(src.vx,src.vy)||6;
          nb.vx=Math.cos(a)*sp;nb.vy=Math.sin(a)*sp;balls.push(nb);}}}
      burst(p.x,p.y,p.col,12);powers.splice(i,1);
    }
  }
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function draw(){
  const g=geo();
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(g.ox,g.oy);ctx.scale(g.s,g.s);
  // play area bg + border
  ctx.fillStyle='rgba(14,6,24,.92)';ctx.fillRect(0,0,PW,PH);
  ctx.strokeStyle='#c0f';ctx.shadowColor='#c0f';ctx.shadowBlur=14;ctx.lineWidth=2;
  ctx.strokeRect(1,1,PW-2,PH-2);ctx.shadowBlur=0;
  // bricks
  for(const br of bricks){if(!br.alive)continue;
    ctx.fillStyle=br.col;ctx.shadowColor=br.col;ctx.shadowBlur=14;
    rr(br.x,br.y,br.w,br.h,5);ctx.fill();ctx.shadowBlur=0;
    ctx.globalAlpha=.3;ctx.fillStyle='#fff';rr(br.x+3,br.y+3,br.w-6,5,3);ctx.fill();ctx.globalAlpha=1;}
  // powerups
  for(const p of powers){ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=14;
    ctx.beginPath();ctx.arc(p.x,p.y,9,0,6.28);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#000';ctx.font='bold 12px monospace';ctx.textAlign='center';
    ctx.fillText(p.t==='wide'?'W':'M',p.x,p.y+4);ctx.textAlign='left';}
  // paddle
  ctx.fillStyle='#e0a0ff';ctx.shadowColor='#c0f';ctx.shadowBlur=18;
  rr(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fill();ctx.shadowBlur=0;
  // balls + trails
  for(const b of balls){
    for(let i=0;i<b.trail.length;i++){const t=b.trail[i],a=i/b.trail.length*.4;
      ctx.globalAlpha=a;ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(t.x,t.y,b.r*.7,0,6.28);ctx.fill();}
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff';ctx.shadowColor='#0ff';ctx.shadowBlur=20;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.28);ctx.fill();ctx.shadowBlur=0;
  }
  // particles
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.vx*=.97;p.life-=.024;
    if(p.life<=0){parts.splice(i,1);continue;}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  // HUD
  ctx.fillStyle='#d8b6ff';ctx.font='16px monospace';ctx.shadowColor='#c0f';ctx.shadowBlur=6;
  ctx.fillText('SCORE '+score,16,34);
  ctx.textAlign='right';ctx.fillText('LIVES '+lives,PW-16,34);ctx.textAlign='left';ctx.shadowBlur=0;
  // launch hint
  if(balls.length===1&&balls[0].stuck){ctx.fillStyle='#c0f';ctx.font='16px monospace';ctx.textAlign='center';
    ctx.fillText('Press SPACE to launch',PW/2,PH/2+40);ctx.textAlign='left';}
  // overlays
  if(state==='over'||state==='win'){
    ctx.fillStyle='rgba(8,2,16,.74)';ctx.fillRect(0,0,PW,PH);ctx.textAlign='center';
    const win=state==='win';
    ctx.fillStyle=win?'#00ff88':'#ff3b6b';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=20;
    ctx.font='bold 48px monospace';ctx.fillText(win?'YOU WIN!':'GAME OVER',PW/2,PH/2-20);ctx.shadowBlur=0;
    ctx.fillStyle='#d8b6ff';ctx.font='18px monospace';ctx.fillText('Score '+score,PW/2,PH/2+16);
    ctx.fillStyle='#c0f';ctx.fillText('Press R, Enter or Space to restart',PW/2,PH/2+48);ctx.textAlign='left';
  }
  ctx.restore();
}
let last=performance.now();
function frame(t){last=t;update();draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
