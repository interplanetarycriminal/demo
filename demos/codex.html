le it waits on async data, showing a fallback until it's ready."],["Concurrent Rendering","A React rendering mode that can pause, interrupt or abandon in-progress rendering work to keep the UI responsive to higher-priority updates.",0,[470,1467,1476,1478]],["Server Action","A function defined to run only on the server that a client component can call directly, as if it were local, without hand-building an API route.",0,[29,381,585,596]],["Server/Client Component Boundary","The explicit line in a codebase marking which components render on the server and which ship JavaScript to run in the browser.",0,[1316,1331,1332,1345]],["Fine-Grained Reactivity","An update model where each piece of state tracks exactly which parts of the UI depend on it, so changes update only those, not a whole component tree.",0,[480]],["Reactive Primitive","The smallest reactive unit a framework exposes, such as a signal or observable, that other reactive state is built from.",0,[1508,2277]],["Render Props","A pattern where a component takes a function as a prop and calls it to decide what to render, sharing logic without inheritance.",0,[470,1467,1476,1478]],["Higher-Order Component","A function that takes a component and returns a new, enhanced component, used to share cross-cutting behaviour before hooks existed.","HOC"],["Compound Component","A set of components designed to be used together and share implicit state, such as a Tabs component and its child Tab components.",0,[2363]],["Controlled Component","A form element whose value is driven entirely by application state and updated only through an explicit handler.",0,[348]],["URL State","Application state stored in the URL's path or query string, so it survives reloads and is directly shareable as a link."],["State Colocation","Keeping a piece of state as close as possible to the components that actually use it, rather than lifting it higher than necessary."],["Client-Side Cache","An in-memory store, kept in the browser, of data already fetched from the server so it doesn't need refetching on every render.",0,[1478,1635,1531]],["Component Composition","Building complex UI by nesting and combining small, focused components rather than building large monolithic ones."],["Two-Way Binding","A form pattern where a value flows automatically in both directions between a UI element and its underlying state, without a separate handler."],["Error Boundary","A component that catches JavaScript errors thrown anywhere in its child tree and renders a fallback UI instead of crashing the whole app.",0,[1316,1331,1332,1345]],["Design Token","A named, platform-independent value, such as a colour, spacing unit or font size, that stores a design decision once so it can be reused consistently across every product surface.",0,[1552,1554]],["Atomic Design","A methodology for building UI out of small, composable pieces, atoms, molecules and organisms, that combine up into complete pages.",0,[1526]],["Headless Component","A component that provides behaviour and state management but no markup or styling, leaving visual presentation entirely to the consumer."],["Tailwind CSS","A utility-first CSS framework that styles elements by composing small, single-purpose classes directly in markup rather than writing custom stylesheets.",0,[1557]],["ARIA","An HTML attribute vocabulary that communicates a UI element's role, state and properties to assistive technologies when the native semantics aren't enough."],["WCAG","The standard set of testable success criteria that defines what makes web content accessible, organised by conformance level."],["Internationalisation","Designing and building software so it can be adapted to different languages, regions and cultural conventions without code changes.","i18n"],["Container Query","A CSS rule that styles an element based on the size of its containing element, rather than the size of the whole viewport.",0,[2123]],["Design System","The combined set of design tokens, components, patterns and guidelines a team maintains so products are built consistently.",0,[1544,759,765,767]],["Storybook","A tool for building, viewing and testing UI components in isolation from the application they belong to."],["Style Dictionary","A build tool that transforms a single set of design token definitions into the different formats each platform needs.",0,[1544,34,638,748]],["Theming","Structuring a design system so its visual appearance, such as colours, spacing and type, can be swapped as a set, such as for light and dark mode or white-labelling.",0,[511,1552,1736,29]],["CSS-in-JS","A styling approach where component styles are written and scoped in JavaScript rather than in separate stylesheet files."],["Utility-First CSS","A styling philosophy where interfaces are built almost entirely from small, single-purpose classes instead of writing bespoke component styles.",0,[1547,334]],["Block Element Modifier","A CSS naming convention that structures class names around a component's block, its elements, and modifier variants to avoid collisions.","BEM",[281,416,425,553]],["Design-to-Code Handoff","The process of translating a finished design file into implemented, production-ready components.",0,[1018,1047,1239,1915]],["Semantic HTML","Writing markup using elements chosen for what they mean, such as nav, button or article, rather than only for how they look.",0,[508,780,1074,1275]],["Screen Reader","Assistive software that reads a page's content and structure aloud, or to a braille display, for users who cannot see the screen.",0,[805,803,804,1562]],["Focus Management","Deliberately controlling which element holds keyboard focus as the interface changes, so keyboard and screen-reader users aren't left disoriented.",0,[1561,105,977,1715]],["Focus Trap","A pattern that keeps keyboard focus contained within an open element, such as a modal, until it is dismissed.",0,[1172,1174]],["Skip Link","A hidden link, revealed on focus, that lets keyboard users jump straight past repeated navigation to a page's main content."],["Keyboard Navigation","The ability to operate every interactive part of an interface using only the keyboard, with no mouse required.",0,[273,178,280,301]],["Colour Contrast Ratio","The measured difference in luminance between text and its background, used to judge whether text is readable enough to meet accessibility standards.",0,[531,586,800,420]],["Accessible Name","The text assistive technology announces for an interface element, computed from its label, content or ARIA attributes.",0,[1274,1979]],["Live Region","A region of the page marked so that assistive technology announces content changes inside it automatically, without the user needing to refocus.",0,[193,2090]],["Reduced Motion Preference","An operating-system setting a user enables to request that interfaces minimise or remove animation, which sites can detect and respect.",0,[1070,1087,1156,545]],["Localisation","Adapting already-internationalised content into a specific language and locale, including translated text, formats and cultural adjustments.","l10n"],["Pluralisation Rules","The locale-specific grammar governing how a word's form changes based on a quantity, which interfaces must apply when displaying counts.",0,[623]],["Right-to-Left Layout","An interface layout mirrored for languages, such as Arabic or Hebrew, that are read right to left.","RTL",[283,2372,399,410]],["Locale-Aware Formatting","Displaying dates, numbers, currency and units according to the conventions of the user's specific locale rather than a fixed format."],["Responsive Breakpoint","A defined viewport width at which a layout's styling changes to suit a different screen size.",0,[409]],["Fluid Typography","Text sizing that scales smoothly with viewport size using calculated values, instead of jumping between fixed sizes at breakpoints.",0,[493,821,411]],["Component Variant","A predefined alternate version of a component, such as a button's primary, secondary or danger style, selectable through a single prop.",0,[1049]],["Icon System","A managed, consistent set of icons served through one component or sprite so they share sizing, colour and accessibility handling."],["Elevation System","A design system's set of standardised shadow and layering levels used to signal which surfaces sit above others.",0,[1552,1508]],["Spacing Scale","A fixed, constrained set of spacing values a design system permits, so layouts stay visually consistent instead of using arbitrary pixel values.",0,[1552,476,477,717]],["CSS Custom Properties","Author-defined variables in CSS, set once and referenced throughout a stylesheet, that can also be changed at runtime.",0,[87,2221,2251,1502]],["Accessibility Audit","A systematic review of an interface against accessibility standards, using automated tools, manual testing, or both.",0,[807,813,814,815]],["React Native","A framework for building native mobile apps using React, rendering to real platform UI components instead of a web view.",0,[33,1682,1504,1507]],["Flutter","A cross-platform UI toolkit from Google that renders every element itself with its own engine, giving pixel-identical UI across platforms.",0,[1594,1601]],["SwiftUI","Apple's declarative UI framework for building native interfaces across iOS, macOS and other Apple platforms with shared Swift code."],["Electron","A framework for building desktop applications by packaging a Chromium browser and Node.js runtime together with web app code.",0,[1586,1618]],["Tauri","A framework for building desktop applications that renders UI in the operating system's native web view, keeping the shipped binary far smaller than Electron's.",0,[1585]],["Over-the-Air Update","A way of pushing app changes, such as JavaScript bundle updates, directly to installed apps without going through an app store review cycle.","OTA",[1597]],["Deep Link","A URL that opens an installed app directly to a specific screen or piece of content, rather than just launching it to its home screen.",0 sted hierarchy of widgets that describes everything on screen, rebuilt declaratively as state changes.",0,[1583,183,877]],["App Bundle","Android's publishing format that lets the store generate and deliver an optimised APK for each device configuration from one upload."],["Sideloading","Installing an app onto a device directly from a file, bypassing the official app store."],["App Store Optimisation","Improving an app's listing, such as its title, keywords and screenshots, to increase its visibility and conversion rate in app store search and browsing.","ASO",[1300,167,1523,1597]],["In-App Purchase","A transaction made from within an app, processed through the platform's own payment system, for digital goods or subscriptions.","IAP"],["Cross-Platform Abstraction Layer","A shared code layer that exposes one API to the app while translating calls into the correct platform-specific implementation underneath.",0,[18,1308,2266,2412]],["Device Fragmentation","The wide variation in screen sizes, OS versions and hardware capabilities across the devices an app must support.",0,[1183,1963,792,1018]],["Biometric Authentication","Verifying a user's identity using a physical trait, such as a fingerprint or face scan, captured by the device's own sensors.",0,[2048,2049,2050,2052]],["Background Execution Limit","The operating system's restriction on how long, and how often, an app may run code while not in the foreground.",0,[1229,1689,228,1237]],["App Lifecycle State","The current phase of an app's execution, such as foreground, background or suspended, that the OS reports so the app can react appropriately.",0,[1519,1730,1849]],["Local Notification","A notification scheduled and triggered by the app itself on-device, without a round trip to a push server.",0,[156,878,879,893]],["App Permission Prompt","The system dialogue that asks a user to grant or deny an app access to a protected resource, such as the camera or location.",0,[882,894,1692,1025]],["WebView Bridge","A communication layer that lets JavaScript running inside an embedded web view call native app code, and vice versa."],["Staged Rollout","Releasing an app update to a small percentage of users first, expanding gradually if no problems appear.",0,[2130,2121]],["App Icon Badge","The small numeric or dot indicator overlaid on an app's home-screen icon, typically showing an unread count.",0,[876,375,862]],["Multi-Window Support","A desktop or tablet app's ability to open and manage more than one independent window at once.",0,[776,31,1403,76]],["Native Menu Bar","The operating-system-level application menu, such as File and Edit, that a desktop app populates, as distinct from any in-window UI.",0,[33,1682,1582,1593]],["Inter-Process Communication","The mechanism by which a desktop app's separate processes, such as an Electron or Tauri app's main and renderer processes, pass messages to each other.","IPC",[1585,823,1051,39]],["Auto-Updater","The component of a desktop app that checks for, downloads and installs new versions automatically.",0,[524,650]],["AsyncAPI","A specification for documenting event-driven and message-based APIs, providing for asynchronous channels what OpenAPI provides for REST."],["GraphQL Federation","An architecture that composes multiple independently owned GraphQL services into a single unified graph presented to clients.",0,[1369,2085]],["Idempotency Key","A unique value a client attaches to a request so that retrying it, whether by accident or design, has the same effect as sending it once.",0,0,"sys-retry-storm"],["API Versioning","The practice of tagging an API's shape with a version identifier so breaking changes can be introduced without disrupting existing consumers.",0,[1624,1633,659,759]],["Breaking Change","A modification to an API's contract that will cause existing, correctly written clients to fail or behave differently.",0,[2263,759,1623,197]],["Rate Limiting","Restricting how many requests a client can make to an API within a given time wind ape, instead of free-form text.",0,[1884,14,1252]],["Function Calling","A model capability where it can request that a specific application function be invoked with specific arguments, as part of producing its response.",0,[2155,596]],["Agentic Workflow","A product feature built around a model that plans and takes multiple actions toward a goal, rather than answering a single prompt.",0,[1232,2120,2133,21]],["Retrieval Precision","A measure of how much of what a retrieval step returns is actually relevant to the query, as opposed to noise.",0,[478,1861],"sys-rag-retrieval"],["Prompt Template","A parameterised prompt with placeholders filled in at runtime, letting the same structure be reused consistently across requests.",0,[613,1025,1026,1027]],["Safety Filter","A layer that screens a model's input or output for disallowed or harmful content before it reaches the user.",0,[321,434,1162]],["Fallback Model","A secondary model a system switches to automatically when the primary model is unavailable, too slow, or fails.",0,[500,2214]],["Model Cascade","A pipeline that tries a cheaper or faster model first and only escalates to a more capable, more expensive model when needed."],["Token Budget","The maximum number of tokens a feature or request is allowed to consume, used to control cost and context usage.",0,[567,1451,1933,2078]],["Recall at K","An evaluation metric measuring whether the correct result appears anywhere in the top K items a retrieval system returns.",0,[244]],["LLM Gateway","A proxy layer that routes, logs and manages calls to one or more model providers on behalf of an application.",0,[1628,1710,1726,1954]],["Jailbreak Attempt","An input specifically crafted to trick a model into ignoring its safety instructions or intended constraints."],["PII Redaction","Automatically detecting and removing or masking personally identifying information before it's sent to or returned from a model."],["Knowledge Base Sync","The process of keeping a retrieval system's tency on a per-operation basis rather than system-wide.",0,[18,597,1774,1901]],["Sloppy Quorum","A quorum satisfied using whichever reachable nodes are available rather than the fixed designated set, trading strict consistency for availability during a network partition.",0,0,"sys-split-brain"],["Hinted Handoff","Temporarily storing a write meant for an unreachable node on a different node instead, to be forwarded once the original node recovers, so an unavailable replica doesn't block the write entirely.",0,[829,1018,1047,1239]],["Anti-Entropy Repair","A background process that compares replicas and reconciles their differences, used to bring nodes back into agreement after writes were accepted during a partition or outage.",0,[950]],["Merkle Tree","A tree of hashes where each parent node's hash summarises its children, letting two replicas find exactly where they differ by comparing a handful of hashes instead of every record.",0,0,"sys-merkle"],["Write Skew","A concurrency anomaly where two transactions each read overlapping data, make decisions based on it, and write disjoint fields, leaving the combined result violating an invariant neither transaction individually broke.",0,[1309,2299,1774,1801],"sys-write-skew"],["Chain Replication","A replication topology where writes flow through an ordered chain of replicas one at a time and are only acknowledged once they reach the tail, giving strong consistency without a separate coordination step.",0,[1760,1761,1990]],["Coordinated Omission","A measurement bias where a benchmarking client stops sending requests while waiting for a slow response, causing latency figures to quietly exclude the very periods when the system was struggling most.",0,0,"sys-coordinated-omission"],["Straggler","A single slow node or task that holds up the completion of an entire batch or distributed computation, even though every other node finished on time.",0,[1922]],["Speculative Execution","In a distributed computation, launching a duplicate copy of a slow-running task on another node and accepting whichever copy finishes first, used to route around stragglers rather than diagnose them.",0,[1555,1921,2267,228]],["Backfill","Reprocessing historical data through a system after the fact, typically to populate a new field, fix a bug's effects, or feed a newly built downstream consumer.",0,[1799]],["Event Replay","Reprocessing a previously recorded stream of events from the beginning, used to rebuild derived state, feed a new consumer, or recover from a bug in how events were originally handled.",0,[1527,1797,2171,2244]],["Shuffle Sharding","An assignment strategy that gives each tenant or workload a unique, randomised combination of shards, so that the blast radius of any one shard failing only ever overlaps a small fraction of other tenants.",0,[2191,1759,2134],"sys-shuffle-shard"],["Partition Rebalancing","Moving data or load between existing partitions after the fact, done when growth or a hot partition has made the original distribution uneven.",0,[1904,1754]],["Fan-In","Many upstream sources feeding into a single downstream component or aggregation point, the mirror image of fan-out and its own distinct source of overload risk.",0,[1906]],["Distributed Semaphore","A coordination primitive that allows a fixed number of holders to access a resource concurrently across a network, generalising a distributed lock's single-holder guarantee to N holders.",0,[1907,1347,1808]],["Lease-Based Coordination","A coordination approach where a holder is granted exclusive access for a fixed, expiring duration rather than indefinitely, so a crashed holder's grant expires on its own instead of requiring explicit release.",0,[549]],["Watermark","A marker in a stream indicating that all events up to a given point in event time have been seen, letting stream processing decide when it's safe to finalise a window's results.",0,[1812,1061]],["STONITH","Shoot The Other Node In The Head: a split-brain resolution tactic that forcibly powers off or fences a suspect node rather than trusting it to voluntarily step down.",0,[2185]],["Node Eviction","Removing an unresponsive or failing node from a cluster's active membership, so remaining nodes stop routing work to it and can rebalance without waiting for it to recover.",0,[1803,1804,2079]],["Retry Budget","A cap on how much of a system's total traffic is allowed to be retries at any given time, preventing retries themselves from becoming the load that takes the system down.",0,[567,1649,2182,1451]],["Overload Control","Deliberately limiting how much work a system accepts once it's near capacity, prioritising finishing the work already admitted over accepting more and finishing none of it.",0,[258,1148,64,254]],["Admission Control","A gatekeeping mechanism that decides whether to accept a new request at all based on current system load, rather than accepting everything and hoping capacity holds.",0,[2083,64,254,322]],["Warm Standby","A replica kept running and roughly up to date but not serving live traffic, ready to take over faster than a cold rebuild but without the cost of running fully active.",0,[531,1800]],["Hedged Request","Sending a duplicate copy of a request to a second server after the first hasn't responded within a threshold, and using whichever response comes back first, traded off against the extra load it generates.",0,[1638,1697,1817,2177]],["OSI Model","A seven-layer reference model for network communication, from the physical wire up to the application, used less as an implementation guide today than as shared vocabulary for which layer a problem actually lives in.","OSI"],["CIDR","Classless Inter-Domain Routing: a notation for specifying a block of IP addresses as a base address plus a prefix length, replacing the older fixed class system with flexibly sized network ranges.","CIDR"],["Network Address Translation","A router function that rewrites the source or destination address of packets as they cross a boundary, most ion Protocol","A protocol that maps a known IP address on the local network to the MAC address of the device that owns it, the step that has to happen before a link-layer frame can actually be sent.","ARP",[1949,1014,711,1992]],["Ethernet Frame","The unit of data transmitted at the link layer over Ethernet, wrapping a packet with the source and destination MAC addresses needed to deliver it across a local segment.",0,[1962,1949,567,848]],["Layer 2 Switching","Forwarding frames within a local network based on MAC address alone, without making any routing decision based on IP addresses.",0,[829,1949,141,352]],["Routing Table","The set of rules a router or host consults to decide which next hop a packet should be sent to based on its destination address.",0,[1686,364,1754]],["Border Gateway Protocol","The protocol that autonomous systems use to exchange routing information across the internet, effectively deciding which path traffic between two organisations actually takes.","BGP",[1955,532,711,1992]],["Autonomous System","A network or group of networks under one organisation's routing control, identified by its own number and the unit BGP actually routes between.","AS",[1954]],["Default Gateway","The router a device sends traffic to when the destination isn't on its own local network, the exit point onto the wider network.",0,[246,1071,1072,1454]],["IPv6","The successor addressing scheme to IPv4, using 128-bit addresses to provide a vastly larger address space and built-in support for features IPv4 only bolted on later.","IPv6"],["IPv4 Exhaustion","The depletion of unallocated public IPv4 addresses, the practical pressure that made NAT, carrier-grade NAT, and IPv6 adoption necessary rather than optional.",0,[2209]],["NAT Traversal","Techniques that let two devices behind separate NATs establish a direct connection despite neither having a routable public address for the other to reach.",0,[1973],"sys-nat-traversal"],["Port Address Translation","A form of NAT that maps han the sender duplicating it once per recipient."],["TLS Handshake","The exchange at the start of a TLS connection where client and server agree on a cipher, verify the server's certificate, and establish shared encryption keys, before any application data is sent.",0,[1979,1989,1975]],["Server Name Indication","A TLS handshake extension where the client states which hostname it's trying to reach before encryption keys are established, letting one IP address serve certificates for many different domains.","SNI",[1978,1274,1567,1371]],["DNS Propagation","The delay between a DNS record being updated and every resolver worldwide actually picking up the new value, governed by cached record time-to-live rather than happening instantly everywhere at once.",0,[1805,2015,2140]],["Multiplexing","Carrying multiple independent logical streams of data over a single underlying connection, so several requests can be in flight at once without each needing its own connection.",0,[1944,1986,2018]],["WebSocket","A protocol that upgrades an HTTP connection into a persistent, full-duplex channel, letting server and client send messages to each other at any time without either side polling.",0,[1687,1983,2018]],["Server-Sent Events","A protocol built on plain HTTP that lets a server push a stream of text events to a client over one long-lived connection, one-directional and far simpler to operate than a WebSocket when the client never needs to talk back.","SSE",[1982,1371,1476,1507]],["Layer 7 Load Balancing","Distributing traffic based on application-level content, such as a URL path or a header, rather than just the connection's source and destination, letting routing decisions understand what's actually being requested.",0,[2004,502],"sys-power-of-two"],["Envoy","An open-source proxy built specifically for service-to-service traffic, commonly deployed as a sidecar or gateway and the data-plane component most modern service meshes are built on top of."],["HTTP/3","The version of HTTP NS configuration that returns different answers for the same domain name depending on whether the query came from inside or outside an organisation's network.",0,[62,378,407,1731]],["DNS-over-HTTPS","A protocol that carries DNS queries inside an encrypted HTTPS connection, hiding lookups from anyone observing the network between client and resolver.","DoH"],["HTTP Server Push","An HTTP/2 feature that let a server send resources to a client before the client explicitly asked for them, largely abandoned in practice because it proved hard to predict what a client actually needed.",0,[1555,1590,1371,1476]],["Header Compression","A technique, used by HTTP/2 and HTTP/3, that avoids re-transmitting identical or similar header fields on every request by referencing a shared, evolving table instead.",0,[1658,1900,1634,1648]],["Sticky Session","A load balancing configuration that routes all of one client's requests to the same backend instance, used when that instance holds state the client's later requests depend on.",0,[860,293,416,796]],["gRPC","A remote procedure call framework built on HTTP/2 that uses Protocol Buffers for its message format, favoured for service-to-service traffic where strict contracts and low overhead matter more than human readability.",0,[483,2001]],["Protocol Buffers","A binary serialisation format with a strict, versioned schema, commonly paired with gRPC and chosen over JSON when payload size and parsing speed matter more than being readable in a browser's network tab.","Protobuf",[2000,711,1950,1954]],["Long Polling","A technique where a client makes a request that the server deliberately holds open until it has new data to send, then the client immediately reconnects, simulating push over plain request-response HTTP.",0,[869]],["Content Negotiation","The mechanism by which a client and server agree on the format, language, or encoding of a response, using request headers rather than separate URLs per variant.",0,[1992,405,588,605]],["Layer 4 Load Balancing","Distributing traffic based only on connection-level information, source and destination IP and port, without inspecting or understanding the application data inside.",0,[1984,502],"sys-power-of-two"],["Weighted Round Robin","A load balancing algorithm that cycles through backend servers in order but sends a proportionally larger share of requests to servers assigned a higher weight.",0,[520]],["Least Connections","A load balancing algorithm that sends each new request to whichever backend currently has the fewest active connections, adapting to uneven request durations better than plain round robin.",0,[549,1745,1766,1974]],["HTTP Keep-Alive","Reusing a single TCP connection for multiple sequential HTTP requests instead of opening and closing a new connection for each one, saving the overhead of a fresh handshake every time."],["Chunked Transfer Encoding","An HTTP mechanism for sending a response in a series of pieces without knowing the total length in advance, letting a server start streaming before it's finished generating the whole body.",0,[1378,456,222,1861]],["Origin Server","The server that actually holds the authoritative copy of a resource, as distinguished from any reverse proxy or CDN edge node caching or forwarding requests to it.",0,[829,1987,1370,2010]],["Same-Origin Policy","A browser security rule that isolates scripts running on one origin from reading data belonging to a different origin, the default restriction that CORS exists to selectively relax.",0,[1072,2009,758,1649]],["Domain Fronting","A technique that hides the true destination of an HTTPS request by presenting one hostname in the visible SNI field while requesting a different hostname inside the encrypted HTTP layer, exploiting shared infrastructure between the two.",0,[1326,1389,1392,1393]],["DNS Cache Poisoning","An attack that injects a forged record into a resolver's cache, causing it to send subsequent lookups for a domain to an attacker-controlled address instead of the real one.",0,[1815]],["Happy Eyeballs","An algorithm that races IPv6 and IPv4 connection attempts to a dual-stack host in parallel, using whichever succeeds first, so a broken IPv6 path doesn't visibly slow down or fail the connection.",0,[1277]],["HTTP Pipelining","Sending multiple HTTP/1.1 requests over one connection without waiting for each response first, an early attempt at concurrency that head-of-line blocking made unreliable enough that it was never widely enabled by default.",0,[1072]],["DNS Record","A single entry in a domain's zone data, such as an address, alias, or mail-routing entry, that tells resolvers how to answer a particular kind of query for that domain.",0,[1980,2017,1081,2244]],["Reverse DNS Lookup","Looking up the domain name associated with a given IP address, the inverse of the usual name-to-address lookup, commonly used to sanity-check mail servers and log entries.",0,[2284,1987]],["Zone File","The file format in which a domain's complete set of DNS records is defined and served by its authoritative nameservers.",0,[1994,2015,306,658]],["WebTransport","A browser API built on HTTP/3 and QUIC that gives web applications low-latency, multiplexed, optionally unreliable data streams, aimed at replacing raw WebSocket and WebRTC data channels for use cases that don't need full ordering guarantees.",0,[1981,1982]],["PKCE","Proof Key for Code Exchange: an OAuth extension where the client generates a secret and sends only its hash upfront, so an intercepted authorisation code can't be redeemed by anyone but the client that started the flow.","PKCE"],["OAuth 2.1","A consolidation of OAuth 2.0 best practice into a single specification that drops the flows known to be unsafe, such as the implicit grant, and makes PKCE mandatory rather than optional."],["SAML","Security Assertion Markup Language: an XML-based standard for exchanging authentication and authorisation assertions between an identity provider and a service provider, still common in enterprise single sign-on despite OIDC's rise.","SAML",[2038]],["SCIM","System for Cross-domain Identity Management: a standard protocol for automatically provisioning, updating, and deprovisioning user accounts across systems as changes happen in a central identity source.","SCIM"],["Role-Based Access Control","An authorisation model that grants permissions to roles rather than individual users, and assigns users to roles, so access can be reasoned about and audited at the role level instead of per person.","RBAC",[2028,2040,64,254]],["WebAuthn","A W3C standard that lets a browser authenticate a user with a hardware security key, platform authenticator, or passkey using public-key cryptography instead of a password sent over the wire.","WebAuthn",[2051]],["Content Security Policy","An HTTP header that tells a browser which sources of scripts, styles, and other content a page is allowed to load from, closing off most cross-site scripting attack vectors even if malicious markup gets injected.","CSP",[1742,405,588,605]],["Typosquatting","Registering a domain or package name deliberately similar to a legitimate one, close enough that a typo, misread, or careless copy-paste sends a victim to the attacker's version instead.",0,[2057]],["Refresh Token Rotation","A pattern where using a refresh token to get a new access token also issues a brand-new refresh token and invalidates the old one, so a stolen refresh token can only be used once before its reuse is detectable.",0,[2031,1640,154,1775]],["Attribute-Based Access Control","An authorisation model that evaluates access decisions against attributes of the user, resource, and context at request time, rather than a fixed set of roles, at the cost of being harder to audit at a glance.","ABAC",[1459,2023,2040,64]],["Just-in-Time Access","Granting elevated permissions only for the specific duration a task requires and revoking them automatically afterward, rather than leaving standing access provisioned indefinitely.","JIT Access",[549,1555,894,214]],["Privileged Access Management","The systems and processes that control, monitor, and time-limit access to an organisation's most sensitive accounts and credentials, distinct from ordinary identity and access management for everyday users.","PAM",[105,977,1562,1715]],["Access Token","A credential presented to an API to prove that a request is authorised, typically short-lived and scoped to specific permissions, distinct from a refresh token, which exists only to obtain new access tokens.",0,[2027,2032]],["ID Token","A signed token, defined by OpenID Connect, that asserts a user's identity to the client application, distinct from an access token, which authorises calls to a resource rather than identifying the user to the client.",0,[2031,2033]],["JSON Web Token","A compact, signed token format for representing claims, commonly used as an access or ID token, whose signature lets a receiver verify its integrity without calling back to whoever issued it.","JWT",[2032]],["Token Introspection","An endpoint an authorisation server exposes so a resource server can check, in real time, whether a given token is still valid and what it's scoped to, needed for opaque tokens that can't be verified locally."],["Token Revocation","The act of invalidating a previously issued token before its natural expiry, and the endpoint or mechanism that makes that invalidation take effect immediately across every service checking it."],["Authorization Code Flow","The OAuth flow where a client receives a short-lived code via redirect and exchanges it, server-side, for tokens, kept as the standard flow because it never exposes tokens directly in a browser's address bar.",0,[2037,2054]],["Device Authorization Flow","An OAuth flow designed for devices with no convenient browser or keyboard, such as a TV or CLI tool, where the user completes login on a separate device while the original one polls for completion.",0,[2036,2054,792,1018]],["Identity Provider","The system responsible for authenticating a user and asserting their identity to other applications, the trust anchor that single sign-on and federation are built on.","IdP",[2021,1725,1889]],["Session Fixation","An attack where an attacker sets a victim's session identifier before they log in, then uses that known identifier to hijack the now-authenticated session once the victim signs in.",0,[860,1258,1911,1999]],["Broken Access Control","A vulnerability class where a system fails to properly enforce what an authenticated user is actually allowed to do, letting them reach data or actions their role should have blocked.",0,[1555,2023,2028,64]],["Insecure Direct Object Reference","A vulnerability where an application exposes an internal identifier, such as a record ID, and lets a user access another user's data simply by changing that identifier, without checking they're authorised to.","IDOR",[56,268,445,1345]],["Open Redirect","A vulnerability where an application redirects to a URL supplied by the request without validating it, letting an attacker use the trusted domain's own link to send victims somewhere malicious.",0,[857]],["Clickjacking","An attack that tricks a user into clicking something on a legitimate page by overlaying it, invisibly, beneath attacker-controlled content the user believes they're interacting with instead."],["Subresource Integrity","A browser feature that lets a page specify a cryptographic hash a fetched script or stylesheet must match, so a compromised third-party host or CDN can't silently swap in malicious code.","SRI"],["Credential Stuffing","An attack that automates login attempts using username-password pairs leaked from other breaches, betting on the fact that many users reuse the same password across services.",0,[2047]],["Password Spraying","An attack that tries one common password against many different accounts, rather than many passwords against one account, specifically to avoid tripping per-account lockout thresholds.",0,[861,895]],["Account Takeover","The end result of successfully gaining unauthorised control of a legitimate user's account, the outcome credential stuffing, phishing, and session hijacking are all trying to achieve.","ATO",[2045,1047]],["Phishing-Resistant Authentication","An authentication method, such as a passkey or hardware security key, that cryptographically binds the credential to the legitimate site, so it simply doesn't work if entered on a convincing fake.",0,[2051,1608,2049,2050]],["Step-Up Authentication","Requiring an already-logged-in user to re-authenticate or provide an additional factor before a specific higher-risk action, rather than demanding the strongest possible check for every action equally.",0,[1608,2048,2050,2052]],["Adaptive Authentication","Varying the strength of authentication required based on contextual risk signals, such as an unfamiliar device or location, rather than applying the same fixed check to every login attempt.",0,[1508,1608,2048,2049]],["FIDO2","The overarching standard combining WebAuthn and a device-side protocol that enables passwordless, phishing-resistant authentication using public-key cryptography instead of a shared secret.","FIDO2",[2024,2048]],["Passwordless Authentication","Any login method that authenticates a user without them ever typing a shared secret, whether via a passkey, magic link, or one-time code, removing the password as an attack surface entirely.",0,[1555,2053,1608,2048]],["Magic Link","A passwordless login method where a one-time authentication link is emailed or texted to a user, and clicking it completes the sign-in without a password ever being entered.",0,[1112,2052,1143]],["Authorization Server","The component in an OAuth deployment responsible for authenticating the user, obtaining consent, and issuing tokens, kept architecturally separate from the resource servers that actually enforce those tokens.",0,[2036,2037,1371,1476]],["Confused Deputy Problem","A security flaw where a component with more privilege than the caller is tricked into misusing that privilege on the caller's behalf, the classic failure mode behind many authorisation bugs beyond just OAuth.",0,[900,1150,1164,1165]],["Privilege Escalation","Gaining a higher level of access than originally granted, either by exploiting a flaw to jump straight to admin rights or by chaining together smaller permissions that combine into more than intended."],["Homoglyph Attack","An attack, closely related to typosquatting, that uses visually near-identical characters from a different alphabet or font in a domain or username to impersonate a legitimate one convincingly.",0,[2026]],["Consent Phishing","An attack that tricks a user into authorising a malicious OAuth application with real permissions to their account, exploiting the legitimate consent flow instead of stealing a password directly.",0,[696,1159,2048]],["Terraform","An open-source infrastructure-as-code tool that lets teams declare cloud resources in a configuration language and computes the minimal set of changes needed to make real infrastructure match that declaration.",0,[2087,2088]],["StatefulSet","A Kubernetes workload type that gives each replica a stable, unique network identity and its own persistent storage, used for workloads like databases that can't be treated as interchangeable pods."],["Horizontal Pod Autoscaler","A Kubernetes controller that automatically changes the number of running pod replicas based on observed metrics such as CPU or custom application load.","HPA",[2081,2082]],["Istio","An open-source service mesh that layers traffic management, security, and observability onto a Kubernetes cluster's service-to-service calls without requiring changes to the services' own code."],["AWS Lambda","A serverless compute service that runs code in response to an event without the caller provisioning or managing any server, billed only for the time each invocation actually runs.",0,[2096]],["Virtual Private Cloud","An isolated, logically separated section of a cloud provider's network reserved for one account or organisation, within which subnets, routing, and access can be configured as if it were a private data centre.","VPC",[2098,2099,918,1385]],["ArgoCD","A GitOps continuous delivery tool for Kubernetes that continuously reconciles a cluster's actual state against the desired state declared in a Git repository, and flags or auto-corrects any drift.",0,[1399]],["Edge Function","A small piece of application code deployed to run at points of presence close to the user rather than in one central region, trading some capability for latency measured in single-digit milliseconds.",0,[968,868]],["Recovery Time Objective","The maximum acceptable time a system may be down after a disaster before service must be restored, a business decision that then dictates how much redundancy the architecture actually needs.","RTO",[2068,2090,972,2207]],["Recovery Point Objective","The maximum acceptable amount of data, measured in time, that may be lost in a disaster, a business decision that dictates how frequently data must be backed up or replicated.","RPO",[2067,1440,972,2207]],["Kubernetes Deployment","A Kubernetes object that manages a set of interchangeable, stateless pod replicas, handling rolling updates and self-healing so the desired number stays running without manual intervention.",0,[2075,1332,1696,2130]],["ReplicaSet","A Kubernetes controller that ensures a specified number of identical pod replicas are running at all times, the mechanism a Deployment uses under the hood to manage rollouts."],["DaemonSet","A Kubernetes workload type that ensures exactly one copy of a pod runs on every node in the cluster, used for node-level agents like log collectors or monitoring daemons."],["Persistent Volume","A piece of storage provisioned in a Kubernetes cluster independently of any particular pod's lifecycle, so data survives even after the pod using it is deleted or rescheduled.","PV",[2073]],["Persistent Volume Claim","A request from a pod for a specific amount and type of storage, which Kubernetes matches to an available persistent volume without the pod needing to know the storage's underlying implementation.","PVC",[2072,1366]],["ConfigMap","A Kubernetes object that stores non-sensitive configuration data separately from application code, so the same container image can be deployed with different configuration across environments.",0,[2075]],["Kubernetes Secret","A Kubernetes object for storing sensitive values such as credentials, kept separate from ConfigMaps so it can be handled with tighter access control, encryption at rest, and audit logging.",0,[2074,2069]],["Liveness Probe","A periodic Kubernetes health check that determines whether a container is still functioning; failing it causes Kubernetes to restart the container automatically.",0,[2077]],["Readiness Probe","A periodic Kubernetes health check that determines whether a container is ready to receive traffic; failing it removes the pod from service without restarting it.",0,[2076]],["Pod Disruption Budget","A Kubernetes policy that limits how many replicas of a workload can be voluntarily taken down at once, protecting availability during node maintenance or cluster scaling operations.","PDB",[567,1451,1876,1933]],["Node Affinity","A Kubernetes scheduling rule that constrains which nodes a pod can be placed on based on node labels, used to keep certain workloads on specific hardware or in specific zones.",0,[678,1932]],["Taint and Toleration","A Kubernetes mechanism where a node is marked to repel pods by default, and only pods explicitly tolerating that taint are allowed to be scheduled onto it.",0,[1072]],["Vertical Pod Autoscaler","A Kubernetes controller that automatically adjusts a pod's requested CPU and memory based on observed usage, rather than changing the number of replicas the way a horizontal autoscaler does.","VPA",[2061,2082,186,187]],["Cluster Autoscaler","A Kubernetes component that adds or removes entire nodes from a cluster based on whether currently pending pods can't be scheduled or nodes are sitting idle.",0,[2061,2081,1680,2084]],["Admission Controller","A Kubernetes component that intercepts requests to the API server before they're persisted, able to validate or mutate them, the mechanism most policy-as-code enforcement in a cluster is built on.",0,[1555,963,1935]],["Multi-Cluster Architecture","Running workloads across more than one Kubernetes cluster, whether for geographic distribution, blast-radius isolation, or separating environments, rather than scaling a single cluster indefinitely.",0,[2191,307,1327,1348]],["Cluster Federation","A layer that coordinates configuration and workload placement across multiple independent Kubernetes clusters as if they were, for some purposes, a single logical cluster.",0,[1369,1621,1680,2082]],["Traffic Shadowing","Mirroring a copy of live production traffic to a new service version without that copy's responses affecting real users, used to validate a change against real load before it takes any traffic for real.",0,[518,1500,1894,2272]],["Terraform State","The file Terraform uses to record which real infrastructure resources correspond to which declared configuration, the source of truth its plan and apply commands compute changes against.",0,[2059,2088]],["Terraform Module","A reusable, self-contained package of Terraform configuration that can be called with different inputs, letting an organisation standardise how a given piece of infrastructure is provisioned.",0,[2059,2087,1369,1593]],["Drift Detection","Identifying places where a system's actual running configuration has diverged from what infrastructure-as-code declares it should be, typically caused by a manual change made outside the normal pipeline.",0,[215,1733,2172,1257]],["Multi-Region Failover","Automatically redirecting traffic to infrastructure running in a different geographic region when the primary region becomes unavailable, the mechanism regional Recovery Time Objectives are actually delivered by.",0,[2067,1776,2203,193]],["Active-Active Deployment","Running full production capacity in more than one region simultaneously, all serving live traffic, so a regional failure only removes a fraction of total capacity instead of all of it.",0,[2092,1332,1696,2130]],["Active-Passive Deployment","Running full production capacity in one region while a second stands ready but idle, cheaper to run than active-active but slower to take over and harder to keep genuinely in sync.",0,[2091,1332,1696,2130]],["Landing Zone","A pre-configured, secure baseline of accounts, networking, and guardrails that a new cloud environment or team is provisioned into, so every new workload starts from an already-compliant foundation.",0,[306,864,981]],["Data Egress Cost","The fee a cloud provider charges for data leaving its network, a cost that shapes architecture decisions such as where to place caches and which provider to run cross-cloud workloads in."],["Provisioned Concurrency","A setting that keeps a fixed number of serverless function instances warm and ready ahead of time, paying a continuous cost to eliminate the cold-start latency an on-demand invocation would otherwise incur.",0,[1678,1596]],["Lambda Layer","A packaged bundle of shared code or dependencies that can be attached to multiple serverless functions, avoiding the need to duplicate the same library inside every function's own deployment package.",0,[2063]],["AWS Step Functions","A managed service for orchestrating a sequence of serverless functions and other AWS services as an explicit state machine, handling retries, branching, and error handling declaratively instead of in application code.",0,[1510]],["VPC Peering","A direct network connection between two virtual private clouds that lets resources in each communicate using private addresses, without the traffic ever crossing the public internet.",0,[2064,2125]],["Transit Gateway","A managed hub that connects many virtual private clouds and on-premises networks through a single point, replacing a full mesh of individual peering connections between every pair.",0,[2064,1628,1710,1726]],["Bastion Host","A hardened server deliberately exposed as the single entry point into a private network, so administrative access can be tightly controlled, logged, and audited at one narrow chokepoint.",0,[1408,2132]],["GitHub Actions","GitHub's built-in continuous integration and delivery platform, where workflows are defined as YAML files triggered by repository events and run on either GitHub-hosted or self-hosted runners.",0,[1399,2132,2421,29]],["Vite","A frontend build tool that serves source files directly over native ES modules during development for near-instant startup, then bundles for production using a separate, more traditional build step."],["Turborepo","A build system for JavaScript and TypeScript monorepos that caches task outputs and only reruns work affected by a given change, sharing that cache across machines and CI runs.",0,[2109]],["pnpm","A JavaScript package manager that stores every package version once on disk and links it into projects, cutting install time and disk usage compared to managers that duplicate packages per project."],["Preview Environment","A temporary, fully running deployment of a branch or pull request, given its own URL so a change can be reviewed and tested as a real running application rather than just a diff.",0,[2106,1637,1677,1728]],["Environment Parity","How closely a development, staging, or preview environment matches production in configuration and behaviour, the property that determines whether tests run there actually predict what will happen after release.",0,[2105,1637,1677,1728]],["Feature Flag","A runtime switch that turns a piece of functionality on or off without a new deployment, used to separate the act of releasing code from the act of exposing a feature to users.",0,[2128,606,1383,2296]],["A/B Testing","Randomly splitting users between two or more variants of a feature and comparing a target metric between them, used to make a rollout decision based on measured outcomes rather than opinion.",0,[1555,2127,2138]],["Monorepo","A single repository containing the code for multiple, otherwise independently deployable projects, chosen to make cross-project changes and shared tooling easier at the cost of needing build tools that scale to its size.",0,[1399,2103,2115,2116]],["Canary Release","Releasing a new version to a small subset of production traffic first, watching its behaviour closely, and only expanding it to everyone once it proves itself safe.",0,[615,2434,2126]],["esbuild","A JavaScript and TypeScript bundler and minifier written in Go, valued primarily for being dramatically faster than JavaScript-based bundlers on large codebases."],["Rollup","A JavaScript module bundler focused on producing small, tree-shaken output, historically favoured for building libraries where bundle size matters more than development-server speed."],["SWC","A Rust-based compiler for JavaScript and TypeScript used as a drop-in, much faster replacement for Babel in transpilation and minification steps of a build pipeline.","SWC"],["Hot Module Replacement","A development-server feature that swaps updated modules into a running application in place, preserving its current state instead of forcing a full page reload on every change.","HMR",[1369,1593,2088]],["Nx","An extensible build system and monorepo toolkit that adds computation caching, task orchestration, and code generation on top of a JavaScript or polyglot workspace.",0,[1353,2109]],["Bazel","A build system, originating from Google's internal tooling, that treats builds as a strict dependency graph of hermetic, reproducible steps, capable of scaling to very large, polyglot monorepos with reliable incremental builds.",0,[2109]],["Workspace Protocol","A package manager convention that lets one package in a monorepo depend on another package's local source directly, without publishing it to a registry first, and swap automatically to the published version at release time.",0,[2109,711,1950,1954]],["Changesets","A versioning and changelog tool for monorepos where each pull request declares which packages changed and how significantly, and a release step aggregates those declarations into version bumps and changelog entries.",0,[1396,2109]],["Trunk-Based Development","A branching strategy where developers integrate small changes into a single shared branch frequently, often multiple times a day, instead of working on long-lived feature branches that diverge for weeks.",0,[2120,1226,2224,2366]],["Feature Branch Workflow","A branching strategy where each piece of work happens on its own branch until it's complete and reviewed, then merged, trading trunk-based development's fast integration for more isolation while work is in progress.",0,[2119,1232,1870,999]],["Staging Environment","A pre-production environment built to match production as closely as practical, used as the last checkpoint for verifying a release before it actually reaches real users.",0,[920,1637,1677,1728]],["Local-First Development","A development workflow built around running and testing an entire application, or a close approximation of it, on a developer's own machine rather than depending on shared remote environments for everyday iteration.",0,[1226,2224,2366,2376]],["Dev Container","A containerised, version-controlled definition of a project's development environment, tools, extensions, and dependencies included, so every contributor and every AI coding agent starts from an identical, reproducible setup.",0,[1551]],["Vendored Dependencies","Third-party dependency code copied directly into a project's own repository rather than fetched from a package registry at build time, trading registry availability risk for a larger, self-contained repository.",0,[1399,1333,1334,1685]],["Peer Dependency","A dependency a package declares that it needs but expects the consuming project to provide itself, used so libraries that plug into a shared host, such as a UI framework, don't each bundle their own separate copy.",0,[1333,1334,1685,2388]],["Semantic Release","A tool that automates version bumping, changelog generation, and publishing by inferring the size of a release directly from the conventional structure of commit messages since the last one.",0,[615,2434,508,780]],["Multivariate Testing","Testing several variables at once, in combination, to measure not just each one's individual effect but how they interact, a broader relative of a simple two-variant A/B test.",0,[478,2108]],["Kill Switch","An emergency-only flag that disables a feature or dependency immediately in production, distinguished from an ordinary feature flag by being reserved for incident response rather than everyday rollout control.",0,[2107,934,141,352]],["Dark Launch","Deploying a new feature to production and running its code path for real users without ever surfacing it in the UI, used to validate performance and correctness under real load before anyone can see it.",0,[2301,511,2398]],["Ring Deployment","A staged rollout strategy that releases a change to successively larger, pre-defined groups of users, internal staff first, then early adopters, then everyone, rather than to a single random sample.",0,[1614,1332,1696,2069]],["Build Matrix","A CI configuration that runs the same job across multiple combinations of variables, such as operating system or language version, in parallel, catching compatibility problems a single fixed configuration would miss.",0,[2386]],["Self-Hosted Runner","A CI execution agent run on infrastructure the team controls rather than the CI provider's own shared infrastructure, used for specialised hardware, network access, or cost reasons a hosted runner can't satisfy.",0,[2101,1408,2100,259]],["Reusable Workflow","A CI workflow definition written once and called from multiple other workflows or repositories with different inputs, avoiding the same pipeline logic being copy-pasted everywhere it's needed.",0,[1399,1232,1870,2120]],["Test Sharding","Splitting a test suite across multiple parallel CI workers so the total wall-clock time to run it shrinks roughly in proportion to the number of workers used.",0,[2161,1759,1925]],["Flaky Test","A test that passes and fails intermittently against the same unchanged code, undermining trust in the whole test suite until it's fixed, quarantined, or removed.",0,[2249]],["Deployment Freeze","A deliberate, temporary halt on releasing new changes to production, typically declared around a high-risk period such as a major sales event, to keep the system's known-good state stable.",0,[1332,1696,2069,2091]],["Guardrail Metric","A metric tracked during an experiment specifically to catch unintended harm, such as error rate or latency, distinct from the primary metric the experiment is actually trying to move.",0,[480,721,760,1289]],["Sample Ratio Mismatch","A statistical warning sign in an A/B test where the actual split of users between variants doesn't match the intended split closely enough to be chance, usually meaning the experiment's results can't be trusted.","SRM",[2108,1503,605,693]],["Correlation ID","A unique identifier attached to a request when it first enters a system and passed along to every downstream call it triggers, letting every log line and trace span for that one request be tied back together."],["Context Propagation","The mechanism by which tracing and correlation identifiers are automatically carried from one process to the next across a request's entire path, without every service having to manually thread them through.",0,[1555,1980,37,282]],["USE Method","A troubleshooting checklist for infrastructure resources, utilisation, saturation, and errors, used to work through the likely causes of a performance problem systematically rather than guessing.","USE"],["Tail Latency","The response time experienced by the slowest fraction of requests, such as the 99th percentile, which matters more to real user experience at scale than the average, since a large system serves that tail constantly.",0,[1451,2152],"sys-tail-latency"],["SLO Burn Rate","How quickly a service is consuming its error budget relative to the pace that would exhaust it by the end of the measurement window, used to trigger alerts before a slow-moving degradation becomes a breach."],["Real User Monitoring","Performance and error measurement collected from actual users' browsers or devices in production, as opposed to synthetic checks run from a controlled test environment.","RUM",[2171,1899,60,458]],["Flame Graph","A visualisation of profiled call stacks stacked by frequency, where the width of each function's bar shows how much time was spent in it, making the hottest code path visually obvious at a glance.",0,[466,468,857],"sys-flame-graph"],["Heisenbug","A bug that changes behaviour or disappears entirely when someone tries to observe or debug it, often because the debugging tooling itself alters timing enough to mask a race condition.",0,[2165]],["OpenTelemetry","A vendor-neutral standard and set of libraries for generating traces, metrics, and logs, from an architect's view the thing that lets a system's instrumentation outlive any particular observability backend it's currently sent to.","OTel"],["Trace Context","The W3C standard header format that carries a trace's identifier and parent span across service boundaries, letting different vendors' tracing tools interoperate on the same distributed trace.",0,[2149,2150,2155,37]],["Baggage","Arbitrary key-value data propagated alongside a trace's context across every service it passes through, distinct from the trace itself in that it's meant to carry application data rather than tracing metadata.",0,[2148]],["Trace Sampling","Deciding which requests get their full trace recorded and which don't, a necessary trade-off between observability completeness and the storage and performance cost of tracing every single request.",0,[2151,2152,2148,2155]],["Head-Based Sampling","A trace sampling strategy that decides whether to record a trace at the moment the request begins, before knowing anything about how it will turn out, cheap but blind to which traces would actually be interesting.",0,[2150,794,905,2152]],["Tail-Based Sampling","A trace sampling strategy that waits until a request completes before deciding whether to keep its trace, letting a system preferentially keep traces of requests that were slow or errored.",0,[2150,2142,2151,2159]],["Apdex Score","A single performance satisfaction score derived by bucketing response times into satisfied, tolerating, and frustrated, used to communicate perceived performance as one number rather than a raw latency distribution.",0,[560,718,939,1888]],["Core Dump","A snapshot of a process's memory captured at the moment it crashed, examined after the fact to reconstruct exactly what state the program was in when it failed."],["Stack Trace","The sequence of function calls active at the moment an error occurred or a snapshot was taken, read from the point of failure back through everything that led to it.",0,[1869,2175,2176,473]],["Memory Leak","A bug where a program keeps allocating memory it never releases, growing its footprint over time until it degrades performance or crashes, regardless of whether the language manages memory automatically.",0,[2179,1766,243,1042]],["Memory Profiling","Measuring how a running program's memory is allocated and retained over time, used to find leaks and identify which code paths are responsible for excessive memory use.",0,[2158,243,1042,1101]],["CPU Profiling","Measuring where a running program actually spends its processor time, used to find the specific functions worth optimising instead of guessing based on where the code merely looks expensive.",0,[2157]],["Sampling Profiler","A profiler that periodically interrupts a running program to record what it's currently executing, building up a statistical picture of where time goes with far less overhead than tracing every single call.",0,[2174,2150,2151,2152]],["Off-CPU Analysis","Profiling time a thread spends blocked or waiting, on I/O, locks, or scheduling, rather than time it spends actively executing, used because a slow request is often waiting rather than computing.",0,[265,695,699,1299]],["Wall-Clock Time","The actual elapsed real-world time an operation took, as opposed to CPU time, which only counts time the processor was actively working on it and ignores time spent waiting.",0,[2134,1176]],["GC Pause","A stop in a program's execution while a garbage-collected runtime reclaims unused memory, a latency source specific to managed languages that shows up as periodic, sometimes unpredictable spikes.",0,[943],"sys-gc-pause"],["Lock Contention","Time threads spend waiting to acquire a lock another thread is currently holding, a common and often invisible source of latency in concurrent systems that look fine under low load."],["Deadlock","A state where two or more threads or processes are each waiting on a resource the other holds, so neither can ever proceed without external intervention."],["Race Condition","A bug where the correctness of a program's behaviour depends on the precise, unguaranteed timing or ordering of concurrent operations, making it work most of the time and fail unpredictably otherwise.",0,[2146]],["Git Bisect","A binary-search debugging technique that narrows down which commit introduced a bug by repeatedly testing the midpoint of a known good and known bad range of history."],["Minimal Reproducible Example","The smallest possible piece of code that still reliably triggers a bug, stripped of everything unrelated, produced because it's far easier to reason about and to hand to someone else, human or AI, for help.",0,[2234,1284,1415]],["Rubber Duck Debugging","The practice of explaining a problem out loud, line by line, to a listener who never needs to respond, because the act of articulating it precisely is often what surfaces the mistake.",0,[236,107,153,300]],["Print Debugging","Diagnosing a program's behaviour by inserting statements that output its state at various points, crude compared to a debugger but often faster to set up for a quick, isolated question.",0,[859,2168,2170,2174]],["Time-Travel Debugging","A debugging technique that records a program's entire execution so a developer can step backward through it after the fact, not just forward from a breakpoint, to find exactly where state first went wrong.",0,[829,2168,2169,2174]],["Session Replay","A real user monitoring technique that reconstructs a visual, step-by-step playback of an actual user's session from recorded interaction and DOM events, letting a developer watch a bug happen rather than just read about it.",0,[2144,860,1258,1911]],["Anomaly Detection","Automatically flagging metric or log behaviour that deviates significantly from a system's established normal pattern, used to surface problems that a fixed threshold alert would either miss or fire on constantly.",0,[215,1733,2089]],["AIOps","The application of machine learning to operations data, correlating signals across metrics, logs, and traces to surface likely root causes or predict incidents faster than a human triaging each stream separately.",0,[1508]],["Debugging in Production","Diagnosing a live issue directly against the running production system, using techniques such as sampling profilers and safe live queries rather than trying to reproduce the problem locally first.",0,[2159,2168,2169,2170]],["Symbolication","Translating the raw memory addresses in a crash report or stack trace back into human-readable function names and line numbers, essential for making a minified or compiled build's crashes debuggable at all.",0,[2155,2176]],["Crash Reporting","The automated capture and aggregation of application crashes from production, typically including a stack trace and device or environment context, so recurring failures can be prioritised by actual frequency.",0,[2155,2175,814,2401]],["Request Waterfall","A chronological visualisation of every network request a page or operation made, showing what ran in parallel, what blocked on what, and where the actual time went.",0,[2393,1638,1697,1817]],["Load Testing","Deliberately generating traffic at or beyond a system's expected peak to observe how it behaves and where it starts to degrade, done before real peak load arrives rather than during it.",0,[2179]],["Soak Testing","Running a system under sustained load for an extended period to catch problems that only appear over time, such as slow memory leaks or resource exhaustion, that a short load test would never reveal.",0,[2178,2156,2209]],["Performance Regression","A measurable slowdown introduced by a change, caught by comparing a benchmark against a previous baseline rather than relying on someone noticing it felt slower.",0,[560,2258]],["Thundering Herd","A surge where a large number of clients or processes all act at the same moment, such as retrying simultaneously after an outage ends, overwhelming a system that had just started to recover.",0,0,"sys-thundering-herd"],["Retry Storm","A feedback loop where a struggling system's slow responses trigger client retries, and those retries add enough extra load to make the system slower still, deepening the very failure the retries were meant to route around.",0,[233,1390,1421,1649],"sys-retry-storm"],["Circuit Breaker","A component that stops sending requests to a dependency after it detects repeated failures, failing fast locally instead, and only allows requests through again after a cooldown suggests the dependency has recovered.",0,[2199],"sys-circuit-breaker"],["Load Shedding","Deliberately rejecting a portion of incoming requests once a system is at capacity, prioritising serving the requests it keeps well over trying and failing to serve everything.",0,0,"sys-backpressure"],["Split Brain","A failure where a network partition leaves two halves of what should be one coordinated cluster each believing they are the sole authority, risking conflicting writes until the partition is resolved.",0,[1931,62,378,407],"sys-split-brain"],["Cascading Failure","A failure that starts in one component and spreads to others because they depended on it in a way that turns its failure into theirs, rather than being isolated and contained.",0,[1452,2187,2188,2192]],["Metastable Failure","A failure state that persists even after the original trigger is gone, sustained by a feedback loop, such as retries generating more load than the recovering system can absorb, rather than by the initial cause.",0,[233,2218,1452,2186],"sys-retry-storm"],["Grey Failure","A failure visible to some parts of a system or some users but invisible to the health checks and monitoring meant to catch it, the kind that keeps passing every check while actually degrading.",0,[1452,2186,2187,2192]],["Bulkhead","A design that partitions a system's resources, such as thread pools or connections, per dependency, so that one dependency exhausting its own allocation can't starve every other part of the system too.",0,[2191],"sys-circuit-breaker"],["Jitter","Deliberate randomness added to a retry delay so that many clients failing at the same moment don't all retry in perfect lockstep and recreate the exact overload they were backing off from."],["Blast Radius","The scope of what actually breaks when a given component or change fails, and the specific thing every isolation technique, from bulkheads to cell-based architecture, is trying to shrink.",0,[1351,2189,1925,2084],"sys-shuffle-shard"],["Single Point of Failure","A component whose failure alone is enough to take down the whole system, with no redundancy anywhere to absorb it.","SPOF",[734,771,1696,2362]],["Correlated Failure","Multiple components failing together because they share an underlying dependency or root cause, defeating redundancy that assumed their failures would be independent.",0,[1452,2186,2187,2188]],["Fault Injection","Deliberately introducing a failure, such as a dropped connection or an added delay, into a system to verify it actually handles that failure the way it's designed to, rather than assuming it does.",0,[1685,1865,1441,2205]],["Game Day","A scheduled exercise where a team deliberately triggers a realistic failure scenario in a controlled setting and practices responding to it, testing both the system's resilience and the team's own readiness.",0,[1433,908,942]],["Failure Mode and Effects Analysis","A structured method for working through a system component by component, listing how each could plausibly fail and what the downstream effect of that failure would be, before any of it actually happens.","FMEA",[265,695,699,1299]],["Timeout Budget","The total time an operation is allowed to take before giving up, allocated across every downstream call it makes so no single slow dependency can silently consume the entire budget on its own.",0,[819,1763,1972,567]],["Exponential Backoff","A retry strategy that increases the delay between successive attempts exponentially, giving a struggling dependency progressively more room to recover instead of hammering it at a constant rate."],["Fail Fast","Detecting and surfacing a failure as early and loudly as possible rather than letting a system continue in a state it can no longer guarantee is correct.",0,[1691,2183,141,1967],"sys-circuit-breaker"],["Dead Man's Switch","A monitor that expects to hear from a system periodically and alerts the moment it stops, catching the failure mode where a system goes silent instead of actively erroring.",0,[141,352,524,791]],["Watchdog Process","A separate process that monitors a primary process's health and restarts or intervenes if it stops responding, providing a recovery path that doesn't depend on the primary process noticing its own failure.",0,[39,195,781,1365]],["Self-Healing System","A system designed to detect its own degraded or failed components and automatically take corrective action, such as restarting or rerouting, without waiting for a human to intervene.",0,[1099,1380,259]],["Automatic Failover","The automated redirection of traffic or workload from a failed component to a healthy standby, triggered by detected failure rather than requiring a manual decision under pressure.",0,[1776,2090]],["Chaos Monkey","A tool, originating at Netflix, that randomly terminates production instances during business hours, forcing teams to build systems resilient enough that a random failure is a non-event rather than an incident.",0,[2242,2401]],["Fault Domain","A boundary within which a single failure, such as a power or network outage, can plausibly affect everything inside it, used to decide how redundant components must be placed to actually be independent.",0,[1441,2194,1389,1392]],["N+1 Redundancy","Provisioning one more unit of capacity than the minimum required to run, so that a single unit's failure still leaves the system able to run at full expected load."],["Disaster Recovery","The plans and infrastructure a system relies on to restore service after a catastrophic event takes out an entire primary environment, distinct from everyday high availability, which handles smaller, routine component failures.","DR",[1425,972,2067,2068]],["Near Miss","An event that could plausibly have caused an incident but didn't, worth investigating with the same rigour as an actual incident because the conditions that nearly caused it are still there."],["Resource Exhaustion","A failure caused by a system running out of some finite resource, such as memory, file handles, or connections, often building up gradually until it crosses a threshold and fails all at once.",0,[2179,1958]],["Memory Pressure","A state where available memory is running low enough to affect a system's behaviour, triggering garbage collection, swapping, or eviction well before memory is actually exhausted.",0,[302,243,1042,1101]],["Noisy Neighbour","A workload on shared infrastructure that consumes a disproportionate share of a resource, such as CPU or disk I/O, degrading performance for every other tenant sharing that same infrastructure.",0,[1828]],["Zombie Process","A process that has finished executing but still holds onto its resources or entry in a process table because nothing has properly cleaned it up, slowly starving the system of capacity.",0,[39,195,781,1365]],["Brownout","A deliberate, partial reduction in a system's functionality or quality under load, such as serving lower-resolution content, chosen to preserve overall availability instead of an all-or-nothing outage."],["Fallback Strategy","A predefined alternative response used when a primary dependency or code path fails, such as serving cached or default data, so a single failure doesn't have to become a user-visible error.",0,[1072,500,1874]],["Incident Commander","The person designated to coordinate an incident response, making decisions and directing effort, so that responders can focus on fixing the problem instead of also managing the response itself."],["War Room","A dedicated, often temporary space, physical or virtual, where responders to a major incident coordinate in real time, kept separate from normal channels so the response doesn't get lost in everyday noise.",0,[965,1133]],["Antifragility","A property beyond mere resilience, where a system actually improves or strengthens as a result of stress, failure, and volatility rather than merely surviving it unchanged.",0,[1433]],["Work Amplification","A feedback mechanism in a metastable failure where each unit of retried or re-queued work generates more downstream work than the original request did, driving the system further from recovery the longer it persists.",0,[233,2187]],["Sympathetic Failure","A failure that spreads to a component not through a direct dependency but through a resource, such as a connection pool or thread pool, that the failing and the healthy component happen to share.",0,[1745,1452,2186,2187]],["Alert Fatigue","The desensitisation that sets in when responders receive too many alerts, especially low-value or frequently false ones, leading them to miss or ignore a genuinely critical one buried among the noise.",0,[479,1555,1159,1245]],["Property-Based Testing","A testing approach that checks a general rule holds across many randomly generated inputs, rather than checking one hand-picked example at a time.",0,[2251,87,1580]],["Contract Testing","Verifying that a service's actual behaviour matches the contract its consumers depend on, without needing to run the consumers themselves.",0,[1310,1319,1320,1656]],["Tautological Test","A test that always passes regardless of whether the code under test is correct, typically because it asserts something trivially true, a common defect in AI-generated tests.",0,[2237]],["Eval-Driven Development","A development cycle for AI features where a scored evaluation set, not just pass/fail tests, drives what counts as an improvement.",0,[1226,2376,2119,2122]],["Playwright","A browser automation framework for end-to-end testing that drives real browsers across Chromium, Firefox and WebKit from one API."],["Testcontainers","A library that spins up real, disposable service instances, such as databases, in containers for a test run, then tears them down afterward.",0,[1555]],["TLA+","A formal specification language used to model a system's behaviour precisely and mechanically check it for correctness before any code is written.",0,[2240]],["Jepsen","A testing framework and methodology for verifying distributed systems' correctness under network partitions, crashes and other real-world faults."],["Mutation Testing","A technique that automatically introduces small deliberate bugs into code and checks whether the test suite actually catches them, to measure how meaningful the tests are.",0,[478,1555,2255]],["Golden File","A saved, known-correct o
