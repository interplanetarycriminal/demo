utput that a test compares new output against, flagging anything that doesn't match exactly.",0,[428,714,1304,658]],["Verification Harness","The surrounding infrastructure that runs a piece of generated or changed code against checks and reports whether it actually behaves correctly.",0,[2396,1236,1866]],["Non-Determinism Handling","The testing practices needed to reliably test code whose output can legitimately vary between runs, such as AI-generated responses.",0,[623,1724,1895]],["Eval Set Versioning","Tracking changes to an evaluation dataset over time, so a score improvement or regression can be traced to a specific change in the test cases themselves.",0,[480,996,659,759]],["Reproducible Test Run","A test execution set up so that repeating it, with the same inputs and seed, always produces the same result.",0,[2167]],["Test Oracle","The source of truth a test compares actual output against, and the central difficulty in testing AI output, whose \"correct\" answer often isn't a single fixed value."],["Semantic Diff","A comparison between two pieces of code or output based on their actual meaning or behaviour, rather than a line-by-line textual difference.",0,[508,780,1074,1275]],["AI-Generated Test","A test written by an AI agent rather than a human, which still needs review since it can as easily encode a bug as catch one.",0,[2223,1263]],["Coverage Gaming","Writing tests that inflate a code coverage number without meaningfully verifying behaviour, a failure mode AI agents optimising for a coverage target can fall into."],["Model-Based Testing","Generating test cases automatically from a formal model of expected system behaviour, rather than writing each test case by hand."],["Formal Specification","A precise, mathematically defined description of what a system must do, exact enough to be mechanically checked rather than just read.",0,[2227,2252,1084,1262]],["Invariant Checking","Verifying that a condition which must always hold true actually does, at every point it's checked, throughout a system's execution.",0,[1309,1366,1659]],["Chaos Testing","Deliberately injecting failures into a running system to verify it degrades or recovers the way it's supposed to.",0,[2204,2401]],["Deterministic Simulation Testing","Testing a distributed system by running it inside a simulated environment where time, network and randomness are all controlled, so failures are perfectly reproducible.","DST"],["Record-Replay Testing","Capturing real interactions or traffic once, then replaying them deterministically as a test to catch regressions.",0,[1555,1081,2015,1797]],["Ephemeral Test Environment","A fully provisioned test environment created fresh for a single test run and destroyed immediately after.",0,[1728,1637,1677,2105]],["Evaluation Rubric","The explicit set of criteria used to score an AI output's quality, whether applied by a human grader or a model acting as judge.",0,[229,712,731,732]],["Pass@k","A code-generation evaluation metric measuring the probability that at least one of k sampled generations passes, used to score how reliably a model produces working code."],["Code Generation Benchmark","A standardised set of coding tasks used to measure and compare how well different models or agents produce correct, working code.",0,[478,729,1032,1103]],["Flaky Test Quarantine","The practice of automatically isolating a test that fails intermittently so it stops blocking builds while it's investigated.",0,[2135]],["Differential Testing","Comparing the output of two implementations of the same behaviour against identical inputs, to catch cases where they disagree."],["Property Shrinking","The process a property-based testing tool uses to reduce a failing random input down to the smallest example that still reproduces the failure.",0,[2221,87,1580]],["Model Checking","Exhaustively exploring a system's possible states against a formal specification to prove, rather than merely test, that a property always holds.",0,[2240,1366,1659]],["Linearizability Checking","Analysing a concurrent system's recorded history of operations to verify it behaves as if those operations happened one at a time, in some valid order.",0,[1366,1659]],["Test Impact Analysis","Determining which tests are actually affected by a given code change, so only the relevant subset needs to run.",0,[265,695,699,1299]],["Mutation Score","The percentage of introduced mutants a test suite successfully detects, used as a measure of test suite strength beyond raw coverage.",0,[478,2229,718,939]],["Requirement Traceability","The ability to trace every requirement forward to the tests that verify it, and every test back to the requirement it exists to check.",0,[829,1330,1429,2394]],["Agentic Task Evaluation","Scoring whether an autonomous agent actually completed a real task correctly, not just whether it produced plausible-looking output along the way.",0,[229,712,731,732]],["Regression Corpus","An accumulated set of past failure cases kept and re-run against every future change, so a bug once fixed can't silently reappear.",0,[2180]],["Static Type Checking","Verifying that a program's types are used consistently, without running it, catching a class of errors before the code ever executes.",0,[1463,1477,1366,1659]],["Trajectory Evaluation","Scoring the sequence of steps an agent took to reach its result, not just the final outcome, to catch cases where a right answer was reached the wrong way.",0,[229,712,731,732]],["Idempotent Test Setup","Test setup written so that running it repeatedly leaves the system in the same state, rather than accumulating side effects across runs.",0,[1814,612]],["Strangler Fig Migration","Incrementally routing traffic from an old system to a new one feature by feature until the old system handles nothing and can be switched off, named for the fig that grows around and eventually replaces its host tree.",0,[2270,1175,1741,1756]],["Parallel Change","Making a breaking change in three stages, expand the interface to support both old and new, migrate every caller across, then contract by removing the old interface, so nothing is ever broken mid-migration.",0,[1624,2271,463,197]],["Dual-Write","Writing the same change to two systems at once during a migration, kept as a stopgap because it's inherently fragile: a failure partway through leaves the two systems disagreeing with no built-in way to tell.",0,[2273,2271,1774,1801]],["Lift-and-Shift","Moving a system to new infrastructure, typically the cloud, with minimal change to its architecture, trading the larger benefits of a proper redesign for a faster, lower-risk move.",0,[169,1471]],["Wrong Abstraction","An abstraction built to unify things that looked similar but weren't, forcing every new difference between them into awkward conditionals instead of being allowed to diverge back into separate code.",0,[1555,1308,1606,2412]],["Speculative Generality","Building flexibility or configurability for requirements that don't exist yet and may never arrive, paid for immediately in complexity against a benefit that may never be collected.",0,[1922]],["Chesterton's Fence","The principle that a rule, structure, or piece of code that looks pointless should not be removed until you understand why it was put there in the first place."],["Bikeshedding","Spending disproportionate time debating a trivial, easy-to-have-an-opinion-on detail while a genuinely important but harder decision gets far less scrutiny."],["Big Bang Migration","Cutting over from an old system to a new one all at once, the deliberate opposite of a strangler fig migration, chosen when a gradual coexistence period isn't feasible or the system is small enough to make it low-risk.",0,[2262,2271,1175,1741]],["Coexistence Period","The interval during an incremental migration when both the old and new systems are live and handling real traffic simultaneously, the period every parallel-change and dual-write safeguard actually exists to protect.",0,[2263,2264,2270,2273]],["Shadow Read","Reading from both the old and new system during a migration and comparing the results without acting on the new system's answer yet, used to build confidence in its correctness before it's trusted with real traffic.",0,[518,1500,1894,2086]],["Dual Read","Querying two systems for the same data during a migration and reconciling or choosing between the results, the read-side counterpart to a dual-write during the coexistence period.",0,[2264,2271]],["Mikado Method","A technique for planning a large refactor by attempting the change directly, noting every compile or test failure it causes as a prerequisite, reverting, and building a dependency graph of prerequisites to tackle first.",0,[2439]],["Preparatory Refactoring","Restructuring existing code specifically to make an upcoming change easy before attempting that change, on the premise that a change should be split into making it easy, then making the now-easy change.",0,[2439]],["Code Smell","A surface-level pattern in code that isn't a bug and doesn't stop the program from working, but reliably correlates with a deeper design problem worth investigating.",0,[2277,2278,2279,2280]],["Primitive Obsession","A code smell where domain concepts that deserve their own type, such as a currency amount or an email address, are represented as bare primitives like strings or numbers instead.",0,[2276,1533]],["Long Parameter List","A code smell where a function takes so many parameters that callers routinely get the order wrong or pass values that don't logically belong grouped together.",0,[2276,1224,869]],["Divergent Change","A code smell where one module has to be changed in different, unrelated ways for different reasons, a sign its responsibilities should have been split apart rather than combined.",0,[2276,197,240,996]],["Middle Man","A code smell where a class does nothing but delegate almost all of its work to another class, adding an indirection layer without adding any real value of its own.",0,[2276]],["Refused Bequest","A code smell where a subclass inherits methods or data from a parent it doesn't actually want or use, a sign the inheritance relationship was a poor fit for the underlying design.",0,[2276]],["Lava Flow","Dead, poorly understood code that originated as an experiment or an old approach and hardened into production simply because nobody was confident enough to remove it."],["Architectural Erosion","The gradual divergence between a system's intended architecture and what it has actually become in practice, accumulating through small individually justified exceptions until the original design no longer describes reality.",0,[1312,1328,1344]],["Reverse Engineering","Working backward from a system's existing behaviour or output to reconstruct an understanding of its design, undertaken when the original intent was never documented or the people who knew it have moved on.",0,[1290,730,1231,2364]],["Code Archaeology","The practice of digging through a codebase's history, commit messages, and old comments to understand why something was built the way it was before changing it."],["Second-System Effect","The tendency for a follow-up system, built by a team who learned from a first system's limitations, to become dangerously over-ambitious and over-engineered as a reaction to everything the first one lacked.",0,[727]],["Sunk Cost Fallacy","Continuing to invest in a system or approach because of how much has already been spent on it, rather than on an honest assessment of what continuing to invest is actually worth going forward.",0,[829,264],0,264],["Rule of Three","A heuristic that says to wait until the same code has been duplicated a third time before abstracting it, since the first two occurrences rarely reveal the right shape for a reusable abstraction.",0,[110]],["Agentic Code Migration","Using an AI coding agent to execute a large-scale, mechanical refactor or migration across a codebase under human-defined rules and checkpoints, rather than a person applying every change by hand.",0,[920,2439,1175,21]],["Interim Architecture","A deliberately temporary architectural state adopted partway through a multi-stage migration, accepted as fit for purpose for that stage even though it isn't the eventual target design.",0,[307,1327,1348,1349]],["Nit","A reviewer comment flagging a minor, non-blocking issue, explicitly marked as optional so the author and reviewer both know it isn't holding up the change."],["Rubber Stamp Review","A code review that approves a change without genuinely engaging with it, providing the appearance of oversight without any of its actual value.",0,[107,153,300,656]],["Legacy Modernisation","The deliberate, often multi-year effort to bring an ageing system's architecture, platform, or codebase up to current practice, distinct from a rewrite in that it's usually incremental and business-continuity-first.",0,[194,1175,2440]],["Anti-Pattern","A commonly repeated response to a recurring problem that looks reasonable in the moment but reliably produces worse outcomes than a known better alternative.",0,[16,1374],0,16],["System Sunsetting","The deliberate, planned decommissioning of a system, including migrating its remaining users and data elsewhere and formally retiring it, rather than letting it linger unmaintained indefinitely."],["Feature Parity","The point at which a replacement system does everything its predecessor did, treated as the practical gate before decommissioning the old system rather than an arbitrary milestone.",0,[2106,606,1383,2107]],["Cutover","The specific moment traffic or responsibility is switched from an old system to its replacement, the point every migration strategy is ultimately building toward and trying to make as uneventful as possible.",0,[2300]],["Compatibility Shim","A thin layer of translation code inserted temporarily so an old caller and a new implementation can keep working together during a migration, removed once every caller has moved to the new interface directly."],["Version Skew","The temporary state during a rollout where different instances of a system, or its old and new components, are running different versions simultaneously and must remain compatible with each other.",0,[659,759,997,998]],["Hard Cutover","A cutover with no fallback path, where the old system is switched off at the same moment the new one takes over, chosen only once confidence in the new system is high enough that reverting isn't a realistic option.",0,[2297,2406]],["Soft Launch","Releasing a rearchitected system quietly, to a limited audience or without promotion, so problems can surface and be fixed before it's exposed to full attention and full load.",0,[2129,1757]],["HyperCard","Apple's 1987 hypermedia construction kit that let non-programmers build linked card stacks scripted in HyperTalk; neglected after Steve Jobs's return and discontinued in 2004, it was never directly replaced.",0,[2355,1189,2353]],["VisiCalc","The first spreadsheet program, written by Dan Bricklin and Bob Frankston in 1979 and the Apple II's killer application; eclipsed by Lotus 1-2-3 within four years."],["Project Xanadu","Ted Nelson's hypertext project, begun around 1960, specifying two-way links, transclusion and visible provenance; decades of work never produced a full release, and the one-way-link web filled the space.",0,[52,2369,2370,68]],["Minitel","France Telecom's videotex terminal network, rolled out nationally from 1982, that gave millions of French households online directories, messaging and commerce before the web; switched off in 2012."],["MSX","A 1983 home-computer hardware standard from Microsoft and ASCII Corporation adopted by many Japanese manufacturers and sold widely in Japan, the Netherlands, Brazil and the Middle East; the standard faded by 1990."],["Demoscene","A European-centred subculture, grown from 1980s cracktro screens, that competes to produce real-time audiovisual programs pushing hardware limits; still active, and listed as intangible cultural heritage in several countries including Finland and Germany.",0,[2325,2340]],["Bulletin Board System","A dial-up computer hosting message boards, file areas and door games for one caller at a time, run worldwide by volunteer sysops from 1978 through the 1990s; the web dissolved the culture.","BBS",[2320]],["Shareware","A 1980s-90s distribution model in which software circulated freely on disks and bulletin boards with payment requested for continued use or full versions; it built id Software and Apogee, then faded into trialware and app stores.",0,[2338]],["Abandonware","Commercial software whose owner no longer sells or supports it, preserved and redistributed by grey-market communities such as Home of the Underdogs; legally unresolved but foundational to software preservation."],["Internet Archive Software Library","The Internet Archive's collection, opened in 2013, of hundreds of thousands of historical programs runnable in the browser through emulation; the largest public software archive.",0,[747,749,1098,1147]],["WordStar","The dominant word processor of the CP/M and early DOS eras, released in 1978, whose control-key diamond commands trained a generation of touch-typists; it lost the market to WordPerfect and then Microsoft Word."],["Lotus 1-2-3","The spreadsheet that became the IBM PC's killer application on release in 1983; defeated by Excel in the Windows transition and discontinued by IBM in 2013.",0,[552]],["Netscape Navigator","The browser, released in 1994, that popularised the web for the general public; it lost the browser war with Microsoft, was discontinued by 2008, and its code seeded Mozilla Firefox.",0,[1113]],["Gopher","A menu-driven internet document protocol from the University of Minnesota, released in 1991, that briefly rivalled the early web; university licensing fees and the web's richer pages ended it."],["GeoCities","A free web-hosting service, launched in 1994, that organised millions of personal homepages into themed neighbourhoods; Yahoo closed it in 2009 and Archive Team rescued terabytes of it.",0,[1555]],["Adobe Flash","The animation and interactive-content platform of the 2000s web, scripted in ActionScript; excluded from iOS, superseded by HTML5 and shut down in 2020, its works preserved by Ruffle and Flashpoint.",0,[149,642,778]],["Visual Basic 6","Microsoft's 1998 rapid-application-development tool that put forms-based Windows programming into millions of business hands; Microsoft ended the classic language in 2008 despite user petitions to continue it.",0,[2366,196,221,223]],["Turbo Pascal","Borland's fast, cheap Pascal compiler and integrated editor, created by Anders Hejlsberg in 1983, that taught a generation to program; superseded by Delphi and the Windows era."],["FidoNet","A volunteer store-and-forward network, founded in 1984, that exchanged mail and discussion echoes between bulletin board systems across continents before internet access was common; it declined with the culture that hosted it.",0,[829,2308]],["Sharp X68000","Sharp's 68000-based home computer, sold only in Japan from 1987, whose arcade-class graphics and sound made it the platform for near-perfect arcade ports; it faded as DOS/V machines standardised the Japanese market."],["NEC PC-9801","NEC's PC-9800 series, launched in 1982, which dominated the Japanese domestic PC market for over a decade with its own software base; DOS/V and Windows ended its separate ecosystem."],["BBC Micro","Acorn's 1981 computer built for the BBC Computer Literacy Project and placed throughout UK schools; it made programming a national curriculum experience and its successors produced the ARM processor.",0,[1350]],["ZX Spectrum","Sinclair's cheap colour home computer of 1982 that created the UK's bedroom-coder games industry; cloned across the world long after its British commercial life ended.",0,[2325,778,817]],["Pentagon 128","A Soviet ZX Spectrum 128 clone designed around 1989 whose circuit board was copied and assembled across the former USSR through the mid-1990s; its timing behaviour became the reference platform for the Russian Spectrum demoscene.",0,[2307,2324]],["Elektronika BK-0010","A cheap 16-bit PDP-11-compatible sold from 1984 as the only mass-produced official Soviet home computer; hobbyists kept it alive after production ended with the USSR."],["Gradiente Expert","Brazil's best-selling MSX computer, released in 1985 as a clone of National's CF-3000 in a stereo-styled case; it thrived under Brazil's import-ban market reserve and faded with it.",0,[716,1153,1411]],["MicroBee","Applied Technology's Z80 computer of 1982, the first personal computer designed and made in Australia, installed in more than three thousand schools; it faded as imported IBM-compatibles took the education market."],["CEC-I","A Chinese school computer of 1986, developed under a Tsinghua University-led programme as an Apple IIe-compatible with built-in Chinese character input; superseded as IBM-compatible PCs entered Chinese education."],["Commodore Amiga","Commodore's 1985 multimedia computer whose custom chips and preemptively multitasking AmigaOS were years ahead of PC rivals; Commodore's 1994 bankruptcy orphaned the platform.",0,[119]],["OS/2","The PC operating system IBM and Microsoft began jointly in 1987 and IBM continued alone after Windows 3.0 split the partnership; it lost the desktop but ran for years in ATMs and persists as ArcaOS.",0,[1410]],["Xerox Alto","Xerox PARC's 1973 workstation, the first computer built around a graphical interface, mouse and Ethernet; never sold widely, it previewed the personal computing that others commercialised.",0,[1206,110,76,85]],["Lisp Machine","A workstation built to run Lisp with hardware support, commercialised in the 1980s by MIT AI Lab spin-offs Symbolics and Lisp Machines Inc; the AI winter and cheap RISC workstations killed the category.",0,[1144,2372,29,1510]],["Fifth Generation Computer Systems","Japan's MITI-funded national project, run by ICOT from 1982 to 1992, to build massively parallel logic-programming computers for artificial intelligence; it ended without commercial machines and stands as a caution for national AI programmes.","FGCS",[2357,1032,1103,1477]],["Acorn Archimedes","Acorn's 1987 desktop, the first computer shipped with an ARM processor, running RISC OS; Acorn broke up in 1998 while ARM went on to power most of the world's devices, and RISC OS persists on the Raspberry Pi."],["Floppy Disk Culture","The practices that grew around the floppy disk from the late 1970s: sneakernet sharing, public-domain libraries and disk magazines; the media itself is now physically decaying, driving archival imaging efforts.",0,[2337]],["Cover Disk","A floppy disk or tape mounted on a newsstand magazine cover, common in the UK, Europe and Brazil through the 1980s and 1990s, carrying full programs, demos and game exclusives; the practice died with print circulation and cheap bandwidth.",0,[144,1738,2336]],["Shovelware","CD-ROM compilations of the 1990s that dumped thousands of shareware programs, clip-art files or games onto a single disc with little curation; the format's excess made the term a lasting insult.",0,[2309]],["Type-In Program","A program published as printed source code in magazines and books from the late 1970s to the late 1980s for readers to key in by hand; a mass programming education that ended when commercial software outgrew listing length.",0,[163,2397,2436]],["Warez Scene","The organised software piracy underground of the 1980s to 2000s whose crack intros, keygen music and NFO text art fed the demoscene and chip-music aesthetics; its releases now serve archivists as preservation copies.",0,[2307]],["MAME","An arcade emulator begun by Nicola Salmoria in 1997 that grew into a documentation project re-implementing thousands of machines in software; it made hardware-accurate preservation a standing practice."],["DOSBox","A DOS emulator from the Netherlands, released in 2002, that made 1980s and 1990s PC software routinely runnable on modern systems; it became the standard vehicle for legal re-releases of DOS games."],["MiSTer","An open-source project, begun in 2017, that re-implements classic computers, consoles and arcade boards on FPGA hardware for near-cycle-accurate behaviour; it moved preservation from software approximation to hardware fidelity.",0,[630]],["Image-Based Persistence","The Smalltalk practice of keeping an entire running system - objects, tools and state - in one savable, resumable image; file-based languages and version control pushed it aside, and Pharo and Glamorous Toolkit continue it as a live substrate an AI agent can inspect whole.",0,[1372,2379,849]],["Literate Programming","Donald Knuth's 1984 approach of writing a program as an essay for human readers from which compilable code is extracted; IDE culture ignored it, notebooks partially revived it, and it re-emerges wherever prose context must drive code generation.",0,[2444,1083,1303,2386]],["End-User Programming","The research goal, pursued since the 1980s, of letting people who are not programmers build and modify their own software; each vehicle faded with its platform, and natural-language coding assistants are its largest-scale attempt yet.","EUP",[2356,1083,1303,2386]],["Dataflow Programming","Programming by wiring data transformations into a graph, as in LabVIEW, Max/MSP and Pure Data; it stayed niche outside laboratories and music, and returns in node editors such as Unreal Blueprints and TouchDesigner.",0,[1083,1303,2386,2437]],["Constraint Programming","Declaring the relations a solution must satisfy and letting a solver find the values, a lineage starting with Sutherland's Sketchpad in 1963; imperative code buried it, while layout engines and modern solvers carry it on.",0,[2380,26,44,1083]],["Tuple Space","David Gelernter's 1985 Linda model coordinating parallel processes through a shared associative memory of tuples; it faded with 1990s parallelism, and resurfaces wherever decoupled agents need a common working store.",0,[395,430,1357]],["Naked Objects","Richard Pawson's 2000s pattern generating the entire user interface directly from the domain objects; it stayed niche, surviving in Apache Causeway, and internal-tool generators re-argue its economy.",0,[3,1345,1395,1499]],["Worse Is Better","Richard Gabriel's 1991 diagnosis that simplicity of implementation beats completeness and correctness in adoption; never refuted, it is rediscovered whenever an elegant system loses to a shippable one.",0,[2372]],["Local-First Software","The design position, stated by Martin Kleppmann and Ink & Switch in 2019, that data should live on the user's device with synchronisation layered over it via CRDTs; the cloud won the 2010s, and local-first is now an active movement with conferences and products.",0,[2450,1098,1147,2311]],["Malleable Software","Ink & Switch's 2025 term for software users can reshape with minimal friction, making modification routine rather than exceptional; it restates the HyperCard and Smalltalk ambition for an era in which AI can perform the modifications.",0,[2302,2374,1098,1147]],["Live Programming","Modifying a program while it runs and seeing the effect immediately, native to Lisp and Smalltalk systems; batch compile-run culture displaced it, and hot reload, notebooks and live-coding environments recover it piecemeal.",0,[1600,2454,1083,1303]],["HyperTalk","HyperCard's English-like scripting language of 1987 that let non-programmers automate their stacks; it died with its host, and LiveCode, Decker and no-code tools cite it as ancestor.",0,[2302]],["Spreadsheet Programming","The recognition that the spreadsheet is the most successful end-user programming model in history; long dismissed as not real programming, it was formalised when Excel's LAMBDA made the formula language Turing-complete.",0,[2346,1083,1303,2386]],["Logic Programming","Computation expressed as deduction over facts and rules, established by Colmerauer and Kowalski around 1972; the AI winter marginalised it, and it returns through Datalog engines in databases and program analysis.",0,[2359,2334,2358,1083]],["Prolog","The principal logic-programming language, created in Marseille in 1972; it lost general-purpose ground after the 1980s AI boom, and persists in constraint solving, computational linguistics and symbolic reasoning niches.",0,[2357]],["Datalog","A restricted, guaranteed-terminating subset of Prolog for querying facts and rules; academic for decades, it re-emerged in Datomic, differential dataflow and static-analysis engines.",0,[2357]],["Blackboard Architecture","A 1970s AI design from CMU's Hearsay-II in which specialist modules cooperate by posting partial results to a shared workspace; the AI winter shelved it, and it is re-argued as a coordination pattern for multiple LLM agents.",0,[307,1327,1348,1349]],["Everything Is a File","Plan 9's 1992 discipline of exposing every resource - windows, networks, processes - as files served over one protocol; the operating system never spread, while the idea persists in WSL2 and QEMU and in arguments for uniform tool interfaces.",0,[658]],["Single-Language System","Wirth and Gutknecht's Oberon system of 1987, building operating system, applications and tools in one small language; heterogeneous stacks won, and minimal-software movements cite it as proof of how little is needed.",0,[769,1386,1409,2422]],["Compound Document","The OpenDoc model of 1992-97 in which documents are assembled from interchangeable component parts rather than owned by monolithic applications; Apple cancelled it in 1997, and block-based editors re-argue the idea.",0,[1115,1536,1002,1262]],["Computer-Aided Software Engineering","The 1980s promise of generating systems from diagrams and models with integrated tooling; it collapsed under its own ceremony and cost, and low-code platforms are its explicit reprise.","CASE",[730,1231,2284,0]],["Fourth-Generation Language","A class of 1980s languages, such as dBase, promising applications from far fewer statements than third-generation code; the web transition stranded them, and their pitch returned as no-code.","4GL",[552,1555,1032,1103]],["Rapid Application Development","The 1990s practice of building business applications by visually composing forms bound to data, as in Delphi and PowerBuilder; the web's document model broke it, and internal-tool builders have rebuilt it.","RAD",[2318,1368,1398,1992]],["Model-Driven Architecture","The OMG's programme, launched around 2001, making models the source of truth with code generated from them; it drowned in ceremony and round-trip failures, while domain-specific languages and AI code generation revisit the goal.","MDA",[1555,1349,307,1327]],["Croquet","The replicated-computation architecture of Alan Kay, David Reed and David Smith in the 2000s, in which identical deterministic virtual machines stay synchronised by sharing only inputs; the project stalled, and the approach returned for multiplayer web work as Croquet OS and Multisynq.",0,[983,2451]],["Transclusion","Ted Nelson's 1965 concept of including content by live reference so provenance and context stay visible; Xanadu never shipped it at scale, and wikis, backlinking note tools and web annotation carry fragments of it.",0,[992,2304]],["Two-Way Link","The hypertext link that knows its referrers, specified in Xanadu and NLS but dropped by the one-way web; backlink databases in note-taking tools and citation graphs rebuild it above the web.",0,[52,2304]],["Bootstrapping","Douglas Engelbart's 1962 strategy of using tools to improve the collective ability to improve tools, compounding capability; funding shifted to consumer ease of use, and the tools-for-thought movement claims the lineage.",0,[2445]],["The Right Thing","The MIT school of design putting correctness, consistency and completeness first, embodied in Lisp machines and ITS; it lost to worse-is-better Unix economics, and resurfaces in every safety-critical and formal-methods debate.",0,[2333,2351,283,1572]],["Boxer","Andrea diSessa's 1986 environment treating computation as a visible, concrete medium any learner could inspect and modify; it never spread beyond research, and its principles reached scale through Scratch."],["Wiki","Ward Cunningham's 1995 invention of a website every reader can edit in place, the simplest thing that could possibly work; the form narrowed to Wikipedia, and malleable-software work revives universal editability.",0,[2353,2453,2375]],["Federated Wiki","Cunningham's 2011 rework of the wiki in which each author hosts their own copy and pages fork between sites in the manner of distributed version control; it stayed a research community, anticipating decentralised collaboration tools.",0,[329,753,2374]],["REPL-Driven Development","Programming inside a live session where each expression is evaluated in the running system, native to Lisp since the 1960s; compile-run cycles displaced it, and Clojure workflows and notebooks argue its return.",0,[1226,2224,2119,2122]],["Text-Based User Interface","The dense, keyboard-first screen design language of DOS-era applications; graphical interfaces swept it away, and modern terminal applications deliberately revive it for speed, scriptability and remote use.","TUI",[769]],["Skeuomorphism","Interface design using real-world visual metaphors to teach unfamiliar interactions, dominant on early iOS; flat design purged it by 2013, and each generation re-argues the affordances lost, from neumorphism to visionOS depth.",0,[157,230,513]],["Orthogonal Persistence","The 1980s-90s research position, in PS-algol and Napier88, that long-lived data should not require manual marshalling to a database; object-relational mapping won instead, and durable-execution systems revive the promise.",0,[1372,2344]],["Sketchpad","Ivan Sutherland's 1963 interactive graphics system introducing constraints, instancing and direct manipulation on screen; decades ahead of its hardware, it seeded interface research whose ideas still ship first as demos.",0,[268,61,2348]],["Cassowary","A linear-arithmetic constraint-solving algorithm for user interface layout published in the late 1990s; ignored for a decade, it shipped to billions as the engine of Apple's Auto Layout.",0,[3,650]],["Software Crisis","The founding complaint of software engineering, named at the 1968 NATO conference in Garmisch, that large systems arrive late, over budget and unreliable; every subsequent methodology answers it, and AI-scale codebases restate it.",0,[1166,1098,1147,2311]],["The Tar Pit","Fred Brooks's 1975 image of large-system programming as a tar pit in which struggling harder sinks teams deeper; it opens The Mythical Man-Month and still describes programmes that add process to escape process.",0,[2385]],["No Silver Bullet","Brooks's 1986 argument that no single technique will deliver an order-of-magnitude productivity gain because software's difficulty is essential rather than accidental; every tool wave since, AI assistants included, is measured against it.",0,[2442,467,1291]],["Mythical Man-Month","Brooks's 1975 thesis that people and months are not interchangeable because communication cost grows with team size; project plans still price labour as though they were.",0,[2383,2442]],["Programming as Theory Building","Peter Naur's 1985 argument that a program is the team's theory of the world, held in heads rather than code, so the theory dies with the team; it explains why inherited and machine-generated codebases resist revival from source alone.",0,[2131,1083,1303,2345]],["The Reuse Dream","Douglas McIlroy's 1968 NATO proposal for an industry of interchangeable software components, perpetually almost realised; package registries deliver the mechanics while the promised component engineering economics remain elusive."],["Dependency Hell","The version-conflict problem among shared components, named DLL hell on 1990s Windows; renamed each era, it resurfaced in npm's 2016 left-pad removal and in today's transitive supply chains.",0,[1333,1334,1685,2124]],["Bit Rot","The decay of software and data that are not actively maintained, exemplified by the 1986 BBC Domesday Project becoming unreadable within sixteen years while the 1086 original survives; format and platform churn keep recreating it."],["Brooks's Law","Brooks's 1975 law that adding manpower to a late software project makes it later, because ramp-up and communication costs exceed the new output; staffing surges before deadlines still prove it."],["Go To Statement Considered Harmful","Dijkstra's 1968 letter arguing that unstructured jumps defeat human reasoning about program state; it won the structured-programming argument and set the template for every considered-harmful debate since.",0,[622,1276]],["The Humble Programmer","Dijkstra's 1972 Turing lecture holding that programmers must respect the smallness of their own heads and design to manage intellectual limits; ever-larger systems keep renewing the advice.",0,[2435]],["Waterfall Model","The sequential development doctrine attributed to Winston Royce's 1970 paper, which in fact called the single-pass diagram risky and inviting failure; the misreading was standardised into contracts and persists in staged procurement.",0,[2177]],["The Requirements Problem","The finding, in Bell and Thayer's 1976 study and Brooks's 1987 restatement, that the hardest part of building software is deciding precisely what to build; requirements are grown through iteration, yet fixed-scope contracting survives.",0,[1330,1429,2256,900]],["Semantic Gap","The distance between problem-domain concepts and machine representations, discussed since the 1970s; every abstraction layer relocates rather than closes it, most recently between natural-language intent and generated code.",0,[508,780,1074,1275]],["The Verification Gap","The distance between Hoare's 1969 axiomatic programme for proving programs correct and everyday practice, sharpened by De Millo, Lipton and Perlis in 1979; outside kernels and compilers, proof remains too costly for real software.",0,[2231]],["Program Comprehension","The finding, quantified by Corbi at IBM in 1989, that most maintenance effort is spent reading code to re-derive intent; it remains the bottleneck that AI assistants both ease and, by generating unread code, enlarge.",0,[163,2339,2436]],["Digital Dark Age","The prospect, named by Terry Kuny in 1997, that the recorded present will be unreadable to the future as formats, media and platforms die; proprietary cloud services extend the risk beyond physical media.",0,[124,666,511,2129]],["Productivity Paradox","Robert Solow's 1987 observation that computers are visible everywhere except in the productivity statistics, analysed by Brynjolfsson in 1993; the same measurement debate now reruns for AI tools.",0,[250]],["Death March","Edward Yourdon's 1997 name for projects that everyone involved knows are doomed but that continue for organisational reasons; the pattern survives every change of methodology.",0,[97]],["CHAOS Report","The Standish Group's project-failure statistics published since 1994, widely cited and, per Eveleens and Verhoef's 2010 critique, methodologically unreliable; the field still lacks trusted measures of its own failure rate.",0,[478,814,2176,2204]],["Technical Debt","Ward Cunningham's 1992 metaphor for shipping with incomplete understanding and paying interest in future change cost; diluted into a synonym for bad code, the original meaning about unconsolidated learning fits AI-generated systems precisely.",0,[2453,24,757]],["Lehman's Laws of Software Evolution","Meir Lehman's laws, developed from 1974 to 1996, that a used program must continually change or grow progressively less useful while its complexity increases unless actively reduced; every long-lived codebase demonstrates them.",0,[1555,1631,1098,1147]],["Software Aging","Parnas's 1994 analysis that programs age both by failing to adapt to changing needs and by accumulating damage from repeated change; dependency churn has accelerated both mechanisms.",0,[1098,1147,2311,2352]],["EWD Notes","Dijkstra's handwritten and typed notes, circulated from the 1960s until 2002 and archived at UT Austin, warning for decades about complexity and rigour; the industry keeps re-learning their content under new names.",0,[2443,615]],["The Two Hard Things","Phil Karlton's dictum that there are only two hard things in computer science, cache invalidation and naming things; both remain unsolved in every cache layer and codebase since.",0,[1786,2300]],["The Estimation Problem","The persistent inability to predict software cost and schedule, treated systematically in Boehm's 1981 Software Engineering Economics with its cone of uncertainty; estimates still miss, and AI-assisted velocity has widened the variance.",0,[2416,900,1150,1164]],["The Ninety-Ninety Rule","Tom Cargill's rule, popularised in Jon Bentley's 1985 CACM column, that the first 90 per cent of the code takes 90 per cent of the time and the remaining 10 per cent takes the other 90; demo-to-production gaps still obey it."],["Wirth's Law","Niklaus Wirth's 1995 observation, in A Plea for Lean Software, that software gets slower faster than hardware gets faster; bundled runtimes and layered frameworks keep it current."],["The Big Rewrite","The recurring decision to rebuild a working system from scratch, called the single worst strategic mistake by Joel Spolsky in 2000 with Netscape as the exhibit; each generation re-attempts it, lately with AI as the promised accelerant.",0,[236]],["Bus Factor","The measure of how many people can leave a project before it stalls for lost knowledge; it operationalises Naur's theory-building problem and remains low in most codebases, heavily AI-assisted ones included.",0,[478]],["The Law of Leaky Abstractions","Joel Spolsky's 2002 law that all non-trivial abstractions leak their underlying details under failure or load; each new layer, model-generated code included, adds a surface that must eventually be understood.",0,[1308,1606,2266]],["The Year 2038 Problem","The overflow of 32-bit signed Unix time on 19 January 2038, successor to the year 2000 problem; embedded systems shipping today will still be running when it arrives.",0,[900,1150,1164,1165]],["Greenspun's Tenth Rule","Philip Greenspun's 1990s rule that any sufficiently complicated C program contains an ad hoc, informally specified, bug-ridden implementation of half of Common Lisp; a standing joke about reinvented platforms."],["Zawinski's Law","Jamie Zawinski's law that every program attempts to expand until it can read mail; shorthand for unchecked feature accretion."],["Hofstadter's Law","Douglas Hofstadter's 1979 law that everything takes longer than expected, even when accounting for Hofstadter's Law; the recursive core of the estimation problem.",0,[2407]],["Feature Creep","The gradual accumulation of features beyond a product's purpose, degrading coherence and maintainability; documented in every era's post-mortems and unsolved by any of them.",0,[1426,1555,606,1167]],["Model Context Protocol","An open standard released by Anthropic in November 2024 for connecting AI applications to external tools and data sources over a common client-server interface; adopted across the major AI vendors within a year.","MCP",[2422,711,1950,1954]],["Claude Code","Anthropic's agentic coding tool, released in 2025, that runs in the terminal, reads and edits repositories, executes commands and carries out development tasks from natural-language instruction.",0,[1228,1399]],["Cursor","Anysphere's AI-centred code editor, a fork of Visual Studio Code built around inline generation, codebase-aware chat and agentic edits; a flagship of the AI-editor category since 2023.",0,[270,984,985],"ux-presence",270],["GitHub Copilot","GitHub's AI coding assistant, launched in 2021 as autocomplete powered by OpenAI models and later extended to chat and agent modes; the first AI pair-programmer at mass scale.",0,[323,1030,2101]],["Language Server Protocol","Microsoft's 2016 protocol separating language intelligence from editors so one server can deliver completion and diagnostics to any client; the decoupling pattern the Model Context Protocol later applied to AI tooling.","LSP",[2418,769,1386,1409]],["Aider","An open-source terminal tool by Paul Gauthier for AI pair programming that maps a repository and commits model-written changes to git; an early demonstration that agentic coding needed no IDE.",0,[1228,1399]],["Ollama","An open-source runtime, released in 2023, for downloading and running large language models locally with a single command; the standard entry point for on-device model use in development."],["Hugging Face","The company and platform, founded in 2016, hosting the dominant public hub of machine-learning models, datasets and libraries; the de facto registry of the open model ecosystem.",0,[172,1215]],["Hyrum's Law","Hyrum Wright's observation from Google that with enough users every observable behaviour of an interface will be depended on, contract or not; it governs what can ever be changed, model behaviour included."],["Conway's Law","Melvin Conway's 1968 finding that organisations design systems that copy their own communication structures; team-topology practice treats it as a constraint to design with rather than fight.",0,[1552,1341]],["Gall's Law","John Gall's 1975 principle that a complex system that works is invariably found to have evolved from a simple system that worked; the standing argument against designing complex systems from scratch."],["Goodhart's Law","Charles Goodhart's 1975 principle, popularised as: when a measure becomes a target it ceases to be a good measure; it now describes benchmark gaming in AI evaluation as well as engineering metrics.",0,[478]],["Amdahl's Law","Gene Amdahl's 1967 law that speed-up from parallelism is bounded by the serial fraction of the work; it caps hardware scaling and team parallelism alike."],["Linus's Law","Eric Raymond's 1999 formulation, named for Linus Torvalds, that given enough eyeballs all bugs are shallow; open-source security incidents keep testing how many eyeballs actually look.",0,[2448]],["Kernighan's Law","Brian Kernighan's maxim, from the 1974 Elements of Programming Style, that debugging is twice as hard as writing the code, so maximally clever code cannot be debugged by its author; it now extends to code written by models."],["Designing Data-Intensive Applications","Martin Kleppmann's 2017 book on the architecture of data systems - replication, partitioning, consistency and stream processing; the standard text for distributed-data literacy.","DDIA",[1812,2450,1368,1398]],["Release It!","Michael Nygard's 2007 book on designing software that survives production, drawn from real failure post-mortems; it introduced the stability-pattern vocabulary operations teams still use.",0,[615,2110,2126]],["The Pragmatic Programmer","Hunt and Thomas's 1999 book of programming craft - tracer bullets, don't repeat yourself, broken windows - revised in 2019; much of its vocabulary entered everyday practice.",0,[1291,2392]],["Structure and Interpretation of Computer Programs","Abelson and Sussman's 1985 text teaching programming as the construction of layered abstractions in Scheme; long MIT's introductory course book and still a reference point for language fundamentals.","SICP",[163,2339,2397,0]],["The Art of Computer Programming","Donald Knuth's multi-volume treatise on algorithms, published since 1968 and still in progress; the field's reference work of record and the origin of rigorous algorithm analysis.","TAOCP",[2444,0,31,48]],["Design Patterns","The 1994 book by Gamma, Helm, Johnson and Vlissides cataloguing twenty-three reusable object-oriented designs; it created a shared vocabulary and, later, the backlash against pattern overuse.",0,[1685]],["Refactoring","Martin Fowler's 1999 book naming and cataloguing behaviour-preserving code transformations; it made continuous restructuring a first-class engineering practice.",0,[1309,2274,2289,2275]],["Working Effectively with Legacy Code","Michael Feathers's 2004 book defining legacy code as code without tests and giving techniques for changing it safely; the standing manual for inherited systems.",0,[1175,2293]],["A Philosophy of Software Design","John Ousterhout's 2018 book arguing that complexity is the central enemy of software and deep modules with simple interfaces the main weapon; a common reference in design and code-review debates.",0,[1098,1147,2311,2352]],["Fred Brooks","The IBM engineer, 1931-2022, who managed System/360 and OS/360, wrote The Mythical Man-Month and No Silver Bullet, and founded the University of North Carolina's computer science department; Turing Award 1999.",0,[2384,2385]],["Edsger Dijkstra","The Dutch computer scientist, 1930-2002, behind the shortest-path algorithm, structured programming, semaphores and decades of EWD notes on rigour; Turing Award 1972.",0,[2405]],["Donald Knuth","The Stanford computer scientist, born 1938, author of The Art of Computer Programming, creator of TeX and originator of literate programming; Turing Award 1974.",0,[2345,2437]],["Douglas Engelbart","The SRI researcher, 1925-2013, who invented the mouse and demonstrated hypertext, screen sharing and collaborative editing in the 1968 Mother of All Demos, in service of augmenting human intellect.",0,[52,1007,48,50]],["Grace Hopper","The US Navy rear admiral, 1906-1992, whose A-0 system pioneered compilation and whose FLOW-MATIC led directly to COBOL; she made programming in English-like languages practical."],["Barbara Liskov","The MIT professor, born 1939, whose CLU language introduced abstract data types and whose substitution principle defines behavioural subtyping; Turing Award 2008."],["Linus Torvalds","The Finnish engineer, born 1969, who created the Linux kernel in 1991 and Git in 2005; the two infrastructures beneath most servers and most software collaboration.",0,[2431]],["Rich Hickey","The creator of Clojure in 2007 and of Datomic, whose talks such as Simple Made Easy argue for immutability and for separating simple from easy; a shaping voice in functional systems design.",0,[1401]],["Martin Kleppmann","The Cambridge researcher who wrote Designing Data-Intensive Applications, co-authored the local-first software essay and leads CRDT research; a bridge between distributed-systems theory and practice.",0,[2352,479,2433]],["Alan Kay","The Xerox PARC researcher, born 1940, who led Smalltalk, framed object-orientation around message passing and proposed the Dynabook; Turing Award 2003.",0,[1114,1206,76,85]],["Margaret Hamilton","The MIT engineer, born 1936, who led the Apollo Guidance Computer flight software and championed the term software engineering; Presidential Medal of Freedom 2016."],["Ward Cunningham","The programmer, born 1949, who invented the wiki in 1995, coined the technical debt metaphor in 1992 and helped found the patterns and extreme programming communities.",0,[2402,2374]],["Bret Victor","The interface designer whose 2012 talk Inventing on Principle and Dynamicland research lab argue for an immediate, visible connection between creators and their work; widely cited in live-programming and tools-for-thought research.",0,[2354]]]};
</script>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)},
    $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var T=CODEX.T, OWN=[], SLUG={}, LCH=[], LCD=[], BOOKS={ux:CODEX.ux.books,ai:CODEX.ai.books};
var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var ROM=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV','XXVI','XXVII','XXVIII','XXIX','XXX','XXXI'];
var ck='ux', searching=false, curBook=0, chunk=6;
var stream=$('#stream'), results=$('#results'), rail=$('#rail'), qEl=$('#q');

/* ---------- index ---------- */
(function(){
  ['ux','ai'].forEach(function(k){
    BOOKS[k].forEach(function(b,bi){
      for(var i=b.s;i<b.s+b.c;i++) OWN[i]={ck:k,bi:bi};
    });
  });
  for(var i=0;i<T.length;i++){
    LCH[i]=T[i][0].toLowerCase();
    LCD[i]=T[i][1].toLowerCase();
    var s=OWN[i].ck+'-'+slugify(T[i][0]);
    if(SLUG[s]===undefined) SLUG[s]=i;
  }
})();
function slugify(s){return s.toLowerCase().replace(/[’'`]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,52);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nf(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function clause(d){
  var m=d.match(/^[^—;:.]{18,110}/);
  var c=m?m[0]:d.slice(0,96);
  return c.replace(/[\s,]+$/,'')+(c.length<d.length?'…':'');
}
function total(k){var n=0;BOOKS[k].forEach(function(b){n+=b.c});return n;}
var TOT={ux:total('ux'),ai:total('ai')};

/* ---------- theme ---------- */
var docEl=document.documentElement;
function readLS(k){try{return localStorage.getItem(k)}catch(e){return null}}
function writeLS(k,v){try{localStorage.setItem(k,v)}catch(e){}}
(function(){
  var t=readLS('codex-theme');
  if(t==='night'||t==='day') docEl.setAttribute('data-theme',t);
  var c=readLS('codex-ck'); if(c==='ai'||c==='ux') ck=c;
})();
function isNight(){
  var t=docEl.getAttribute('data-theme');
  if(t) return t==='night';
  return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function paintTheme(){var g=isNight()?'☀':'☾';$('#theme').textContent=g;var m=$('#mTheme');if(m)m.textContent=g;}
function toggleTheme(){var n=isNight()?'day':'night';docEl.setAttribute('data-theme',n);writeLS('codex-theme',n);paintTheme();}
$('#theme').addEventListener('click',toggleTheme);
$('#mTheme').addEventListener('click',toggleTheme);
paintTheme();

/* ---------- masthead + rail ---------- */
function paintMast(){
  var C=CODEX[ck];
  $('#mastsub').textContent = ck==='ux'
    ? 'An illuminated reading room for the Applied·Interactive UX/UI Codex — thirty-one books on how interfaces are perceived, built and remembered.'
    : 'An illuminated reading room for the AI-Era Programming Codex — thirty-one books on building software when the machine writes the code.';
  $('#maststats').innerHTML =
    '<span><b>'+nf(TOT[ck])+'</b> terms</span>'+
    '<span><b>'+BOOKS[ck].length+'</b> books</span>'+
    '<span>companion codex · <b>'+nf(TOT[ck==='ux'?'ai':'ux'])+'</b> terms</span>'+
    '<span><b>'+CODEX.demoCount+'</b> interactive demos linked</span>';
  document.title = (ck==='ux'?'UX/UI':'AI-Era')+' · The Codex Explorer';
}
function railRow(b,bi){
  return '<button class="rrow" data-b="'+bi+'" type="button">'+
    '<span class="rnum">'+ROM[bi]+'</span>'+
    '<span class="rtxt"><span class="rtitle">'+esc(b.t)+'</span><span class="rdesc">'+esc(b.d)+'</span></span>'+
    '<span class="rcount">'+b.c+'</span></button>';
}
function paintRail(){
  var C=CODEX[ck],h='<div class="rail-h"><span class="eyebrow">'+(ck==='ux'?'UX/UI Codex':'AI-Era Codex')+'</span><span class="n">'+BOOKS[ck].length+' books</span></div>';
  h+=BOOKS[ck].map(railRow).join('');
  h+='<div class="rail-foot">Hover a book for its argument. Numerals mark the '+(ck==='ux'?'warm':'cool')+' rubric of this codex.</div>';
  rail.innerHTML=h;
  var sb=$('#sheetBody');
  sb.innerHTML='<div style="padding:0 8px 8px"><span class="eyebrow">'+(ck==='ux'?'UX/UI Codex':'AI-Era Codex')+' · '+BOOKS[ck].length+' books</span></div>'+BOOKS[ck].map(railRow).join('');
}
rail.addEventListener('click',onRailClick);
$('#sheetBody').addEventListener('click',function(e){onRailClick(e);closeSheet();});
function onRailClick(e){
  var r=e.target.closest('.rrow'); if(!r) return;
  var bi=+r.dataset.b;
  if(searching){ clearSearch(true); }
  gotoBook(bi);
}
function gotoBook(bi){
  var sec=$('#bk'+bi); if(!sec) return;
  renderBook(bi);
  var y=sec.getBoundingClientRect().top+window.pageYOffset-(56+34);
  window.scrollTo({top:y,behavior:RM?'auto':'smooth'});
  setActive(bi);
}

/* ---------- stream ---------- */
var io=null, ioActive=null, sortMode={}, unfolded={};
function estHeight(c){return Math.ceil(c/chunk)*34 + c*44;}
function bookShell(b,bi){
  return '<section class="book" id="bk'+bi+'" data-b="'+bi+'">'+
   '<div class="bhead"><div class="bnum">'+ROM[bi]+'</div>'+
   '<div class="bmeta"><div class="btitlerow"><h2>'+esc(b.t)+'</h2><span class="bcount">'+b.c+' terms</span>'+
   '<div class="bbtns"><button class="minib sortb" data-b="'+bi+'" aria-pressed="false" title="Sort alphabetically">A→Z</button>'+
   '<button class="minib unfoldb" data-b="'+bi+'" aria-pressed="false">Unfold all</button></div></div>'+
   '<p class="bdesc">'+esc(b.d)+'</p></div></div>'+
   '<div class="btools"><div class="az" id="az'+bi+'"></div></div>'+
   '<div class="entries" id="en'+bi+'" data-r="0" style="min-height:'+estHeight(b.c)+'px"></div></section>';
}
function buildStream(){
  if(io) io.disconnect();
  if(ioActive) ioActive.disconnect();
  stream.innerHTML=BOOKS[ck].map(bookShell).join('');
  sortMode={};unfolded={};
  io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting) renderBook(+e.target.id.slice(2)); });
  },{rootMargin:'1000px 0px 1000px 0px'});
  $$('.entries',stream).forEach(function(el){io.observe(el)});
  ioActive=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting) setActive(+e.target.dataset.b); });
  },{rootMargin:'-'+(56+40)+'px 0px -68% 0px'});
  $$('.book',stream).forEach(function(el){ioActive.observe(el)});
  renderBook(0);paintAZ(0);
}
function entryHTML(i){
  var t=T[i];
  return '<div class="entry" id="e'+i+'" data-i="'+i+'">'+
   '<div class="ehead" role="button" tabindex="0" aria-expanded="false">'+
   '<span class="hw">'+esc(t[0])+'</span>'+(t[2]?'<span class="acro">'+esc(t[2])+'</span>':'')+
   '<span class="clause">'+esc(clause(t[1]))+'</span><span class="chev">+</span></div>'+
   '<div class="ebody"><div class="ebody-in"><p class="def">'+esc(t[1])+'</p><div class="chips" data-lazy="1"></div></div></div></div>';
}
function orderOf(bi){
  var b=BOOKS[ck][bi],idx=[],i;
  for(i=b.s;i<b.s+b.c;i++) idx.push(i);
  if(sortMode[bi]) idx.sort(function(a,c){return LCH[a]<LCH[c]?-1:LCH[a]>LCH[c]?1:0});
  return idx;
}
function renderBook(bi){
  var el=$('#en'+bi); if(!el||el.dataset.r==='1') return;
  var idx=orderOf(bi),html='',k,cur='';
  if(sortMode[bi]){
    for(k=0;k<idx.length;k++){
      var L=T[idx[k]][0].charAt(0).toUpperCase();
      if(!/[A-Z]/.test(L)) L='#';
      if(L!==cur){ if(cur) html+='</div>'; cur=L; html+='<div class="card lettered"><div class="cardlet">'+L+'</div>'; }
      html+=entryHTML(idx[k]);
    }
    if(cur) html+='</div>';
  }else{
    for(k=0;k<idx.length;k++){
      if(k%chunk===0) html+=(k?'</div>':'')+'<div class="card"><span class="cardrange"><i>¶</i>'+(k+1)+'–'+Math.min(k+chunk,idx.length)+'</span>';
      html+=entryHTML(idx[k]);
    }
    if(idx.length) html+='</div>';
  }
  el.innerHTML=html; el.dataset.r='1'; el.style.minHeight='';
  paintAZ(bi);
  if(unfolded[bi]) $$('.entry',el).forEach(function(e){setOpen(e,true,true)});
}
function paintAZ(bi){
  var az=$('#az'+bi); if(!az||az.dataset.r==='1') return;
  var b=BOOKS[ck][bi],have={},i;
  for(i=b.s;i<b.s+b.c;i++){var c=T[i][0].charAt(0).toUpperCase();have[c]=(have[c]||0)+1;}
  var h='';
  for(i=65;i<=90;i++){var L=String.fromCharCode(i);
    h+='<button type="button" data-b="'+bi+'" data-l="'+L+'"'+(have[L]?' title="'+have[L]+' terms"':' disabled')+'>'+L+'</button>';}
  az.innerHTML=h;az.dataset.r='1';
}
stream.addEventListener('click',function(e){
  var az=e.target.closest('.az button');
  if(az&&!az.disabled){ jumpLetter(+az.dataset.b,az.dataset.l); return; }
  var sb=e.target.closest('.sortb');
  if(sb){ var bi=+sb.dataset.b; sortMode[bi]=!sortMode[bi];
    sb.setAttribute('aria-pressed',sortMode[bi]?'true':'false'); sb.textContent=sortMode[bi]?'¶ order':'A→Z';
    var en=$('#en'+bi); en.dataset.r='0'; en.innerHTML=''; renderBook(bi); return; }
  var ub=e.target.closest('.unfoldb');
  if(ub){ var b2=+ub.dataset.b; unfolded[b2]=!unfolded[b2];
    ub.setAttribute('aria-pressed',unfolded[b2]?'true':'false'); ub.textContent=unfolded[b2]?'Fold all':'Unfold all';
    renderBook(b2);
    var enb=$('#en'+b2);
    if(enb) $$('.entry',enb).forEach(function(en){setOpen(en,unfolded[b2],true)});
    return; }
  var eh=e.target.closest('.ehead');
  if(eh){ var en2=eh.parentNode; setOpen(en2,en2.dataset.open!=='1'); }
});
stream.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var eh=e.target.closest('.ehead'); if(!eh)return;
  e.preventDefault(); var en=eh.parentNode; setOpen(en,en.dataset.open!=='1');
});
function jumpLetter(bi,L){
  renderBook(bi);
  var el=$('#en'+bi),list=$$('.entry',el),i,t;
  for(i=0;i<list.length;i++){ t=T[+list[i].dataset.i][0].charAt(0).toUpperCase();
    if(t===L){ flashTo(list[i]); return; } }
}
function flashTo(en){
  var y=en.getBoundingClientRect().top+window.pageYOffset-(56+64);
  window.scrollTo({top:y,behavior:RM?'auto':'smooth'});
  en.classList.remove('flash'); void en.offsetWidth; en.classList.add('flash');
  var sibs=en.parentNode.children,i;
  for(i=0;i<sibs.length;i++) if(sibs[i]!==en) sibs[i].classList.add('dimmed');
  setTimeout(function(){for(var i=0;i<sibs.length;i++) sibs[i].classList.remove('dimmed');},1100);
}
function setOpen(en,open,instant){
  if(!en) return;
  var body=en.querySelector('.ebody'),head=en.querySelector('.ehead');
  if(open){
    var chips=en.querySelector('.chips');
    if(chips&&chips.dataset.lazy==='1') fillChips(chips,+en.dataset.i);
    en.dataset.open='1'; head.setAttribute('aria-expanded','true');
    if(instant||RM){ body.style.height='auto'; return; }
    body.style.height='0px'; var h=body.scrollHeight;
    requestAnimationFrame(function(){ body.style.height=h+'px';
      setTimeout(function(){ if(en.dataset.open==='1') body.style.height='auto'; },200); });
  }else{
    if(instant||RM){ en.dataset.open='0'; head.setAttribute('aria-expanded','false'); body.style.height='0px'; return; }
    body.style.height=body.scrollHeight+'px';
    requestAnimationFrame(function(){ en.dataset.open='0'; head.setAttribute('aria-expanded','false'); body.style.height='0px'; });
  }
}
function fillChips(box,i){
  box.dataset.lazy='0';
  var t=T[i],h='';
  if(t[4]) h+='<a class="chip demo" href="'+esc(t[4])+'.html" title="'+esc(CODEX.D[t[4]]||'Open the interactive demo')+'">⚡ interactive demo</a>';
  if(t[5]!==0&&t[5]!==undefined&&t[5]!==null){
    h+='<button class="chip x" type="button" data-j="'+t[5]+'">↔ also in the '+(OWN[t[5]].ck==='ux'?'UX/UI':'AI-Era')+' codex</button>';
  }
  if(t[3]&&t[3].length){
    h+='<span class="chiplabel">see also</span>';
    t[3].forEach(function(j){ var far=OWN[j].ck!==OWN[i].ck;
      h+='<button class="chip'+(far?' far':'')+'" type="button" data-j="'+j+'" title="Book '+ROM[OWN[j].bi]+' · '+esc(BOOKS[OWN[j].ck][OWN[j].bi].t)+'">'+esc(T[j][0])+
         (far?'<span class="chiptag">'+(OWN[j].ck==='ux'?'UX':'AI')+'</span>':'')+'</button>'; });
  }
  box.innerHTML=h||'<span class="chiplabel">Book '+ROM[OWN[i].bi]+' · '+esc(BOOKS[OWN[i].ck][OWN[i].bi].t)+'</span>';
}
document.addEventListener('click',function(e){
  var c=e.target.closest('.chip[data-j]'); if(!c) return;
  e.preventDefault(); jumpTo(+c.dataset.j);
});
function jumpTo(j){
  var o=OWN[j];
  if(searching) clearSearch(true);
  if(o.ck!==ck){ setCodex(o.ck); }
  renderBook(o.bi);
  requestAnimationFrame(function(){
    var en=$('#e'+j); if(!en) return;
    setOpen(en,true); flashTo(en); setActive(o.bi);
    history.replaceState(null,'','#'+o.ck+'-'+slugify(T[j][0]));
  });
}

/* ---------- active book / crumb / progress ---------- */
function setActive(bi){
  if(bi===curBook&&rail.querySelector('.rrow[data-on="1"]')) return;
  curBook=bi;
  $$('.rrow').forEach(function(r){ r.dataset.on = (+r.dataset.b===bi)?'1':'0'; });
  var row=rail.querySelector('.rrow[data-on="1"]');
  if(row){ var rt=row.offsetTop, rh=row.offsetHeight, st=rail.scrollTop, vh=rail.clientHeight;
    if(rt<st+8||rt+rh>st+vh-8) rail.scrollTo({top:Math.max(0,rt-vh/2+rh/2),behavior:RM?'auto':'smooth'}); }
  paintCrumb();
}
var crumbEl=$('#crumb'),ticking=false;
function paintCrumb(){
  var b=BOOKS[ck][curBook]; if(!b) return;
  var n='',en=$('#en'+curBook);
  if(en&&en.dataset.r==='1'){
    var list=en.children, ent, top=56+70, k=0, cnt=0, found=0;
    var all=en.querySelectorAll('.entry');
    for(k=0;k<all.length;k++){ var r=all[k].getBoundingClientRect(); cnt++;
      if(r.top>=top-6){ found=cnt; break; } }
    if(!found) found=all.length;
    n=' <span class="sep">·</span> term '+found+' of '+b.c;
  }
  crumbEl.innerHTML='<span class="sep">'+(ck==='ux'?'UX/UI':'AI-Era')+' codex</span><span class="sep">›</span> <b>Book '+ROM[curBook]+'</b> <span class="sep">·</span> '+esc(b.t)+n;
}
var pbar=$('#pbar'),totop=$('#totop');
function onScroll(){
  if(ticking) return; ticking=true;
  requestAnimationFrame(function(){
    ticking=false;
    var h=document.documentElement.scrollHeight-window.innerHeight;
    var p=h>0?Math.min(1,Math.max(0,window.pageYOffset/h)):0;
    pbar.style.width=(p*100).toFixed(2)+'%';
    totop.dataset.on=window.pageYOffset>620?'1':'0';
    if(!searching) paintCrumb();
  });
}
window.addEventListener('scroll',onScroll,{passive:true});
totop.addEventListener('click',function(){window.scrollTo({top:0,behavior:RM?'auto':'smooth'});});

/* ---------- codex switch ---------- */
function setCodex(k,skipScroll){
  if(k===ck) return;
  ck=k; writeLS('codex-ck',k);
  docEl.setAttribute('data-ck',k);
  $('#tab-ux').setAttribute('aria-selected',k==='ux'?'true':'false');
  $('#tab-ai').setAttribute('aria-selected',k==='ai'?'true':'false');
  paintMast();paintRail();buildStream();curBook=-1;setActive(0);
  if(!skipScroll) window.scrollTo({top:0,behavior:'auto'});
  if(searching) runSearch(qEl.value,true);
}
$$('.switch button').forEach(function(b){b.addEventListener('click',function(){setCodex(b.dataset.ck);});});

/* ---------- search ---------- */
var CAP=200, tmr=null;
function hits(k,q){
  var out=[],books=BOOKS[k],bi,b,i,h,p,sc,d;
  for(bi=0;bi<books.length;bi++){ b=books[bi];
    for(i=b.s;i<b.s+b.c;i++){
      h=LCH[i]; p=h.indexOf(q); sc=0;
      if(p===0) sc=h.length===q.length?200:150;
      else if(p>0) sc=110-Math.min(p,40);
      else if(T[i][2]&&T[i][2].toLowerCase().indexOf(q)===0) sc=120;
      else { d=LCD[i]; p=d.indexOf(q); if(p>=0) sc=60-Math.min(p,240)/8; }
      if(sc>0) out.push([sc,i,bi]);
    }
  }
  out.sort(function(a,c){ return c[0]-a[0] || (LCH[a[1]]<LCH[c[1]]?-1:1); });
  return out;
}
function hl(s,q){
  var l=s.toLowerCase(),p=l.indexOf(q);
  if(p<0) return esc(s);
  return esc(s.slice(0,p))+'<mark>'+esc(s.slice(p,p+q.length))+'</mark>'+esc(s.slice(p+q.length));
}
function defSnip(d,q){
  var l=d.toLowerCase(),p=l.indexOf(q);
  if(p<0) return esc(clause(d));
  var s=Math.max(0,p-42), t=d.slice(s,s+160);
  return (s?'…':'')+hl(t,q)+(s+160<d.length?'…':'');
}
function runSearch(raw,force){
  var q=String(raw||'').trim().toLowerCase();
  $('#qclear').style.display=q?'block':'none';
  if(q.length<2){ if(searching) clearSearch(); return; }
  searching=true; stream.hidden=true; results.hidden=false; document.body.classList.add('searching');
  var t0=(performance&&performance.now)?performance.now():0;
  var H=hits(ck,q), other=hits(ck==='ux'?'ai':'ux',q);
  /* rail badges */
  var per={},i;
  for(i=0;i<H.length;i++) per[H[i][2]]=(per[H[i][2]]||0)+1;
  $$('.rrow').forEach(function(r){
    var n=per[+r.dataset.b]||0, c=r.querySelector('.rcount');
    r.dataset.hit=n?'1':'0';
    if(n){c.setAttribute('data-hit','1');c.textContent=n;} else {c.removeAttribute('data-hit');c.textContent=BOOKS[ck][+r.dataset.b].c;}
  });
  if(!H.length){
    results.innerHTML='<div class="empty"><h2>No matches for “'+esc(raw)+'”.</h2>'+
      '<p>Nothing in the '+(ck==='ux'?'UX/UI':'AI-Era')+' codex answers to that spelling. Try a broader stem, or one of these:</p>'+
      '<div class="chips">'+['affordance','gestalt','latency','onboarding','caching','contrast'].map(function(s){
        return '<button class="chip" type="button" data-sug="'+s+'">'+s+'</button>';}).join('')+'</div>'+
      (other.length?'<p class="more">The '+(ck==='ux'?'AI-Era':'UX/UI')+' codex has <b>'+other.length+'</b> match'+(other.length>1?'es':'')+' — <button class="chip" type="button" id="xsw">search there instead →</button></p>':'')+
      '</div>';
    crumbEl.innerHTML='<span class="sep">Search</span> <span class="sep">›</span> <b>0 matches</b>';
    return;
  }
  var shown=Math.min(H.length,CAP),html='';
  for(i=0;i<shown;i++){
    var gi=H[i][1], b=BOOKS[ck][H[i][2]];
    html+='<button class="res'+(i<10&&!RM?' anim':'')+'" type="button" data-i="'+gi+'"'+(i<10&&!RM?' style="animation-delay:'+(i*20)+'ms"':'')+'>'+
      '<span class="rline"><span class="rhw">'+hl(T[gi][0],q)+'</span>'+
      '<span class="rbook">Book '+ROM[H[i][2]]+' · '+esc(b.t)+'</span></span>'+
      '<span class="rclause">'+defSnip(T[gi][1],q)+'</span></button>';
  }
  var ms=((performance&&performance.now)?performance.now():0)-t0;
  results.innerHTML='<div class="rwrap"><div class="rtop"><h2>'+nf(H.length)+' match'+(H.length===1?'':'es')+' for “'+esc(raw)+'”</h2>'+
    '<span class="n">'+(ck==='ux'?'UX/UI':'AI-Era')+' codex · '+ms.toFixed(0)+' ms</span></div>'+
    '<div class="rlist">'+html+'</div>'+
    (H.length>shown?'<p class="more">Showing the '+CAP+' strongest of '+nf(H.length)+' — refine the query to see more.</p>':'')+
    (other.length?'<div class="xcodex"><span class="chiplabel">across the shelf</span> <button class="chip" type="button" id="xsw">'+other.length+' match'+(other.length>1?'es':'')+' in the '+(ck==='ux'?'AI-Era':'UX/UI')+' codex →</button></div>':'')+
    '</div>';
  crumbEl.innerHTML='<span class="sep">Search</span> <span class="sep">›</span> <b>'+nf(H.length)+' match'+(H.length===1?'':'es')+'</b> <span class="sep">·</span> '+esc(raw);
}
results.addEventListener('click',function(e){
  var sug=e.target.closest('[data-sug]');
  if(sug){ qEl.value=sug.dataset.sug; var m=$('#mq'); if(m)m.value=sug.dataset.sug; runSearch(sug.dataset.sug); return; }
  if(e.target.closest('#xsw')){ setCodex(ck==='ux'?'ai':'ux',true); return; }
  var jm=e.target.closest('.jump');
  if(jm){ e.stopPropagation(); jumpTo(+jm.dataset.i); return; }
  var r=e.target.closest('.res'); if(!r) return;
  var open=r.dataset.open==='1', gi=+r.dataset.i;
  if(open){ r.dataset.open='0'; r.querySelector('.rclause').innerHTML=defSnip(T[gi][1],qEl.value.trim().toLowerCase()); var j=r.querySelector('.jump'); if(j) j.remove(); }
  else{ r.dataset.open='1';
    r.querySelector('.rclause').innerHTML=esc(T[gi][1]);
    var extra=document.createElement('span'); extra.className='jump'; extra.dataset.i=gi;
    extra.textContent='↗ read in Book '+ROM[OWN[gi].bi];
    r.appendChild(extra); }
});
function clearSearch(keep){
  searching=false; results.hidden=true; results.innerHTML=''; stream.hidden=false;
  document.body.classList.remove('searching');
  if(!keep){ qEl.value=''; var m=$('#mq'); if(m) m.value=''; }
  $('#qclear').style.display='none';
  $$('.rrow').forEach(function(r){ r.removeAttribute('data-hit');
    var c=r.querySelector('.rcount'); c.removeAttribute('data-hit'); c.textContent=BOOKS[ck][+r.dataset.b].c; });
  paintCrumb();
}
function onType(e){
  var v=e.target.value; var other=e.target.id==='q'?$('#mq'):qEl; if(other) other.value=v;
  clearTimeout(tmr); tmr=setTimeout(function(){runSearch(v)},90);
}
qEl.addEventListener('input',onType);
$('#qclear').addEventListener('click',function(){clearSearch();qEl.focus();});
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){e.preventDefault();qEl.focus();qEl.select();}
  if(e.key==='Escape'){ if(sheetOpen) closeSheet(); else if(searching||qEl.value) clearSearch(); }
});

/* ---------- mobile sheet + mobile search ---------- */
var sheet=$('#sheet'),scrim=$('#scrim'),sheetOpen=false;
(function(){
  var w=$('#mobSearch');
  var inp=document.createElement('input');
  inp.id='mq';inp.type='search';inp.autocomplete='off';inp.placeholder='Search terms…';
  inp.setAttribute('aria-label','Search the codex');
  inp.style.cssText='width:100%;height:44px;padding:0 12px 0 30px;background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:3px;font-family:inherit;font-size:16px';
  w.appendChild(inp); inp.addEventListener('input',onType);
})();
function openSheet(){sheetOpen=true;sheet.dataset.on='1';scrim.dataset.on='1';}
function closeSheet(){sheetOpen=false;sheet.dataset.on='0';scrim.dataset.on='0';}
$('#mBooks').addEventListener('click',function(){sheetOpen?closeSheet():openSheet();});
$('#sheetClose').addEventListener('click',closeSheet);
scrim.addEventListener('click',closeSheet);

/* ---------- boot ---------- */
docEl.setAttribute('data-ck',ck);
$('#tab-ux').setAttribute('aria-selected',ck==='ux'?'true':'false');
$('#tab-ai').setAttribute('aria-selected',ck==='ai'?'true':'false');
paintMast();paintRail();buildStream();setActive(0);
(function(){
  var h=decodeURIComponent(location.hash.replace(/^#/,''));
  if(!h) return;
  if(SLUG[h]!==undefined){ jumpTo(SLUG[h]); return; }
  var m=h.match(/^(ux|ai)-book-?(\d+)$/);
  if(m){ if(m[1]!==ck) setCodex(m[1]); gotoBook(Math.max(0,Math.min(30,+m[2]-1))); }
})();
onScroll();
})();
</script>
</body>
