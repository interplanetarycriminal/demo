ceivable signal, added deliberately, that tells the user where an affordance exists, such as an underline, a cursor change or a drop shadow on a button.",0,[1508,230,518,248]],["Natural Mapping","Arrangement of controls so their spatial layout matches the effect they produce, such as volume sliders that rise as sound gets louder.",0,[11]],["Feedback","Information returned to the user about the result of an action, timely and specific enough to close the gulf of evaluation without demanding attention.",0,[229,1326,2182,2187]],["Feedforward","Information shown before an action is taken that previews its likely consequence, such as a hover preview of a drag-and-drop destination.",0,[275]],["Slip","An error where the user's intention was correct but execution failed, such as a mistyped click or a wrong key, distinct from a flawed goal."],["Mistake","An error where the user's underlying goal or plan was wrong from the start, so even flawless execution produces the wrong outcome.",0,[1326,2168,2410,595]],["Capture Error","A slip where a familiar, well-practised action sequence hijacks an intended but less habitual one, common when two flows share early steps.",0,[1781,1543]],["Satisficing","Decision strategy of accepting the first option that is good enough rather than searching for the optimal one, the dominant behaviour in real interface use.",0,[1216]],["Banner Blindness","Learned tendency to ignore regions of a page that resemble advertising in position or style, regardless of whether the content there is an ad.",0,[1173,197,198,390],"ux-change-blindness"],["Change Aversion","Resistance to a familiar interface being redesigned, even when the new version measurably improves usability, driven by the cost of relearning.",0,[1439,252,257,1624]],["Interaction Cost","The cumulative mental and physical effort a user spends to accomplish a goal, every click, wait and decision counted against the task's value.",0,[1466,0,1,5]],["Cognitive Friction","The resistance an interface presents to a user's thought process when its behaviour or terminology fails to match how the user is already reasoning.",0,[1340,715,260]],["Muscle Memory","Learned motor pattern that lets a user execute a familiar interaction, such as a keyboard shortcut or a swipe location, without conscious visual guidance.",0,[280,1095,1258,1886]],["Recognition over Recall","Design principle preferring visible options a user can identify over ones they must remember unaided, since recognition draws on a far larger, easier memory system.",0,[122,1877]],["Confirmation Bias in Use","Tendency for a user to notice and trust interface signals that match their existing expectation while overlooking ones that contradict it, distorting how errors are read.",0,[1508,380,609]],["Default Effect","Tendency for users to keep a pre-set option rather than actively choosing an alternative, making the default the most powerful lever in any settings screen.",0,[1072,1454,1956,1071]],["Status Visibility","The degree to which a system's current state is legible at a glance, the design property that keeps the gulf of evaluation narrow.",0,[229,773,889,1022]],["Norman Door","A door, or by extension any control, whose design signifiers contradict its actual operation, forcing the user to guess or fail; named for Don Norman's push/pull example.",0,[1184,231,1209,1313]],["Postcompletion Error","Omission of a final step after the main goal is achieved, such as leaving a card in a machine once cash is dispensed, a well-studied slip subtype.",0,[1543]],["Paradox of the Active User","Finding that users skip instructions and documentation to start acting immediately, so they learn just enough to get by and repeat the same errors indefinitely.",0,[2399,2091,2092,148]],["Automation Bias","Tendency to over-trust a system's automated suggestion and under-scrutinise it, even against contrary evidence a person would otherwise catch, acute in AI-assisted interfaces.",0,[1244,1082,1158]],["Algorithm Aversion","Tendency to lose trust in an algorithmic recommendation faster than in a human one after witnessing a single error, even when the algorithm remains more accurate overall.",0,[1966,240,257]],["Trust Calibration","The ongoing alignment of a user's confidence in a system to its actual reliability, neither over-trusting nor under-trusting, a central design goal for AI-driven features.",0,[1246,1432,397,27],0,1246],["Illusion of Control","A user's inflated belief that their own input influences an outcome it does not actually affect, exploited and studied through placebo buttons and progress rituals.",0,[564,1934,1935,1942]],["Anchoring Effect","Tendency for an initial number or option shown to a user to bias every subsequent judgement they make, even when that first value was arbitrary.",0,[838]],["Framing Effect","Tendency for identical information to produce different decisions depending on whether it is presented as a gain or a loss, shaping how options and copy are worded.",0,[1268]],["Loss Aversion","Tendency to weigh a potential loss roughly twice as heavily as an equivalent gain, why cancellation flows and streak features lean on what a user stands to lose.",0,[240,252]],["Choice Overload","Degraded decision quality and satisfaction once the number of options exceeds what a user can meaningfully compare, an argument for curated shortlists over exhaustive ones.",0,[1934,1148]],["Self-Efficacy","A user's belief in their own ability to successfully operate a system, built through early small wins and degraded by unexplained failure.",0,[1380,2132,2202]],["Cognitive Dissonance","Discomfort a user feels when their actions conflict with their stated preferences, often resolved by justifying a past choice rather than reversing it.",0,[1340,715,242]],["Perceived Affordance","What a user believes an element will do based on its appearance, which may or may not match the affordance actually implemented behind it.",0,[230,382,560,262]],["False Affordance","A design element that visually suggests an interaction it does not actually support, misleading users into attempting an action that fails or does nothing.",0,[382,230,261,263]],["Hidden Affordance","A real, working interaction that carries no visible signifier, discoverable only by accident, instruction or prior experience with a similar system.",0,[231,382,230,261]],["Sunk Cost Fallacy","Tendency to continue an interaction because of time or effort already invested rather than its remaining value, exploited by long forms and multi-step setup flows.",0,[2287],0,2287],["Analysis Paralysis","Decision-making freeze that sets in when a user faces too many comparable options or too much information to confidently choose between them.",0,[1555,1299,1460,2160],0,1299],["Learned Helplessness","A user's withdrawal from attempting a task after repeated failure to control its outcome, even once the underlying obstacle has been fixed.",0,[614]],["Uncanny Valley","The dip in comfort felt toward a nearly-but-not-quite human simulation, such as a voice or an avatar, first named by roboticist Masahiro Mori in 1970."],["Direct Manipulation","Interaction style in which users act on visible objects directly by dragging, resizing and dropping rather than issuing commands, coined by Ben Shneiderman in 1983.",0,[34,1186,2380,289]],["Pointer","The on-screen representation of a positional input device, whether mouse, trackpad or stylus, distinct from the touch point a finger leaves no visible cursor for.",0,[794,4,22,48]],["Cursor","The visible marker showing current pointer or input position on screen, its shape changing contextually to signal what action is available underneath it.",0,[1508,269,2420,984],"ux-presence",2420],["Insertion Point","The blinking marker indicating exactly where the next typed or pasted character will land within a body of editable text.",0,[2068,2192,394,427]],["Hover State","The visual state an element enters while the pointer rests over it without clicking, used to preview interactivity before commitment.",0,[303,269,534,618]],["Focus","The state marking which single element currently receives keyboard input, movable by pointer click or sequential keyboard navigation.",0,[1565,269]],["Selection","The marked subset of content or objects a user has designated as the target of a subsequent action, shown by highlight or handles.",0,[288,294,295,89]],["Drag and Drop","Interaction pattern for moving or linking an object by pressing on it, dragging it across the screen, and releasing it over a target.",0,[234,518]],["Scrolling","Movement of content past a fixed viewport in response to input, the primary way interfaces exceed the visible bounds of the screen.",0,[104,152,187,558]],["Scrollbar","A visual control indicating scroll position and total content length, draggable to jump directly to a point rather than scrolling incrementally.",0,[276]],["Undo","A command reversing the most recent action, the safety net that lets a user act experimentally rather than cautiously in every interface."],["Redo","A command reapplying an action just undone, restoring the paired history stack that makes undo something a user can navigate freely rather than fear."],["Keyboard Shortcut","A key combination that triggers a command directly, bypassing menu navigation for actions a user performs often enough to memorise.",0,[133,243,796,898]],["Modifier Key","A key such as Shift, Control or Option that changes the meaning of another input when held simultaneously, rather than producing output on its own.",0,[292,796,1558]],["Context Menu","A menu of actions relevant to a specific object, opened by right-click or long-press at the object's location rather than from a fixed menu bar.",0,[283,79,869,1231]],["Right-Click","The secondary mouse button click, conventionally bound to opening a context menu rather than triggering an object's primary action.",0,[282,869,1572,2372]],["Mode","A state in which the same input produces a different effect than it would in another state, powerful but a known source of user error when unsignalled."],["Quasimode","A temporary mode active only while a key or button is physically held, such as Shift for capitals, avoiding the error risk of a mode left silently on.",0,[1109,1187,1214]],["Modeless Interaction","Design approach in which every input always produces the same result regardless of prior state, eliminating an entire class of mode-confusion errors.",0,[84,1466,0,1]],["Gesture","A recognised movement pattern of a pointer, finger or stylus, mapped to a command rather than a discrete click.",0,[160,899,269,11]],["Marquee Selection","A rectangular selection made by dragging the pointer across a region, capturing every object whose bounds it overlaps or encloses.",0,[274,269,99,107]],["Handle","A small, grabbable control point attached to a selected object, used to resize, rotate or reposition it by direct manipulation.",0,[268]],["Snapping","Automatic alignment of a dragged object to a grid line, guide or edge once it comes within a threshold distance, easing precise placement.",0,[397],"ux-gestalt"],["Clipboard History","A retained log of recent copy operations a user can browse and paste from, beyond the single most recent item a basic clipboard holds.",0,[19,997,1041]],["Multiple Selection","The ability to designate more than one object as a target simultaneously, typically via a modifier key held during additional clicks.",0,[281,435,107,274]],["Sticky Drag","A drag interaction that continues after the pointer button is released, requiring a second click to complete the placement, easing sustained physical effort.",0,[269,1999,416,796]],["Text Selection Granularity","The unit a selection expands by as a drag continues, character then word then line, set by click count and drag distance.",0,[274,107,288,292]],["Lasso Selection","A freeform selection made by dragging an irregular path around objects, capturing everything the closed path encloses rather than a fixed rectangle.",0,[274,107,288,292]],["Hit Area","The actual clickable or tappable region behind an element, which may extend beyond its visible boundary to ease precise targeting.",0,[1321,901]],["Drag Threshold","The minimum pointer movement required before a press-and-move is interpreted as a drag rather than a click, preventing accidental drags from a shaky hand.",0,[269,204,220]],["Scroll Snap","Behaviour that halts scrolling at defined alignment points rather than an arbitrary position, keeping panels, slides or cards fully in view after release.",0,[276,397,104,152]],["Momentum Scrolling","Continued scrolling after input ends, decelerating as if under friction, matching the physical expectation set by flicking a real surface.",0,[276,104,152,187]],["Rubber-Band Scrolling","Overscroll behaviour that lets content be dragged briefly past its boundary before springing back, signalling the end of scrollable content; popularised by iOS in 2007.",0,[107,153,937,2168]],["Keyboard Nudging","Fine repositioning of a selected object by single arrow-key presses, moving it by one pixel or grid unit per press for precision beyond the pointer.",0,[269,1565,178,280]],["Pressure Sensitivity","Input that varies its effect by how hard a stylus or touch surface is pressed, used in drawing tools to vary stroke weight in real time.",0,[2210]],["Hover Intent","A brief delay before a hover state fires, filtering out the pointer merely passing over an element from a user deliberately resting on it.",0,[272,269,1699,1084]],["Focus Ring","The visible outline drawn around the currently focused element, the primary signifier that tells a keyboard user where their input will land.",0,[231]],["Drag Ghost","A semi-transparent copy of the dragged object that follows the pointer during a drag operation, standing in for the original while it stays in place.",0,[269,1028]],["Drop Zone","The region of an interface configured to accept a dragged object, typically highlighted the moment a compatible drag enters its bounds.",0,[518,2017,2093]],["Information Architecture","The structural organisation and labelling of content so people can find and understand it, the blueprint layer beneath navigation, search and page hierarchy.","IA",[676,1311,332,1327]],["Wayfinding","The cognitive and design work of helping a person determine their current location, their destination and the route between them within a structure.",0,[1555]],["Navigation Model","The overall scheme by which a product's sections relate and connect, hierarchical, flat or hub-and-spoke, chosen before individual navigation components are designed.",0,[318,319,1565,160]],["Global Navigation","The persistent set of top-level links present across an entire product, giving access to its main sections from any screen.",0,[1565,343,160,872]],["Local Navigation","Navigation scoped to a single section, showing only the pages and sub-pages relevant to where a user currently is.",0,[1565,160,872,1151]],["Breadcrumb","A horizontal trail of links showing the path from a site's home to the current page, letting a user step back up the hierarchy in one move.",0,[339]],["Tab Navigation","A row of mutually exclusive labelled controls switching between sibling views within the same context, only one active at a time.",0,[1565,160,872,1151]],["Hamburger Menu","A three-line icon that reveals a hidden navigation panel when tapped, introduced by Norm Cox for the Xerox Star in 1981 and popularised by mobile web design decades later.",0,[75,1202]],["Mega Menu","A large panel of navigation links, often organised into columns and categories, that opens from a top-level item to expose an entire section at once."],["Command Palette","A searchable, keyboard-invoked overlay listing every command or destination in an application, letting a user reach any function by typing rather than navigating menus.",0,[1118,507,522,540]],["Sitemap","A structural diagram or page listing every screen or content page in a product and how they relate, used for planning and for site-wide navigation.",0,[333]],["Hub and Spoke","A navigation model in which every path returns to a central hub between visits to peripheral sections, common in task-based apps with distinct modes.",0,[309]],["Sequential Navigation","A navigation model that moves a user through a fixed, ordered series of steps, forward and back only, appropriate when order matters more than freedom to jump.",0,[309,829,1565,160]],["Faceted Navigation","Search interface letting a user narrow results by combining independent attribute filters simultaneously, each facet updating to show only still-available options.",0,[1832,1565,160,872]],["Filter","A control that narrows a visible set of results or items to those matching a chosen criterion, without changing the underlying data set.",0,[1873,434,1162]],["Sort Control","A control letting a user reorder a set of results by a chosen attribute such as relevance, price or date, rather than narrowing which items appear.",0,[1934,1935,1942,2023]],["Autocomplete","Interface behaviour that predicts and offers to complete a user's input as they type, reducing keystrokes for previously seen or likely values.",0,[2421]],["Typeahead Search","Search behaviour that surfaces matching suggestions in a dropdown as a query is typed, letting a user select before finishing or submitting it.",0,[354]],["Search Suggestion","A pre-populated query candidate shown before or during typing, drawn from popular, personalised or trending queries rather than exact text matching alone.",0,[995,1029,1045]],["Zero-Results State","The screen shown when a search or filter combination returns nothing, designed to explain why and offer a recovery path rather than leave a blank page.",0,[1741]],["Scoped Search","Search restricted to a specific section, category or content type rather than an entire product, set explicitly by the user or the search's context.",0,[343]],["Recent Searches","A list of a user's own previous queries offered as quick-access shortcuts before or during a new search.",0,[1095,346]],["Federated Search","A single search interface that queries multiple separate data sources or systems at once and merges the results into one combined list.",0,[2375,753]],["Findability","The overall quality of how easily content can be located within a system, through navigation, search or browsing, and the outcome all of IA is judged against.",0,[2]],["Berrypicking","Model of search as an evolving series of small queries, each shaped by what the last one turned up, rather than one perfect query issued once; Marcia Bates, 1989."],["Information Scent","The perceived likelihood that a link or label leads toward a user's goal, judged from its wording and position before it is ever clicked.",0,[479,1311,307],"ux-info-scent"],["Footer Navigation","A secondary link set placed at the bottom of a page, typically holding low-frequency destinations like legal pages, sitemaps and company information.",0,[317,1565,160,872]],["Utility Navigation","A small link set for account, settings, help or language, kept separate from primary navigation because it supports the product rather than its content.",0,[1557,1565,160,872]],["Contextual Navigation","Links generated dynamically from the content of the current page, such as related articles or next steps, rather than fixed structural links.",0,[607,670,1090,1565]],["Navigation Rail","A narrow, icon-led vertical navigation bar fixed to a screen edge, dense enough to stay visible at all times without collapsing into a menu.",0,[1565,160,872,1151]],["Navigation Drawer","A panel of navigation links that slides in from a screen edge and overlays or pushes content, typically triggered by a hamburger icon.",0,[891,1565,160,872]],["Flyout Menu","A secondary menu that appears beside or below a parent item on hover or focus, revealing its children without navigating away from the current view."],["You-Are-Here Indicator","A visual marker, such as a highlighted tab or bolded breadcrumb segment, showing which item in a navigation structure corresponds to the current page.",0,[312,808,897,930]],["Instant Search","Search behaviour that updates the full results set live as a query is typed, without a separate submit step, distinct from typeahead's suggestion list."],["Advanced Search","A dedicated search interface exposing explicit fields, operators and filters for constructing a precise query, offered alongside a simpler default search box.",0,[1072]],["Search Operators","Reserved symbols or keywords, such as quotes, minus signs or AND/OR, typed into a search box to constrain matching beyond plain keyword entry."],["Global Search","Search that queries a product's entire content and feature set at once, the counterpart to scoped search's deliberately narrowed reach.",0,[327,310]],["Did You Mean","A search prompt offering a corrected spelling of a query that likely returned poor results, letting a user accept the fix in one action.",0,[1452,1453]],["Fuzzy Search","Search matching that tolerates typos, misspellings and near-matches rather than requiring an exact string, ranking results by closeness rather than identity.",0,[1837]],["Saved Search","A stored query a user can name and re-run later, distinct from recent searches in being deliberately kept rather than automatically logged.",0,[328]],["Taxonomy","A formal hierarchical classification scheme used to categorise content consistently, the controlled structure that navigation labels and facets are typically drawn from."],["Controlled Vocabulary","A fixed, pre-approved set of terms used consistently across a system's labels and metadata, preventing the same concept being named differently in different places.",0,[1150,1537]],["Button","A discrete, clickable control that triggers a single immediate action, styled by hierarchy such as primary, secondary or tertiary to signal its relative importance on screen.",0,[1508,110,828,858]],["Checkbox","A control representing an independent binary or tri-state choice, allowing zero, one or many to be selected within the same group."],["Radio Button","A control representing one choice from a mutually exclusive set, where selecting one option automatically deselects any other in the same group.",0,[372,110,828,858]],["Toggle Switch","A binary control styled as a physical switch, taking effect immediately on interaction rather than waiting for a separate confirm or submit action.",0,[1952,2128,2200,141]],["Slider","A control letting a user select a value by dragging a handle along a track, suited to continuous ranges where exact number matters less than relative position.",0,[480,1048,386]],["Dropdown","A control that collapses a list of options behind a single closed field, expanding into a list only when opened, saving space over an always-visible list.",0,[324,355,378]],["Combo Box","A control combining a text field with a dropdown list, letting a user either type a value freely or pick one from filtered suggestions.",0,[354,385,935]],["Date Picker","A control for selecting a calendar date, typically a text field paired with a popover calendar grid to avoid free-text date-format errors.",0,[361,385,450,1034]],["Modal Dialog","An overlay that blocks interaction with the rest of the interface until it is explicitly dismissed, used for decisions that must interrupt the current task.",0,[1895,92,616,1014]],["Non-Modal Panel","A secondary surface that stays open alongside the main interface without blocking interaction with it, letting a user reference or edit both at once.",0,[1895,744,357,379]],["Toast","A brief, self-dismissing message that appears temporarily to confirm an action, disappearing automatically without requiring the user to acknowledge it."],["Tooltip","A small label revealed on hover or focus that identifies or explains an element without a persistent visible label taking up permanent space.",0,[618,361,453]],["Popover","A transient panel anchored to a triggering element, showing richer content than a tooltip and remaining open until dismissed or clicked away from.",0,[360,356]],["Accordion","A vertically stacked set of collapsible sections, each expanding to reveal its content while keeping others compressed, trading full visibility for reduced page length."],["Carousel","A component that cycles through a set of items one or few at a time within a fixed space, advanced manually or on an automatic timer.",0,[144]],["Data Table","A structured grid of rows and columns for displaying and comparing multiple records at once, typically supporting sorting, filtering and selection per row.",0,[274,1754,1953]],["Stepper","A visual indicator of a user's position within a fixed multi-step sequence, showing completed, current and remaining steps at a glance.",0,[387]],["Wizard","A multi-screen flow that breaks a complex task into a fixed, guided sequence of simpler steps, each with its own validation before advancing.",0,[655,651]],["Progress Bar","A determinate control showing what proportion of a known-length task has completed, filling from empty to full as the operation advances.",0,[210,564,368]],["Indeterminate Progress","A progress indicator used when completion percentage cannot be calculated, animating continuously to signal activity without claiming a specific proportion done.",0,[1508,564,367]],["Spinner","A small looping animation signalling that a system is processing, used for short waits where no meaningful progress value exists to show.",0,[1493],"ux-streaming-tokens"],["Inline Validation","Feedback on a form field's validity shown immediately beside it as the user types or leaves the field, rather than held back until submission.",0,[233,1652,1029,1050]],["Input Mask","A formatting constraint applied to a text field that automatically inserts literal characters and blocks invalid ones as a user types, such as a phone number's brackets and dashes.",0,[385,1947,1895,13]],["Segmented Control","A horizontal group of mutually exclusive buttons acting as a single control, functionally similar to radio buttons but styled as one connected bar.",0,[351,1934,1935,1942]],["Chip","A small, compact element representing a discrete piece of input, filter or attribute, often removable and typically arranged in a wrapping row.",0,[1036]],["Tag Input","A text field that converts each typed entry into a discrete removable chip on submission, used for adding multiple keywords or labels in sequence.",0,[385,1895,13,793]],["Badge","A small marker, usually a number or dot, overlaid on an icon or element to indicate count, status or unread activity without altering layout.",0,[1615,862]],["Avatar","A small image, initials or icon representing a specific person or account, used consistently across a product to identify ownership or authorship at a glance.",0,[987]],["Disclosure Triangle","A small directional arrow control that expands or collapses an adjacent section of content, rotating to indicate the section's current open or closed state.",0,[1450,212,1035,1044]],["Split Button","A button combining a primary action with an attached small arrow that opens a dropdown of related secondary actions, sharing one visual footprint.",0,[354,1731,1995,2185]],["Floating Panel","A surface positioned above the base layout rather than in its normal flow, typically draggable or repositionable independent of the underlying page's scroll.",0,[276,419,874,744]],["Confirmation Dialog","A modal requiring explicit acknowledgement before a significant or hard-to-reverse action proceeds, interrupting the flow deliberately to prevent an unintended commit.",0,[245,609,92,616]],["Destructive Action Pattern","The set of conventions such as red colour, a confirmation step, explicit wording and an undo window, used around actions that delete or irreversibly change data.",0,[1530,2101,29,585]],["Empty Field Affordances","Visual cues within an unfilled input, such as placeholder text, a faint icon or a dashed border, signalling what kind of value belongs there.",0,[593,230,261,262]],["Fieldset","A semantic grouping of related form controls under one shared label, used to visually and structurally cluster fields that belong to the same sub-question."],["Required-Field Marker","A visible symbol, typically an asterisk, marking which fields in a form must be completed before submission is accepted.",0,[1657,672,1203]],["Text Field","A single-line control for entering free-form text, the most basic and heavily used input in any form, distinguished from a textarea by not wrapping to multiple lines.",0,[355,356,371,374]],["Range Slider","A slider variant with two handles that together define a minimum and maximum value, used to select a span rather than a single point.",0,[1048,353]],["Numeric Stepper","A compact control pairing a number field with increment and decrement buttons, letting a user nudge a value by a fixed step without typing.",0,[365]],["Color Picker","A control for selecting a colour value, typically combining a visual swatch grid or spectrum with numeric hex, RGB or HSL entry fields.",0,[450,1034,356,389]],["Time Picker","A control for selecting a specific time of day, typically presenting scrollable hour and minute wheels or a structured text field with format guards.",0,[385,450,1034,356]],["Alert Banner","A persistent, page-level message communicating a system-wide condition, remaining visible until its underlying issue is resolved or dismissed, unlike a self-clearing toast.",0,[2220,239,843,1173]],["Grid System","A structural framework of columns, rows and consistent spacing used to place and align elements across a layout, the scaffolding beneath most screen composition.",0,[392]],["Column Grid","A grid system defined by a fixed number of vertical columns and gutters, the most common way web and app layouts divide horizontal space.",0,[391,118]],["Baseline Grid","A grid of consistently spaced horizontal lines that all text and elements align to, keeping vertical rhythm consistent across a page regardless of font size.",0,[426]],["8-Point Grid","A spacing and sizing convention where every measurement is a multiple of eight pixels, chosen because it divides cleanly across common screen densities.",0,[412,2068,2192,271]],["White Space","Unfilled space between and around elements, used deliberately to group related content, separate unrelated content, and let the eye rest between areas of density.",0,[412,506,516,1736]],["Visual Hierarchy","The deliberate ordering of a screen's elements by size, weight, colour and position so the eye scans them in the intended order of importance.",0,[1555,530,2318,196]],["Alignment","The positioning of elements along a shared edge or axis, the single strongest cue that a layout is intentional rather than arbitrary.",0,[194,253,290,298]],["Proximity Grouping","The layout application of Gestalt proximity, placing related controls or content closer together than unrelated ones so the grouping reads without a border or label.",0,[189,1788,879,1209],"ux-gestalt"],["Card Layout","A container pattern that bundles a self-contained unit of content, such as an image, title, metadata and action, into one bordered or shadowed block, repeatable in a grid.",0,[1471,1484,1572,468]],["Above the Fold","Content visible without scrolling on first load, a term inherited from folded newspapers and still used despite the vanishing of any fixed screen boundary.",0,[276]],["F-Pattern","An eye-tracking-derived scanning pattern for text-heavy pages, in which users read across the top, then partway across a lower line, then scan down the left edge.",0,[480,725]],["Z-Pattern","An eye-tracking-derived scanning pattern for sparser layouts, moving from top-left to top-right, diagonally down to bottom-left, then across to bottom-right.",0,[480,725]],["Gutter","The fixed space between adjacent columns in a grid, keeping content in neighbouring columns visually separate without a drawn divider."],["Margin","The space between a layout's content and the outer edge of its container or viewport, framing the composition and preventing content from touching the boundary."],["Content Width","The maximum width a block of content is allowed to grow to, constrained even on wide screens to keep line length and layout legible.",0,[425,2003,2025,588]],["Line of Sight","The path a layout implies the eye should travel, engineered through alignment, imagery and hierarchy to lead attention toward a primary action or message.",0,[397,479,1943]],["Split View","A layout dividing the screen into two independently scrollable panes shown side by side, letting a user reference one while working in the other.",0,[1731,1995,2185,62]],["Master-Detail","A layout pattern pairing a list of items with a detail pane that updates to show the currently selected item, common in email and settings interfaces.",0,[1644,443]],["Responsive Web Design","A layout approach using fluid grids, flexible images and breakpoints so one codebase adapts its arrangement to the viewport it renders in; coined by Ethan Marcotte in 2010.",0,[1198,411,1224,1574]],["Adaptive Layout","A layout approach serving a small number of distinct fixed arrangements chosen by device or viewport size, rather than continuously reflowing between them.",0,[1555,2050,884,1066]],["Fluid Grid","A grid whose columns are sized in proportional units rather than fixed pixels, so the whole layout scales smoothly across viewport widths.",0,[409,1198,1575]],["Density","A layout setting controlling how tightly spaced rows and elements are, compact for scanning many items or comfortable for reduced visual load, often user-selectable in data-heavy tools.",0,[168,223,224,394]],["Modular Layout","A layout built from a fixed set of reusable content blocks that can be rearranged or recombined, rather than a single bespoke arrangement per page.",0,[1346,477,1471,1484]],["Full-Bleed","An image or block of content that extends to the very edge of its container with no margin, breaking out of the surrounding grid for emphasis.",0,[1772]],["Hero Section","A large, prominent block at the top of a page, typically combining a headline, image and primary call to action, that a visitor sees first.",0,[596,811]],["Sticky Element","An element that remains fixed in the viewport during scroll once it reaches a defined position, keeping navigation or key controls persistently reachable.",0,[276,1502,1558,1999]],["Sidebar","A vertical panel fixed to one edge of a layout, holding navigation, filters or supplementary content alongside a main content area.",0,[423]],["Canvas","An open, unstructured workspace within an interface, free of a fixed grid, on which a user places or arranges content directly rather than filling predefined fields.",0,[1053]],["Layered Interface","A composition organised along a z-axis of stacked surfaces, base content, floating panels and overlays, each with its own elevation relative to the others.",0,[379]],["Aspect-Ratio Box","A container that maintains a fixed width-to-height proportion as it resizes, preventing images or embedded media from distorting or causing layout shift while loading.",0,[1566,2138,428]],["Bento Grid","A layout of irregularly sized rectangular cells packed together like a compartmented lunch box, popularised in marketing pages for presenting varied content at a glance."],["Masonry Layout","A grid that packs items of varying heights into columns with minimal gaps, each item placed in whichever column currently has the least content, rather than aligning to fixed rows.",0,[1471,1484,1572,468]],["Holy Grail Layout","A classic three-column page structure of header, footer and a centre column flanked by two sidebars, long used as the canonical test case for CSS layout techniques.",0,[417,45,1471,1484]],["Visual Balance","The even distribution of visual weight across a layout, achieved symmetrically or asymmetrically, so no single region feels heavier or emptier than the composition intends.",0,[520,2318,196,221]],["Breakout Element","Content, typically an image or quote, that deliberately extends beyond the constrained content width of the surrounding text column for visual emphasis.",0,[405,1502,1558,553]],["Vertical Rhythm","Consistent, predictable spacing cadence down a page, built from a shared unit so headings, paragraphs and components all fall into a coherent vertical cadence.",0,[393,1273,2081,186]],["Focal Point","The single element in a composition designed to draw the eye first, established through size, contrast, isolation or position relative to everything around it.",0,[2068,2192,271,928]],["Golden Ratio","A proportion of roughly 1:1.618 applied to layout dimensions on the claim that it produces inherently pleasing composition, an inheritance from classical art and architecture.",0,[1304,2230,714,1566]],["Visual Rhythm","A repeating pattern of spacing, sizing or alignment across a layout that creates a sense of consistent tempo as the eye moves through it.",0,[397,426,2318,196]],["Negative Space","The shape formed by the empty area around and between elements, used deliberately as a compositional element rather than simply as leftover margin.",0,[1807,1357,2349,395]],["Shneiderman's Mantra","Overview first, zoom and filter, then details on demand: Ben Shneiderman's 1996 seven-task framework for designing information-visualisation interaction.",0,[1186,443]],["Dynamic Queries","Continuous filter controls, such as sliders, that redraw a visualisation in real time as the user drags them, pioneered at the University of Maryland in the late 1980s.",0,[1555,1897,888,922]],["Brushing and Linking","Selecting a region in one chart that simultaneously highlights the same data points across every other linked chart on screen.",0,[140]],["Cross-Filtering","Clicking a value in one visualisation to filter every other chart in a linked view down to that value automatically.",0,[1873,321,1162,1606]],["Small Multiples","A grid of identical small charts, each showing one slice of a dataset, so the eye compares pattern and trend across panels at a glance.",0,[292]],["Sparkline","A tiny, axis-free line chart sized to sit inline with text, a term and form Edward Tufte introduced in 2006 to show trend without ceremony.",0,[446]],["Focus+Context","An interaction technique that keeps a detailed focal region legible while compressing surrounding context into the same view, rather than replacing it.",0,[438,1231,1247,1259]],["Fisheye View","A focus+context technique that magnifies the item under the pointer while shrinking neighbours, modelled on a fisheye lens and formalised by George Furnas in 1986.",0,[269,437]],["Treemap","A space-filling visualisation that nests rectangles by hierarchy and sizes them by value, invented by Ben Shneiderman in 1991 to chart a full disk in one view.",0,[1555,1186,464]],["Drill-Down","Clicking an aggregate data point to reveal the finer-grained records or sub-categories that compose it, descending one hierarchy level at a time.",0,[1396,441,1511,78]],["Roll-Up","Collapsing detailed records back into their parent aggregate, the inverse of drill-down, used to return a chart to its summary state.",0,[1396,440]],["Scrubbing","Dragging a playhead or slider across a chart's time axis to replay how the data changed, borrowed from video editing's transport control.",0,[581]],["Details on Demand","Revealing a data point's full values only on hover, click or tap, keeping the base chart uncluttered until the user asks for specifics.",0,[431,453,1096,1644]],["Annotation Layer","A separate editable layer of callouts, arrows and notes overlaid on a chart to flag events or explain an anomaly without altering the underlying data.",0,[992]],["Direct Labelling","Placing a series' name beside its own line or slice instead of in a separate legend, cutting the eye movement needed to decode a chart.",0,[1736,2041,56,268]],["KPI Tile","A single-number summary card, pairing a metric with a trend arrow or sparkline, that surfaces one key indicator without requiring a full chart to be opened.",0,[436,638]],["Exploratory Visualisation","A chart built for the analyst's own discovery process, prioritising fast pivoting and filtering over polish, since no outside audience will see it.",0,[448,457]],["Explanatory Visualisation","A chart built to carry one argument to an audience, stripped of extraneous encodings and annotated to make the intended reading unmissable.",0,[447,457]],["Scrollytelling","A long-form web layout that changes or reveals chart states as the reader scrolls, pairing narrative text with step-triggered visualisation, popularised by newsroom graphics desks in the 2010s.",0,[276]],["Chart Picker","A menu of chart-type thumbnails that lets a user swap a dataset's visual encoding, bar to line to scatter, without rebuilding the underlying query.",0,[356,388,389,1034]],["Zoomable Timeline","A horizontal time axis that supports continuous zoom and pan, letting a viewer move fluidly between decade-level and hour-level granularity in one control."],["Linked Highlighting","Hovering one element in a visualisation to highlight its corresponding element elsewhere, such as a table row or a map region, without filtering anything out."],["Data Tooltip","A small popup that surfaces exact values, labels and context for the mark under the pointer, the primary details-on-demand mechanism in most charting libraries.",0,[269,443,360,618]],["Legend Interaction","A chart legend that acts as a control, where clicking a series name toggles its visibility or isolates it, rather than sitting as static key text.",0,[1466,0,1,5]],["Empty-Data State","The screen a chart shows when its query returns nothing, designed to explain why rather than render blank axes over an unexplained void.",0,[592,382]],["Colour Encoding","Mapping a data dimension, such as category, magnitude or sign, onto hue, saturation or lightness, chosen for perceptual accuracy rather than decoration.",0,[2008,1566,507,508]],["Uncertainty Visualisation","Rendering a value's confidence interval or margin of error alongside the estimate itself, through error bars or gradient bands, so precision is never implied where none exists.",0,[517,1051,447,448]],["Real-Time Chart","A visualisation that redraws continuously as new data arrives over a live connection, trading historical context for currency.",0,[60,982,2144,450]],["Progressive Data Loading","Rendering a chart's rough shape immediately from a data sample, then refining it as the full query resolves, rather than blocking on the complete result.",0,[1474,1494,212,603]],["Heatmap","A grid or map coloured by intensity value, letting density or magnitude across two dimensions register as a colour gradient rather than as numbers.",0,[412,517]],["Choropleth Map","A map whose regions are shaded by a data value, such as population or rate, so geographic pattern reads directly off the fill colour."],["Sankey Diagram","A flow diagram whose link widths are proportional to quantity, tracing how a total splits and recombines across stages, named for Matthew Sankey's 1898 steam-engine chart.",0,[690,465]],["Parallel Coordinates Plot","A multivariate chart with one parallel vertical axis per dimension, where each record draws a connecting line across all of them, devised by Alfred Inselberg in 1985.",0,[1555,2263]],["Sunburst Chart","A radial treemap that represents hierarchy as concentric rings, with each ring's arc length proportional to its share of the parent segment.",0,[439,450,458,467]],["Chord Diagram","A circular layout that draws arcs between nodes on its rim to show the volume of relationship or flow between every pair.",0,[690,462,49]],["Stream Graph","A stacked area chart with layers flowing around a central baseline instead of a fixed zero line, used to show how composition changes over time.",0,[2145,1336,1476,1695]],["Bullet Chart","A compact bar gauge that packs a measure, a target marker and qualitative range bands into one thin strip, designed by Stephen Few to replace speedometer-style dials.",0,[478,1291,2384,450]],["Network Graph Layout","A node-and-edge diagram whose positions are computed by a force-directed or hierarchical algorithm to make cluster and connection structure legible without manual placement.",0,[1940,662,2145,857]],["Anti-Aliasing","Smoothing of a character's or shape's jagged pixel edges by blending intermediate colour values, making curved and diagonal strokes read cleanly at screen resolutions."],["Subpixel Rendering","Type rendering technique that manipulates a screen's individual red, green and blue subpixels rather than whole pixels, sharpening small text on LCD displays.",0,[1467,1476,1478,1529]],["ClearType","Microsoft's subpixel font-smoothing technology, shipped from Windows XP in 2001, tuned specifically for the fixed subpixel layout of LCD panels."],["Font Hinting","Instructions embedded in a font file that adjust its outlines to align with the pixel grid at small sizes, preventing blurred or uneven strokes.",0,[1915]],["System Font Stack","A CSS font-family list that specifies each operating system's native default typeface, letting an interface use the fastest-loading, most familiar font per platform.",0,[1072,500,2155,987]],["Web Font","A typeface file delivered over the network and loaded into a page rather than relying on fonts already installed on the user's device.",0,[504]],["Variable Font","A single font file containing a continuous range of weight, width or slant, letting an interface interpolate between styles instead of loading separate files for each."],["Type Scale","The defined set of font sizes used consistently across an interface, keeping headings, body text and captions in a limited, predictable hierarchy.",0,[477,1579,717,965]],["Modular Scale","A type scale generated by multiplying a base size by a fixed ratio repeatedly, producing sizes that feel proportionally related rather than arbitrarily chosen.",0,[476,1346,413,1579]],["Measure","The length of a line of text, conventionally kept to 45-75 characters, since lines much longer or shorter than that measurably hurt reading speed.",0,[1289,1306,1312,1452]],["Leading","The vertical space between baselines of successive lines of text, called line-height in CSS, set slightly looser than the type size for comfortable reading.",0,[2220,2450,332,406]],["Tracking","Uniform adjustment of letter-spacing across a run of text, tightened for large display type and loosened for small caps or all-uppercase labels.",0,[1254,1365,1508,1532]],["x-Height","The height of a typeface's lowercase letters excluding ascenders and descenders, a major driver of how large or legible a font appears at a given point size."],["Legibility","How easily individual letterforms can be distinguished from one another, a property of the typeface and rendering itself rather than the text's overall composition.",0,[29],"ux-contrast"],["Readability","How easily a whole passage of text can be read and comprehended, shaped by measure, leading, contrast and hierarchy rather than the letterforms alone.",0,[478,479,2000]],["Font Pairing","The deliberate combination of two or more typefaces, typically a display face for headings and a workhorse face for body text, chosen for contrast without clashing."],["Optical Size","A font design axis that alters letterform proportions for different sizes, thickening and opening up small-size cuts so they remain legible where a simply scaled large cut would not.",0,[491,693,809]],["Tabular Figures","Numerals designed to occupy identical fixed widths, keeping columns of numbers aligned vertically in tables and financial displays.",0,[192]],["Truncation","Cutting off text that exceeds its available space, typically marked with an ellipsis, used when a fixed layout cannot accommodate variable-length content.",0,[611]],["Pictogram","A simplified pictorial symbol standing in for an object, action or concept without relying on text, the basic unit of any icon set.",0,[495,497,498]],["App Icon","The single graphic representing an application on a home screen or dock, designed to stay recognisable at very small sizes and across varied backgrounds.",0,[876,884,165,166]],["Favicon","The small icon representing a website in a browser tab, bookmark list or history entry, typically a simplified version of the site's logo.",0,[862,827,830]],["Icon Grid","A fixed underlying grid, typically with defined keylines and padding, that every icon in a set is drawn against to keep optical size and weight consistent.",0,[485,221]],["Ligature","A single glyph combining two or more letters that would otherwise collide or look awkward set side by side, such as fi or fl."],["Screen Typography","The practice of setting type specifically for illuminated, pixel-based displays rather than print, governed by rendering, resolution and viewing-distance constraints print never faced.",0,[1575,821,1493,1561]],["Line Clamping","CSS technique that restricts a text block to a fixed number of visible lines, truncating and marking the overflow rather than letting it grow the container.",0,[1943]],["Icon Font","A typeface in which each character maps to a pictogram rather than a letter, letting icons be styled, coloured and sized with ordinary text CSS.",0,[488,497]],["Outlined vs Filled Icons","The stylistic choice between stroke-based and solid-fill icon rendering, commonly used as a state pair to distinguish inactive from selected or active."],["Dingbat","A decorative or symbolic printer's character, such as a star or pointing hand, the print-era ancestor of the modern digital pictogram and icon font glyph.",0,[488,495]],["Symbol Font","A large, centrally maintained library of consistent pictogram glyphs supplied at the platform level, such as Apple's SF Symbols, for use across an operating system's apps.",0,[488]],["Kerning","Adjustment of the space between two specific adjacent letters to correct for their particular shapes, distinct from tracking's uniform adjustment across an entire run."],["Font Fallback Stack","The ordered list of alternative typefaces a browser or app tries in sequence when the preferred font fails to load or lacks a required character.",0,[1874,2214,473,2155]],["Orphans and Widows","A single line of a paragraph left stranded alone at the top or bottom of a text block, a typographic flaw that layout and hyphenation rules try to prevent.",0,[506]],["Balanced Text Wrap","A rendering technique that distributes words evenly across the lines of a heading or short paragraph, avoiding a lone short word stranded on the final line.",0,[1984,2004]],["Glyph","The specific visual rendering of a single character within a typeface, distinct from the abstract character itself, which a font may represent with multiple alternate glyphs."],["Font Loading Strategy","The technique controlling how text renders while a web font is still downloading, choosing between an invisible flash, a swapped fallback flash, or a blocked wait.",0,[474]],["Monospace Font","A typeface in which every character occupies exactly the same horizontal width, used for code, tabular data and anywhere columns must align by character position."],["Hyphenation","Automatic or manual breaking of a word across a line boundary with a hyphen, used to tighten justified or narrow-column text without leaving excessive white space.",0,[395,501]],["Colour Palette","The defined set of colours an interface draws from consistently, typically organised into primary, secondary, neutral and semantic groups rather than used freely.",0,[810,316,522,540]],["Semantic Colour","A colour assigned to a specific meaning, such as red for error or green for success, applied consistently regardless of which component displays it.",0,[1275,1560,1632,1831]],["Accent Colour","A single colour reserved for drawing attention to key interactive elements, kept distinct from the neutral palette so it doesn't compete with itself.",0,[522,1566,456,810]],["60-30-10 Rule","A colour-proportion guideline allocating roughly sixty percent of a composition to a dominant colour, thirty percent to a secondary, and ten percent to an accent."],["Dark Mode","A colour scheme using light text on dark surfaces, reducing screen brightness in low light and lowering power draw on OLED displays.",0,[1555,2129,2398]],["Light Mode","A colour scheme using dark text on light surfaces, the historical default and still the higher-contrast, more legible choice in bright ambient conditions.",0,[1072,43,53]],["Neumorphism","A visual style rendering elements as extrusions from a single-colour background using soft dual shadows, popularised briefly online around 2019-2020 before usability critiques of its low contrast.",0,[1439,2378]],["Glassmorphism","A visual style simulating frosted, translucent glass panels through background blur and light borders, popularised across platform design languages from the early 2020s.",0,[769]],["Brutalist Web Design","A visual style embracing raw, unstyled or deliberately unpolished HTML defaults as an aesthetic statement against slick, homogenised commercial web design.",0,[1072]],["Minimalism","A visual style stripping an interface to its essential elements, relying on generous white space and restraint over decoration to reduce visual noise.",0,[395,525]],["Gradient","A smooth transition between two or more colours across a surface, used to add depth, direction or brand character beyond a flat single hue.",0,[538,552,457,460]],["Drop Shadow","A soft, offset shadow cast behind an element to suggest it sits above the surface beneath it, the primary tool for implying elevation.",0,[231,1500,1894,2086]],["Depth Cue","Any visual signal, such as shadow, overlap, blur or scale, that communicates which of several stacked elements sits nearer to or farther from the viewer.",0,[1508]],["Visual Weight","The perceived heaviness of an element on screen, driven by its size, colour, contrast and density, used deliberately to balance or direct a composition.",0,[424,412,2005,2318]],["Corner Radius","The curvature applied to the corners of a rectangular element, a small stylistic choice that nonetheless strongly shapes a product's overall visual tone.",0,[2191]],["Neutral Palette","The set of greys, off-whites and near-blacks that make up the background, border and body-text colours of an interface, deliberately kept out of the accent palette.",0,[509,316,810,507]],["Colour Harmony","The pleasing relationship between colours chosen using established schemes such as complementary, analogous or triadic relationships on the colour wheel.",0,[1566,456,810,826]],["Auto Theme Switching","Automatic selection between light and dark colour schemes based on the operating system's current setting or the time of day, without requiring manual toggling.",0,[274,1952,2128,2200]],["Maximalism","A visual style embracing dense pattern, saturated colour and layered ornamentation, positioned deliberately against minimalism's restraint.",0,[516]],["Duotone","An image treatment mapping an image's tonal range to just two colours, typically a dark and a light hue, unifying photography with a brand's palette."],["Frosted Glass Effect","A background-blur treatment that softens whatever sits behind a translucent surface, used to keep an overlay legible while still hinting at underlying content.",0,[1122]],["Texture","Surface variation simulated on a flat screen through subtle grain, noise or pattern, used to add tactility to an otherwise perfectly smooth digital surface.",0,[157,169,539]],["Brand Expression in UI","The degree to which an interface's colour, type and shape choices carry a specific brand's identity rather than a neutral, generic system look.",0,[776]],["Saturation Hierarchy","Deliberate use of higher colour saturation for primary actions and lower saturation for secondary or disabled ones, layering importance through colour intensity alone.",0,[396]],["Warm/Cool Contrast","Deliberate pairing of warm and cool hues to create visual tension or separation, exploiting the eye's tendency to read warm colours as advancing and cool ones as receding.",0,[1566,586,800,1800]],["Border vs Divider","The distinction between a border, which encloses a single element, and a divider, which separates two adjacent regions without enclosing either.",0,[1954]],["Opacity Layering","Use of partial transparency to stack multiple elements while keeping lower layers partially visible, communicating both hierarchy and depth at once."],["Tint","A hue mixed with white, producing a lighter, softer version of the base colour used for backgrounds, hover states and subdued variants.",0,[272]],["Shade","A hue mixed with black, producing a darker, richer version of the base colour used for pressed states, text-on-colour and emphasis.",0,[156]],["Colour Ramp","A systematic scale of a single hue running from its lightest to darkest tint and shade, typically numbered in steps such as 50 through 900.",0,[1566,456,810,826]],["Claymorphism","A visual style rendering elements as soft, rounded, inflated 3D forms resembling modelling clay, using bold shadow and highlight pairs to suggest a squeezable surface."],["Gradient Mesh","A multi-point colour gradient blending several hues across a surface in irregular, organic patches rather than a simple linear or radial transition.",0,[517,552,210]],["Colour Blocking","Composition using large, flat areas of contrasting solid colour to divide a layout, rather than gradients, texture or imagery to create separation.",0,[517,528,1487,1558]],["Monochromatic Palette","A colour scheme built entirely from tints, tones and shades of a single hue, producing cohesion at the cost of the contrast a multi-hue palette provides.",0,[1315,316,810,507]],["Colour Psychology","The study of emotional and cultural associations particular colours carry, applied in interface design to reinforce a product's intended mood or trust signal.",0,[1508,1220,1566,456]],["Neubrutalism","A 2020s revival of brutalist aesthetics softened for product design, pairing bold outlined shapes, flat saturated colour and hard offset shadows with otherwise conventional usability.",0,[1439]],["Liquid Glass","A translucent, light-refracting material design language simulating real glass and light behaviour across interface surfaces, introduced by Apple across its platforms in 2025.",0,[158,769,1122]],["Colour Coding","Systematic use of distinct colours to represent discrete categories, statuses or priorities, letting a user distinguish them at a glance without reading labels.",0,[1555,1566,456,810]],["Motion Design","The discipline of designing movement within an interface deliberately, treating timing, easing and choreography as design decisions rather than incidental animation polish.",0,[1352,550,566,1569]],["Easing","The rate-of-change curve applied to an animated value over its duration, determining whether motion starts, ends or moves at a constant speed.",0,[549],"ux-easing"],["Ease-In-Out","An easing curve that starts slow, accelerates through the middle and decelerates again before stopping, the most natural-feeling default for most interface motion.",0,[1072]],["Spring Animation","Animation modelled on a physical spring's mass, stiffness and damping rather than a fixed duration and curve, producing motion that responds naturally to interruption.",0,[549,559,561,562]],["Duration","The length of time an animation takes to complete, tuned so a transition feels responsive rather than sluggish without feeling too abrupt to track.",0,[480,552,1258,1805]],["Choreography","The coordinated timing and sequencing of multiple animated elements within one transition, so their combined motion reads as a single organised event.",0,[552,1352,1353,545],"ux-stagger",1352],["Staggering","Offsetting the start time of multiple identical animations by a small fixed delay, so a list of items appears to cascade in rather than pop simultaneously.",0,[582,585],"ux-stagger"],["Transition","An animated change from one interface state to another, used to preserve a user's sense of continuity across what would otherwise be an abrupt cut.",0,[1496,553,580,194]],["Shared Element Transition","A transition in which an element common to both the outgoing and incoming screens animates smoothly between its two positions and sizes, anchoring the change.",0,[552,1496,580,1502]],["Microinteraction","A small, contained interaction built from a trigger, a set of rules, feedback and an optional loop, handling one specific task such as toggling a setting.",0,[233,563,1222]],["Anticipation","A brief preparatory motion before a main action, such as a button compressing slightly before it fires, signalling that a response is about to happen."],["Follow-Through","Continued secondary motion after a main action completes, such as an element settling or overshooting slightly before coming to rest, avoiding an abrupt stop.",0,[573,1801,1816,988]],["Squash and Stretch","Deformation of an element's shape during motion to imply weight and flexibility, adapted from traditional animation into interface transitions and playful state changes.",0,[552]],["Parallax Scrolling","Layered background and foreground elements that move at different speeds during scroll, creating an illusion of depth on an otherwise flat page.",0,[276,104,152,187]],["Scroll-Triggered Animation","Animation whose progress is driven directly by scroll position rather than time, playing forward or backward as a user scrolls through the page.",0,[276,829,1768,820]],["Perceived Performance","The felt speed of a system as experienced by the user, which well-designed loading and transition animation can improve independent of actual processing time.",0,[552,2153,2180,261]],["Loading Animation","Motion played while a system processes a request, filling the wait with visible activity that reduces how long the delay is perceived to be.",0,[548,559,562,565]],["Animation Curve","The specific mathematical function, typically a Bezier or spring model, that shapes how an animated value accelerates and decelerates from start to finish.",0,[572,921,548,559]],["Trigger-Rules-Feedback-Loops","Dan Saffer's four-part model for describing any microinteraction: what starts it, what governs its behaviour, what it shows the user, and whether it repeats.",0,[554,1222,233,870]],["Progress Illusion","Motion that suggests advancement toward completion without representing an actual measurable value, used when a real progress percentage cannot be calculated.",0,[254,367,368]],["Idle Animation","A subtle looping motion played while an element or character waits for input, signalling the interface is alive and ready rather than frozen.",0,[548,559,561,562]],["Attention-Seeking Animation","Motion designed specifically to pull the eye toward an element, such as a pulse or wiggle, used sparingly since overuse trains users to ignore it.",0,[545,26,1149,548]],["Frame Budget","The maximum time available to render a single animation frame, typically 16.7 milliseconds for 60 frames per second, beyond which motion begins to visibly stutter.",0,[1451,1876,1933,2078],"ux-frame-budget"],["Choreographed Reveal","A sequence in which multiple elements enter in a deliberately ordered pattern rather than all at once, guiding the eye through content in the intended reading order.",0,[1274]],["Ease-In","An easing curve that starts slow and accelerates toward its end, suited to elements leaving the screen since it exits attention gently before speeding away."],["Ease-Out","An easing curve that starts fast and decelerates toward its end, suited to elements entering the screen since it arrives with immediate energy before settling."],["Cubic Bezier Curve","A mathematical curve defined by two control points, the standard way easing functions are specified in CSS and animation software.",0,[921,562]],["Linear Easing","A constant-speed animation curve with no acceleration or deceleration, generally avoided for interface motion because it reads as mechanical rather than natural.",0,[562]],["Overshoot","Motion that passes slightly beyond its final resting value before settling back, a hallmark of spring-based animation that reads as more lively than a hard stop.",0,[556]],["FLIP Technique","First, Last, Invert, Play, an animation technique that calculates a transform from an element's starting and ending position, letting the browser animate it performantly."],["Enter/Exit Animation","Paired motion applied respectively when an element mounts into the interface and when it unmounts from it, giving both appearance and disappearance equal design attention.",0,[548,559,561,562]],["Physics-Based Animation","Animation driven by a simulated physical model, such as velocity, mass and friction, rather than a pre-authored keyframe timeline, so motion responds naturally to interruption.",0,[548,559,561,562]],["Keyframe Animation","Animation defined by specifying an element's exact property values at fixed points in time, with the states between them interpolated automatically.",0,[1555,548,559,561]],["Shake Animation","A brief rapid horizontal oscillation applied to an element, conventionally used to signal a rejected input such as an incorrect password or invalid form field.",0,[1508,886,941,548]],["Cross-Fade","A transition in which one element fades out while another simultaneously fades in at the same position, swapping content without any spatial movement.",0,[552,1606]],["Morph Transition","A transition in which one shape smoothly deforms into another's outline over time, rather than simply repositioning or fading, used when a control's form itself changes.",0,[552,1496,553]],["Animation Scrubbing","Direct manual control over an animation's playback position, typically by dragging, letting a user move forward and backward through it like a video timeline.",0,[829,442,548,559]],["Animation Delay","A pause inserted before an individual animation begins, the per-element building block that staggering uses to offset a group of elements from one another.",0,[551,548,559,561]],["Ambient Animation","Subtle, continuous background motion, such as a slow gradient shift, that adds atmosphere to a screen without drawing direct attention or competing with content.",0,[517,956,548,559]],["Interruptible Animation","Animation designed to respond immediately to new input mid-motion rather than forcing it to finish first, keeping the interface feeling responsive under rapid interaction.",0,[548,559,561,562]],["Overlapping Action","The principle that different parts of a moving element should not all start and stop in perfect unison, since staggered secondary motion reads as more physically believable.",0,[551,76,101,1530]],["Motion Contrast","Deliberately limiting which elements animate at all, so that the ones which do move stand out clearly against an otherwise still interface.",0,[1566,531,800,1569]],["UX Writing","The discipline of writing the words that appear inside a product's interface, treating every label, button and message as a designed interaction rather than an afterthought.",0,[1217,588,624]],["Content Design","The broader practice of shaping what content a product needs, where it lives and how it's structured, with UX writing as one of its outputs.",0,[587,767,2003,2025]],["Microcopy","The small pieces of interface text, a button label, an error line, a placeholder, that carry disproportionate weight in how usable a product feels."],["Tone of Voice","The consistent personality a product's writing carries, whether formal or casual, playful or serious, adjusted in register but kept recognisable across every screen.",0,[608]],["Error Message","Text explaining that something went wrong, what caused it where known, and what the user can do next, ideally without blaming the user.",0,[1787,1789,1795,1797]],["Empty State","The screen shown when a section has no content yet, designed to explain why it's empty and prompt the action that would fill it.",0,[938,620,455,382]],["Placeholder Text","Example or hint text shown inside an empty input before a user types, disappearing on first keystroke, distinct from a persistent label.",0,[382,625]],["Label","The persistent text identifying what a field, control or section is, remaining visible whether or not the control currently holds a value.",0,[773]],["Helper Text","Supplementary text placed beside a form field explaining a requirement or format before an error occurs, reducing mistakes rather than just reporting them.",0,[1555,236]],["Call to Action","The action-oriented label on a button or link telling a user exactly what happens next, written as a verb phrase rather than a vague noun.","CTA",[415,1869,1530,2101]],["Terminology Consistency","The discipline of using exactly one term for a given concept throughout a product, since a synonym in a second location reads as a different concept to the user.",0,[1774,1901,1909,1910]],["Reading Level","The complexity of a piece of interface text as measured by sentence length and vocabulary, kept low so it can be understood quickly under real conditions."],["Onboarding","The set of experiences that introduce a new user to a product, teaching what it does and how to get value from it before they abandon it.",0,[614,620,613,622],"ux-onboarding-cliff"],["First-Run Experience","The specific sequence of screens a user encounters the very first time they open a product, before any of their own data or settings exist.",0,[2,928]],["Coach Mark","A short annotation overlaid on a specific interface element, pointing directly at it to explain what it does the first time a user encounters it.",0,[992,602,1105]],["Product Tour","A guided sequence of coach marks or overlay screens walking a new user through a product's main features in a fixed order.",0,[601,1295,1296,111]],["Progressive Onboarding","Teaching a product's features gradually as a user reaches the point of needing each one, rather than front-loading every explanation before first use.",0,[1474,1494,212,459]],["Onboarding Checklist","A persistent list of setup tasks shown to a new user, tracking completion and motivating them to finish every step through visible partial progress.",0,[1555,480,927,1152]],["Sample Content","Pre-populated example data shown in a new account so a user can see how a feature looks and works before they've added anything of their own.",0,[2138,2003,2025,693]],["Feature Announcement","A message introducing a new or changed feature to existing users, timed to their next relevant visit rather than blasted at everyone simultaneously.",0,[1383,2107,2120,2296]],["Contextual Help","Assistance surfaced at the exact moment and location a user needs it, rather than requiring them to leave the task and search a help centre.",0,[1555,619,335,670]],["Voice and Tone Guide","An internal reference documenting a product's writing personality and how it flexes by context, keeping copy consistent across a team of multiple writers.",0,[590,1653,748,770]],["Confirmation Copy","Text verifying that an action completed successfully, specific enough to name what happened rather than a generic acknowledgement.",0,[245,380]],["Sentence-Case Convention","The style rule capitalising only the first word and proper nouns in interface labels, chosen over title case because it reads faster and feels less formal.",0,[6,17,137,780]],["Truncation Copy","The wording strategy for handling text that must be shortened to fit a fixed space, prioritising which words survive so the truncated version still makes sense.",0,[487]],["Guided Setup","A structured configuration flow that walks a new user through the minimum decisions needed to get a product working, deferring optional settings until later.",0,[2261,111]],["Templates Gallery","A curated collection of pre-built starting points offered during onboarding or creation, letting a user begin from a working example instead of a blank canvas.",0,[599,1872]],["Learn-by-Doing Onboarding","An onboarding approach that teaches a feature by having the user perform a real, low-stakes task with it, rather than reading or watching an explanation first.",0,[599,266,927,1152]],["Release Notes UX","The presentation of what changed in a product update, written and placed so users who care can find it without interrupting those who don't.",0,[2110,2126,2434,2405]],["What's-New Dialog","A modal shown after an update summarising recent changes, typically appearing once per user before it stops surfacing automatically.",0,[92,357,380,1014]],["In-App Messaging","Targeted messages delivered inside the product itself, distinct from email or push, timed to a user's specific context and current screen.",0,[621]],["Tooltip Copy","The specific wording practice for tooltip content, kept short enough to scan in the brief moment before a hover state disappears.",0,[360,272,453]],["Documentation Link","A link from within the product to fuller reference material, used when an answer is too long or specialised for contextual help to carry alone.",0,[607,1249,772]],["Zero-Data Onboarding","The design and copy strategy for a product's very first, completely empty state, before onboarding has produced any real content to display.",0,[599,592,927,1152]],["Interstitial Messaging","A brief message shown during a transition between two states or screens, used to explain a wait or bridge context rather than leaving a blank gap.",0,[552,617]],["Value Proposition Statement","A concise line of copy stating what a product does and why it matters, typically the first text a new user reads before any onboarding begins.",0,[599,1276,2391]],["Pluralisation Handling","Logic and copy rules that correctly inflect interface text for singular, plural and zero counts across languages with different grammatical pluralisation systems.",0,[1571,1724,1895,2232]],["Inverted Pyramid Writing","A structure placing the most important information first and supporting detail after, borrowed from journalism, so a user reading only the opening still gets the point.",0,[1819,587]],["Wireframe","A schematic, low-detail representation of a screen's layout and structure, using boxes and placeholder text to plan content and hierarchy before visual design begins.",0,[593]],["Low-Fidelity Prototype","A rough, quickly built version of a design, deliberately unpolished so feedback stays focused on structure and flow rather than colour and detail.",0,[233,627,628,629]],["High-Fidelity Prototype","A prototype closely matching the final product's visual design and interaction detail, used late in a process to test the actual experience users will get.",0,[663,626,628,629]],["Paper Prototype","A prototype built from hand-drawn or printed screens on physical paper, manipulated by hand to simulate interaction before any digital tool is involved.",0,[626,627,629,651]],["Clickable Prototype","A prototype with linked hotspots connecting its screens, letting a tester navigate through a flow by clicking or tapping rather than imagining the transitions.",0,[552,647,626,627]],["Fidelity","The degree to which a design artefact resembles the finished product in visual detail and interactive behaviour, chosen deliberately for each stage of a process.",0,[663,2343,626,627]],["Mockup","A static, visually finished representation of a screen, showing exact colour, type and imagery without the interactivity a prototype would add."],["Storyboard","A sequence of illustrated panels depicting a user moving through a scenario over time, used to communicate context and emotion around a flow before screens exist."],["User Flow","A diagram tracing every path a user might take through a product to accomplish a goal, including branches, decisions and alternate routes.",0,[634]],["Task Flow","A diagram tracing the single, linear sequence of steps a user takes to complete one specific task, without the branches a full user flow includes.",0,[633]],["Design Brief","A document defining a project's goals, constraints, audience and success criteria before design work begins, the shared reference the whole team designs against."],["Design Critique","A structured session in which a team reviews work in progress against its goals, intended to surface problems and generate direction rather than assign a grade."],["Design Spec","A document detailing the exact measurements, states, colours and behaviour of a finished design, prepared for whoever builds it to reference directly.",0,[1226,1257]],["Style Tile","A single-page collection of a project's colours, type and UI motifs, presented as an intermediate deliverable between a moodboard and a full mockup.",0,[639,446,1554,1653]],["Moodboard","A curated collage of images, colours and references assembled to communicate a design's intended emotional tone before any interface work begins.",0,[638]],["Figma","A browser-based collaborative interface design tool supporting real-time multi-user editing, the dominant tool in professional UI design workflows since the early 2020s.",0,0,"ux-presence"],["Sketch","A macOS-native vector interface design tool, launched in 2010, that established much of the modern artboard-and-symbol workflow later tools adopted."],["Adobe XD","Adobe's interface design and prototyping tool, launched in 2016 and discontinued in 2023 as the company shifted its design tooling focus elsewhere.",0,[2317,778]],["Axure","A prototyping tool known for producing highly interactive, logic-driven prototypes with conditional behaviour beyond simple screen-to-screen linking."],["Balsamiq","A wireframing tool deliberately styled to look hand-sketched, keeping early-stage reviews focused on structure rather than being mistaken for finished visual design."],["Framer","A design tool combining visual interface editing with real code-level interactivity, used to build prototypes and production sites that behave like the shipped product."],["Penpot","An open-source, browser-based interface design tool built on open web standards, offered as a self-hostable alternative to proprietary design platforms."],["InVision","An early cloud-based prototyping and collaboration platform that turned static mockups into clickable prototypes, influential in the 2010s before losing ground to Figma.",0,[629]],["Zeplin","A design handoff tool that generates specs, measurements and asset exports from a design file for developers to reference during implementation."],["Miro","A collaborative online whiteboard used for workshops, mapping and early-stage ideation, adopted widely for remote and hybrid design collaboration."],["Auto Layout","A design-tool feature that resizes and repositions elements within a frame automatically according to defined rules, keeping a component responsive as its content changes.",0,[2381,1619,1471,1484]],["Wizard of Oz Prototype","A prototype whose apparently automated functionality is secretly operated by a hidden human, used to test a system's interaction before it is actually built.",0,[366,626,627,628]],["Design Sprint","A time-boxed, typically five-day structured process taking a team from problem definition through prototyping to user testing, developed at Google Ventures."],["Crazy Eights","A rapid sketching exercise in which participants draw eight distinct ideas in eight minutes, one per fold of a sheet of paper, to force divergent thinking fast.",0,[714]],["Dot Voting","A group prioritisation method in which participants place a limited number of sticker dots on the ideas or options they favour, surfacing consensus visually."],["Screen Flow","A visual diagram showing every screen in a product and the navigational connections between them, closer to a map of the whole product than a single task's path.",0,[1555,366,1493,1561]],["Design Review","A formal checkpoint at which a design is evaluated against requirements by stakeholders before it proceeds to build, distinct from an informal peer critique.",0,[920,1264,1597,2292]],["Redline","An annotated version of a design marking exact spacing, sizing and colour values with measurement lines, historically drawn in red ink over a printed layout."],["Design File Organisation",
