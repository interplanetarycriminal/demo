e any user changes it, powerful because most users, by measured majority, never move away from whatever it is set to.",0,[1454,246,1455,1456]],["Settings Search","A search field placed at the top of a settings screen, letting a user type what they want to change instead of navigating a menu hierarchy to find it.",0,[1088]],["Semantic Zoom","Changing what information a view shows, not merely its scale, as a user zooms, so zooming out reveals a coarser summary rather than a smaller version of the same detail.",0,[1275,1560,1632,1831]],["Ribbon","A tabbed strip of grouped, labelled command icons replacing nested menus, Microsoft's 2007 Office redesign that adapted its visible tools to the active document type and task."],["Frecency","A ranking signal blending frequency and recency of use, coined at Mozilla for Firefox's address bar, that surfaces what a user is likely to want next.",0,[1508]],["Algorithmic Feed","A content stream ordered by a ranking model predicting engagement or relevance for the specific viewer, rather than by simple reverse-chronological posting order."],["User Scripting","Writing small custom scripts that alter or extend how a specific website or application behaves, run locally by the user rather than shipped by the product's own developer.",0,[1079,1756]],["Greasemonkey","A Firefox extension launched in 2005 that runs user-authored JavaScript against specific web pages, the tool that established user scripting as a mainstream practice.",0,[1078]],["Bookmarklet","A small script stored as a browser bookmark that runs against whatever page is currently open when clicked, a lightweight precursor to the browser extension.",0,[830]],["Macro Recording","Capturing a sequence of a user's own actions as a replayable script, letting them automate a repetitive task without writing code from scratch.",0,[1555,2015,2244]],["Automation Recipe","A saved, shareable definition of a trigger-and-action automation, the packaged unit tools such as IFTTT and Zapier let users publish and reuse.",0,[1244,251,1158]],["Trigger-Action Programming","An automation model where a user pairs a chosen trigger event with a resulting action from a menu of options, avoiding general-purpose code entirely.",0,[1768,559,563,820]],["Intent-Based Outcome Specification","Stating the outcome a user wants in plain language and letting a system determine the steps, a framing Jakob Nielsen proposed in 2023 as AI's successor to direct manipulation.",0,[268,1185,1262,1284]],["Predictability–Adaptivity Trade-off","The tension between a system that behaves consistently, which is learnable, and one that behaves optimally for each moment, which can feel like it keeps moving the furniture.",0,[1157,1460]],["Personalised Interface","A view whose specific content or layout differs by individual user based on their own data, behaviour or stated preference, rather than one shared default for everyone.",0,[1072]],["User Preference","A stored choice a specific person has set for how a product should behave for them, persisted across sessions rather than reset every time.",0,[1555,835,1569,1156]],["Sync of Settings","Carrying a user's configured preferences automatically across every device they sign into, so a change made on one machine appears on the next without re-entering it.",0,[1073,1881]],["Interface Density Setting","A user-configurable control that switches an interface between a compact layout showing more per screen and a spacious one showing less but larger.",0,[412]],["Contextual Toolbar","A set of controls that appears only when relevant to a current selection or task, rather than sitting permanently visible regardless of what a user is doing.",0,[274,335,607,670]],["Recently Used","A list surfacing a user's most recently opened files, commands or items first, a low-effort adaptive convenience present in nearly every modern application.",0,[1804,904]],["For-You Feed","A content stream's tab explicitly branded as personalised to the individual viewer, distinguishing algorithmic recommendation from a following-based or chronological feed shown alongside it."],["Recommendation Explanation","A short stated reason, such as 'because you watched X', attached to a suggested item, giving a user some visibility into why an algorithm surfaced it."],["Why-Am-I-Seeing-This","A user-triggered control that surfaces the specific signals or ad-targeting criteria behind one recommended or sponsored item, on request rather than by default.",0,[1508,1072]],["Shortcuts","Apple's named end-user automation app, launched in 2018, that lets people chain built-in and third-party app actions into a custom, triggerable workflow.",0,[133,207,243,328]],["UI on Demand","Assembling the specific interface controls a task needs at the moment it is requested, rather than shipping every possible control permanently in the layout.",0,[443]],["Prompt-to-App","Generating a working, interactive application from a natural-language description of what it should do, collapsing the traditional design-then-build sequence into a single request.",0,[1232,1240,1243,1253]],["Software Mass Customisation","Manufacturing a distinct configuration of a product for each customer at production scale, the software-industry adaptation of a term from physical-goods manufacturing.",0,[1069,2311,2352,2353]],["Self-Healing UI","An interface that detects and automatically corrects its own broken or degraded state, such as a failed component or a bad layout, without a manual patch or reload.",0,[2202,1380,2132]],["Progressive Personalisation","Building up a tailored experience gradually as a system observes more signal over time, rather than requiring an upfront preference-setting step before any personalisation begins.",0,[1508,1897,1157,1474]],["Layout Memory","An interface's retention of a user's last manual arrangement, such as panel size or column order, restoring it automatically on the next visit.",0,[1258,1886,2156,2157]],["Smart Folder","A folder whose contents are computed live from a saved rule or query rather than manually placed files, updating automatically as matching items appear.",0,[1379,953]],["On-the-Fly UI Generation","Assembling an interface's specific controls at the moment a task is opened, computed from the current data and intent rather than drawn from a fixed screen library.",0,[1477,1635,1716,1892]],["Pie Menu","A circular menu selecting commands by stroke direction rather than list position, built 1988 by Don Hopkins at the University of Maryland; suited to gesture-first touch and AR interaction today.",0,[287,1105]],["Marking Menu","Gordon Kurtenbach, Abigail Sellen and Bill Buxton's 1993 refinement letting an expert bypass a pie menu by drawing its direction-mark from memory alone.",0,[1104,601]],["Zooming User Interface","An infinite pannable, zoomable canvas replacing nested windows, built as Pad in 1993 by Ken Perlin and David Fox at NYU; direct ancestor of today's infinite-canvas design tools.","ZUI",[151,1074]],["Pad++","Ben Bederson, Jim Hollan and Ken Perlin's research successor to Pad, engineering zoomable-canvas performance for real applications rather than a demo."],["Archy","Jef Raskin's unfinished 2000s successor to the Canon Cat: one continuous document, no files or app-switching, navigated by LEAP-key incremental search.",0,[1109,1110,1187]],["LEAP Keys","Canon Cat keys held as a quasimode to type-jump the cursor to matching text anywhere in the document; ancestor of today's universal quick-search.",0,[285,1110,1108,1187]],["Canon Cat","Jef Raskin's 1987 word-processor-as-computer with no files, folders or menus, discontinued after roughly 20,000 units sold.",0,[1187,1108,1109]],["PenPoint","GO Corporation's 1991 pen-native OS with a systemwide gesture vocabulary — circle to edit, X to delete — folded by 1994 after burning roughly $75 million.",0,[287]],["Magic Cap","General Magic's 1994 animated 'rooms and hallways' mobile OS, shipped on the Sony Magic Link and Motorola Envoy; its spatial navigation metaphor never returned.",0,[1143,2053]],["Knowledge Navigator","Apple's 1987 concept video for CEO John Sculley, with Alan Kay's input, depicting a conversational AI tablet assistant named Phil decades before one existed.",0,[2451,2314,1418,1881]],["Dynabook","Alan Kay's 1968 idea, published 1972, for a book-sized personal computer for 'children of all ages', anticipating the laptop and tablet by over a decade.",0,[2451]],["OpenDoc","Apple's 1992 compound-editing architecture, with IBM and Motorola, for wiring reusable document parts together live; killed in 1997, echoed in today's block-based document editors.",0,[2363]],["Microsoft Bob","Microsoft's 1995 cartoon-room desktop replacement, discontinued within a year; its leftover assistant technology became Clippy — a lasting lesson in over-literal metaphor design.",0,[125,764,1126]],["Kai's Power Tools","Kai Krause's 1992 maximalist Photoshop plugin interface at MetaCreations, hiding reward functions to be found through play rather than a toolbar.","KPT",[207,1248,1063]],["Enso","Aza Raskin's mid-2000s Caps-Lock-activated quasimodal command line, built on his father Jef Raskin's ideas; a direct ancestor of today's Cmd+K command palettes.",0,[316,1187,1197]],["Quicksilver","A mid-2000s Mac keyboard launcher for finding and acting on any file or command by typing a few letters, without touching the mouse."],["Ubiquity","Mozilla Labs' 2008 experimental extension, led by Aza Raskin, letting users type natural-language browser commands like 'map [address]'; never productised.",0,[1197,23]],["OLPC Sugar","One Laptop Per Child's activity-centred interface, replacing the desktop with zoomable Home, Friends and Neighbourhood views; superseded by low-cost Android tablets."],["Project Looking Glass","Sun Microsystems' 2003–2006 Java 3D desktop where windows behaved as flippable, rotatable physical panes; its spatial window model resurfaces in visionOS.",0,[2304,68,35,527]],["10/GUI","R. Clayton Miller's 2009 concept for a ten-finger multitouch desk pad with a linear window-organisation scheme; never built beyond a concept video."],["BumpTop","Anand Agarawala's 2009 physics-based 3D desktop where icons could be piled and flicked like real papers; acquired by Google in 2010 and shelved."],["Chandler","Mitch Kapor's ambitious folderless personal-information manager, reaching 1.0 in 2008 after burning roughly $8 million without product-market fit — a famous overreach case study."],["Microsoft Courier","A leaked 2009 dual-screen digital-journal concept led by J Allard, built around handwriting; cancelled in 2010, resurfacing a decade later in Surface Duo.",0,[63,764,1116]],["XrossMediaBar","Sony's 2003 horizontal-category, vertical-submenu interface debuted on the PSX and used through the PS3; won a Technology & Engineering Emmy in 2006.","XMB"],["BeOS Live Queries","Be Inc.'s Tracker file manager, 1996–97, showed 'live' folders that were really saved database searches; the idea reappears in Spotlight and tag-based filesystems."],["Newton Intelligent Assistance","The Apple Newton's cross-application Assistant, searching and acting across all a user's 'soup' object data at once; anticipates today's AI assistants.",0,[121]],["webOS Card Multitasking","Matias Duarte's 2009 Palm Pre interface rendering each app as a swipeable card; the platform failed but the pattern was absorbed whole into iOS and Android."],["Piles","Apple's 1992 patented concept for dropping documents into loose overlapping desktop stacks instead of named folders; never shipped as a product."],["Lifestreams","David Gelernter and Eric Freeman's mid-1990s Yale proposal to replace files and folders with one chronological stream of every document; anticipates today's activity feeds."],["Rooms","A Xerox PARC scheme by Henderson and Card letting a user keep several separate desktop layouts as switchable rooms; echoes in today's virtual desktops.",0,[1206,2216,965]],["Anti-Mac Interface","Don Gentner and Jakob Nielsen's 1996 thought experiment systematically inverting every accepted Macintosh convention, to test which ones were genuinely necessary.",0,[94,1185]],["Starfire","Sun Microsystems' 1994 concept video depicting a wall-sized, gesture- and voice-driven collaborative workspace, anticipating large touch displays well ahead of the hardware.",0,[287]],["Apple Data Detectors","A mid-1990s Apple research project scanning any on-screen text for addresses or dates and offering contextual actions automatically; never shipped system-wide.",0,[93,121,180]],["SILK/DENIM","James Landay's late-1990s Berkeley/CMU sketch-recognition tools letting designers hand-draw testable interface widgets and site maps; prefigure today's whiteboard-to-code AI tools."],["Momenta","Momenta Corporation's October 1991 pen-and-keyboard pentop computer, one of the first of its kind; folded within two years but validated the form factor early."],["Telescript","General Magic's 1994 mobile-agent language letting autonomous software travel networks to transact on a user's behalf; a direct ancestor of today's AI agents.",0,[1143]],["HyperStudio","Roger Wagner's 1989 no-code multimedia authoring tool for schools, building linked card stacks of text and sound; widely used, then faded with the web."],["VRML","Virtual Reality Modeling Language, standardised 1994–95, for describing interactive 3D scenes viewed through a browser plug-in; never reached mainstream adoption, succeeded by X3D."],["Fabrik","Apple Advanced Technology Group's early-1990s Smalltalk dataflow environment where components were visually wired together live; anticipates today's no-code dataflow tools."],["General Magic","The 1990 Apple spin-off behind Magic Cap and Telescript's unified agent-driven communicator vision; collapsed by the late 1990s, its ideas now read as an early sketch of the AI-agent era.",0,[1112,1139,1189,2053]],["Symbolics Genera","The 1980s Lisp Machine environment whose 'Listener' made every displayed object a live, clickable typed object rather than mere pixels; died with the Lisp Machine market.",0,[2333]],["Acme","Rob Pike's 1993 Bell Labs text-as-interface tool for Plan 9, where any displayed text is both content and a clickable command; a cult tool, never mainstream."],["Mode Error","An action correct for the mode a user believes they are in but wrong for the system's real mode, a failure Don Norman catalogued as a root cause of mistakes.",0,[236,1184,1543],"ux-modes"],["Software Bloat","The growth of a program's size, resource use and complexity over time without a proportional gain in the core utility it delivers.",0,[2311,2352,2353,2364]],["Notification Overload","The saturation point at which alert volume overwhelms a user's attention, prompting them to mute, ignore or delete the app rather than triage individually.",0,[1555,1590,1611,1970]],["Attention Economy","A market treating human attention as the scarce resource competed for, a framing traced to economist Herbert Simon's 1971 observation that information abundance creates a poverty of attention.",0,[26,566]],["Vocabulary Problem","George Furnas's 1987 finding that no single term for an action reliably matches what most users will guess, undermining any interface that assumes one label is enough.",0,[348,1268,1271,1276]],["Mystery-Meat Navigation","Vincent Flanders's term for navigation whose icons or labels give no indication of their destination until a user actually clicks them to find out.",0,[1555,1565,160,309]],["Onboarding Cliff","The specific point in a first-run flow where drop-off spikes sharply, typically where a task suddenly demands real effort, a decision or a data upload.",0,[599,603,604,614],"ux-onboarding-cliff"],["Novice–Expert Tension","The conflict between an interface simple enough to welcome a first-time user and one efficient enough to reward a daily power user, rarely satisfied by a single design.",0,[1157,1411,2327,716]],["Universal Usability","Ben Shneiderman's stated goal of one system serving the full range of users, across skill, hardware and ability, rather than shipping separate versions for each.",0,[1186,1599,785,1439]],["Undo in Collaborative Systems","The unresolved design problem of what a single user's undo command should do to a shared document that other people have continued editing since.",0,[990]],["Preference Proliferation","The accumulation of so many individually reasonable settings that the total settings surface becomes too large for a user to navigate confidently.",0,[1569,1070,1087]],["Personalisation–Predictability Tension","The trade-off where content or layout tailored to one user makes the system behave differently for everyone else, undermining shared expectations and mutual support.",0,[1085,1897,1100,1153]],["Automation Complacency","The reduced vigilance that sets in once a person routinely relies on an automated system, leaving them slow to notice and catch its rare failures.",0,[1555,1244,251,1082]],["Consent Fatigue","The numbing effect of facing repeated permission and cookie prompts, leaving users clicking through automatically rather than reading any individual request.",0,[1245,2058,2220,696]],["Form Abandonment","A user quitting a form partway through, tracked as a completion-rate metric that flags excessive length, unclear requirements or ill-timed friction.",0,[480]],["Doomscrolling","Compulsively continuing to scroll a feed of distressing news well past any benefit, a term that spread into common use during 2020.",0,[276]],["Filter Bubble","Eli Pariser's 2011 term for the personalised information environment algorithmic curation builds around a user, narrowing what they encounter without their awareness.",0,[1873,321,434]],["Redesign Backlash","The predictable wave of user complaint that follows a familiar interface's overhaul, regardless of whether the new version measures as objectively better.",0,[478]],["Accessibility Retrofit Problem","The higher cost and compromised result of adding accessibility support to a product after it has shipped, compared with designing it in from the outset.",0,[1581,807,813,814]],["Hallucination Trust Problem","A fluent, confidently formatted AI answer lending false authority to output that is factually wrong, since presentation quality carries no correlation with accuracy.",0,[1246,27,253,1268]],["Prompt Discoverability Crisis","The blank-box problem where an AI system capable of a wide range of tasks gives a new user no visible cue for what it can actually do.",0,[1169,2382,1232,1240]],["Creeping Featurism","The steady, incremental addition of features, each individually reasonable, that collectively buries a product's original core task under options few use.",0,[1297,2417]],["Interruption Cost","The time and error penalty a person pays resuming a task after a notification or context switch has pulled their attention away from it."],["Discoverability Problem","The general failure mode where a feature exists in a product but nothing in the interface reveals its presence to a user who would benefit from finding it.",0,[968,1166,1268,1271]],["Cross-Device Continuity Problem","The gap between a user's expectation of seamless progress across their devices and the reality of state that fails to sync or transfers incompletely.",0,[194,1607,2037,792]],["Configuration Sprawl","The spread of the same setting across multiple disconnected menus, apps or admin panels, forcing a user to hunt for and reconcile it in more than one place.",0,[1691]],["Anthropomorphism Trap","The risk of a system's humanlike presentation, such as a friendly avatar or first-person voice, leading a user to over-attribute understanding or judgement it does not actually have.",0,[479,1563]],["Cookie-Banner Blindness","The learned reflex of dismissing a consent banner without reading it, a habituated response the repetition of near-identical prompts trains into nearly every web user.",0,[239,843,197,198]],["Engagement Trap","A product optimised so heavily for time-on-app or session count that it degrades the very outcomes, such as user wellbeing, that made engagement worth pursuing.",0,[1563]],["Legacy Migration UX","The design problem of moving existing users and their data onto a rebuilt system without breaking the workflows they have depended on for years.",0,[1741,1756,1771,1974]],["Walled-Garden Lock-In","A platform's structure that makes leaving costly, through proprietary data formats, network effects or absent export tools, regardless of a competitor's merits.",0,[2161]],["Data Portability Problem","The practical difficulty of extracting one's own data from a service in a genuinely usable form elsewhere, despite a formal legal right to request it.",0,[1435,1268,1271,1276]],["Skill Atrophy","The erosion of a person's own capability at a task once software has reliably performed it for them over an extended period.",0,[1555,914]],["AI Slop UI","An interface pattern that surfaces obviously low-effort, mass-generated AI content as though it were curated or authored with care, degrading trust in a feed at scale.",0,[1233]],["Roach Motel","A design that makes signing up for a service quick but cancelling it deliberately slow or buried, named for the pest-trap slogan bugs check in but don't check out."],["Confirmshaming","Phrasing a decline option in guilt-inducing language, such as 'No thanks, I don't want to save money', to pressure a user toward the option the design prefers."],["Expertise Cliff","The steep drop in usability a novice-friendly interface causes once a user's needs outgrow it and no efficient path for an experienced user has been provided.",0,[1439,1152]],["Multi-Device Fragmentation","A product's features or stored data behaving inconsistently across a user's different devices, undermining any single mental model of what the product actually does.",0,[1607,226,1963,2037]],["Don Norman","Cognitive scientist and author of The Design of Everyday Things (1988); formulated the gulfs of execution and evaluation, and co-founded the Nielsen Norman Group in 1998.",0,[1209,248,228,1146],"ux-modes"],["Jakob Nielsen","Usability engineer who developed the ten usability heuristics with Rolf Molich in 1990, refined in 1994, and co-founded the Nielsen Norman Group with Don Norman in 1998.",0,[1209,713,1439,730]],["Ben Shneiderman","Coined the term 'direct manipulation' in a 1982 IEEE Computer article and authored the Eight Golden Rules of Interface Design in his textbook Designing the User Interface.",0,[268,714,431,3]],["Jef Raskin","Started the Macintosh project at Apple, later designed the Canon Cat and its LEAP-key quasimodes, and wrote The Humane Interface in 2000.",0,[1110,1214,1197,94]],["Susan Kare","Designed the original Macintosh's hand-drawn 32×32-pixel icon set and system typefaces in 1983–84 after joining Apple, later working for NeXT and Facebook.",0,[94,80]],["Bill Atkinson","Key Macintosh graphical-interface engineer who created MacPaint and HyperCard at Apple, then co-founded General Magic.",0,[99,2302,94,1143]],["Larry Tesler","Invented modeless editing and Cut/Copy/Paste with Tim Mott on the Gypsy editor at Xerox PARC in the mid-1970s; spent his career campaigning against modal interfaces.",0,[84,1206,205]],["Alan Cooper","Sold the precursor to Visual Basic to Microsoft in 1988, pioneered the persona methodology for interaction design, and authored About Face and The Inmates Are Running the Asylum.",0,[1215,1,675,1219]],["Brenda Laurel","Media theorist who authored Computers as Theatre (1991), applying Aristotelian dramatic theory to human-computer interaction design.",0,[1218,0,1]],["Lucy Suchman","Anthropologist whose Plans and Situated Actions (1987) argued people improvise their use of a system moment to moment, a foundational critique of planning-based interaction models."],["Bill Moggridge","Designer of the first laptop, the GRiD Compass, who coined the term 'interaction design' with Bill Verplank around 1984 and later authored Designing Interactions in 2006.",0,[1195,1217,1,1704]],["Bill Verplank","Co-coined the term 'interaction design' with Bill Moggridge around 1984, bringing an engineering and cognitive-science grounding to the discipline's earliest framing.",0,[1194,1,1704,1713]],["Stuart Card","Co-authored, with Thomas Moran and Allen Newell, The Psychology of Human-Computer Interaction (1983), introducing the GOMS model for predicting task performance.",0,[0,1220]],["Aza Raskin","Jef Raskin's son; led Mozilla Labs' Ubiquity project and Humanized's Enso, is a disputed co-claimant to inventing infinite scroll, and later founded the Center for Humane Technology.",0,[1120,1187,276,844]],["Ethan Marcotte","Coined the term 'responsive web design' in his May 2010 A List Apart article, unifying fluid grids, flexible images and media queries into one named methodology.",0,[409,1224,411]],["Luke Wroblewski","Coined and popularised 'mobile first' as a design strategy in his 2011 book Mobile First, arguing constraints on small screens should shape design before desktop.",0,[883]],["Dieter Rams","Braun's chief industrial designer, whose Ten Principles for Good Design from the late 1970s were later cited by Jonathan Ive as a direct influence on Apple's design language.",0,[769]],["John Carroll","With Mary Beth Rosson, formulated the paradox of the active user (1987) — that users dive straight into tools rather than learning them first — and pioneered minimalist instructional design.",0,[1555]],["Norm Cox","Xerox graphic designer who drew the Xerox Star's interface icons in 1981, including its document and folder icons and the hamburger icon later revived by mobile UI decades on.",0,[75,314]],["Dylan Field and Evan Wallace","Brown University students who founded Figma in 2012 and publicly launched it on 6 December 2016 as the first fully browser-based, real-time multiplayer design tool.",0,[983,1657,382,384]],["Hiroshi Ishii","MIT Media Lab researcher leading the Tangible Media Group, pioneering interfaces where physical objects, not screens, serve as the handles for digital information.",0,[479,1212,955]],["Loren Brichter","Created Tweetie for iPhone in 2008, inventing the pull-to-refresh gesture, later patented by Twitter after its 2010 acquisition of his company Atebits.",0,[154,287]],["Xerox PARC","The Palo Alto Research Center, birthplace of the Alto, the Smalltalk GUI, Ethernet and laser printing, and the desktop metaphor later commercialised as the Xerox Star in 1981.",0,[75,2332,81,85]],["SRI Augmentation Research Center","Douglas Engelbart's Stanford Research Institute lab, which produced NLS, the computer mouse and the 1968 Mother of All Demos.","ARC",[2445,48,59,667]],["IDEO","Design consultancy formed via a 1991 merger including David Kelley Design, credited with popularising human-centred design methodology broadly across industries beyond software."],["Nielsen Norman Group","Usability consultancy founded in 1998 by Jakob Nielsen and Don Norman, publishing widely cited applied usability research.","NN/g",[1185,1184,1439,248]],["ACM SIGCHI","The Association for Computing Machinery's Special Interest Group on Computer-Human Interaction, the field's primary academic professional body since the early 1980s.",0,[0,1211]],["CHI Conference","ACM SIGCHI's annual conference, first held in 1983, the discipline's premier peer-reviewed academic venue for human-computer interaction research.","CHI",[0,1210]],["MIT Media Lab","Interdisciplinary research lab founded in 1985 by Nicholas Negroponte and Jerome Wiesner, a broad incubator for experimental interface research spanning tangible computing and wearables.",0,[1204]],["The Design of Everyday Things","Don Norman's 1988 book, originally The Psychology of Everyday Things, introducing affordances, signifiers and the gulfs of execution and evaluation to a mass audience; revised in 2013.",0,[228,230,231,1184]],["The Humane Interface","Jef Raskin's 2000 critique of prevailing GUI paradigms, introducing quasimodes and zooming interfaces as an alternative built from first principles.",0,[1187,285]],["About Face","Alan Cooper's 1995 book introducing goal-directed design and the persona methodology, later editions retitled About Face: The Essentials of Interaction Design.",0,[1191,1,675,2425]],["Don't Make Me Think","Steve Krug's 2000 practical web-usability guide, built on the 'satisficing' model of how people actually browse, with over 600,000 copies eventually in print.",0,[1439,238,711,1223]],["Designing Interactions","Bill Moggridge's 2006 oral-history survey of interaction design's founding moments, built from interviews with the field's own pioneers.",0,[1194,1,587,1466]],["Computers as Theatre","Brenda Laurel's 1991 book applying Aristotelian dramatic structure to human-computer interaction design, reissued in a second edition in 2014.",0,[1192,0,1,2334]],["The Inmates Are Running the Asylum","Alan Cooper's 1999 book arguing that engineers, not designers, were driving product decisions to users' detriment.",0,[1191,1646]],["The Psychology of Human-Computer Interaction","Stuart Card, Thomas Moran and Allen Newell's 1983 book introducing the GOMS model for predicting how long a skilled user takes to complete a task.",0,[1196,0,541,5]],["Laws of UX","Jon Yablonski's 2020 book, second edition 2024, cataloguing cognitive-psychology 'laws' — Fitts's Law, Hick's Law, Jakob's Law — as applied to interface design.",0,[200,201,203]],["Microinteractions","Dan Saffer's 2013 book framing small interface moments through trigger, rules, feedback and loops-or-modes.",0,[233,554,563]],["As We May Think","Vannevar Bush's July 1945 essay in The Atlantic proposing the Memex, the conceptual blueprint for hypertext two decades before the word existed.",0,[52,711,1216]],["A List Apart","Long-running web-design publication where Ethan Marcotte's May 2010 article coined 'responsive web design', among many other field-shaping essays.",0,[1198,409,2278]],["Dribbble","Design-community platform launched in 2009 for sharing work-in-progress interface and visual design 'shots', shaping how designers show and discover portfolio work online."],["Spec-Driven Development","The practice of writing a precise specification first and having an AI agent implement against it, so the spec rather than the prompt is the durable artefact.",0,[2224,2376,2119,2122]],["Vibe Coding","Building software by iteratively prompting an AI and accepting what runs, with little or no reading of the generated code."],["Agentic Coding","Letting an AI agent plan, write, run and fix code across multiple steps with minimal per-step human intervention.",0,[2419,2423,21,1870]],["Background Agent","An AI coding agent that runs a task asynchronously in its own environment while the developer keeps working elsewhere.",0,[1609,1689]],["Human-in-the-Loop","A workflow design where a person must review or approve an AI agent's output at defined checkpoints before it proceeds.",0,[920,0,5,1220]],["Context Engineering","The discipline of deciding what information, tools and instructions to put in front of a model so it has what it needs and nothing that misleads it.",0,[730,2284,2364,37]],["Prompt-to-PR Workflow","A pipeline in which a natural-language prompt or ticket is turned automatically into a reviewable pull request by an agent.",0,[1870,2120,2133,1025]],["AI Slop","Code, text or output that is plausible-looking but shallow, redundant or wrong, produced faster than anyone is reviewing it.",0,[1260,1179]],["Agent Autonomy Level","The degree of independent action a coding agent is permitted before it must stop and ask a human, from full oversight to fully unattended.",0,[1048]],["Task Decomposition","Breaking a large piece of work into smaller steps an agent can execute and verify one at a time."],["Agent Harness","The surrounding software that gives an AI model a loop, tools, memory and permissions so it can act as an agent rather than answer once.",0,[1866,2231]],["Sandboxed Execution","Running agent-generated code in an isolated environment so it cannot touch production systems or the developer's real files.",0,[228,1637,1609,1922]],["Multi-Agent Orchestration","Coordinating several AI agents with different roles or tools to complete one larger task.",0,[1353,776,1183]],["Agent Handoff","Passing partially completed work, along with its context, from one agent or session to another.",0,[1018,1047,1559,1915]],["Steering Prompt","A mid-task instruction sent to redirect an agent already in progress without restarting it from scratch.",0,[28,206,1025,1026]],["Plan Mode","An agent mode that produces and shows a proposed sequence of actions for approval before any code is changed.",0,[1062,1739]],["Checkpoint Commit","A small commit an agent makes at a known-good point so a bad next step can be rolled back cheaply.",0,[920]],["Rollback Prompt","An instruction that tells an agent to undo its recent changes and return the codebase to a prior state.",0,[1025,1026,1027,1055]],["Ticket-to-PR Automation","A system that takes an issue-tracker ticket and produces a working pull request without a developer writing the first draft.",0,[251,1082,1158]],["Reviewer Fatigue","The drop in review thoroughness that sets in when humans face a high and constant volume of AI-generated changes to check.",0,[1159,2220]],["Trust Calibration","The practice of matching how much a developer verifies an agent's output to how reliable that agent has actually proven to be.",0,[253,27,1165],0,253],["Context Pack","A curated bundle of files, docs and examples assembled ahead of a task so an agent starts with the right background.",0,[37,282,437,1058]],["Tool Allowlist","The explicit set of commands or APIs an agent is permitted to call, used to bound what it can do unsupervised.",0,[1063,1117]],["Living Documentation","Documentation that is regenerated or checked against the codebase automatically so it cannot silently go stale.",0,[619,772]],["Agent Instructions File","A repository-level file, such as a CLAUDE.md or AGENTS.md, that tells any AI agent working in the codebase its conventions and constraints.",0,[1399,658]],["Subagent","A secondary agent spawned by a primary agent to handle one bounded piece of a larger task, usually with its own context."],["Output Variance","The tendency of a model to give a different answer to the same prompt on different runs.",0,[14,1868]],["Portable Prompt","A prompt written to work consistently across different models or tools rather than tuned to one vendor's quirks.",0,[1025,1026,1027,1055]],["Prompt Versioning","Tracking changes to a prompt over time the way source code is tracked, so regressions in behaviour can be traced to a specific edit.",0,[480,996,659,759]],["Merge Gate","An automated check an agent-authored change must pass before it is allowed to merge, such as tests, review or an eval score.",0,[1000]],["Definition of Done (AI-Authored)","The extra bar a piece of AI-generated work must clear beyond \"it runs\" before a human will call it finished.",0,[1280,1281]],["Spec Drift","The growing mismatch between a written specification and what the implementation actually does as an agent iterates on it.",0,[637,1656,1887,1899]],["Session Memory","The working context an agent retains for the duration of a task, lost once the session ends unless explicitly saved.",0,[549,860,1911,1999]],["Context Rot","The degradation in an agent's accuracy and focus as its context window fills with accumulated, sometimes irrelevant, history.",0,[37,282,437,1058]],["Shotgun Prompting","Giving an agent a single broad, underspecified instruction and hoping it infers the right scope, a common source of AI slop.",0,[1233,1025,1026,1027]],["Iterative Refinement Loop","The cycle of prompting, reviewing output, and re-prompting with corrections until a result is acceptable."],["Task Specification Document","A written brief that pins down requirements, constraints and acceptance criteria before an agent starts work.",0,[1282,1084,1284,1413]],["Agent-Generated PR Description","A summary of a change, written by the agent that made it, meant to give a human reviewer enough context to review efficiently.",0,[2237]],["Diff Review","The practice of reading exactly what an agent changed, line by line, rather than trusting its summary of the change.",0,[656,716,1052,1597]],["Slash Command","A short, named instruction, like /test or /deploy, that triggers a predefined workflow inside an AI coding tool.",0,[42,88,316,1354]],["Escape Hatch","A manual override that lets a developer step in and take direct control when an agent is stuck or going the wrong way."],["Repo Map","A condensed representation of a codebase's structure that an agent uses to navigate without loading every file into context."],["Problem Framing","Restating a vague ask as a specific, falsifiable problem before any code, human-written or AI-generated, gets written.",0,[256,900,1150,1164]],["Essential Complexity","The difficulty that comes from the problem domain itself, which no tool, language, or AI assistant can remove, only manage.",0,[1650,1270]],["Accidental Complexity","Difficulty introduced by the tools, process, or implementation choices around a problem rather than the problem itself, and the first thing worth cutting.",0,[1650,1269]],["XY Problem","Asking for help with a proposed solution Y instead of the actual problem X, which sends a human collaborator or an AI assistant confidently down the wrong path.",0,[900,1150,1164,1165]],["Steel Thread","The thinnest possible path through every layer a system needs, built first to prove the architecture holds before any one layer is fleshed out.",0,[991,1057,1487,1666]],["Vertical Slice","A cut through a feature that touches every layer it needs, from interface to data, delivering one complete demoable unit rather than one finished layer.",0,[186,187,426,2081]],["Intention-Revealing Name","A name chosen precisely enough to explain why a thing exists without a comment, which matters doubly when an AI agent is reading the codebase cold for context.",0,[568,1567,1979]],["Semantic Diffusion","The gradual loosening of a precise term's meaning as more people and systems reuse it loosely, until the word stops carrying reliable information.",0,[508,780,1074,1560]],["Problem Statement","A short written framing of what is wrong, for whom, and why it matters, used to align humans and AI agents before anyone starts proposing solutions.",0,[622,2391,900,1150]],["Happy Path","The sequence of steps a system takes when every input is valid and every dependency behaves, the first thing built and the last thing that should be trusted.",0,[2013,1467,1961]],["Edge Case","An input or condition at the boundary of what a system was designed to handle, where the interesting bugs live.",0,[784,610,868]],["Non-Goal","An explicit written statement of what a piece of work will not attempt, used to stop scope quietly drifting back in.",0,[210]],["Definition of Ready","The checklist a piece of work must satisfy before it is pulled into active development.",0,[1256,1281]],["Definition of Done","The checklist a piece of work must satisfy before it counts as finished, distinct from merely coded.",0,[1256,1280]],["Acceptance Criteria","The specific, testable conditions a piece of work must meet to be accepted, written before implementation begins.",0,[1262,1285]],["Given-When-Then","A three-part structure for a scenario, starting state then action then expected outcome, precise enough for a human or an AI agent to implement and test against."],["Specification by Example","Defining a requirement through concrete worked examples rather than abstract prose, leaving no room for implementer and reviewer to interpret it differently.",0,[1084,1262,1413,2240]],["INVEST Criteria","A checklist for a well-formed unit of work, independent, negotiable, valuable, estimable, small, testable, used to catch stories that are too vague or too large to build in one pass.","INVEST",[1282]],["User Story","A short description of a feature from the perspective of the person who wants it, used to keep a requirement anchored to a real need rather than an implementation.",0,[159,1287]],["Story Splitting","Breaking a unit of work too large to estimate or ship into smaller pieces that are each independently valuable on their own.",0,[1481,159,1286]],["Jobs to Be Done","A framing that asks what outcome a user is really hiring a feature to accomplish, used to avoid building the literal ask instead of the underlying need."],["North Star Metric","The single measure a team optimises toward, used to resolve competing feature requests without relitigating priorities every time.",0,[478,760,2137,75]],["Working Backwards","Writing the user-facing description of a finished feature before building it, to force clarity on what done actually looks like.",0,[2284]],["Tracer Bullet","A quick, disposable implementation built to test whether an approach is viable end-to-end, discarded once the question is answered.",0,[2435,467,2384]],["Walking Skeleton","A minimal, deployable implementation of every architectural piece, wired together but doing almost nothing, built first so integration risk surfaces early.",0,[1493]],["Spike","A time-boxed investigation whose output is a decision or a piece of knowledge, not shippable code."],["Proof of Concept","A throwaway build made to test whether an idea is technically feasible, never intended to reach production.","POC",[701]],["Minimum Viable Product","The smallest version of a product that lets a team test its core hypothesis with real users.","MVP",[1296,602]],["Minimum Lovable Product","A deliberate step up from an MVP that ships enough polish to earn genuine user affection, not just validate a hypothesis.",0,[1295,602]],["Scope Creep","The uncontrolled growth of a piece of work's requirements after it has already started, usually one small addition at a time.",0,[1167,2417]],["Gold Plating","Adding unrequested refinement or extra features beyond what was asked for, burning time the plan never allocated."],["Analysis Paralysis","Being unable to move forward because the search for the perfect option has replaced the decision to pick a good one.",0,[829,265,695,699],0,265],["Premature Optimisation","Tuning performance before profiling shows it matters, at the cost of clarity and time better spent elsewhere.",0,[1604]],["Overengineering","Building more flexibility, abstraction, or infrastructure than the problem currently warrants."],["Underengineering","Building less structure than a problem needs, leaving a system unable to absorb the change it already knows is coming."],["Cargo Cult Programming","Copying a pattern or practice because it worked somewhere else, without understanding why it worked or whether the reasons apply here.",0,[1083,2345,2346,2347]],["Golden Hammer","Reaching for one familiar tool or pattern for every problem regardless of fit, because it is the one the team or the AI assistant already knows well.",0,[428,714,2230]],["Not Invented Here","Rejecting a perfectly good external solution in favour of building an equivalent in-house, usually at needless cost.","NIH"],["Connascence","A measure of how strongly two pieces of code must agree for the system to keep working, used to judge coupling by what changing one side forces on the other rather than by counting dependencies.",0,[478,1314]],["Temporal Coupling","A dependency between components that only holds if one runs before, after, or during another, invisible in the code and only visible at runtime.",0,[1314,1342]],["Leaky Abstraction","An abstraction that hides its implementation right up until the implementation's quirks, limits, or failure modes force their way through anyway.",0,[2412,1606,2266]],["Invariant","A condition about a system's state that must hold true no matter what operation just ran against it, and the thing most worth protecting when refactoring.",0,[2439,1310,1388,1396]],["Design by Contract","Specifying a component's obligations as explicit preconditions, postconditions, and invariants, so a caller and an implementer, human or AI, can agree on correctness without reading each other's code.",0,[1309,1317,1318,1656]],["Information Hiding","Exposing only what a component's callers need and concealing every decision that might change, so that change stays local instead of rippling outward.",0,[307,332]],["Architectural Fitness Function","An automated check that continuously measures whether a system still satisfies an architectural property its designers care about, run like a test but scored against a quality attribute rather than a behaviour.",0,[478,2283,1328,1344]],["One-Way Door Decision","A decision that is expensive or impossible to reverse once made, and therefore worth slowing down for, in contrast to one a team can simply walk back.",0,[1329,248]],["Coupling","The degree to which one part of a system depends on the internal detail of another, and the main variable an architect is spending their whole career trying to reduce.",0,[58,1306,1323,1347]],["Cohesion","The degree to which the responsibilities inside one module belong together, judged by whether they would all need to change for the same reason.",0,[540]],["Encapsulation Boundary","The line drawn around a component past which its internal state and decisions cannot be reached directly, only through its declared interface.",0,[1531,1543,1331,1332]],["Precondition","A condition that must be true before an operation runs, and whose violation is the caller's fault, not the callee's.",0,[60,1310]],["Postcondition","A condition guaranteed to be true after an operation completes successfully, forming half of the contract a caller can rely on.",0,[1310]],["Contract-First Design","Writing and agreeing an interface's shape and behaviour before either side implements it, so integration is a matter of conformance rather than negotiation.",0,[1656,2222,1310,1320]],["Consumer-Driven Contract","An interface specification authored from what its actual consumers need rather than what its provider finds convenient to expose.",0,[1788,1798,1814,1656]],["API Surface Area","Everything a component exposes that another component could come to depend on, and therefore everything that constrains how freely it can later change.",0,[1655,296,901]],["Public Interface","The part of a component explicitly offered to callers, distinguished from implementation detail by the promise that it will keep working across internal changes."],["Postel's Law","The design guideline to be conservative in what a component sends and liberal in what it accepts, a trade-off increasingly questioned since permissive parsing is itself a source of hidden coupling.",0,[1314]],["Principle of Least Astonishment","The guideline that a component should behave the way a reasonable caller would expect, so that surprise itself counts as a design defect.",0,[1793,2006]],["Emergent Design","Architecture that takes shape through a sequence of small, evidence-based decisions rather than being fixed in advance, favoured when the problem is not yet well understood."],["Big Design Up Front","Committing to a detailed architecture before writing code against real feedback, useful when a mistake would be very costly and risky when the domain is still being learned.",0,[233,236,2011]],["Just Enough Architecture","Deciding only the structural choices that are expensive to reverse now, and deliberately deferring the rest until more is known.",0,[307,1348,1349,1351]],["Architectural Runway","The amount of already-built platform capability available before a team's near-term feature plans would outrun what the architecture currently supports.",0,[2283,1312,1344]],["Two-Way Door Decision","A decision cheap enough to reverse that a team should make it quickly rather than spend one-way-door levels of deliberation on it.",0,[1313,248]],["Architecturally Significant Requirement","A requirement whose satisfaction depends on the shape of the whole system rather than one component, and therefore has to be settled before detailed design starts.",0,[1429,2256,2394]],["System Boundary","The line separating what a system is responsible for from what it treats as an external dependency it does not control.",0,[1531,1543,1316,1332]],["Deployment Boundary","The line separating pieces of a system that are built, versioned, and released independently from pieces that ship together as one unit.",0,[1696,2069,2091,2092]],["Stable Dependencies Principle","The guideline that a component should only depend on components at least as stable as itself, so that volatile code never gets depended on by code that can't afford to change.",0,[1334,1685,2124,2125]],["Acyclic Dependencies Principle","The guideline that the dependency graph between components must never contain a cycle, because a cycle forces every component in it to be built, tested, and released as one unit.",0,[1333,1685,2124,2125]],["Common Closure Principle","The guideline that classes likely to change for the same reason belong in the same component, so one change touches one release unit instead of several.",0,[191,1422,115,193]],["Stream-Aligned Team","A team structured around one continuous flow of work to a segment of the business, with everything it needs to ship end to end without waiting on another team.",0,[466,1031,1476,1695]],["Platform Team","A team that builds and runs the self-service capabilities other teams build on, judged by how much friction it removes rather than by features it ships directly to users.",0,[774,17,18,761]],["Enabling Team","A team of specialists that helps other teams close a capability gap temporarily, without taking ongoing ownership of the thing it helped build."],["Complicated-Subsystem Team","A team formed around one piece of a system that needs deep specialist knowledge to build or change safely, insulating other teams from that complexity."],["Team Cognitive Load","The amount a team can reasonably hold in mind about the systems it owns, used as a hard constraint on how much scope a team should be handed.",0,[242,260,715]],["Inverse Conway Manoeuvre","Deliberately restructuring teams to match the architecture a system is meant to have, on the expectation that the system's structure will end up mirroring the team's anyway.",0,[2427]],["Structural Coupling","A dependency created by the physical or organisational placement of code, such as a shared repository or deployment pipeline, that constrains change independent of any logical relationship between the parts.",0,[1399,1307,1314]],["Interface Stability","How rarely a component's public contract changes, and therefore how safely other components can build on it without expecting to be broken."],["Architectural Smell","A recurring structural pattern that is not a bug on its own but reliably precedes maintainability or scaling problems as a system grows.",0,[1426,2283,1312,1328]],["Boundary Object","A shared artefact, such as a schema or an event definition, that lets two teams or systems coordinate across a boundary without either needing to understand the other's internals.",0,[1531,1543,1316,1331]],["Modular Monolith","A single deployable application internally organised into strictly bounded modules, chosen to get most of microservices' separation of concerns without paying their operational cost.",0,[1347,413,477]],["Distributed Monolith","A system split into separately deployed services that must still be deployed together to work safely, combining the operational cost of distribution with the coupling of a monolith.",0,[1314,1346,1808,1907]],["Hexagonal Architecture","A style that puts a system's core logic at the centre and reaches the outside world only through ports and adapters, so the core can be tested and reused without a database, UI, or network attached.",0,[1356,307,1327,1460]],["Event-Driven Architecture","A style where components communicate by publishing facts about what happened rather than calling each other directly, decoupling producers from whichever consumers, present or future, react to them.","EDA",[1555,2367,307,1327]],["Micro-Frontends","An architecture that splits a web application's UI into independently built and deployed pieces owned by separate teams, mirroring the service boundaries already used on the backend.",0,[1368,1369,1629,2323]],["Cell-Based Architecture","A style that partitions a system into self-contained, identically structured units, each handling a subset of traffic end to end, so a failure or overload in one cell cannot spread to another.",0,[1376,2191,307,1327]],["Choreography","An event-driven coordination style where each participant reacts to events and emits its own, with no central controller and the overall process only visible by tracing the events.",0,[550,545,1353],"ux-stagger",550],["Orchestration","A coordination style where a central controller explicitly calls each participant in sequence and holds the process state, trading the flexibility of choreography for one place to see and change the whole flow.",0,[550,1352,1238,1365]],["Command Query Responsibility Segregation","Splitting a system's write path from its read path into separate models, so each can be shaped, scaled, and optimised for what it actually needs to do instead of compromising on one shared model.","CQRS",[1361,42,88,316]],["Event Sourcing","Storing every state change a system has ever made as an ordered log of events, and deriving current state by replaying them, rather than storing only the latest state and discarding how it got there.",0,[1555,1364]],["Onion Architecture","A style that arranges a system in concentric layers with dependencies only pointing inward toward the domain core, closely related to hexagonal architecture but framed around layers rather than ports.",0,[1348,307,1327,1460]],["Space-Based Architecture","A style built around an in-memory data grid shared by processing units, used to remove the database as a shared bottleneck when a system needs to scale linearly under extreme load.",0,[307,1327,1460,1464]],["Broker Topology","An event-driven arrangement where a message broker sits between every producer and consumer, so no service needs to know who else is listening.",0,[1787,1359]],["Mediator Topology","An event-driven arrangement where a central mediator receives events and decides which downstream steps to trigger, giving up some decoupling in exchange for a visible, controllable process.",0,[1358]],["Command Bus","An in-process or distributed channel that routes a command to exactly one handler responsible for carrying it out, keeping the sender ignorant of how or where it's fulfilled.",0,[42,88,316,1265]],["Command-Query Separation","The narrower, method-level cousin of CQRS: any single operation should either change state or return data, never both, so a caller never needs to guess whether calling it is safe to skip.",0,[1354,42,88,316]],["Read Model","A data representation built and maintained purely to answer queries efficiently, kept separate from the write model so read performance never has to compromise write correctness."],["Materialised View","A precomputed, stored result of a query or event stream, kept up to date incrementally so reads never have to redo the underlying computation.",0,[1775]],["Event Snapshotting","Periodically saving an event-sourced aggregate's current state so replay can resume from that point instead of reprocessing its entire history.",0,[1355,1396]],["Process Manager","A stateful component that tracks a long-running business process across multiple services and decides what should happen next as each step's events arrive, the orchestration-flavoured cousin of a saga.",0,[480,1353,861,39]],["Claim Check Pattern","Passing a lightweight reference to a large payload through a message system instead of the payload itself, with the payload retrieved separately by whoever actually needs it.",0,[2073,1659,2241,2252]],["Ambassador Pattern","A helper process deployed alongside a service that handles cross-cutting network concerns, such as retries or authentication, on its behalf so the service's own code stays free of them.",0,[1555]],["Shell Application","The host application in a micro-frontend architecture responsible for loading, placing, and coordinating the independently deployed pieces owned by other teams.",0,[1350,1398,1992,2366]],["Module Federation","A build-time and runtime technique that lets independently built JavaScript bundles share code and load each other's modules at runtime, commonly used to compose micro-frontends without bundling everything together.",0,[1350,1621,2085,1593]],["Edge-Side Includes","A markup instruction that tells a proxy or CDN to assemble a page from separately cached fragments at request time, composing content closer to the user than the origin server.","ESI",[2009,868]],["Server-Driven UI","A pattern where the backend sends a description of what to render rather than data alone, letting a client update its interface without a client release.",0,[1226,1320,1412,2224]],["Polyglot Persistence","Using a different database technology for each service based on that service's own access patterns, instead of forcing every service onto one shared database engine.",0,[2344,2379]],["Database per Service","Giving each service exclusive ownership of its own datastore, so no service can be coupled to another through a shared schema.",0,[1314,1755,1768,1776]],["Shared Database Anti-Pattern","Multiple services reading and writing the same datastore directly, which quietly recreates a single point of coupling that service boundaries were meant to remove.",0,[1314,1755,1768,1776]],["Chassis Pattern","A shared scaffolding of cross-cutting concerns, logging, health checks, configuration, tracing, that every service in a fleet is built on so that operational behaviour stays consistent without each team reinventing it."],["Cellular Isolation","The property, in a cell-based architecture, that a failure inside one cell cannot consume resources from or degrade any other cell.",0,[1351,1705]],["Composable Architecture","A style built from independently swappable, well-defined capabilities that can be assembled and reassembled to serve new use cases without rebuilding the underlying pieces.",0,[307,1327,1460,1464]],["Event-Carried State Transfer","An event style where the event itself carries enough of the relevant state for a consumer to act without calling back to the producer, trading larger events for fewer synchronous dependencies.",0,[2008]],["Dumb Pipes, Smart Endpoints","A microservices design guideline that keeps the messaging layer doing plain transport while all business logic and routing decisions live in the services at either end.",0,[1642,1659,953,1102]],["Self-Contained System","A service style where each unit owns its own UI, business logic, and data end to end, integrating with siblings only through asynchronous events or loose UI composition, never a shared database.",0,[2202,259,1099]],["Fat Event","An event payload that includes the full relevant state of what changed, letting consumers act without a follow-up call at the cost of larger messages and duplicated data."],["Thin Event","An event payload that carries only an identifier and a change notification, keeping messages small at the cost of forcing consumers to call back for the detail."],["Feature-Sliced Architecture","Organising a frontend codebase by user-facing feature rather than by technical layer, so the code for one capability lives together and can be understood, changed, or removed as a unit.",0,[307,1327,1460,1464]],["Actor Model","A concurrency style where independent actors hold private state and communicate only by sending each other asynchronous messages, avoiding shared-memory locking entirely.",0,[1385]],["Virtual Actor","An actor whose lifecycle, activation, placement, and garbage collection are managed transparently by the runtime, so callers can address it as if it always exists without managing where or whether it's currently running.",0,[918,1518,2064,1384]],["Ubiquitous Language","A vocabulary shared word-for-word between domain experts and the code itself, so a term means exactly one thing in conversation, in the class names, and in the tests.",0,[1411,1387,1389,769]],["Bounded Context","An explicit boundary inside which a model and its ubiquitous language stay consistent, drawn deliberately at the point where the same word starts to mean something different.",0,[1391,1420,1386,1390]],["Aggregate Root","The single entity through which every change to an aggregate must pass, enforcing the aggregate's invariants so no part of it can be modified in a way that leaves it inconsistent.",0,[1396,1309]],["Domain Event","A record of something that happened in the business domain that domain experts actually care about, named in the past tense and expressed in the ubiquitous language rather than technical terms.",0,[1411,1386,1390,2011]],["Event Storming","A facilitated workshop where participants map a business process as a timeline of domain events on a wall, surfacing bounded contexts, aggregates, and gaps in understanding faster than documents would.",0,[1421,1389,1387,1396]],["Context Mapping","The practice of diagramming how a system's bounded contexts relate to and depend on each other, making explicit which team is upstream of which and what kind of relationship that creates.",0,[1387,1420,1405,1406]],["Anaemic Domain Model","A domain model made of data-only objects with no behaviour, where all the logic lives in separate service classes, forfeiting most of what object-oriented domain modelling was meant to buy.",0,[1401,2011,2205]],["Core Domain","The part of a business that is genuinely differentiating and worth the organisation's best modelling effort, as opposed to the parts that are necessary but generic.",0,[2011,2205]],["Entity","A domain object defined by a persistent identity that continues across changes to its attributes, distinguished from a value object by the fact that it can change and still be the same thing.",0,[1395]],["Value Object","A domain object defined entirely by its attributes rather than an identity, immutable, and interchangeable with any other instance holding the same values.",0,[1394,1396,1397,1401]],["Aggregate","A cluster of entities and value objects treated as one consistency boundary, loaded, saved, and locked together so that the invariants spanning them can be enforced in one place.",0,[1388,1309,1395,1555]],["Domain Service","A piece of domain logic that doesn't naturally belong to any single entity or value object, typically because it coordinates across more than one of them.",0,[1395,1555,2011,2205]],["Application Service","A thin layer that coordinates a use case, orchestrating domain objects, repositories, and transactions, while deliberately containing no business rules of its own.",0,[1399,1368,1992,2366]],["Repository","An abstraction that gives the domain model the illusion of an in-memory collection of aggregates, hiding the persistence mechanism actually being used behind it.",0,[1396,771,1250,1342]],["Factory","An object or method responsible for constructing a complex aggregate in a valid state, used when the construction logic is complicated enough to not belong on the aggregate's own constructor.",0,[1396]],["Rich Domain Model","A domain model where entities and value objects carry their own behaviour alongside their data, the deliberate opposite of an anaemic domain model.",0,[1392,1395,2449,2011]],["Subdomain","A distinct area of the business's problem space, mapped separately from bounded contexts, which describe the solution space instead.",0,[1403,1404,1387,1416]],["Supporting Subdomain","A subdomain necessary to the business but not differentiating, worth building well but not worth the organisation's deepest modelling investment.",0,[1402,1404,31,776]],["Generic Subdomain","A subdomain that is not specific to the business at all and is best solved by buying or reusing an existing solution rather than building one.",0,[1402,88,1403]],["Shared Kernel","A context mapping relationship where two teams deliberately share a small piece of model and code, accepting that either side changing it requires the other's agreement.",0,[1391]],["Customer-Supplier","A context mapping relationship where a downstream team's needs are formally negotiated with and prioritised by an upstream team, giving the downstream side real influence over the upstream roadmap.",0,[1391,707]],["Conformist","A context mapping relationship where a downstream team simply adopts an upstream model as-is, because it has no leverage to negotiate changes and translating would cost more than it's worth.",0,[1391]],["Open Host Service","A context mapping pattern where a bounded context publishes a well-defined protocol for others to integrate against, instead of negotiating a custom integration with each consumer.",0,[1387,1391,1409,2100]],["Published Language","A well-documented, shared data format used to translate between bounded contexts, often paired with an open host service so integrators have one stable contract to code against.",0,[1387,1408,769,2362]],["Partnership","A context mapping relationship where two teams' contexts are so interdependent that they succeed or fail together, and coordinate as equals rather than one deferring to the other.",0,[1391,2331]],["Domain Expert","A person with deep working knowledge of the business domain whose vocabulary and judgement the ubiquitous language and model are built from, not an engineer guessing on their behalf.",0,[1386,1389,1414,1418]],["Model-Driven Design","Building software so that the code is a direct, faithful expression of the domain model, rather than the model being a diagram kept separate from and drifting away from the implementation.",0,[2367,1226,1320,1349]],["Specification Pattern","A domain object that encapsulates a business rule for whether another object satisfies some condition, so the rule can be named, tested, and reused instead of scattered across conditionals.",0,[1084,1262,1284,2240]],["Domain Storytelling","A modelling technique where a domain expert narrates a business process while a facilitator sketches it as a sequence of actors, actions, and work objects, producing a shared picture instead of a shared document.",0,[1411,2011,2205]],["Example Mapping","A facilitation technique that turns a single requirement into concrete examples, rules, and open questions on coloured cards, surfacing ambiguity before a single line of code is written.",0,[1284,2167]],["Strategic Design","The DDD activity of identifying bounded contexts, subdomains, and the relationships between them, done before any single context's internal model is worked out.",0,[1387,1402,1555]],["Tactical Design","The DDD activity of modelling the inside of a single bounded context, entities, value objects, aggregates, and services, once its boundary is already settled.",0,[1387,1395,1396]],["Knowledge Crunching","The collaborative, iterative process of a team and its domain experts refining a model together until it captures the domain's real complexity rather than a first guess at it.",0,[1411,1113,1881]],["Deep Model","A domain model that has been reworked past its first obvious shape until it captures the domain's real underlying structure and rules, as opposed to a shallow model that only mirrors surface vocabulary.",0,[1588]],["Context Map","The diagram produced by context mapping, showing every bounded context in a system and the specific relationship pattern connecting each pair.",0,[1387,1391,37,282]],["Big Picture Event Storming","The broadest form of event storming, run across an entire business process or system to surface bounded context boundaries and where teams disagree about vocabulary.",0,[1390,1387,887,2182]],["Closure of Operations","A design guideline for value objects: an operation on a value object should return another value object of the same type, so operations can be chained without leaving the type.",0,[1395,1646,191,1335]],["Side-Effect-Free Function","A domain operation that returns a result without changing any state, safe to call repeatedly or compose with other operations without worrying about ordering.",0,[963]],["Scalability","A system's ability to handle growth in load by adding resources, judged separately for whether that growth is handled by adding more machines or bigger ones.",0,[1428]],["High Availability","A design goal of keeping a system usably up despite individual component failures, achieved through redundancy rather than by making any single component unbreakable.",0,[2207,627,800]],["Maintainability","How easily a system can be understood, fixed, and changed by someone who didn't write it, the quality attribute most directly traded away under delivery pressure.",0,[1344,2417]],["Durability","A guarantee that once data is confirmed written, it will survive failures, distinct from availability, which is about whether the system can be reached at all right now."],["Elasticity","A system's ability to automatically scale resources up and down to match current demand, distinguished from scalability by the automatic, bidirectional response rather than the raw ceiling.",0,[1424]],["Non-Functional Requirement","A requirement about how a system behaves, its performance, security, or reliability, rather than what it does, and one that's easy to leave unstated until it's violated.","NFR",[1432,1459,1330,2256]],["Five Nines","Shorthand for 99.999% availability, translating to roughly five minutes of downtime a year, used as a benchmark that most systems neither need nor can afford.",0,[702,727]],["Graceful Degradation","A design approach where a system sheds non-essential functionality under stress or partial failure so that its core function keeps working instead of the whole system going down.",0,[846,1679],0,846],["Reliability","The probability that a system performs its intended function correctly over a given period, distinct from availability, which only asks whether it's reachable.",0,[253,1429,1452,1796]],["Resilience","A system's ability to absorb failure and keep operating, or recover quickly, rather than being designed to never fail in the first place.",0,[1442,1969,2195,2217]],["Testability","How easily a system's correctness can be verified through automated tests, shaped heavily by how cleanly its components are decoupled from each other."],["Portability","How easily a system can be moved to run on a different platform, infrastructure provider, or environment without being rewritten.",0,[1177]],["Interoperability","How easily a system can exchange data and work correctly with other systems it wasn't originally built alongside."],["Extensibility","How easily new capability can be added to a system without modifying its existing, already-working code.",0,[1438,1737]],["Modifiability","How easily a system can be changed, distinguished from extensibility by covering changes to existing behaviour, not just the addition of new behaviour.",0,[1437]],["Usability","How easily the intended users of a system can achieve their goals with it, measured by effort and error rate rather than by whether the feature technically exists.",0,[209,708,709,713]],["Recoverability","How quickly and completely a system can be restored to correct operation after a failure, the quality attribute Recovery Time and Recovery Point Objectives are set against.",0,[2068]],["Fault Tolerance","A system's ability to keep operating correctly even while one or more of its components have actually failed, as opposed to merely recovering after the fact.",0,[2194,2205]],["Robustness","A system's ability to keep working correctly when given unexpected or invalid input, as opposed to resilience, which is about surviving failure in its own components.",0,[1433]],["Auditability","How completely and reliably a system can reconstruct who did what and when, a quality attribute that has to be designed in rather than bolted on after the fact."],["Composability","How easily a system's parts can be combined in new ways to build capability its designers didn't explicitly plan for."],["Evolvability","How cheaply a system can absorb requirements nobody has thought of yet, the quality attribute that most determines a system's cost years after launch rather than at launch."],["Operability","How easily a system can be run day to day, deployed, monitored, and kept healthy, by the people responsible for keeping it up."],["Deployability","How easily and safely a new version of a system can be released into production, independent of how good the change itself is."],["Headroom","The gap between a system's current load and the load at which it starts to degrade, and the margin every capacity decision is really trying to buy."],["Carbon Efficiency","A system's computational output per unit of energy consumed, an increasingly explicit quality attribute as carbon-aware scheduling and reporting become standard architectural inputs.",0,[762]],["Iron Triangle","The trade-off between scope, speed, and quality in delivering a system, on the premise that improving any one without cost usually means giving up one of the other two.",0,[377]],["Latency Budget","The maximum time allowed for a request end to end, allocated in advance across the services and hops it will pass through so no one component can silently consume the whole budget.",0,[2142,567,1876,1933]],["Mean Time Between Failures","The average time a system runs between one failure and the next, a reliability measure distinct from how quickly it recovers once a failure happens.","MTBF",[478,1432,1018,1453]],["Mean Time to Detect","The average time between a failure occurring and someone or something noticing it, the clock that starts before mean time to recovery even begins.","MTTD",[1452,344]],["Fail-Safe Default","A default behaviour chosen so that if something goes wrong or is left unconfigured, the system fails in the least harmful direction rather than the most convenient one.",0,[1072,246,1071,1956]],["Fail-Open","A failure mode where, if a control such as an authorisation or validation check breaks, the system defaults to allowing the request through rather than blocking it.",0,[1072,857]],["Fail-Closed","A failure mode where, if a control such as an authorisation or validation check breaks, the system defaults to blocking the request rather than letting it through.",0,[1072]],["Total Cost of Ownership","The full cost of a system over its lifetime, build, run, and eventual replacement, used to compare options that look cheap only if you stop counting at launch.","TCO"],["Time to Market","How quickly a capability can be delivered to users, a quality attribute of the delivery process itself that regularly trades off against a system's other -ilities."],["Quality Attribute Scenario","A structured way of specifying a non-functional requirement as a stimulus, a source, an environment, and a measurable response, precise enough to test rather than argue about.",0,[1429,1460,2028,741]],["Architecture Trade-off Analysis Method","A structured workshop method for evaluating an architecture against multiple competing quality attribute scenarios, surfacing exactly where two desired qualities conflict.","ATAM",[1459,307,1327,1348]],["Degraded Mode","The reduced but still functioning operating state a system enters as a deliberate result of shedding load or non-essential functionality under stress."],["Hydration","The process by which client-side JavaScript attaches event handlers and state to server-rendered HTML already sitting in the DOM.",0,[1483,1503,1474]],["Incremental Static Regeneration","A rendering strategy where static pages are pre-built but silently rebuilt in the background after a set time or on demand, without a full redeploy.","ISR",[1890,2259,1477]],["Islands Architecture","A page-building approach where most of the page is static HTML and only small, independent components, or islands, are hydrated with interactivity.",0,[888,307,1327,1348]],["Core Web Vitals","Google's named set of user-experience metrics, covering loading, responsiveness and visual stability, used to score real-world page quality.",0,[1466,1470,1471]],["Interaction to Next Paint","A Core Web Vitals metric measuring the delay between a user's interaction and the next time the browser visibly updates in response.","INP",[1465,0,1,5]],["Critical Rendering Path","The sequence of steps a browser must complete, from receiving HTML to painting pixels, before a page becomes visible.",0,[470,1529,1534,1890]],["Service Worker","A background script a browser runs separately from the page, used to intercept network requests, cache assets and enable offline behaviour.",0,[1491,1666,1689,1488]],["WebAssembly","A low-level binary instruction format that runs in the browser at near-native speed, letting languages other than JavaScript execute on the web.","Wasm",[1683]],["Largest Contentful Paint","A Core Web Vitals metric marking when the largest visible content element finishes rendering.","LCP",[1465,1472,1466]],["Cumulative Layout Shift","A Core Web Vitals metric that scores how much visible content unexpectedly moves around as a page loads.","CLS",[1465,169,2265,399]],["First Contentful Paint","The moment the browser renders the first piece of DOM content, marking the end of a blank screen.","FCP",[1470,1466]],["Time to First Byte","The delay between requesting a page and the browser receiving the first byte of the response.","TTFB"],["Progressive Hydration","Hydrating parts of a page in priority order rather than all at once, so interactive elements become usable sooner.",0,[212,459,603,845]],["Resumability","A rendering approach where the client picks up a serialised copy of the server's execution state instead of re-running application logic to hydrate."],["Streaming Server-Side Rendering","Sending rendered HTML to the browser in chunks as it becomes ready, instead of waiting for the whole page to finish rendering."
