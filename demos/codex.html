<!doctype html>
<html lang="en" data-ck="ux">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Codex Explorer</title>
<meta name="description" content="An illuminated reading room for two glossary codexes — 62 books, 2,455 terms.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&display=swap"></noscript>
<style>
/* ============ tokens ============ */
:root{
  --paper:#FAF7F0; --card:#FDFBF6; --tint:#F4EEE2;
  --ink:#211C17; --ink2:#574C41; --ink3:#6E6154;
  --rule:#DCD2C0; --rule2:#EBE3D4; --shadow:rgba(60,44,26,.09);
  --rub:#8C2F23; --rub2:#A24030; --rubfaint:rgba(140,47,35,.10);
  --mark:#F6DFAF; --glow:rgba(140,47,35,.16);
  /* spacing scale */
  --s1:4px; --s2:8px; --s3:12px; --s4:18px; --s5:26px; --s6:38px; --s7:56px; --s8:80px;
  --bar:56px; --rail:272px; --measure:68ch;
  --tex1:rgba(0,0,0,.014); --tex2:rgba(0,0,0,.011);
  --tex-a:rgba(140,47,35,.035); --tex-b:rgba(90,64,32,.045); --blend:multiply;
}
html[data-ck="ai"]{ --rub:#2A4A6E; --rub2:#35597F; --rubfaint:rgba(42,74,110,.10);
  --mark:#D8E6F4; --glow:rgba(42,74,110,.16); --tex-a:rgba(42,74,110,.035); }
html[data-theme="night"]{
  --paper:#181410; --card:#1F1913; --tint:#241D16;
  --ink:#EFE7D6; --ink2:#BCAE97; --ink3:#A0937E;
  --rule:#3A3027; --rule2:#2C241C; --shadow:rgba(0,0,0,.4);
  --rub:#E08A6A; --rub2:#CF6E50; --rubfaint:rgba(224,138,106,.13);
  --mark:#4A3A22; --glow:rgba(224,138,106,.22);
  --tex1:rgba(255,255,255,.016); --tex2:rgba(255,255,255,.012);
  --tex-a:rgba(255,196,120,.055); --tex-b:rgba(255,170,90,.035); --blend:screen;
}
html[data-theme="night"][data-ck="ai"]{ --rub:#8FBBE0; --rub2:#79A7CE; --rubfaint:rgba(143,187,224,.13);
  --mark:#20364A; --glow:rgba(143,187,224,.2); --tex-a:rgba(150,200,255,.05); }
@media (prefers-color-scheme:dark){
  html:not([data-theme="day"]){
    --paper:#181410; --card:#1F1913; --tint:#241D16;
    --ink:#EFE7D6; --ink2:#BCAE97; --ink3:#A0937E;
    --rule:#3A3027; --rule2:#2C241C; --shadow:rgba(0,0,0,.4);
    --rub:#E08A6A; --rub2:#CF6E50; --rubfaint:rgba(224,138,106,.13);
    --mark:#4A3A22; --glow:rgba(224,138,106,.22);
    --tex1:rgba(255,255,255,.016); --tex2:rgba(255,255,255,.012);
    --tex-a:rgba(255,196,120,.055); --tex-b:rgba(255,170,90,.035); --blend:screen;
  }
  html:not([data-theme="day"])[data-ck="ai"]{ --rub:#8FBBE0; --rub2:#79A7CE; --rubfaint:rgba(143,187,224,.13);
    --mark:#20364A; --glow:rgba(143,187,224,.2); --tex-a:rgba(150,200,255,.05); }
}
/* ============ base ============ */
*{box-sizing:border-box}
html{background:var(--paper);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important;animation-iteration-count:1!important}}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Spectral,"Iowan Old Style",Georgia,"Times New Roman",serif;
  font-size:17px;line-height:1.62;font-weight:400;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;mix-blend-mode:var(--blend);
  background:
   radial-gradient(1100px 720px at 12% -8%, var(--tex-a), transparent 62%),
   radial-gradient(900px 640px at 102% 12%, var(--tex-b), transparent 60%),
   repeating-linear-gradient(0deg, var(--tex1) 0 1px, transparent 1px 3px),
   repeating-linear-gradient(90deg, var(--tex2) 0 1px, transparent 1px 4px);}
.z{position:relative;z-index:1}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--rub);text-decoration:none}
::selection{background:var(--mark);color:var(--ink)}
:focus-visible{outline:2px solid var(--rub);outline-offset:2px;border-radius:2px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ============ error overlay ============ */
#errbar{position:fixed;left:0;right:0;bottom:0;z-index:9999;display:none;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#ff6b5e;background:#1a0c0a;
  border-top:2px solid #ff6b5e;padding:8px 12px;max-height:32vh;overflow:auto;white-space:pre-wrap}
/* ============ top bar ============ */
.topbar{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--paper) 97%,transparent);
  backdrop-filter:blur(9px) saturate(1.1);-webkit-backdrop-filter:blur(9px);border-bottom:1px solid var(--rule)}
.bar-in{display:flex;align-items:center;gap:var(--s4);height:var(--bar);
  max-width:1240px;margin:0 auto;padding:0 var(--s5)}
.mark{display:flex;align-items:center;gap:9px;color:var(--ink);font-size:15px;font-weight:600;
  letter-spacing:.03em;white-space:nowrap;flex:0 0 auto}
.mark-orn{color:var(--rub);font-size:17px;line-height:1}
.mark b{font-weight:600}
.switch{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;flex:0 0 auto;background:var(--card)}
.switch button{padding:6px 13px;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);font-weight:600;transition:background .16s,color .16s;min-height:34px}
.switch button+button{border-left:1px solid var(--rule)}
.switch button:hover{background:var(--tint);color:var(--ink)}
.switch button[aria-selected="true"]{background:var(--rub);color:var(--paper)}
.searchwrap{position:relative;flex:1 1 auto;max-width:440px;display:flex;align-items:center}
.searchwrap .ic{position:absolute;left:11px;color:var(--ink3);font-size:15px;pointer-events:none}
#q{width:100%;height:36px;padding:0 34px 0 32px;background:var(--card);color:var(--ink);
  border:1px solid var(--rule);border-radius:3px;font-family:inherit;font-size:15px;
  transition:border-color .16s,box-shadow .16s}
#q::placeholder{color:var(--ink3);opacity:1}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;display:none}
#mq::-webkit-search-cancel-button,#mq::-webkit-search-decoration{-webkit-appearance:none;display:none}
#q:focus{outline:none;border-color:var(--rub);box-shadow:0 0 0 3px var(--rubfaint)}
#qclear{position:absolute;right:4px;width:28px;height:28px;color:var(--ink3);border-radius:3px;display:none}
#qclear:hover{color:var(--rub);background:var(--tint)}
.tbtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:3px;
  background:var(--card);color:var(--ink2);font-size:15px;transition:color .16s,border-color .16s,background .16s;flex:0 0 auto}
.tbtn:hover{color:var(--rub);border-color:var(--rub)}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}
.progress i{display:block;height:100%;width:0;background:var(--rub);opacity:.85;transition:width .1s linear}
/* crumb */
.crumb{position:sticky;top:var(--bar);z-index:55;background:color-mix(in srgb,var(--paper) 96%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--rule2)}
.crumb-in{max-width:1240px;margin:0 auto;padding:5px var(--s5);display:flex;align-items:center;gap:10px;
  font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);min-height:26px}
.crumb b{color:var(--rub);font-weight:600;letter-spacing:.11em}
.crumb .sep{opacity:.45}
/* ============ shell ============ */
.shell{max-width:1240px;margin:0 auto;padding:0 var(--s5);display:grid;
  grid-template-columns:var(--rail) minmax(0,calc(var(--measure) + 92px));
  gap:var(--s7);align-items:start;justify-content:center}
/* ============ rail ============ */
.rail{position:sticky;top:calc(var(--bar) + 32px);max-height:calc(100vh - var(--bar) - 46px);
  overflow-y:auto;overscroll-behavior:contain;padding:var(--s5) 0 var(--s6);scrollbar-width:thin}
.rail-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 var(--s3) var(--s2);
  border-bottom:1px solid var(--rule);margin-bottom:var(--s2)}
.rail-h .n{font-size:11px;color:var(--ink3);letter-spacing:.1em}
.rrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:9px;width:100%;text-align:left;
  padding:7px var(--s3) 7px 9px;border-radius:3px;position:relative;align-items:start;
  transition:background .16s,opacity .2s;color:var(--ink2)}
.rrow::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--rub);
  opacity:0;transform:scaleY(.3);transform-origin:center;transition:opacity .22s,transform .22s cubic-bezier(.2,.7,.3,1)}
.rrow:hover{background:var(--tint)}
.rrow[data-on="1"]{background:var(--tint);color:var(--ink)}
.rrow[data-on="1"]::before{opacity:1;transform:scaleY(1)}
.rnum{font-size:11.5px;color:var(--rub);font-weight:600;letter-spacing:.02em;text-align:right;
  padding-top:3px;font-variant-numeric:oldstyle-nums;opacity:.8}
.rrow[data-on="1"] .rnum{opacity:1}
.rtitle{display:block;font-size:14px;line-height:1.34;color:inherit}
.rrow[data-on="1"] .rtitle{font-weight:600}
.rdesc{display:block;font-size:12.5px;line-height:1.45;color:var(--ink3);font-style:italic;
  max-height:0;overflow:hidden;opacity:0;transition:max-height .22s ease,opacity .22s ease,margin .22s ease;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.rrow:hover .rdesc,.rrow:focus-visible .rdesc,.rrow[data-on="1"] .rdesc{max-height:52px;opacity:1;margin-top:3px}
.rcount{font-size:11px;color:var(--ink3);padding-top:4px;font-variant-numeric:tabular-nums}
.rrow[data-hit="0"]{opacity:.32}
.rcount[data-hit]{color:var(--paper);background:var(--rub);border-radius:9px;padding:1px 6px;font-weight:600;
  margin-top:2px;font-size:10.5px}
.rail-foot{padding:var(--s4) var(--s3) 0;border-top:1px solid var(--rule2);margin-top:var(--s4);
  font-size:12px;color:var(--ink3);font-style:italic;line-height:1.5}
/* ============ main ============ */
main{min-width:0;padding-bottom:var(--s8)}
.masthead{padding:var(--s7) 0 var(--s5);border-bottom:1px solid var(--rule)}
body.searching .masthead{display:none}
body.searching .rwrap{padding-top:var(--s5)}
.mast-orn{display:flex;align-items:center;gap:9px;margin-bottom:var(--s4);height:8px}
.mast-orn i{display:block;height:1px;width:46px;background:var(--rub);opacity:.55}
.mast-orn b{display:block;width:6px;height:6px;background:var(--rub);transform:rotate(45deg);opacity:.85}
.masthead h1{font-size:clamp(34px,4.4vw,50px);font-weight:600;letter-spacing:-.012em;line-height:1.06}
.masthead h1 em{font-style:italic;font-weight:400;color:var(--rub)}
.mast-sub{margin:var(--s3) 0 0;font-size:18px;color:var(--ink2);font-style:italic;max-width:56ch;line-height:1.55}
.mast-stats{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);margin-top:var(--s4);
  font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.mast-stats b{color:var(--rub);font-weight:600}
.mast-hint{margin-top:var(--s4);font-size:13.5px;color:var(--ink3);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
kbd{font:11.5px/1.6 ui-monospace,Menlo,monospace;border:1px solid var(--rule);border-bottom-width:2px;
  border-radius:3px;padding:1px 5px;color:var(--ink2);background:var(--card)}
/* book */
.book{padding:var(--s7) 0 var(--s6);border-bottom:1px solid var(--rule2);scroll-margin-top:calc(var(--bar) + 40px)}
.bhead{display:grid;grid-template-columns:70px minmax(0,1fr);gap:var(--s4);align-items:start}
.bnum{font-size:36px;line-height:.92;color:var(--rub);font-weight:400;text-align:right;
  letter-spacing:-.02em;padding-top:2px;opacity:.9}
.btitlerow{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;
  max-width:var(--measure);padding-right:2px}
.book h2{font-size:clamp(23px,2.5vw,29px);letter-spacing:-.011em;max-width:24ch}
.bcount{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.bdesc{margin:var(--s3) 0 0;font-size:16px;line-height:1.6;color:var(--ink2);max-width:62ch;font-style:italic}
.bdesc::first-letter{float:left;font-size:47px;line-height:.86;padding:5px 8px 0 0;color:var(--rub);
  font-style:normal;font-weight:600}
.btools{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;
  margin:var(--s4) 0 var(--s3);padding-left:calc(70px + var(--s4));
  max-width:calc(var(--measure) + 70px + var(--s4));box-sizing:content-box}
.az{display:flex;flex-wrap:wrap;gap:1px}
.az button{width:19px;height:22px;font-size:11px;color:var(--ink3);border-radius:2px;
  transition:color .14s,background .14s;text-transform:uppercase;letter-spacing:0}
.az button:disabled{opacity:.22;cursor:default}
.az button:not(:disabled):hover{background:var(--rub);color:var(--paper)}
.bbtns{display:flex;gap:var(--s2);margin-left:auto}
.minib{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  border:1px solid var(--rule);border-radius:3px;padding:5px 10px;background:var(--card);
  transition:color .16s,border-color .16s;min-height:30px;white-space:nowrap}
.minib:hover{color:var(--rub);border-color:var(--rub)}
.minib[aria-pressed="true"]{color:var(--rub);border-color:var(--rub);background:var(--rubfaint)}
.entries{padding-left:calc(70px + var(--s4))}
@media (max-width:1180px){.btools,.entries{padding-left:0}}
/* card = common region */
.card{background:var(--card);border:1px solid var(--rule2);border-radius:4px;
  padding:var(--s2) var(--s4) var(--s3);margin-bottom:var(--s4);box-shadow:0 1px 2px var(--shadow);
  max-width:var(--measure);position:relative}
.cardlet{position:absolute;left:-1px;top:-1px;background:var(--rub);color:var(--paper);
  font-size:10.5px;letter-spacing:.1em;font-weight:600;padding:2px 8px;border-radius:3px 0 4px 0}
.card.lettered{padding-top:var(--s5)}
.cardrange{position:absolute;left:0;top:-9px;background:var(--paper);color:var(--ink3);
  font-size:10px;letter-spacing:.14em;padding:0 8px 0 4px;line-height:1.6;white-space:nowrap}
.cardrange i{color:var(--rub);font-style:normal;margin-right:4px;opacity:.75}
.card{margin-top:var(--s5)}
.card:first-child{margin-top:var(--s3)}
/* entry */
.entry{border-top:1px solid var(--rule2)}
.entry:first-child{border-top:0}
.ehead{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;padding:9px 2px;
  transition:background .14s;border-radius:3px;min-height:40px}
.ehead:hover{background:var(--tint)}
.ehead:hover .hw{color:var(--rub)}
.hw{font-weight:600;font-size:16.5px;white-space:nowrap;color:var(--ink);transition:color .14s;letter-spacing:-.004em}
.acro{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--rub);
  border:1px solid var(--rubfaint);background:var(--rubfaint);border-radius:2px;padding:1px 5px;
  white-space:nowrap;position:relative;top:-1px}
.clause{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink3);font-size:15px}
.chev{flex:0 0 auto;color:var(--ink3);font-size:13px;width:14px;text-align:center;
  transition:transform .18s cubic-bezier(.2,.7,.3,1),color .14s}
.entry[data-open="1"] .chev{transform:rotate(45deg);color:var(--rub)}
.entry[data-open="1"] .hw{color:var(--rub)}
.entry[data-open="1"] .clause{display:none}
.ebody{overflow:hidden;height:0;transition:height .18s cubic-bezier(.22,.7,.3,1)}
.entry[data-open="1"] .ebody{height:auto}
.ebody-in{padding:0 2px var(--s4) 2px}
.def{margin:0;font-size:17.5px;line-height:1.62;color:var(--ink);max-width:66ch}
.def::before{content:"¶";color:var(--rub);font-size:14px;margin-right:8px;opacity:.65;vertical-align:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s3)}
.chip{font-size:12.5px;line-height:1.3;padding:4px 9px;border:1px solid var(--rule);border-radius:20px;
  color:var(--ink2);background:var(--paper);transition:border-color .16s,color .16s,background .16s;
  display:inline-flex;align-items:center;gap:5px;min-height:26px}
.chip:hover{border-color:var(--rub);color:var(--rub);background:var(--rubfaint)}
.chip.demo{border-color:var(--rub);color:var(--rub);font-weight:600}
.chip.demo:hover{background:var(--rub);color:var(--paper)}
.chip.x{font-style:italic}
.chiptag{font-size:9px;letter-spacing:.13em;text-transform:uppercase;opacity:.72;margin-left:5px;
  border-left:1px solid currentColor;padding-left:5px}
.chiplabel{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  align-self:center;margin-right:2px}
/* flash pop-out */
@keyframes pop{0%{box-shadow:0 0 0 0 var(--glow);background:var(--mark)}
  100%{box-shadow:0 0 0 14px transparent;background:transparent}}
.entry.flash .ehead{animation:pop 1.4s ease-out}
.dimmed{opacity:.34;transition:opacity .3s}
/* ============ results ============ */
.rwrap{padding:var(--s6) 0 0}
.rtop{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;padding-bottom:var(--s3);
  border-bottom:1px solid var(--rule);margin-bottom:var(--s4)}
.rtop h2{font-size:22px;font-weight:600}
.rtop .n{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.rlist{max-width:var(--measure)}
.res{display:block;width:100%;text-align:left;padding:9px 12px;border:1px solid transparent;
  border-bottom:1px solid var(--rule2);transition:background .14s,border-color .14s;border-radius:3px}
.res:hover{background:var(--card);border-color:var(--rule);box-shadow:inset 2px 0 0 var(--rub)}
.res .rline{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:nowrap}
.res .rhw{font-weight:600;font-size:16.5px;color:var(--ink);flex:0 0 auto;max-width:64%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res:hover .rhw{color:var(--rub)}
.res .rbook{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--rub);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0;opacity:.9}
.res .rclause{display:block;color:var(--ink3);font-size:15px;line-height:1.5;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res[data-open="1"] .rclause{white-space:normal;color:var(--ink);font-size:17px;line-height:1.6}
mark{background:var(--mark);color:var(--ink);padding:0 2px;border-radius:2px;
  box-shadow:0 0 0 1px var(--glow)}
.res .jump{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  border:1px solid var(--rule);border-radius:3px;padding:3px 8px;margin-top:8px;display:inline-block}
.res .jump:hover{color:var(--rub);border-color:var(--rub)}
.more{margin-top:var(--s4);font-size:13.5px;color:var(--ink3);font-style:italic}
.xcodex{margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--rule2)}
.empty{padding:var(--s6) 0;max-width:var(--measure)}
.empty h2{font-size:24px;margin-bottom:var(--s3)}
.empty p{color:var(--ink2);font-size:16.5px;margin:0 0 var(--s4)}
/* ============ floating ============ */
#totop{position:fixed;right:22px;bottom:26px;z-index:70;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--rule);background:var(--card);color:var(--ink2);display:grid;place-items:center;

<script>
var CODEX={"ux":{"name":"The AppliedInteractive UX/UI Codex","books":[{"n":"I","t":"Interfaces in the AI Era","d":"The operating frame — what changes when software can generate, converse and act, and why seventy years of interface invention is the working inventory.","s":0,"c":38},{"n":"II","t":"The Invention of Interaction: 1945–1968","d":"From Memex to the Mother of All Demos — the two decades that imagined the interactive machine.","s":38,"c":37},{"n":"III","t":"PARC and the Graphical Revolution: 1968–1984","d":"The window, the icon and the desktop — the fifteen years that fixed the shape of graphical computing.","s":75,"c":37},{"n":"IV","t":"The Interface Diaspora: 1985–2006","d":"The GUI leaves the lab — twenty years of competing desktops, palmtops and the first web decade.","s":112,"c":38},{"n":"V","t":"Multitouch, Mobile and the Modern Canvas: 2007–2022","d":"The phone rewrites the rules — fifteen years of touch, motion and design at platform scale.","s":150,"c":38},{"n":"VI","t":"How Humans Perceive Interfaces and the Laws of Interaction","d":"The psychophysics of the screen — what the eye finds, what the hand can hit, and the named laws that price every design decision.","s":188,"c":38},{"n":"VII","t":"The Mind of the User","d":"The user's model of the machine — and the precise names for every way the machine betrays it.","s":226,"c":42},{"n":"VIII","t":"Interaction Primitives","d":"The atoms of manipulation — the pointer, the selection, the mode and the undo that every interface still builds from.","s":268,"c":39},{"n":"IX","t":"Navigation, Search and Wayfinding","d":"How people find their way through structure — architecture, menus, search and the signs that keep them oriented.","s":307,"c":42},{"n":"X","t":"Components and Controls","d":"The component vocabulary — every control with a name, and the states and validations that make forms humane.","s":349,"c":42},{"n":"XI","t":"Layout, Grids and Visual Structure","d":"The architecture of the page — grids, hierarchy and the compositional patterns that let a screen read at a glance.","s":391,"c":40},{"n":"XII","t":"Data Visualisation as Interface","d":"Charts you can hold — the interaction vocabulary that turns pictures of data into instruments.","s":431,"c":38},{"n":"XIII","t":"Typography and Iconography on Screen","d":"Type and symbol under the constraint of pixels — rendering, hierarchy and the icon languages screens taught the world.","s":469,"c":38},{"n":"XIV","t":"Colour, Theming and Visual Language","d":"Colour as system — palettes, themes and the named visual languages interfaces have worn.","s":507,"c":38},{"n":"XV","t":"Motion, Animation and Microinteractions","d":"Movement with meaning — easing, springs and the tiny animated moments that make state changes legible.","s":545,"c":42},{"n":"XVI","t":"Language, Content and Onboarding","d":"Words as interface — microcopy, messages and the first-run experiences that teach a product from inside it.","s":587,"c":38},{"n":"XVII","t":"Design Craft: Artefacts and Tools","d":"The maker's bench — the artefacts a design passes through and the tools that have defined each era of the craft.","s":625,"c":42},{"n":"XVIII","t":"UX Research and Discovery","d":"Learning what to build — the methods that turn people's lives into design knowledge.","s":667,"c":41},{"n":"XIX","t":"Evaluation and Testing","d":"Judging the built thing — inspection methods, lab measures and the instruments that price usability.","s":708,"c":39},{"n":"XX","t":"Design Systems in Practice","d":"Running a shared design language — governance, contribution and the named systems that industrialised consistency.","s":747,"c":37},{"n":"XXI","t":"Inclusive and Accessible Interaction","d":"Interfaces for every body — the methods, assistive interactions and standards that widen who can operate software.","s":784,"c":41},{"n":"XXII","t":"The Web as an Interface","d":"The conventions the web invented — links, tabs, addresses and the page behaviours two generations now assume.","s":825,"c":38},{"n":"XXIII","t":"Mobile and Touch Interaction","d":"Design under the thumb — targets, gestures and the pocket-screen conventions that rewrote interface defaults.","s":863,"c":42},{"n":"XXIV","t":"Games and Playful Interfaces","d":"What games taught interfaces — feel, feedback and the playful structures that make effort enjoyable.","s":905,"c":39},{"n":"XXV","t":"Beyond the Screen: Voice, Spatial, Tangible and Ambient","d":"Interaction without a window — speaking, gazing, gripping and inhabiting as interface.","s":944,"c":38},{"n":"XXVI","t":"Collaboration and Multiplayer Interfaces","d":"Software as a shared room — cursors, comments and the awareness machinery of working together live.","s":982,"c":42},{"n":"XXVII","t":"AI-Native Interface Patterns","d":"The interface grammar of working with models — prompting surfaces, streamed output and the controls that keep a human steering.","s":1024,"c":42},{"n":"XXVIII","t":"Adaptive and Generative Interfaces","d":"Interfaces that change themselves — from the adaptive-menu misfire to software generated to fit one user's intent.","s":1066,"c":38},{"n":"XXIX","t":"The Lost Inventory: UX Inventions Awaiting Revival","d":"Interaction ideas that died with their vessels — catalogued plainly, each with the seed of a second life.","s":1104,"c":42},{"n":"XXX","t":"Dastardly Problems of Interaction","d":"The named problems every generation meets again — stated plainly, with their lineage, so the next builder recognises the enemy.","s":1146,"c":38},{"n":"XXXI","t":"Ecosystem: Canon, Figures and Institutions","d":"Who built the discipline — the designers, labs, texts and gatherings that carry interface knowledge forward.","s":1184,"c":42}]},"ai":{"name":"The AI-Era Programming Codex","books":[{"n":"I","t":"Programming in the AI Era","d":"How software is built when the machine writes the code.","s":1226,"c":42},{"n":"II","t":"Putting Language to Problems","d":"Turning a vague situation into a nameable, buildable one.","s":1268,"c":38},{"n":"III","t":"Architecture Fundamentals","d":"The load-bearing vocabulary of structure and boundaries.","s":1306,"c":40},{"n":"IV","t":"Architectural Styles and Patterns","d":"The named shapes a system can take.","s":1346,"c":40},{"n":"V","t":"Domain Modelling and Ubiquitous Language","d":"Speaking the business domain precisely enough to build it.","s":1386,"c":38},{"n":"VI","t":"Quality Attributes and Trade-offs","d":"The -ilities a system is judged by, and what each one costs.","s":1424,"c":38},{"n":"VII","t":"Browser, Rendering and the Web Platform","d":"What happens between the server and the screen.","s":1462,"c":42},{"n":"VIII","t":"Frontend Frameworks and State","d":"The frameworks and state language of the modern client.","s":1504,"c":40},{"n":"IX","t":"UI Architecture, Design Systems and Accessibility","d":"Interfaces built to scale and to include.","s":1544,"c":38},{"n":"X","t":"Mobile, Desktop and Cross-Platform Clients","d":"Shipping to phones, desktops and app stores from one codebase.","s":1582,"c":38},{"n":"XI","t":"APIs and Contracts","d":"The promises systems make to each other.","s":1620,"c":40},{"n":"XII","t":"Backend Runtimes and Frameworks","d":"The engines that serve requests and run the background work.","s":1660,"c":39},{"n":"XIII","t":"Integrations, Payments and Third-Party Services","d":"Money, mail and the third-party seams of a product.","s":1699,"c":38},{"n":"XIV","t":"Data Modelling and Databases","d":"Shaping and querying the system of record.","s":1737,"c":40},{"n":"XV","t":"Caching, Messaging and Data Movement","d":"Data on the move and data kept close.","s":1777,"c":41},{"n":"XVI","t":"Search, Analytics and Storage","d":"Finding, analysing and storing what the system of record cannot.","s":1818,"c":42},{"n":"XVII","t":"AI-Native Features and Model Integration","d":"Model intelligence wired into the product itself.","s":1860,"c":41},{"n":"XVIII","t":"Distributed Systems and Scale","d":"Staying correct while growing across many machines.","s":1901,"c":37},{"n":"XIX","t":"The Network Stack: Physical to Transport","d":"From the wire to the connection: OSI layers one to four.","s":1938,"c":40},{"n":"XX","t":"The Network Stack: Session to Application","d":"From the secure session to the web: OSI layers five to seven.","s":1978,"c":41},{"n":"XXI","t":"Identity, Authentication and Application Security","d":"Who the user is, what they may touch, how the product stays safe.","s":2019,"c":40},{"n":"XXII","t":"Infrastructure, Cloud and Platform Engineering","d":"The platforms the whole stack runs on.","s":2059,"c":42},{"n":"XXIII","t":"Build, Delivery and Environments","d":"From commit to production, and the experiments along the way.","s":2101,"c":38},{"n":"XXIV","t":"Observability, Debugging and Performance","d":"Seeing inside a running system and naming what is slow.","s":2139,"c":42},{"n":"XXV","t":"Failure Modes and Resilience","d":"The named ways systems fail and the tactics that contain them.","s":2181,"c":40},{"n":"XXVI","t":"Testing and Verification in the AI Era","d":"Proving that generated code actually works.","s":2221,"c":41},{"n":"XXVII","t":"Refactoring, Rearchitecting and Code Critique","d":"The language of changing what already exists.","s":2262,"c":40},{"n":"XXVIII","t":"Forgotten Software and Lost Media","d":"The systems, cultures and media computing left behind.","s":2302,"c":42},{"n":"XXIX","t":"Lost Paradigms and Revivable Approaches","d":"Design approaches that lost their era but not their worth.","s":2344,"c":38},{"n":"XXX","t":"The Dastardly Problems: Software's Recurring Unsolved Challenges","d":"The problems that defeated every generation and return in new clothes.","s":2382,"c":36},{"n":"XXXI","t":"Ecosystem: Tools, Canon and Figures","d":"The tools, laws, books and people of AI-era practice.","s":2418,"c":37}]},"demoCount":84,"D":{"sys-retry-storm":"Retry Storm & Metastable Failure — the outage that outlives its cause; HotOS 2021","sys-thundering-herd":"Thundering Herd & Cache Stampede — one expiry, a thousand identical requests","sys-circuit-breaker":"Circuit Breaker & Bulkheads — fail fast or drown the shared pool; Nygard 2007","ux-fitts":"Fitts's Law Rig — your own tap times vs log2(2D/W); Fitts 1954","ux-hick":"Hick's Law Arena — decision time grows with the log of choices; Hick 1952","ux-doherty":"The Doherty Threshold — below 400 ms the tool disappears; IBM 1982","ux-preattentive":"Pop-Out vs Conjunction Search — what the eye finds before you think","ux-change-blindness":"Change Blindness — the flicker that hides an elephant; Rensink 1997","ux-gestalt":"Gestalt Machine — proximity, similarity, closure snapping into groups; Wertheimer 1920s","sys-split-brain":"Split Brain & Quorum — a partition makes two systems that both think they are the one","sys-consistency":"The Consistency Spectrum — read-your-writes to eventual, anomalies on demand","sys-merkle":"Merkle Anti-Entropy — finding the needle of difference in log time","ux-ot-crdt":"OT vs CRDT — how two people type in one document; Google Docs 2006","ux-presence":"Presence & Live Cursors — the awareness machinery of multiplayer; Figma 2016","ux-modes":"Mode Error Machine — right action, wrong mode; Norman","sys-tail-latency":"The Tail at Scale — P99 rules a fan-out world; Dean & Barroso 2013","sys-backpressure":"Backpressure & Little's Law — the unbounded queue is a lie","sys-shuffle-shard":"Shuffle Sharding — combinatorial blast-radius isolation; AWS","ux-weber":"Weber–Fechner JND — sensation is logarithmic, measured on you; Weber 1834","ux-steering":"The Steering Law — corridors, tunnels and the safe triangle; Accot–Zhai 1997","ux-peak-end":"Peak-End Rule — memory keeps the peak and the end; Kahneman 1993","sys-tcp-congestion":"TCP Congestion — the AIMD sawtooth and bufferbloat; Jacobson 1988","sys-hol-blocking":"Head-of-Line Blocking — one hole dams every stream; why QUIC exists","sys-nat-traversal":"NAT Hole Punching — open the wall from both sides at once; STUN/ICE","ux-easing":"Easing vs Springs — five feels, one move; only physics survives interruption","ux-stagger":"Stagger Choreography — 16 pops become one cascade","ux-frame-budget":"The 16.7ms Frame Budget — long tasks delete frames; RAIL/INP","sys-write-skew":"Write Skew — the anomaly snapshot isolation misses; Cahill 2008","sys-nplus1":"The N+1 Query — 1+N round trips from one innocent loop","ux-info-scent":"Information Scent — users sniff menus; Pirolli & Card 1999","ux-teslers-law":"Tesler's Law — complexity is conserved, only moved or cut","ux-onboarding-cliff":"The Onboarding Cliff — funnels break at the effort wall","ux-contrast":"Contrast & the Cliff — legibility is a computable ratio; WCAG","ux-touch-targets":"Fat Fingers — occlusion, thumb zones and the 44px knee","ux-streaming-tokens":"Streaming vs Spinner — TTFT rules perceived speed","sys-rag-retrieval":"RAG Retrieval — the model answered; the retrieval decided; Lewis 2020","ux-blank-box":"The Blank Box — capability without affordance is a locked room","sys-flame-graph":"The Flame Graph — width is time, built live; Gregg 2011","sys-gc-pause":"GC Pauses — stop-the-world and the generational bargain; Ungar 1984","sys-coordinated-omission":"Coordinated Omission — the benchmark that lies; Tene","sys-rate-limiter":"Rate Limiters — four shapes of no","sys-power-of-two":"Power of Two Choices — one extra peek; Mitzenmacher 1996","sys-outbox":"The Outbox Pattern — two writes, one transaction"},"T":[["Human–Computer Interaction","The academic field studying how people design, use and are affected by computers, formalised as a discipline through ACM SIGCHI from 1982.","HCI",[1218,672,1210,1220]],["Interaction Design","The practice of designing behaviour into digital products across time — inputs, responses, states, transitions — not just static screens.","IxD",[1217,34,552,1191]],["User Experience Design","End-to-end design of everything a person feels while using a product, encompassing usability, findability and value beyond the interface itself.","UXD",[1439,330,600,928]],["User Interface","The surface — visual, textual, sonic or gestural — through which a person and a system exchange input and output.","UI",[1504,2350,2381,1186]],["Graphical User Interface","An interface built from visual elements (windows, icons, pointers) manipulated on screen, the dominant computing paradigm since the 1980s desktop.","GUI",[269]],["Human–AI Interaction","The emerging sub-field studying interfaces where the system itself reasons, generates and acts, rather than only responding to fixed commands.","HAI",[672,1220,0,1466]],["Interface Convention","A solved interaction problem repeated so widely it becomes expected — the magnifying-glass icon for search — lowering the cost of learning new software.",0,[137,610,780,17]],["Interaction Paradigm","A dominant model of how people and machines exchange control, such as command-line, WIMP or conversational, each superseding but rarely erasing the last.",0,[20,21,1466,138]],["Interface Metaphor","A borrowed real-world concept — desktop, folder, trash — used to make an abstract system legible by analogy to something already understood.",0,[81]],["Design Pattern","A reusable, named solution to a recurring interface problem, the UX field's adaptation of Christopher Alexander's 1977 architectural pattern language.",0,[1685]],["Delegation","Handing a goal, not a sequence of steps, to a software agent to complete — the central design shift of the AI era, raising new questions of oversight."],["Natural User Interface","An interface designed to feel like using no interface at all — voice, touch, gesture standing in for learned commands; the term gained currency around 2007–2010.","NUI",[287,232]],["Zero UI","The proposition, named by design writer Andy Goodman around 2015, that the best interface for many tasks is no visible screen at all.",0,[1741]],["Input Modality","A distinct channel through which a person feeds intent to a system — touch, voice, keystroke, gaze, gesture — increasingly combined rather than chosen singly.",0,[287,14,1895,371]],["Output Modality","A distinct channel through which a system communicates back — pixels, sound, haptics, synthesised speech — chosen for context, not just habit.",0,[13,1252,1868]],["Interaction Loop","The repeating cycle of input, system processing and perceivable feedback that constitutes one exchange between a person and a machine.",0,[233,1466,138,164]],["Anti-Pattern","A commonly repeated interface solution that looks reasonable but reliably produces a bad outcome, catalogued as a warning rather than a template.",0,[1374,2294],0,2294],["Platform Convention","An interaction rule specific to one operating system or ecosystem, such as iOS's back-swipe, that users expect any app on it to honour.",0,[137,610,780,6]],["Cross-Platform Consistency","The design discipline of keeping a product's core behaviour recognisable across operating systems while still respecting each platform's own conventions.",0,[1606,1774,1901,1909]],["Interface Inventory of History","The working premise of this codex: that most interaction problems in 2026 have a solved precedent somewhere in seventy years of prior invention.",0,[750,291,997,1041]],["Conversational Paradigm","An interaction model built on natural-language exchange rather than menus or commands, returned to prominence by chat-based AI products from 2022.",0,[950,7,21]],["Agentic Paradigm","An interaction model in which software plans and executes multi-step tasks toward a goal with only intermittent human direction, rather than waiting for each instruction.",0,[7,20,1228,1870]],["Post-WIMP","Any interface style that departs from the windows-icons-menus-pointer template — touch, voice, conversational — a term used loosely in the field since the mid-2000s.",0,[269,82]],["Ubiquity of Screens","The 2020s condition of interactive displays embedded in nearly every object and surface, making the interface a constant environmental fact rather than a discrete event.",0,[1120,1493,1561]],["Interface Debt","Accumulated inconsistency and complexity in a product's interaction patterns, built up the way unmanaged code accumulates technical debt, and as costly to unwind.",0,[2402,757]],["Invisible Interface","An interaction so well matched to habit and context that a person acts on it without consciously registering an interface exists at all."],["Attention as Constraint","The design premise that a person's attention, not screen space or bandwidth, is now software's scarcest resource, reshaping what an interface may ask for.",0,[2348,44,566,1149]],["Trust as Design Material","The principle that calibrated trust — neither blind reliance nor reflexive suspicion — must be actively designed into systems whose output a user cannot fully verify.",0,[158,1246,253,1165]],["Steering","A person redirecting an in-progress AI action mid-task rather than only approving or rejecting its final output, a distinct interaction primitive of agentic software.",0,[1240,206],"ux-steering"],["Legibility of Machine Action","The degree to which a system's ongoing or completed actions can be understood by the person responsible for them, essential once software acts autonomously.",0,[1555,482,1510,2333]],["User-Centred Design","A design process grounding every decision in observed user needs and iterative testing rather than internal assumption, formalised through the ISO 9241-210 standard.","UCD"],["Computer-Supported Cooperative Work","The research field, active from the mid-1980s, studying how software should support groups working together rather than individuals alone.","CSCW",[1403,1616,776,2334]],["Multimodal Interface","An interface accepting or combining more than one input or output channel at once — voice plus touch, text plus gesture — for redundancy or expressiveness.",0,[287,954,1056]],["AI-Native Interface","An interface designed around a generative or agentic model from the outset, rather than a model bolted onto a form built for fixed software.",0,[1582,1593,1617,1682]],["Interaction Style","A named category of exchange between person and system — command line, menu-driven, direct manipulation, natural language — the basic vocabulary interaction design chooses between.",0,[268,1,1466,138]],["Look and Feel","The combined visual style and behavioural rhythm of an interface, distinctive enough to be recognised — and, in the 1988 Apple v. Microsoft suit, to be litigated.",0,[908,961,1122]],["Design Rationale","The recorded reasoning behind an interface decision, capturing alternatives considered and rejected so later designers understand why, not just what, was built."],["Context of Use","The specific users, tasks, equipment and physical or social environment a product is designed for, a required input to the ISO 9241-210 design process.",0,[1231,1247,1259,1387]],["Memex","Vannevar Bush's 1945 hypothetical microfilm desk for storing and linking documents by association rather than index, sketched in his essay 'As We May Think.'"],["Batch Processing","The pre-interactive computing norm of submitting a job on cards or tape and waiting hours for output, the baseline every later interactive system escaped.",0,[57,74,1813,1642],0,1813],["Time-Sharing","Dividing one computer's processing time in rapid rotation among many simultaneous users at their own terminals, replacing a batch job's wait with the feel of a dedicated machine.",0,[67,41,68]],["Teletype","The electromechanical printing terminal, descended from telegraph equipment, that served as the first widely used interactive input/output device for early time-sharing computers.",0,[40,66]],["Command-Line Interface","A text-only interface where a person types instructions at a prompt for the system to execute, the standard mode of interaction before graphical displays.","CLI",[1265,1354,1360,1361]],["Light Pen","A pen-shaped photosensitive device pointed directly at a CRT screen to select or draw, the primary pointing tool of 1960s interactive graphics before the mouse.",0,[46,71,73,512]],["Constraint-Based Drawing","Specifying a drawing by geometric rules — make these lines parallel, this length fixed — rather than free hand, so the system solves and redraws to satisfy them.",0,[1555,2348,26]],["GRAIL","RAND Corporation's 1968 tablet-based system letting users sketch flowcharts recognised on the fly by handwriting and gesture, proof that a computer could interpret freehand input.",0,[287,423]],["RAND Tablet","A flat electromagnetic digitising tablet developed at RAND in the mid-1960s, giving a stylus positional accuracy comparable to a light pen without touching a CRT.",0,[43]],["Trackball","An upward-facing rotating ball translating hand movement into cursor motion, first built in 1952 for the Royal Canadian Navy's DATAR radar system, well before the mouse."],["Computer Mouse","Douglas Engelbart's 1964 wooden-cased pointing device, built with Bill English at SRI and patented in 1970 as an 'X-Y position indicator', ancestor of every desktop pointer since.",0,[2445,269,1207,110]],["Chorded Keyset","A five-key one-handed input device from Engelbart's SRI team, allowing letters and commands to be entered by key combinations alongside the mouse.",0,[465]],["The Mother of All Demos","Douglas Engelbart's single 90-minute live 1968 demonstration in San Francisco, introducing the mouse, hypertext, multiple windows and real-time collaborative editing together for the first time.",0,[2445,52]],["oN-Line System","Engelbart's SRI research environment (1962–68) combining hierarchical outline views, hypertext links between documents and a shared collaborative workspace, unveiled at the Mother of All Demos.","NLS",[52,1943]],["Hypertext","Text containing links a reader can follow non-sequentially to related text; the word was coined by Ted Nelson in 1965, though Bush had sketched the idea in 1945.",0,[2304,2370,2445,50]],["Light Gun","A pointing device aimed at a CRT to select targets, deployed operationally on the SAGE air-defence system's consoles from 1958, one of the earliest real-time interfaces in production use.",0,[512,43]],["Whirlwind Display","The CRT output of MIT's Whirlwind computer, driven interactively from the early 1950s, among the earliest real-time graphical displays and a direct ancestor of SAGE's consoles.",0,[61,86,168,805]],["PLATO","The University of Illinois teaching system, from 1960, whose later terminals combined touch-sensitive panels, plasma displays and an online forum community years ahead of the wider industry."],["Direct-View Storage Tube","A CRT variant retaining a drawn image without needing constant redraw, a Tektronix technology that made affordable interactive graphics terminals practical through the 1960s and 70s.","DVST",[1491,1684,1826,1841]],["Interactive Computing","The idea, radical against the batch-processing norm, that a person and a computer could exchange input and output continuously in something like real time.",0,[39,1813,68,69]],["Man–Computer Symbiosis","J.C.R. Licklider's 1960 paper proposing that people and computers should work as tightly coupled partners in real time, a founding vision for later interactive research.",0,[1314,2334,2364,2436]],["Augmentation","The framing, from 1960s SRI research, that computers exist to extend and amplify human intellect and collaboration rather than to automate people out of the task.",0,[1207]],["Real-Time Computing","Processing that responds within a time frame meaningful to the person or process waiting on it, the technical precondition every interactive interface of the era depended on.",0,[1317,960,458,982]],["Cathode-Ray Display","The vacuum-tube screen technology underlying nearly every graphical output device of the era, from Whirlwind's display to Sketchpad's drawing surface to SAGE's consoles.","CRT",[54,2380,86,168]],["Split-Screen","Dividing one display into simultaneously visible regions, shown in Engelbart's 1968 demo alongside multiple windows, letting a person compare views without switching between them.",0,[1555,1731,1995,2185]],["Journaling","NLS's shared, timestamped record of a workgroup's documents and changes, letting collaborators retrieve any prior version, an early precedent for versioned collaborative work.",0,[1126]],["View Control","NLS's ability to collapse or expand an outline's branches on demand, showing only the level of detail wanted, ancestor of collapsible outlines and folder trees.",0,[1934,1935,1942,2023]],["Punched Card","The rectangular card encoding data by hole position, the dominant input medium for batch computing through the 1960s and the interface most users never saw past.",0,[1973,66]],["Punched Tape","A continuous paper strip encoding data by punched holes, used to store and feed programs into Teletype-connected computers before magnetic storage became common.",0,[41,1973,65]],["Compatible Time-Sharing System","MIT's 1961 system, among the first working time-sharing operating systems, letting multiple users interact with one computer at once from separate terminals.","CTSS",[40]],["Project MAC","MIT's 1963 research project that developed and scaled time-sharing, seeding both the Multics operating system and the culture of interactive computing at MIT.",0,[40,57,2304,1122]],["TX-0","A 1956 MIT Lincoln Laboratory transistorised computer letting individual programmers interact with it directly and in real time, cultivating the first hands-on interactive computing culture.",0,[57]],["LINC","Wesley Clark's 1962 Laboratory Instrument Computer, built for scientists to run and adjust experiments interactively at their own bench, widely regarded as an early personal computer."],["IBM 2250","IBM's 1964 light-pen-driven graphics display terminal, one of the first commercially available interactive graphics workstations, used with early CAD and modelling software.",0,[43]],["SABRE","The American Airlines/IBM real-time reservation system, operational from 1960, letting agents query and update shared flight data from remote terminals — an early production transaction interface."],["DAC-1","Design Augmented by Computers, a General Motors/IBM interactive graphics system built 1959–64 using a light pen and CRT to let engineers sketch and modify car body designs.",0,[43]],["Remote Job Entry","Submitting a batch job from a remote terminal rather than the machine room itself, a transitional 1960s convention bridging pure batch processing and true interactivity.","RJE",[1813,39,710]],["Xerox Star","The Xerox 8010 Information System (1981), the first commercial computer combining icons, folders, overlapping windows, a mouse and property sheets into one coherent desktop, designed largely by Norm Cox.",0,[87,1202,1206,76]],["Overlapping Windows","On-screen panels that can stack and partially cover one another, first supported by Alan Kay's Smalltalk environment on the Xerox Alto in the mid-1970s.",0,[2332,2451,75,85]],["Pop-Up Menu","A menu appearing at the pointer's current position rather than a fixed location, introduced by Dan Ingalls in Smalltalk on the Alto in the mid-1970s.",0,[269,85]],["Pull-Down Menu","A menu dropping from a persistent bar at the top of the screen when clicked, popularised by the Apple Lisa in 1983 as a permanent, always-visible command source.",0,[93,79,109,440]],["Menu Bar","The strip fixed at the top of the screen holding an application's pull-down menus, introduced with the Apple Lisa in 1983 and standard on the Macintosh from 1984.",0,[93,78,94,282]],["Icon","A small picture standing for a file, application or command, central to the Xerox Star's 1981 desktop and given lasting form by Susan Kare's 1983–84 Macintosh icon set.",0,[75,94,1188]],["Desktop Metaphor","Modelling a computer's file system on the objects of a physical office — documents, folders, a trash can — first shipped whole by the Xerox Star in 1981.",0,[75,96,93,1206]],["WIMP","Windows, Icons, Menus, Pointer — the shorthand, in use from around 1980, for the graphical interface style the Alto, Star, Lisa and Macintosh all shared.",0,[94,269,22]],["WYSIWYG","What You See Is What You Get — an editor whose on-screen display matches its printed output, first realised by Bravo at Xerox PARC in 1974.",0,[1206,102]],["Modeless Editing","Editing text without switching between separate command and insert modes, introduced by Larry Tesler and Tim Mott's Gypsy editor at Xerox PARC in the mid-1970s.",0,[1190,1206,286,989]],["Smalltalk GUI","Alan Kay's Learning Research Group environment on the Xerox Alto, the first system to run overlapping windows, pop-up menus and a bitmapped display together.",0,[2332,2451,76,77]],["Bitmapped Display","A screen in which every pixel is individually addressable rather than drawn from fixed character shapes, the hardware foundation the Xerox Alto needed before any graphical interface could exist.",0,[2332,85,54,61]],["Property Sheet","A panel listing an object's editable attributes, one of the Xerox Star's 1981 generic commands ('Show Properties'), applicable identically to any icon on the desktop.",0,[75,88,1580,2221]],["Generic Commands","The Xerox Star's small fixed set of universal actions — Move, Copy, Open, Delete, Show Properties, Again, Undo, Help — applied consistently across every object type.",0,[75,87,1404,1265]],["Cut Copy and Paste","The idiom of removing or duplicating a selection to a temporary clipboard for later insertion, introduced by Tesler and Mott's Gypsy editor and carried into the Lisa's system-wide Clipboard.",0,[274]],["Double-Click","Two rapid clicks used to open an object rather than merely select it, an Apple Lisa 1983 convention letting one input device distinguish selection from action.",0,[93,274]],["Title Bar","The strip along a window's top edge naming it and serving as the handle for dragging it, standard across the Xerox Star, Lisa and Macintosh desktops.",0,[75,94]],["Dialog Box","A temporary window requesting information or confirmation before an action proceeds, a Xerox Star and Lisa convention carried directly into the Macintosh interface.",0,[75,94,357,380]],["Apple Lisa","Apple's 1983 computer, the first shipping consumer product with the full desktop metaphor, a persistent pull-down menu bar, system-wide Clipboard and the Trash icon.",0,[78,79,81,90]],["Macintosh","Apple's January 1984 computer, the first mass-market graphical-interface machine, shipped with Human Interface Guidelines making consistency a requirement of third-party software.",0,[95,79,80,82]],["Macintosh HIG","Apple's Human Interface Guidelines, published from 1984, the first widely enforced rulebook standardising how third-party Macintosh software should look, behave and speak.",0,[94]],["Trash Can","The desktop icon representing deletion by drag, introduced as the Wastebasket on the Apple Lisa in 1983 and renamed Trash on the Macintosh.",0,[93,94,81]],["Marching Ants","The animated dashed-line border marking an active selection, introduced in early Macintosh graphics software to make a selection's boundary readable while it moved.",0,[94,274,2400]],["Desk Accessory","A small Macintosh utility — calculator, notepad, clock — launchable from the Apple menu over any running application, the Mac's answer to multitasking before background processes.","DA",[94]],["MacPaint","Bill Atkinson's 1984 bitmap drawing application bundled with the original Macintosh, establishing the toolbox palette, marquee selection and pattern fills used for decades after.",0,[1189,94,274,288]],["Fat Bits","MacPaint's pixel-level zoom mode, letting a user edit individual pixels magnified on screen, ancestor of every image editor's zoomed pixel view since.",0,[99]],["Tiled vs Overlapping","The early-1980s debate over whether windows should sit edge-to-edge with no overlap or stack freely; overlapping won out from the Alto onward for its closer desk analogy.",0,[585,76]],["Bravo","Charles Simonyi and Butler Lampson's 1974 Xerox PARC document editor, the first WYSIWYG word processor, though it still required switching between command and text-entry modes.",0,[83,1206]],["Click-and-Drag","Pressing a mouse button on an object and moving the pointer to relocate it before release, refined by Apple beyond Xerox's separate select-then-command model for the Lisa.",0,[269]],["Scroll Arrow","A small clickable triangle at the end of a scroll bar moving a window's content by one increment per click, standard on the Macintosh's earliest windows.",0,[276,94,152,187]],["Window Management","The conventions — moving, resizing, layering, closing — governing how multiple on-screen windows are arranged and switched between, established by the Alto, Star and Macintosh in turn.",0,[94,128,977,1562]],["Menu Blinking","The Macintosh convention of briefly flashing a menu item after selection, giving visible confirmation the system had registered the choice before executing it.",0,[94,274]],["Rubber-Band Selection","Dragging a dotted rectangle across the screen to select every object it encloses, a Macintosh Finder and MacPaint convention for selecting multiple items at once.",0,[94,99,153,300]],["Lasso","MacPaint's freehand selection tool, letting a user draw an irregular outline around pixels rather than a fixed rectangle, tightening to the traced shape on release.",0,[99,274,295]],["Pinned Menu","A pull-down menu that could be torn off and left open on screen rather than closing after one choice, keeping a frequent command set visible.",0,[78,1893]],["Alto's Three-Button Mouse","The Xerox Alto's original 1973 mouse carried three buttons for distinct functions, a complexity later designers simplified to Apple's deliberate single-button Lisa and Macintosh mouse.",0,[2332,94,2288,48]],["Guided Tour","Apple's cassette-tape walkthroughs bundled with the original Macintosh, narrating basic mouse and menu use aloud alongside the screen — one of the earliest scripted product introductions.",0,[94,602,612]],["Start Menu","Windows 95's hierarchical launcher anchored to a taskbar corner button, replacing Program Manager's icon groups with a single searchable list of installed software.",0,[113,134,145,1678]],["Taskbar","The persistent strip, introduced with Windows 95, listing every open window as a clickable button so a user can switch tasks without hunting through overlapping windows.",0,[76,112,114,146]],["System Tray","The taskbar's notification area holding background-process icons — clock, volume, network — introduced alongside the Windows 95 taskbar for status a user glances at rather than acts on.",0,[113]],["Common User Access","IBM's 1987 cross-platform standard for consistent menu, dialog and keyboard conventions, spanning mainframe terminals and OS/2 and later shaping Windows' own interface rules.","CUA",[1335,193]],["NeXTSTEP","NeXT's 1989 operating system, introducing the persistent application-launching Dock and a multi-pane hierarchical column browser, both later inherited directly into Mac OS X.",0,[117,118]],["Dock","The persistent strip of application icons for launching and switching software, introduced by NeXTSTEP in 1989 and carried into Mac OS X's interface in 2000–01.",0,[116,147]],["Column View","A file browser showing nested folder levels as side-by-side scrolling columns, introduced by NeXTSTEP in 1989 and popularly known by the name of its conceptual predecessor, Miller columns.",0,[116,276,392]],["Amiga Workbench","Commodore's 1985 colour desktop for the Amiga, tuned to a high-contrast blue-and-orange palette for period televisions and built on a multitasking-friendly window model.",0,[2330]],["OS/2 Workplace Shell","IBM's 1992 object-oriented desktop for OS/2 2.0, treating icons as live handles to real system objects and introducing drag-to-shred deletion, built after IBM and Microsoft split OS/2 development.",0,[1368,1492]],["Apple Newton","Apple's 1993 handwriting-recognition PDA that coined the term Personal Digital Assistant and stored data in flexible cross-application 'soup' object databases rather than conventional files.",0,[122,124,1129,93]],["Handwriting Recognition","Software interpreting freehand pen strokes as text, the core promise, and initial embarrassment, of the Apple Newton before Palm's simplified Graffiti alphabet solved the accuracy problem in 1996.",0,[121,123,244]],["Graffiti","Palm's 1996 single-stroke simplified handwriting alphabet, trading a short learning curve for far higher recognition accuracy than the Newton's freehand approach.",0,[122]],["Personal Digital Assistant","The handheld category coined by the 1993 Apple Newton for pocket devices combining notes, contacts and calendar with pen or stylus input.","PDA",[121,824,951,125]],["Office Assistant","Microsoft Office's animated helper 'Clippit', known as Clippy, launched in Office 97 from leftover Microsoft Bob technology and disabled by default in 2002 — a lasting case of unwanted assistance.",0,[1072,1116,951,124]],["Skinning","Letting users replace an application's entire visual appearance with a swappable community-authored theme, popularised for a mainstream audience by Winamp from 1997."],["Aqua","Apple's brushed-metal, translucent, animated interface language introduced with Mac OS X in March 2001, paired with the Dock as the system's launcher and switcher.",0,[140]],["Exposé","Mac OS X Panther's October 2003 feature instantly tiling every open window on screen for at-a-glance selection, an early solution to window-management overload.",0,[105,274]],["Click Wheel","Apple's circular touch-sensitive scroll control for the iPod, refined by 2004 from an earlier physical scroll wheel, letting a user browse large media libraries one-handed.",0,[276]],["T9 Predictive Text","Tegic Communications' dictionary-driven system, from 1996, guessing an intended word from single keypresses per letter, the dominant text-entry method on non-smartphone keypads through the 2000s.","T9"],["i-mode","NTT DoCoMo's February 1999 mobile internet service, using compact HTML over packet data for email and content, reaching a million subscribers within six months."],["Emoji","Shigetaka Kurita's 176-character pictograph set for NTT DoCoMo's 1999 i-mode phones — though SoftBank's 1997 J-Phone handset shipped 90 characters first, a priority Kurita later acknowledged.",0,[178,994]],["Alt-Tab","The keyboard shortcut cycling through open windows in order of most recent use, standard on Windows and adopted in similar form across nearly every subsequent desktop OS.",0,[280,1095]],["Windows Explorer","Microsoft's file-management shell introduced with Windows 95, replacing File Manager's separate window-per-drive model with a single navigable hierarchy paired with the Start Menu.",0,[112,1616,1633,1964]],["Recycle Bin","Windows 95's name for its deleted-file holding area, chosen to avoid Apple's trademarked Trash/Wastebasket terms — a small naming skirmish of the era's platform rivalry."],["GEOS","Berkeley Softworks' 1986 full graphical environment for 8-bit machines, later ported to DOS PCs as PC-GEOS in 1990 with selectable Beginner, Intermediate and Advanced complexity modes."],["Palm Pilot Conventions","The PalmPilot's minimal five-application home screen, HotSync cradle and stylus-first navigation, from 1996, establishing the interaction template most 1990s–2000s PDAs converged on.",0,[876,6,17,610]],["Stylus Interaction","Using a pen-shaped input device on a touch-sensitive screen for tapping and writing, the dominant PDA and pen-computer input method before capacitive finger touch became standard.",0,[1466,0,1,5]],["WinAmp","Nullsoft's 1997 media player, the app most responsible for popularising fully user-swappable, community-authored interface skins for mainstream consumer software."],["Brushed Metal","Apple's textured, striped-aluminium interface skin used for media-oriented Mac OS X applications from 2000, visually distinct from the flatter Aqua look of standard system windows.",0,[127,433]],["Fast User Switching","Mac OS X Jaguar's 2002 ability to swap between logged-in user accounts without closing the first user's running applications, letting a shared machine change hands instantly.",0,[1952,2128,2200,1967]],["Nokia Navi-Key","Nokia's single central navigation key, paired with soft keys and a numeric grid, shaping a generation's baseline mental model of menu-driven mobile navigation before touchscreens.",0,[226]],["Snake","The simple maze-and-growing-tail game preinstalled on the Nokia 6110 from 1997, one of the first pieces of software most feature-phone owners ever interacted with."],["Cover Flow","Apple's 2005 interface for flipping through album artwork in a 3D horizontal carousel using a scroll wheel or swipe, shipped that year in iTunes.",0,[276,363,1738,2337]],["Windows XP Luna","Windows XP's 2001 default visual theme, with rounded buttons, saturated blues and greens and a redesigned Start Menu, the most visually distinct Windows interface in years at launch.",0,[112,1072,1616,1633]],["Longhorn/Aero","Windows Vista's Aero interface, evolved from the 'Longhorn' development codename, adding translucent glass window borders and live taskbar thumbnails to the Windows desktop.",0,[113]],["Mac OS X Dock Genie Effect","The animated swoosh a minimised Mac OS X window performs collapsing into its Dock icon, an interface flourish making an abrupt disappearance feel physically continuous.",0,[117]],["Active Desktop","Microsoft's 1997 Windows feature letting live, updating web content sit directly on the desktop background behind icons, an ambitious but little-used blend of web and desktop later dropped.",0,[81,2091,2092,250]],["Flash Intro","The animated Adobe-authored splash sequence many late-1990s/early-2000s websites forced visitors through before reaching content, a defining and widely resented artefact of the Flash-era web.",0,[2317]],["Capacitive Multitouch","Touch sensing via a fingertip's electrical charge rather than pressure, letting a screen track multiple simultaneous contact points; popularised for a mass audience by the 2007 iPhone.",0,[480]],["Pinch-to-Zoom","Moving two fingers apart or together on a touchscreen to zoom in or out, demonstrated by Steve Jobs at the original iPhone's January 2007 unveiling.",0,[961,1074,1106]],["Inertial Scrolling","Content that continues moving after a scroll gesture ends and decelerates as if by physical friction, part of the original iPhone's 2007 touch model.",0,[276,287,104,298]],["Rubber-Band Overscroll","A list that stretches past its end when dragged too far, then snaps back, an original-iPhone 2007 touch that signals a boundary without simply stopping dead.",0,[1508,107,300,937]],["Pull-to-Refresh","Dragging a list down past its top and releasing to trigger new content loading, invented by Loren Brichter for Tweetie in 2008 and later patented by Twitter.",0,[1205,1775,2027,78]],["Slide to Unlock","The original iPhone's 2007 horizontal drag gesture to wake the device from its lock screen, chosen over a button to make accidental unlocking in a pocket nearly impossible.",0,[287,892]],["Notification Shade","The panel of pending alerts revealed by swiping down from the top of a touchscreen, standard across iOS and Android since their earliest smartphone releases.",0,[1590,1611,1970,878]],["Flat Design","An interface style rejecting skeuomorphic textures and shadows for solid colour, typography-led hierarchy and translucency, triggered industry-wide by Apple's iOS 7 redesign in 2013.",0,[528,2378,169]],["Material Design","Google's June 2014 unifying visual language of paper-and-ink metaphors, elevation and shadow, and card-based layouts across Android and the web, internally codenamed Quantum Paper.",0,[543,874,27]],["Stories Format","Ephemeral, chronologically ordered posts that disappear after 24 hours, launched by Snapchat in October 2013 and since copied across Instagram, Facebook and WhatsApp.",0,[170,187,1286,1287]],["Gesture Navigation","Edge-swipe gestures for home, app-switcher and back, replacing a physical Home button, introduced with the iPhone X in 2017 and later adopted across Android.",0,[287,868,904,871]],["Share Sheet","The system-level overlay listing apps and actions a piece of content can be sent to, letting any app plug into cross-app sharing without custom integration.",0,[858,87,875,1003]],["Super-App","A single app hosting many independent services and sub-apps within it, the model pioneered by China's WeChat from the mid-2010s and since studied and imitated worldwide.",0,[163]],["Mini Program","A lightweight sub-app running inside a host super-app with no separate install or app-store approval step, launched by WeChat in 2017 to power its apps-within-an-app model.",0,[162,2339,2397,2436]],["QR-Code Interaction","Scanning a square barcode with a phone camera to open a link or trigger a payment, the layer beneath China's scan-to-pay systems and, later, global menu and check-in flows.",0,[1466,0,1,5]],["Springboard","The original iPhone's 2007 home-screen grid of app icons, named internally at Apple, that became the template nearly every subsequent smartphone home screen followed.",0,[489,876,166]],["App Grid","A home screen's rows and columns of equally sized app icons, the layout convention Springboard established in 2007 and mobile operating systems have used ever since.",0,[165,489,876]],["App Store Model","Apple's July 2008 centralised, reviewed marketplace for installing third-party mobile software, establishing the review-and-distribution structure that defined the app economy.",0,[1523,1597,1604]],["Retina Display","Apple's marketing term, from the iPhone 4 in 2010, for a screen with pixel density high enough that individual pixels are not distinguishable at normal viewing distance.",0,[412,54,61,86]],["iOS 7 Shift","Apple's 2013 wholesale redesign, led by Jony Ive, abandoning a decade of skeuomorphic texture for flat colour and typography — the event that triggered flat design industry-wide.",0,[157,528,1471,2265]],["Snapchat Ephemerality","Content that automatically deletes after being viewed or after a set time, Snapchat's founding 2011 premise that later shaped its Stories format and influenced rivals.",0,[159]],["Notch","The cutout at the top of a touchscreen housing front-facing cameras and sensors, introduced with the iPhone X in 2017 to maximise screen area while keeping Face ID hardware.",0,[172]],["Face ID","Apple's 2017 facial-recognition unlock and authentication system, replacing a fingerprint sensor with a front camera glance as the primary interaction for unlocking a device.",0,[171,2425,1215]],["Taptic Engine","Apple's linear actuator, introduced with the Apple Watch in 2015 and later iPhones, producing distinct, precise vibration patterns rather than a single blunt buzz.",0,[180]],["Swipe Typing","Entering text by dragging a finger across a virtual keyboard letter to letter without lifting it, popularised by the Swype keyboard from 2010 and later built into iOS and Android.",0,[866,867,868]],["Autocorrect","A keyboard's automatic replacement of a mistyped word with its likely intended spelling as the user types, standard on smartphone software keyboards since the earliest touchscreen phones."],["Siri","Apple's voice assistant, launched with the iPhone 4S in October 2011, the first mainstream conversational voice interface built directly into a mass-market smartphone.",0,[1896,951]],["Alexa","Amazon's voice assistant, launched with the Echo speaker in November 2014, establishing the always-listening smart speaker as a mainstream household interface category.",0,[951,953]],["Emoji Keyboard","A dedicated software keyboard layer for browsing and inserting pictograph characters, built into iOS from 2011 and Android soon after, turning Kurita's 1999 set into a global input standard.",0,[1565,280,301,132]],["Animoji","Apple's 2017 feature mapping a user's facial expressions, captured by the iPhone X's TrueDepth camera, onto an animated character in real time for messaging."],["Apple Watch","Apple's 2015 wrist-worn device, introducing the Digital Crown for scrolling and zooming without obscuring a small screen, and Force Touch for a press-based secondary action.",0,[276,173,93,121]],["Live Photos","Apple's 2015 photo format capturing a few seconds of motion and sound around a still shot, played back with a long-press on the image.",0,[869,926]],["AirDrop","Apple's 2011 peer-to-peer file-sharing feature, using Bluetooth for discovery and Wi-Fi for transfer, letting nearby devices exchange files without cables, accounts or a shared network."],["Widgets Era","The mid-2010s to early-2020s expansion of home-screen widgets from simple information tiles into resizable, interactive glanceable modules, formalised on iOS with iOS 14 in 2020.",0,[876,1601,877]],["App Clips","Apple's 2020 lightweight, instantly loading slice of a full app, launched by scanning a code or tapping a link, for a single task without a full install.",0,[902]],["UPI Scan-to-Pay","India's Unified Payments Interface 'intent flow', letting a merchant app hand a pre-filled payment request directly to a user's chosen banking app for one-tap biometric authorisation."],["TikTok Vertical Feed","A single, full-screen, swipe-to-advance video per view rather than a scrolling list of thumbnails, popularised by TikTok from 2018 and since adopted as Reels and Shorts.",0,[276,1273,2081,426]],["Vertical Scroll Format","A single continuous vertically scrolling image strip replacing paginated comic panels, formalised by Korean webtoon platforms Daum and Naver from 2003–04.",0,[276,1273,2081,426]],["Gestalt Principles","Perceptual laws describing how the eye groups visual elements into wholes; formulated by Wertheimer, Koffka and Kohler in 1920s Berlin, still governs interface grouping.",0,[189,190,191,192]],["Proximity","Gestalt principle stating elements placed close together read as one group, the single strongest tool for implying relationship without a border.",0,[398,188,193],"ux-gestalt"],["Similarity","Gestalt principle stating elements sharing colour, shape or size read as related, used to signal that scattered controls belong to one category.",0,[1508,188,1750,1821],"ux-gestalt"],["Closure","Gestalt principle stating the eye completes an incomplete shape into a whole, exploited by logos and progress rings that imply completion.",0,[188,1335,1422],"ux-gestalt"],["Figure-Ground","Gestalt principle by which the eye separates a foreground subject from its background, underpinning every modal overlay and elevated card.",0,[188,486,1065]],["Common Region","Gestalt principle stating elements sharing an enclosed boundary, such as a card or panel, read as one group regardless of proximity.",0,[188,189,1335,1568]],["Continuity","Gestalt principle stating the eye follows the smoothest path through aligned elements, why grid alignment reads as ordered and offset elements read as separate.",0,[188,397,2293,552]],["Preattentive Processing","Visual properties such as colour, orientation and motion detected in under 250 milliseconds before conscious attention engages, the basis of alert colours and highlighted states.",0,[1365,1618,1689,1735],"ux-preattentive"],["Visual Search","The task of locating a target among distractors, its speed set by how many preattentive features distinguish the target from surrounding elements.",0,[223,2318,396,424],"ux-preattentive"],["Change Blindness","Failure to notice a large visual change when it occurs during a distraction or cut, the reason silent layout shifts go unseen mid-task.",0,[239,1173,198,1624],"ux-change-blindness"],["Inattentional Blindness","Failure to perceive an unexpected object in plain sight while attention is engaged elsewhere, why users miss banners outside their task focus.",0,[239,1173,197],"ux-change-blindness"],["Pop-Out Effect","Instant, effortless detection of a single differing element among uniform distractors, the perceptual mechanism a single coloured badge exploits among grey icons.",0,0,"ux-preattentive"],["Fitts's Law","Formula predicting that time to reach a target falls as target size grows and rises with distance; Paul Fitts, 1954, still sizes every tap target.",0,[809,206,1221],"ux-fitts"],["Hick's Law","Formula stating decision time increases logarithmically with the number of choices offered, the argument for shorter menus and fewer top-level options.",0,[1221],"ux-hick"],["Miller's Law","Claim that working memory holds about seven items, plus or minus two; George Miller, 1956, the historical justification for chunked navigation and short lists.",0,[222]],["Jakob's Law","Observation that users spend most of their time on other products, so they expect a new interface to work like the ones they already know.",0,[1221,1185]],["Doherty Threshold","The 400-millisecond response ceiling below which a system feels instantaneous and keeps a user's attention locked to the task, past which it feels laggy.",0,[297,220],"ux-doherty"],["Tesler's Law","Principle that every system carries an irreducible amount of complexity, so design work only decides whether the user or the product absorbs it.",0,[1190],"ux-teslers-law"],["Steering Law","Extension of Fitts's Law predicting the time to navigate a cursor through a constrained path, used to model dragging through narrow menus or sliders.",0,[200,1240,28],"ux-steering"],["Power Law of Practice","Finding that time to complete a repeated task falls as a power function of the number of repetitions, the mathematics behind expert shortcut habits.",0,[1095,1117]],["Peak-End Rule","Finding that people judge an experience mostly by its most intense moment and its final moment, not its average, favouring a strong finish over a smooth middle.",0,0,"ux-peak-end"],["Aesthetic-Usability Effect","Finding that users perceive attractive interfaces as more usable regardless of actual usability, first documented by Kurosu and Kashimura in 1995.",0,[1439,708,709,713]],["Goal-Gradient Effect","Finding that motivation to finish a task increases as the perceived distance to the goal shrinks, why progress bars feel to accelerate near completion.",0,[367,517,538,1279]],["Zeigarnik Effect","Finding that unfinished tasks are remembered better than completed ones, the psychological pull behind unread badges and incomplete progress rings."],["Progressive Disclosure","Interface strategy that shows only what is needed at each step and defers advanced options behind a secondary action, keeping the primary path uncluttered.",0,[1474,1494,377,1035],"ux-hick"],["Weber-Fechner Law","Principle that perceived change in a stimulus is proportional to its relative, not absolute, size, why slider steps feel even only on a logarithmic scale.",0,0,"ux-weber"],["Just Noticeable Difference","The smallest change in a stimulus a person can detect, used to calibrate how far a colour, size or volume must shift to register as different.","JND",[1327,2029]],["Signal Detection Theory","Framework separating a person's raw sensitivity to a stimulus from their response bias, used to explain why users miss real errors yet flag false ones.",0,[1733,2089,2172,1508]],["Attentional Tunneling","Narrowing of attention onto one task or display element under stress or high workload, causing peripheral alerts and status changes to go unnoticed."],["Symmetry","Gestalt principle stating elements arranged in mirrored balance read as a single stable unit, used to signal a layout is settled rather than in motion.",0,[1508,188]],["Uniform Connectedness","Gestalt principle stating elements joined by a visible line or shared colour read as connected even when spatially distant, the logic behind connector lines in diagrams.",0,[188]],["Law of Pragnanz","The overarching Gestalt claim that the eye always resolves ambiguous forms into the simplest, most stable interpretation available, the master rule beneath the individual grouping principles."],["Flicker Fusion Threshold","The refresh rate above which successive frames read as continuous motion rather than discrete flicker, the perceptual floor beneath animation frame-rate decisions.",0,[297,204]],["Visual Crowding","Loss of ability to identify an object when packed too close to similar neighbours, the reason dense icon grids and small dense text become unreadable.",0,[491,2318,396,424]],["Chunking","Grouping individual items into a smaller number of meaningful units to fit working-memory limits, why phone numbers and card numbers are visually segmented.",0,[1476,1695,1882,202]],["Visual Clutter","The measurable density of competing visual elements on a screen, degrading visual search speed and raising perceived effort independent of information content.",0,[196,412,2318,396]],["Perceptual Speed","The rate at which a person can compare, match or scan visual information, an individual-difference factor that layout density and contrast either help or fight.",0,[412]],["Absolute Judgment","A person's ability to place a single stimulus on a scale without a reference point, reliable for only a handful of categories before errors climb."],["Mental Model","A user's internal, often incomplete belief about how a system works, built from past experience and used to predict what an action will do.",0,[227,142,1183,690]],["Conceptual Model","The model designers deliberately build into an interface's structure and behaviour, intended to align with the user's mental model rather than the system's actual mechanics.",0,[226]],["Gulf of Execution","The gap between a user's goal and the actions an interface lets them take to reach it, wider when controls fail to map to intentions.",0,[1555,1184,1213,1237]],["Gulf of Evaluation","The gap between a system's actual state and what its interface communicates, wider when feedback is missing, delayed or ambiguous after an action.",0,[233,247,1894,2246]],["Affordance","A property of an on-screen element that suggests what action it supports, such as a raised edge suggesting pressability, independent of whether it is labelled.",0,[261,2378,231,1213],"ux-blank-box"],["Signifier","A per
