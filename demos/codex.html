"The naming, layering and page-structuring conventions a team applies within design files, keeping large collaborative projects navigable as they grow.",0,[1250,2017,2230,2361]],["Version Naming","The convention used to label successive iterations of a design file or prototype, distinguishing draft, review and final states unambiguously.",0,[1254,1623,1632,1893]],["FigJam","Figma's companion online whiteboard product, built for workshops, brainstorming and diagramming alongside the main design tool's file structure."],["Component Instance","A placed copy of a master component within a design file, linked so it inherits updates from the source while still allowing local overrides."],["Vector Networks","A path-editing model allowing lines to branch and merge freely at any point, rather than forming only one continuous closed or open path as in traditional vector tools.",0,[1940,468,1827,1857]],["Prototyping Fidelity Ladder","The staged progression from low- to high-fidelity prototypes across a project, each rung chosen to match the kind of feedback that stage of design needs.",0,[627,630,233,626]],["Concierge Test","A validation method in which a team manually delivers a service by hand, rather than automating it, to learn what the offering should be before building it."],["Design QA","The process of checking a built interface against its design specification once development is complete, catching spacing, colour and behaviour discrepancies before release."],["Digital Whiteboarding","Collaborative work conducted on an infinite online canvas, used for mapping, sketching and workshop exercises in place of a physical whiteboard.",0,[2398,124]],["UX Research","Systematic investigation of user behaviour, needs and motivations, conducted to inform design decisions with evidence rather than assumption.",0,[1207,668,669,684]],["Generative Research","Research conducted early to discover unmet needs and opportunities before a solution exists, exploratory in nature rather than testing a specific design.",0,[1864,1207,667,669]],["Evaluative Research","Research conducted to assess how well an existing design or prototype meets user needs, testing a specific solution rather than exploring the problem space.",0,[1207,667,668,684]],["Contextual Inquiry","A research method combining observation and interview conducted in the user's own environment while they perform a real task, rather than in a lab.",0,[335,607,1090]],["User Interview","A one-on-one conversation with a research participant, structured around open questions, used to surface beliefs, motivations and past behaviour.",0,[686]],["Field Study","Research conducted in the actual setting where a product or behaviour naturally occurs, capturing context a lab or remote session cannot replicate.",0,[0,5,1657,382]],["Diary Study","A longitudinal method in which participants record their own behaviour, thoughts or product use over an extended period, self-reporting between researcher check-ins.",0,[729]],["Ethnographic Study","Deep, immersive observation of people within their natural cultural or social context, borrowed from anthropology to understand behaviour researchers can't simply ask about.",0,[729]],["Persona","A fictional but research-grounded archetype representing a distinct segment of a product's users, used to keep design decisions anchored to real needs rather than the designer's own assumptions.",0,[689,944,1191,1215]],["Card Sorting","A method in which participants group content items into categories that make sense to them, used to inform or validate an information architecture.",0,[1555,307,322]],["Tree Testing","A method testing whether users can find a given item within a text-only hierarchy of category labels, evaluating structure independent of visual design."],["Affinity Mapping","A synthesis technique clustering individual research observations, typically on sticky notes, into emergent themes discovered bottom-up rather than sorted into predefined categories.",0,[2079]],["Empathy Map","A collaborative diagram capturing what a user says, thinks, feels and does around a given experience, used to build shared team understanding of their perspective."],["Journey Map","A diagram tracing a user's experience across every stage, touchpoint and emotion of interacting with a product or service over time, not just within one screen.",0,[681]],["Service Blueprint","A diagram extending a journey map to include the backstage processes, systems and staff actions that support each visible front-stage user interaction.",0,[680]],["Screener","A short questionnaire used to determine whether a potential participant qualifies for a study, filtering respondents against target criteria before recruitment."],["Participant Recruitment","The process of finding, screening and scheduling people who match a study's target criteria, a foundational and often underestimated part of any research plan.",0,[742]],["Research Repository","A centralised, searchable store of past research findings, recordings and artefacts, kept so insight isn't lost or re-discovered redundantly across teams.",0,[694,1399,1207,667]],["Triangulation","Confirming a finding through multiple independent research methods or data sources, increasing confidence beyond what any single method alone would justify."],["Stakeholder Interview","A structured conversation with someone internal to the organisation, gathering business context, constraints and existing assumptions before user-facing research begins.",0,[671]],["Longitudinal Study","Research tracking the same participants over an extended period, revealing how behaviour and attitudes change over time rather than a single snapshot.",0,[480,729]],["Research Ops","The operational discipline of infrastructure, tooling, recruitment and process that supports a research practice at scale, distinct from conducting research itself.",0,[1207,667,668,669]],["Proto-Persona","A rapidly assembled, assumption-based stand-in for a persona, built from a team's existing knowledge before real research data is available to validate it.",0,[675,971]],["Mental-Model Diagram","A visual mapping technique aligning a user's actual thought process and vocabulary against the product's current or proposed functionality, exposing mismatches between them.",0,[1555,226,462,465]],["Survey Design","The craft of writing and structuring quantitative or qualitative questionnaires so responses are unbiased, comparable and analysable at scale."],["Incentive","Compensation offered to a research participant for their time, calibrated to be fair without being so large it distorts who volunteers or how they answer."],["Sample Size","The number of participants included in a qualitative study, typically small since the method aims for depth of understanding rather than statistical generalisation.",0,[2138,605,485,809]],["Insight","A synthesised understanding of why users behave a certain way, distinct from a raw observation or data point in that it explains rather than merely describes.",0,[684,698]],["Competitive Analysis","Systematic review of how comparable products solve a given problem, used to identify conventions, gaps and differentiation opportunities before designing a solution.",0,[1299,1460,2160,2196]],["Consent in Research","The explicit, informed agreement a participant gives before a session, covering recording, data use and their right to withdraw at any point.",0,[2058,1159,1207,667]],["Pilot Study","A small trial run of a research plan conducted before the full study, catching flawed questions or logistics while the cost of fixing them is still low.",0,[1555,137,729]],["Research Synthesis","The analytical process of turning raw research data into organised themes and findings, the step between collecting observations and stating an insight.",0,[694,1207,667,668]],["Thematic Analysis","A qualitative analysis method identifying, coding and grouping recurring patterns of meaning across a body of interview or observational data.",0,[1299,1460,2160,2196]],["Behavioural Data","Evidence of what users actually did, drawn from usage logs or analytics, used alongside self-reported interview data to check what people say against what they do."],["Concept Testing","Presenting an early idea, description or rough mockup to users to gauge reaction and desirability before committing design or engineering effort to it.",0,[1294]],["Five Whys","An interview and root-cause technique that repeatedly asks 'why' after each answer, pushing past a surface response toward an underlying motivation or cause.",0,[1430,727]],["Opportunity Solution Tree","A visual planning structure connecting a desired outcome to the user opportunities that could drive it and the candidate solutions worth testing for each; Teresa Torres."],["Research Readout","A structured presentation of a study's findings delivered back to stakeholders, translating raw data into decisions and recommendations they can act on.",0,[1207,667,668,669]],["Assumption Mapping","A workshop technique plotting a team's beliefs about a problem by importance and evidence, identifying which risky, unproven assumptions research should target first."],["Leading Question","An interview or survey question phrased in a way that hints at a desired answer, a craft failure researchers train themselves to catch and rewrite.",0,[734,479]],["Voice of Customer","Aggregated qualitative and quantitative feedback capturing customers' own words about their needs and experience, used as a grounding input across product decisions.","VoC",[233,1406]],["Usability Testing","Observing representative users attempt real tasks with a product to identify where they struggle, the core empirical method for evaluating an interface's usability.",0,[1439,709,710,728]],["Moderated Usability Test","Usability testing conducted with a facilitator present, live or remote, able to ask follow-up questions and adjust tasks in response to what a participant does.",0,[1439,708,209,1154]],["Unmoderated Remote Test","Usability testing in which a participant completes tasks alone using recording software, without a facilitator present, trading depth for speed and scale.",0,[1439,708,74]],["Think-Aloud Protocol","A method asking participants to verbalise their thoughts continuously while performing a task, exposing reasoning and confusion a silent observation would miss.",0,[1950,1954,1992,2001]],["Heuristic Evaluation","An inspection method in which evaluators judge an interface against a fixed set of established usability principles, without involving real users directly.",0,[713,740,1439,1894]],["Ten Usability Heuristics","Jakob Nielsen's widely used 1994 checklist of general usability principles, from visibility of system status to error prevention, still the default heuristic evaluation reference.",0,[1185,712,1439,1072]],["Eight Golden Rules","Ben Shneiderman's 1986 set of interface design principles, including consistency and error prevention, an earlier parallel checklist to Nielsen's heuristics.",0,[1186,1304,2230,653]],["Cognitive Walkthrough","An inspection method stepping through a task one action at a time, asking at each step whether a user would know what to do and notice it worked.",0,[739,1340,242,260]],["Expert Review","An evaluation conducted by an experienced practitioner applying professional judgement and established principles, faster than user testing though less directly evidential.",0,[1411,2327,1153,1264]],["System Usability Scale","A standardised ten-item questionnaire producing a single comparable usability score out of 100, developed by John Brooke in 1986 and still the field's most common benchmark instrument.","SUS",[1439,209,1154,708]],["Net Promoter Score","A single-question loyalty metric asking how likely a user is to recommend a product, widely adopted in UX despite ongoing critique of its predictive validity for usability specifically.","NPS",[1439,1888,2153,2255]],["Task Success Rate","The proportion of test participants who complete a given task correctly, the most direct quantitative measure of whether a design actually works.",0,[478]],["Time on Task","The duration a participant takes to complete a task, used alongside success rate since a fast failure and a slow success tell very different stories.",0,[549]],["Error Rate","The frequency with which participants make mistakes while attempting a task, counted and categorised to reveal specific points of friction in a flow.",0,[236,1439,2137,1543]],["Severity Rating","A scale, typically from cosmetic to catastrophic, used to prioritise which usability findings from a test or review need fixing first.",0,[1439]],["GOMS","Goals, Operators, Methods and Selection rules, a modelling framework predicting expert task-completion time by decomposing an interaction into its component steps.",0,[274]],["Keystroke-Level Model","A simplified GOMS technique estimating task time by summing standard durations for basic actions like keystrokes, pointing and mental preparation.","KLM",[549]],["Eye Tracking","A method recording exactly where a participant's gaze falls and for how long, revealing what actually draws attention rather than what they report noticing.",0,[401,402,961,980]],["First-Click Test","A method measuring whether a participant's very first click on a screen was on the correct path, since research shows early success strongly predicts eventual task success."],["Five-Second Test","A method showing a design for five seconds before asking what participants recall, measuring what a screen communicates in a single quick glance.",0,[2286,1430,702]],["Guerrilla Testing","Quick, informal usability testing conducted with whoever is available, such as passers-by in a cafe, trading rigour for speed and low cost.",0,[1439,708]],["Benchmark Study","A usability study run at intervals over time or against competitor products, using consistent metrics to track whether a design is measurably improving.",0,[1439,480,2248,672]],["Usability Engineering","A structured discipline that sets measurable usability goals up front and tests against them throughout development, treating usability as an engineered requirement.",0,[1439,1555,1185,1231]],["Formative Evaluation","Testing conducted during design to identify and fix problems while a product can still easily change, focused on improvement rather than judgement.",0,[1894,2246,2257,2260]],["Summative Evaluation","Testing conducted on a finished or near-finished product to measure overall performance against a benchmark, focused on judgement rather than iteration.",0,[478,1894,2246,2257]],["Retrospective Probing","Asking a participant to explain their actions after a task is complete, using screen playback to prompt recall without interrupting their in-task thinking."],["Single Ease Question","A single seven-point item asking how difficult a task just was, a lightweight alternative to a full questionnaire administered right after each task.","SEQ",[706,1696,2192,2362]],["Scroll Map","A visualisation showing what proportion of visitors scrolled to each depth of a page, revealing where attention drops off below the visible fold.",0,[276,104,152,187]],["Hallway Testing","Informal usability testing conducted with whoever happens to be nearby rather than recruited participants, valued for catching glaring problems cheaply and fast.",0,[1439,708]],["Usability Lab","A dedicated physical space equipped with recording and observation equipment for conducting controlled, moderated usability sessions.",0,[1439,209,1154,708]],["RITE Method","Rapid Iterative Testing and Evaluation, a method that fixes identified usability problems immediately between small batches of participants rather than waiting until a full study concludes.",0,[1439]],["Pluralistic Walkthrough","An evaluation method in which users, designers and developers jointly step through task scenarios together, discussing each screen from their different perspectives.",0,[741,715]],["Heuristic Markup","Direct annotation of specific heuristic violations onto screenshots or a live interface during a heuristic evaluation, tying each finding to its exact location.",0,[712,992,713]],["Task Scenario","The realistic situational framing given to a participant before a test task, providing motivation and context rather than a bare instruction to click something.",0,[739,1459]],["Participant Debrief","A short interview conducted immediately after test tasks conclude, capturing overall impressions and reactions while the experience is still fresh.",0,[683]],["False Completion","A moment where a participant believes they have successfully finished a task when they have not, a particularly serious usability finding since the user leaves unaware of the failure.",0,[1439,262]],["Panel Testing","Usability testing conducted through a managed pool of pre-recruited participants matching target demographics, letting a study launch and return results within hours.",0,[1439,708,358,379]],["Rage Click","A rapid burst of repeated clicks on the same element, an analytics signal indicating a user's frustration with an element that isn't responding as expected.",0,[1508]],["Dead Click","A click on an element that has no functional response, an analytics signal revealing where users mistake a static element for an interactive one.",0,[1508,236,1779,2200]],["Pattern Library","A curated catalogue of reusable interface patterns, kept as reference examples of how to solve recurring problems, organised for designers to browse and adapt.",0,[2311,749]],["Style Guide","A documented reference of a product's visual and voice rules, such as colour, type, tone and logo use, that predates componentised systems and still anchors brand-level decisions.",0,[770,1653,608,1554]],["Component Library","The shared, governed catalogue of interface components a team maintains as its single working set, owned collectively rather than rebuilt per project.",0,[2311,747]],["UI Inventory","A wall-to-wall audit that photographs or catalogues every interface pattern currently live across a product, exposing duplication before a design system is built.",0,[1552,19]],["Component Audit","A periodic review that checks each library component against real product usage, flagging drift, unused variants and undocumented one-offs for cleanup.",0,[1581,1017]],["Contribution Model","The documented process by which product teams can propose, submit and get new components accepted into a shared design system.",0,[1552]],["Federated Model","A design-system operating structure where multiple teams each own and evolve parts of the system, coordinated by shared standards rather than one central team.",0,[1552,2375,329]],["Centralised Model","A design-system operating structure where one dedicated team owns all components and standards, and product teams consume rather than contribute.",0,[1552]],["DesignOps","The discipline of running design as an operation, covering tooling, process, hiring and budget, so designers spend their time designing rather than coordinating logistics."],["Governance","The decision rights, review process and escalation path that determine who can change a shared design system and how a change gets approved.",0,[1552]],["Design Debt","The accumulated gap between a design system's documented standard and what actually ships, incurred when teams bypass it under deadline pressure.",0,[1552,2402,24]],["Deprecation Policy","The published timeline and process for retiring an old component or pattern, including the migration path teams must follow before it is removed.",0,[1633,1657,1649,1803]],["Design System Versioning","Applying release numbers to a design system's components so consuming teams can track, pin and upgrade deliberately rather than inheriting silent breaking changes.",0,[1552,1624,480,1254]],["Adoption Metric","A tracked figure, such as the percentage of screens using library components or teams onboarded, that a design system team reports to justify its continued investment.",0,[1552,480,599,779]],["Platform Guidelines","The rules a platform owner publishes for how apps on it should look and behave, which a product's own design system must reconcile with.",0,[1552,1337,1594,1606]],["IBM Carbon","IBM's open-source design system, launched in 2018, built on a stated set of principles including 'open' and 'consistent' and used across its enterprise software portfolio.",0,[1552,1449]],["Shopify Polaris","Shopify's design system for merchant-facing admin interfaces, first published in 2017 with its own content and accessibility guidelines alongside its components.",0,[1552]],["Microsoft Fluent","Microsoft's cross-platform design system, introduced in 2017 as the successor to Metro, unifying interaction across Windows, Office and web products.",0,[1552,1116,1126]],["GOV.UK Design System","The UK government's public design system, maintained by the Government Digital Service, whose patterns are mandated across departmental services for consistency and trust.",0,[1552]],["Ant Design","Alibaba's open-source design system, released in 2015 for enterprise back-office applications, notable for popularising a systematic design-values documentation approach in China's tech industry.",0,[1552]],["Atlassian Design System","Atlassian's design system spanning Jira, Confluence and Trello, documented publicly with a stated content design and accessibility standard for cross-product teams.",0,[1552,588]],["Lightning Design System","Salesforce's design system, launched in 2015, giving both internal product teams and third-party app builders on its platform a shared component and pattern language.",0,[1552]],["Design Language","A design system's documented visual and interaction vocabulary, its rules for form, motion and hierarchy, maintained as governed reference rather than left to individual taste.",0,[1552,2377,514,543]],["Living Style Guide","A style guide generated to stay synchronised with production code, rendering its documented components from the actual implementation rather than static screenshots that drift out of date.",0,[748,1653,608,1554]],["Single Source of Truth","The one authoritative location, whether a design file, documentation site or code repository, that a design system nominates as canonical when other copies disagree.",0,[1399,1552,772,1883]],["Documentation Site","The published, searchable reference where a design system's guidelines, usage rules and rationale live for anyone building against it.",0,[1552,771,1249,619]],["Component Status Label","A tag, such as stable, beta or deprecated, attached to each library component so consumers know its maturity and risk before adopting it.",0,[594,247,889,1022]],["Base Web","Uber's open-source design system, released in 2018 and maintained by its design platform team as a foundation other companies could fork.",0,[1337,1552,1881]],["Primer","GitHub's open-source design system, documenting the patterns behind its own product interface and released publicly for outside contributors to draw on.",0,[1552]],["Multi-Brand Support","A design system built to serve several distinct brands from one shared component base, swapping brand-level styling while keeping underlying structure common.",0,[1552,1616,1403,31]],["U.S. Web Design System","The United States government's shared design system for federal websites, maintained by the Technology Transformation Services to standardise citizen-facing services.","USWDS",[1552]],["Adobe Spectrum","Adobe's cross-product design system, unifying the interface language across Photoshop, Illustrator and its other Creative Cloud applications since 2019.",0,[1552,2324,817,2317]],["Design System Team","The dedicated group, often designers and engineers together, responsible for building, documenting and governing a shared design system as its own internal product.",0,[1552,782,760]],["Semantic Naming Convention","A component and value naming scheme built around role and intent rather than raw appearance, so a name survives a visual redesign without renaming.",0,[6,17,137,610]],["RFC Process","A written request-for-comments proposal that a contributor circulates before a design-system change ships, inviting structured feedback ahead of formal review.",0,[1552,233,1365,1618]],["Design System Roadmap","The published forward plan of components, patterns and standards a design system team intends to build next, sequenced against product team demand.",0,[1552,779,829]],["Design System Champion","A product-team member who advocates for and enforces design-system adoption within their own team without belonging to the central system team.",0,[1552]],["Inclusive Design","A design approach that treats diversity of ability, language, culture and circumstance as the ordinary brief rather than an edge case handled afterwards.",0,[1278,817]],["Universal Design","Designing environments and products usable by the widest range of people without adaptation, a term Ron Mace coined at North Carolina State in 1985, rooted in architecture.",0,[1599,1154]],["Curb-Cut Effect","The pattern where a feature built for disabled people, named for wheelchair kerb ramps, ends up benefiting a far wider population, from parents with prams to delivery workers."],["Situational Impairment","A temporary loss of function caused by context rather than the body, such as a bright glare hiding a screen or one hand holding a bag.",0,[817]],["Temporary Disability","A functional limitation expected to resolve, such as a broken wrist or post-surgery vision loss, that still requires an interface to work without that hand or eye.",0,[816]],["Ability-Based Design","A framework, proposed by Jacob Wobbrock and colleagues around 2011, that designs an interface to fit a specific user's actual abilities rather than an assumed norm.",0,[817]],["A11y","The numeronym for 'accessibility', counting the eleven letters dropped between the first and last, used as shorthand across tickets, tooling and job titles."],["Switch Access","An input method operating a device through one or a few physical switches, scanning on-screen options in sequence until the user triggers a selection.",0,[274,1952,2128,2200]],["Sip-and-Puff Device","A switch controlled by inhaling and exhaling through a straw-like sensor, giving reliable binary input to users without functional hand or head movement.",0,[1607,2037,1018,1170]],["Eye-Gaze Input","Pointing and selecting on screen by tracking where the eyes fixate, captured by an infrared camera, used chiefly by people without reliable limb control.",0,[480,980,1895,13]],["Head Pointer","A camera-tracked input method that maps head movement to cursor position, letting a user without hand control drive a pointer by tilting or turning.",0,[269,480,1943,2151]],["Dwell Clicking","Triggering a click by holding a pointer, gaze point or head-tracked cursor still over a target for a set duration, replacing a physical button press.",0,[269,480,549]],["Sticky Keys","An operating-system accessibility feature that lets modifier keys such as Shift or Control latch on after one press, so keyboard shortcuts work without holding two keys at once.",0,[280,281,1095,1999]],["Slow Keys","An operating-system accessibility feature that ignores a key press until it has been held for a set duration, filtering out accidental taps from tremor.",0,[549,1764,1965]],["Voice Control","A full hands-free operating mode that maps spoken commands directly onto on-screen elements and gestures, distinct from a dictation or assistant feature layered on top.",0,[287,1934,1935,1942]],["Screen Magnifier","An operating-system feature that enlarges a portion of the display under a movable lens or full-screen zoom, for users with low vision.",0,[1493,1561]],["High-Contrast Mode","An operating-system or application theme that swaps default colours for a maximum-contrast palette, aiding users with low vision or light sensitivity.",0,[1072,1566,531,586]],["VoiceOver","Apple's built-in screen-reading software, shipped since 2005 on macOS and since 2009 on iOS, read aloud and navigated by gesture or keyboard.",0,[287]],["TalkBack","Google's built-in screen-reading software for Android, navigated by swipe gestures and read aloud through synthesised speech.",0,[287]],["JAWS","A commercial Windows screen reader from Freedom Scientific, first released in 1995 and still the most widely deployed in enterprise and government settings.",0,[1561]],["NVDA","A free, open-source Windows screen reader launched in 2006, whose low cost made it a default choice for individuals and low-budget organisations worldwide.",0,[1561,1072]],["Braille Display","A hardware device that renders on-screen text as physical braille characters, read by touch, typically connected alongside a screen reader's speech output.",0,[1561,806,54,61]],["Refreshable Braille","A braille display whose pins raise and lower electronically to update in place, letting one physical cell present continuously changing text rather than fixed embossing.",0,[805]],["Accessibility Tree","The parallel structure an operating system builds from an interface, exposing each element's role, name and state to assistive software separately from the visual render.",0,[1581,1164,813,814]],["Focus Indicator","The visible outline or highlight marking which interface element currently holds keyboard focus, the primary cue a sighted keyboard user has for their position.",0,[339,897,930,986]],["Target Size","The minimum width and height a tappable or clickable element must meet so it can be hit reliably by users with limited fine motor control.",0,[200,863,980,485]],["Colour-Blind-Safe Palette","A colour scheme chosen so its hues stay distinguishable under the common forms of colour vision deficiency, verified with simulation tools rather than assumed.",0,[507,316,522,540]],["Section 508","The 1998 amendment to the US Rehabilitation Act requiring federal agencies to make electronic and information technology accessible, enforced through procurement.",0,[415]],["EN 301 549","The European standard specifying accessibility requirements for ICT products and services, the technical baseline that EU accessibility law points to for compliance."],["European Accessibility Act","An EU directive, adopted 2019 with a June 2025 compliance deadline, requiring many private-sector products and services to meet accessibility requirements across member states.","EAA",[1581,1164,807,814]],["Accessibility Conformance Report","A standardised document, completed on a VPAT template, in which a vendor states how its product conforms to accessibility standards for a purchaser's review.","ACR",[1581,1164,807,813]],["Accessibility Overlay","A third-party script layered onto a site to patch accessibility issues automatically, a category that drew sustained criticism through the 2020s for masking rather than fixing defects.",0,[1581,1164,807,813]],["Disability Dongle","Liz Jackson's term for a well-intentioned assistive product designed without disabled input, prized for its novelty by non-disabled audiences while poorly solving the actual problem.",0,[788]],["Spectrum of Ability","Microsoft's inclusive-design framing that plots permanent, temporary and situational impairment along one continuum, so a single solution serves users across all three.",0,[784,787,2324,778]],["Accessibility-First","An approach that builds accessibility into a feature's initial design and specification, rather than auditing and retrofitting it once the build is complete.",0,[1581,1164,807,813]],["Timeout Extension","A pattern that warns a user before a session or form expires and offers a control to add time, rather than silently discarding unsaved input.",0,[1770,1763,1972,2197]],["Vestibular Trigger","A visual effect, such as large-scale parallax or spinning motion, capable of inducing dizziness or nausea in users with vestibular disorders.",0,[1768,559,563,1083]],["Dyslexia-Friendly Typography","Type choices, including generous letter spacing, avoiding italics and distinct letterforms for easily confused characters, that measurably ease reading for dyslexic users.",0,[1575,493]],["Automated Accessibility Testing","Tooling that scans rendered interfaces for programmatically detectable accessibility faults, catching a documented minority of real issues while missing anything requiring human judgement.",0,[1581,1164,807,813]],["Augmentative and Alternative Communication","A device or system, from symbol boards to eye-gaze speech generators, that replaces or supplements spoken communication for people with speech or language impairment.","AAC",[1618,1051]],["Personal Voice","Apple's 2023 feature that trains a synthetic voice model from a user's recorded speech in advance, so a later condition that removes their speech still lets them sound like themselves.",0,[1555,124]],["Hyperlink","A clickable reference embedded in text or an image that loads another document, the term Ted Nelson coined in 1965 and Tim Berners-Lee built into the web in 1990.",0,[852]],["Visited-Link Colour","A browser default that renders a clicked link's colour, historically purple, differently from an unvisited one, letting users see at a glance where they have already been.",0,[1072,1566,456,507]],["Browser Tab","A strip control holding one loaded page each within a single browser window, letting a user hold several destinations open and switch between them without losing state.",0,[1555,1489,490,862]],["Back Button","The browser control that returns to the previously viewed page in the session's history stack, the single most-used navigation control on the web.",0,[829,848,110,349]],["Forward","The browser control that re-advances to a page just left via the Back button, restoring the position a user stepped away from in the history stack.",0,[828,1299,1915,1952]],["Bookmark","A saved reference to a URL, stored locally or synced across devices, letting a user return to a page without recalling or retyping its address.",0,[490,848,1080]],["URL Bar","The browser field that displays the current page's address and accepts a typed or pasted one to navigate directly to it."],["Omnibox","A combined address-and-search input, the term Google introduced with Chrome in 2008, that resolves whatever is typed into either a URL or a search query."],["Browser Chrome","The browser's own interface furniture, tabs, toolbars, address bar and menus, that frames the rendered page without being part of the page itself.",0,[1064,827]],["Reader Mode","A browser feature that strips a page down to its article text and images, removing ads and navigation, for uninterrupted reading.",0,[1561,850]],["Home Page","The page a browser opens to by default or a site treats as its front door, set independently by user preference and by site design.",0,[1072,1087,854,876]],["404 Page","The error page a server returns when a requested URL matches no content, named for the HTTP status code and often customised to keep a lost visitor on-site.",0,[835]],["Permalink","A URL designed to remain stable indefinitely for one piece of content, a discipline blogging platforms popularised in the early 2000s to keep links from rotting."],["Anchor Link","A link that jumps the browser to a specific fragment identifier within the current page, scrolling straight to a heading or section rather than loading a new document.",0,[276,255]],["View Source","The browser command that reveals a page's raw HTML markup, a transparency feature present since the web's earliest browsers that let anyone learn by inspecting a live page.",0,[1883,771]],["Autofill","A browser or app feature that pre-populates form fields from previously stored personal or payment data, cutting repetitive typing on checkout and sign-up forms.",0,[861,895]],["CAPTCHA","A challenge designed to be solvable by a human but not a script, coined in 2003 at Carnegie Mellon as an acronym for a Completely Automated Public Turing test.",0,[842]],["reCAPTCHA","Google's CAPTCHA service, which evolved from distorted-text challenges into an invisible version 3 that scores a visitor's likely humanity from behaviour rather than an explicit puzzle.",0,[841]],["Cookie Banner","The consent prompt requesting permission to set tracking or non-essential cookies before a site can deploy them, mandated across the EU by ePrivacy and GDPR rules.",0,[1555,480,1173,239]],["Infinite Scroll","A feed pattern that fetches and appends the next batch of content automatically as the user nears the bottom, removing pagination clicks entirely.",0,[1627,853,1197,104]],["Progressive Enhancement","A build philosophy that delivers a functional baseline experience to every browser first, then layers richer behaviour on top for browsers capable of supporting it.",0,[1474,1494,212,459]],["Graceful Degradation","A build philosophy that starts from the full-featured experience and ensures it still functions acceptably when a browser lacks a capability it assumes.",0,[1431,1679],0,1431],["Webring","A set of independently owned sites linked in a closed loop via a shared navigation widget, a 1990s convention for discovering related sites before search engines matured."],["Frames","An HTML model that split a browser window into independently scrollable sub-documents, largely abandoned once it proved to break bookmarking and the Back button.",0,[828,830,1951,1962]],["Image Map","A single image divided into multiple clickable regions, each linking to a different destination, an early alternative to building a full navigation menu.",0,[2344]],["RSS Reader","An application that aggregates updates pulled from a user's subscribed web feeds into one unified reading list, independent of any single publisher's site.",0,[1396,1561,834]],["Link Preview","A card auto-generated when a URL is shared, surfacing the destination's title, image and summary so a reader can judge it before clicking through.",0,[2105,1039]],["Link Rot","The gradual decay of hyperlinks as their destinations move, disappear or get repurposed, leaving a reference that once worked pointing nowhere useful.",0,[825]],["Load More","A button that fetches and appends the next batch of results on explicit request, an alternative to infinite scroll that keeps loading under the user's control.",0,[276,844]],["Hit Counter","A visible tally of page visits displayed on a site, a status symbol of 1990s personal home-page culture before analytics dashboards made counts private.",0,[835,1059]],["Guestbook","A page visitors could sign with a public message, a defining social feature of the pre-social-media web that let strangers leave a trace on a site they liked."],["Web Feed","A structured, machine-readable summary of a site's latest content, published in a format such as RSS or Atom so other tools can subscribe to it."],["Open Graph Card","The rich preview a platform renders from a page's Open Graph meta tags, the protocol Facebook published in 2010 to standardise how shared links appear.",0,[2145,466,468,1408]],["Share Button","A control that hands a page or item's link directly to another app or platform's share sheet, sparing the user from copying a URL manually.",0,[161,1003,1008,110]],["Print Stylesheet","A separate set of CSS rules applied only when a page is printed, stripping navigation and background colour to fit legibly on paper.",0,[2169]],["Session Expiry","The point at which an inactive login times out, best paired with an advance warning and a one-click extension rather than a silent redirect to sign-in.",0,[1016,1258,1911,1999]],["Password Manager Integration","Form field markup and naming that lets a browser's or app's credential manager reliably detect, autofill and offer to save login fields.",0,[840,1734,1365,2046]],["Favicon Badge","A numeral or dot drawn onto a page's favicon to signal unread items directly in the browser tab, a lightweight web-only substitute for a system notification badge.",0,[490,1508,827,1615]],["Touch Target","The tappable area assigned to a control on a touchscreen, sized well beyond its visible graphic since a fingertip covers roughly ten millimetres of glass.",0,[900,809,980,896],"ux-touch-targets"],["Thumb Zone","The arc of a phone screen a thumb can comfortably reach while one hand holds the device, used to place frequent controls within easy stretch.",0,[2017,2093],"ux-touch-targets"],["Reachability","A one-handed accessibility feature, introduced by Apple in 2014, that temporarily slides the whole screen's content down so top elements fall within thumb reach.",0,[969]],["Swipe-to-Delete","A gesture that removes a list item when swiped past a threshold, revealing a delete action beneath it before the row commits and disappears.",0,[287,1757,174,867]],["Swipe Actions","A set of secondary controls, such as archive, flag or share, revealed by swiping a list row partway, keeping them off-screen until needed.",0,[1555,174,1530,2101]],["Edge Swipe","A gesture starting from a screen's physical edge, commonly used for system-level navigation such as going back, since it is hard to trigger accidentally.",0,[287,160,899,174]],["Long Press","Holding a touch point in place beyond a set duration to reveal a contextual menu or secondary action, the touchscreen counterpart to a right-click.",0,[283,549,181,282]],["Haptic Feedback","A brief vibration pulse timed to a touch interaction, confirming a tap, selection or threshold crossing through touch rather than sight or sound alone.",0,[274,233,563,1043]],["Pull Gesture","A drag beyond a list's natural scroll boundary that triggers an action tied to the overscroll distance, the general pattern behind several release-triggered mobile interactions.",0,[276,160,287,899]],["Bottom Navigation","A fixed row of three to five top-level destinations anchored to a screen's bottom edge, keeping primary navigation within thumb reach on tall phones.",0,[1565,875,160,309]],["Tab Bar","A persistent strip of destination icons and labels, typically at the screen's bottom on iOS or top on some Android layouts, for switching between an app's main sections."],["Floating Action Button","A circular button raised above a screen's content, introduced with Google's Material Design in 2014 to mark a single primary action per screen.","FAB",[158,379,1530,2101]],["Bottom Sheet","A panel that slides up from a screen's bottom edge to show supplementary content or actions, dismissible by swiping back down or tapping outside it.",0,[872,87,161]],["Home Screen","The customisable grid of app icons and widgets a device shows by default, serving as a mobile operating system's primary launch surface.",0,[489,1072,1494,1588]],["Widget","A small, self-updating view of an app's content placed directly on the home screen, showing information at a glance without opening the full app.",0,[876,1601,183]],["Notification Centre","The system-level panel, revealed by a swipe gesture, that collects an operating system's alerts from every app into one dismissible, scrollable list.",0,[879,287,1590,1611]],["Notification Grouping","Collapsing multiple alerts from one app or thread into a single expandable stack, preventing a burst of activity from flooding the notification centre.",0,[878,1590,1611,1970]],["Quiet Hours","A scheduled window during which a device suppresses or silences incoming alerts automatically, sparing the user from muting notifications manually each night."],["Focus Mode","A user-configured profile that filters which apps and contacts can send notifications, letting a device behave differently across work, sleep or driving contexts."],["Permission Priming","A custom in-app screen explaining why a permission is needed, shown before the operating system's own request dialog, to raise the odds of a grant.",0,[1612,1692,894]],["Mobile-First","A design and development discipline that specifies the smallest screen's layout and content first, then expands outward to larger displays rather than shrinking a desktop design down.",0,[1199]],["Adaptive Icon","An app icon built from separate foreground and background layers so the operating system can mask it into a circle, squircle or other shape consistently, an Android format from 2018.",0,[489,2050,410,1066]],["Splash Screen","The static or lightly animated view an app shows during its own launch, bridging the moment before its first real screen has finished loading.",0,[1493,1561]],["Shake to Undo","A gesture, physically shaking the device, that surfaces an undo confirmation prompt, an iOS convention dating to the earliest iPhone OS releases.",0,[287,578,941]],["Picture-in-Picture","A floating, resizable video window that stays on top of other apps as a user navigates away, letting playback continue outside its original screen.",0,[1421]],["Dynamic Island","Apple's 2022 interface element that expands the front-camera cutout into a persistent, shape-shifting pill showing live activity and quick controls.",0,[903,1464,1897,432]],["Status Bar","The strip along a screen's top edge showing time, signal, battery and active system icons, present across a device regardless of which app is open.",0,[1508,247,773,1022]],["One-Handed Use","A device or app mode that shrinks or repositions the interactive area toward one side of the screen so every control stays within a single thumb's reach.",0,[962]],["App Drawer","A separate scrollable screen, distinct from the home screen, listing every installed app on Android devices rather than only the ones a user has pinned.",0,[876,337]],["Lock Screen","The screen a device shows before authentication, surfacing the time, notifications and limited quick actions without granting access to the device's contents.",0,[155,903,1493,1561]],["Notification Channel","An Android category that groups a single app's notification types so a user can mute or prioritise, say, chat messages separately from promotional alerts.",0,[1590,1611,1970,1594]],["Just-in-Time Permission","Requesting device access, such as location or camera, at the moment a feature actually needs it rather than in a batch during onboarding.",0,[599,1612,1692,882]],["One-Time Password Autofill","A mobile keyboard feature that reads a verification code from an incoming text message and offers it above the keyboard for one-tap entry.",0,[840,2046,861]],["Haptic Touch","Apple's press-and-hold gesture, paired with a haptic pulse, that replaced the pressure-sensitive 3D Touch from 2018 onward to reveal previews and quick actions.",0,[287,870,863]],["Offline Indicator","A persistent banner or icon signalling that a device or app has lost connectivity, so a user understands why actions are queuing rather than sending.",0,[1589,339,808,930]],["App Shortcut","A quick action exposed by long-pressing an app icon, jumping straight to a specific screen or task without navigating the app's normal flow.",0,[489,869,280,1095]],["Gesture Conflict","The failure case where a system-level gesture, such as an edge swipe for Back, overlaps an app's own gesture in the same screen region.",0,[287,868,1000,1014]],["Fat-Finger Problem","The mis-tap that results when a touch target sits too small or too close to its neighbours for a fingertip to select reliably.",0,[863,1268,1271,1276]],["Safe Area","The region of a screen guaranteed clear of a device's notch, camera cutout or rounded corners, which app layouts must inset content within.",0,[1321,1454,296,810]],["App Clip","A lightweight, installation-free slice of a full app, launched from a code, link or tap, that Apple introduced in 2020 for one-off tasks like paying for parking.",0,[184]],["Live Activity","A real-time, glanceable update, such as a delivery's progress, that an app posts to the lock screen and Dynamic Island without staying open, introduced by Apple in 2022.",0,[888,892,1011,1006]],["App Switcher","The system view showing recently used apps as a scrollable stack of live previews, letting a user jump between or swipe away running apps.",0,[1091,160]],["Heads-Up Display","The persistent overlay of health, ammo, map and status indicators drawn over a game's action, named after the fighter-pilot displays it visually echoes.","HUD",[958,54,61,86]],["Diegetic Interface","A game interface rendered as an object that exists inside the game world itself, such as an ammo count etched onto a character's own weapon.",0,[907]],["Non-Diegetic UI","A game interface drawn as a flat overlay the player sees but the character does not, such as a health bar floating outside the fiction of the world.",0,[916,906]],["Game Feel","The tactile, moment-to-moment quality of controlling a game, built from response timing, animation and feedback rather than from any single visible element.",0,[233,35,2195]],["Juiciness","Layering exaggerated, non-essential feedback, such as screen shake, particles and sound, onto an action so it feels satisfying beyond its mechanical effect alone.",0,[233,941]],["Tutorial Level","A designed early stage that teaches core mechanics through guided play rather than an explanatory text screen, letting the rules land through doing."],["Achievement System","A set of defined optional goals a game tracks and rewards with a badge or point, popularised at scale by Xbox Live's Gamerscore in 2005.",0,[480]],["Progression System","The structured sequence by which a player's power, options or content unlock over time, giving continued play a visible sense of advancement."],["Streak","A count of consecutive days or sessions a player has returned, displayed to reward and pressure continued engagement, an interface pattern games and apps both now use."],["Skill Tree","A branching diagram of unlockable abilities a player spends earned points to progress through, letting them shape a character's growth deliberately.",0,[1555,1178]],["Minimap","A small, always-visible overhead map in a screen corner, showing a compressed view of the player's surroundings without switching away from the main view."],["Health Bar","A depleting meter representing a character's remaining vitality, one of the oldest and most legible status indicators in interactive game design.",0,[907,1659]],["Radial Menu","A circular menu arranged around a central point, letting a controller's stick select an option by direction rather than by scrolling a list.",0,[276]],["Virtual Joystick","An on-screen touch control that simulates a physical analogue stick, tracking a thumb's drag from an anchor point to output directional movement.",0,[480,1385,1518,2064]],["Quick-Time Event","A prompt requiring a precisely timed button press during a cinematic or action sequence, blending scripted spectacle with a moment of direct player input."],["Checkpoint","A saved point in a level a player returns to on failure, sparing them from replaying an entire stage after a single mistake.",0,[1555,236,1230,2121]],["Difficulty Curve","The planned rate at which a game's challenge increases across its length, tuned so a player's skill keeps pace with what is being asked of them.",0,[1555,922,562,571]],["Dynamic Difficulty Adjustment","A system that raises or lowers a game's challenge in real time based on a player's measured performance, rather than a fixed setting chosen upfront.",0,[921,1897,432,888]],["Assist Mode","A set of optional toggles, such as slower enemies or unlimited retries, that let a player reshape a game's challenge to their own needs without a separate easy mode."],["Fog of War","A map-obscuring overlay that hides areas a player has not yet explored or currently cannot see, revealing terrain and units only within scouted range."],["Easter Egg","A hidden feature, message or joke placed deliberately for players to discover, unconnected to core mechanics and rewarding curiosity for its own sake."],["Photo Mode","A suspended, camera-only state that lets a player pause the action to frame, filter and capture a screenshot from any angle.",0,[181]],["Onboarding-by-Play","Teaching a game's rules by placing a player inside a controlled situation that forces the mechanic to be used, rather than describing it in a menu.",0,[599,603,604,614]],["Experience Points","A numeric tally earned through play that accumulates toward levelling up, a reward structure that originated in tabletop role-playing games and became a default game-interface element.","XP",[1072,2,600,2068]],["Quest Log","A persistent list tracking a player's active and completed objectives, letting them step away from a long game and recall exactly what remains to do.",0,[1555,480]],["Cooldown Indicator","A radial or bar-shaped overlay on an ability icon showing the time remaining before it can be used again, preventing a player from mistiming a press.",0,[339,808,897,986]],["Save State","A complete snapshot of a game's exact runtime condition, letting a player resume from that precise instant rather than from a designed checkpoint.",0,[920]],["Konami Code","A fixed button sequence, up up down down left right left right B A, first hidden in Gradius in 1986, that became shorthand for any secret unlock code."],["Emote","A short animated gesture or expression a player triggers on demand to communicate mood or intent to others without using text or voice chat.",0,[287]],["Kill Feed","A running log at a screen's edge announcing eliminations as they happen, giving players situational awareness of a multiplayer match beyond their own view.",0,[983,2128]],["Combo Meter","A counter tracking consecutive successful hits or actions without a break, rewarding sustained skill with an escalating score or visual flourish.",0,[480,1704,355]],["Loading-Screen Tip","A rotating hint or lore fragment displayed during a load, using otherwise dead waiting time to teach mechanics or deepen the game's world.",0,[1493,1561]],["Rubber-Banding","A catch-up mechanic that boosts a losing player's performance and slows a leading one, keeping a race or match artificially close to the end.",0,[479,107,153,300]],["Playful Error States","Turning an unavoidable failure or empty state into a moment of delight, such as a mascot animation on a 404 or a witty loss screen, rather than a flat message.",0,[592,1543]],["Score Popup","A number that appears and floats briefly away from the point of an action, such as a hit or pickup, confirming its exact value at a glance.",0,[1888,2153,2255,718]],["Hit-Stop","A brief freeze of the game's action on impact, lasting only a few frames, used to give a hit weight and force before motion resumes.",0,[1032]],["Screen Shake","A brief, controlled jolt of the camera on a significant impact or explosion, one of the most recognisable techniques for adding juice to an action.",0,[909,578,886,1493]],["New Game+","A replay mode that restarts a game's story while letting the player carry over levels, gear or currency earned in a completed prior playthrough.",0,[2195]],["Pause Menu","The menu a game suspends into when play is halted, gathering settings, inventory and quit options in one place reachable from anywhere in a session.",0,[2162]],["Conversation Design","The discipline of scripting a voice or chat system's dialogue flow, including its persona, error handling and turn structure, as a designed craft distinct from writing UI copy.",0,[675,1886,1041]],["Turn-Taking","The mechanics governing when a voice system yields the floor to a user and reclaims it, modelled on the timing cues of human conversation."],["Barge-In","A voice interface's ability to accept new user speech while it is still talking, letting a user interrupt a long response instead of waiting it out.",0,[1896]],["Wake Word","A spoken trigger phrase, such as a device's name, that switches a voice assistant from passive listening into active command mode.",0,[951]],["Earcon","A short, abstract musical or synthetic sound assigned a specific meaning by convention, such as a rising chime for success, rather than mimicking a real-world noise."],["Auditory Icon","A short sound that represents an action by resembling its real-world equivalent, such as a crumpling noise for deleting a file, William Gaver's 1986 counterpart to the abstract earcon."],["Conversational Repair","The mechanism by which a voice or chat system recovers from a misunderstood input, asking a targeted clarifying question rather than failing silently or restarting.",0,[20,1916]],["Voice Assistant","Software that accepts spoken natural-language input and responds with speech or action, spanning phone, smart-speaker and in-car implementations.",0,[953,971,176,177]],["Interactive Voice Response","A phone-based system that routes callers through spoken or keypad menus to a destination or automated answer, the legacy voice interface most consumer voice design now tries to improve on.","IVR",[1896,57,1643,1654]],["Smart Speaker","A voice-controlled standalone device built around a built-in assistant, popularised by Amazon Echo's 2014 launch as a household's ambient point of voice access.",0,[177,951,1379,1102]],["Multimodal Interaction","Combining two or more input or output channels, such as voice, gesture and screen, within a single interaction so each covers the others' weaknesses.",0,[287,32,1056,1466]],["Tangible User Interface","A physical object whose manipulation directly controls digital information, a form Hiroshi Ishii's MIT Tangible Media Group formalised through the 1990s.","TUI",[1204]],["Ambient Display","A low-attention display that presents information through peripheral cues, such as colour or motion, readable at a glance without demanding focused attention.",0,[583,54,61,86]],["Calm Technology","A design philosophy, articulated by Mark Weiser and John Seely Brown at Xerox PARC in 1995, that a good interface should engage full attention only when needed and recede otherwise.",0,[1206,974]],["Glanceable Display","A screen or surface designed to communicate its core information in under a second of attention, such as a smartwatch face or a car's heads-up display.",0,[905,54,61,86]],["Complication","A small data element, such as weather or a calendar event, placed on a watch face alongside the time, a term borrowed directly from mechanical watchmaking."],["Spatial Computing","Software that places digital content within a tracked three-dimensional model of the physical room, letting objects hold a fixed position as a user moves around them.",0,[1555,480,961,962]],["Look-and-Pinch","A spatial-computing selection method that combines eye tracking to target an element with a finger pinch to confirm it, popularised by Apple Vision Pro in 2024.",0,[274,480,725,960]],["Hand Tracking","Using cameras to detect a bare hand's position and gesture as direct input, letting a spatial-computing or VR system respond without a handheld controller.",0,[287,960,963,890]],["Controller-Free Input","Any spatial-computing interaction method, such as hand tracking or gaze, that replaces a handheld controller as the primary means of pointing and selecting.",0,[480,960,962,2083]],["Passthrough","A mixed-reality mode that streams a headset's outward-facing camera feed to its internal displays, letting a wearer see and act within their real surroundings."],["Room-Scale","A VR tracking configuration that maps a user's real physical walking space, letting them move their body through a virtual environment rather than staying seated.",0,[1555,480,1579,2216]],["Teleportation Locomotion","A VR movement method that lets a user point at a destination and instantly relocate there, avoiding the discomfort continuous virtual movement can cause."],["Simulator Sickness","Nausea and disorientation caused by a mismatch between a headset's visual motion and the inner ear's sense of the body's actual stillness.",0,[981]],["Presence","The subjective sense, in a VR sense, of actually being inside a virtual environment rather than watching it, the experiential goal much of headset design chases.",0,[1494,2066,990,1010],"ux-presence"],["Automotive HMI","The dashboard and infotainment interface layer of a vehicle, designed under stricter constraints for glance duration and reachability than any handheld screen.",0,[549,865]],["Driver Distraction","The measurable diversion of attention an in-vehicle interface causes away from the road, the central constraint automotive interface design is regulated and tested against."],["Voice Persona","The consistent personality, tone and vocabulary a conversation designer assigns a voice assistant, shaping how trustworthy or approachable it feels across every exchange.",0,[951,675,689]],["Speech Error Recovery","The scripted fallback path a voice system follows after failing to recognise input twice, typically narrowing its next prompt rather than repeating the same question.",0,[2067,2068,2207,1543]],["Graspable Interface","A tangible-interface concept, close kin to Ishii's TUI work, emphasising physical handles a user grips and manipulates directly rather than objects merely sensed nearby."],["Peripheral Awareness","Information a design keeps at the edge of attention, sensed without looking directly at it, the perceptual target ambient and calm-technology displays aim for.",0,[957,990]],["Wearable Interaction","Input and output built for a body-worn device, constrained to short glances, small surfaces and often a single hand, distinct from handheld mobile design.",0,[1466,0,1,5]],["Spatial Audio Cue","A sound rendered so its perceived direction and distance match a virtual or augmented object's real position, letting hearing alone locate something off-screen.",0,[960,977]],["Spatial Window Management","The interaction model for arranging flat app windows as fixed objects in three-dimensional space, letting a user walk around, resize or pin them to a real location.",0,[1555,105,1562,1715]],["Voice-First Design","Designing a product's core interaction for speech from the outset, treating any screen as a secondary display rather than adding voice on top of a visual app."],["Projection Mapping","Calibrating a video projector's output to a physical object's exact surface geometry, turning an irregular real-world shape into a display."],["Gaze Target","The element an eye-tracking or head-tracking system currently registers as being looked at, the unit spatial and AR interfaces use to resolve where attention is pointed.",0,[480,725,809,863]],["Comfort Zone","The tested range of virtual camera movement, rotation speed and field of view a VR experience stays within to avoid triggering simulator sickness in most users.",0,[967,2017,2093]],["Real-Time Collaboration","Multiple users editing the same document simultaneously with each other's changes appearing live, the baseline expectation modern cloud productivity tools set after Google Docs' 2006 launch.",0,[1019,60,458,2144]],["Multiplayer","The product framing, popularised by Figma from 2016, of a design or document tool as a shared live space several people inhabit at once rather than a single-user file.",0,[2368,934,1203,1009],"ux-presence"],["Live Cursors","Other users' pointer positions rendered on screen in real time, each labelled with a name or colour, showing exactly where every collaborator is currently working.",0,[985,269,2420,270],"ux-presence"],["Cursor Chat","A message typed to appear briefly beside a user's own live cursor, a Figma feature letting collaborators converse in-context without opening a separate chat panel.",0,[984,2420,270,1024]],["Presence Indicator","A small badge or dot showing which collaborators currently have a document open, distinguishing who is actively present from who merely has access.",0,[968,339,808,897]],["Avatar Stack","A row of overlapping circular user photos or initials showing everyone present in or with access to a document, compressed into one glanceable cluster.",0,[1010,376,2155,473]],["Following Mode","A view state where one user's screen tracks another's viewport and selection automatically, useful for one person to walk a group through a document live.",0,[274,480,556,1045]],["Co-Editing","Two or more users directly modifying the same content region at once, with each edit merged and reflected to every participant without an explicit save step.",0,[84,1054]],["Collaborative Awareness","The broad category of interface cues, cursors, presence and selection highlights, that let one collaborator sense what another is doing without asking them directly.",0,[1555,274,968,1017]],["Comment Thread","A pinned, ongoing conversation attached to a specific point in a document, keeping feedback anchored to the content it discusses rather than scattered in chat.",0,[233,992,1272,1487]],["Annotation","A note, mark-up or highlight added directly onto content to flag, explain or question something, distinct from a comment thread's separate conversational format.",0,[991,2369,601,740]],["@Mention","Typing an at-symbol followed by a name inside a comment or message to notify that specific person directly, a convention Twitter popularised from 2007 that spread into every collaboration tool."],["Emoji Reaction","A single-tap symbol attached to a comment or message to acknowledge it without writing a reply, reducing low-value notification traffic in busy threads.",0,[132,178]],["Suggestion Mode","An editing state where a collaborator's changes are recorded as proposals for the document owner to accept or reject, rather than applied immediately.",0,[996,325,1029,1045]],["Track Changes","A document mode that visibly marks every insertion and deletion by author, a Microsoft Word feature since the 1990s that suggestion mode in newer tools descends from.",0,[995,1254,2233,1624]],["Version History","A stored sequence of a document's past states, letting a user browse, compare and restore an earlier point without depending on manual file copies.",0,[998,1013,1019,19]],["Named Version","A version-history entry a user deliberately labels and pins, such as 'Client-approved draft', distinguishing a meaningful milestone from routine autosaved checkpoints.",0,[997,920,1254,1623]],["Design Branching","Creating a separate, parallel copy of a design file to explore changes in isolation, mirroring code branching so experiments don't disrupt the shared main file.",0,[2120,1057]],["Merge-Conflict UX","The interface a tool presents when two collaborators' simultaneous edits to the same content cannot both apply automatically, asking a user to resolve the clash.",0,[899,1014,1255]],["Operational Transformation","An algorithm that reconciles concurrent edits from multiple users into one consistent document by transforming each operation against the others in sequence, developed from the late 1980s.","OT",0,"ux-ot-crdt"],["Document Locking","Restricting a file or section to one editor at a time, preventing simultaneous changes by making every other user wait rather than merging concurrent edits.",0,[1262,1499,2363]],["Share Link","A URL that grants access to a specific document, generated on demand and configurable for permission level, replacing manual invitation by email address.",0,[1016,161,858,1008]],["Access Level","The tier of permission, such as view, comment or edit, assigned to a person or link on a shared document, controlling what they can do inside it."],["Guest Access","Permission granted to a person outside an organisation's own account system to view or edit a specific shared document without a full membership."],["Activity Feed","A chronological log of who did what to a shared document or workspace, letting a returning collaborator catch up on changes made while they were away.",0,[1010,903]],["Screen Sharing","Broadcasting a live view of one participant's screen to others in a call, letting a group look at the same application state together in real time.",0,[2445,1493,1561]],["Live Share","A collaboration mode, notably Microsoft's Visual Studio Code extension from 2019, that lets remote participants edit and debug the same running session together rather than only view it.",0,[161,858,1003]],["Multiplayer Undo","An undo command scoped to a single user's own edits within a shared document, reverting their last change without discarding a collaborator's concurrent work.",0,[983]],["Agent as Collaborator","An AI agent surfaced through the same presence, cursor and edit-attribution interface as a human teammate, appearing in the avatar stack and activity feed alongside real collaborators.",0,[968,987,1006]],["Spotlight Mode","A presentation state that shows only one presenter's cursor and view to everyone else in a session, temporarily suppressing other participants' own live activity.",0,[903]],["Observation Mode","A read-only presence state letting a user watch a document or session update live without their own cursor or edits appearing to other collaborators.",0,[968]],["Restore Point","A specific saved state in a document's version history a user can revert the entire file to, discarding every change made after that point.",0,[997,2068,2192,271]],["Conflict Resolution Dialog","A prompt shown when a merge cannot resolve automatically, presenting both conflicting versions side by side and asking the user to choose or combine them.",0,[1555,1950,899,1000]],["Locking vs Merging","The core design choice a collaborative tool makes between preventing simultaneous edits outright with locking and reconciling them automatically with merge logic.",0,[1555]],["Link Expiry","A time limit or manual revocation set on a share link, after which it stops granting access, letting temporary collaborators lose entry automatically.",0,[1003,860]],["Audit Trail","A permanent, timestamped record of every access and change made to a document, kept for accountability and compliance rather than everyday collaborative awareness.",0,[990,1581,751]],["Handoff Between Devices","A collaboration session or document state that transfers seamlessly from one of a user's devices to another, resuming exactly where the previous device left off.",0,[1452,1239,1559,1915]],["Async Collaboration","Working on a shared document or thread with contributions arriving at different times rather than simultaneously, relying on comments and version history instead of live presence.",0,[968,997,982,1684]],["Huddle","A lightweight, low-friction audio or video call launched directly from within a workspace tool, a term Slack popularised from 2022 for quick ad hoc conversation."],["Read Receipt","A marker showing that a specific collaborator has seen a message, comment or document update, distinct from merely having access to it."],["Away Status","A presence state signalling that a collaborator, though technically still connected, has stepped away from active participation in the current session.",0,[968,247,773,889]],["Co-Browsing","A shared browsing session where a support agent or collaborator can see and sometimes control the same web page a user is viewing in real time."],["Chat as Interface","Using a single scrolling conversational thread as a product's entire interaction surface, replacing dedicated screens and menus with natural-language requests and replies.",0,[276,985]],["Prompt Box","The text input field where a user types a request to a model, the composer that has become the primary entry point of AI-native software.",0,[1232,1240,1243,1253]],["Prompt Starter","A pre-written example request shown in an empty chat state, giving a new user a concrete first move rather than a blank box and no direction.",0,[1232,1240,1243,1253]],["Suggested Prompt","A contextually generated follow-up request offered after a response, letting a user tap to continue rather than composing their next message from scratch.",0,[1232,1240,1243,1253]],["Ghost Text","Faint, provisional text a system inserts ahead of the cursor as a suggested continuation, dismissed by continuing to type or accepted with a single keypress.",0,[1030,305]],["Inline Suggestion","A completion offered directly within the content a user is editing, rather than in a separate panel, so accepting it requires no context switch.",0,[325,995,1045,370]],["Tab to Accept","The convention of pressing Tab to commit a shown ghost-text suggestion, popularised by GitHub Copilot's 2021 code-completion interface and now standard across AI writing tools.",0,[2421,1028]],["Streaming Response","A model's output displayed word by word as it is generated rather than only once complete, letting a user start reading before the full answer finishes.",0,[1695,1643,1654,1658]],["Stop Generation","A control that halts a model's in-progress response immediately, letting a user cut off an answer already going the wrong direction without waiting it out.",0,[1477,1635,1716,1892]],["Regenerate","A control that discards a model's response and requests a fresh attempt at the same prompt, used when the first answer missed the mark."],["Model Picker","A control letting a user choose which underlying model handles their request, trading off among speed, cost and capability for the task at hand.",0,[356,388,389,450]],["Reasoning Disclosure","Surfacing a model's intermediate working, summarised or in full, alongside its final answer, so a user can judge how a conclusion was reached.",0,[212,377,1044,1063]],["Citation Chip","A small clickable marker attached to a claim in a generated response that links to the specific source it was drawn from.",0,[1883,1050,373]],["Confidence Indicator","A visual signal, such as a badge or shading, conveying how certain a system is about a specific generated answer, distinct from a raw numeric score.",0,[1508,1888,339,808]],["Artifact Pane","A dedicated side panel that renders a substantial generated output, such as code or a document, separately from the conversational thread that produced it.",0,[1070]],["Diff Preview","A side-by-side or inline view highlighting exactly what a proposed AI edit would change in a document or file before the user commits to it.",0,[2105,851,1264,2236]],["Voice Mode","A conversational AI interaction mode conducted by speech instead of typing, exchanging spoken turns with the system in place of a text thread."],["Conversation History","A saved, browsable list of a user's past chat sessions with a system, letting them return to and resume any earlier thread.",0,[1555,1886,944,19]],["Memory Indicator","A signal showing that a system has stored a detail from a past interaction and is drawing on it now, distinguishing recalled context from freshly stated input.",0,[1508,339,808,897]],["Feedback Buttons","Thumbs-up and thumbs-down controls attached to a generated response, letting a user rate its quality with a single tap to inform future output.",0,[233,563,870,110]],["Disclosure of AI","Labelling content, wholly or partly generated by a model, as such at the point a user encounters it, rather than presenting it as unmarked human output.",0,[212,377,1035,1063]],["Follow-Up Suggestion","A next-step prompt a system offers after answering, anticipating what a user might reasonably ask next given the response just given.",0,[325,995,1029,556]],["Agent Status Display","A running indicator showing what an autonomous agent is currently doing, such as searching or writing code, while a longer task executes.",0,[54,61,86,168]],["Takeover Handoff","The interface moment where an autonomous agent pauses and returns control to the user, typically flagging why it stopped and what input it needs.",0,[2047,1239,1559,1915]],["Autonomy Slider","A control letting a user set how independently an agent may act before checking back in, ranging from step-by-step confirmation to full unsupervised execution.",0,[1234,353,386]],["Response Variant","One of several alternative answers a system generates for a single prompt, presented for a user to compare and pick the strongest from.",0,[1576,1643,1654,1658]],["Inline Citation","A source reference embedded directly within generated text at the point of the claim it supports, rather than collected in a separate list at the end.",0,[1883,1036,370,1029]],["Uncertainty Communication","Language and interface cues a system uses to flag a low-confidence or unverifiable claim explicitly, rather than presenting every statement with equal assurance.",0,[1618,457,823]],["Review Step","A pause point requiring an explicit user confirmation before an AI-proposed action, such as sending an email or deleting a file, actually executes.",0,[1264,1597,2292,656]],["Canvas Pattern","A persistent, directly editable workspace paired with a chat thread, letting a user revise an AI-generated document in place rather than through further prompting alone.",0,[418]],["Inline Edit with AI","Selecting a span of existing content and issuing a natural-language instruction to revise just that selection, without leaving the surrounding document.",0,[274,370,1029,1050]],["Prompt Rewriting UI","A control offering to expand, clarify or restructure a user's own draft prompt before it is sent, improving output without the user needing to learn prompting technique.",0,[1898,1232,1240,1243]],["Multimodal Attachment","A non-text file, such as an image, PDF or audio clip, attached to a prompt so a model can reason over its content alongside written instructions.",0,[32,954]],["Thread Branching","Forking a conversation at an earlier message to explore a different follow-up direction, keeping the original path intact rather than overwriting it.",0,[2120,999,1272,1487]],["Context-Window Indicator","A visual gauge showing how much of a model's available context capacity the current conversation has consumed, warning a user before older content drops out.",0,[339,808,897,930]],["Token Counter","A running tally of how many tokens a prompt or response has used, surfaced to a user managing cost or a hard context limit.",0,[854]],["Rate-Limit Message","A notice informing a user they have hit a usage cap and must wait or upgrade before sending another request, rather than the system failing silently.",0,[1625,1648,1787,1789]],["AI Watermark","An imperceptible signal embedded in generated media, such as Google DeepMind's SynthID, that lets a downstream tool verify the content's AI origin.",0,[1508,1930]],["Step-by-Step Plan Display","A visible outline an agent produces before acting, listing the sequence of actions it intends to take so a user can review the approach up front.",0,[54,61,86,168]],["Tool-Use Disclosure","Surfacing which external tool or function an agent invoked mid-task, such as a search or code execution, rather than presenting the result as if reasoned alone.",0,[212,377,1035,1044]],["Live Browser View","A real-time visible feed of the web page or screen an agent is currently operating, letting a user watch a computer-use task unfold as it happens.",0,[827,833]],["Grounded Answer UI","A response layout that visually ties each generated statement back to a retrieved source passage, distinguishing model-grounded claims from unsupported ones.",0,[192]],["Adaptive Interface","An interface that automatically changes its own layout, content or options in response to observed usage, rather than staying fixed until a user manually adjusts it.",0,[2050,410,884,1067]],["Adaptive Menu","A menu that hides infrequently used items and surfaces frequent ones, a feature Microsoft Office 2000 shipped and largely retreated from after users found it unpredictable.",0,[2050,410,884,1066]],["Mixed-Initiative Interaction","An interaction model, framed by Eric Horvitz in 1999, where a system and a user both contribute initiative, each able to act or suggest without waiting on the other.",0,[1466,0,1,5]],["Customisation","A user's deliberate, manual reconfiguration of an interface's appearance or behaviour, distinct from a system adapting itself automatically on the user's behalf.",0,[1070,1098]],["Preference Pane","A dedicated settings screen grouping a related set of configurable options, the standard container macOS and most desktop software use to organise customisation.",0,[1069,1569,1156,1087]],["Sensible Default","A pre-set option value chosen to suit the largest share of users without any configuration, the setting that quietly does the most design work in any product.",0,[1454,1956,246,1072]],["Default","The value or state a system starts in befor
