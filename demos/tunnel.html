<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;}
  canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;}
  #ui{position:fixed;top:10px;left:12px;z-index:10;font:12px/1.5 monospace;
      color:#9ef;background:rgba(0,0,0,.35);padding:8px 10px;
      border:1px solid rgba(120,220,255,.22);border-radius:4px;pointer-events:none;}
  #ui .t{color:#fff;font-weight:bold;letter-spacing:1px;}
  #ui a{color:#6cf;pointer-events:auto;text-decoration:none;}
  #ui a:hover{color:#bff;}
</style>
<canvas id="c"></canvas>
<div id="ui">
  <div class="t">INFINITE TUNNEL</div>
  <div>move mouse: steer &nbsp;·&nbsp; wheel: speed</div>
  <div><a href="index.html">&larr; gallery</a></div>
</div>
<script>
var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if(!gl){ throw new Error('WebGL not available'); }

var VS = [
'attribute vec2 p;',
'void main(){ gl_Position = vec4(p,0.0,1.0); }'
].join('\n');

var FS = [
'precision highp float;',
'uniform vec2 res;',
'uniform float time;',
'uniform vec2 mouse;',
'uniform float speed;',
'float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }',
'float noise(vec2 p){',
'  vec2 i=floor(p); vec2 f=fract(p);',
'  f=f*f*(3.0-2.0*f);',
'  float a=hash(i);',
'  float b=hash(i+vec2(1.0,0.0));',
'  float c=hash(i+vec2(0.0,1.0));',
'  float d=hash(i+vec2(1.0,1.0));',
'  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);',
'}',
'float fbm(vec2 p){',
'  float v=0.0, a=0.5;',
'  for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.02; a*=0.5; }',
'  return v;',
'}',
'vec3 pal(float t){',
'  return 0.5+0.5*cos(6.28318*(vec3(1.0,1.0,1.0)*t)+vec3(0.0,2.1,4.2));',
'}',
'void main(){',
'  vec2 uv=(gl_FragCoord.xy*2.0-res)/res.y;',
'  uv-=mouse*0.55;',
'  float r=length(uv);',
'  float a=atan(uv.y,uv.x);',
'  float depth=1.0/(r+0.04);',
'  float z=depth*0.55+time*speed;',
'  float u=a/6.28318;',
'  float rings=sin(z*6.0)*0.5+0.5;',
'  float n=fbm(vec2(u*10.0, z*1.4));',
'  float bands=smoothstep(0.86,1.0, sin(z*2.3 - time*3.0 + u*6.28318)*0.5+0.5);',
'  float pat=rings*0.5 + n*0.7 + bands*1.1;',
'  vec3 col=pal(z*0.045 + time*0.04 + pat*0.18);',
'  col*=0.45+pat;',
'  col+=bands*vec3(1.0,0.75,0.45);',
'  float fog=smoothstep(0.0,1.15,r);',
'  col*=fog;',
'  col=pow(max(col,0.0), vec3(0.85));',
'  gl_FragColor=vec4(col,1.0);',
'}'
].join('\n');

function compile(type, src){
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}
function link(vs, fs){
  var p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    throw new Error(gl.getProgramInfoLog(p));
  }
  return p;
}

var prog = link(VS, FS);
gl.useProgram(prog);

var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
var loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

var uRes = gl.getUniformLocation(prog, 'res');
var uTime = gl.getUniformLocation(prog, 'time');
var uMouse = gl.getUniformLocation(prog, 'mouse');
var uSpeed = gl.getUniformLocation(prog, 'speed');

var mouse = [0,0], mtarget = [0,0];
var speed = 1.6;

function resize(){
  var dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = Math.floor(innerWidth*dpr);
  canvas.height = Math.floor(innerHeight*dpr);
  gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener('resize', resize);
resize();

window.addEventListener('mousemove', function(e){
  mtarget[0] = (e.clientX/innerWidth)*2-1;
  mtarget[1] = -((e.clientY/innerHeight)*2-1);
});
window.addEventListener('wheel', function(e){
  e.preventDefault();
  speed += (e.deltaY>0? -0.15 : 0.15);
  if(speed<0.2) speed=0.2;
  if(speed>6.0) speed=6.0;
}, {passive:false});

var t0 = performance.now();
function frame(){
  var t = (performance.now()-t0)/1000;
  mouse[0] += (mtarget[0]-mouse[0])*0.05;
  mouse[1] += (mtarget[1]-mouse[1])*0.05;
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t);
  gl.uniform2f(uMouse, mouse[0], mouse[1]);
  gl.uniform1f(uSpeed, speed);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
frame();
</script>
