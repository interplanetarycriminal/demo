<script>window.onerror=function(m,s,l){var p=document.createElement('pre');p.style.cssText='position:fixed;bottom:0;left:0;color:#f66;background:#000d;padding:8px;z-index:999;font:12px/1.4 monospace';p.textContent=m+' @ line '+l;document.body.appendChild(p)}</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#03040a;cursor:crosshair}
  canvas{position:fixed;top:0;left:0;display:block}
  #ui{position:fixed;top:10px;left:12px;z-index:10;font:12px/1.55 monospace;
      color:#dfeaff;background:rgba(4,8,16,.36);padding:8px 11px;
      border:1px solid rgba(150,180,255,.28);border-radius:5px;pointer-events:none}
  #ui .t{color:#ffd28a;font-weight:bold;letter-spacing:1.5px}
  #ui .h{opacity:.72}
  #ui a{color:#8fbcff;pointer-events:auto;text-decoration:none}
  #ui a:hover{color:#cfe0ff}
</style>
<div id="ui">
  <div class="t">VOLUMETRIC CLOUDS</div>
  <div class="h">mouse moves sun &middot; wheel = coverage</div>
  <div><a href="index.html">&larr; gallery</a></div>
</div>
<canvas id="c"></canvas>
<script>
var canvas=document.getElementById('c');
var gl=canvas.getContext('webgl')||canvas.getContext('experimental-webgl');
if(!gl)throw new Error('WebGL not available');

function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function prog(vs,fs){var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;}

var VS='attribute vec2 a_pos;void main(){gl_Position=vec4(a_pos,0.0,1.0);}';
var FS=[
'precision highp float;',
'uniform vec2 u_res;uniform float u_time;uniform vec2 u_mouse;uniform float u_cov;',
'float hash(vec3 p){p=fract(p*0.3183099+vec3(0.1,0.2,0.3));p*=17.0;',
'  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}',
'float noise(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);',
'  return mix(mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),',
'                 mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),',
'             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),',
'                 mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}',
'float fbm(vec3 p){float s=0.0,a=0.5;for(int i=0;i<4;i++){s+=a*noise(p);p=p*2.03+vec3(1.7);a*=0.5;}return s;}',
'const float YB=2.0,YT=8.0;',
'float dens(vec3 p){',
'  p.x+=u_time*0.45; p.z+=u_time*0.12;',
'  float h=(p.y-YB)/(YT-YB);',
'  float shape=fbm(p*0.33);',
'  float d=shape-(1.0-u_cov);',
'  d*=smoothstep(0.0,0.28,h)*smoothstep(1.0,0.55,h);',   // round the slab top & base
'  return clamp(d*1.6,0.0,1.0);',
'}',
'vec3 skyCol(vec3 rd,vec3 sd,vec3 sc){',
'  float up=clamp(rd.y,0.0,1.0);',
'  vec3 horizon=vec3(0.55,0.28,0.42);',                  // dusky neon horizon
'  vec3 zenith=vec3(0.05,0.09,0.28);',                   // deep blue overhead
'  vec3 col=mix(horizon,zenith,pow(up,0.42));',
'  float s=max(dot(rd,sd),0.0);',
'  col+=sc*pow(s,1200.0)*4.0;',                          // sun disk
'  col+=sc*pow(s,7.0)*0.55;',                            // broad glow
'  col+=vec3(0.5,0.25,0.35)*pow(1.0-up,6.0)*0.4;',       // horizon haze
'  return col;}',
'vec4 march(vec3 ro,vec3 rd,vec3 sd,vec3 sc){',
'  vec4 sum=vec4(0.0);',
'  if(rd.y<0.03) return sum;',
'  float tmin=(YB-ro.y)/rd.y, tmax=(YT-ro.y)/rd.y;',
'  tmin=max(tmin,0.0); tmax=min(tmax,48.0);',
'  if(tmin>=tmax) return sum;',
'  float dt=(tmax-tmin)/30.0; float t=tmin+dt*hash(vec3(gl_FragCoord.xy,1.0));',
'  for(int i=0;i<30;i++){',
'    if(sum.a>0.98) break;',
'    vec3 pos=ro+rd*t; t+=dt;',
'    float den=dens(pos);',
'    if(den>0.01){',
'      float shd=0.0;',
'      for(int j=0;j<3;j++){shd+=dens(pos+sd*(float(j)+1.0)*0.7);}',
'      float lit=exp(-shd*0.85);',
'      vec3 base=mix(vec3(0.32,0.34,0.45),vec3(1.0,0.96,0.86),lit);',
'      base=mix(base,sc,(1.0-lit)*0.25+pow(lit,3.0)*0.35);',   // sun-tint the fluff
'      float a=den*0.85;',
'      sum.rgb+=(1.0-sum.a)*a*base;',
'      sum.a+=(1.0-sum.a)*a;',
'    }',
'  }',
'  return sum;}',
'void main(){',
'  vec2 uv=(gl_FragCoord.xy-0.5*u_res)/u_res.y;',
'  vec3 ro=vec3(0.0,1.0,0.0);',
'  vec3 fwd=normalize(vec3(0.0,0.13,1.0));',
'  vec3 rt=normalize(cross(fwd,vec3(0,1,0)));',
'  vec3 upv=cross(rt,fwd);',
'  vec3 rd=normalize(uv.x*rt+uv.y*upv+1.3*fwd);',
'  vec2 m=u_mouse;',
'  vec3 sd=normalize(vec3((m.x-0.5)*3.0,(m.y-0.5)*1.6+0.32,1.0));',
'  float sh=clamp(sd.y,0.0,1.0);',
'  vec3 sc=mix(vec3(1.0,0.32,0.16),vec3(1.0,0.95,0.82),sh);',
'  vec3 col=skyCol(rd,sd,sc);',
'  vec4 cl=march(ro,rd,sd,sc);',
'  col=col*(1.0-cl.a)+cl.rgb;',
'  col*=1.0-0.28*dot(uv,uv);',                            // vignette
'  col=pow(clamp(col,0.0,1.0),vec3(0.9));',
'  gl_FragColor=vec4(col,1.0);',
'}'].join('\n');

var program=prog(VS,FS);
var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
var aPos=gl.getAttribLocation(program,'a_pos');
var uRes=gl.getUniformLocation(program,'u_res');
var uTime=gl.getUniformLocation(program,'u_time');
var uMouse=gl.getUniformLocation(program,'u_mouse');
var uCov=gl.getUniformLocation(program,'u_cov');

var mouse=[0.62,0.34],cov=0.52;
window.addEventListener('mousemove',function(e){
  mouse[0]=e.clientX/innerWidth;mouse[1]=1.0-e.clientY/innerHeight;});
window.addEventListener('wheel',function(e){
  cov=Math.max(0.28,Math.min(0.82,cov-e.deltaY*0.0006));e.preventDefault();},{passive:false});
window.addEventListener('touchmove',function(e){var t=e.touches[0];
  mouse[0]=t.clientX/innerWidth;mouse[1]=1.0-t.clientY/innerHeight;},{passive:true});

function resize(){var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=Math.floor(innerWidth*dpr),h=Math.floor(innerHeight*dpr);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  gl.viewport(0,0,w,h);}

function frame(now){
  resize();gl.useProgram(program);
  gl.enableVertexAttribArray(aPos);
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
  gl.uniform2f(uRes,canvas.width,canvas.height);
  gl.uniform1f(uTime,now*0.001);
  gl.uniform2f(uMouse,mouse[0],mouse[1]);
  gl.uniform1f(uCov,cov);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
