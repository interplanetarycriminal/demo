<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="background:#EEEBE4">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
  <div style="background:#fff;border-radius:12px;height:80px;box-shadow:0 1px 2px rgba(0,44,77,0.06);display:flex;align-items:flex-end;justify-content:center;padding:8px;font-size:11px;color:#667281">xs</div>
  <div style="background:#fff;border-radius:12px;height:80px;box-shadow:0 1px 3px rgba(0,44,77,0.08),0 1px 2px rgba(0,44,77,0.04);display:flex;align-items:flex-end;justify-content:center;padding:8px;font-size:11px;color:#667281">sm · card</div>
  <div style="background:#fff;border-radius:12px;height:80px;box-shadow:0 4px 10px rgba(0,44,77,0.08),0 2px 4px rgba(0,44,77,0.04);display:flex;align-items:flex-end;justify-content:center;padding:8px;font-size:11px;color:#667281">md · hover</div>
  <div style="background:#fff;border-radius:12px;height:80px;box-shadow:0 12px 24px rgba(0,44,77,0.10),0 4px 8px rgba(0,44,77,0.04);display:flex;align-items:flex-end;justify-content:center;padding:8px;font-size:11px;color:#667281">lg · modal</div>
</div>
<div class="label" style="margin-top:14px">Elevation — shadows tinted navy, never black</div>
</div></body></html>
