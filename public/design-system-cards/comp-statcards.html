<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div class="label">Stat cards — dashboard signature</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
  <div style="background:#fff;border-radius:20px;padding:16px;box-shadow:0 1px 3px rgba(0,44,77,0.08)">
    <div style="font-size:12px;color:#667281;font-weight:600">Total Native Fish</div>
    <div style="font-size:40px;font-weight:700;color:#002C4D;line-height:1;margin:6px 0">50</div>
    <span style="display:inline-block;background:#E5F4E5;color:#2E7A2E;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700">Optimal Count</span>
  </div>
  <div style="background:#fff;border-radius:20px;padding:16px;box-shadow:0 1px 3px rgba(0,44,77,0.08)">
    <div style="font-size:12px;color:#667281;font-weight:600">Total Pest Fish</div>
    <div style="font-size:40px;font-weight:700;color:#002C4D;line-height:1;margin:6px 0">150</div>
    <span style="display:inline-block;background:#FBE1DA;color:#A03418;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700">Action Needed</span>
  </div>
  <div style="background:#fff;border-radius:20px;padding:16px;box-shadow:0 1px 3px rgba(0,44,77,0.08)">
    <div style="font-size:12px;color:#667281;font-weight:600">Grand Total Fish</div>
    <div style="font-size:40px;font-weight:700;color:#002C4D;line-height:1;margin:6px 0">200</div>
    <span style="display:inline-block;background:#E5F4E5;color:#2E7A2E;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700">Stable Status</span>
  </div>
</div>
</div></body></html>
