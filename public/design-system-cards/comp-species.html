<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div class="label">Species tile — real photo, not illustration</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  <div style="background:#fff;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 3px rgba(0,44,77,0.08)">
    <div style="width:54px;height:54px;border-radius:999px;background-image:url('../assets/ref/pond-info-2.jpg');background-size:400px;background-position:-40px -160px;flex-shrink:0;border:2px solid #fff;box-shadow:0 0 0 1px #E5E8EC"></div>
    <div>
      <div style="font-size:13px;font-weight:700;color:#002C4D">Native Eel-Tailed Catfish</div>
      <div style="font-size:12px;color:#667281">Benthic feeder. <b style="color:#002C4D">Count: 12</b></div>
    </div>
  </div>
  <div style="background:#fff;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 3px rgba(0,44,77,0.08)">
    <div style="width:54px;height:54px;border-radius:999px;background-image:url('../assets/ref/pond-info-2.jpg');background-size:400px;background-position:-230px -380px;flex-shrink:0;border:2px solid #fff;box-shadow:0 0 0 1px #E5E8EC"></div>
    <div>
      <div style="font-size:13px;font-weight:700;color:#002C4D">Pest Carp</div>
      <div style="font-size:12px;color:#667281">Upsets substrate. <b style="color:#A03418">Count: 40</b></div>
    </div>
  </div>
</div>
<div style="font-size:11px;color:#667281;margin-top:10px">Rule: fish + species = real photograph, circular crop. Never illustrated, never emoji.</div>
</div></body></html>
