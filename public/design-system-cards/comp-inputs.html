<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div class="label">Form inputs — 8px radius, 1px neutral border, focus = blue ring</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  <div>
    <div style="font-size:12px;color:#475260;font-weight:600;margin-bottom:4px">Source</div>
    <div style="background:#fff;border:1px solid #D4D9DF;border-radius:8px;padding:10px 12px;font-size:14px;color:#002C4D">Hinze Dam, Main Reach ▾</div>
  </div>
  <div>
    <div style="font-size:12px;color:#475260;font-weight:600;margin-bottom:4px">Date range</div>
    <div style="background:#fff;border:1.5px solid #00A9E0;border-radius:8px;padding:9.5px 12px;font-size:14px;color:#002C4D;box-shadow:0 0 0 3px rgba(0,169,224,0.25)">14/04/2026 – 20/04/2026</div>
  </div>
  <div>
    <div style="font-size:12px;color:#475260;font-weight:600;margin-bottom:4px">Search</div>
    <div style="background:#F6F7F8;border:1px solid #E5E8EC;border-radius:8px;padding:10px 12px;font-size:14px;color:#8A95A2">Species, sensor, zone…</div>
  </div>
  <div>
    <div style="font-size:12px;color:#475260;font-weight:600;margin-bottom:4px">Notes</div>
    <div style="background:#fff;border:1px solid #D4D9DF;border-radius:8px;padding:10px 12px;font-size:14px;color:#002C4D;min-height:40px">Sensor 04 flagged for recalibration.</div>
  </div>
</div>
</div></body></html>
