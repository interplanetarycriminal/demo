<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-items:end">
  <div style="text-align:center"><div style="width:64px;height:48px;border-radius:4px;background:#00A9E0;margin:0 auto 8px"></div><div style="font-size:11px;color:#667281">sm · 4px</div></div>
  <div style="text-align:center"><div style="width:64px;height:48px;border-radius:8px;background:#00A9E0;margin:0 auto 8px"></div><div style="font-size:11px;color:#667281">md · 8px · inputs</div></div>
  <div style="text-align:center"><div style="width:64px;height:48px;border-radius:12px;background:#00A9E0;margin:0 auto 8px"></div><div style="font-size:11px;color:#667281">lg · 12px · cards</div></div>
  <div style="text-align:center"><div style="width:64px;height:48px;border-radius:16px;background:#00A9E0;margin:0 auto 8px"></div><div style="font-size:11px;color:#667281">xl · 16px</div></div>
  <div style="text-align:center"><div style="width:64px;height:48px;border-radius:20px;background:#00A9E0;margin:0 auto 8px"></div><div style="font-size:11px;color:#667281">2xl · 20px · stats</div></div>
  <div style="text-align:center"><div style="width:64px;height:48px;border-radius:999px;background:#00A9E0;margin:0 auto 8px"></div><div style="font-size:11px;color:#667281">pill · buttons</div></div>
</div>
<div class="label" style="margin-top:14px">Radii — rounded but never bubbly</div>
</div></body></html>
