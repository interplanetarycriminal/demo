<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div class="label">Semantic status — pills used on dashboards</div>
<div class="row">
  <div class="swatch dark" style="background:#E5F4E5;flex:1;border-color:#3E9A3E"><div class="name">Good</div><div class="hex">bg #E5F4E5 · fg #3E9A3E</div></div>
  <div class="swatch dark" style="background:#FCEBDB;flex:1;border-color:#E98320"><div class="name">Warn / Monitor</div><div class="hex">bg #FCEBDB · fg #E98320</div></div>
  <div class="swatch dark" style="background:#FBE1DA;flex:1;border-color:#E04A2F"><div class="name">Action Needed</div><div class="hex">bg #FBE1DA · fg #E04A2F</div></div>
  <div class="swatch light" style="background:#C8102E;flex:1"><div class="name">Emergency (reserved)</div><div class="hex">#C8102E</div></div>
</div>
<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
  <span style="display:inline-flex;align-items:center;gap:6px;background:#E5F4E5;color:#2E7A2E;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700">● Optimal Count</span>
  <span style="display:inline-flex;align-items:center;gap:6px;background:#E5F4E5;color:#2E7A2E;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700">● Stable Status</span>
  <span style="display:inline-flex;align-items:center;gap:6px;background:#FCEBDB;color:#B26410;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700">● Monitor</span>
  <span style="display:inline-flex;align-items:center;gap:6px;background:#FBE1DA;color:#A03418;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700">● Action Needed</span>
  <span style="display:inline-flex;align-items:center;gap:6px;background:#FBE1DA;color:#A03418;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700">● Active Containment</span>
</div>
</div></body></html>
