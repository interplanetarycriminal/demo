<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div class="label">Buttons — capsule, blue-on-white primary, ALL-CAPS for emergency</div>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
  <button style="background:#00A9E0;color:#fff;border:none;border-radius:999px;padding:10px 20px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer">See more</button>
  <button style="background:#003A5D;color:#fff;border:none;border-radius:999px;padding:10px 20px;font-weight:700;font-size:14px;font-family:inherit">View results list (19)</button>
  <button style="background:#fff;color:#0095C8;border:1.5px solid #00A9E0;border-radius:999px;padding:9px 20px;font-weight:700;font-size:14px;font-family:inherit">Filters</button>
  <button style="background:#C8102E;color:#fff;border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:12px;letter-spacing:0.08em;font-family:inherit">EMERGENCY CONTACT</button>
  <button style="background:#6BA43A;color:#fff;border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:13px;font-family:inherit">Ask your smart sensors</button>
</div>
<div style="display:flex;gap:12px;margin-top:12px;align-items:center">
  <a style="color:#0095C8;font-weight:600;font-size:14px">Download the report →</a>
  <span style="color:#B4BCC6">·</span>
  <button disabled style="background:#EEF0F2;color:#B4BCC6;border:none;border-radius:999px;padding:10px 20px;font-weight:700;font-size:14px;font-family:inherit">Disabled</button>
</div>
</div></body></html>
